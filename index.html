// Collapses a cash_reconciliation object into per-category subtotals — the
// same 4 numbers whether they're shown as compact-card tiles or as accordion
// section headers, so the two views can never drift out of sync. Each is
// signed (not a fixed in/out bucket) so a category can land on either side
// depending on what actually happened this period (e.g. Borrowings goes rust
// in a quarter where repayments outpaced new drawdowns).
// Identity: cashflow + capex + borrowings + owner + other + residual = delta_cash.
// Custom "+ Add item" adjustments carry a section tag (defaulting to 'other'
// for older items saved before sections existed) so each one folds into the
// category it was actually added under, not always the generic Other bucket.
function adjustmentsFor(r, section) {
  return (r.adjustments || []).filter((a) => (a.section || 'other') === section);
}
function sumAdjustmentsFor(r, section) {
  return adjustmentsFor(r, section).reduce((sum, a) => sum + (Number(a.amount) || 0), 0);
}
function buildCashTiles(r) {
  const interestPaid = (r.interest_applicable && r.interest_paid) ? r.interest_paid : 0;
  return {
    cashflow: r.operating_cf,
    capex: (r.capex != null ? -r.capex : 0) + sumAdjustmentsFor(r, 'capex'),
    borrowings: (r.delta_debt || 0) - interestPaid + sumAdjustmentsFor(r, 'borrowings'),
    owner: (r.delta_director_loan || 0) + (r.funds_introduced || 0) - (r.owner_drawings || 0) + sumAdjustmentsFor(r, 'owner'),
    other: sumAdjustmentsFor(r, 'other'),
  };
}

// item(): a single breakdown line inside an accordion section — icon, label,
// and either a plain (read-only, computed) amount or a live input. Every id
// used by the JS wiring below is preserved exactly across redesigns — only
// the markup/classes have changed.
function renderCashReconciliationBlock(kpi) {
  const r = kpi.cash_reconciliation;
  if (!r) return '';
  const tiles = buildCashTiles(r);
  const item = (icon, label, sub, amountHtml) => `
    <div class="cash-item">
      <span class="cash-item-icon">${icon}</span>
      <span class="cash-item-label">${label}${sub ? `<span class="sub">${sub}</span>` : ''}</span>
      ${amountHtml}
    </div>
  `;
  const readonly = (value) => `<span class="cash-item-amount readonly ${value < 0 ? 'neg' : ''}">${value == null ? '—' : formatMoney(value)}</span>`;
  const editable = (id, value, placeholder, jumpField) => `<input type="number" step="0.01" id="recon-${id}" value="${value ?? ''}" placeholder="${placeholder ?? '0'}" class="cash-item-input" />${jumpField ? jumpLink(jumpField) : ''}`;
  const section = (key, icon, label, subtotal, bodyHtml) => `
    <div class="cash-accordion-section">
      <button type="button" class="cash-accordion-head" data-accordion-toggle="${key}">
        <span class="cash-accordion-head-label">${icon} ${label}</span>
        <span class="cash-accordion-head-value ${subtotal < 0 ? 'neg' : ''}" id="recon-sub-${key}">${formatMoney(subtotal)} <span class="chevron">▾</span></span>
      </button>
      <div class="cash-accordion-body" id="recon-body-${key}" style="display:none;">${bodyHtml}</div>
    </div>
  `;
  // Every section gets its own "+ Add item" — a custom line the built-in
  // fields don't cover, tagged to that section so it folds into that
  // section's own subtotal (see buildCashTiles) rather than always landing
  // in a generic Other bucket.
  const addItemBlock = (sec) => `
    <div id="recon-adjustments-list-${sec}">${adjustmentsFor(r, sec).map((a) => renderReconAdjustmentRow(a, sec)).join('')}</div>
    <button type="button" class="mini-link cash-adj-add-row" data-adj-add="${sec}">+ Add item</button>
  `;
  return `
    <div class="kpi-ocf-adjust">
      <button class="mini-link" id="recon-toggle" type="button">Where did the cash go?</button>
      <div class="ocf-adjust-panel" id="recon-panel" style="display:none;">
        <div class="cash-breakdown">
          ${renderCashBalanceAdjustBlock(r)}
          ${renderOcfAdjustBlock(kpi)}

          ${section('capex', '🏗️', 'Capex', tiles.capex, `
            ${item('🏗️', 'Equipment/assets (capex)', r.capex_is_estimate ? 'estimated from fixed assets + depreciation — type to override' : null, editable('equipment_purchases', r.equipment_purchases, r.capex_estimate != null ? `est. ${formatMoney(r.capex_estimate)}` : '0', r.capex_is_estimate ? 'fixed_assets' : 'equipment_purchases'))}
            ${addItemBlock('capex')}
          `)}

          ${section('borrowings', '🏦', 'Borrowings', tiles.borrowings, `
            ${renderDebtAdjustBlock(r)}
            ${item('↳', 'Loan repayments', null, editable('loan_repayments', r.loan_repayments, null, 'loan_repayments'))}
            ${item('↳', 'New borrowing', 'derived', `<span class="cash-item-amount readonly" id="recon-new-borrowing">${r.delta_debt == null ? '—' : formatMoney((r.delta_debt || 0) + (r.loan_repayments || 0))}</span>`)}
            ${r.interest_applicable ? item('％', 'Interest paid', 'excluded from operating CF above', readonly(r.interest_paid)) : ''}
            ${addItemBlock('borrowings')}
          `)}

          ${section('owner', '👤', 'Owner', tiles.owner, `
            ${item('👤', 'Director/shareholder loan balance', 'closing balance for this period', editable('director_loan_balance', r.director_loan_balance, null, 'director_loan_balance'))}
            ${item('↳', 'movement this period', r.director_loan_balance_prior != null ? `vs ${formatMoney(r.director_loan_balance_prior)} prior` : null, `<span class="cash-item-amount readonly" id="recon-director-loan-movement">${r.delta_director_loan == null ? '—' : formatMoney(r.delta_director_loan)}</span>${(r.director_loan_balance_prior != null && r.prior_period_end) ? jumpLink('director_loan_balance', r.prior_period_end) : ''}`)}
            ${item('＋', 'Funds introduced', null, editable('funds_introduced', r.funds_introduced, null, 'funds_introduced'))}
            ${item('－', 'Owner drawings', null, editable('owner_drawings', r.owner_drawings, null, 'owner_drawings'))}
            ${addItemBlock('owner')}
          `)}

          ${section('other', '📝', 'Other', tiles.other, addItemBlock('other'))}

          <div class="cash-residual-box ${r.residual < 0 ? 'neg' : ''}" id="recon-residual-box">
            <span class="cash-residual-label">Still unexplained</span>
            <span class="cash-residual-value" id="recon-residual-value">${formatMoney(r.residual)}</span>
          </div>
          <p class="kpi-note" id="recon-equation">${formatMoney(r.delta_cash - r.residual)} net + ${formatMoney(r.residual)} unexplained = ${formatMoney(r.delta_cash)} actual change in cash</p>
          <p class="kpi-note" id="recon-note">${r.has_financing_data
            ? 'Add an item above if you know what the remainder is.'
            : 'Fill in the figures above (from bank/loan statements) to explain this period’s cash movement.'}</p>
          <button class="action secondary" id="recon-save-btn" type="button">Save these figures</button>
          <div class="save-msg" id="recon-save-msg"></div>
        </div>
      </div>
    </div>
  `;
}

// Collapses a cash_reconciliation object into two totals — "cash in" and
// "cash out" — for the at-a-glance card, rather than the line-by-line ledger
// the detailed panel shows. net should equal delta_cash exactly when nothing
// is missing; when a residual exists (fields not entered), in+out under-
// explains the actual change, and the glance card says so rather than
// silently presenting a total that doesn't foot to the real cash movement.
function cashInOut(r) {
  if (!r) return null;
  let cashIn = 0, cashOut = 0;
  const add = (v) => { if (v == null) return; if (v >= 0) cashIn += v; else cashOut += -v; };
  add(r.operating_cf);
  if (r.capex) cashOut += r.capex;
  add(r.delta_debt);
  if (r.interest_applicable && r.interest_paid) cashOut += r.interest_paid;
  add(r.delta_director_loan);
  if (r.funds_introduced) cashIn += r.funds_introduced;
  if (r.owner_drawings) cashOut += r.owner_drawings;
  (r.adjustments || []).forEach((a) => add(Number(a.amount) || 0));
  return { cashIn, cashOut, net: cashIn - cashOut, delta_cash: r.delta_cash };
}

// Plain-English, entirely template-driven (no AI) — every number here is
// already computed, so this is just picking which clauses are worth saying
// out loud and skipping the ones that are zero/not entered.
function cashStorySentence(r) {
  if (!r) return null;
  const parts = [];
  if (r.operating_cf != null) parts.push(r.operating_cf >= 0 ? `generated ${formatMoney(r.operating_cf)} from operations` : `used ${formatMoney(Math.abs(r.operating_cf))} in operations`);
  if (r.capex) parts.push(`spent ${formatMoney(r.capex)} on equipment/assets`);
  if (r.delta_debt) parts.push(r.delta_debt > 0 ? `borrowed ${formatMoney(r.delta_debt)}` : `paid down ${formatMoney(Math.abs(r.delta_debt))} of debt`);
  if (r.interest_applicable && r.interest_paid) parts.push(`paid ${formatMoney(r.interest_paid)} in interest`);
  if (r.delta_director_loan) parts.push(r.delta_director_loan > 0 ? `the director lent ${formatMoney(r.delta_director_loan)} to the business` : `repaid ${formatMoney(Math.abs(r.delta_director_loan))} to the director`);
  if (r.funds_introduced) parts.push(`the owner put in ${formatMoney(r.funds_introduced)}`);
  if (r.owner_drawings) parts.push(`the owner drew ${formatMoney(r.owner_drawings)}`);
  (r.adjustments || []).forEach((a) => { const amt = Number(a.amount) || 0; if (amt) parts.push(`${(a.label || 'an item').toLowerCase()} ${amt > 0 ? '+' : '−'}${formatMoney(Math.abs(amt))}`); });
  if (!parts.length) return null;
  const tail = r.delta_cash > 0 ? `cash grew by ${formatMoney(r.delta_cash)}.` : r.delta_cash < 0 ? `cash fell by ${formatMoney(Math.abs(r.delta_cash))}.` : `cash was flat.`;
  return 'This period: ' + parts.join(', ') + ' — ' + tail;
}

// Synthetic KPI object (not a real kpi_library row) purely so this card can
// reuse renderKpiTargetBlock/addKpiTargetGoal/editKpiTargetGoal exactly as
// they already work for real KPIs — 'money' format (see formatKpi/formatDiff)
// rather than percent/days/ratio, since the target here is a dollar figure.
// Targets the ACTUAL cash movement (delta_cash), not just the explained
// portion — same reasoning as the headline number below.
function buildCashNetMovementKpi(cur) {
  return { key: 'cash_net_movement', name: 'Where the cash went', format: 'money', category: 'cash', value: cur.delta_cash, priorValue: null };
}

function renderCashFlowGlanceCard(kpi) {
  const r = kpi.cash_reconciliation;
  const cur = cashInOut(r);
  if (!cur) return '';
  const prior = cashInOut(kpi.prior_cash_reconciliation);
  const story = cashStorySentence(r);
  // "Net this period" is the ACTUAL change in the bank balance (delta_cash),
  // not the sum of the tiles below — those only cover what's been entered,
  // so summing them and calling it "net" would silently disagree with the
  // real cash movement whenever anything is missing. The Unexplained badge
  // in the header is what accounts for the gap between the two.
  const tip = cur.delta_cash >= 0
    ? 'Building cash with no clear use? Consider accelerating debt repayment, reinvesting in the business, or setting a cash reserve target.'
    : 'Cash is being drawn down — check whether debt repayments, capex, or drawings outpaced what the business generated this period.';

  let trendLine = '<p class="cash-prior-compare muted plain">No prior period on file</p>';
  if (prior) {
    const diff = cur.delta_cash - prior.delta_cash;
    trendLine = Math.abs(diff) < 1
      ? `<p class="cash-prior-compare"><span class="trend-flat">— no change</span> vs last period (${formatMoney(prior.delta_cash)})</p>`
      : `<p class="cash-prior-compare"><span class="${diff > 0 ? 'trend-up' : 'trend-down'}">${diff > 0 ? '↑' : '↓'} ${formatMoney(Math.abs(diff))}</span> vs last period (${formatMoney(prior.delta_cash)})</p>`;
  }

  // Tiles double as shortcuts into the matching accordion section below (see
  // data-tile-jump wiring) — "cashflow" has no section of its own (operating
  // cash flow is a plain fact at the top of the panel, not editable), so it
  // just opens the panel without expanding anything. "Other" only shows up
  // here when it actually has something in it, to avoid an always-empty tile.
  const tiles = buildCashTiles(r);
  const tile = ([key, icon, label, value]) => `
    <button type="button" class="cash-tile" data-tile-jump="${key}">
      <p class="cash-tile-label">${icon} ${label}</p>
      <p class="cash-tile-value ${value < 0 ? 'neg' : ''}">${formatMoney(value)}</p>
    </button>
  `;
  const tileDefs = [
    ['cashflow', '⚙️', 'Cash flow', tiles.cashflow],
    ['capex', '🏗️', 'Capex', tiles.capex],
    ['borrowings', '🏦', 'Borrowings', tiles.borrowings],
    ['owner', '👤', 'Owner', tiles.owner],
  ];
  if (Math.abs(tiles.other) > 0.5) tileDefs.push(['other', '📝', 'Other', tiles.other]);
  // Money in on the left, money out on the right — sorted by each tile's own
  // sign rather than a fixed position, so a quarter where Borrowings went
  // negative (repaid more than drawn) shows it on the right like any other
  // outflow. Nil/not-entered (exactly 0) defaults to the right rather than
  // the left — "nothing recorded" isn't a genuine inflow, so it shouldn't
  // read as one just because 0 isn't technically negative.
  const tileHtml = `
    <div class="cash-tile-col">${tileDefs.filter((t) => t[3] > 0).map(tile).join('')}</div>
    <div class="cash-tile-col">${tileDefs.filter((t) => t[3] <= 0).map(tile).join('')}</div>
  `;

  return `
    <div class="kpi-card">
      <div class="kpi-card-head">
        <p class="kpi-name">Where the cash went</p>
      </div>
      <div class="cash-net-headline">
        <button type="button" class="cash-net-stat" data-tile-jump="cashflow" title="Net this period">
          <p class="cash-net-value cash-net-primary ${cur.delta_cash < 0 ? 'neg' : ''}" id="cash-net-headline-value">${formatMoney(cur.delta_cash)}</p>
          <span class="cash-net-stat-label">net this period</span>
        </button>
        <button type="button" class="cash-net-stat" data-tile-jump="unexplained" title="Still unexplained">
          <p class="cash-net-value ${r.residual < 0 ? 'neg' : ''}" id="cash-tile-unexplained">${formatMoney(r.residual)}</p>
          <span class="cash-net-stat-label">unexplained</span>
        </button>
      </div>
      ${trendLine}
      <div class="cash-tile-grid">${tileHtml}</div>
      ${story ? `<p class="kpi-cash-story">${story}</p>` : ''}
      <p class="kpi-tip">🔧 ${tip}</p>
      ${renderCashReconciliationBlock(kpi)}
      ${renderKpiTargetBlock(buildCashNetMovementKpi(cur))}
    </div>
  `;
}

// Same shape as Tax outlook (Financial Performance -> Analyse -> Cash) —
// same four-level scenario buildup (net profit direct > net profit change >
// GP change > revenue change, opex change layered on top, see
// projectProfitScenario), same collapsed "Adjust assumptions" panel, same
// provenance/buildup pattern — just one step further: apply the client's OWN
// historical operating cash conversion rate (already computed, not invented
// — see op_cash_conversion) to turn projected profit into projected
// operating cash flow. Deliberately doesn't try to model capex, debt
// draws/repayments, owner drawings, or tax payment timing — those are lumpy,
// judgment-heavy, and exactly the kind of stacked-assumption forecast this
// app has stayed away from all session. This is one clean extension of a
// number the app already trusts, not a full cash flow projection.
let cashOutlookState = { unit: 'pct', revenue: 0, gp: 0, opex: 0, netProfit: 0, netProfitAbsolute: '' };
function computeCashOutlookResult(snapshot, conversion, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute) {
  const { projectedProfit, buildup, provenance } = projectProfitScenario(snapshot, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute);
  const projectedOCF = projectedProfit * conversion;
  return {
    headline: formatMoney(projectedOCF),
    buildup: `${buildup} × <b>${(conversion * 100).toFixed(0)}%</b> cash conversion (this period's actual rate) = projected operating cash flow <b>${formatMoney(projectedOCF)}</b>`,
    provenance,
  };
}
function renderCashOutlookCard(snapshot, kpis) {
  const revenue = snapshot?.revenue;
  const netProfit = snapshot?.net_profit;
  const conversion = kpis?.find((k) => k.key === 'op_cash_conversion')?.value;
  if (!revenue || netProfit == null || conversion == null) return '';
  const selectStyle = 'padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);';
  const s = cashOutlookState;
  const row = (id, label, value) => `<div class="ocf-row"><label>${label}</label><input type="number" id="${id}" value="${value}" placeholder="0" /></div>`;
  const panelOpen = s.revenue !== 0 || s.gp !== 0 || s.opex !== 0 || s.netProfit !== 0 || s.netProfitAbsolute !== '';
  return `
    <div class="kpi-card">
      <div class="kpi-card-head"><p class="kpi-name">Cash outlook — model a scenario</p></div>
      <div style="background:var(--sage-bg); border-radius:8px; padding:8px 12px; display:inline-block;">
        <p class="kpi-value" id="cash-outlook-value" style="margin:0;">—</p>
        <p class="card-label" style="margin:2px 0 0;">Projected operating cash flow</p>
      </div>
      <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">
        <span id="cash-outlook-provenance"></span>
        <button type="button" id="cash-outlook-provenance-link" style="background:none; border:none; padding:0; margin-left:2px; color:var(--brass); font-size:11px; cursor:pointer; text-decoration:underline; font-family:inherit;">Adjust assumptions</button>
      </p>

      <div class="cash-item cash-item-clickable" id="cash-outlook-toggle">
        <span class="cash-item-icon">🧮</span>
        <span class="cash-item-label">Adjust assumptions</span>
        <span class="chevron">${panelOpen ? '▴' : '▾'}</span>
      </div>
      <div class="ocf-adjust-panel" id="cash-outlook-panel" style="display:${panelOpen ? 'block' : 'none'};">
        <div class="ocf-row"><label>Change amounts as</label><select id="cash-outlook-unit" style="${selectStyle}"><option value="pct" ${s.unit === 'pct' ? 'selected' : ''}>%</option><option value="dollar" ${s.unit === 'dollar' ? 'selected' : ''}>$</option></select></div>
        ${row('cash-outlook-revenue', 'Revenue', s.revenue)}
        ${row('cash-outlook-gp', 'Gross profit', s.gp)}
        ${row('cash-outlook-opex', 'Operating expenses', s.opex)}
        ${row('cash-outlook-netprofit', 'Net profit', s.netProfit)}
        <div class="ocf-row"><label>Or set net profit directly ($)</label><input type="number" id="cash-outlook-netprofit-absolute" value="${s.netProfitAbsolute}" placeholder="e.g. 150000" /></div>
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">Fill in the most specific level you want to model — setting net profit directly overrides everything else, Net profit change overrides Gross profit, Gross profit overrides Revenue.</p>
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;" id="cash-outlook-buildup"></p>
      </div>
      <p style="font-size:11px; color:var(--ink-soft); margin-top:8px; font-style:italic;">Rough estimate — assumes this period's cash conversion rate holds. Doesn't account for capex, debt, drawings, or tax payment timing.</p>
    </div>
  `;
}

// Companion to the Tax category's KPI card, same slot the Cash category uses
// for "Where the cash went" — a standing answer to "can they actually afford
// this period's tax bill", always visible rather than only surfacing once it
// crosses a flag threshold (see the Tax affordability risk flag in analyze.js
// for the threshold version of this same comparison). Deliberately just
// income tax vs cash on hand — no GST/PAYG/super/FBT forecasting here.
function renderTaxAffordabilityCard(snapshot) {
  const taxExpense = snapshot?.tax_expense;
  const cash = snapshot?.cash;
  if (taxExpense == null || cash == null) return '';
  let interp;
  // Same >=1 boundary the backend affordability flag treats as "danger" —
  // below it, cash alone can't cover the bill, which is worth a color, not
  // just a sentence, so it reads at a glance mid-meeting.
  let colorClass = '';
  if (taxExpense <= 0) {
    interp = 'No tax expense recorded this period.';
  } else {
    const coverage = cash / taxExpense;
    colorClass = coverage >= 1 ? 'good' : 'bad';
    if (coverage >= 2) interp = `Cash on hand comfortably covers this period's tax expense (${coverage.toFixed(1)}x).`;
    else if (coverage >= 1) interp = `Cash on hand covers this period's tax expense (${coverage.toFixed(1)}x) — worth setting it aside before it's spent elsewhere.`;
    else if (coverage >= 0.5) interp = `Cash on hand covers about ${Math.round(coverage * 100)}% of this period's tax expense — worth planning for the shortfall.`;
    else interp = `Cash on hand covers only ${Math.round(coverage * 100)}% of this period's tax expense — funding this may be a stretch.`;
  }
  return `
    <div class="kpi-card">
      <div class="kpi-card-head"><p class="kpi-name">Tax vs cash on hand</p></div>
      <div style="display:flex; gap:20px; margin:4px 0 2px; flex-wrap:wrap;">
        <div><p class="kpi-value ${colorClass}">${formatMoney(taxExpense)}</p><p class="card-label" style="margin:0;">Tax expense</p></div>
        <div><p class="kpi-value">${formatMoney(cash)}</p><p class="card-label" style="margin:0;">Cash on hand</p></div>
      </div>
      <p class="kpi-interp">${interp}</p>
    </div>
  `;
}

// Narrow, deliberately scoped version of "what's coming, if things grow" —
// projects revenue by a simple growth %, applies THIS period's own margin to
// get a projected profit, then estimates tax off that. Company is a flat
// rate so it's safe to estimate with zero owner-level data. Individual
// (sole trader) uses the FY2026-27 resident marginal brackets + a flat 2%
// Medicare levy — a real simplification (ignores LITO, the levy's low-income
// phase-in, and that brackets/rates change every year), which is exactly why
// this is labeled a rough estimate, not advice, everywhere it's shown.
// Partnership/Trust are deliberately NOT estimated: those are flow-through
// structures where the real tax depends on each partner's/beneficiary's own
// marginal rate and distribution split — data this app doesn't capture at
// all — so guessing a number there would be worse than showing nothing.
// Targets FY2026-27 — bracket2Rate is 15%, not 16%, reflecting the
// legislated cut to the lowest marginal rate from 1 July 2026 (2025 Federal
// Budget). Every OTHER figure here (thresholds, Medicare levy, super cap)
// is carried over unchanged from 2024-25, the last year this app has fully
// confirmed — those typically get indexed a little most years and haven't
// been verified for FY2026-27, so treat them as a starting point to check
// against the ATO, not a guarantee. Rates/thresholds/caps get reset almost
// every year (and future years, e.g. modeling 2029, genuinely AREN'T
// legislated yet — no lookup table could have the right answer), so rather
// than hardcoding a handful of years and guessing at the rest, this whole
// table lives in one editable, session-persisted object. The Tax outlook
// card shows the financial year detected from the period being analyzed
// purely as context ("you're looking at FY2026-27") — the adviser types in
// the real numbers for whatever year actually applies, rather than the app
// pretending to know them.
const DEFAULT_TAX_RATES = {
  taxFreeThreshold: 18200, bracket2Upper: 45000, bracket2Rate: 15, bracket3Upper: 135000, bracket3Rate: 30,
  bracket4Upper: 190000, bracket4Rate: 37, bracket5Rate: 45, medicareRate: 2, medicareThreshold: 24276,
  companyRate: 25, superCap: 30000,
};
let taxRatesState = { ...DEFAULT_TAX_RATES };

function estimateIndividualTax(income) {
  if (income <= 0) return 0;
  const r = taxRatesState;
  const bands = [[r.taxFreeThreshold, 0], [r.bracket2Upper, r.bracket2Rate], [r.bracket3Upper, r.bracket3Rate], [r.bracket4Upper, r.bracket4Rate], [Infinity, r.bracket5Rate]];
  let tax = 0, lower = 0;
  for (const [upper, ratePct] of bands) {
    if (income <= lower) break;
    tax += (Math.min(income, upper) - lower) * (ratePct / 100);
    lower = upper;
  }
  const medicareLevy = income > r.medicareThreshold ? income * (r.medicareRate / 100) : 0;
  return tax + medicareLevy;
}

// Which bracket income's TOP dollar falls in — "which bracket are they
// roughly in" answers the marginal rate on the next dollar earned, not an
// average, which is what makes e.g. the 4-way even split's $0 result
// actually explainable (each share sits under the tax-free threshold) rather
// than just a number with no story behind it. Reads the same editable table.
function individualTaxBracket(income) {
  const r = taxRatesState;
  if (income <= 0) return 'no income';
  if (income <= r.taxFreeThreshold) return 'under the tax-free threshold';
  if (income <= r.bracket2Upper) return `${r.bracket2Rate}% bracket`;
  if (income <= r.bracket3Upper) return `${r.bracket3Rate}% bracket`;
  if (income <= r.bracket4Upper) return `${r.bracket4Rate}% bracket`;
  return `${r.bracket5Rate}% bracket`;
}

function estimateCompanyTax(income) {
  return income > 0 ? income * (taxRatesState.companyRate / 100) : 0; // base rate entity assumption (small/medium co.)
}

// Australian FY runs 1 July - 30 June — a period ending in Jan-Jun belongs to
// the FY that started the PREVIOUS calendar year (30 June 2027 -> FY2026-27),
// Jul-Dec belongs to the FY starting that same year.
function auFinancialYearLabel(periodEnd) {
  if (!periodEnd) return null;
  const d = new Date(periodEnd);
  if (isNaN(d)) return null;
  const month = d.getMonth() + 1;
  const startYear = month >= 7 ? d.getFullYear() : d.getFullYear() - 1;
  return `FY${startYear}-${String(startYear + 1).slice(-2)}`;
}

// Shared by Tax outlook and Cash outlook (both "model a scenario" cards) —
// same four-level buildup: net profit set directly overrides everything,
// else net profit change, else GP change (opex layered on top either way),
// else revenue change at this period's own GP margin as the fallback. One
// function so the two cards can never drift into computing "projected
// profit" two different ways.
function projectProfitScenario(snapshot, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute) {
  const revenue = snapshot.revenue;
  const netProfit = snapshot.net_profit;
  const baselineGP = snapshot.cogs != null ? revenue - snapshot.cogs : null;
  const baselineOpex = baselineGP != null ? baselineGP - netProfit : revenue - netProfit;
  const delta = (val, baseline) => unit === 'dollar' ? val : baseline * (val / 100);

  // Nothing on the card itself hints that the headline is derived from this
  // period's actual figures until you open the (collapsed) assumptions panel
  // — this caption says so up front, and switches to a plain "you're
  // modeling a scenario" flag once anything's been changed, so the source
  // of the number is never a mystery at a glance.
  const isBaseline = (netProfitAbsolute === '' || netProfitAbsolute == null) && !netProfitChange && !gpChange && !revenueChange && !opexChange;
  const provenance = isBaseline
    ? `Based on this period's actual net profit (${formatMoney(netProfit)}).`
    : `Modeling a scenario, not this period's actual figures.`;

  let projectedProfit, buildup;
  if (netProfitAbsolute !== '' && netProfitAbsolute != null) {
    // Highest priority — this is "I already know the number", so it skips
    // every other field entirely, including the Net profit CHANGE field
    // below (which is for "I know how much it'll move", a different mental
    // model of the same end goal).
    projectedProfit = Number(netProfitAbsolute);
    buildup = `Net profit set directly at <b>${formatMoney(projectedProfit)}</b>`;
  } else if (netProfitChange) {
    projectedProfit = netProfit + delta(netProfitChange, netProfit);
    buildup = `Net profit ${formatMoney(netProfit)} → projected profit <b>${formatMoney(projectedProfit)}</b>`;
  } else if (gpChange && baselineGP != null) {
    const projectedGP = baselineGP + delta(gpChange, baselineGP);
    const projectedOpex = baselineOpex + delta(opexChange, baselineOpex);
    projectedProfit = projectedGP - projectedOpex;
    buildup = `Gross profit <b>${formatMoney(projectedGP)}</b> − operating expenses <b>${formatMoney(projectedOpex)}</b> = projected profit <b>${formatMoney(projectedProfit)}</b>`;
  } else {
    const projectedRevenue = revenue + delta(revenueChange, revenue);
    const gpMargin = baselineGP != null ? baselineGP / revenue : null;
    const projectedGP = gpMargin != null ? projectedRevenue * gpMargin : projectedRevenue; // no cogs recorded — treat revenue as GP; baselineOpex already covers ALL costs in this case
    const projectedOpex = baselineOpex + delta(opexChange, baselineOpex);
    projectedProfit = projectedGP - projectedOpex;
    buildup = `Revenue <b>${formatMoney(projectedRevenue)}</b> → gross profit <b>${formatMoney(projectedGP)}</b> − operating expenses <b>${formatMoney(projectedOpex)}</b> = projected profit <b>${formatMoney(projectedProfit)}</b>`;
  }
  return { projectedProfit, buildup, isBaseline, provenance };
}

function computeTaxOutlookResult(snapshot, cash, entityType, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute, superContribution, equipmentPurchase, compareEntity, compareShares, compareOtherIncome) {
  let { projectedProfit, buildup, provenance } = projectProfitScenario(snapshot, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute);

  // Super contribution and equipment purchase both work the same way here —
  // a deduction against taxable profit — even though the real-world
  // mechanics differ (super is capped and might be a business expense or a
  // personal deduction depending on who's contributing; equipment assumes
  // full instant write-off, which has its own eligibility rules). Deliberately
  // not modeling those rules — just showing the mechanical tax effect of "if
  // this much comes off taxable profit", with a cap warning as the one
  // real constraint worth surfacing without pretending to know the rest.
  const deductions = (superContribution || 0) + (equipmentPurchase || 0);
  let deductionNote = '';
  if (deductions > 0) {
    const taxableProfit = projectedProfit - deductions;
    buildup += ` − super/equipment <b>${formatMoney(deductions)}</b> = taxable profit <b>${formatMoney(taxableProfit)}</b>`;
    projectedProfit = taxableProfit;
    if (superContribution > taxRatesState.superCap) {
      deductionNote = `Note: $${superContribution.toLocaleString('en-AU')} super exceeds the ${formatMoney(taxRatesState.superCap)} concessional cap set below — anything over that isn't deductible and may attract extra tax.`;
    }
  }

  let tax = null;
  let headline, headlineLabel;
  if (entityType === 'Company') {
    tax = estimateCompanyTax(projectedProfit);
    headline = formatMoney(tax);
    headlineLabel = 'Estimated tax — company, 25% base rate';
  } else if (entityType === 'Sole trader') {
    tax = estimateIndividualTax(projectedProfit);
    headline = formatMoney(tax);
    headlineLabel = `Estimated tax — individual marginal rates + Medicare levy (${individualTaxBracket(projectedProfit)})`;
  } else if (entityType === 'Partnership' || entityType === 'Trust') {
    const who = entityType === 'Trust' ? 'beneficiary' : 'partner';
    headline = '—';
    headlineLabel = `Tax depends on each ${who}'s own marginal rate and distribution split — not estimated here.`;
  } else {
    headline = '—';
    headlineLabel = 'Set an entity structure on Goals → Profile to estimate tax here.';
  }

  // Partnership/Trust can't be estimated for the CLIENT'S ACTUAL structure
  // (see the branch above) because guessing their real split/other-income
  // would misrepresent their actual position. A COMPARISON is different —
  // the adviser is explicitly told to supply the assumption (a % share per
  // partner/beneficiary, each with their own other income) rather than the
  // app guessing it, so it's an informed hypothetical, not a claim about
  // reality. Sole trader runs through the exact same per-person mechanism
  // as Partnership/Trust — it's just the N=1 case (fixed 100% share) — so
  // "other income" works identically everywhere instead of being a special
  // case that only some entity types support.
  let compareText = '';
  let bracketDetail = '';
  if (compareEntity && compareEntity !== entityType) {
    // "Effective rate" here is TOTAL TAX ÷ INCOME for that person — the
    // average rate their business share works out to once combined with
    // whatever else they earn — NOT their marginal bracket rate on the next
    // dollar (which is usually higher). Labeled that way explicitly in the
    // column header below so it's never read as the marginal rate.
    let personRows = [];
    if (compareEntity === 'Company') {
      const t = estimateCompanyTax(projectedProfit);
      personRows = [{ label: 'Company', share: 100, amt: projectedProfit, tax: t, rate: 25, context: 'flat company rate' }];
    } else if (compareEntity === 'Sole trader' || compareEntity === 'Partnership' || compareEntity === 'Trust') {
      const isSolo = compareEntity === 'Sole trader';
      const rawShares = isSolo ? [100] : (compareShares || [50, 50]).map(Number);
      const rawOtherIncome = compareOtherIncome || [];
      const validIdx = rawShares.map((v, i) => (!isNaN(v) && v > 0 ? i : -1)).filter((i) => i >= 0);
      const shares = validIdx.length ? validIdx.map((i) => rawShares[i]) : [100];
      const otherIncomes = validIdx.length ? validIdx.map((i) => Number(rawOtherIncome[i]) || 0) : [0];
      const sum = shares.reduce((a, b) => a + b, 0);
      const who = compareEntity === 'Trust' ? 'Beneficiary' : (isSolo ? 'Sole trader' : 'Partner');
      personRows = shares.map((s, i) => {
        const amt = projectedProfit * (s / sum);
        const other = otherIncomes[i];
        const t = other > 0 ? estimateIndividualTax(amt + other) - estimateIndividualTax(other) : estimateIndividualTax(amt);
        const rate = amt > 0 ? (t / amt * 100) : 0;
        const context = other > 0 ? `combined with ${formatMoney(other)} other income` : 'no other income assumed';
        return { label: isSolo ? who : `${who} ${i + 1}`, share: Math.round(s / sum * 100), amt, tax: t, rate, context };
      });
    }
    if (personRows.length) {
      const altTax = personRows.reduce((sum, r) => sum + r.tax, 0);
      const existingLabel = entityType || 'not set';
      const existingRow = `<div class="ocf-row" style="font-weight:600;"><label>Existing (${existingLabel})</label><span>${tax != null ? formatMoney(tax) : '—'}</span></div>`;
      const header = `<div style="display:flex; gap:8px; font-size:10px; color:var(--ink-soft); margin:6px 0 2px;"><span style="flex:2;">Who</span><span style="width:50px;">Share</span><span style="width:70px;">Eff. rate</span><span style="width:70px;">Tax on share</span></div>`;
      const personHtml = personRows.map((r, i) => `
        <div style="display:flex; gap:8px; font-size:12px; align-items:baseline;">
          <span style="flex:2;">${i + 1}. ${r.label}</span>
          <span style="width:50px;">${r.share}%</span>
          <span style="width:70px;">${r.rate.toFixed(0)}%</span>
          <span style="width:70px;">${formatMoney(r.tax)}</span>
        </div>
        <div style="font-size:10px; color:var(--ink-soft); margin:0 0 4px;">${formatMoney(r.amt)} — ${r.context}</div>
      `).join('');
      const diff = tax != null ? altTax - tax : null;
      const totalRow = `<div class="ocf-row" style="font-weight:600; border-top:1px solid var(--line); margin-top:4px; padding-top:4px;"><label>Total (${compareEntity.toLowerCase()})</label><span>${formatMoney(altTax)}${diff != null ? ` <span style="font-weight:400; color:var(--ink-soft);">(${diff >= 0 ? '+' : '−'}${formatMoney(Math.abs(diff))} vs existing)</span>` : ''}</span></div>`;
      const scopeNote = `<p style="font-size:10px; color:var(--ink-soft); font-style:italic; margin:4px 0 0;">"Tax on share" is only the tax this business distribution adds — not each person's whole personal tax bill (which would also include tax on their other income by itself).</p>`;
      bracketDetail = existingRow + header + personHtml + totalRow + scopeNote;
    }
  }

  let cashText = '', cashClass = '';
  if (tax != null && tax > 0 && cash != null) {
    const coverage = cash / tax;
    cashClass = coverage >= 1 ? 'good' : 'bad';
    cashText = coverage >= 2 ? `Today's cash (${formatMoney(cash)}) would comfortably cover this (${coverage.toFixed(1)}x).`
      : coverage >= 1 ? `Today's cash (${formatMoney(cash)}) would cover this (${coverage.toFixed(1)}x) — worth starting to set aside now.`
      : coverage >= 0.5 ? `Today's cash (${formatMoney(cash)}) covers about ${Math.round(coverage * 100)}% of this — worth planning ahead for the gap.`
      : `Today's cash (${formatMoney(cash)}) covers only ${Math.round(coverage * 100)}% of this — a growth scenario worth funding for in advance.`;
  }

  return { headline, headlineLabel, cashText, cashClass, buildup, provenance, deductionNote, compareText, bracketDetail };
}

// Headline (estimated tax) is what the card is FOR, so it sits up top in
// the same .kpi-value treatment every other card uses — everything that
// gets there (unit, four change fields, the buildup line) is secondary and
// collapses behind a chevron, same click-to-expand shape as the OCF/cash
// reconciliation rows above (.cash-item-clickable + .ocf-row), rather than
// sitting open by default and dominating the card.
function renderTaxOutlookCard(snapshot, ctx) {
  const revenue = snapshot?.revenue;
  const netProfit = snapshot?.net_profit;
  if (!revenue || netProfit == null) return '';
  const selectStyle = 'padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);';
  const s = taxOutlookState;
  const rs = taxRatesState;
  const detectedFY = auFinancialYearLabel(currentPeriodEnd);
  // "not yet legislated" only made sense while nothing had been touched —
  // once the adviser has actually typed in a year's figures, the label
  // should reflect THAT, not keep pointing back at the default year like
  // nothing changed.
  const usingDefaultRates = JSON.stringify(rs) === JSON.stringify(DEFAULT_TAX_RATES);
  const rateStatusLabel = usingDefaultRates
    ? 'Defaults to FY2026-27 — edit below for a different year'
    : 'Using custom rates you’ve entered — not the FY2026-27 defaults';
  const row = (id, label, value) => `<div class="ocf-row"><label>${label}</label><input type="number" id="${id}" value="${value}" placeholder="0" /></div>`;
  // Re-open the panel on re-render if there's something non-default in it —
  // otherwise the values would be retained but invisible, which reads just
  // as "it forgot" from the adviser's side even though nothing was lost.
  const panelOpen = s.revenue !== 0 || s.gp !== 0 || s.opex !== 0 || s.netProfit !== 0 || s.netProfitAbsolute !== '' || s.super !== 0 || s.equipment !== 0 || s.compareEntity !== '';
  return `
    <div class="kpi-card">
      <div class="kpi-card-head"><p class="kpi-name">Tax outlook — model a scenario</p></div>
      <div style="background:var(--sage-bg); border-radius:8px; padding:8px 12px; display:inline-block;">
        <p class="kpi-value" id="tax-outlook-tax-value" style="margin:0;">—</p>
        <p class="card-label" id="tax-outlook-tax-label" style="margin:2px 0 0;"></p>
      </div>
      <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">
        <span id="tax-outlook-provenance"></span>
        <button type="button" id="tax-outlook-provenance-link" style="background:none; border:none; padding:0; margin-left:2px; color:var(--brass); font-size:11px; cursor:pointer; text-decoration:underline; font-family:inherit;">Adjust assumptions</button>
      </p>
      <p class="kpi-interp" id="tax-outlook-cash-line" style="margin:6px 0 0;"></p>

      <div class="cash-item cash-item-clickable" id="tax-outlook-toggle">
        <span class="cash-item-icon">🧮</span>
        <span class="cash-item-label">Adjust assumptions</span>
        <span class="chevron">${panelOpen ? '▴' : '▾'}</span>
      </div>
      <div class="ocf-adjust-panel" id="tax-outlook-panel" style="display:${panelOpen ? 'block' : 'none'};">
        <div class="ocf-row"><label>Change amounts as</label><select id="tax-outlook-unit" style="${selectStyle}"><option value="pct" ${s.unit === 'pct' ? 'selected' : ''}>%</option><option value="dollar" ${s.unit === 'dollar' ? 'selected' : ''}>$</option></select></div>
        ${row('tax-outlook-revenue', 'Revenue', s.revenue)}
        ${row('tax-outlook-gp', 'Gross profit', s.gp)}
        ${row('tax-outlook-opex', 'Operating expenses', s.opex)}
        ${row('tax-outlook-netprofit', 'Net profit', s.netProfit)}
        <div class="ocf-row"><label>Or set net profit directly ($)</label><input type="number" id="tax-outlook-netprofit-absolute" value="${s.netProfitAbsolute}" placeholder="e.g. 150000" /></div>
        <p style="font-size:11px; color:var(--ink-soft); margin:10px 0 4px;">Deductions &amp; structure</p>
        <div class="ocf-row"><label>Super contribution ($)</label><input type="number" id="tax-outlook-super" value="${s.super}" placeholder="0" /></div>
        <div class="ocf-row"><label>Equipment purchase ($)</label><input type="number" id="tax-outlook-equipment" value="${s.equipment}" placeholder="0" /></div>
        <div class="ocf-row"><label>Compare structure as</label><select id="tax-outlook-compare-entity" style="${selectStyle}"><option value="">—</option><option value="Company" ${s.compareEntity === 'Company' ? 'selected' : ''}>Company</option><option value="Sole trader" ${s.compareEntity === 'Sole trader' ? 'selected' : ''}>Sole trader</option><option value="Partnership" ${s.compareEntity === 'Partnership' ? 'selected' : ''}>Partnership</option><option value="Trust" ${s.compareEntity === 'Trust' ? 'selected' : ''}>Trust</option></select></div>
        <div style="margin:4px 0 0;">
          <p style="font-size:11px; color:var(--ink-soft); margin:0 0 4px;">Share % per partner/beneficiary — add their other income (job, investments) to tax the business share at their real marginal rate, stacked on top; leave blank to assume no other income</p>
          <div style="display:flex; gap:10px; font-size:10px; color:var(--ink-soft); margin:0 0 2px 20px;"><span style="width:60px;">Share %</span><span>Other income $ (optional)</span></div>
          ${[0, 1, 2, 3].map((i) => `
            <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
              <span style="font-size:11px; color:var(--ink-soft); width:14px;">${i + 1}</span>
              <input type="number" class="tax-outlook-compare-share" data-share-index="${i}" value="${s.compareShares[i] || ''}" placeholder="${i < 2 ? 50 : ''}" style="width:52px; padding:5px 6px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);" />
              <input type="number" class="tax-outlook-compare-other-income" data-income-index="${i}" value="${s.compareOtherIncome[i] || ''}" placeholder="e.g. 80000" style="width:80px; padding:5px 6px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);" />

        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">Fill in the most specific level you want to model — setting net profit directly overrides everything else, Net profit change overrides Gross profit, Gross profit overrides Revenue. Super and equipment apply on top of whichever level is active.</p>
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;" id="tax-outlook-buildup"></p>
        <p style="font-size:11px; color:var(--brass); margin:4px 0 0;" id="tax-outlook-deduction-note"></p>
        <p style="font-size:11px; color:var(--ink-soft); margin:4px 0 0;" id="tax-outlook-compare-text"></p>
        <p style="font-size:11px; color:var(--ink-soft); margin:2px 0 0;" id="tax-outlook-bracket-detail"></p>
      </div>

      <div class="cash-item cash-item-clickable" id="tax-rates-toggle">
        <span class="cash-item-icon">🗓️</span>
        <span class="cash-item-label">Tax rates used${detectedFY ? ` — period detected as ${detectedFY}` : ''} <span class="sub" id="tax-rates-status-label">${rateStatusLabel}</span></span>
        <span class="chevron">▾</span>
      </div>
      <div class="ocf-adjust-panel" id="tax-rates-panel" style="display:none;">
        <div class="ocf-row"><label>Tax-free threshold ($)</label><input type="number" id="tr-threshold" value="${rs.taxFreeThreshold}" /></div>
        <div class="ocf-row"><label>Bracket 2 — up to ($) / rate (%)</label><div style="display:flex; gap:4px;"><input type="number" id="tr-b2-upper" value="${rs.bracket2Upper}" style="width:80px;" /><input type="number" id="tr-b2-rate" value="${rs.bracket2Rate}" style="width:50px;" /></div></div>
        <div class="ocf-row"><label>Bracket 3 — up to ($) / rate (%)</label><div style="display:flex; gap:4px;"><input type="number" id="tr-b3-upper" value="${rs.bracket3Upper}" style="width:80px;" /><input type="number" id="tr-b3-rate" value="${rs.bracket3Rate}" style="width:50px;" /></div></div>
        <div class="ocf-row"><label>Bracket 4 — up to ($) / rate (%)</label><div style="display:flex; gap:4px;"><input type="number" id="tr-b4-upper" value="${rs.bracket4Upper}" style="width:80px;" /><input type="number" id="tr-b4-rate" value="${rs.bracket4Rate}" style="width:50px;" /></div></div>
        <div class="ocf-row"><label>Top bracket rate (%, above bracket 4)</label><input type="number" id="tr-b5-rate" value="${rs.bracket5Rate}" style="width:50px;" /></div>
        <div class="ocf-row"><label>Medicare levy — rate (%) / kicks in above ($)</label><div style="display:flex; gap:4px;"><input type="number" id="tr-medicare-rate" value="${rs.medicareRate}" style="width:50px;" /><input type="number" id="tr-medicare-threshold" value="${rs.medicareThreshold}" style="width:80px;" /></div></div>
        <div class="ocf-row"><label>Company tax rate (%)</label><input type="number" id="tr-company-rate" value="${rs.companyRate}" style="width:50px;" /></div>
        <div class="ocf-row"><label>Super concessional cap ($)</label><input type="number" id="tr-super-cap" value="${rs.superCap}" style="width:80px;" /></div>
        <button type="button" class="mini-link" id="tax-rates-reset" style="margin-top:4px;">Reset to FY2026-27 defaults</button>
      </div>
      <p style="font-size:11px; color:var(--ink-soft); margin-top:8px; font-style:italic;">Rough estimate only, not tax advice.</p>
    </div>
  `;
}

// Fills what used to be a lot of empty space on the Operating Cash
// Conversion card (its detailed breakdown moved to the Cash in/out card) with
// something that actually answers the question this KPI exists to ask: the
// business made $X, how much of it became real cash, and — the "so what" —
// what to do about it depending on whether that's high or low. Clicking it
// jumps straight to the Cash in/out card's own detail, since that's where
// "where did it go" actually gets answered line by line.
function renderCashConversionExplainer(kpi, snapshot) {
  const denomSum = (kpi.denominator || []).reduce((sum, f) => sum + (Number(snapshot[f]) || 0), 0);
  if (!denomSum) return '';
  const pct = kpi.value;
  const cashAmount = pct * denomSum;
  const isHigh = pct >= 0.8;
  const radius = 30;
  const circumference = 2 * Math.PI * radius;
  const filled = Math.max(0, Math.min(1, pct)) * circumference;
  const ringColor = isHigh ? 'var(--sage)' : 'var(--rust)';
  const narrative = `This period: ${formatMoney(denomSum)} profit → ${formatMoney(cashAmount)} became cash.`;
  const followUp = isHigh
    ? `Most of it reached the bank — what's the plan for it? Pay down debt, reinvest, or build a buffer.`
    : `A chunk of it hasn't reached the bank yet. Tap through to see exactly where it went.`;
  return `
    <div class="cash-conv-explainer" id="cash-conv-jump" title="See the cash breakdown">
      <svg viewBox="0 0 72 72" class="cash-conv-donut" aria-hidden="true">
        <circle cx="36" cy="36" r="${radius}" fill="none" stroke="var(--line)" stroke-width="7" />
        <circle cx="36" cy="36" r="${radius}" fill="none" stroke="${ringColor}" stroke-width="7"
          stroke-dasharray="${filled} ${circumference}" stroke-linecap="round" transform="rotate(-90 36 36)" />
        <text x="36" y="41" text-anchor="middle" class="cash-conv-donut-label">${(pct * 100).toFixed(0)}%</text>
      </svg>
      <div class="cash-conv-text">
        <p class="cash-conv-narrative">${narrative}</p>
        <p class="cash-conv-followup">${followUp}</p>
      </div>
    </div>
  `;
}

// "What has happened" (position, not just the resulting %) needs the raw
// numbers visible, not just the ratio. Styled after the "Where the cash
// went" net-this-period stats (same bold-value/small-label shape, see
// .cash-net-value/.cash-net-stat-label), just boxed — rate on the left since
// that's the thing worth discussing, dollar figure on the right for context.
// The calculation and the "why look at this" note are click-to-reveal
// (wired in renderHealthWheelBlock, #tax-position-toggle), same
// show/hide pattern as the OCF and reconciliation adjust panels — quiet
// until asked for, not competing with the numbers for attention.
function renderTaxPositionHeader(kpi, snapshot, valueColorClass) {
  const taxExpense = (kpi.numerator || []).reduce((sum, f) => sum + (Number(snapshot[f]) || 0), 0);
  const netProfit = (kpi.denominator || []).reduce((sum, f) => sum + (Number(snapshot[f]) || 0), 0);
  if (!netProfit) return `<p class="kpi-value unavailable">Not enough data</p>`;

  // Same "material move" framing as kpiTrendLine, but in %-points-of-tax-rate
  // terms rather than "pts" — plainer for a rate specifically.
  let trendHtml = '';
  if (kpi.priorValue != null) {
    const diff = (kpi.value - kpi.priorValue) * 100;
    trendHtml = Math.abs(diff) < 0.05
      ? `<span class="trend-flat">— no change</span>`
      : `<span class="${diff > 0 ? 'trend-up' : 'trend-down'}">${diff > 0 ? '↑' : '↓'} ${Math.abs(diff).toFixed(1)}% vs last period</span>`;
  }

  // Same tint the confidence badges already use for good/bad (sage-bg/rust-bg,
  // no border — just a soft fill), so the box carries the verdict rather than
  // just the text inside it. No target set = no verdict to show, so it stays
  // a plain neutral tile rather than guessing. Tax expense has no inherent
  // good/bad on its own (a bigger bill can just mean bigger profit), so it
  // always stays neutral.
  const rateBg = valueColorClass === 'good' ? 'var(--sage-bg)' : valueColorClass === 'bad' ? 'var(--rust-bg)' : 'var(--paper)';

  return `
    <div style="display:flex; gap:12px; margin:4px 0 2px; flex-wrap:wrap;">
      <button type="button" id="tax-position-toggle" title="Show the calculation"
        style="cursor:pointer; text-align:left; background:${rateBg}; border:none; border-radius:8px; padding:8px 12px; font-family:inherit; flex:1 1 110px; min-width:0;">
        <p class="cash-net-value ${valueColorClass}" style="margin:0; font-size:18px;">${(kpi.value * 100).toFixed(1)}%</p>
        <span class="cash-net-stat-label">Effective rate</span>
        ${trendHtml ? `<p style="font-size:11px; margin:4px 0 0;">${trendHtml}</p>` : ''}
      </button>
      <div style="background:var(--paper); border-radius:8px; padding:8px 12px; flex:1 1 110px; min-width:0;">
        <p class="cash-net-value" style="margin:0; font-size:18px;">${formatMoney(taxExpense)}</p>
        <span class="cash-net-stat-label">Tax expense</span>
      </div>
    </div>
    <div id="tax-position-detail" style="display:none; margin-top:8px;">
      <p style="font-size:11px; color:var(--ink-soft); margin:0;">= ${formatMoney(taxExpense)} tax expense ÷ ${formatMoney(netProfit)} net profit before tax</p>
      <p style="font-size:11px; color:var(--ink-soft); margin:4px 0 0; font-style:italic;">Why look at this: the rate shows what share of profit is going to tax — a shift here can flag a timing issue, a planning opportunity, or an error, even when profit itself hasn't moved much.</p>
    </div>
  `;
}

function renderKpiCard(kpi, snapshot) {
  const unavailable = kpi.confidence === 'red';
  const trend = (!unavailable && kpi.priorValue != null)
    ? `<p class="trend-line">${kpiTrendLine(kpi)}</p>` : '';
  const missing = unavailable ? missingFieldsFor(kpi, snapshot) : [];
  // Only colors the value once a target exists AND the direction is
  // unambiguous (see KPI_DIRECTION) — no target set, or a genuinely
  // direction-neutral metric, stays plain ink rather than a guessed verdict.
  let valueColorClass = '';
  if (!unavailable) {
    const targetItem = findKpiTarget(kpi.key);
    const direction = KPI_DIRECTION[kpi.key];
    if (targetItem && direction) {
      const beating = direction === 'higher' ? kpi.value >= targetItem.target : kpi.value <= targetItem.target;
      valueColorClass = beating ? 'good' : 'bad';
    }
  }
  const isTaxRate = kpi.key === 'effective_tax_rate';
  return `
    <div class="kpi-card">
      <div class="kpi-card-head">
        <p class="kpi-name">${isTaxRate ? 'Current tax position' : kpi.name}</p>
        <span class="confidence-badge ${kpi.confidence}">${CONFIDENCE_LABEL[kpi.confidence]}</span>
      </div>
      ${!unavailable && isTaxRate
        ? renderTaxPositionHeader(kpi, snapshot, valueColorClass)
        : `<p class="kpi-value ${unavailable ? 'unavailable' : valueColorClass}">${unavailable ? 'Not enough data' : formatKpi(kpi.value, kpi.format)}</p>`}
      ${!isTaxRate ? trend : ''}
      ${kpi.confidence === 'yellow' && kpi.estimation_note ? `<p class="kpi-note">${kpi.estimation_note}</p>` : ''}
      ${!unavailable && kpi.key === 'op_cash_conversion' ? renderCashConversionExplainer(kpi, snapshot) : ''}
      ${kpi.interpretation ? `<p class="kpi-interp">${kpi.interpretation}</p>` : ''}
      ${kpi.benchmark ? `<p class="kpi-benchmark">💡 ${kpi.benchmark} <span class="kpi-benchmark-tag">— general estimate, not verified</span></p>` : ''}
      ${!unavailable && kpi.improvement_tip ? `<p class="kpi-tip">🔧 ${kpi.improvement_tip}</p>` : ''}
      ${missing.length ? `<p class="kpi-missing">Add ${missing.map((f) => FIELD_LABEL[f] || f).join(', ')} to calculate this.</p>` : ''}
      ${!unavailable ? renderKpiTargetBlock(kpi) : ''}
    </div>
  `;
}

const SOURCE_LABEL = { manual: 'manual entry', pdf: 'PDF extraction', xero: 'Xero sync' };

function renderFinancialSnapshotCard(snapshot) {
  if (!snapshot) return '';
  const synced = snapshot.synced_at ? new Date(snapshot.synced_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : null;
  return `
    <div style="display:flex; align-items:baseline; justify-content:space-between;">
      <p class="section-title">Financial snapshot</p>
      <button class="mini-link" id="snapshot-edit-btn" data-edit-period="${snapshot.period_end}" type="button">edit</button>
    </div>
    <div class="card full">
      <div class="snapshot-grid">
        ${FINANCIAL_FIELD_DEFS.map(([key, label]) => `
          <div class="snapshot-field">
            <p class="card-label">${label}</p>
            <p class="snapshot-value ${snapshot[key] == null ? 'blank' : ''}">${snapshot[key] == null ? 'not recorded' : formatMoney(snapshot[key])}</p>
          </div>
        `).join('')}
      </div>
      <p class="snapshot-provenance">Source: ${SOURCE_LABEL[snapshot.source] || snapshot.source || 'unknown'}${synced ? ` · synced ${synced}` : ''}</p>
    </div>
  `;
}

// Consolidated nudge above the KPI grid — turns a wall of red badges into one
// actionable list instead of leaving each card as a dead end on its own.
function renderUnlockCard(kpis, snapshot) {
  const missingSet = new Set();
  kpis.filter((k) => k.confidence === 'red').forEach((k) => missingFieldsFor(k, snapshot).forEach((f) => missingSet.add(f)));
  if (!missingSet.size) return '';
  return `
    <div class="unlock-card">
      <p>Add <b>${[...missingSet].map((f) => FIELD_LABEL[f] || f).join(', ')}</b> to unlock ${kpis.filter((k) => k.confidence === 'red').length} more metric${kpis.filter((k) => k.confidence === 'red').length === 1 ? '' : 's'}.</p>
      <button class="action secondary" id="unlock-goto-input" type="button">Go to Input</button>
    </div>
  `;
}

function renderKpiHistoryTable(history) {
  if (!history?.periods?.length) return '';
  const groups = {};
  history.kpis.forEach((k) => { (groups[k.category || 'other'] = groups[k.category || 'other'] || []).push(k); });
  const order = [...KPI_CATEGORY_ORDER, ...Object.keys(groups).filter((c) => !KPI_CATEGORY_ORDER.includes(c))];
  const rows = order.filter((c) => groups[c]?.length).map((c) => `
    <tr class="history-group-row"><td colspan="${history.periods.length + 1}">${KPI_CATEGORY_META[c] || c}</td></tr>
    ${groups[c].map((k) => `
      <tr>
        <td>${k.name}</td>
        ${k.values.map((v) => `<td class="${v == null ? 'blank' : ''}">${v == null ? '—' : formatKpi(v, k.format)}</td>`).join('')}
      </tr>
    `).join('')}
  `).join('');
  return `
    <p class="section-title">Metric history</p>
    <div class="card full history-table-wrap">
      <table class="history-table">
        <thead><tr><th>Metric</th>${history.periods.map((p) => `<th>${formatShortDate(p)}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderHealthWheelBlock(container, overview, kpis, snapshot, history) {
  const hs = overview?.healthScore || null;
  const priorHs = overview?.priorHealthScore || null;
  const pillarMap = {};
  (overview?.pillarScores || []).forEach((p) => { pillarMap[p.pillar] = p.score; });
  const priorPillarMap = {};
  (overview?.priorPillarScores || []).forEach((p) => { priorPillarMap[p.pillar] = p.score; });
  const pillars = Object.keys(pillarMap).map((key) => ({
    key, score: pillarMap[key],
    name: PILLAR_META[key]?.name || key, color: PILLAR_META[key]?.color || '#999',
  }));
  const flags = overview?.flags || [];

  container.innerHTML = `
    <div class="hero-row">
      <div class="wheel-card">
        <p class="wheel-label">Business health</p>
        ${hs ? `
          <svg id="ov-wheel" width="240" height="240" viewBox="0 0 240 240"></svg>
          <div class="wheel-score"><b>${hs.score}</b> / 100</div>
          ${priorHs ? `<p class="trend-line">${trendArrow(hs.score, priorHs.score)}</p>` : ''}
          <div class="pillar-legend" id="ov-legend"></div>
        ` : '<p class="muted plain" style="text-align:center; margin-top:24px;">No analysis run yet for this period.</p>'}
      </div>
      <div class="side-cards">
        <div class="card full">
          <p class="card-label">Flags this period</p>
          ${flags.length
            ? flags.map((f, i) => `
              <div class="flag-row-wrap">
                <div class="flag-row"><span class="flag-dot ${f.severity === 'danger' || f.severity === 'warning' ? 'rust' : 'sage'}"></span> ${f.message}
                  <button class="mini-link" data-suggest-target="${i}" type="button">✨ suggest target</button>
                </div>
                <div class="suggest-panel" id="target-panel-${i}" style="display:none;"></div>
              </div>
            `).join('')
            : '<p class="muted plain" style="margin:0;">No flags this period.</p>'}
        </div>
      </div>
    </div>
    ${kpis && kpis.length ? `
      <p class="section-title">Key metrics</p>
      ${renderUnlockCard(kpis, snapshot)}
      ${groupKpis(kpis).map((group) => {
        const isCash = group.key === 'cash';
        const isTax = group.key === 'tax';
        const cashOutlookCard = isCash ? renderCashOutlookCard(snapshot, kpis) : '';
        const taxCard = isTax ? renderTaxAffordabilityCard(snapshot) : '';
        const taxOutlookCard = isTax ? renderTaxOutlookCard(snapshot, currentCtx) : '';
        const itemCount = group.kpis.length + (isCash ? 1 : 0) + (cashOutlookCard ? 1 : 0) + (taxCard ? 1 : 0) + (taxOutlookCard ? 1 : 0);
        const gridClass = [isCash ? 'kpi-grid-cash' : '', itemCount === 1 ? 'kpi-grid-solo' : ''].filter(Boolean).join(' ');
        return `
        <p class="kpi-group-label">${group.label}</p>
        <div class="kpi-grid ${gridClass}">
          ${group.kpis.map((k) => renderKpiCard(k, snapshot)).join('')}
          ${isCash ? renderCashFlowGlanceCard(kpis.find((k) => k.key === 'op_cash_conversion')) : ''}
          ${cashOutlookCard}
          ${taxCard}
          ${taxOutlookCard}
        </div>
      `;
      }).join('')}
    ` : ''}
    ${pillars.length ? `
      <p class="section-title">Pillar scores</p>
      <div class="card full" style="padding: 20px 24px;">
        <table style="width:100%; border-collapse: collapse; font-size: 13px;">
          <tbody>
            ${pillars.map((p) => `<tr><td style="padding:8px 0; border-top:1px solid var(--line);"><span style="display:inline-block; width:8px; height:8px; border-radius:2px; background:${p.color}; margin-right:8px;"></span>${p.name}</td><td style="padding:8px 0; border-top:1px solid var(--line); text-align:right;"><span style="font-family: var(--font-mono);">${p.score == null ? '—' : p.score.toFixed(1) + '/10'}</span>${priorPillarMap[p.key] !== undefined ? `<br>${trendArrow(p.score, priorPillarMap[p.key])}` : ''}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    ` : ''}
    ${renderKpiHistoryTable(history)}
    ${renderFinancialSnapshotCard(snapshot)}
  `;

  const unlockBtn = document.getElementById('unlock-goto-input');
  if (unlockBtn) unlockBtn.onclick = () => {
    currentWorkflow = 'input';
    renderWorkflowTabsActive();
    renderMain();
  };

  const snapshotEditBtn = document.getElementById('snapshot-edit-btn');
  if (snapshotEditBtn) snapshotEditBtn.onclick = () => {
    currentPeriodEnd = snapshotEditBtn.dataset.editPeriod;
    document.getElementById('period-select').value = currentPeriodEnd;
    currentWorkflow = 'input';
    currentEntrySubtab = 'manual';
    renderWorkflowTabsActive();
    renderMain();
  };

  const cashConvJump = document.getElementById('cash-conv-jump');
  if (cashConvJump) {
    cashConvJump.onclick = () => {
      const toggle = document.getElementById('recon-toggle');
      if (!toggle) return; // Cash in/out card isn't showing this period (e.g. no prior period on file)
      const panel = document.getElementById('recon-panel');
      if (panel && panel.style.display === 'none') toggle.click();
      toggle.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  }

  const cashOutlookUnit = document.getElementById('cash-outlook-unit');
  if (cashOutlookUnit && snapshot?.revenue && snapshot?.net_profit != null) {
    const conversion = kpis.find((k) => k.key === 'op_cash_conversion')?.value;
    const cashValueEl = document.getElementById('cash-outlook-value');
    const cashProvenanceEl = document.getElementById('cash-outlook-provenance');
    const cashBuildupEl = document.getElementById('cash-outlook-buildup');
    const cashRevenueInput = document.getElementById('cash-outlook-revenue');
    const cashGpInput = document.getElementById('cash-outlook-gp');
    const cashOpexInput = document.getElementById('cash-outlook-opex');
    const cashNetProfitInput = document.getElementById('cash-outlook-netprofit');
    const cashNetProfitAbsoluteInput = document.getElementById('cash-outlook-netprofit-absolute');
    const recalcCashOutlook = () => {
      cashOutlookState = {
        unit: cashOutlookUnit.value, revenue: Number(cashRevenueInput.value || 0), gp: Number(cashGpInput.value || 0),
        opex: Number(cashOpexInput.value || 0), netProfit: Number(cashNetProfitInput.value || 0), netProfitAbsolute: cashNetProfitAbsoluteInput.value,
      };
      const r = computeCashOutlookResult(
        snapshot, conversion, cashOutlookState.unit,
        cashOutlookState.revenue, cashOutlookState.gp, cashOutlookState.opex, cashOutlookState.netProfit, cashOutlookState.netProfitAbsolute
      );
      cashValueEl.textContent = r.headline;
      cashProvenanceEl.textContent = r.provenance;
      cashBuildupEl.innerHTML = r.buildup;
    };
    cashOutlookUnit.onchange = recalcCashOutlook;
    [cashRevenueInput, cashGpInput, cashOpexInput, cashNetProfitInput, cashNetProfitAbsoluteInput].forEach((el) => { el.oninput = recalcCashOutlook; });
    recalcCashOutlook();

    const cashOutlookToggle = document.getElementById('cash-outlook-toggle');
    const cashOutlookPanel = document.getElementById('cash-outlook-panel');
    const openCashOutlookPanel = () => {
      cashOutlookPanel.style.display = 'block';
      cashOutlookToggle.querySelector('.chevron').textContent = '▴';
      cashOutlookPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    cashOutlookToggle.onclick = () => {
      const willOpen = cashOutlookPanel.style.display === 'none';
      cashOutlookPanel.style.display = willOpen ? 'block' : 'none';
      cashOutlookToggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
    };
    document.getElementById('cash-outlook-provenance-link').onclick = openCashOutlookPanel;
  }

  const taxPositionToggle = document.getElementById('tax-position-toggle');
  if (taxPositionToggle) {
    const taxPositionDetail = document.getElementById('tax-position-detail');
    taxPositionToggle.onclick = () => {
      taxPositionDetail.style.display = taxPositionDetail.style.display === 'none' ? 'block' : 'none';
    };
  }

  const taxOutlookUnit = document.getElementById('tax-outlook-unit');
  if (taxOutlookUnit && snapshot?.revenue && snapshot?.net_profit != null) {
    const taxValueEl = document.getElementById('tax-outlook-tax-value');
    const taxLabelEl = document.getElementById('tax-outlook-tax-label');
    const cashLineEl = document.getElementById('tax-outlook-cash-line');
    const buildupEl = document.getElementById('tax-outlook-buildup');
    const provenanceEl = document.getElementById('tax-outlook-provenance');
    const deductionNoteEl = document.getElementById('tax-outlook-deduction-note');
    const compareTextEl = document.getElementById('tax-outlook-compare-text');
    const bracketDetailEl = document.getElementById('tax-outlook-bracket-detail');
    const revenueInput = document.getElementById('tax-outlook-revenue');
    const gpInput = document.getElementById('tax-outlook-gp');
    const opexInput = document.getElementById('tax-outlook-opex');
    const netProfitInput = document.getElementById('tax-outlook-netprofit');
    const netProfitAbsoluteInput = document.getElementById('tax-outlook-netprofit-absolute');
    const superInput = document.getElementById('tax-outlook-super');
    const equipmentInput = document.getElementById('tax-outlook-equipment');
    const compareEntityInput = document.getElementById('tax-outlook-compare-entity');
    const compareShareInputs = [...document.querySelectorAll('.tax-outlook-compare-share')];
    const compareOtherIncomeInputs = [...document.querySelectorAll('.tax-outlook-compare-other-income')];
    const recalcTaxOutlook = () => {
      taxOutlookState = {
        unit: taxOutlookUnit.value, revenue: Number(revenueInput.value || 0), gp: Number(gpInput.value || 0),
        opex: Number(opexInput.value || 0), netProfit: Number(netProfitInput.value || 0), netProfitAbsolute: netProfitAbsoluteInput.value,
        super: Number(superInput.value || 0), equipment: Number(equipmentInput.value || 0), compareEntity: compareEntityInput.value,
        compareShares: compareShareInputs.map((el) => el.value), compareOtherIncome: compareOtherIncomeInputs.map((el) => el.value),
      };
      const r = computeTaxOutlookResult(
        snapshot, snapshot.cash, currentCtx?.entity_type, taxOutlookState.unit,
        taxOutlookState.revenue, taxOutlookState.gp, taxOutlookState.opex, taxOutlookState.netProfit, taxOutlookState.netProfitAbsolute,
        taxOutlookState.super, taxOutlookState.equipment, taxOutlookState.compareEntity, taxOutlookState.compareShares, taxOutlookState.compareOtherIncome
      );
      taxValueEl.textContent = r.headline;
      taxLabelEl.textContent = r.headlineLabel;
      cashLineEl.textContent = r.cashText;
      cashLineEl.className = 'kpi-interp' + (r.cashClass ? ' ' + r.cashClass : '');
      buildupEl.innerHTML = r.buildup;
      provenanceEl.textContent = r.provenance;
      deductionNoteEl.textContent = r.deductionNote;
      compareTextEl.textContent = r.compareText;
      bracketDetailEl.innerHTML = r.bracketDetail;
    };
    taxOutlookUnit.onchange = recalcTaxOutlook;
    compareEntityInput.onchange = () => {
      // Sole trader is always the whole profit — pre-fill 100% so the row
      // reads correctly at a glance instead of showing whatever was last
      // typed for a Partnership/Trust split. Switching TO Partnership/Trust
      // resets the first two shares to an even 50/50 starting point for the
      // same reason — otherwise a leftover 100 from Sole trader (or
      // whatever was last typed) silently skews the split instead of
      // reading as the clean default it's meant to be.
      if (compareEntityInput.value === 'Sole trader') {
        compareShareInputs[0].value = 100;
        for (let i = 1; i < compareShareInputs.length; i++) compareShareInputs[i].value = '';
      } else if (compareEntityInput.value === 'Partnership' || compareEntityInput.value === 'Trust') {
        compareShareInputs[0].value = 50;
        compareShareInputs[1].value = 50;
        for (let i = 2; i < compareShareInputs.length; i++) compareShareInputs[i].value = '';
      }
      recalcTaxOutlook();
    };
    [revenueInput, gpInput, opexInput, netProfitInput, netProfitAbsoluteInput, superInput, equipmentInput, ...compareShareInputs, ...compareOtherIncomeInputs].forEach((el) => { el.oninput = recalcTaxOutlook; });
    recalcTaxOutlook();

    const taxOutlookToggle = document.getElementById('tax-outlook-toggle');
    const taxOutlookPanel = document.getElementById('tax-outlook-panel');
    const openTaxOutlookPanel = () => {
      taxOutlookPanel.style.display = 'block';
      taxOutlookToggle.querySelector('.chevron').textContent = '▴';
      taxOutlookPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    taxOutlookToggle.onclick = () => {
      const willOpen = taxOutlookPanel.style.display === 'none';
      taxOutlookPanel.style.display = willOpen ? 'block' : 'none';
      taxOutlookToggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
    };
    document.getElementById('tax-outlook-provenance-link').onclick = openTaxOutlookPanel;

    // Tax rates panel lives in the same card, so it reuses recalcTaxOutlook
    // directly (defined just above, in this same scope) instead of a full
    // renderMain() — that keeps a rate edit as fast/local as any scenario
    // field, rather than reloading the whole tab and losing scroll position
    // and every other panel's open/closed state.
    const taxRatesToggle = document.getElementById('tax-rates-toggle');
    if (taxRatesToggle) {
      const taxRatesPanel = document.getElementById('tax-rates-panel');
      taxRatesToggle.onclick = () => {
        const willOpen = taxRatesPanel.style.display === 'none';
        taxRatesPanel.style.display = willOpen ? 'block' : 'none';
        taxRatesToggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
      };
      const rateFieldIds = {
        taxFreeThreshold: 'tr-threshold', bracket2Upper: 'tr-b2-upper', bracket2Rate: 'tr-b2-rate',
        bracket3Upper: 'tr-b3-upper', bracket3Rate: 'tr-b3-rate', bracket4Upper: 'tr-b4-upper', bracket4Rate: 'tr-b4-rate',
        bracket5Rate: 'tr-b5-rate', medicareRate: 'tr-medicare-rate', medicareThreshold: 'tr-medicare-threshold',
        companyRate: 'tr-company-rate', superCap: 'tr-super-cap',
      };
      const rateInputs = Object.fromEntries(Object.entries(rateFieldIds).map(([key, id]) => [key, document.getElementById(id)]));
      const updateRateStatusLabel = () => {
        const usingDefaults = JSON.stringify(taxRatesState) === JSON.stringify(DEFAULT_TAX_RATES);
        document.getElementById('tax-rates-status-label').textContent = usingDefaults
          ? 'Defaults to FY2026-27 — edit below for a different year'
          : 'Using custom rates you’ve entered — not the FY2026-27 defaults';
      };
      const recalcRates = () => {
        taxRatesState = Object.fromEntries(Object.entries(rateInputs).map(([key, el]) => [key, Number(el.value) || 0]));
        updateRateStatusLabel();
        recalcTaxOutlook();
      };
      Object.values(rateInputs).forEach((el) => { el.onchange = recalcRates; });
      document.getElementById('tax-rates-reset').onclick = () => {
        taxRatesState = { ...DEFAULT_TAX_RATES };
        Object.entries(rateFieldIds).forEach(([key, id]) => { document.getElementById(id).value = DEFAULT_TAX_RATES[key]; });
        updateRateStatusLabel();
        recalcTaxOutlook();
      };
    }
  }

  const ocfToggle = document.getElementById('ocf-adjust-toggle');
  if (ocfToggle) {
    const ocfPanel = document.getElementById('ocf-adjust-panel');
    ocfToggle.onclick = () => {
      ocfPanel.style.display = ocfPanel.style.display === 'none' ? 'block' : 'none';
      ocfToggle.querySelector('.chevron').textContent = ocfPanel.style.display === 'none' ? '▾' : '▴';
    };

    const ocfFieldIds = ['net_profit', 'interest_expense', 'depreciation_amortisation', 'delta_debtors', 'delta_creditors', 'delta_inventory', 'manual_adjustment'];
    const ocfNum = (id) => Number(document.getElementById(`ocf-${id}`).value || 0);
    const recalcOcf = () => {
      const total = ocfNum('net_profit') + ocfNum('interest_expense') + ocfNum('depreciation_amortisation')
        - ocfNum('delta_debtors') + ocfNum('delta_creditors') - ocfNum('delta_inventory') + ocfNum('manual_adjustment');
      document.getElementById('ocf-total-value').textContent = formatMoney(total);
      return total;
    };
    ocfFieldIds.forEach((id) => { document.getElementById(`ocf-${id}`).oninput = recalcOcf; });

    document.getElementById('ocf-save-btn').onclick = async () => {
      const msg = document.getElementById('ocf-save-msg');
      const total = recalcOcf();
      msg.textContent = 'Saving…';
      msg.className = 'save-msg';
      // Sends the FULL current snapshot, not just operating_cash_flow — the save
      // endpoint treats any omitted field as blank, so a partial payload here
      // would silently wipe every other field on this period.
      const body = { type: 'financials', client_id: currentClientId, period_end: currentPeriodEnd };
      FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = snapshot[key] != null ? snapshot[key] : ''; });
      body.operating_cash_flow = total;
      try {
        const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
        const saved = await res.json();
        if (saved.error) throw new Error(saved.error);
        msg.textContent = 'Saved.';
        msg.className = 'save-msg ok';
        const scrollPos = window.scrollY;
        await renderMain();
        window.scrollTo(0, scrollPos);
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.className = 'save-msg err';
      }
    };
  }

  const reconToggle = document.getElementById('recon-toggle');
  if (reconToggle) {
    const reconPanel = document.getElementById('recon-panel');
    reconToggle.onclick = () => { reconPanel.style.display = reconPanel.style.display === 'none' ? 'block' : 'none'; };

    // "↗" next to a figure jumps to that field in the full Manual Entry form
    // — stopPropagation so clicking it doesn't also fire the parent row's
    // own click-to-expand toggle (several of these sit inside a
    // cash-item-clickable row).
    container.querySelectorAll('[data-jump-field]').forEach((btn) => {
      btn.onclick = (e) => { e.stopPropagation(); jumpToManualEntry(btn.dataset.jumpField, btn.dataset.jumpPeriod || null); };
    });

    container.querySelectorAll('[data-accordion-toggle]').forEach((head) => {
      head.onclick = () => {
        const body = document.getElementById(`recon-body-${head.dataset.accordionToggle}`);
        body.style.display = body.style.display === 'none' ? 'block' : 'none';
        head.querySelector('.chevron').textContent = body.style.display === 'none' ? '▾' : '▴';
      };
    });
    // Tiles on the compact card jump straight into the matching accordion
    // section — "cashflow" and "unexplained" have no section of their own
    // (see renderCashFlowGlanceCard), so they just open the panel and
    // scroll to the relevant fixed element instead of an accordion body.
    container.querySelectorAll('[data-tile-jump]').forEach((tileBtn) => {
      tileBtn.onclick = () => {
        const key = tileBtn.dataset.tileJump;
        reconPanel.style.display = 'block';
        if (key === 'cashflow') {
          reconPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (key === 'unexplained') {
          document.getElementById('recon-residual-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          const body = document.getElementById(`recon-body-${key}`);
          const head = container.querySelector(`[data-accordion-toggle="${key}"]`);
          body.style.display = 'block';
          head.querySelector('.chevron').textContent = '▴';
          body.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };
    });

    const r = kpis.find((k) => k.key === 'op_cash_conversion')?.cash_reconciliation;

    // Shared wiring for the two small "show calculation + edit" blocks (cash
    // balance, total debt) — same self-contained toggle/recalc/save pattern
    // as the OCF adjust block below, just for a single snapshot field each.
    const wireBalanceAdjust = (prefix, priorValue, fieldName) => {
      const toggle = document.getElementById(`${prefix}-adjust-toggle`);
      if (!toggle) return;
      const panel = document.getElementById(`${prefix}-adjust-panel`);
      toggle.onclick = () => {
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        toggle.querySelector('.chevron').textContent = panel.style.display === 'none' ? '▾' : '▴';
      };
      const input = document.getElementById(`${prefix}-current`);
      const recalc = () => {
        const total = Number(input.value || 0) - (priorValue || 0);
        document.getElementById(`${prefix}-total-value`).textContent = formatMoney(total);
        return total;
      };
      input.oninput = recalc;
      document.getElementById(`${prefix}-save-btn`).onclick = async () => {
        const msg = document.getElementById(`${prefix}-save-msg`);
        msg.textContent = 'Saving…';
        msg.className = 'save-msg';
        // Sends the FULL current snapshot, not just this one field — an
        // omitted field is treated as blank by the save endpoint.
        const body = { type: 'financials', client_id: currentClientId, period_end: currentPeriodEnd };
