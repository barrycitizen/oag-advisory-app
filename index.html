async function renderFinancialAnalyse(content) {
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot from the Input tab first, then run analysis here.</p></div>`;
    return;
  }
  content.innerHTML = `
    <button class="action" id="run-analysis-btn">Run analysis for ${formatShortDate(currentPeriodEnd)}</button>
    <div id="analyse-body" style="margin-top:16px;"></div>
  `;
  const body = document.getElementById('analyse-body');
  // These fetches are async — if the user navigates away before they resolve,
  // `body` (and its 'run-analysis-btn' sibling) may already be detached from the
  // document. Guard every write with a liveness check rather than trust closures
  // captured before the await.
  const stillLive = () => document.body.contains(body);

  const hasDivisions = !!(currentCtx?.divisions?.length);
  const [overview, kpiData, history, divisionHistory] = await Promise.all([
    callRead('get_overview', currentClientId, currentPeriodEnd),
    callRead('get_kpi_report', currentClientId, currentPeriodEnd),
    callRead('get_kpi_history', currentClientId, currentPeriodEnd),
    hasDivisions ? callRead('get_division_kpi_history', currentClientId, currentPeriodEnd) : Promise.resolve(null),
  ]);
  if (!stillLive()) return;
  renderHealthWheelBlock(body, overview, kpiData?.kpis, kpiData?.snapshot, history, divisionHistory);

  const runBtn = document.getElementById('run-analysis-btn');
  // analyze-background.js runs as a Netlify background function (up to 15
  // min) rather than the old synchronous one (10-30s) — the Claude call
  // alone routinely takes ~20s, which left too little margin once the
  // surrounding Supabase work was added on top; this was an observed
  // failure, not a theoretical one. The tradeoff: the trigger below gets
  // an immediate empty response with no useful body, so this polls
  // get_diagnosis instead of awaiting a direct result — watching for
  // either the 'overall' diagnostics row's id changing (success) or an
  // 'analysis_error' marker appearing (a genuine failure, written by
  // analyze-background.js's own catch block since its real return value
  // never reaches this caller).
  if (runBtn) runBtn.onclick = async () => {
    body.textContent = 'Analyzing…';
    const baseline = await callRead('get_diagnosis', currentClientId, currentPeriodEnd);
    if (!stillLive()) return;
    const baselineId = baseline?.analysisId ?? null;

    fetch('/.netlify/functions/analyze-background', {
      method: 'POST',
      body: JSON.stringify({ client_id: currentClientId, period_end: currentPeriodEnd }),
    }).catch(() => {});

    // ~2 minutes of polling — comfortably past the ~20s Claude typically
    // takes plus the read/write and risk-sync work around it.
    const maxAttempts = 40;
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      await new Promise((r) => setTimeout(r, 3000));
      if (!stillLive()) return;
      const poll = await callRead('get_diagnosis', currentClientId, currentPeriodEnd);
      if (!stillLive()) return;
      if (poll?.analysisError) {
        body.innerHTML = `<div class="flag">Error: ${escAttr(poll.analysisError)}</div>`;
        return;
      }
      if (poll?.analysisId && poll.analysisId !== baselineId) {
        const [fresh, freshKpis, freshHistory, freshDivisionHistory] = await Promise.all([
          callRead('get_overview', currentClientId, currentPeriodEnd),
          callRead('get_kpi_report', currentClientId, currentPeriodEnd),
          callRead('get_kpi_history', currentClientId, currentPeriodEnd),
          hasDivisions ? callRead('get_division_kpi_history', currentClientId, currentPeriodEnd) : Promise.resolve(null),
        ]);
        if (!stillLive()) return;
        renderHealthWheelBlock(body, fresh, freshKpis?.kpis, freshKpis?.snapshot, freshHistory, freshDivisionHistory);
        refreshHealthBadge();
        return;
      }
    }
    // Gave up polling, but the run may well still finish server-side
    // (background functions get up to 15 min) — say so rather than
    // claiming failure; switching tabs and back re-reads fresh data
    // regardless of whether this poll caught it.
    body.innerHTML = `<div class="flag">Still analyzing — this is taking longer than usual. Switch tabs and back in a minute to check, or try again.</div>`;
  };

  // Land straight on the KPI card a Meeting-mode brief tile was clicked for
  // (see pendingFinancialKpiScrollKey / renderFinancialBrief) instead of
  // leaving the accountant to scan the whole board to find it. Prefers the
  // metric summary table's own row-click handler (wired inside
  // renderHealthWheelBlock, further down) over a plain scrollIntoView —
  // op_cash_conversion/effective_tax_rate live under the "Cash & Tax"
  // metrics tab, not the default "Performance" one, and that handler
  // already knows how to switch tabs (and expand a collapsed group) first.
  // Falls back to switching the tab directly when the summary table itself
  // isn't rendered (e.g. still locked behind "N fields missing") — the
  // per-KPI card exists under its metrics tab regardless of the summary
  // table's own unlock state.
  if (pendingFinancialKpiScrollKey) {
    const key = pendingFinancialKpiScrollKey;
    pendingFinancialKpiScrollKey = null;
    const summaryRow = document.querySelector(`[data-summary-row][data-summary-kpi-key="${key}"]`);
    if (summaryRow) {
      summaryRow.click();
    } else {
      const kpiMeta = (kpiData?.kpis || []).find((k) => k.key === key);
      const metricsTabKey = kpiMeta && RIGHT_KPI_CATEGORIES.includes(kpiMeta.category) ? 'cashtax' : 'performance';
      document.querySelector(`[data-metrics-tab="${metricsTabKey}"]`)?.click();
      const card = document.querySelector(`[data-kpi-card-key="${key}"]`);
      if (card) {
        const grid = card.closest('.kpi-grid');
        if (grid && grid.style.display === 'none') {
          const toggle = grid.previousElementSibling;
          if (toggle?.classList.contains('kpi-group-toggle')) toggle.click();
        }
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('kpi-card-flash');
        setTimeout(() => card.classList.remove('kpi-card-flash'), 1600);
      }
    }
  }
}

// ---- Financial Performance: Diagnose ----
async function renderFinancialDiagnose(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot and run analysis first.</p></div>`;
    return;
  }
  const data = await callRead('get_diagnosis', currentClientId, currentPeriodEnd);
  if (myToken !== renderToken) return;

  // rec_id is title-scoped rather than index-scoped (rec:<group>:<title>) so
  // dismiss/restore survive the list reordering or shrinking that a re-fetch
  // (e.g. after dismissing something) would otherwise break an index-based
  // id against.
  const recState = getRecommendationState();
  const recId = (group, r) => `rec:${group}:${r.title}`;
  const findRecByFullId = (fullId) => {
    const [, group, ...rest] = fullId.split(':');
    const title = rest.join(':');
    return { group, item: (data[group] || []).find((r) => r.title === title) };
  };
  const recRow = (r, group) => `
    <div class="flag-row-wrap">
      <div class="flag-row">
        <span class="flag-dot sage"></span>
        <span><b>${r.title}</b> — ${r.impact || ''} <span class="muted plain">(${r.difficulty || ''}${r.difficulty && r.timeframe ? ', ' : ''}${r.timeframe || ''})</span></span>
        <button class="mini-link" data-turn-rec="${escAttr(recId(group, r))}" type="button">→ turn into goal</button>
        <button class="mini-link" data-turn-rec-action="${escAttr(recId(group, r))}" type="button">→ turn into action</button>
        <button class="mini-link" data-dismiss-rec="${escAttr(recId(group, r))}" type="button">✕ dismiss</button>
      </div>
    </div>
  `;
  const recSectionHtml = (items, group) => {
    const visible = items.filter((r) => !recState.dismissed[recId(group, r)]);
    const dismissed = items.filter((r) => recState.dismissed[recId(group, r)]);
    return `
      ${visible.length ? visible.map((r) => recRow(r, group)).join('') : (dismissed.length ? '' : '<p class="muted plain" style="margin:0;">Nothing recorded for this period yet.</p>')}
      ${dismissed.length ? `
        <button type="button" class="mini-link" data-show-dismissed-rec="${group}" style="margin-top:6px;">${dismissed.length} dismissed — show</button>
        <div id="dismissed-rec-${group}" style="display:none; margin-top:6px;">
          ${dismissed.map((r) => `
            <div class="flag-row-wrap">
              <div class="flag-row"><span class="flag-dot"></span> <span class="muted plain">${r.title}</span>
                <button class="mini-link" data-restore-rec="${escAttr(recId(group, r))}" type="button">↺ restore</button>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    `;
  };
  content.innerHTML = `
    <div class="card">
      <p class="muted plain" style="margin:0;">Risk items detected from the numbers have moved to the Risk domain → <button class="mini-link" id="goto-risk-link" type="button">Risk → Analyse</button></p>
    </div>
    <div class="card">
      <p class="muted">Get better — fixes for a current gap</p>
      ${recSectionHtml(data.getBetter, 'getBetter')}
    </div>
    <div class="card">
      <p class="muted plain" style="margin:0;">Opportunities and profit ideas have moved to the Growth domain → <button class="mini-link" id="goto-growth-link" type="button">Growth → Analyse</button></p>
    </div>
    <div class="card">
      <p class="muted">Tax planning — worth reviewing with the client</p>
      ${recSectionHtml(data.taxPlanning, 'taxPlanning')}
      <button class="mini-link" id="tax-planning-model-link" type="button" style="margin-top:8px;">🧮 Model super, equipment or structure changes in Tax Outlook →</button>
      <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--line);">
        <p class="muted" style="margin:0 0 6px;">Ask a tax question</p>
        <div style="display:flex; gap:6px;">
          <input type="text" id="tax-question-input" placeholder="e.g. what about negative gearing a property?" style="flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:var(--font-body); background:var(--paper-raised); color:var(--ink); font-size:13px;" />
          <button class="action" id="tax-question-ask-btn" type="button" style="white-space:nowrap;">Ask</button>
        </div>
        <div id="tax-question-answer" style="margin-top:8px;"></div>
      </div>
    </div>
  `;

  content.querySelectorAll('button[data-turn-rec]').forEach((btn) => {
    btn.onclick = async () => {
      const { item: r } = findRecByFullId(btn.dataset.turnRec);
      if (!r) return;
      const text = r.impact ? `${r.title} — ${r.impact}` : r.title;
      btn.disabled = true;
      btn.textContent = 'adding…';
      try {
        await addTextAsGoal(text);
        btn.textContent = '✓ added to Goals → Business';
      } catch (err) {
        btn.textContent = 'error';
        btn.disabled = false;
        alert('Error: ' + err.message);
      }
    };
  });
  // Same recommendations, routed to Actions instead of Goals — most of these
  // read as concrete near-term tasks ("ask the client to...") rather than a
  // longer-horizon thing to work toward, so Actions is often the better fit.
  // Goals stays available too; this doesn't replace it, just adds the option.
  content.querySelectorAll('button[data-turn-rec-action]').forEach((btn) => {
    btn.onclick = async () => {
      const { item: r } = findRecByFullId(btn.dataset.turnRecAction);
      if (!r) return;
      const text = r.impact ? `${r.title} — ${r.impact}` : r.title;
      btn.disabled = true;
      btn.textContent = 'adding…';
      try {
        await addActionItem(text, 'diagnose', null, r.timeframe ? `${r.difficulty || ''}${r.difficulty && r.timeframe ? ', ' : ''}${r.timeframe}` : null);
        btn.textContent = '✓ added to Actions';
      } catch (err) {
        btn.textContent = 'error';
        btn.disabled = false;
        alert('Error: ' + err.message);
      }
    };
  });
  content.querySelectorAll('button[data-dismiss-rec]').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await toggleRecDismissed(btn.dataset.dismissRec, true);
        renderFinancialDiagnose(content);
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });
  content.querySelectorAll('button[data-restore-rec]').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await toggleRecDismissed(btn.dataset.restoreRec, false);
        renderFinancialDiagnose(content);
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });
  content.querySelectorAll('[data-show-dismissed-rec]').forEach((btn) => {
    btn.onclick = () => {
      const panel = document.getElementById(`dismissed-rec-${btn.dataset.showDismissedRec}`);
      const willOpen = panel.style.display === 'none';
      panel.style.display = willOpen ? 'block' : 'none';
    };
  });
  // "AI suggests it, calculator quantifies it" — rather than have the AI
  // state a specific dollar tax saving in free text (the exact failure mode
  // that produced a wrong effective-tax-rate figure earlier), this just
  // routes straight to the deterministic Tax Outlook card so the adviser can
  // plug the client's actual numbers into the same super/equipment/structure
  // levers and see a real, computed answer instead.
  const gotoGrowthLink = document.getElementById('goto-growth-link');
  if (gotoGrowthLink) {
    gotoGrowthLink.onclick = async () => {
      currentDomain = 'growth';
      currentWorkflow = 'analyse';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
    };
  }

  const gotoRiskLink = document.getElementById('goto-risk-link');
  if (gotoRiskLink) {
    gotoRiskLink.onclick = async () => {
      currentDomain = 'risk';
      currentWorkflow = 'analyse';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
    };
  }

  const taxPlanningModelLink = document.getElementById('tax-planning-model-link');
  if (taxPlanningModelLink) {
    taxPlanningModelLink.onclick = async () => {
      currentDomain = 'financial';
      currentWorkflow = 'analyse';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
      const toggle = document.getElementById('tax-outlook-toggle');
      if (!toggle) return;
      const panel = document.getElementById('tax-outlook-panel');
      if (panel && panel.style.display === 'none') toggle.click();
      toggle.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  }

  const taxQuestionInput = document.getElementById('tax-question-input');
  const taxQuestionBtn = document.getElementById('tax-question-ask-btn');
  const taxQuestionAnswer = document.getElementById('tax-question-answer');
  if (taxQuestionInput && taxQuestionBtn) {
    const askTaxQuestion = async () => {
      const question = taxQuestionInput.value.trim();
      if (!question) return;
      taxQuestionBtn.disabled = true;
      taxQuestionBtn.textContent = '…';
      taxQuestionAnswer.innerHTML = '';
      try {
        const res = await fetch('/.netlify/functions/tax-question', {
          method: 'POST',
          body: JSON.stringify({ client_id: currentClientId, period_end: currentPeriodEnd, question }),
        });
        const result = await res.json();
        if (result.error) throw new Error(result.error);
        const flagClass = result.isFinancialAdviceQuestion ? 'kpi-note' : 'muted plain';
        const flagIcon = result.isFinancialAdviceQuestion ? '⚠️ ' : '';
        taxQuestionAnswer.innerHTML = `<p class="${flagClass}" style="margin:0;">${flagIcon}${result.answer}</p>`;
      } catch (err) {
        taxQuestionAnswer.innerHTML = `<p class="muted plain" style="margin:0; color:var(--rust);">Error: ${err.message}</p>`;
      } finally {
        taxQuestionBtn.disabled = false;
        taxQuestionBtn.textContent = 'Ask';
      }
    };
    taxQuestionBtn.onclick = askTaxQuestion;
    taxQuestionInput.onkeydown = (e) => { if (e.key === 'Enter') askTaxQuestion(); };
  }
}

      panel.style.display = willOpen ? 'block' : 'none';
    };
  });

  const growthOutlookUnit = document.getElementById('growth-outlook-unit');
  if (growthOutlookUnit && snapshot?.revenue && snapshot?.net_profit != null) {
    const valueEl = document.getElementById('growth-outlook-value');
    const changeEl = document.getElementById('growth-outlook-change');
    const provenanceEl = document.getElementById('growth-outlook-provenance');
    const buildupEl = document.getElementById('growth-outlook-buildup');
    const cashCostEl = document.getElementById('growth-outlook-cash-cost');
    const revenueInput = document.getElementById('growth-outlook-revenue');
    const cogsInput = document.getElementById('growth-outlook-cogs');
    const gpMarginInput = document.getElementById('growth-outlook-gpmargin');
    const wagesInput = document.getElementById('growth-outlook-wages');
    const opexInput = document.getElementById('growth-outlook-opex');
    const otherIncomeInput = document.getElementById('growth-outlook-otherincome');
    const netProfitInput = document.getElementById('growth-outlook-netprofit');
    const recalc = () => {
      growthOutlookState = {
        unit: growthOutlookUnit.value, revenue: Number(revenueInput.value || 0), cogs: Number(cogsInput?.value || 0),
        wages: Number(wagesInput.value || 0), opex: Number(opexInput.value || 0), netProfit: Number(netProfitInput.value || 0),
        otherIncome: Number(otherIncomeInput.value || 0), gpMarginChange: Number(gpMarginInput?.value || 0),
        // Not derived from any input in this form — carried forward as-is,
        // otherwise every value edit would silently wipe out whatever the
        // toggle click handlers (below) just set.
        panelOpen: growthOutlookState.panelOpen,
      };
      scheduleGrowthOutlookSave();
      const scenario = projectGrowthProfitScenario(
        snapshot, growthOutlookState.unit, growthOutlookState.revenue, growthOutlookState.cogs,
        growthOutlookState.wages, growthOutlookState.opex, growthOutlookState.netProfit,
        growthOutlookState.otherIncome, growthOutlookState.gpMarginChange
      );
      valueEl.textContent = formatMoney(scenario.projectedProfit);
      provenanceEl.textContent = scenario.provenance;
      buildupEl.innerHTML = scenario.buildup;

      // Always visible, independent of which lever produced it — "so what
      // did this actually do to profit" shouldn't require opening the
      // assumptions panel and reading the buildup line to work out.
      const extraProfit = scenario.projectedProfit - snapshot.net_profit;
      const changeSign = extraProfit >= 0 ? '+' : '−';
      const changePct = snapshot.net_profit ? Math.abs((extraProfit / snapshot.net_profit) * 100) : null;
      changeEl.textContent = `Current ${formatMoney(snapshot.net_profit)} → projected ${formatMoney(scenario.projectedProfit)} (${changeSign}${formatMoney(Math.abs(extraProfit))}${changePct != null ? ` / ${changeSign}${changePct.toFixed(0)}%` : ''})`;

      // Same green/amber/red language as the score tiles elsewhere on this
      // page (scoreTileColors) — was hardcoded green regardless of whether
      // the scenario actually helps, which misleadingly made a decline look
      // just as "good" as an improvement. Tied to the CHANGE (extraProfit),
      // not the raw projected number, since this box's whole point is
      // showing what the scenario DID — green it made things better, amber
      // it's a wash (or nothing's been entered yet), red it made things worse.
      const valueBoxEl = document.getElementById('growth-outlook-value-box');
      const outlookColors = extraProfit > 0 ? SCORE_TILE_COLORS.green : extraProfit < 0 ? SCORE_TILE_COLORS.red : SCORE_TILE_COLORS.yellow;
      valueBoxEl.style.background = outlookColors.bg;
      valueEl.style.color = outlookColors.color;

      const yearsBox = document.getElementById('growth-outlook-years');
      const yearsRow = document.getElementById('growth-outlook-years-row');
      const multiYear = computeGrowthOutlookYears(
        snapshot, growthOutlookState.unit, growthOutlookState.revenue, growthOutlookState.cogs,
        growthOutlookState.wages, growthOutlookState.opex, growthOutlookState.otherIncome,
        growthOutlookState.gpMarginChange, growthOutlookState.netProfit, 5
      );
      if (multiYear) {
        yearsBox.style.display = 'block';
        yearsRow.innerHTML = multiYear.map((y) => `
          <div style="text-align:center; min-width:70px;">
            <div style="font-size:10px; color:var(--ink-soft);">Year ${y.year}</div>
            <div style="font-size:13px; font-weight:600; font-family:var(--font-mono);">${formatMoney(y.profit)}</div>
          </div>
        `).join('');
      } else {
        yearsBox.style.display = 'none';
      }

      const cashCost = computeCashCostOfGrowing(snapshot, kpiData?.kpis, scenario.projectedRevenue, scenario.projectedGP);
      if (cashCost != null) {
        // Framed against the EXTRA profit this scenario adds (not total
        // profit) — a bare dollar figure doesn't tell you if it's trivial or
        // most of the upside; the % does, and naming the usable-cash
        // leftover explicitly is the actual point of this line: profit up
        // by $X, but only $Y of that is real, spendable cash — the rest is
        // sitting in debtors/stock. Sign flips the verb: a growth scenario
        // ties cash up, a decline scenario frees it.
        const magnitude = Math.abs(cashCost);
        const verb = cashCost > 0 ? 'tied up in' : 'freed up from';
        let pctText = '';
        if (extraProfit > 0) {
          const pct = Math.round((magnitude / extraProfit) * 100);
          const usable = extraProfit - cashCost;
          pctText = ` — ${pct}% of the extra profit this growth adds, leaving roughly ${formatMoney(usable)} (${100 - pct}%) as usable cash`;
        }
        cashCostEl.textContent = `Roughly ${formatMoney(magnitude)} would be ${verb} debtors/stock (net of supplier financing), not usable cash${pctText}.`;
        cashCostEl.style.display = 'block';
      } else {
        cashCostEl.style.display = 'none';
      }
    };
    growthOutlookUnit.onchange = recalc;
    [revenueInput, cogsInput, gpMarginInput, wagesInput, opexInput, otherIncomeInput, netProfitInput].filter(Boolean).forEach((el) => { el.oninput = recalc; });
    recalc();

    document.getElementById('growth-outlook-reset').onclick = () => {
      [revenueInput, cogsInput, gpMarginInput, wagesInput, opexInput, otherIncomeInput, netProfitInput].filter(Boolean).forEach((el) => { el.value = 0; });
      recalc();
      // Back to "no preference" too, not just zeroed values — a full reset
      // should restore the default open-only-if-there's-something-to-show
      // behaviour, not leave a stale explicit open/closed choice behind.
      growthOutlookState.panelOpen = null;
      scheduleGrowthOutlookSave();
    };

    const toggle = document.getElementById('growth-outlook-toggle');
    const panel = document.getElementById('growth-outlook-panel');
    const openPanel = () => {
      panel.style.display = 'block';
      toggle.querySelector('.chevron').textContent = '▴';
      growthOutlookState.panelOpen = true;
      scheduleGrowthOutlookSave();
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    toggle.onclick = () => {
      const willOpen = panel.style.display === 'none';
      panel.style.display = willOpen ? 'block' : 'none';
      toggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
      growthOutlookState.panelOpen = willOpen;
      scheduleGrowthOutlookSave();
    };
    document.getElementById('growth-outlook-provenance-link').onclick = openPanel;
  }

  const trajectoryRegion = document.getElementById('trajectory-chart-region');
  if (trajectoryRegion) {
    const cadenceSelect = document.getElementById('trajectory-cadence');
    const countSelect = document.getElementById('trajectory-periods-count');
    const loadTrajectory = async () => {
      trajectoryRegion.innerHTML = '<p class="muted plain" style="margin:0;">Loading…</p>';
      const res = await fetch('/.netlify/functions/read-data', {
        method: 'POST',
        body: JSON.stringify({
          action: 'get_growth_trajectory', client_id: currentClientId, period_end: currentPeriodEnd,
          view_cadence: cadenceSelect ? cadenceSelect.value : undefined,
          periods_count: countSelect.value,
        }),
      });
      const trajectory = await res.json();
      trajectoryRegion.innerHTML = renderGrowthTrajectoryChartRegion(trajectory);
    };
    if (cadenceSelect) cadenceSelect.onchange = () => {
      // Relabel "Last N" with the newly selected cadence's unit — the
      // count itself doesn't change, just what it means (4 quarters vs
      // 4 years), so keep the current selection rather than resetting it.
      countSelect.innerHTML = trajectoryPeriodsCountOptionsHtml(cadenceSelect.value, Number(countSelect.value));
      loadTrajectory();
    };
    countSelect.onchange = loadTrajectory;
    loadTrajectory();
  }

  const multipleInput = document.getElementById('valuation-multiple-input');
  if (multipleInput) {
    const amountEl = document.getElementById('valuation-amount');
    const recommendedEl = document.getElementById('valuation-recommended');
    const rationaleEl = document.getElementById('valuation-rationale');
    const ebitdaInput = document.getElementById('valuation-ebitda-input');
    const saveBtn = document.getElementById('valuation-save-btn');
    const saveMsg = document.getElementById('valuation-save-msg');
    const currentEbitda = computeEbitda(snapshot);
    const defaultEbitda = avgEbitda ?? currentEbitda;
    const currentRow = (valuationData?.valuations || []).find((v) => v.period_end === currentPeriodEnd);
    const suggested = valuationData?.suggestedMultiple;
    // Prefer the FRESH recommendation (the backend now fetches one whenever
    // an industry's on file, whether or not this period's already been
    // saved) — falls back to whatever was recorded on the saved row only if
    // a live suggestion isn't available right now (industry cleared since,
    // or the AI call failed).
    const recommendedMultiple = suggested?.suggested_multiple ?? currentRow?.ai_suggested_multiple ?? null;

    recommendedEl.textContent = recommendedMultiple != null
      ? `Recommended multiple: ${recommendedMultiple}x`
      : 'No recommended multiple available — set an industry on this client\'s profile, or enter a custom one below.';
    rationaleEl.textContent = suggested?.rationale ? `🤖 ${suggested.rationale}` : '';

    // Only pre-fill a custom field when a DIFFERENT value was actually
    // chosen before — if what's saved just matches the default (average
    // EBITDA / recommended multiple), leave it blank so the default reads
    // as the active basis rather than looking like a manual override that
    // happens to agree.
    ebitdaInput.value = (currentRow && currentRow.ebitda !== defaultEbitda) ? currentRow.ebitda : '';
    multipleInput.value = (currentRow && currentRow.multiple_used !== recommendedMultiple) ? currentRow.multiple_used : '';

    const effectiveEbitda = () => {
      const custom = Number(ebitdaInput.value || 0);
      return custom > 0 ? custom : (defaultEbitda || 0);
    };
    const effectiveMultiple = () => {
      const custom = Number(multipleInput.value || 0);
      return custom > 0 ? custom : (recommendedMultiple || 0);
    };

    const recalcValuation = () => {
      const ebitdaVal = effectiveEbitda();
      const multiple = effectiveMultiple();
      amountEl.textContent = (ebitdaVal && multiple) ? formatMoney(ebitdaVal * multiple) : '—';
    };
    ebitdaInput.oninput = recalcValuation;
    multipleInput.oninput = recalcValuation;
    recalcValuation();

    saveBtn.onclick = async () => {
      const ebitdaVal = effectiveEbitda();
      const multiple = effectiveMultiple();
      if (!ebitdaVal || !multiple) { alert('Need both an EBITDA figure and a multiple — enter custom values if the defaults aren\'t available.'); return; }
      saveBtn.disabled = true;
      saveMsg.textContent = 'Saving…';
      try {
        const res = await fetch('/.netlify/functions/manual-entry', {
          method: 'POST',
          body: JSON.stringify({ type: 'save_valuation', client_id: currentClientId, period_end: currentPeriodEnd, ebitda: ebitdaVal, ai_suggested_multiple: recommendedMultiple, multiple_used: multiple }),
        });
        const data2 = await res.json();
        if (data2.error) throw new Error(data2.error);
        saveMsg.textContent = '✓ saved';
      } catch (err) {
        saveMsg.textContent = 'error';
        alert('Error: ' + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    };
  }
}

// ---- Owner Wealth: Input & Analyse ----
// Personal net worth — super/investments/property/other/debt as actual
// numbers, distinct from the Goals domain's "Owner Goals" (intentions, not
// figures). See owner-wealth-domain-build-spec.md. Deliberately no pillar
// score wired for this — scorePillar's default:return 6 still covers
// 'owner_wealth' (analyze.js), since what net worth number counts as "good"
// depends on age/goals/circumstances this app doesn't know.

// A custom box's own items sum to a plain magnitude — this folds that
// magnitude into the net worth total using its asset/liability sign, so an
// asset-type box adds and a liability-type box subtracts, same as the
// built-in buckets do implicitly.
function sumOwnerCustomBucketsNet(customBuckets) {
  if (!Array.isArray(customBuckets) || !customBuckets.length) return 0;
  return customBuckets.reduce((sum, b) => {
    const bucketTotal = (b.items || []).reduce((s, it) => s + (Number(it.value) || 0), 0);
    return sum + (b.type === 'liability' ? -bucketTotal : bucketTotal);
  }, 0);
}

function computeNetWorthTotal(wealth) {
  if (!wealth) return null;
  const fields = ['super_balance', 'investments', 'property', 'other_assets', 'debt'];
  const hasCustom = Array.isArray(wealth.custom_buckets) && wealth.custom_buckets.some((b) => (b.items || []).length);
  if (fields.every((f) => wealth[f] == null) && !hasCustom) return null; // nothing entered yet
  return (wealth.super_balance || 0) + (wealth.investments || 0) + (wealth.property || 0) + (wealth.other_assets || 0) - (wealth.debt || 0) + sumOwnerCustomBucketsNet(wealth.custom_buckets);
}

// Business equity is read live off business_valuations (Growth domain), not
// stored on owner_wealth_snapshots — so the two figures can never drift out
// of sync with each other. Hides cleanly if no Valuation's ever been saved.
// Boxed like the other buckets for visual consistency, but deliberately
// NOT summed into computeNetWorthTotal — it's an indicative estimate tied
// to assumptions set in a different domain (Growth → Valuation's AI-
// suggested or custom multiple), not a firm figure entered here. Folding it
// into the headline total would mean that number silently shifts whenever
// someone tweaks a valuation assumption elsewhere — kept visible but
// explicitly separate instead.
function renderBusinessEquityTile(latestValuation) {
  if (!latestValuation) return '';
  // Clickable — jumps to Growth → Valuation, where this figure is actually
  // edited (it's read-only here by design, see the comment on
  // computeNetWorthTotal's caller). Same "click a number, land where it's
  // entered" pattern as the ow-jump-tile net worth tiles above.
  // Unboxed here — the caller (renderOwnerAnalyse) always wraps this in its
  // own bordered container alongside the trend chart, so this only needs to
  // be the row content, not its own nested box.
  return `
    <div class="cash-item" id="ow-business-equity-jump" title="Click to edit in Growth → Valuation" style="cursor:pointer; padding:0;">
      <span class="cash-item-label" style="font-size:13px;">Business equity <span class="sub">as of ${formatShortDate(latestValuation.period_end)} · not in total</span></span>
      <span class="cash-item-amount" style="font-family:var(--font-mono); font-size:14px;">${formatMoney(latestValuation.valuation_amount)}</span>
    </div>
    <p style="font-size:10px; color:var(--ink-soft); margin:6px 0 0; font-style:italic;">Indicative estimate carried over from Growth → Valuation, not a formal valuation.</p>
  `;
}

let ownerRetirementState = {
  // yearsTouched stays false until the accountant actually edits "Project
  // forward (years)" — recalcRetirement() reads yearsInput.value on every
  // call, including its initial silent run on mount, and that input's
  // displayed value is already the succession/horizon default (see
  // displayedYears in renderOwnerRetirementCard) even when years itself is
  // still conceptually untouched. Without this flag, that first read bakes
  // the default into years as if it were a real edit, so a later re-render
  // (navigating away and back, no page reload needed) sees years !== 0 and
  // wrongly reopens the Assumptions panel it should still consider closed.
  years: 0, yearsTouched: false, growthSuper: 0, growthInvestments: 0, growthProperty: 0, growthOther: 0, desiredIncome: 0, withdrawalRate: 4,
  // Lets the target be typed directly instead of derived from income and
  // withdrawal rate — takes over whenever it's non-zero.
  targetOverride: 0,
  // Feeds both the drawdown check and the growth-adjusted target below —
  // a separate rate from the pre-retirement per-bucket rates above, since
  // post-retirement the money is usually one combined, more conservatively
  // invested balance, not four buckets each still compounding at their old
  // rates.
  postRetirementGrowth: 0,
  // How many years the money needs to last. Filling this in (alongside
  // desired income and the growth rate above) switches the target from the
  // flat income/withdrawal-rate divisor to a proper present-value
  // calculation — the flat divisor implicitly assumes the money needs to
  // last forever, which overstates what's actually required for a
  // specific-length retirement funded partly by ongoing growth.
  retirementYears: 0,
  // Business equity is deliberately excluded from the real Net Worth total
  // above (it's an indicative EBITDA×multiple estimate, not cash) — this
  // opts it into the retirement projection specifically, for owners who
  // genuinely plan to fund retirement off a business sale. Off by default
  // so nothing changes unless asked for. Held flat, never compounded — no
  // growth rate exists for a rough valuation estimate, and compounding an
  // already-rough number would stack uncertainty on uncertainty.
  includeBusinessEquity: false,
  // A one-off change is a lump sum landing at a specific year within the
  // projection — an inheritance into Super in year 3, a deposit drawn from
  // Property in year 6 — as opposed to the steady per-bucket growth rate
  // above it, which assumes nothing but compounding ever touches the
  // balance. Keyed by bucket so each change knows which rate it compounds
  // at from the point it lands.
  oneOffs: { super: [], investments: [], property: [], other: [], debt: [] },
};

const OWNER_RETIREMENT_BUCKETS = ['super', 'investments', 'property', 'other', 'debt'];

// A small FIXED personal checklist — distinct from Goals' exit_succession
// category, which covers who takes over the business and when. This is
// the more personal question: is the paperwork actually in place. No AI
// generation, no DB-seeded question bank — just a handful of items defined
// right here, matching this project's other genuinely-simple checklists
// rather than reusing the much heavier Industry Risk Checklist / Business
// Risk Questionnaire machinery (AI synthesis, resurface logic, question
// banks) built for a different job.
// badge/badgeVariant is a plain-English steer, not advice — same spirit as
// the app's other "general estimate, not verified" caveats, and reuses the
// existing .confidence-badge pill (🟢/🟡 Calculated/Estimated elsewhere)
// rather than inventing a new badge style. Two of these are close to
// universal (will, EPOA); two are genuinely conditional on business
// structure, not a lower-priority version of the same thing — worth a
// distinct, scannable badge instead of a sentence you have to read to
// find out, and instead of implying every "No" is equally urgent.
const OWNER_ESTATE_CHECKLIST_ITEMS = [
  { key: 'will', label: 'Will up to date', why: 'See a solicitor and get a will drafted or updated — without a valid one, the estate is distributed under intestacy rules, not necessarily what the owner would have wanted.' },
  { key: 'epoa', label: 'Enduring Power of Attorney in place', why: 'Set up an Enduring Power of Attorney with a solicitor now, while the owner is able to grant it — without one, family faces a costly, slow court process just to manage the owner\'s affairs, including the business, if they become incapacitated.' },
  { key: 'buy_sell_agreement', label: 'Buy-sell agreement in place (funds the business succession)', why: 'Worth raising with a solicitor — not a clear "get one" the way a will is. A buy-sell agreement lets remaining owners buy out one who dies or leaves instead of negotiating it under pressure, but whether it\'s worth setting up depends on things this checklist doesn\'t know: cost, what the co-owners actually want, and whether another arrangement already covers it.' },
  { key: 'key_person_insurance', label: 'Key-person insurance in place', why: 'Worth raising with an insurance broker or adviser — not a clear "get one" the way a will is. A policy can fund a buy-sell agreement or cover the disruption of losing the owner, but whether it\'s worth the premium depends on cost versus how much the business actually relies on that one person.' },
];

// Will and EPOA are never conditional on the business — every individual
// needs them personally, whether or not they run a business at all, so
// they're always applicable regardless of structure. Buy-sell and
// key-person insurance only matter when there's a co-owner to actually buy
// out (or insure against losing) — a sole trader has no one to buy them
// out, so it's genuinely not applicable there, not just unanswered.
// entity_type (Profile) only tells us the LEGAL structure, not
// headcount, so this can only be confident in one direction: "Sole
// trader" definitionally means no co-owner (not applicable); "Partnership"
// definitionally means more than one (applicable); Company/Trust/Other/
// unset could honestly be either, so this returns null rather than
// guessing — same "exclude the unknown, don't guess" principle used
// throughout Owner & Succession's scoring.
function ownerEstateItemApplicability(key, entityType) {
  if (key !== 'buy_sell_agreement' && key !== 'key_person_insurance') return true;
  if (entityType === 'Sole trader') return false;
  if (entityType === 'Partnership') return true;
  return null;
}

function ownerEstateItemBadge(key, entityType) {
  const applicable = ownerEstateItemApplicability(key, entityType);
  if (applicable === false) return { badge: 'Not applicable', badgeVariant: 'neutral' };
  if (applicable === null) return { badge: 'Conditional', badgeVariant: 'neutral' };
  return { badge: 'Required', badgeVariant: 'yellow' };
}

// Editable version — Owner Wealth → Input. One select (Unknown/Yes/No) +
// one optional note per item, same shell (.cash-item row) as the net worth
// item rows above, just without a remove button since the list is fixed.
// priorAnswers: { [key]: { status, notes, periodEnd } } — a real (non-
// "unknown") answer found on the nearest earlier period that actually
// answered THIS item, built by buildPriorAnswerMap. Per-item rather than
// "does this whole period have a saved checklist" (the old approach):
// this period can already have its own row (even one that's mostly
// "Unknown") without every individual item in it ever having had a real
// answer anywhere else — e.g. Will answered fresh this period while EPOA
// has never been anything but Unknown here, even though an earlier period
// does have a real EPOA answer on file.
function renderOwnerEstateChecklistInput(checklist, entityType, priorAnswers) {
  const byKey = Object.fromEntries((checklist || []).map((it) => [it.key, it]));
  return `
    <div style="margin-top:18px; padding-top:14px; border-top:1px solid var(--line);">
      <p class="muted">Estate planning checklist</p>
      <p class="muted plain" style="margin:0 0 10px;">Personal paperwork, not the business exit plan itself — that's tracked in Goals → Exit &amp; Succession.</p>
      ${OWNER_ESTATE_CHECKLIST_ITEMS.map((item) => {
        const saved = byKey[item.key];
        const prior = (!saved?.status || saved.status === 'unknown') ? priorAnswers?.[item.key] : null;
        const it = prior ? { status: prior.status, notes: saved?.notes ?? prior.notes } : (saved || {});
        const applicable = ownerEstateItemApplicability(item.key, entityType);
        const { badge, badgeVariant } = ownerEstateItemBadge(item.key, entityType);
        const naNote = applicable === false ? 'Not applicable — a sole trader has no co-owner to buy out or insure against, so this is marked automatically. Still editable if the actual circumstances differ.' : null;
        return `
          <div data-estate-key="${item.key}" style="padding:8px 0; border-bottom:1px solid var(--line); ${applicable === false ? 'opacity:0.7;' : ''}">
            <div class="cash-item" style="align-items:flex-start; padding:0;">
              <span class="cash-item-label" style="font-size:13px; flex:1; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">${item.label} <span class="confidence-badge ${badgeVariant}">${badge}</span>${prior ? `<span class="confidence-badge yellow" title="Carried forward from ${formatShortDate(prior.periodEnd)} — confirm or update">↺ ${formatShortDate(prior.periodEnd)}</span>` : ''}</span>
              <select class="ow-estate-status" style="font-size:12px; font-family:var(--font-body); border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); color:var(--ink); padding:6px 8px; margin-right:6px;">
                <option value="unknown" ${(!it.status || it.status === 'unknown') ? 'selected' : ''}>Unknown</option>
                <option value="yes" ${it.status === 'yes' ? 'selected' : ''}>Yes</option>
                <option value="no" ${it.status === 'no' ? 'selected' : ''}>No</option>
              </select>
              <input type="text" class="ow-estate-notes" placeholder="Note (optional)" value="${escAttr(it.notes || '')}" style="flex:1; border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); font-size:12px; font-family:var(--font-body); color:var(--ink); padding:6px 8px;" />
            </div>
            <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0; font-style:italic;">${naNote || item.why}</p>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// The 5 genuinely-new exit readiness questions — the other 5 factors in
// the 10-factor score (owner dependence, key employee dependence, customer
// concentration, processes documented, profitability) are all reused from
// data already on file elsewhere (Business Risk Q, pillar scoring) rather
// than re-asked here. Mirrors OWNER_EXIT_READINESS_ITEMS in
// lib/owner-wealth-risk-sync.js — see that file's header note on why this
// is duplicated rather than shared.
const OWNER_EXIT_READINESS_ITEMS = [
  { key: 'recurring_revenue', label: 'Meaningful recurring/contracted revenue', why: 'A buyer pays more for revenue they can count on continuing — one-off/project work gets discounted harder.' },
  { key: 'management_depth', label: 'Management layer below the owner', why: 'Without one, the business is only worth what a buyer thinks THEY could run it for — not what it earns today.' },
  { key: 'ip_protection', label: 'Key IP/brand/systems legally protected', why: 'Unprotected IP or an unregistered brand is a risk a buyer prices in, or a reason to walk away.' },

// Set by an Analyse tile jump right before switching to Input, so that one
// render opens just the clicked bucket instead of every bucket at once —
// consumed and cleared by the jump handler itself once it's done scrolling.
// Left null for any other way of reaching Input, which opens everything.
let ownerInputFocusBucket = null;

// A one-off lands "year" years from now and compounds at the bucket's rate
// for whatever's left of the horizon after that — a change scheduled at or
// past the horizon just lands at face value with no further growth, rather
// than erroring or being silently dropped.
function compoundWithOneOffs(startAmount, ratePct, years, oneOffs) {
  const rate = 1 + (ratePct / 100);
  let amount = (startAmount || 0) * Math.pow(rate, years);
  (oneOffs || []).forEach((o) => {
    const yearsRemaining = Math.max(0, years - (Number(o.year) || 0));
    amount += (Number(o.amount) || 0) * Math.pow(rate, yearsRemaining);
  });
  return amount;
}

// Each asset bucket compounds at its OWN rate rather than one blended rate
// (chosen deliberately over the simpler option — property/super/investments
// genuinely grow differently), plus whatever one-off changes were entered
// for it. Debt has no growth rate of its own — held flat, not projected
// forward — so a one-off change to it (an extra repayment, a new loan) is
// just added at face value rather than compounded. Custom boxes get the
// same flat treatment as debt for the same reason — no growth rate was
// ever collected for them, so pretending to model their growth would be a
// fabricated assumption; they're just carried through at today's value
// with their asset/liability sign applied.
function projectOwnerRetirementOutlook(wealth, years, growthSuper, growthInvestments, growthProperty, growthOther, desiredIncome, withdrawalRate, oneOffs, businessEquity = 0) {
  const oo = oneOffs || {};
  const projectedSuper = compoundWithOneOffs(wealth.super_balance, growthSuper, years, oo.super);
  const projectedInvestments = compoundWithOneOffs(wealth.investments, growthInvestments, years, oo.investments);
  const projectedProperty = compoundWithOneOffs(wealth.property, growthProperty, years, oo.property);
  const projectedOther = compoundWithOneOffs(wealth.other_assets, growthOther, years, oo.other);
  const debtOneOffTotal = (oo.debt || []).reduce((sum, o) => sum + (Number(o.amount) || 0), 0);
  const projectedDebt = (wealth.debt || 0) + debtOneOffTotal;
  const customNet = sumOwnerCustomBucketsNet(wealth.custom_buckets);
  const projectedAssets = projectedSuper + projectedInvestments + projectedProperty + projectedOther;
  // Business equity, when opted in, is added flat — same treatment as
  // custom boxes and debt one-offs, and for the same reason: no growth
  // rate exists for a rough indicative valuation, so it isn't compounded.
  const projectedNetWorth = projectedAssets - projectedDebt + customNet + (businessEquity || 0);
  const targetNestEgg = withdrawalRate > 0 ? desiredIncome / (withdrawalRate / 100) : null;
  const gap = targetNestEgg != null ? projectedNetWorth - targetNestEgg : null;
  return { projectedNetWorth, targetNestEgg, gap, projectedSuper, projectedInvestments, projectedProperty, projectedOther, projectedDebt, customNet, businessEquity: businessEquity || 0 };
}

// Answers "how long would this actually take" as a companion to the manual
// years input above, which only answers "am I on track BY year N." One-off
// changes are already pinned to specific years, so a yearly step matches
// their granularity exactly — no need for anything finer. Capped so a
// target that's unreachable at these rates (e.g. all growth rates left at
// 0%) doesn't loop forever.
function solveOwnerYearsToTarget(wealth, growthSuper, growthInvestments, growthProperty, growthOther, oneOffs, target, businessEquity = 0, maxYears = 60) {
  if (target == null || target <= 0) return null;
  for (let y = 0; y <= maxYears; y++) {
    const r = projectOwnerRetirementOutlook(wealth, y, growthSuper, growthInvestments, growthProperty, growthOther, 0, 0, oneOffs, businessEquity);
    if (r.projectedNetWorth >= target) return y;
  }
  return null;
}

// Tests the withdrawal-rate assumption directly instead of trusting it —
// the 4%-rule target (income / withdrawal rate) is a rule of thumb that
// only holds up if post-retirement investment growth roughly keeps pace
// with withdrawals; this simulates it year by year to check. Withdrawal
// happens first each year (you need to live on it), then the remainder
// grows — standard drawdown-modeling order. Capped at 100 years; still
// positive at the cap is reported as "lasts indefinitely" rather than a
// specific number, since nothing this simple should claim century-scale
// precision.
function simulateDrawdownYears(startBalance, annualWithdrawal, growthRatePct, maxYears = 100) {
  if (startBalance == null || startBalance <= 0 || annualWithdrawal <= 0) return null;
  let balance = startBalance;
  const rate = 1 + (growthRatePct / 100);
  for (let y = 1; y <= maxYears; y++) {
    balance = (balance - annualWithdrawal) * rate;
    if (balance <= 0) return y;
  }
  return null; // still standing after maxYears — treated as "lasts indefinitely"
}

// Present-value-of-an-annuity: how big a starting balance is actually
// needed to fund annualWithdrawal for a specific number of years, given the
// balance keeps earning growthRatePct while it's drawn down. More accurate
// than the flat income/withdrawal-rate divisor, which implicitly assumes
// the money needs to last indefinitely — this instead answers "how much do
// I need for exactly N years," which is usually a smaller number once
// ongoing growth is accounted for. growthRatePct of 0 degrades to the
// trivial case (no growth → need exactly N years of withdrawals).
function solveRequiredPrincipal(annualWithdrawal, growthRatePct, years) {
  if (annualWithdrawal <= 0 || years <= 0) return null;
  if (Math.abs(growthRatePct) < 1e-9) return annualWithdrawal * years;
  const r = 1 + (growthRatePct / 100);
  return annualWithdrawal * (Math.pow(r, years) - 1) / (Math.pow(r, years - 1) * (r - 1));
}
