async function renderRiskBrief(content, openDetail) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot from Financial Performance → Input first.</p></div>`;
    return;
  }
  const riskData = await callRead('get_risk_items', currentClientId, currentPeriodEnd);
  if (myToken !== renderToken) return;
  const rollup = computeRiskRollup(riskData?.financial || [], riskData?.business || [], riskData?.industry || [], riskData?.owner_wealth || []);
  // Ranked by the same impact/urgency/ease scoring "This period's
  // priorities" and every other domain's "What to do" already use (see
  // scoreFlag), not just High-bucket-then-Medium-bucket insertion order —
  // that raw order had nothing to do with which risks actually mattered
  // most, which is how a Watch-status "Will up to date" outranked an
  // industry risk with real urgency behind it. One ranked list now, not
  // two disagreeing ones (this used to also render a separately-ranked,
  // domain-filtered "What to do" card via getDomainCandidateRanking('risk')
  // — dropped, since it silently excludes owner_wealth-sourced risks
  // (routed to the Owner domain instead, see PILLAR_TO_DOMAIN) and so could
  // never agree with a Top risks list built from Risk Review's full
  // population. talkingPoint reuses normalizeRiskItemToFlagShape's own
  // fallback chain (ownerWealthTalkingPoint / FINANCIAL_RISK_TALKING_POINT)
  // rather than raw r.recommendation, which is null for most financial/
  // owner_wealth rows even though a real talking point exists for them.
  const topRisks = [...rollup.buckets.High, ...rollup.buckets.Medium]
    .map((r) => {
      const norm = normalizeRiskItemToFlagShape(r);
      return { ...r, talkingPoint: norm.talkingPoint, priorityScore: scoreFlag(norm).priorityScore };
    })
    .sort((a, b) => b.priorityScore - a.priorityScore);
  const soWhat = topRisks.length
    ? `${topRisks.length} active risk${topRisks.length === 1 ? '' : 's'} this period — most worth raising: ${topRisks[0].risk_name}.`
    : 'Nothing active on the risk register this period.';

  content.innerHTML = `
    <div class="card">
      <p class="brief-sowhat">${soWhat}</p>
      <div class="brief-figures">
        <button type="button" class="cash-net-stat" data-risk-tile="High" title="Click to see these risks"><div class="v">${rollup.buckets.High.length}</div><div class="l">High priority</div></button>
        <button type="button" class="cash-net-stat" data-risk-tile="Medium" title="Click to see these risks"><div class="v">${rollup.buckets.Medium.length}</div><div class="l">Medium priority</div></button>
        <button type="button" class="cash-net-stat" data-risk-tile="Managed" title="Click to see these risks"><div class="v">${rollup.managed.length}</div><div class="l">Managed / resolved</div></button>
      </div>
    </div>
    ${topRisks.length ? `
      <div class="card">
        <p class="muted">Top risks</p>
        ${topRisks.slice(0, 3).map((r) => {
          const actionText = r.talkingPoint ? `${r.risk_name} — ${r.talkingPoint}` : r.risk_name;
          return `
          <div class="flag-row-wrap">
            <div class="flag-row goal-row-jump" data-risk-row-name="${escAttr(r.risk_name)}" title="Click to open this risk" style="cursor:pointer;">
              <span class="flag-dot ${r.severity === 'High' ? 'rust' : 'sage'}"></span><b>${escAttr(r.risk_name)}</b> <span class="muted plain">— ${escAttr((RISK_SOURCE_META[r.source] || {}).label || r.source)}${r.category && r.category !== r.source ? ' · ' + escAttr(businessCategoryLabel(r.category)) : ''}</span>
            </div>
            ${r.detail ? `<p class="muted plain" style="margin:4px 0 0 20px; font-size:12.5px; line-height:1.5;">${escAttr(r.detail)}</p>` : ''}
            ${r.talkingPoint ? `<p class="muted plain" style="margin:2px 0 0 20px; font-size:12.5px; line-height:1.5;"><b>Recommended:</b> ${escAttr(r.talkingPoint)}</p>` : ''}
            <div class="toggle-row" style="padding-left:20px; margin:6px 0;">
              ${addToActionsButtonHtml(actionText, meetingPriorityToActionPriority(r.severity), 'diagnose', null)}
            </div>
            <div style="padding-left:20px; margin-bottom:10px;">${riskAdviceButtonHtml(r)}</div>
          </div>
        `;
        }).join('')}
      </div>
    ` : ''}
    ${briefDetailLinkHtml('risk-brief-detail-btn', 'Risk')}
  `;
  content.querySelectorAll('[data-risk-tile]').forEach((btn) => {
    btn.onclick = () => {
      pendingRiskFilterLevel = btn.dataset.riskTile;
      jumpToMeetingStepDetail('risk');
    };
  });
  content.querySelectorAll('[data-risk-row-name]').forEach((row) => {
    row.onclick = () => {
      pendingRiskScrollName = row.dataset.riskRowName;
      jumpToMeetingStepDetail('risk');
    };
  });
  wireBriefWhatToDoHtml(content);
  document.getElementById('risk-brief-detail-btn').onclick = openDetail;
}

// Goals & Objectives brief — a different compression strategy from the
// other four (see meeting-intelligence-build-spec.md §3a): Goals isn't a
// ratio with a delta, it's an open-ended per-category list, so the
// compression is "surface only what's still genuinely open"
// (needs_review, same flag renderGoalsInput's own "reconsider" sets) rather
// than a so-what sentence about a number.
async function renderGoalsBrief(content, openDetail) {
  const myToken = renderToken;
  const ctx = await callRead('get_context', currentClientId);
  if (myToken !== renderToken) return;
  const goals = ctx?.owner_goals || {};
  const extra = ctx?.profile_extra || {};
  if (!currentPeriodEnd) {
    content.innerHTML = renderObjectiveCard(extra) + `<div class="card placeholder"><p class="muted">No period yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot first.</p></div>`;
    wireObjectiveCard(extra);
    return;
  }
  const hidden = goals.hidden_categories || [];
  const categories = [...GOAL_CATEGORIES.filter((c) => !hidden.includes(c.key)), ...(goals.custom_categories || [])];

  const achieved = [];
  const needsReview = [];
  const settled = [];
  categories.forEach((cat) => {
    resolveGoalList(goals, currentPeriodEnd, cat.key).forEach((it) => {
      if (it.done) { achieved.push({ ...it, cat }); return; }
      if (it.carried || it.needs_review) needsReview.push({ ...it, cat });
      else settled.push({ ...it, cat });
    });
  });
  const achievedCount = achieved.length;
  const openCount = needsReview.length + settled.length;
  const soWhat = openCount === 0
    ? 'No open goals recorded yet for this period.'
    : `${openCount} open goal${openCount === 1 ? '' : 's'} across ${categories.length} categor${categories.length === 1 ? 'y' : 'ies'} — ${needsReview.length ? `${needsReview.length} flagged for a fresh look this period.` : 'all already reconfirmed this period.'}`;

  // Each stat tile below is clickable (data-goals-tile) and expands the
  // matching list inline rather than always showing everything — the
  // "settled" list in particular can run long once a client has years of
  // goals, so it's collapsed by default and pulled up on demand instead of
  // pushing the flagged items (the ones that actually need a decision this
  // meeting) further down the brief.
  //
  // Grouped by category (not by flagged/settled/achieved status) so the
  // list reads the way the meeting actually runs — category by category —
  // with the dot colour, not a separate section, carrying "still true?" vs
  // already-settled. Each row is itself clickable (.goal-row-jump): it
  // flips straight to that goal's own card in the full Goals & Objectives
  // view (see pendingGoalJumpId / renderGoalsInput's jump-and-flash below)
  // instead of leaving the accountant to go find it themselves.
  // Quick actions right on the row — confirm, edit, mark done, reopen —
  // mirroring the same buttons renderGoalsInput's cards already have, so
  // acting on a flagged goal doesn't require leaving the meeting brief at
  // all. Only "Something's changed" needs actual typing, so that one reveals
  // its own small inline textarea (same idea as the full detail view's
  // goal-edit-box) rather than a text prompt.
  const goalRowHtml = (it) => {
    const flagged = it.carried || it.needs_review;
    const isDone = !!it.done;
    const dotClass = isDone || !flagged ? 'sage' : 'rust';
    const actionsHtml = isDone
      ? `<button type="button" class="mini-link" data-brief-goal-action="reopen" data-cat="${it.cat.key}" data-id="${it.id}">reopen</button>`
      : flagged
        ? `<button type="button" class="toggle-btn confirm" data-brief-goal-action="confirm" data-cat="${it.cat.key}" data-id="${it.id}">✓ Still true</button>
           <button type="button" class="toggle-btn changed" data-brief-goal-edit="${it.id}">Something's changed</button>
           <button type="button" class="mini-link" data-brief-goal-action="done" data-cat="${it.cat.key}" data-id="${it.id}">done</button>`
        : `<button type="button" class="mini-link" data-brief-goal-action="done" data-cat="${it.cat.key}" data-id="${it.id}">done</button>`;
    // No element ids here on purpose — the exact same goal can appear twice
    // at once (e.g. a flagged item shows in both the "flagged" and "open"
    // bodies), which would mean two elements sharing one id. getElementById
    // would then always resolve to whichever copy comes first in the DOM —
    // possibly the hidden one — so the edit box and textarea are found via
    // closest()/querySelector scoped to this row's own wrapper instead (see
    // the click handlers below).
    return `
      <div class="flag-row-wrap goal-row-block">
        <div class="flag-row goal-row-jump" data-id="${it.id}" title="Click to open this goal in full detail">
          <span class="flag-dot ${dotClass}"></span>
          <span style="flex:1;">${escAttr(it.text)}</span>
        </div>
        <div class="toggle-row" style="padding-left:18px; margin:0 0 6px;">${actionsHtml}</div>
        <div class="goal-edit-box" style="display:none; margin:0 0 8px 18px;">
          <textarea rows="3">${it.text}</textarea>
          <button type="button" class="action" style="margin-top:6px;" data-brief-goal-save="1" data-cat="${it.cat.key}" data-id="${it.id}">Save goal</button>
        </div>
      </div>
    `;
  };
  // Each category's rows sit inside their own .goal-cat-group wrapper so the
  // filter pills below can hide whole categories at once (data-cat-key) —
  // useful once "open" is pulling from all 5 categories at once and a
  // meeting is only working through one of them right now.
  const byCategoryHtml = (items) => {
    if (!items.length) return `<p class="muted plain" style="margin:0;">Nothing here yet.</p>`;
    const groups = categories.map((cat) => {
      const catItems = items.filter((it) => it.cat.key === cat.key);
      if (!catItems.length) return '';
      return `<div class="goal-cat-group" data-cat-key="${cat.key}"><p class="goal-cat-heading">${cat.label}</p>${catItems.map(goalRowHtml).join('')}</div>`;
    }).join('');
    return groups || `<p class="muted plain" style="margin:0;">Nothing here yet.</p>`;
  };
  const flaggedRowsHtml = byCategoryHtml(needsReview);
  const openRowsHtml = byCategoryHtml([...needsReview, ...settled]);
  const achievedRowsHtml = byCategoryHtml(achieved);
  // Counts start at the "open" tile's numbers (the default tile once the
  // pills exist at all) — updateCatFilterCounts recomputes them for whichever
  // tile is actually expanded, since "open"/"achieved"/"flagged" each pull
  // from a different item set and one shared pill row sits under all three.
  const openTileItems = [...needsReview, ...settled];
  const catFilterPillsHtml = categories.length > 1 ? `
    <div class="goal-cat-filter-row" id="goals-cat-filter-row" style="display:none;">
      <button type="button" class="risk-filter-pill active" data-goals-cat-filter="all">All <span class="risk-filter-count">(${openTileItems.length})</span></button>
      ${categories.map((cat) => `<button type="button" class="risk-filter-pill" data-goals-cat-filter="${cat.key}">${cat.label} <span class="risk-filter-count">(${openTileItems.filter((it) => it.cat.key === cat.key).length})</span></button>`).join('')}
    </div>
  ` : '';

  content.innerHTML = `
    ${renderObjectiveCard(extra)}
    <div class="card">
      <p class="brief-sowhat">${soWhat}</p>
      <div class="brief-figures">
        <button type="button" class="cash-net-stat" data-goals-tile="open"><div class="v">${openCount}</div><div class="l">Open goals, ${categories.length} categories</div></button>
        <button type="button" class="cash-net-stat" data-goals-tile="achieved"><div class="v">${achievedCount}</div><div class="l">Achieved this period</div></button>
        <button type="button" class="cash-net-stat" data-goals-tile="flagged"><div class="v">${needsReview.length}</div><div class="l">Flagged — needs review</div></button>
      </div>
      ${catFilterPillsHtml}
      <div id="goals-brief-body-flagged" style="display:none; margin-top:12px;">
        ${flaggedRowsHtml}
      </div>
      <div id="goals-brief-body-open" style="display:none; margin-top:12px;">
        ${openRowsHtml}
      </div>
      <div id="goals-brief-body-achieved" style="display:none; margin-top:12px;">
        ${achievedRowsHtml}
      </div>
    </div>
    ${briefDetailLinkHtml('goals-brief-detail-btn', 'Goals & Objectives')}
  `;
  wireObjectiveCard(extra);

  function updateCatFilterRowVisibility() {
    const filterRow = document.getElementById('goals-cat-filter-row');
    if (!filterRow) return;
    const anyOpen = ['open', 'achieved', 'flagged'].some((k) => document.getElementById(`goals-brief-body-${k}`).style.display === 'block');
    filterRow.style.display = anyOpen ? 'flex' : 'none';
  }
  function applyGoalsCategoryFilter() {
    // The divider between categories (.goal-cat-group's own border-top) is
    // suppressed on whichever group is first VISIBLE, not just the DOM-first
    // one — otherwise filtering down to a single category left it with a
    // stray line above it, left over from categories that used to precede it
    // before they got hidden.
    ['open', 'achieved', 'flagged'].forEach((tileKey) => {
      const body = document.getElementById(`goals-brief-body-${tileKey}`);
      if (!body) return;
      let firstVisible = true;
      body.querySelectorAll('.goal-cat-group').forEach((g) => {
        const show = goalsBriefCategoryFilter === 'all' || g.dataset.catKey === goalsBriefCategoryFilter;
        g.style.display = show ? '' : 'none';
        g.classList.toggle('is-first-visible', show && firstVisible);
        if (show) firstVisible = false;
      });
    });
  }
  // One shared pill row sits under all three tiles, but "open"/"achieved"/
  // "flagged" each pull from a different item set — so the counts on each
  // pill have to be recomputed for whichever tile is actually expanded
  // rather than staying fixed at whatever was true on the initial render.
  function updateCatFilterCounts() {
    const tileItems = goalsBriefExpandedTile === 'flagged' ? needsReview
      : goalsBriefExpandedTile === 'achieved' ? achieved
      : [...needsReview, ...settled];
    content.querySelectorAll('[data-goals-cat-filter]').forEach((pill) => {
      const key = pill.dataset.goalsCatFilter;
      const span = pill.querySelector('.risk-filter-count');
      if (!span) return;
      span.textContent = `(${key === 'all' ? tileItems.length : tileItems.filter((it) => it.cat.key === key).length})`;
    });
  }

  content.querySelectorAll('[data-goals-tile]').forEach((btn) => {
    btn.onclick = () => {
      const key = btn.dataset.goalsTile;
      const body = document.getElementById(`goals-brief-body-${key}`);
      const wasOpen = body.style.display === 'block';
      ['open', 'achieved', 'flagged'].forEach((k) => { document.getElementById(`goals-brief-body-${k}`).style.display = 'none'; });
      if (!wasOpen) {
        body.style.display = 'block';
        goalsBriefExpandedTile = key;
        body.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        goalsBriefExpandedTile = null;
      }
      updateCatFilterCounts();
      updateCatFilterRowVisibility();
    };
  });
  content.querySelectorAll('[data-goals-cat-filter]').forEach((pill) => {
    pill.onclick = () => {
      goalsBriefCategoryFilter = pill.dataset.goalsCatFilter;
      content.querySelectorAll('[data-goals-cat-filter]').forEach((p) => p.classList.toggle('active', p === pill));
      applyGoalsCategoryFilter();
    };
  });
  content.querySelectorAll('.goal-row-jump').forEach((row) => {
    row.onclick = () => {
      pendingGoalJumpId = row.dataset.id;
      goalsBriefScrollToId = row.dataset.id;
      openDetail();
    };
  });

  // Same merge-one-item-into-the-saved-array shape as renderGoalsInput's own
  // upsertGoalItem, just without a local cache to keep in sync — every
  // action here re-renders this whole brief from a fresh get_context read
  // straight afterward, so there's nothing else to update by hand.
  async function briefUpsertGoalItem(catKey, item) {
    const current = (goals.periods?.[currentPeriodEnd]?.cats?.[catKey]?.items || []).filter((it) => it.id !== item.id);
    current.push(item);
    await saveGoalItems(catKey, current);
  }
  content.querySelectorAll('[data-brief-goal-action]').forEach((btn) => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const catKey = btn.dataset.cat;
      const id = btn.dataset.id;
      const action = btn.dataset.briefGoalAction;
      const source = resolveGoalList(goals, currentPeriodEnd, catKey).find((it) => it.id === id) || {};
      const now = new Date().toISOString();
      btn.disabled = true;
      try {
        if (action === 'confirm') {
          await briefUpsertGoalItem(catKey, { ...source, carried: undefined, sourcePeriod: undefined, needs_review: undefined, updated_at: now });
        } else if (action === 'done') {
          await briefUpsertGoalItem(catKey, { ...source, carried: undefined, sourcePeriod: undefined, needs_review: undefined, done: true, updated_at: now });
        } else if (action === 'reopen') {
          // Reopened onto a fresh needs_review flag, not straight to settled —
          // un-achieving something is exactly the "is this still right?"
          // situation needs_review exists for, so it comes back with the same
          // Still true/Something's changed/done choice a newly-flagged item
          // gets, instead of silently landing as already-settled.
          await briefUpsertGoalItem(catKey, { ...source, carried: undefined, sourcePeriod: undefined, needs_review: true, done: false, updated_at: now });
        }
        // "done"/"reopen" move the item to a different tile (Open <-> Achieved)
        // — jump the expanded tile along with it so the just-acted-on goal is
        // still the thing on screen after the refresh, not hidden in a tile
        // nobody asked to see.
        if (action === 'done') goalsBriefExpandedTile = 'achieved';
        if (action === 'reopen') goalsBriefExpandedTile = 'open';
        goalsBriefScrollToId = id;
        renderGoalsBrief(content, openDetail);
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });
  content.querySelectorAll('[data-brief-goal-edit]').forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      // Scoped to this button's own row wrapper, not a global id lookup — the
      // same goal id can render twice at once (flagged items also show under
      // "open"), which would otherwise mean two elements sharing one id and
      // getElementById always resolving to the first (possibly the hidden
      // copy in a tile that isn't even expanded right now).
      const box = btn.closest('.goal-row-block').querySelector('.goal-edit-box');
      const opening = box.style.display === 'none';
      box.style.display = opening ? 'block' : 'none';
      if (opening) box.querySelector('textarea')?.focus();
    };
  });
  content.querySelectorAll('[data-brief-goal-save]').forEach((btn) => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const catKey = btn.dataset.cat;
      const id = btn.dataset.id;
      const newText = btn.closest('.goal-edit-box').querySelector('textarea').value.trim();
      if (!newText) return;
      const source = resolveGoalList(goals, currentPeriodEnd, catKey).find((it) => it.id === id) || {};
      const now = new Date().toISOString();
      btn.disabled = true;
      try {
        // Stays flagged (needs_review: true) rather than settling straight
        // away — editing the text is "here's what actually changed," not a
        // decision that it's fine now, so it should still offer the same
        // Still true/Something's changed/done choice right after saving
        // (same reasoning as reopen). A materially different goal resets its
        // "open since" clock either way.
        await briefUpsertGoalItem(catKey, { ...source, carried: undefined, sourcePeriod: undefined, needs_review: true, text: newText, created_at: now, updated_at: now });
        goalsBriefScrollToId = id;
        renderGoalsBrief(content, openDetail);
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });
  document.getElementById('goals-brief-detail-btn').onclick = openDetail;

  // Restore whatever the accountant had open/filtered/scrolled to before
  // clicking into one goal's full card — "← Back to meeting" re-renders this
  // brief from scratch, and without this it would otherwise dump them back
  // at a collapsed, unfiltered list instead of where they actually were.
  if (goalsBriefExpandedTile) {
    const body = document.getElementById(`goals-brief-body-${goalsBriefExpandedTile}`);
    if (body) body.style.display = 'block';
  }
  if (goalsBriefCategoryFilter !== 'all') {
    content.querySelectorAll('[data-goals-cat-filter]').forEach((p) => p.classList.toggle('active', p.dataset.goalsCatFilter === goalsBriefCategoryFilter));
  }
  applyGoalsCategoryFilter();
  updateCatFilterCounts();
  updateCatFilterRowVisibility();
  if (goalsBriefScrollToId) {
    const rowId = goalsBriefScrollToId;
    goalsBriefScrollToId = null;
    // Scoped to the expanded body specifically — the same goal id can appear
    // in more than one body (e.g. a flagged item shows in both "flagged" and
    // "open"), and only one of those bodies is actually visible right now.
    const scope = goalsBriefExpandedTile ? document.getElementById(`goals-brief-body-${goalsBriefExpandedTile}`) : content;
    const row = scope?.querySelector(`.goal-row-jump[data-id="${rowId}"]`);
    if (row) {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('kpi-card-flash');
      setTimeout(() => row.classList.remove('kpi-card-flash'), 1600);
    }
  }
}

// The topbar's "Framework Summary" — comprehensive, not compressed like
// Overview or the briefs above. Reachable from anywhere (see
// frameworkSummaryOpen in renderMainDispatch), meeting or no meeting — the
// "client calls three weeks later and asks what we said" reference. See
// meeting-intelligence-build-spec.md §7.
async function renderFrameworkSummary(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<button class="mini-link" id="fw-summary-close-btn" type="button" style="margin-bottom:10px;">✕ Close</button><div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot and run analysis first.</p></div>`;
    document.getElementById('fw-summary-close-btn').onclick = () => { frameworkSummaryOpen = false; renderMain(); };
    return;
  }
  const [kpiData, diagnosisData, riskData, valuationData, ctx, allCandidates] = await Promise.all([
    callRead('get_kpi_report', currentClientId, currentPeriodEnd),
    callRead('get_diagnosis', currentClientId, currentPeriodEnd),
    callRead('get_risk_items', currentClientId, currentPeriodEnd),
    callRead('get_valuation_history', currentClientId, currentPeriodEnd),
    callRead('get_context', currentClientId),
    buildMeetingCandidates(),
  ]);
  if (myToken !== renderToken) return;

  const kpis = kpiData?.kpis || [];
  const snapshot = kpiData?.snapshot;
  const rollup = computeRiskRollup(riskData?.financial || [], riskData?.business || [], riskData?.industry || [], riskData?.owner_wealth || []);
  const topRisks = [...rollup.buckets.High, ...rollup.buckets.Medium];
  const latestValuation = (valuationData?.valuations || []).slice(-1)[0];
  const objectiveLabel = CLIENT_OBJECTIVES.find((o) => o.value === ctx?.profile_extra?.major_goal)?.label;

  const todoFor = (domainKey) => allCandidates.filter((c) => PILLAR_TO_DOMAIN[c.pillar] === domainKey);
  const changedKpisFor = (keys) => keys
    .map((key) => kpis.find((k) => k.key === key))
    .filter((k) => k && k.confidence !== 'red' && k.priorValue != null);

  // Collapsible (same .collapsible-section-toggle pattern as Financial
  // Performance's own Metric history/Financial snapshot cards) — collapsed
  // by default, since this page is long by nature (4 domains' worth of
  // detail) and most visits want one section, not all four at once. The
  // "so what" line stays OUTSIDE the collapsible body specifically so a
  // fully-collapsed page still reads as 4 one-line summaries, not 4 empty
  // headers — collapsing hides the figures/changes/to-do detail, never the
  // one thing you'd want at a glance. Nothing here is deleted or hidden
  // permanently, only closed until clicked — still the comprehensive,
  // nothing-hidden version the function's own top comment describes.
  const domainSection = (id, title, soWhat, figuresHtml, changesHtml, todoItems, accentColor) => `
    <div class="card" id="fw-section-${id}" style="border-top:3px solid ${accentColor};">
      <button type="button" class="collapsible-section-toggle" data-section-toggle="1">
        <span class="section-title" style="margin:0; color:${accentColor};">${title}</span>
        <span class="chevron">▾</span>
      </button>
      ${soWhat ? `<p class="brief-sowhat" style="margin-top:8px;">${escAttr(soWhat)}</p>` : ''}
      <div class="fw-section-body" style="margin-top:12px; display:none;">
        ${figuresHtml ? `<div class="brief-figures">${figuresHtml}</div>` : ''}
        ${changesHtml || ''}
        ${todoItems.length ? `<p class="muted" style="margin-top:14px;">What to do</p>${todoItems.map((c) => `<div class="flag-row-wrap"><div class="flag-row"><span class="flag-dot rust"></span>${escAttr(c.message)}</div></div>`).join('')}` : ''}
      </div>
    </div>
  `;

  const financialFigures = `
    <div><div class="v">${snapshot?.cash != null ? formatMoney(snapshot.cash) : '—'}</div><div class="l">Cash on hand</div></div>
    <div><div class="v">${kpis.find((k) => k.key === 'op_cash_conversion')?.value != null ? formatKpi(kpis.find((k) => k.key === 'op_cash_conversion').value, 'percent') : '—'}</div><div class="l">Cash conversion</div></div>
    <div><div class="v">${kpis.find((k) => k.key === 'effective_tax_rate')?.value != null ? formatKpi(kpis.find((k) => k.key === 'effective_tax_rate').value, 'percent') : '—'}</div><div class="l">Effective tax rate</div></div>
  `;
  // Every KPI with a prior value, not just the 3 the brief shows — this
  // screen is deliberately the comprehensive version.
  const financialChanged = changedKpisFor(kpis.map((k) => k.key)).length ? `
    <p class="muted" style="margin-top:14px;">What changed</p>
    ${changedKpisFor(kpis.map((k) => k.key)).map((k) => `<div class="flag-row-wrap"><div class="flag-row"><span style="flex:1;">${escAttr(k.name)}</span><span>${kpiTrendLine(k)}</span></div></div>`).join('')}
  ` : '';

  const growthFigures = `<div><div class="v">${(diagnosisData?.opportunities || []).length}</div><div class="l">Live opportunities</div></div>`;
  const growthOpportunities = (diagnosisData?.opportunities || []).length ? `
    <p class="muted" style="margin-top:14px;">Live opportunities</p>
    ${diagnosisData.opportunities.map((o) => `
      <div class="flag-row-wrap">
        <div class="flag-row"><span class="flag-dot sage"></span><b>${escAttr(o.title)}</b> — ${escAttr(o.impact || '')} <span class="muted plain">(${[o.difficulty, o.timeframe].filter(Boolean).join(', ')})</span></div>
        ${o.takes || o.risk || o.decision ? `
          <div class="muted plain" style="font-size:12px; margin:4px 0 0 20px; line-height:1.5;">
            ${o.takes ? `<div>What it'd take: ${escAttr(o.takes)}</div>` : ''}
            ${o.risk ? `<div>Risk: ${escAttr(o.risk)}</div>` : ''}
            ${o.decision ? `<div>Decision: ${escAttr(o.decision)}</div>` : ''}
          </div>
        ` : ''}
      </div>
    `).join('')}
  ` : '';

  const riskFigures = `
    <div><div class="v">${rollup.buckets.High.length}</div><div class="l">High priority</div></div>
    <div><div class="v">${rollup.buckets.Medium.length}</div><div class="l">Medium priority</div></div>
    <div><div class="v">${rollup.managed.length}</div><div class="l">Managed / resolved</div></div>
  `;
  const riskList = topRisks.length ? `
    <p class="muted" style="margin-top:14px;">Active risks</p>
    ${topRisks.map((r) => `<div class="flag-row-wrap"><div class="flag-row"><span class="flag-dot ${r.severity === 'High' ? 'rust' : 'sage'}"></span><b>${escAttr(r.risk_name)}</b> <span class="muted plain">— ${escAttr(r.source)}/${escAttr(r.category)}${r.detail ? ': ' + escAttr(r.detail) : ''}</span></div></div>`).join('')}
  ` : '';

  const ownerFigures = `
    <div><div class="v">${latestValuation?.valuation_amount != null ? formatMoney(latestValuation.valuation_amount) : '—'}</div><div class="l">Latest business valuation</div></div>
    <div><div class="v">${objectiveLabel || '—'}</div><div class="l">Objective</div></div>
  `;

  // Jump nav — the whole point is this page is long by design (comprehensive,
  // not compressed), so getting straight to one section beats scrolling
  // past three others to find it.
  const jumpNav = `
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin:0 0 16px;">
      ${[['financial', 'Financial Performance', PILLAR_META.profitability.color], ['growth', 'Growth', PILLAR_META.growth.color], ['risk', 'Risk', PILLAR_META.risk.color], ['owner', 'Owner & Succession', PILLAR_META.owner_wealth.color]]
        .map(([id, label, color]) => `<button type="button" data-fw-jump="${id}" style="border:1px solid ${color}; border-radius:12px; padding:4px 10px; background:var(--paper-raised); color:${color}; font-size:11px; font-family:inherit; cursor:pointer;">${label}</button>`).join('')}
    </div>
  `;
  content.innerHTML = `
    <button class="mini-link" id="fw-summary-close-btn" type="button" style="margin-bottom:10px;">✕ Close</button>
    <p class="section-title" style="margin-top:0;">Framework Summary</p>
    <p class="muted plain" style="margin:0 0 16px;">Everything the framework currently says, in one read — not meeting-bound. For the "what did we say about X" question weeks later.</p>
    ${jumpNav}
    ${domainSection('financial', 'Financial Performance', diagnosisData?.briefSummary?.financial, financialFigures, financialChanged, todoFor('financial'), PILLAR_META.profitability.color)}
    ${domainSection('growth', 'Growth', diagnosisData?.briefSummary?.growth, growthFigures, growthOpportunities, todoFor('growth'), PILLAR_META.growth.color)}
    ${domainSection('risk', 'Risk', topRisks.length ? `Most worth raising: ${topRisks[0].risk_name}.` : 'Nothing active on the risk register.', riskFigures, riskList, todoFor('risk'), PILLAR_META.risk.color)}
    ${domainSection('owner', 'Owner & Succession', diagnosisData?.briefSummary?.owner, ownerFigures, '', todoFor('owner'), PILLAR_META.owner_wealth.color)}
  `;
  document.getElementById('fw-summary-close-btn').onclick = () => { frameworkSummaryOpen = false; renderMain(); };

  // Jumping to a section also opens it — landing on a collapsed card would
  // otherwise look broken (scrolled straight to a header with nothing
  // showing under it).
  content.querySelectorAll('[data-fw-jump]').forEach((btn) => {
    btn.onclick = () => {
      const section = document.getElementById(`fw-section-${btn.dataset.fwJump}`);
      if (!section) return;
      const panel = section.querySelector('.fw-section-body');
      const toggle = section.querySelector('[data-section-toggle]');
      if (panel && panel.style.display === 'none') {
        panel.style.display = '';
        toggle.querySelector('.chevron').textContent = '▴';
      }
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  });
  content.querySelectorAll('[data-section-toggle]').forEach((toggle) => {
    toggle.onclick = () => {
      const panel = toggle.closest('.card').querySelector('.fw-section-body');
      if (!panel) return;
      const willOpen = panel.style.display === 'none';
      panel.style.display = willOpen ? '' : 'none';
      toggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
    };
  });
}

// Shared by the pre-meeting landing screen and Step 1 (opening check-in) —
// what got agreed last time that's still sitting open, worth surfacing
// wherever the meeting actually gets that accountability conversation.
// Grouped by source (Meeting/Exit Readiness/Continuity/Estate/…) rather than
// left as one flat list — a client with a handful of stale actions from
// different corners of the app otherwise reads as an undifferentiated wall
// of text with no sense of which part of the framework each one belongs to.
// Reuses the same .goal-cat-heading/.goal-cat-group divider treatment the
// Goals brief uses for its own category grouping — same "distinct section,
// not just another row" visual need, not actually goal-specific styling.
function outstandingActionsCardHtml(items) {
  if (!items.length) return '';
  // Same faceted Urgency/Source/Owner/Status pills as the full Actions view
  // (Action Plan), always visible rather than tucked behind a toggle — kept
  // in sync with that view's own filter axes rather than a cut-down subset.
  const facetItems = (excludeAxis) => items.filter((it) =>
    (excludeAxis === 'urgency' || !outstandingActionsUrgencyFilter || actionUrgencyBucket(it) === outstandingActionsUrgencyFilter) &&
    (excludeAxis === 'owner' || !outstandingActionsOwnerFilter || it.owner === outstandingActionsOwnerFilter) &&
    (excludeAxis === 'source' || !outstandingActionsSourceFilter || (it.source || 'manual') === outstandingActionsSourceFilter) &&
    (excludeAxis === 'status' || !outstandingActionsStatusFilter || it.status === outstandingActionsStatusFilter));
  const filteredItems = facetItems(null);
  const urgencyOptions = ['overdue', 'due_soon', 'open'].map((key) => ({
    value: key, label: ACTION_URGENCY_META[key].label, icon: ACTION_URGENCY_META[key].icon,
    count: facetItems('urgency').filter((it) => actionUrgencyBucket(it) === key).length,
  })).filter((o) => o.count > 0 || outstandingActionsUrgencyFilter === o.value);
  const ownerOptions = ACTION_ITEM_OWNERS.map((o) => ({ value: o, label: o, count: facetItems('owner').filter((it) => it.owner === o).length }));
  const sourcesPresent = [...new Set(facetItems('source').map((it) => it.source || 'manual'))];
  const sourceOptions = sourcesPresent.map((key) => ({
    value: key, label: ACTION_SOURCE_LABEL[key] || key,
    count: facetItems('source').filter((it) => (it.source || 'manual') === key).length,
  })).filter((o) => o.count > 0 || outstandingActionsSourceFilter === o.value);
  const statusOptions = Object.entries(ACTION_STATUS_META).map(([val, meta]) => ({
    value: val, label: meta.label, count: facetItems('status').filter((it) => it.status === val).length,
  })).filter((o) => o.count > 0 || outstandingActionsStatusFilter === o.value);
  // Not worth a filter row over a single item, or a single choice within an
  // axis — only shown once there's actually more than one outstanding
  // action, and more than one distinct value to narrow down to.
  const filtersHtml = items.length > 1 ? `
    ${urgencyOptions.length > 1 ? pillFilterRowHtml('Urgency', 'oc-filter', 'urgency', outstandingActionsUrgencyFilter, urgencyOptions, facetItems('urgency').length) : ''}
    ${sourceOptions.length > 1 ? pillFilterRowHtml('Relates to', 'oc-filter', 'source', outstandingActionsSourceFilter, sourceOptions, facetItems('source').length) : ''}
    ${ownerOptions.some((o) => o.count > 0) ? pillFilterRowHtml('Owner', 'oc-filter', 'owner', outstandingActionsOwnerFilter, ownerOptions, facetItems('owner').length) : ''}
    ${statusOptions.length > 1 ? pillFilterRowHtml('Status', 'oc-filter', 'status', outstandingActionsStatusFilter, statusOptions, facetItems('status').length) : ''}
  ` : '';
  const bySource = new Map();
  filteredItems.forEach((it) => {
    const key = it.source || 'manual';
    if (!bySource.has(key)) bySource.set(key, []);
    bySource.get(key).push(it);
  });
  const groupsHtml = filteredItems.length ? [...bySource.entries()].map(([source, rows]) => `
    <div class="goal-cat-group">
      <p class="goal-cat-heading">${ACTION_SOURCE_LABEL[source] || source}</p>
      ${rows.map((it) => {
        const overdue = isActionOverdue(it);
        return `
          <div class="flag-row-wrap goal-row-jump" data-action-jump-id="${it.id}" title="Click to open this action in full detail">
            <div class="flag-row">
              <span class="flag-dot ${overdue ? 'rust' : 'sage'}"></span>
              <span style="flex:1;">${escAttr(it.text)}${it.due_date ? ` <span style="color:${overdue ? 'var(--rust)' : 'var(--ink-soft)'}; font-size:11px;">(due ${formatShortDate(it.due_date)}${overdue ? ' — overdue' : ''})</span>` : ''}</span>
            </div>
            <div class="toggle-row" style="padding-left:18px; margin:0 0 6px;">
              <button type="button" class="mini-link" data-action-done-id="${it.id}">done</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `).join('') : '<p class="muted plain" style="margin:10px 0 0;">Nothing matches this filter.</p>';
  return `
    <div class="card">
      <p class="muted">Outstanding actions</p>
      <p class="muted plain" style="margin:0 0 10px;">Still open from before — worth checking on before raising anything new.</p>
      ${filtersHtml}
      ${groupsHtml}
      <button class="mini-link" data-goto-actions-link type="button" style="margin-top:10px;">→ View in Actions</button>
    </div>
  `;
}
function wireGotoActionsLinks(content) {
  const gotoActions = async () => {
    currentDomain = 'actions';
    currentWorkflow = 'input';
    cameFromMeetingLink = true;
    renderWorkflowTabsActive();
    renderSidebarDomains();
    await renderMain();
  };
  content.querySelectorAll('[data-goto-actions-link]').forEach((link) => {
    link.onclick = gotoActions;
  });
  // A row click jumps in AND scrolls straight to that one action (see
  // pendingActionJumpId / renderActionsView's jump-and-flash) — the "done"
  // button inside the same row is a quick action of its own and shouldn't
  // also trigger that jump, so it stops the click from bubbling up here.
  content.querySelectorAll('[data-action-jump-id]').forEach((row) => {
    row.onclick = () => {
      pendingActionJumpId = row.dataset.actionJumpId;
      gotoActions();
    };
  });
  content.querySelectorAll('[data-action-done-id]').forEach((btn) => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const id = btn.dataset.actionDoneId;
      btn.disabled = true;
      try {
        const data = await callRead('get_action_items', currentClientId);
        const item = (data?.items || []).find((it) => it.id === id);
        if (item) await updateActionItem(id, item, { status: 'done' });
        await renderMain();
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });
  content.querySelectorAll('[data-oc-filter-axis]').forEach((pill) => {
    pill.onclick = () => {
      const axis = pill.dataset.ocFilterAxis;
      const value = pill.dataset.ocFilterValue;
      if (axis === 'urgency') outstandingActionsUrgencyFilter = value;
      else if (axis === 'owner') outstandingActionsOwnerFilter = value;
      else if (axis === 'source') outstandingActionsSourceFilter = value;
      else if (axis === 'status') outstandingActionsStatusFilter = value;
      renderMain();
    };
  });
}

// Pre-meeting landing (no brief yet) and post-meeting summary (brief
// completed) — same screen either way, just no nav bar around it, since
// neither is a wizard "step".
async function renderMeetingLanding(content, brief) {
  const myToken = renderToken;
  if (brief?.completed) {
    content.innerHTML = `
      <div class="card">
        <p class="muted">Meeting complete — ${brief.period_end}</p>
        <p class="muted plain" style="margin:0 0 6px;">This meeting's priorities and decisions were recorded. See the Report tab for the summary.</p>
        <p class="muted plain" style="margin:0 0 12px;">${brief.actionsPushedCount ? `${brief.actionsPushedCount} action${brief.actionsPushedCount === 1 ? '' : 's'} sent to Actions.` : 'No action text was recorded, so nothing was sent to Actions.'}</p>
        <button class="mini-link" id="goto-actions-from-meeting-link" type="button" style="margin-bottom:10px;">→ View in Actions</button><br>
        <button class="action" id="reopen-meeting-btn">Reopen this meeting</button>
        <button class="action secondary" id="restart-meeting-btn" style="margin-left:8px;">Start a new meeting for this period</button>
      </div>
    `;
    // Reopening just flips completed back off — nothing recorded gets
    // touched, so every answer/decision/priority is still exactly where it
    // was. Lands back on whichever step was last active (the final one,
    // almost always), with Back available to revisit earlier steps.
    document.getElementById('reopen-meeting-btn').onclick = () => {
      brief.completed = false;
      saveMeeting(brief);
      meetingStepIndex = brief.currentStep || 0;
      renderMain();
    };
    document.getElementById('restart-meeting-btn').onclick = () => {
      if (!confirm('Start a completely new meeting for this period? This discards the current one\'s recorded priorities and decisions — use "Reopen this meeting" instead if you just want to go back and change something.')) return;
      clearMeeting();
      renderMain();
    };
    const gotoActionsFromMeetingLink = document.getElementById('goto-actions-from-meeting-link');
    if (gotoActionsFromMeetingLink) {
      gotoActionsFromMeetingLink.onclick = async () => {
        currentDomain = 'actions';
        currentWorkflow = 'input';
        cameFromMeetingLink = true;
        renderWorkflowTabsActive();
        renderSidebarDomains();
        await renderMain();
      };
    }
    return;
  }

  // Accountability check before starting anything new — what got agreed
  // last time that's still sitting open. Fetched fresh every time this
  // screen renders (not cached with the meeting brief), so it always
  // reflects whatever's actually still outstanding in Actions, including
  // items added outside a meeting entirely (Exit Readiness, Continuity,
  // the estate checklist).
  const actionsData = await callRead('get_action_items', currentClientId);
  if (myToken !== renderToken) return;
  const outstanding = (actionsData?.items || [])
    .filter((it) => it.status !== 'done')
    .sort((a, b) => (a.due_date || '9999-99-99').localeCompare(b.due_date || '9999-99-99'));

  content.innerHTML = `
    ${outstandingActionsCardHtml(outstanding)}
    <div class="card">
      <p class="muted">Meeting mode — ${formatShortDate(currentPeriodEnd)}</p>
      <p class="muted plain" style="margin:0 0 14px;">Covers an opening check-in (with a look at what's still outstanding), Goals, this period's priorities, Financial Performance, Growth, Risk, Owner &amp; Succession, Actions, a goals check, and a closing check-in — click any of those directly, in whatever order suits the conversation. Numbers lock in once you start, even if you re-run analysis afterward.</p>
      <button class="action" id="start-meeting-btn">Start meeting</button>
    </div>
  `;
  wireGotoActionsLinks(content);
  document.getElementById('start-meeting-btn').onclick = () => {
    const newBrief = {
      client_id: currentClientId, period_end: currentPeriodEnd, created_at: new Date().toISOString(),
      currentStep: 0, priorities: [], currentIndex: 0, completed: false,
    };
    saveMeeting(newBrief);
    meetingStepIndex = 0;
    renderMain();
  };
}

// Same "carry forward from the nearest non-empty prior period" pattern
// goals/pulse already use for their own "what did they say last time"
// context — a client who isn't met with every single period still gets
// last time's actual list, not just whatever's immediately prior.
function findPriorMeetingPriorities(meetingRecords, periodEnd) {
  const periods = Object.keys(meetingRecords || {}).filter((p) => p < periodEnd).sort().reverse();
  for (const p of periods) {
    const rec = meetingRecords[p];
    if (rec?.priorities?.length) return { periodEnd: p, priorities: rec.priorities };
  }
  return null;
}

let priorPrioritiesPillarFilter = '';
// Set by a click on the Financial brief's "Cash conversion"/"Effective tax
// rate" tile, just before jumping into the Financial Performance meeting
// step's detail view — read once, on that view's very next render, to
// scroll straight to and flash the matching KPI card (see renderFinancialAnalyse).
let pendingFinancialKpiScrollKey = null;
// Same idea, for the Risk brief's Priority tiles and Top risks rows (see
// renderRiskBrief) — read once by renderRiskAnalyse's own very next render
// to open the rollup detail, activate the matching Priority filter pill,
// and/or scroll to and expand one specific risk row.
let pendingRiskFilterLevel = null;
let pendingRiskScrollName = null;

// Jumps straight into a domain's own meeting-step detail view (the same
// "See full detail" screen its brief's own link opens) rather than leaving
// Meeting Mode altogether via currentDomain/currentWorkflow — that first
// attempt landed on the raw Financial/Growth/Risk/Owner screens with no way
// back, since only the Actions view special-cases a "← Back to meeting"
// button. Every renderMeetingDomainStep-backed step already has that button
// built in for free, so routing through it instead fixes the dead end.
function jumpToMeetingStepDetail(stepKey) {
  const idx = MEETING_STEPS.findIndex((s) => s.key === stepKey);
  if (idx === -1) return;
  meetingStepIndex = idx;
  meetingBriefDetail[stepKey] = true;
  const brief = loadMeeting();
  if (brief) { brief.currentStep = meetingStepIndex; saveMeeting(brief); }
  renderMain();
}

function priorPrioritiesCardHtml(prior) {
  if (!prior) return '';
  const pillarCounts = {};
  prior.priorities.forEach((p) => { pillarCounts[p.pillar] = (pillarCounts[p.pillar] || 0) + 1; });
  const pillarOptions = Object.keys(pillarCounts).map((key) => ({ value: key, label: (PILLAR_META[key] || { name: key }).name, count: pillarCounts[key] }));
  const filterHtml = pillarOptions.length > 1 ? pillFilterRowHtml('Relates to', 'pp-filter', 'pillar', priorPrioritiesPillarFilter, pillarOptions, prior.priorities.length) : '';
  const filtered = priorPrioritiesPillarFilter ? prior.priorities.filter((p) => p.pillar === priorPrioritiesPillarFilter) : prior.priorities;
  return `
    <div class="card">
      <p class="card-label" style="margin:0 0 8px;">Last time's priorities — ${formatShortDate(prior.periodEnd)}</p>
      ${filterHtml}
      ${filtered.map((p) => {
        const meta = PILLAR_META[p.pillar] || { name: p.pillar };
        return `
          <div class="flag-row-wrap goal-row-jump" data-pp-jump-pillar="${p.pillar}" style="padding:8px 0;" title="Click to review ${escAttr(meta.name)}">
            <p style="font-size:12px; margin:0 0 3px;"><b>${meta.name}:</b> ${escAttr(p.message)}</p>
            ${p.decision ? `<p style="font-size:11.5px; color:var(--ink-soft); margin:0 0 2px;">Decision: ${escAttr(p.decision)}</p>` : ''}
            ${p.action ? `<p style="font-size:11.5px; color:var(--ink-soft); margin:0;">Action: ${escAttr(p.action)}</p>` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function wirePriorPrioritiesCard(content) {
  content.querySelectorAll('[data-pp-filter-axis]').forEach((pill) => {
    pill.onclick = () => {
      priorPrioritiesPillarFilter = pill.dataset.ppFilterValue;
      renderMain();
    };
  });
  content.querySelectorAll('[data-pp-jump-pillar]').forEach((row) => {
    row.onclick = () => {
      const pillar = row.dataset.ppJumpPillar;
      jumpToMeetingStepDetail(PILLAR_TO_DOMAIN[pillar] || 'financial');
    };
  });
}

// The priorities step's own build trigger — same Impact×Urgency×Ease
// scoring as before, just reached by walking into this wizard step instead
// of a standalone "Build Meeting" button. The "no flags" empty state needs
// its own explicit way to move on, same as any other pill click.
// (Last time's priorities lives back at Opening check-in, next to
// Outstanding Actions — both are "catch up before you start" retrospective
// content; this step is purely this period's own fresh scoring.)
async function renderMeetingPrioritiesBuild(content, brief) {
  content.innerHTML = `
    <div class="card">
      <p class="muted">This period's priorities</p>
      <p class="muted plain" style="margin:0 0 6px;">Scores every flagged issue this period by Impact × Urgency × Ease and locks in the top 3 to walk through. Numbers won't move once locked, even if you re-run analysis afterward.</p>
      <p class="muted plain" style="margin:0 0 14px;">Not the same as Actions yet — this is the shortlist up for discussion. Agree one, and it becomes an Action with an owner and a due date.</p>
      <button class="action" id="build-priorities-btn">Score priorities</button>
      <div id="build-priorities-msg" style="margin-top:10px;"></div>
    </div>
  `;
  document.getElementById('build-priorities-btn').onclick = async () => {
    const msg = document.getElementById('build-priorities-msg');
    msg.textContent = 'Scoring flags…';
    // Built directly from buildMeetingCandidates() rather than reading the
    // shared getCandidateRanking() cache — that cache is deliberately the
    // TRUE, unfiltered top-3 (Overview's preview and the pill badges need
    // to agree with it exactly, see its own header comment), so filtering
    // it here would make this step disagree with those two elsewhere on
    // the same screen. Instead, skip anything whose name already appears
    // in an existing Actions entry — otherwise an item already quick-added
    // from a domain brief's own "+ Add to Actions" (Financial/Growth/Risk/
    // Owner all have one now) gets walked through here too and pushed a
    // SECOND time under a freshly hand-typed Decision/Action, with nothing
    // on either row to show they're the same underlying issue.
    const [candidates, actionsData] = await Promise.all([
      buildMeetingCandidates(),
      callRead('get_action_items', currentClientId),
    ]);
    const actionedTexts = (actionsData?.items || []).map((a) => (a.text || '').toLowerCase());
    const alreadyActioned = (name) => {
      const n = (name || '').toLowerCase();
      return !!n && actionedTexts.some((t) => t.includes(n));
    };
    const scored = candidates
      .filter((f) => !alreadyActioned(f.risk_category))
      .map((f) => ({ ...f, ...scoreFlag(f) }))
      .sort((a, b) => b.priorityScore - a.priorityScore)
      .slice(0, 3);
    if (!scored.length) {
      const reason = candidates.length
        ? "Everything flagged this period is already tracked in Actions — nothing new to walk through."
        : 'No flags for this period — run analysis on Financial Performance → Analyse first.';
      msg.innerHTML = `<div class="flag">${reason}</div><button class="mini-link" id="skip-priorities-btn" type="button" style="margin-top:8px;">Skip this step →</button>`;
      document.getElementById('skip-priorities-btn').onclick = () => goToMeetingStep(meetingStepIndex + 1);
      return;
    }
    brief.priorities = scored.map((f) => ({
      pillar: f.pillar, message: f.message, severity: f.severity,
      impact: f.impact, urgency: f.urgency, ease: f.ease, priorityScore: f.priorityScore,
      talkingPoint: f.talkingPoint || null,
      decision: '', action: '',
    }));
    brief.currentIndex = 0;
    saveMeeting(brief);
    renderMeetingSession(content, brief);
  };
}

function renderMeetingSession(content, brief) {
  const idx = brief.currentIndex;
  const p = brief.priorities[idx];
  const meta = PILLAR_META[p.pillar] || { name: p.pillar, color: '#999' };
  const isLast = idx === brief.priorities.length - 1;

  content.innerHTML = `
    <div class="card priority-card">
      <p class="muted">Priority ${idx + 1} of ${brief.priorities.length}</p>
      <p class="card-value" style="margin-bottom:6px;">${meta.name}</p>
      <p style="font-size:14px; margin:0 0 10px;">${p.message}</p>
      ${p.talkingPoint ? `<p style="font-size:13px; margin:0 0 10px; padding:8px 10px; background:var(--sage-bg); border-radius:6px;">💬 ${p.talkingPoint}</p>` : ''}
      <p class="priority-meta">Impact ${p.impact} · Urgency ${p.urgency} · Ease ${p.ease} · Priority score ${p.priorityScore}</p>
      <div class="form-field full" style="margin-top:14px;"><label>Decision</label><textarea id="mtg-decision" rows="2" placeholder="What did you agree with the client?">${p.decision || ''}</textarea></div>
      <div class="form-field full"><label>Action</label><textarea id="mtg-action" rows="2" placeholder="What happens next, and who owns it?">${p.action || ''}</textarea></div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        ${idx > 0 ? `<button class="action secondary" id="mtg-prev-btn">← Previous priority</button>` : ''}
        <button class="action" id="mtg-next-btn">${isLast ? 'Finish priorities →' : 'Next priority'}</button>
        <button class="action secondary" id="mtg-detail-btn">Show detail →</button>
      </div>
      <button type="button" class="mini-link" id="mtg-rebuild-btn" style="margin-top:10px; display:block;">↺ Rebuild priorities (re-score from scratch)</button>
    </div>
  `;

  const captureInputs = () => {
    p.decision = document.getElementById('mtg-decision').value;
    p.action = document.getElementById('mtg-action').value;
  };

  // Autosave on every keystroke, not just on Next/Finish/Show detail —
  // previously, clicking a different meeting pill mid-typing (instead of
  // one of those three buttons) skipped captureInputs() entirely and
  // silently dropped whatever was typed. saveMeeting's localStorage write
  // is synchronous (see its own comment), so by the time any other click
  // handler runs, brief.priorities[idx] and localStorage already agree.
  document.getElementById('mtg-decision').oninput = () => { captureInputs(); saveMeeting(brief); };
  document.getElementById('mtg-action').oninput = () => { captureInputs(); saveMeeting(brief); };

  if (idx > 0) {
    document.getElementById('mtg-prev-btn').onclick = () => {
      captureInputs();
      brief.currentIndex -= 1;
      saveMeeting(brief);
      renderMeetingSession(content, brief);
    };
  }

  // No other way to get a fresh score mid-meeting — priorities are
  // deliberately locked once built (numbers shouldn't shift under you
  // while you're mid-conversation, see renderMeetingPrioritiesBuild's own
  // copy), but that also meant there was previously NO way back to a
  // fresh build screen short of clearing localStorage by hand. Confirms
  // first since this discards any Decision/Action text already typed
  // against the current locked set.
  document.getElementById('mtg-rebuild-btn').onclick = () => {
    if (!confirm('Rebuild priorities? This re-scores from scratch and discards any Decision/Action text already typed against the current top 3.')) return;
    brief.priorities = [];
    brief.currentIndex = 0;
    brief.prioritiesPushed = false;
    saveMeeting(brief);
    renderMain();
  };

  document.getElementById('mtg-next-btn').onclick = async () => {
    captureInputs();
    if (isLast) {
      // Wrapping up this step — whatever action text was recorded per
      // priority gets pushed into the real Actions domain here, so it's a
      // tracked to-do afterward instead of only ever living in this
      // meeting's own record (used by nothing outside Meeting Mode itself —
      // it becomes next period's "last time's priorities" reference, not a
      // to-do tracker). Guarded by
      // prioritiesPushed so revisiting this pill and finishing again can't
      // double-push the same actions.
      if (!brief.prioritiesPushed) {
        const pushable = brief.priorities.filter((pr) => pr.action && pr.action.trim());
        for (const pr of pushable) {
          try {
            await addActionItem(pr.action.trim(), 'meeting', meetingPriorityToActionPriority(pr.severity), pr.decision?.trim() || null);
          } catch (err) {
            console.error('Failed to push meeting action to Actions:', err.message);
          }
        }
        brief.actionsPushedCount = pushable.length;
        brief.prioritiesPushed = true;
      }
      saveMeeting(brief);
      goToMeetingStep(meetingStepIndex + 1);
      return;
    }
    brief.currentIndex += 1;
    saveMeeting(brief);
    renderMeetingSession(content, brief);
  };

  // Was a hard exit out of Meeting Mode entirely (currentWorkflow =
  // 'analyse', nav bar hidden, no way back except manually reopening the
  // Meeting tab) — every OTHER "see full detail" link in the app
  // (Financial/Growth/Risk/Owner briefs) instead stays inside Meeting Mode
  // via jumpToMeetingStepDetail, with the pill nav and a "← Back to
  // meeting" link intact. This one predates that pattern; now matches it.
  document.getElementById('mtg-detail-btn').onclick = () => {
    captureInputs();
    saveMeeting(brief);
    // meetingStepIndex is still Priorities' own index at this point — jump
    // there afterward is only correct because we captured it BEFORE
    // jumpToMeetingStepDetail overwrites it with the target domain's.
    meetingDetailReturnStep = meetingStepIndex;
    jumpToMeetingStepDetail(PILLAR_TO_DOMAIN[p.pillar] || 'financial');
  };
}

// Opening/closing check-in questions, filtered by phase — same underlying
// `pulse` save as Goals' own Check-in tab (renderGoalsInput), just a
// narrower view of it. savePulse replaces the whole pulse object per period
// server-side, so the merge with whatever's already saved (the other
// phase's answers, most likely) has to happen client-side before sending.
async function renderMeetingQuestionsStep(content, phase) {
  const myToken = renderToken;
  // Always fetches fresh (not currentCtx || ...) — this step re-renders
  // itself directly after add/edit/delete-question saves, and a stale
  // cached currentCtx would silently hide whatever was just changed.
  // Opening step also surfaces last period's still-open actions — the
  // natural lead-in to "anything changed since we last spoke" is knowing
  // what was committed to last time. Fetched only for the open phase, since
  // closing questions are forward-looking, not a look back at old commitments.
  const [ctx, actionsData] = await Promise.all([
    callRead('get_context', currentClientId),
    phase === 'open' ? callRead('get_action_items', currentClientId) : Promise.resolve(null),
  ]);
  if (myToken !== renderToken) return;
  currentCtx = ctx;
  const goals = ctx?.owner_goals || {};
  const outstanding = phase === 'open'
    ? (actionsData?.items || []).filter((it) => it.status !== 'done').sort((a, b) => (a.due_date || '9999-99-99').localeCompare(b.due_date || '9999-99-99'))
    : [];
  // Same "catch up before you start" framing as Outstanding Actions, right
  // next to it — this is retrospective (what mattered last time), not part
  // of this period's own fresh priorities scoring (a separate, later pill).
  const priorPriorities = phase === 'open' ? findPriorMeetingPriorities(ctx?.meeting_records, currentPeriodEnd) : null;
  const questions = [
    ...FIXED_QUESTIONS.map((q) => ({ ...q, prompt: goals.question_overrides?.[q.id] || q.prompt })),
    ...(goals.custom_questions || []),
  ].filter((q) => (q.phase || 'open') === phase);
  const existingPulse = goals.periods?.[currentPeriodEnd]?.pulse || {};
  // What they said last time, shown per-question as reference while
  // answering this period's — the "last period" idea belongs here, not as
  // a standalone history card on Goals' Review tab, since it's about these
  // questions specifically, not goal status.
  const priorPulse = findPriorPulse(goals, currentPeriodEnd);
  // For "turn into goal" — same visible-categories list Goals' own screen
  // offers, so an answer isn't forced into Business by default.
  const goalCategories = [...GOAL_CATEGORIES.filter((c) => !(goals.hidden_categories || []).includes(c.key)), ...(goals.custom_categories || [])];
  const title = phase === 'open' ? 'Opening check-in' : 'Closing check-in';
  const subtitle = phase === 'open'
    ? "Quick catch-up before diving into the numbers — doesn't change what's shown next, just context for the conversation."
    : 'Forward-looking — a good answer here often becomes next period\'s goal.';

  content.innerHTML = `
    <div class="meeting-side-cards">
      ${outstandingActionsCardHtml(outstanding)}
      ${priorPrioritiesCardHtml(priorPriorities)}
    </div>
    <div class="card">
      <p class="muted">${title} — ${formatShortDate(currentPeriodEnd)}</p>
      <p class="muted plain" style="margin:0 0 14px;">${subtitle}</p>
      ${questions.map((q) => `
        <div class="form-field full">
          <label id="mtgq-label-${q.id}">${q.prompt}
            <button class="question-edit-btn" data-edit-q="${q.id}" title="Edit this question">edit</button>
            ${isCustomQuestion(q.id) ? `<button class="question-remove-btn" data-remove-q="${q.id}" title="Remove this question">×</button>` : ''}
          </label>
          <div id="mtgq-edit-${q.id}" style="display:none; margin-bottom:6px;">
            <input type="text" id="mtgq-edit-input-${q.id}" value="${q.prompt}" />
            <button class="action" style="margin-top:6px;" data-save-q="${q.id}">Save wording</button>
          </div>
          ${priorPulse?.[q.id] ? `<p class="muted plain" style="margin:0 0 4px; font-size:12px;">Last time (${formatShortDate(priorPulse.periodEnd)}): "${priorPulse[q.id]}"</p>` : ''}
          <textarea id="mtgq-${q.id}" rows="2">${existingPulse[q.id] || ''}</textarea>
          <div style="margin-top:4px; display:flex; align-items:center; gap:6px;">
            <button class="mini-link" data-turn-answer-goal="${q.id}" type="button">→ turn into goal</button>
            <select id="mtgq-goalcat-${q.id}" style="font-size:11px; padding:1px 2px;">
              <option value="" selected disabled>Choose category…</option>
              ${goalCategories.map((c) => `<option value="${c.key}">${c.label}</option>`).join('')}
            </select>
          </div>
        </div>
      `).join('')}
      <div id="mtgq-add-row" style="margin-top:4px;">
        <button class="action secondary" id="mtgq-add-btn" type="button">+ Add a question</button>
        <div id="mtgq-add-form" style="display:none; margin-top:10px;">
          <input type="text" id="mtgq-add-input" placeholder="Type a new ${phase === 'open' ? 'opening' : 'closing'} question…" />
          <button class="action" id="mtgq-add-confirm" style="margin-top:8px;">Add question</button>
        </div>
      </div>
    </div>
  `;
  wireGotoActionsLinks(content);
  wirePriorPrioritiesCard(content);

  content.querySelectorAll('[data-turn-answer-goal]').forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.dataset.turnAnswerGoal;
      const text = document.getElementById(`mtgq-${id}`).value.trim();
      if (!text) return;
      const catSelect = document.getElementById(`mtgq-goalcat-${id}`);
      const catKey = catSelect.value;
      if (!catKey) { catSelect.focus(); return; }
      const catLabel = goalCategories.find((c) => c.key === catKey)?.label || catKey;
      btn.disabled = true;
      btn.textContent = 'adding…';
      await addTextAsGoal(text, catKey);
      btn.textContent = `✓ added to Goals → ${catLabel}`;
    };
  });

  // Editing/removing a question, and adding a new one, mirror the exact
  // same manual-entry.js actions Goals' own tab used to call directly
  // (goal_question/edit_goal_question/delete_goal_question) — this is now
  // the only place those questions get managed, since answering them moved
  // here. A newly added question defaults to whichever phase step it was
  // added from, since that's the natural context for "when would this get
  // asked" — editable later the same way any custom category is.
  content.addEventListener('click', async (e) => {
    const removeBtn = e.target.closest('button[data-remove-q]');
    if (removeBtn) {
      await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'delete_goal_question', client_id: currentClientId, id: removeBtn.dataset.removeQ }),
      });
      renderMeetingQuestionsStep(content, phase);
      return;
    }
    const editBtn = e.target.closest('button[data-edit-q]');
    if (editBtn) {
      document.getElementById(`mtgq-edit-${editBtn.dataset.editQ}`).style.display = 'block';
      document.getElementById(`mtgq-edit-input-${editBtn.dataset.editQ}`).focus();
      return;
    }
    const saveQBtn = e.target.closest('button[data-save-q]');
    if (saveQBtn) {
      const id = saveQBtn.dataset.saveQ;
      const prompt = document.getElementById(`mtgq-edit-input-${id}`).value.trim();
      if (!prompt) return;
      await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'edit_goal_question', client_id: currentClientId, id, prompt }),
      });
      renderMeetingQuestionsStep(content, phase);
    }
  });

  document.getElementById('mtgq-add-btn').onclick = () => {
    document.getElementById('mtgq-add-btn').style.display = 'none';
    document.getElementById('mtgq-add-form').style.display = 'block';
    document.getElementById('mtgq-add-input').focus();
  };
  document.getElementById('mtgq-add-confirm').onclick = async () => {
    const prompt = document.getElementById('mtgq-add-input').value.trim();
    if (!prompt) return;
    const res = await fetch('/.netlify/functions/manual-entry', {
      method: 'POST',
      body: JSON.stringify({ type: 'goal_question', client_id: currentClientId, prompt, phase }),
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    renderMeetingQuestionsStep(content, phase);
  };

  // Answers save themselves as each field is left, rather than on an
  // explicit "continue" click — with pills you can jump to any other step
  // at any moment, so there's no single "leaving this step" button left to
  // hang a save off of. existingPulse is updated in place as the running
  // "last saved" value, so re-blurring an unchanged field is a no-op.
  questions.forEach((q) => {
    const ta = document.getElementById(`mtgq-${q.id}`);
    ta.addEventListener('blur', async () => {
      if (ta.value === (existingPulse[q.id] || '')) return;
      const answers = {};
      questions.forEach((qq) => { answers[qq.id] = document.getElementById(`mtgq-${qq.id}`).value; });
      const merged = { ...existingPulse, ...answers };
      try {
        await fetch('/.netlify/functions/manual-entry', {
          method: 'POST',
          body: JSON.stringify({ type: 'pulse', client_id: currentClientId, period_end: currentPeriodEnd, answers: merged }),
        });
        existingPulse[q.id] = ta.value;
      } catch (err) {
        alert('Error saving that answer: ' + err.message);
      }
    });
  });
}

// Short end-of-meeting pass over this period's still-open goals, right
// before the closing questions — catches anything that actually got
// achieved somewhere in the conversation. Deliberately lighter than the
// earlier Goals step: just text + a "mark achieved" action, none of the
// carry-forward/edit/reconsider machinery that step already covers.
async function renderMeetingGoalsWrapup(content) {
  const myToken = renderToken;
  const ctx = await callRead('get_context', currentClientId);
  if (myToken !== renderToken) return;
  const goals = ctx?.owner_goals || {};
  const hidden = goals.hidden_categories || [];
  const categories = [...GOAL_CATEGORIES.filter((c) => !hidden.includes(c.key)), ...(goals.custom_categories || [])];
  // Grouped by category with the same filter pills as the Goals brief — a
  // single flat list across every category was hard to scan mid-meeting.
  const openGroups = categories
    .map((cat) => ({ cat, items: resolveGoalList(goals, currentPeriodEnd, cat.key).filter((it) => !it.done) }))
    .filter((g) => g.items.length);
  const openTotal = openGroups.reduce((n, g) => n + g.items.length, 0);

  content.innerHTML = `
    <div class="card">
      <p class="muted">Goals check — ${formatShortDate(currentPeriodEnd)}</p>
      <p class="muted plain" style="margin:0 0 14px;">Before wrapping up — did anything just discussed actually get achieved?</p>
      ${openGroups.length ? `
        ${openGroups.length > 1 ? `<div class="goal-cat-filter-row" style="display:flex; margin-bottom:10px;">
          <button type="button" class="risk-filter-pill active" data-wrapup-cat-filter="all">All <span class="risk-filter-count">(${openTotal})</span></button>
          ${openGroups.map(({ cat, items }) => `<button type="button" class="risk-filter-pill" data-wrapup-cat-filter="${cat.key}">${cat.label} <span class="risk-filter-count">(${items.length})</span></button>`).join('')}
        </div>` : ''}
        ${openGroups.map(({ cat, items }, i) => `
          <div class="goal-cat-group${i === 0 ? ' is-first-visible' : ''}" data-cat-key="${cat.key}">
            <p class="goal-cat-heading">${cat.label}</p>
            ${items.map((it) => `
              <div class="goal-wrapup-row" data-cat="${cat.key}" data-id="${it.id}" style="padding:7px 0; border-bottom:1px solid var(--line);">
                <p class="goal-text" style="margin:0 0 6px;">${it.text}</p>
                <button class="mini-link" data-wrapup-achieve="1" type="button">✓ Mark achieved</button>
              </div>
            `).join('')}
          </div>
        `).join('')}
      ` : `<p class="muted plain" style="margin:0;">No open goals for this period — nothing to check off.</p>`}
    </div>
  `;

  content.querySelectorAll('[data-wrapup-cat-filter]').forEach((pill) => {
    pill.onclick = () => {
      const key = pill.dataset.wrapupCatFilter;
      content.querySelectorAll('[data-wrapup-cat-filter]').forEach((p) => p.classList.toggle('active', p === pill));
      let firstVisible = true;
      content.querySelectorAll('.goal-cat-group').forEach((g) => {
        const show = key === 'all' || g.dataset.catKey === key;
        g.style.display = show ? '' : 'none';
        g.classList.toggle('is-first-visible', show && firstVisible);
        if (show) firstVisible = false;
      });
    };
  });

  content.querySelectorAll('[data-wrapup-achieve]').forEach((btn) => {
    btn.onclick = async () => {
      const row = btn.closest('.goal-wrapup-row');
      const { cat: catKey, id } = row.dataset;
      btn.disabled = true;
      btn.textContent = 'saving…';
      const fresh = await callRead('get_context', currentClientId);
      const freshGoals = fresh?.owner_goals || {};
      const source = resolveGoalList(freshGoals, currentPeriodEnd, catKey).find((x) => x.id === id);
      if (source) {
        const current = (freshGoals.periods?.[currentPeriodEnd]?.cats?.[catKey]?.items || []).filter((x) => x.id !== id);
        current.push({ ...source, carried: undefined, sourcePeriod: undefined, needs_review: undefined, done: true, updated_at: new Date().toISOString() });
        await saveGoalItems(catKey, current);
      }
      row.style.opacity = '0.5';
      btn.textContent = '✓ Achieved';
    };
  });
}

// ---- Report (global) ----
// The client-facing write-up of the period — what you'd hand over (or
// "Save as PDF" from the browser's print dialog) after the meeting. Built
// entirely from data the workspace already saves: the meeting record's
// priorities/decisions/actions, the check-in answers, goals, the KPI report
// and its cash reconciliation, and open Action items. See
// workspace-architecture-spec.md ("Report: auto-compiled summary of all of
// the above") and ideas.md (the cash story never reaching the client).
// Falls back to the older recommendations list for the priorities section
// when no meeting has been run for the period.
async function renderReportTab(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No period selected</p><p class="muted plain" style="margin:0;">Add a financial snapshot first — the report is built per period.</p></div>`;
    return;
  }
  // get_diagnosis rather than get_report_data for recommendations —
  // get_report_data ignores the period and returns the latest 3 from any
  // period, so an older period's report would print newer advice.
  // Same period one year earlier — e.g. 2026-06-30 → 2025-06-30. A 29 Feb
  // end date falls back to 28 Feb.
  const [pY, pM, pD] = currentPeriodEnd.split('-');
  const lastYearEnd = `${Number(pY) - 1}-${pM}-${pM === '02' && pD === '29' ? '28' : pD}`;
  const [brief, overview, kpiData, lastYearData, ctx, actionsData, diagnosisData] = await Promise.all([
    loadMeetingWithFallback(),
    callRead('get_overview', currentClientId, currentPeriodEnd),
    callRead('get_kpi_report', currentClientId, currentPeriodEnd),
    callRead('get_kpi_report', currentClientId, lastYearEnd).catch(() => null),
    callRead('get_context', currentClientId),
    callRead('get_action_items', currentClientId),
    callRead('get_diagnosis', currentClientId, currentPeriodEnd),
  ]);
  if (myToken !== renderToken) return;

  const esc = escAttr;
  const kpis = kpiData?.kpis || [];
  const snapshot = kpiData?.snapshot;
  const kpi = (key) => kpis.find((k) => k.key === key);
  const clientName = document.getElementById('client-name')?.textContent || 'Client';
  const hasMeeting = !!brief?.priorities?.length;

  // 0. Scores — the same Business health (topbar badge / Overview wheel) and
  // Financial score (Financial Performance's 3-pillar average, see
  // computeFinancialScore) the workspace shows, plus each pillar out of 10.
  // Only for an analysed period; overview's healthScore is null otherwise.
  const hs = overview?.healthScore || null;
  const priorHs = overview?.priorHealthScore || null;
  const pillarScores = overview?.pillarScores || [];
  const priorPillarMap = {};
  (overview?.priorPillarScores || []).forEach((p) => { priorPillarMap[p.pillar] = p.score; });
  const financialScore = computeFinancialScore(pillarScores);
  const priorFinancialScore = computeFinancialScore(overview?.priorPillarScores);
  const scoreTile = (label, score, prior) => `
    <div class="report-score">
      <div class="l">${label}</div>
      <div class="v">${score}<span> / 100</span></div>
      <div>${scoreBadgeHtml(score, true)} ${prior != null ? `<span class="t">${trendArrow(score, prior)}</span>` : ''}</div>
    </div>`;
  const pillarRows = Object.keys(PILLAR_META)
    .map((key) => ({ key, score: pillarScores.find((p) => p.pillar === key)?.score }))
    .filter((p) => p.score != null);
  // Headline scores sit on page 1; the per-area breakdown is a compact
  // 4-across grid in the detail pages (an 8-row table cost half a page).
  const scoreTilesHtml = hs ? `
    ${scoreTile('Business health', hs.score, priorHs?.score)}
    ${financialScore != null ? scoreTile('Financial score', financialScore, priorFinancialScore) : ''}
  ` : '';
  // Areas this client's cadence covers (mirrors analyze-background.js's
  // CADENCE_PILLARS) that came back without a score — the analysis leaves
  // an area out rather than inventing a neutral 6, so say so plainly
  // instead of letting it silently vanish.
  const CADENCE_AREAS = {
    quarterly: ['profitability', 'cash_flow', 'tax'],
    half_yearly: ['profitability', 'cash_flow', 'tax', 'growth', 'risk', 'systems_team'],
    annual: Object.keys(PILLAR_META),
  };
  const notScored = (CADENCE_AREAS[ctx?.cadence || 'quarterly'] || [])
    .filter((key) => !pillarRows.some((p) => p.key === key))
    .map((key) => PILLAR_META[key]?.name || key);
  const pillarGridHtml = pillarRows.length ? `
    ${notScored.length ? `<p class="report-sub" style="margin:0 0 8px;">Not yet scored (not enough information yet): ${notScored.map(esc).join(', ')}.</p>` : ''}
    <div class="report-pillar-grid">
      ${pillarRows.map((p) => `<div class="report-pillar-cell">
        <div class="n"><span class="report-pillar-dot" style="background:${PILLAR_META[p.key].color};"></span>${esc(PILLAR_META[p.key].name)}</div>
        <div class="s">${Number(p.score).toFixed(1)}<span> / 10</span> ${scoreBadgeHtml(p.score, false)}</div>
        ${priorPillarMap[p.key] != null ? `<div class="t">${trendArrow(p.score, priorPillarMap[p.key])}</div>` : ''}
      </div>`).join('')}
    </div>
  ` : '';

  // 1. Headline figures — the five numbers an owner actually asks about,
  // each against the SAME period a year earlier (not the previous quarter):
  // "how did we go vs last year" is the question a client actually asks,
  // and comparing like-for-like quarters avoids seasonal swings.
  const lySnap = lastYearData?.snapshot;
  const lyKpi = (key) => (lastYearData?.kpis || []).find((k) => k.key === key);
  const moneyVsLastYear = (cur, prior) => {
    if (cur == null || prior == null) return '';
    const diff = cur - prior;
    const pct = prior !== 0 ? ` (${diff >= 0 ? '+' : '−'}${Math.abs((diff / Math.abs(prior)) * 100).toFixed(1)}%)` : '';
    const cls = Math.abs(diff) < 0.5 ? 'trend-flat' : diff > 0 ? 'trend-up' : 'trend-down';
    return `<div class="t">Last year ${formatMoney(prior)}</div><div class="t"><span class="${cls}">${diff > 0 ? '↑' : diff < 0 ? '↓' : '—'} ${formatMoney(Math.abs(diff))}${pct}</span></div>`;
  };
  const pctVsLastYear = (cur, prior) => {
    if (cur == null || prior == null) return '';
    const pts = (cur - prior) * 100;
    const cls = Math.abs(pts) < 0.05 ? 'trend-flat' : pts > 0 ? 'trend-up' : 'trend-down';
    return `<div class="t">Last year ${formatKpi(prior, 'percent')}</div><div class="t"><span class="${cls}">${pts > 0 ? '↑' : pts < 0 ? '↓' : '—'} ${Math.abs(pts).toFixed(1)} pts</span></div>`;
  };
  const figure = (label, value, compareHtml) => `
    <div class="report-figure">
      <div class="v">${value}</div>
      <div class="l">${label}</div>
      ${compareHtml || ''}
    </div>`;
  // A period can exist (snapshot row created by "+ New period") with
  // nothing entered yet — that reads as "no figures", not five dashes.
  const hasFigures = snapshot && [snapshot.revenue, snapshot.net_profit, snapshot.cash].some((v) => v != null);
  const hasLastYear = lySnap && [lySnap.revenue, lySnap.net_profit, lySnap.cash].some((v) => v != null);
  const figuresHtml = hasFigures ? `
    <div class="report-figures">
