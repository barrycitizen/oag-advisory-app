<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>OAG Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F6F4EE;
  --paper-raised: #FFFFFF;
  --ink: #1E2A24;
  --ink-soft: #55605A;
  --brass: #9C7A3C;
  --brass-soft: #C9AE7B;
  --sage: #5C7A63;
  --sage-bg: #E7EEE6;
  --rust: #9C4B3C;
  --rust-bg: #F3E4DF;
  --line: #DDD8C8;
  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; }
body { font-family: var(--font-body); margin: 0; background: var(--paper); color: var(--ink); }
.shell { min-height: 100vh; }

/* Top bar */
.topbar { background: var(--paper-raised); border-bottom: 1px solid var(--line); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); margin: 0 0 2px; font-weight: 500; }
#client-name { font-family: var(--font-display); font-weight: 500; font-size: 24px; margin: 0; }
.subline { color: var(--ink-soft); font-size: 13px; margin: 2px 0 0; min-height: 1em; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.pill-select { font-family: var(--font-mono); font-size: 13px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); color: var(--ink); cursor: pointer; }
.pill-select:disabled { opacity: 0.45; cursor: not-allowed; }
#client-select { font-family: var(--font-body); font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised); color: var(--ink); width: 100%; }
.period-disabled-note { font-size: 11px; color: var(--ink-soft); font-style: italic; white-space: nowrap; }
.health-badge { font-family: var(--font-mono); font-size: 13px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px; white-space: nowrap; }

/* App grid */
.app { display: grid; grid-template-columns: 240px 1fr; }
.sidebar { background: var(--paper-raised); border-right: 1px solid var(--line); padding: 28px 20px; }
.sidebar button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; border: none; background: transparent; border-radius: 6px; cursor: pointer; font-family: var(--font-display); font-size: 15px; color: var(--ink); margin-bottom: 2px; }
.sidebar button:hover { background: var(--paper); }
.sidebar button.active { background: var(--paper); border-left: 2px solid var(--brass); color: var(--brass); padding-left: 10px; }
.sidebar-section-gap { margin-top: 24px; }
.domain-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
.domain-dot.dot-done { background: var(--sage); }

.main { padding: 32px 40px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.tabs button { padding: 10px 4px; margin-right: 24px; border: none; background: transparent; cursor: pointer; font-size: 13px; font-family: var(--font-body); color: var(--ink-soft); border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--ink); border-bottom-color: var(--brass); font-weight: 500; }

.card { background: var(--paper-raised); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; border: 1px solid var(--line); }
.card.full { grid-column: 1 / -1; }
.card.placeholder { border-style: dashed; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.muted { color: var(--ink-soft); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 8px; }
.muted.plain { text-transform: none; letter-spacing: normal; font-size: 13px; }
.flag { background: var(--rust-bg); color: var(--rust); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; font-size: 13px; }
button.action { padding: 9px 16px; border-radius: 8px; border: none; background: var(--ink); color: var(--paper); cursor: pointer; font-size: 13px; font-family: var(--font-body); font-weight: 500; }
button.action:hover { background: var(--sage); }
button.action:disabled { opacity: 0.55; cursor: default; background: var(--ink); }
button.action.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.action.secondary:hover { background: var(--paper); }
.subtabs { display: flex; gap: 6px; margin-bottom: 16px; }
.subtabs button { padding: 7px 12px; border: 1px solid var(--line); background: var(--paper-raised); border-radius: 20px; cursor: pointer; font-size: 12px; font-family: var(--font-body); color: var(--ink-soft); }
.subtabs button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.period-picker-years, .period-picker-periods { display: flex; gap: 6px; flex-wrap: wrap; }
.period-picker-periods { margin-top: 8px; }
.period-picker button { padding: 6px 12px; border: 1px solid var(--line); background: var(--paper-raised); border-radius: 16px; cursor: pointer; font-size: 12px; font-family: var(--font-mono); color: var(--ink-soft); }
.period-picker button.active { background: var(--brass); color: #fff; border-color: var(--brass); }
.period-picker .pp-period-btn { min-width: 64px; text-align: center; }
.period-picker button.pp-has-data { background: var(--sage-bg); color: var(--sage); border-color: var(--sage); font-weight: 500; }
.pp-add-next-btn { padding: 8px 16px; border: none; background: var(--brass); color: #fff; border-radius: 16px; cursor: pointer; font-size: 12px; font-family: var(--font-mono); font-weight: 500; }
.pp-add-next-btn.active { box-shadow: 0 0 0 2px var(--ink); }
.period-picker button.pp-has-data.active { background: var(--brass); color: #fff; border-color: var(--brass); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-field { margin-bottom: 10px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label, .form-grid label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
.form-field input, .form-field textarea, .form-grid input, .form-grid textarea, .form-grid select {
  width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
  font-size: 13px; font-family: var(--font-body); background: var(--paper-raised); color: var(--ink);
}
.form-field input:focus, .form-field textarea:focus, .form-grid input:focus, .form-grid textarea:focus, .form-grid select:focus {
  outline: none; border-color: var(--brass);
}
input[type="file"] { border: none; padding: 4px 0; background: transparent; }
.save-msg { font-size: 12px; margin-top: 8px; }
.save-msg.ok { color: var(--sage); }
.save-msg.err { color: var(--rust); }

/* Business health wheel */
.hero-row { display: grid; grid-template-columns: 320px 1fr; gap: 24px; margin-bottom: 32px; }
.wheel-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; align-items: center; }
.wheel-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 4px; }
.wheel-score { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); margin-top: 12px; }
.wheel-score b { color: var(--ink); font-size: 16px; font-weight: 500; }
.side-cards { display: grid; grid-template-columns: 1fr; gap: 12px; align-content: start; }
.card-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 8px; }
.card-value { font-family: var(--font-display); font-size: 18px; margin: 0; }
.flag-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 13px; }
.flag-row-wrap { border-bottom: 1px solid var(--line); }
.flag-row-wrap:last-child { border-bottom: none; }
.flag-row-wrap:last-child .flag-row { padding-bottom: 4px; }
.flag-row .mini-link { margin-left: auto; flex-shrink: 0; }
.trend-line { font-size: 11px; margin: 4px 0 0; }
.trend-up { color: var(--sage); }
.trend-down { color: var(--rust); }
.trend-flat { color: var(--ink-soft); }
.flag-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.flag-dot.rust { background: var(--rust); }
.flag-dot.sage { background: var(--sage); }
.section-title { font-family: var(--font-display); font-size: 18px; margin: 0 0 16px; }
.pillar-legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 16px; margin-top: 16px; width: 100%; }
.pillar-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.pillar-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.pillar-legend-name { color: var(--ink-soft); }
.pillar-legend-score { font-family: var(--font-mono); margin-left: auto; color: var(--ink); }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
/* Scoped to just the Cash row, not every row — "Where the cash went" is
   structurally much taller than Operating Cash Conversion, and the default
   align-items: stretch was forcing the shorter card to match it, leaving a
   big empty gap above its target line. The other categories (Profitability,
   Working Capital, Balance Sheet) never had that mismatch, so they keep the
   default stretch behavior and their target lines keep aligning like before. */
.kpi-grid-cash { align-items: start; }
/* A category row with exactly one card (Tax's Effective tax rate is the only
   one — every other category has 2+, and Cash effectively has 2 once "Where
   the cash went" is appended) has no row-mate to share the width with —
   auto-fit collapses the unused column tracks and lets that single card
   stretch to the full row width instead of a normal card width. Capping the
   column width keeps it a sane, consistent size instead. */
.kpi-grid-solo { grid-template-columns: minmax(240px, 320px); }
.kpi-tile { min-width: 0; }
.kpi-value { font-family: var(--font-mono); font-size: 17px; margin: 0; color: var(--ink); }
.kpi-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--paper-raised); display: flex; flex-direction: column; }
.kpi-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.kpi-name { font-size: 12px; color: var(--ink-soft); margin: 0; }
.confidence-badge { font-size: 10px; letter-spacing: 0.02em; border-radius: 10px; padding: 2px 8px; white-space: nowrap; flex-shrink: 0; font-family: var(--font-body); }
.confidence-badge.green { background: var(--sage-bg); color: var(--sage); }
.confidence-badge.yellow { background: #F5EDD9; color: var(--brass); }
.confidence-badge.red { background: var(--rust-bg); color: var(--rust); }
.confidence-badge.neutral { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); }

/* Risk Review pills — three distinct visual registers so severity/status/
   source read as different KINDS of fact at a glance, not one undifferentiated
   row of same-looking tags: severity is filled+bold (it's the urgency verdict),
   status is outlined (it's a workflow stage, not a verdict), source is a
   neutral icon tag (it's just a category, not good/bad/either). */
.risk-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; font-family: var(--font-body); }
.risk-pill-severity.high { background: var(--rust); color: #fff; }
.risk-pill-severity.medium { background: var(--brass); color: #fff; }
.risk-pill-severity.low { background: var(--sage); color: #fff; }
.risk-pill-status { border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); font-weight: 500; }
.risk-pill-source { background: var(--paper); border: 1px solid var(--line); color: var(--ink-soft); font-weight: 500; }
.risk-pill-flag { background: var(--brass-soft); color: #fff; font-weight: 500; }

.risk-overall-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 10px; font-family: var(--font-display); font-size: 20px; }
.risk-overall-pill.High { background: var(--rust-bg); color: var(--rust); }
.risk-overall-pill.Medium { background: #F5EDD9; color: var(--brass); }
.risk-overall-pill.Low { background: var(--sage-bg); color: var(--sage); }

.risk-section-header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 6px; margin: 16px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
.risk-section-header.High { background: var(--rust-bg); color: var(--rust); }
.risk-section-header.Medium { background: #F5EDD9; color: var(--brass); }
.risk-section-header.Managed { background: var(--sage-bg); color: var(--sage); }

.risk-filter-pill { padding: 5px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); font-size: 12px; cursor: pointer; font-family: var(--font-body); }
.risk-filter-pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.risk-filter-pill:hover:not(.active) { border-color: var(--brass-soft); }
.kpi-card .kpi-value { font-size: 19px; }
.kpi-card .kpi-value.unavailable { color: var(--ink-soft); font-size: 15px; }
.kpi-value.good { color: var(--sage); }
.kpi-value.bad { color: var(--rust); }
.kpi-card .trend-line { margin: 3px 0 0; }
.kpi-interp { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; line-height: 1.4; padding-top: 8px; border-top: 1px solid var(--line); }
.kpi-benchmark { font-size: 12px; color: var(--ink-soft); margin: 6px 0 0; line-height: 1.4; }
.kpi-benchmark-tag { font-size: 10px; font-style: italic; color: var(--ink-soft); opacity: 0.75; }
.kpi-tip { font-size: 12px; color: var(--sage); margin: 6px 0 0; line-height: 1.4; }
.kpi-note { font-size: 11px; color: var(--brass); margin: 4px 0 0; font-style: italic; }
.kpi-group-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--brass); margin: 20px 0 10px; }
.kpi-group-label:first-of-type { margin-top: 0; }
.kpi-missing { font-size: 11px; color: var(--rust); margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--line); }
.kpi-target { font-size: 12px; color: var(--brass); margin: 0; }
.kpi-target-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }
.kpi-target-set { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }
.kpi-target-editor { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.kpi-target-editor input { width: 90px; padding: 8px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 15px; font-family: var(--font-mono); background: var(--paper-raised); color: var(--ink); }
.kpi-ocf-adjust { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.ocf-adjust-panel { margin-top: 8px; }
.ocf-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.ocf-row label { font-size: 11px; color: var(--ink-soft); }
.ocf-row input { width: 100px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; font-family: var(--font-mono); background: var(--paper-raised); color: var(--ink); }
.ocf-total { font-family: var(--font-mono); font-size: 14px; font-weight: 500; margin: 8px 0; padding-top: 6px; border-top: 1px solid var(--line); }
.kpi-cash-story { font-size: 12px; color: var(--ink); line-height: 1.5; margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
/* Cash in/out glance card — same compact footprint as the other KPI cards
   (no grid-column span), a headline net figure with a trend line, then a
   small grid of category tiles that double as shortcuts into the matching
   accordion section below. */
.cash-net-headline { display: flex; align-items: flex-start; gap: 20px; margin: 4px 0 2px; flex-wrap: wrap; }
.cash-net-stat { background: none; border: none; padding: 0; text-align: left; cursor: pointer; font-family: inherit; }
.cash-net-stat-label { font-size: 11px; color: var(--ink-soft); display: block; margin-top: 1px; }
.cash-net-value { font-family: var(--font-mono); font-size: 22px; font-weight: 600; margin: 0; color: var(--ink); }
.cash-net-value.neg { color: var(--rust); }
.cash-net-primary { color: var(--sage); }
.cash-net-primary.neg { color: var(--rust); }
.cash-tile-grid { display: flex; gap: 8px; margin: 10px 0; align-items: flex-start; }
.cash-tile-col { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cash-tile { background: var(--paper); border: none; border-radius: 8px; padding: 8px 10px; text-align: left; cursor: pointer; font-family: inherit; }
.cash-tile:hover { background: var(--line); }
.cash-tile-label { font-size: 11px; color: var(--ink-soft); margin: 0 0 2px; display: flex; align-items: center; gap: 4px; }
.cash-tile-value { font-family: var(--font-mono); font-size: 14px; font-weight: 500; margin: 0; color: var(--sage); }
.cash-tile-value.neg { color: var(--rust); }
.cash-breakdown { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.cash-accordion-section { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
.cash-accordion-section:last-of-type { margin-bottom: 0; }
.cash-accordion-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; background: var(--paper); cursor: pointer; border: none; width: 100%; font-family: inherit; text-align: left; }
.cash-accordion-head-label { font-size: 13px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.cash-accordion-head-value { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--sage); display: flex; align-items: center; gap: 4px; }
.cash-accordion-head-value.neg { color: var(--rust); }
.cash-accordion-body { padding: 10px 12px; }
.cash-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.cash-item:last-child { border-bottom: none; }
.cash-item-clickable { cursor: pointer; user-select: none; }
.cash-item-clickable:hover { background: var(--paper); margin: 0 -4px; padding-left: 4px; padding-right: 4px; border-radius: 6px; }
.cash-item-clickable .chevron { color: var(--ink-soft); font-size: 11px; }
.cash-adj-add-row { margin-top: 4px; }
.cash-jump-link { color: var(--brass); font-size: 12px; flex-shrink: 0; opacity: 0.7; }
.cash-jump-link:hover { opacity: 1; }
.jump-back-banner { background: var(--sage-bg); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.jump-back-banner button { color: var(--sage); font-weight: 500; font-size: 13px; }
.field-highlight { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; transition: outline-color 1.8s ease; }
.field-highlight.field-highlight-fade { outline-color: transparent; }
.cash-conv-explainer { display: flex; align-items: center; gap: 14px; margin: 10px 0; padding: 10px; border-radius: 8px; background: var(--paper); cursor: pointer; }
.cash-conv-explainer:hover { background: var(--line); }
.cash-conv-donut { width: 64px; height: 64px; flex-shrink: 0; }
.cash-conv-donut circle { transition: stroke-dasharray 0.3s ease; }
.cash-conv-donut-label { font-family: var(--font-mono); font-size: 16px; font-weight: 600; fill: var(--ink); }
.cash-conv-text { min-width: 0; }
.cash-conv-narrative { font-size: 13px; color: var(--ink); margin: 0 0 3px; line-height: 1.4; }
.cash-conv-followup { font-size: 12px; color: var(--ink-soft); margin: 0; line-height: 1.4; }
.cash-item-icon { width: 18px; text-align: center; font-size: 13px; flex-shrink: 0; }
.cash-item-label { flex: 1; font-size: 13px; color: var(--ink); }
.cash-item-label .sub { display: block; font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
.cash-item-amount { font-family: var(--font-mono); font-size: 14px; color: var(--ink); }
.cash-item-amount.readonly { color: var(--ink-soft); }
.cash-item-amount.neg { color: var(--rust); }
.cash-item-input { border: none; background: transparent; text-align: right; width: 110px; font: inherit; font-family: var(--font-mono); font-size: 14px; color: var(--ink); padding: 4px 6px; border-radius: 5px; }
.cash-item-input:hover { background: var(--paper); }
.cash-item-input:focus { background: var(--paper); outline: 1px solid var(--brass-soft); }
.cash-adj-label-input { flex: 1; border: none; background: transparent; font-size: 13px; font-family: var(--font-body); color: var(--ink); padding: 4px 6px; border-radius: 5px; }
.cash-adj-label-input:hover { background: var(--paper); }
.cash-adj-label-input:focus { background: var(--paper); outline: 1px solid var(--brass-soft); }
.cash-adj-remove { color: var(--rust); opacity: 0.55; font-size: 13px; flex-shrink: 0; }
.cash-adj-remove:hover { opacity: 1; }
/* Owner Wealth item rows — deliberately visibly boxed (unlike the borderless
   .cash-adj-label-input above), so it's obvious at a glance these are
   editable fields, not static text. */
.ow-item-label { flex: 1; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised); font-size: 13px; font-family: var(--font-body); color: var(--ink); padding: 6px 8px; }
.ow-item-value { border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised); text-align: right; width: 110px; font-family: var(--font-mono); font-size: 13px; color: var(--ink); padding: 6px 8px; }
.ow-item-label:focus, .ow-item-value:focus { outline: 1px solid var(--brass-soft); }
.cash-residual-box { margin-top: 4px; padding: 10px 14px; border-radius: 8px; background: var(--sage-bg); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

<script>
// ---- CONFIG: fill these in ----
const SUPABASE_URL = 'https://pptzbtxcotrxtcygxisz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwdHpidHhjb3RyeHRjeWd4aXN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMDYyNDgsImV4cCI6MjA5ODg4MjI0OH0.mJlQpNa9yTu0gU4J0HUnyHFhQyfY8UUBSQw8cYewn5U';

const today = () => new Date().toISOString().slice(0, 10);

// Every date display in the app goes through this — en-AU day-month-year, never
// the raw ISO string (which reads back-to-front: "2021-06-30" looks like it's
// in the wrong order to anyone expecting day/month/year).
function formatShortDate(iso) {
  return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}

// ---- Cadence-derived period-end dates ----
// Period-end dates are generated from the client's cadence + FY end rather than
// left as a free date field — a free field lets someone create near-duplicate
// "periods" a few days apart (exactly what happened in testing: 2026-08-04,
// 08-05, 08-07 instead of clean quarter-ends), which fragments analysis history.
function lastDayOfMonth(year, monthIndex) { return new Date(Date.UTC(year, monthIndex + 1, 0)); }
function subtractMonthsEnd(date, months) { return lastDayOfMonth(date.getUTCFullYear(), date.getUTCMonth() - months); }
function toISODate(d) { return d.toISOString().slice(0, 10); }

// Walks outward from an anchor in whole periods rather than looping calendar
// years — keeps the list short (a handful of recent periods + the next one)
// instead of dumping every quarter across 3+ years on the user at once.
// The anchor is the client's own history when it has any — latestExistingIso,
// the most recent real period_end on file — walked one step FORWARD so "add
// the next period" is the natural default. Falls back to anchoring off
// "today" only for a brand-new client with nothing to continue from. Anchoring
// to today unconditionally (the old behaviour) breaks the moment a client's
// real data lags behind the calendar — a client last entered in 2021, viewed
// in 2026, would otherwise be offered 2024/2025/2026 as candidate years with
// no way to reach 2022 or 2023, the periods that actually continue their
// history.
function generatePeriodOptions(cadence, fyEndStr, periodsBack = 6, periodsForward = 1, latestExistingIso = null) {
  if (!fyEndStr) return [];
  const fyEnd = new Date(fyEndStr + 'T00:00:00Z');
  const periodsPerYear = cadence === 'quarterly' ? 4 : cadence === 'half_yearly' ? 2 : 1;
  const stepMonths = 12 / periodsPerYear;
  const nowIso = today();

  let cursor;
  if (latestExistingIso) {
    // Seeded from the client's real history (fixes the reachability bug),
    // but still walked using the CURRENT fy_end's month/day — otherwise
    // changing fy_end after periods exist would do nothing at all, since
    // this branch would just keep repeating the old period's own
    // month/day forever regardless of what fy_end now says. If fy_end's
    // pattern genuinely changed (e.g. a real FY-end change), this lands on
    // whatever's next after the client's last period under the NEW
    // pattern — which may be a shorter "stub" gap than a full cadence
    // step, same as a real FY-end change produces in practice.
    const latest = new Date(latestExistingIso + 'T00:00:00Z');
    cursor = lastDayOfMonth(latest.getUTCFullYear(), fyEnd.getUTCMonth());
    while (toISODate(cursor) <= toISODate(latest)) cursor = subtractMonthsEnd(cursor, -stepMonths);
    // If the client has fallen multiple periods behind (their last real
    // period is a while before today), the forward window needs to reach
    // at least up to today's period — otherwise there's no way to jump
    // straight to the current period; you'd be stuck clicking "add" one
    // period at a time just to catch up to now.
    let probe = cursor;
    while (toISODate(probe) < nowIso) { probe = subtractMonthsEnd(probe, -stepMonths); periodsForward++; }
  } else {
    // Find the most recent period-end <= today by walking from the FY-end month/day
    // (whichever year lands closest) forward/backward in whole-period steps.
    cursor = lastDayOfMonth(new Date().getUTCFullYear(), fyEnd.getUTCMonth());
    while (toISODate(cursor) > nowIso) cursor = subtractMonthsEnd(cursor, stepMonths);
    while (toISODate(subtractMonthsEnd(cursor, -stepMonths)) <= nowIso) cursor = subtractMonthsEnd(cursor, -stepMonths);
  }

  const options = [];
  for (let i = -periodsForward; i <= periodsBack; i++) {
    const d = subtractMonthsEnd(cursor, i * stepMonths);
    // How many steps this date sits before the nearest FY end determines its
    // quarter/half number (0 steps = the FY-end period itself = Q4/H2).
    const monthsBeforeFyEnd = ((fyEnd.getUTCMonth() - d.getUTCMonth()) + 12) % 12;
    const stepsBeforeFyEnd = Math.round(monthsBeforeFyEnd / stepMonths);
    const periodNumber = periodsPerYear - stepsBeforeFyEnd;
    const tag = periodsPerYear === 4 ? `Q${periodNumber}` : periodsPerYear === 2 ? `H${periodNumber}` : '';
    const iso = toISODate(d);
    options.push({ value: iso, tag, label: (tag ? tag + ' · ' : '') + formatShortDate(iso) });
  }
  return options.sort((a, b) => b.value.localeCompare(a.value));
}

// Same "steps before FY end" arithmetic generatePeriodOptions uses to tag
// its own freshly-generated options, pulled out standalone so a period
// picked from real history (already saved, not being generated) can be
// labelled the same way — "which quarter am I looking at" for the period
// currently selected at the top, in FY terms rather than a bare date.
function periodQuarterLabel(periodEndIso, cadence, fyEndStr) {
  if (!periodEndIso || !fyEndStr) return '';
  const periodEnd = new Date(periodEndIso + 'T00:00:00Z');
  const fyEnd = new Date(fyEndStr + 'T00:00:00Z');
  const periodsPerYear = cadence === 'quarterly' ? 4 : cadence === 'half_yearly' ? 2 : 1;
  const stepMonths = 12 / periodsPerYear;
  const monthsBeforeFyEnd = ((fyEnd.getUTCMonth() - periodEnd.getUTCMonth()) + 12) % 12;
  const stepsBeforeFyEnd = Math.round(monthsBeforeFyEnd / stepMonths);
  const periodNumber = periodsPerYear - stepsBeforeFyEnd;
  const tag = periodsPerYear === 4 ? `Q${periodNumber}` : periodsPerYear === 2 ? `H${periodNumber}` : '';
  // The FY this period sits inside — same calendar year as fyEnd's own
  // month if the period hasn't reached that month yet this year, otherwise
  // the year fyEnd next falls in.
  const fyYear = periodEnd.getUTCMonth() <= fyEnd.getUTCMonth() ? periodEnd.getUTCFullYear() : periodEnd.getUTCFullYear() + 1;
  const fyLabel = `FY${String(fyYear).slice(-2)}`;
  return tag ? `${fyLabel} ${tag}` : fyLabel;
}

// Two-step year → period picker, replacing a single long flat dropdown — pick
// the year first, then just the quarter/half within it (or the one annual date).
// Keeps a hidden input at `hiddenInputId` so existing `.value` reads elsewhere
// (save handlers) don't need to change.
// Rebuilt around a real observation: marking candidate dates with a ✓ still
// wasn't enough — showing 8 speculative years by default reads as "8 things
// that exist" no matter how they're labelled. Now the default view shows
// ONLY what's real (existing periods, as plain pills) plus one obvious
// "+ Add <next date>" action — the full year/quarter grid (candidate AND
// existing) is tucked behind a "Different date?" toggle for the rare
// backfill case, not shown by default.
// Default "next period to add" prefers the period that actually continues
// this client's history (the one right after their latest) over "whatever's
// closest to today" — the two only coincide for a client whose data entry is
// already current. Pulled out standalone so the top-bar "+ New period"
// control can jump straight to this date (see new-period-btn's handler)
// instead of dumping the user into an input screen to pick it themselves.
function computeAddNextPeriodValue(cadence, fyEndStr, latestExistingIso) {
  if (!fyEndStr) return '';
  const options = generatePeriodOptions(cadence, fyEndStr, 6, 1, latestExistingIso);
  const nextAfterExisting = latestExistingIso
    ? options.filter((o) => o.value > latestExistingIso).sort((a, b) => a.value.localeCompare(b.value))[0]?.value
    : null;
  const mostRecentCompleted = options.find((o) => o.value <= today())?.value;
  return nextAfterExisting || mostRecentCompleted || options[0]?.value || '';
}

// Same fiscal-year-number arithmetic periodQuarterLabel uses internally
// (Sept 2027, on a June FY-end, is FY28 not FY27) — pulled out standalone so
// buildPeriodYearMap can group by the FY a period actually belongs to
// instead of the calendar year its date happens to fall in.
function periodFyYear(periodEndIso, fyEndStr) {
  const d = new Date(periodEndIso + 'T00:00:00Z');
  const fyEnd = new Date(fyEndStr + 'T00:00:00Z');
  return String(d.getUTCMonth() <= fyEnd.getUTCMonth() ? d.getUTCFullYear() : d.getUTCFullYear() + 1);
}

// top-bar Year/Quarter pills and periodPickerHtml's advanced grid so both
// agree on what years/periods exist. Real existing periods are always
// folded in even if generatePeriodOptions's window doesn't reach them, the
// same fix that stopped older real periods from vanishing from
// periodPickerHtml's own list. extraDate does the same for a period chosen
// via the top bar's "+ New period" panel that can be arbitrarily far outside
// the generated window (e.g. FY30 when history only runs to FY27) — without
// this it wouldn't show up in Financial Input's own picker at all.
function buildPeriodYearMap(cadence, fyEndStr, latestExistingIso, extraDate) {
  const options = generatePeriodOptions(cadence, fyEndStr, 6, 1, latestExistingIso);
  const byYear = {};
  const addOption = (o) => { const y = periodFyYear(o.value, fyEndStr); (byYear[y] = byYear[y] || []).push(o); };
  options.forEach(addOption);
  [...availablePeriods, ...(extraDate ? [extraDate] : [])].forEach((p) => {
    const y = periodFyYear(p, fyEndStr);
    if (!(byYear[y] || []).some((o) => o.value === p)) addOption({ value: p, tag: periodQuarterLabel(p, cadence, fyEndStr) });
  });
  Object.values(byYear).forEach((list) => list.sort((a, b) => a.value.localeCompare(b.value)));
  const years = Object.keys(byYear).sort((a, b) => b.localeCompare(a));
  return { byYear, years };
}

// Which Q/H number (1..periodsPerYear) a period-end date is within its own
// fiscal year — the inverse pairing of periodEndFromFyYearAndNumber below.
function periodNumberOf(periodEndIso, cadence, fyEndStr) {
  const d = new Date(periodEndIso + 'T00:00:00Z');
  const fyEnd = new Date(fyEndStr + 'T00:00:00Z');
  const periodsPerYear = cadence === 'quarterly' ? 4 : cadence === 'half_yearly' ? 2 : 1;
  const stepMonths = 12 / periodsPerYear;
  const monthsBeforeFyEnd = ((fyEnd.getUTCMonth() - d.getUTCMonth()) + 12) % 12;
  return periodsPerYear - Math.round(monthsBeforeFyEnd / stepMonths);
}

// Turns an explicit "FY29 Q1" style choice into an actual period-end date —
// the direct add-a-period path: pick the year and quarter/half straight out,
// rather than hunting through a generated candidate grid for it.
function periodEndFromFyYearAndNumber(fyYearNum, periodNumber, cadence, fyEndStr) {
  const fyEnd = new Date(fyEndStr + 'T00:00:00Z');
  const periodsPerYear = cadence === 'quarterly' ? 4 : cadence === 'half_yearly' ? 2 : 1;
  const stepMonths = 12 / periodsPerYear;
  const q4Date = lastDayOfMonth(fyYearNum, fyEnd.getUTCMonth());
  return toISODate(subtractMonthsEnd(q4Date, (periodsPerYear - periodNumber) * stepMonths));
}

// existingOnly (PDF Review, Xero Sync) drops the "+ Add" button and filters
// the advanced grid down to periods that already have data — those screens
// work against whatever period is already selected (set from the top bar),
// but don't get their own separate way to pick/create a NEW one; that's
// Manual Entry's job exclusively now (see the top bar's "+ New period").
function periodPickerHtml(hiddenInputId, cadence, fyEndStr, selectedValue, latestExistingIso = null, existingOnly = false) {
  if (!fyEndStr) {
    return `<p class="muted plain" style="color:var(--rust); margin:0;">Set this client's financial year end in Profile before entering data — period-end dates are derived from it.</p>`;
  }
  const { byYear: byYearFull, years: yearsFull } = buildPeriodYearMap(cadence, fyEndStr, latestExistingIso, selectedValue);
  const byYear = existingOnly
    ? Object.fromEntries(Object.entries(byYearFull).map(([y, list]) => [y, list.filter((o) => availablePeriods.includes(o.value))]).filter(([, list]) => list.length))
    : byYearFull;
  const years = existingOnly ? Object.keys(byYear).sort((a, b) => b.localeCompare(a)) : yearsFull;

  const addNextValue = computeAddNextPeriodValue(cadence, fyEndStr, latestExistingIso);
  // selectedValue is always the app's actual currentPeriodEnd, set
  // deliberately by the top-bar pills/"+ New period" panel — trusted as-is
  // rather than re-validated against a generated candidate window, which
  // used to silently substitute a nearby "next" date whenever the real
  // selection (e.g. FY30, picked explicitly, years past current history)
  // fell outside that window. buildPeriodYearMap folding it in above (as
  // extraDate) keeps the advanced grid showing it too, not just this value.
  const sel = selectedValue || addNextValue;
  const selYear = periodFyYear(sel, fyEndStr);
  const selIsExisting = availablePeriods.includes(sel);
  // The one-click "add" button reflects whatever non-existing period is
  // ACTUALLY selected, not always the generic "next after latest" — without
  // this, picking an explicit backfill period from the top bar (e.g. FY27
  // Q3, which isn't the computed "next" period) showed no confirmation
  // anywhere in this collapsed view at all: the existing pills don't include
  // it and the add button still showed the unrelated default date, making it
  // look like the selection had been silently dropped.
  const addButtonValue = selIsExisting ? addNextValue : sel;

  // Built from availablePeriods directly, not filtered out of the generated
  // candidate window — that window is a small slice centred on "the next
  // period," so an older real period can fall outside it (e.g. right after
  // adding a period years ahead of the rest of the history) even though
  // it's still genuinely on file. This list is what's actually real, full
  // stop, independent of whatever window generatePeriodOptions happened to
  // compute this render.
  // Capped to the most recent handful — a client with years of quarterly
  // history would otherwise dump 40+ pills in one unbroken row. Anything
  // older (or the currently-selected sel, if it's further back than the cap)
  // is still reachable via "Different date?" below, grouped sensibly by
  // year rather than as one flat list.
  const EXISTING_PILLS_CAP = 8;
  const allExisting = [...availablePeriods].sort((a, b) => b.localeCompare(a));
  const existingInOptions = allExisting.slice(0, EXISTING_PILLS_CAP);
  if (selIsExisting && !existingInOptions.includes(sel)) existingInOptions.push(sel);
  const olderCount = allExisting.length - existingInOptions.length;
  const periodBtnHtml = (o) => {
    const hasData = availablePeriods.includes(o.value);
    return `<button type="button" class="pp-period-btn ${o.value === sel ? 'active' : ''} ${hasData ? 'pp-has-data' : ''}" data-value="${o.value}" title="${hasData ? 'Existing data — selecting will overwrite it' : 'No data yet — pick this to add it'}">${hasData ? '✓ ' : ''}${o.tag || formatShortDate(o.value)}</button>`;
  };

  return `
    <div class="period-picker" id="${hiddenInputId}-picker">
      ${existingInOptions.length ? `
        <p class="muted plain" style="margin:0 0 6px; font-size:11px;">Existing periods — click to view or edit:</p>
        <div class="period-picker-years" id="${hiddenInputId}-existing">
          ${existingInOptions.map((v) => `<button type="button" class="pp-existing-btn pp-has-data ${v === sel ? 'active' : ''}" data-value="${v}">✓ ${formatShortDate(v)}</button>`).join('')}
        </div>
        ${olderCount > 0 ? `<p class="muted plain" style="margin:6px 0 0; font-size:11px;">+ ${olderCount} older period${olderCount === 1 ? '' : 's'} — see "Different date?" below to browse by year.</p>` : ''}
      ` : ''}
      <div style="margin-top:${existingInOptions.length ? '10px' : '0'}; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        ${existingOnly ? '' : `<button type="button" class="pp-add-next-btn ${!selIsExisting ? 'active' : ''}" id="${hiddenInputId}-add-next" data-value="${addButtonValue}">+ Add ${formatShortDate(addButtonValue)}</button>`}
        <button type="button" class="mini-link" id="${hiddenInputId}-toggle-advanced" style="font-size:11px;">Different date?</button>
      </div>
      <div id="${hiddenInputId}-advanced" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);">
        <div class="period-picker-years">
          ${years.map((y) => `<button type="button" class="pp-year-btn ${y === selYear ? 'active' : ''}" data-year="${y}">${y}</button>`).join('')}
        </div>
        <div class="period-picker-periods" id="${hiddenInputId}-periods">
          ${(byYear[selYear] || byYear[years[0]] || []).map(periodBtnHtml).join('')}
        </div>
        <p class="muted plain" style="margin:6px 0 0; font-size:11px;">✓ = already has data saved.</p>
      </div>
      <input type="hidden" id="${hiddenInputId}" value="${sel}" />
    </div>
  `;
}

// Wires the click handlers for periodPickerHtml's output — call once after
// inserting it into the DOM.
// onChange(newPeriodEnd), when given, fires whenever the picker's selected
// period changes (year switch or period click) — lets the caller reload
// whatever's already saved for that period, e.g. to re-fill a form.
function wirePeriodPicker(hiddenInputId, cadence, fyEndStr, onChange, latestExistingIso = null, syncGlobalPeriod = false, existingOnly = false) {
  const hidden = document.getElementById(hiddenInputId);
  if (!hidden) return; // fy_end missing — only the warning message was rendered
  const { byYear: byYearFull } = buildPeriodYearMap(cadence, fyEndStr, latestExistingIso, hidden.value);
  const byYear = existingOnly
    ? Object.fromEntries(Object.entries(byYearFull).map(([y, list]) => [y, list.filter((o) => availablePeriods.includes(o.value))]).filter(([, list]) => list.length))
    : byYearFull;
  const root = document.getElementById(`${hiddenInputId}-picker`);
  const periodsWrap = document.getElementById(`${hiddenInputId}-periods`);
  const existingWrap = document.getElementById(`${hiddenInputId}-existing`);
  const addNextBtn = document.getElementById(`${hiddenInputId}-add-next`);
  const toggleBtn = document.getElementById(`${hiddenInputId}-toggle-advanced`);
  const advancedWrap = document.getElementById(`${hiddenInputId}-advanced`);

  // One shared "this is now the selected value" path for all three ways to
  // pick one (an existing-period pill, the Add-next button, or a date from
  // the advanced grid) — keeps their active/inactive states from drifting
  // out of sync with each other, since only one of the three should ever
  // show as selected at a time. syncGlobalPeriod (only true for the primary
  // "which period am I working on" pickers — Manual Entry, PDF Review, Xero
  // Sync — never the PDF comparative-period picker, which is a genuinely
  // separate, secondary date) also pushes the choice back up to the top
  // bar's currentPeriodEnd, so clicking a pill in here doesn't leave the top
  // pills silently pointing at something else.
  const selectValue = (value) => {
    hidden.value = value;
    existingWrap?.querySelectorAll('.pp-existing-btn').forEach((b) => b.classList.toggle('active', b.dataset.value === value));
    addNextBtn?.classList.toggle('active', addNextBtn.dataset.value === value);
    periodsWrap?.querySelectorAll('.pp-period-btn').forEach((b) => b.classList.toggle('active', b.dataset.value === value));
    if (syncGlobalPeriod && value !== currentPeriodEnd) {
      currentPeriodEnd = value;
      renderPeriodPills();
      refreshHealthBadge();
    }
    onChange?.(value);
  };

  existingWrap?.querySelectorAll('.pp-existing-btn').forEach((btn) => {
    btn.onclick = () => selectValue(btn.dataset.value);
  });
  if (addNextBtn) addNextBtn.onclick = () => selectValue(addNextBtn.dataset.value);
  if (toggleBtn) {
    toggleBtn.onclick = () => {
      advancedWrap.style.display = advancedWrap.style.display === 'none' ? 'block' : 'none';
    };
  }

  function wirePeriodButtons() {
    periodsWrap.querySelectorAll('.pp-period-btn').forEach((btn) => {
      btn.onclick = () => selectValue(btn.dataset.value);
    });
  }

  root.querySelectorAll('.pp-year-btn').forEach((btn) => {
    btn.onclick = () => {
      root.querySelectorAll('.pp-year-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      const year = btn.dataset.year;
      periodsWrap.innerHTML = byYear[year].map((o) => {
        const hasData = availablePeriods.includes(o.value);
        return `<button type="button" class="pp-period-btn ${hasData ? 'pp-has-data' : ''}" data-value="${o.value}" title="${hasData ? 'Existing data — selecting will overwrite it' : 'No data yet — pick this to add it'}">${hasData ? '✓ ' : ''}${o.tag || formatShortDate(o.value)}</button>`;
      }).join('');
      wirePeriodButtons();
      // Default to this year's most-recent-completed period, or its first option.
      const defaultOpt = byYear[year].find((o) => o.value <= today()) || byYear[year][0];
      selectValue(defaultOpt.value);
    };
  });

  wirePeriodButtons();
}

// Impact x Urgency x Ease scoring for Meeting Mode — frontend-only ranking layer,
// deliberately not persisted (flags table schema is untouched). Matched against the
// three rules currently produced by analyze.js's runFlags(); anything else gets a
// neutral default so the ranking degrades gracefully as more rules are added later.
const FLAG_SCORING_RULES = [
  { test: (f) => /debtor days/i.test(f.message), impact: 9, urgency: 8, ease: 7 },
  { test: (f) => /gross margin/i.test(f.message), impact: 8, urgency: 6, ease: 5 },
  { test: (f) => /current ratio/i.test(f.message), impact: 9, urgency: 9, ease: 4 },
  // Real cash-crunch risk (can they actually fund the bill) outranks a rate
  // move that's merely worth asking "why" about — reflected in urgency/ease.
  { test: (f) => f.risk_category === 'Tax affordability risk', impact: 9, urgency: 9, ease: 5 },
  { test: (f) => f.risk_category === 'Tax rate shift', impact: 7, urgency: 6, ease: 8 },
  // risk_items-derived candidates (business/industry/owner_wealth — see
  // buildMeetingCandidates) carry a `source` field genuine flags table
  // rows never have, so these two rules only ever match those, never a
  // real flag — weighted by risk_items' own severity rather than falling
  // through to the neutral default, so a High-severity gap can actually
  // compete for a Top 3 slot instead of always losing to a flag.
  { test: (f) => f.source && f.severity === 'High', impact: 8, urgency: 7, ease: 5 },
  { test: (f) => f.source && f.severity === 'Medium', impact: 6, urgency: 5, ease: 5 },
];
const DEFAULT_FLAG_SCORE = { impact: 5, urgency: 5, ease: 5 };
function scoreFlag(f) {
  const rule = FLAG_SCORING_RULES.find((r) => r.test(f));
  const s = rule || DEFAULT_FLAG_SCORE;
  return { impact: s.impact, urgency: s.urgency, ease: s.ease, priorityScore: s.impact * s.urgency * s.ease };
}

let currentCtx = null;
let availablePeriods = [];
let currentPeriodEnd = null;
// Tax outlook (Financial Performance -> Analyse -> Tax) is a scratch
// scenario tool, not saved data — but renderMain() re-runs on nearly every
// action (tab switch, suggest-target click, saving something elsewhere),
// which rebuilds the card's HTML from scratch each time. Without holding the
// typed values here, that rebuild would reset every field back to its
// hardcoded default and silently discard whatever the adviser was modelling
// mid-meeting.
let taxOutlookState = { unit: 'pct', revenue: 0, gp: 0, opex: 0, netProfit: 0, netProfitAbsolute: '', super: 0, equipment: 0, compareEntity: '', compareShares: [50, 50, 0, 0], compareOtherIncome: ['', '', '', ''] };
// Every renderMain() call bumps this. A render function that awaits something
// before writing to #tab-content captures the token at entry and checks it's
// still current right before writing — if a newer render started meanwhile
// (fast tab/domain switching), the stale one silently no-ops instead of
// clobbering whatever the newer render already put on screen.
let renderToken = 0;

async function callRead(action, client_id, period_end, extra) {
  const res = await fetch('/.netlify/functions/read-data', {
    method: 'POST',
    body: JSON.stringify({ action, client_id, period_end, ...(extra || {}) }),
  });
  return res.json();
}

function capCadence(c) {
  return (c || '').replace('_', ' ').replace(/\b\w/g, (ch) => ch.toUpperCase());
}

// No dedicated name field existed before — client name and business description
// used to be conflated (first sentence of the description shown as the "name").
// Falls back gracefully for clients that haven't set a real name yet.
function clientDisplayName(ctx, fallbackId) {
  return ctx?.profile_extra?.business_name || ctx?.business_description?.split('.')[0] || fallbackId;
}

// ---- Client list / selection ----
// Archived clients (is_archived on client_context) never appear in this
// picker — they're managed entirely from the dedicated Archived clients
// panel (renderArchivedClients), reached via the sidebar link.
async function loadClients() {
  const data = await callRead('list_clients');
  const sel = document.getElementById('client-select');
  sel.innerHTML = '<option value="">Select a client…</option>' +
    (data || []).map((c) => `<option value="${c.client_id}">${clientDisplayName(c, c.client_id)}</option>`).join('');
  sel.value = currentClientId || '';
}

// Clears back to the "Select a client…" / client-portfolio state — used
// when the dropdown is reset to blank, and after archiving/deleting the
// client currently being viewed (currentClientId is no longer valid to
// keep showing at that point).
async function resetToNoClient() {
  currentClientId = null;
  currentCtx = null;
  availablePeriods = [];
  currentPeriodEnd = null;
  document.getElementById('workflow-tabs').style.display = '';
  document.getElementById('client-name').textContent = 'Select a client';
  document.getElementById('client-subline').textContent = '';
  document.getElementById('client-select').value = '';
  document.getElementById('domain-list').innerHTML = '';
  document.getElementById('tab-content').innerHTML = '';
  document.getElementById('new-period-form').style.display = 'none';
  renderPeriodPills();
  await loadClients();
}

// Dedicated management view for archived clients — reached via the sidebar's
// "Archived clients" link, not tied to currentClientId. One click to
// unarchive; permanent delete is tick-box + single confirm (no typed name —
// that was too much friction for what's meant to be a quick cleanup action).
async function renderArchivedClients() {
  const content = document.getElementById('tab-content');
  document.getElementById('workflow-tabs').style.display = 'none';
  const returningClientId = currentClientId;
  const clients = await callRead('list_clients', undefined, undefined, { include_archived: true });
  const archived = (clients || []).filter((c) => c.is_archived);

  content.innerHTML = `
    <div class="card">
      <p class="muted">Archived clients</p>
      ${archived.length ? '<p class="muted plain" style="margin:0 0 12px;">Tick a client to permanently delete them, or unarchive to bring them back to the client list.</p>' : '<p class="muted plain" style="margin:0;">No archived clients.</p>'}
      ${archived.map((c) => `
        <div class="cash-item" style="align-items:center; gap:10px;">
          <input type="checkbox" class="archived-delete-check" data-id="${c.client_id}" data-name="${escAttr(clientDisplayName(c, c.client_id))}" />
          <span style="flex:1;">${clientDisplayName(c, c.client_id)}</span>
          <button class="mini-link archived-unarchive-btn" data-id="${c.client_id}" type="button">Unarchive</button>
        </div>
      `).join('')}
      ${archived.length ? `<button class="action" id="archived-delete-selected-btn" type="button" style="margin-top:14px; background:#9C4B3C;">Permanently delete selected</button>` : ''}
      <div class="save-msg" id="archived-msg"></div>
      <button class="mini-link" id="archived-back-btn" type="button" style="margin-top:16px; display:block;">← Back</button>
    </div>
  `;

  const goBack = async () => {
    if (returningClientId) { currentClientId = returningClientId; await selectClient(returningClientId); }
    else await resetToNoClient();
  };
  document.getElementById('archived-back-btn').onclick = goBack;

  content.querySelectorAll('.archived-unarchive-btn').forEach((btn) => {
    btn.onclick = async () => {
      const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify({ type: 'unarchive_client', client_id: btn.dataset.id }) });
      const data = await res.json();
      const msg = document.getElementById('archived-msg');
      if (data.error) { msg.textContent = 'Error: ' + data.error; msg.className = 'save-msg err'; return; }
      await loadClients();
      await renderArchivedClients();
    };
  });

  const deleteBtn = document.getElementById('archived-delete-selected-btn');
  if (deleteBtn) deleteBtn.onclick = async () => {
    const checked = [...content.querySelectorAll('.archived-delete-check:checked')];
    const msg = document.getElementById('archived-msg');
    if (!checked.length) { msg.textContent = 'Tick at least one client first.'; msg.className = 'save-msg err'; return; }
    const names = checked.map((c) => c.dataset.name).join(', ');
    if (!confirm(`Permanently delete ${checked.length === 1 ? names : `${checked.length} clients (${names})`}? This deletes everything on file for them and cannot be undone.`)) return;
    for (const c of checked) {
      const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify({ type: 'delete_client', client_id: c.dataset.id }) });
      const data = await res.json();
      if (data.error) { msg.textContent = 'Error: ' + data.error; msg.className = 'save-msg err'; return; }
    }
    await loadClients();
    await renderArchivedClients();
  };
}

// preferredPeriod lets a save handler keep viewing the period it just wrote to
// instead of silently jumping to "most recent" — without this, saving data for
// an older period (e.g. a catch-up entry) would switch the whole app to showing
// a different period's numbers, making the save look like it didn't take.
async function loadPeriods(preferredPeriod) {
  const periods = await callRead('list_periods', currentClientId);
  availablePeriods = periods || [];
  currentPeriodEnd = (preferredPeriod && availablePeriods.includes(preferredPeriod)) ? preferredPeriod : (availablePeriods[0] || null);
  renderPeriodPills();
}

// Two separate top-bar pills — Year (FYxx) and Quarter/Half (Qx/Hx) — rather
// than one combined dropdown, so switching within a year or jumping years is
// two clicks apart instead of scanning one long flat list. The quarter pill
// hides entirely for annual clients (the year pill alone already picks a
// single date). These only ever list REAL periods (availablePeriods) — no
// speculative "+" candidates cluttering the list; adding a period that isn't
// on file yet is a separate, explicit action (see the "+ New period" panel)
// rather than something these pills try to offer inline. The one exception:
// if a period was just chosen via that panel and has no data saved yet,
// it's shown too (plainly, no marker) so the pills stay truthful about what
// you're actually looking at.
function renderPeriodPills() {
  const yearSel = document.getElementById('period-year-select');
  const qSel = document.getElementById('period-quarter-select');
  const cadence = currentCtx?.cadence;
  const fyEnd = currentCtx?.fy_end;
  const dates = [...availablePeriods];
  if (currentPeriodEnd && !dates.includes(currentPeriodEnd)) dates.push(currentPeriodEnd);

  if (!fyEnd || !dates.length) {
    yearSel.innerHTML = '<option value="">No data yet</option>';
    qSel.innerHTML = '';
    qSel.style.display = 'none';
    return;
  }
  const byYear = {};
  dates.forEach((p) => { const y = periodFyYear(p, fyEnd); (byYear[y] = byYear[y] || []).push(p); });
  Object.values(byYear).forEach((list) => list.sort());
  const years = Object.keys(byYear).sort((a, b) => b.localeCompare(a));

  const curFyYear = currentPeriodEnd ? periodFyYear(currentPeriodEnd, fyEnd) : null;
  const selYear = (curFyYear && byYear[curFyYear]) ? curFyYear : years[0];
  yearSel.innerHTML = years.map((y) => `<option value="${y}" ${y === selYear ? 'selected' : ''}>FY${y.slice(-2)}</option>`).join('');

  const periodsInYear = byYear[selYear] || [];
  const isSingle = cadence !== 'quarterly' && cadence !== 'half_yearly';
  qSel.style.display = isSingle ? 'none' : '';
  if (!currentPeriodEnd || !periodsInYear.includes(currentPeriodEnd)) currentPeriodEnd = periodsInYear[0] || null;
  qSel.innerHTML = periodsInYear.map((p) => {
    const tag = periodQuarterLabel(p, cadence, fyEnd).replace(/^FY\d+\s*/, '') || formatShortDate(p);
    return `<option value="${p}" ${p === currentPeriodEnd ? 'selected' : ''}>${tag}</option>`;
  }).join('');
}

async function refreshHealthBadge() {
  const badge = document.getElementById('health-badge');
  if (!currentPeriodEnd) { badge.textContent = 'Health: —'; return; }
  const overview = await callRead('get_overview', currentClientId, currentPeriodEnd);
  badge.textContent = overview?.healthScore ? `Health: ${overview.healthScore.score}/100` : 'Health: —';
}

function renderSidebarDomains() {
  const wrap = document.getElementById('domain-list');
  const domainBtn = (d) => {
    let dotClass = 'domain-dot';
    if (d.key === 'financial' && currentPeriodEnd && availablePeriods.includes(currentPeriodEnd)) dotClass += ' dot-done';
    if (d.key === 'goals' && currentPeriodEnd && GOAL_CATEGORIES.some((c) => (currentCtx?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.[c.key]?.items || []).some((it) => !it.deleted))) dotClass += ' dot-done';
    return `<button data-domain="${d.key}" class="${d.key === currentDomain ? 'active' : ''}"><span class="${dotClass}"></span>${d.label}</button>`;
  };
  // Three groups, one shared #domain-list container and delegated click
  // listener (still matches on data-domain regardless of which group a
  // button sits in) — Profile above Framework (setup, read by everything
  // else), Framework in the middle (the 5 intelligence domains), Actions
  // below (the execution layer). See PROFILE_DOMAIN/ACTIONS_DOMAIN for why
  // each sits outside DOMAINS instead of being a 6th/7th framework item.
  wrap.innerHTML = `<p class="muted sidebar-section-gap" style="margin-top:0;">Profile</p>`
    + domainBtn(PROFILE_DOMAIN)
    + `<p class="muted sidebar-section-gap">Framework</p>`
    + DOMAINS.map(domainBtn).join('')
    + `<p class="muted sidebar-section-gap">Actions</p>`
    + domainBtn(ACTIONS_DOMAIN);
}

function renderWorkflowTabsActive() {

}

// Risk review actions (Confirm/Investigate/Not applicable/No longer a risk)
// — wired ONCE here rather than inside renderRiskAnalyse. #tab-content is a
// single persistent element that only ever gets its innerHTML replaced, not
// recreated, so an addEventListener call inside a function that reruns
// every time the Risk tab is opened (renderRiskAnalyse does, via renderMain)
// would stack up one extra listener per visit — every click on a status
// button would then fire the save, and the refresh, once per stacked
// listener, racing several overlapping refreshRiskLists() calls against
// each other. That's what was making the industry list's order look like it
// was shuffling itself and the whole section flicker/reset on a click: it
// wasn't one click, it was N of them landing at once. Delegation still
// catches buttons injected later (e.g. a business questionnaire's inline
// synthesis result), same as before — this only changes WHERE it's wired.
document.getElementById('tab-content').addEventListener('click', async (e) => {
  const btn = e.target.closest('.risk-action-btn');
  if (!btn) return;
  const buttonsInRow = btn.parentElement.querySelectorAll('.risk-action-btn');
  buttonsInRow.forEach((b) => { b.disabled = true; });
  const original = btn.textContent;
  btn.textContent = '…';
  try {
    const res = await fetch('/.netlify/functions/manual-entry', {
      method: 'POST',
      body: JSON.stringify({ type: 'risk_review_action', risk_item_id: btn.dataset.riskId, action: btn.dataset.riskAction }),
    });
    const result = await res.json();
    if (result.error) throw new Error(result.error);
    await refreshRiskLists();
  } catch (err) {
    buttonsInRow.forEach((b) => { b.disabled = false; });
    btn.textContent = original;
    alert('Error: ' + err.message);
  }
});

// Picking a period — existing or a "+ not yet on file" candidate — just
// updates the top bar and re-renders whatever screen is already open. It
// never navigates to Financial Input on its own; entering data for a new
// period is a separate, deliberate trip the user makes themselves.
function onPeriodPillChanged() {
  goalSuggestionsCache = {};
  refreshHealthBadge();
  renderSidebarDomains();
  renderMain();
}

document.getElementById('period-year-select').addEventListener('change', () => {
  // Jumping year: land on that year's most recent real period if it has
  // one; otherwise fall back to that year's own Q4/H2/annual date so
  // there's always something sensible selected, even for a year with no
  // data on file yet.
  const targetYear = document.getElementById('period-year-select').value;
  const cadence = currentCtx.cadence, fyEnd = currentCtx.fy_end;
  const realInYear = availablePeriods.filter((p) => periodFyYear(p, fyEnd) === targetYear).sort();
  const periodsPerYear = cadence === 'quarterly' ? 4 : cadence === 'half_yearly' ? 2 : 1;
  currentPeriodEnd = realInYear[realInYear.length - 1] || periodEndFromFyYearAndNumber(Number(targetYear), periodsPerYear, cadence, fyEnd);
  renderPeriodPills();
  onPeriodPillChanged();
});

document.getElementById('period-quarter-select').addEventListener('change', (e) => {
  currentPeriodEnd = e.target.value || null;
  onPeriodPillChanged();
});

// "+ New period" opens a small explicit form — type the financial year and
// pick the quarter/half (for quarterly/half-yearly clients) directly, e.g.
// "FY29 Q1" — rather than expecting the pills above to double as an "add"
// control. The year is a free-typed number, not a bounded dropdown — there's
// no reason a client's history or plans should be capped to some arbitrary
// window. Confirming just selects that date at the top and stays on
// whatever screen is already open; nothing is saved until the user actually
// enters data for it (Financial Input or any other input screen).
function populateNewPeriodForm() {
  const cadence = currentCtx?.cadence;
  const fyEnd = currentCtx?.fy_end;
  const defaultValue = computeAddNextPeriodValue(cadence, fyEnd, availablePeriods[0] || null);
  const anchor = availablePeriods[0] ? Number(periodFyYear(availablePeriods[0], fyEnd)) : new Date().getUTCFullYear();
  const defaultYear = defaultValue ? Number(periodFyYear(defaultValue, fyEnd)) : anchor;
  const defaultPeriodNumber = defaultValue ? periodNumberOf(defaultValue, cadence, fyEnd) : 1;

  document.getElementById('np-year').value = defaultYear;

  const qWrap = document.getElementById('np-quarter-wrap');
  const qSel = document.getElementById('np-quarter');
  const isSingle = cadence !== 'quarterly' && cadence !== 'half_yearly';
  qWrap.style.display = isSingle ? 'none' : '';
  const periodsPerYear = cadence === 'quarterly' ? 4 : 2;
  const qLabel = cadence === 'quarterly' ? 'Q' : 'H';
  qSel.innerHTML = Array.from({ length: periodsPerYear }, (_, i) => i + 1)
    .map((n) => `<option value="${n}" ${n === defaultPeriodNumber ? 'selected' : ''}>${qLabel}${n}</option>`).join('');
  validateNewPeriodForm();
}

// Live-checked as year/quarter change (not just on Go) — a combination that
// already exists greys the button out immediately, rather than only telling
// the user after they click. Returns the target date when it's addable, or
// null when the form is invalid/a duplicate.
function validateNewPeriodForm() {
  const cadence = currentCtx?.cadence;
  const fyEnd = currentCtx?.fy_end;
  const msg = document.getElementById('np-msg');
  const goBtn = document.getElementById('np-go-btn');
  const year = Number(document.getElementById('np-year').value);
  if (!year) {
    msg.textContent = 'Enter a year.';
    msg.className = 'save-msg';
    goBtn.disabled = true;
    return null;
  }
  const isSingle = cadence !== 'quarterly' && cadence !== 'half_yearly';
  const periodNumber = isSingle ? 1 : Number(document.getElementById('np-quarter').value);
  const target = periodEndFromFyYearAndNumber(year, periodNumber, cadence, fyEnd);
  if (availablePeriods.includes(target)) {
    msg.textContent = `FY${String(year).slice(-2)}${isSingle ? '' : ` ${qLabelFor(cadence)}${periodNumber}`} already exists — use the pills above to view it.`;
    msg.className = 'save-msg err';
    goBtn.disabled = true;
    return null;
  }
  msg.textContent = '';
  goBtn.disabled = false;
  return target;
}

function qLabelFor(cadence) { return cadence === 'quarterly' ? 'Q' : 'H'; }

// Jumps straight into Financial Input, already pointed at the next period —
// one click, since "add a new period" almost always means "I want to enter

// ---- Main render dispatch ----
// Wraps the actual dispatch so every screen — not just Financial Input —
// gets the "this period isn't saved yet" banner appended afterward, without
// each of the ~10 render functions needing to remember to call it
// themselves.
async function renderMain() {
  await renderMainDispatch();
  refreshUnsavedPeriodBanner();
}

async function renderMainDispatch() {
  renderToken += 1;
  const content = document.getElementById('tab-content');
  if (!currentClientId) { content.innerHTML = ''; return; }

  if (currentWorkflow === 'meeting') return renderMeetingTab(content);
  if (currentWorkflow === 'report') return renderReportTab(content);

  if (currentDomain === 'financial') {
    if (currentWorkflow === 'input') return renderFinancialInput(content);
    if (currentWorkflow === 'analyse') return renderFinancialAnalyse(content);
    if (currentWorkflow === 'diagnose') return renderFinancialDiagnose(content);
  }

  if (currentDomain === 'profile') return renderGoalsProfile(content);

  if (currentDomain === 'goals') {
    if (currentWorkflow === 'input') return renderGoalsInput(content);
    return renderPlaceholder(content, `Goals — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet.`);
  }

  if (currentDomain === 'risk') {
    if (currentWorkflow === 'analyse') return renderRiskAnalyse(content);
    return renderPlaceholder(content, `Risk — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet.`);
  }

  if (currentDomain === 'growth') {
    if (currentWorkflow === 'analyse') return renderGrowthAnalyse(content);
    return renderPlaceholder(content, `Growth — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet.`);
  }

  if (currentDomain === 'owner') {
    if (currentWorkflow === 'input') return renderOwnerInput(content);
    if (currentWorkflow === 'analyse') return renderOwnerAnalyse(content);
    return renderPlaceholder(content, `Owner & Succession — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet.`);
  }

  if (currentDomain === 'actions') {
    if (currentWorkflow === 'input') return renderActionsView(content);
    return renderPlaceholder(content, `Actions — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet.`);
  }

  const domainLabel = DOMAINS.find((d) => d.key === currentDomain)?.label || currentDomain;
  return renderPlaceholder(content, `${domainLabel} — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet. This domain is still placeholder only, no real data behind it.`);
}

// The period picked from the top bar is only real once a financial snapshot
// has actually been saved against it (see list_periods — driven entirely by
// financial_snapshots rows) — until then it's just an in-memory selection,
// and anything entered on a non-financial screen (Profile, Goals, Risk...)
// for it won't persist as "this period's data" the way it looks like it
// should. Surfacing that here, on every screen, rather than leaving it
// silent, is the fix for someone picking a new period, wandering into
// Profile, and having no idea nothing they're about to do will stick to it.
function refreshUnsavedPeriodBanner() {
  document.getElementById('unsaved-period-banner')?.remove();
  const content = document.getElementById('tab-content');
  if (!content || !currentClientId || !currentPeriodEnd || availablePeriods.includes(currentPeriodEnd)) return;
  const alreadyOnInput = currentDomain === 'financial' && currentWorkflow === 'input';
  content.insertAdjacentHTML('afterbegin', `
    <div class="flag" id="unsaved-period-banner" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <span>⚠ ${formatShortDate(currentPeriodEnd)} needs a financial snapshot saved to create it as a real period — nothing will be saved otherwise.</span>
      ${alreadyOnInput ? '' : `<button type="button" id="unsaved-period-goto-btn" class="mini-link" style="flex-shrink:0;">→ Go to Financial Input</button>`}
    </div>
  `);
  const btn = document.getElementById('unsaved-period-goto-btn');
  if (btn) btn.onclick = () => {
    currentDomain = 'financial';
    currentWorkflow = 'input';
    currentEntrySubtab = 'manual';
    renderSidebarDomains();
    renderWorkflowTabsActive();
    renderMain();
  };
}

function renderPlaceholder(content, message) {
  content.innerHTML = `<div class="card placeholder"><p class="muted">Not yet wired</p><p class="muted plain" style="margin:0;">${message}</p></div>`;
}

// ---- Financial Performance: Input ----
async function renderFinancialInput(content) {
  content.innerHTML = `
    <div class="subtabs" id="entry-subtabs">
      <button data-sub="manual" class="${currentEntrySubtab === 'manual' ? 'active' : ''}">Manual entry</button>
      <button data-sub="pdf" class="${currentEntrySubtab === 'pdf' ? 'active' : ''}">Upload PDF</button>
      <button data-sub="xero" class="${currentEntrySubtab === 'xero' ? 'active' : ''}">Xero sync</button>
    </div>
    <div id="entry-subcontent"></div>
  `;
  document.getElementById('entry-subtabs').addEventListener('click', (e) => {
    if (e.target.dataset.sub) {
      renderToken += 1; // invalidates any in-flight async work from the sub-tab being left
      currentEntrySubtab = e.target.dataset.sub;
      renderFinancialInput(content);
    }
  });
  const sub = document.getElementById('entry-subcontent');
  if (currentEntrySubtab === 'manual') return renderManualEntry(sub);
  if (currentEntrySubtab === 'pdf') return renderPdfUpload(sub);
  if (currentEntrySubtab === 'xero') return renderXeroSync(sub);
}

async function renderManualEntry(content) {
  if (!currentCtx?.fy_end) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">Financial year end not set</p><p class="muted plain" style="margin:0;">Set this client's financial year end in Profile before entering financial data — period-end dates are derived from it.</p></div>`;
    return;
  }
  content.innerHTML = `
    <div class="card">
      <p class="muted">Financial snapshot — manual entry</p>
      <div class="form-field">
        <label>Period end date</label>
        ${periodPickerHtml('me-period-end', currentCtx.cadence, currentCtx.fy_end, currentPeriodEnd, availablePeriods[0] || null)}
      </div>
      <p class="muted plain" id="me-existing-note" style="margin:-4px 0 10px; display:none;"></p>
      <div class="form-grid" id="me-financial-fields"></div>
      <button class="action" id="me-save-financials" style="margin-top:10px;">Save financial snapshot</button>
      <div class="save-msg" id="me-financials-msg"></div>
    </div>
  `;

  const fieldsEl = document.getElementById('me-financial-fields');
  FINANCIAL_FIELD_DEFS.forEach(([key, label]) => {
    const div = document.createElement('div');
    div.className = 'form-field';
    div.innerHTML = `<label>${label}</label><input type="number" step="0.01" id="me-${key}" />`;
    fieldsEl.appendChild(div);
  });

  // Without this, switching to a period that already has data (from a prior
  // manual entry, PDF, or Xero sync) silently showed blank fields — making it
  // look like the earlier save "didn't stick," and risking overwriting real
  // figures with blanks if the user hit Save without noticing. Reuses the
  // shared renderToken (bumped by renderMain and the Input sub-tab switcher)
  // rather than a separate token, so navigating away by ANY route — not just
  // back into Manual Entry — correctly invalidates this in-flight fetch.
  const myFillToken = renderToken;
  async function fillFromExisting(periodEnd) {
    const existing = await callRead('get_kpi_report', currentClientId, periodEnd);
    if (myFillToken !== renderToken) return;
    const snap = existing?.snapshot || null;
    FINANCIAL_FIELD_DEFS.forEach(([key]) => {
      const input = document.getElementById(`me-${key}`);
      if (input) input.value = (snap && snap[key] != null) ? snap[key] : '';
    });
    const note = document.getElementById('me-existing-note');
    if (note) {
      note.style.display = snap ? 'block' : 'none';
      note.textContent = snap ? `Showing existing ${snap.source || 'saved'} data for this period — saving will overwrite it.` : '';
    }
  }

  wirePeriodPicker('me-period-end', currentCtx.cadence, currentCtx.fy_end, fillFromExisting, availablePeriods[0] || null, true);
  await fillFromExisting(document.getElementById('me-period-end').value);
  // If the user navigated away (e.g. to a different Input sub-tab) while that
  // fetch was in flight, this whole render is stale — the fields/button it's
  // about to wire up no longer exist in the DOM.
  if (myFillToken !== renderToken) return;

  document.getElementById('me-save-financials').onclick = async () => {
    const msg = document.getElementById('me-financials-msg');
    msg.textContent = 'Saving…';
    msg.className = 'save-msg';
    const body = {
      type: 'financials',
      client_id: currentClientId,
      period_end: document.getElementById('me-period-end').value,
    };
    FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = document.getElementById(`me-${key}`).value; });
    try {
      const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      msg.textContent = 'Saved.';
      msg.className = 'save-msg ok';
      await loadPeriods(body.period_end);
      refreshHealthBadge();
      renderSidebarDomains();
      // loadPeriods refreshes the top-bar dropdown, but this form's OWN
      // period picker was already rendered before the save — without
      // rebuilding it too, the period you just saved never shows up as a
      // pill here, even though it genuinely saved. Re-rendering the whole
      // form also re-selects the period you just saved (loadPeriods set
      // currentPeriodEnd to it) and re-fills it from what's now on file,
      // doubling as visible confirmation the save actually took.
      await renderManualEntry(content);
      refreshUnsavedPeriodBanner();
      return;
    } catch (err) {
      msg.textContent = 'Error: ' + err.message;
      msg.className = 'save-msg err';
    }
  };
}

async function renderPdfUpload(content) {

    content.innerHTML = `<div class="card placeholder"><p class="muted">Financial year end not set</p><p class="muted plain" style="margin:0;">Set this client's financial year end in Profile before entering financial data — period-end dates are derived from it.</p></div>`;
    return;
  }
  content.innerHTML = `
    <div class="card">
      <p class="muted">Upload financial statement PDF</p>
      <p class="muted plain" style="margin-top:-4px;">For MYOB, Reckon, or any statement not coming from Xero. Claude reads the PDF and extracts the figures — nothing is saved until you review and confirm.</p>
      <div class="form-field">
        <label>Period end date</label>
        ${periodPickerHtml('pdf-period-end', currentCtx.cadence, currentCtx.fy_end, currentPeriodEnd, availablePeriods[0] || null, true)}
      </div>
      <div class="form-field">
        <label>PDF file</label>

      </div>
      <button class="action" id="pdf-extract-btn">Extract from PDF</button>
      <div id="pdf-result" style="margin-top:12px;"></div>
    </div>
  `;
  wirePeriodPicker('pdf-period-end', currentCtx.cadence, currentCtx.fy_end, undefined, availablePeriods[0] || null, true, true);

      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;

    try {

    } catch (err) {
