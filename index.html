    </div>
  `;
}

// Fills what used to be a lot of empty space on the Operating Cash
// Conversion card (its detailed breakdown moved to the Cash in/out card) with
// something that actually answers the question this KPI exists to ask: the
// business made $X, how much of it became real cash, and — the "so what" —
// what to do about it depending on whether that's high or low. Clicking it
// jumps straight to the Cash in/out card's own detail, since that's where
// "where did it go" actually gets answered line by line.
function renderCashConversionExplainer(kpi, snapshot) {
  const denomSum = (kpi.denominator || []).reduce((sum, f) => sum + (Number(snapshot[f]) || 0), 0);
  if (!denomSum) return '';
  const pct = kpi.value;
  const cashAmount = pct * denomSum;
  const isHigh = pct >= 0.8;
  const radius = 30;
  const circumference = 2 * Math.PI * radius;
  const filled = Math.max(0, Math.min(1, pct)) * circumference;
  const ringColor = isHigh ? 'var(--sage)' : 'var(--rust)';
  const narrative = `This period: ${formatMoney(denomSum)} profit → ${formatMoney(cashAmount)} became cash.`;
  const followUp = isHigh
    ? `Most of it reached the bank — what's the plan for it? Pay down debt, reinvest, or build a buffer.`
    : `A chunk of it hasn't reached the bank yet. Tap through to see exactly where it went.`;
  return `
    <div class="cash-conv-explainer" id="cash-conv-jump" title="See the cash breakdown">
      <svg viewBox="0 0 72 72" class="cash-conv-donut" aria-hidden="true">
        <circle cx="36" cy="36" r="${radius}" fill="none" stroke="var(--line)" stroke-width="7" />
        <circle cx="36" cy="36" r="${radius}" fill="none" stroke="${ringColor}" stroke-width="7"
          stroke-dasharray="${filled} ${circumference}" stroke-linecap="round" transform="rotate(-90 36 36)" />
        <text x="36" y="41" text-anchor="middle" class="cash-conv-donut-label">${(pct * 100).toFixed(0)}%</text>
      </svg>
      <div class="cash-conv-text">
        <p class="cash-conv-narrative">${narrative}</p>
        <p class="cash-conv-followup">${followUp}</p>
      </div>
    </div>
  `;
}

// "What has happened" (position, not just the resulting %) needs the raw
// numbers visible, not just the ratio. Styled after the "Where the cash
// went" net-this-period stats (same bold-value/small-label shape, see
// .cash-net-value/.cash-net-stat-label), just boxed — rate on the left since
// that's the thing worth discussing, dollar figure on the right for context.
// The calculation and the "why look at this" note are click-to-reveal
// (wired in renderHealthWheelBlock, #tax-position-toggle), same
// show/hide pattern as the OCF and reconciliation adjust panels — quiet
// until asked for, not competing with the numbers for attention.
function renderTaxPositionHeader(kpi, snapshot, valueColorClass) {
  const taxExpense = (kpi.numerator || []).reduce((sum, f) => sum + (Number(snapshot[f]) || 0), 0);
  const netProfit = (kpi.denominator || []).reduce((sum, f) => sum + (Number(snapshot[f]) || 0), 0);
  if (!netProfit) return `<p class="kpi-value unavailable">Not enough data</p>`;

  // Same "material move" framing as kpiTrendLine, but in %-points-of-tax-rate
  // terms rather than "pts" — plainer for a rate specifically.
  let trendHtml = '';
  if (kpi.priorValue != null) {
    const diff = (kpi.value - kpi.priorValue) * 100;
    trendHtml = Math.abs(diff) < 0.05
      ? `<span class="trend-flat">— no change</span>`
      : `<span class="${diff > 0 ? 'trend-up' : 'trend-down'}">${diff > 0 ? '↑' : '↓'} ${Math.abs(diff).toFixed(1)}% vs last period</span>`;
  }

  // Same tint the confidence badges already use for good/bad (sage-bg/rust-bg,
  // no border — just a soft fill), so the box carries the verdict rather than
  // just the text inside it. No target set = no verdict to show, so it stays
  // a plain neutral tile rather than guessing. Tax expense has no inherent
  // good/bad on its own (a bigger bill can just mean bigger profit), so it
  // always stays neutral.
  const rateBg = valueColorClass === 'good' ? 'var(--sage-bg)' : valueColorClass === 'bad' ? 'var(--rust-bg)' : 'var(--paper)';

  return `
    <div style="display:flex; gap:12px; margin:4px 0 2px; flex-wrap:wrap;">
      <button type="button" id="tax-position-toggle" title="Show the calculation"
        style="cursor:pointer; text-align:left; background:${rateBg}; border:none; border-radius:8px; padding:8px 12px; font-family:inherit; flex:1 1 110px; min-width:0;">
        <p class="cash-net-value ${valueColorClass}" style="margin:0; font-size:18px;">${(kpi.value * 100).toFixed(1)}%</p>
        <span class="cash-net-stat-label">Effective rate</span>
        ${trendHtml ? `<p style="font-size:11px; margin:4px 0 0;">${trendHtml}</p>` : ''}
      </button>
      <div style="background:var(--paper); border-radius:8px; padding:8px 12px; flex:1 1 110px; min-width:0;">
        <p class="cash-net-value" style="margin:0; font-size:18px;">${formatMoney(taxExpense)}</p>
        <span class="cash-net-stat-label">Tax expense</span>
      </div>
    </div>
    <div id="tax-position-detail" style="display:none; margin-top:8px;">
      <p style="font-size:11px; color:var(--ink-soft); margin:0;">= ${formatMoney(taxExpense)} tax expense ÷ ${formatMoney(netProfit)} net profit before tax</p>
      <p style="font-size:11px; color:var(--ink-soft); margin:4px 0 0; font-style:italic;">Why look at this: the rate shows what share of profit is going to tax — a shift here can flag a timing issue, a planning opportunity, or an error, even when profit itself hasn't moved much.</p>
    </div>
  `;
}

function renderKpiCard(kpi, snapshot) {
  const unavailable = kpi.confidence === 'red';
  const trend = (!unavailable && kpi.priorValue != null)
    ? `<p class="trend-line">${kpiTrendLine(kpi)}</p>` : '';
  const missing = unavailable ? missingFieldsFor(kpi, snapshot) : [];
  // Only colors the value once a target exists AND the direction is
  // unambiguous (see KPI_DIRECTION) — no target set, or a genuinely
  // direction-neutral metric, stays plain ink rather than a guessed verdict.
  let valueColorClass = '';
  if (!unavailable) {
    const targetItem = findKpiTarget(kpi.key);
    const direction = KPI_DIRECTION[kpi.key];
    if (targetItem && direction) {
      const beating = direction === 'higher' ? kpi.value >= targetItem.target : kpi.value <= targetItem.target;
      valueColorClass = beating ? 'good' : 'bad';
    }
  }
  const isTaxRate = kpi.key === 'effective_tax_rate';
  return `
    <div class="kpi-card">
      <div class="kpi-card-head">
        <p class="kpi-name">${isTaxRate ? 'Current tax position' : kpi.name}</p>
        <span class="confidence-badge ${kpi.confidence}">${CONFIDENCE_LABEL[kpi.confidence]}</span>
      </div>
      ${!unavailable && isTaxRate
        ? renderTaxPositionHeader(kpi, snapshot, valueColorClass)
        : `<p class="kpi-value ${unavailable ? 'unavailable' : valueColorClass}">${unavailable ? 'Not enough data' : formatKpi(kpi.value, kpi.format)}</p>`}
      ${!isTaxRate ? trend : ''}
      ${kpi.confidence === 'yellow' && kpi.estimation_note ? `<p class="kpi-note">${kpi.estimation_note}</p>` : ''}
      ${!unavailable && kpi.key === 'op_cash_conversion' ? renderCashConversionExplainer(kpi, snapshot) : ''}
      ${kpi.interpretation ? `<p class="kpi-interp">${kpi.interpretation}</p>` : ''}
      ${kpi.benchmark ? `<p class="kpi-benchmark">💡 ${kpi.benchmark} <span class="kpi-benchmark-tag">— general estimate, not verified</span></p>` : ''}
      ${!unavailable && kpi.improvement_tip ? `<p class="kpi-tip">🔧 ${kpi.improvement_tip}</p>` : ''}
      ${missing.length ? `<p class="kpi-missing">Add ${missing.map((f) => FIELD_LABEL[f] || f).join(', ')} to calculate this.</p>` : ''}
      ${!unavailable ? renderKpiTargetBlock(kpi) : ''}
    </div>
  `;
}

const SOURCE_LABEL = { manual: 'manual entry', pdf: 'PDF extraction', xero: 'Xero sync' };

function renderFinancialSnapshotCard(snapshot) {
  if (!snapshot) return '';
  const synced = snapshot.synced_at ? new Date(snapshot.synced_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : null;
  return `
    <div style="display:flex; align-items:baseline; justify-content:space-between;">
      <p class="section-title">Financial snapshot</p>
      <button class="mini-link" id="snapshot-edit-btn" data-edit-period="${snapshot.period_end}" type="button">edit</button>
    </div>
    <div class="card full">
      <div class="snapshot-grid">
        ${FINANCIAL_FIELD_DEFS.map(([key, label]) => `
          <div class="snapshot-field">
            <p class="card-label">${label}</p>
            <p class="snapshot-value ${snapshot[key] == null ? 'blank' : ''}">${snapshot[key] == null ? 'not recorded' : formatMoney(snapshot[key])}</p>
          </div>
        `).join('')}
      </div>
      <p class="snapshot-provenance">Source: ${SOURCE_LABEL[snapshot.source] || snapshot.source || 'unknown'}${synced ? ` · synced ${synced}` : ''}</p>
    </div>
  `;
}

// Consolidated nudge above the KPI grid — turns a wall of red badges into one
// actionable list instead of leaving each card as a dead end on its own.
function renderUnlockCard(kpis, snapshot) {
  const missingSet = new Set();
  kpis.filter((k) => k.confidence === 'red').forEach((k) => missingFieldsFor(k, snapshot).forEach((f) => missingSet.add(f)));
  if (!missingSet.size) return '';
  return `
    <div class="unlock-card">
      <p>Add <b>${[...missingSet].map((f) => FIELD_LABEL[f] || f).join(', ')}</b> to unlock ${kpis.filter((k) => k.confidence === 'red').length} more metric${kpis.filter((k) => k.confidence === 'red').length === 1 ? '' : 's'}.</p>
      <button class="action secondary" id="unlock-goto-input" type="button">Go to Input</button>
    </div>
  `;
}

function renderKpiHistoryTable(history) {
  if (!history?.periods?.length) return '';
  const groups = {};
  history.kpis.forEach((k) => { (groups[k.category || 'other'] = groups[k.category || 'other'] || []).push(k); });
  const order = [...KPI_CATEGORY_ORDER, ...Object.keys(groups).filter((c) => !KPI_CATEGORY_ORDER.includes(c))];
  const rows = order.filter((c) => groups[c]?.length).map((c) => `
    <tr class="history-group-row"><td colspan="${history.periods.length + 1}">${KPI_CATEGORY_META[c] || c}</td></tr>
    ${groups[c].map((k) => `
      <tr>
        <td>${k.name}</td>
        ${k.values.map((v) => `<td class="${v == null ? 'blank' : ''}">${v == null ? '—' : formatKpi(v, k.format)}</td>`).join('')}
      </tr>
    `).join('')}
  `).join('');
  return `
    <p class="section-title">Metric history</p>
    <div class="card full history-table-wrap">
      <table class="history-table">
        <thead><tr><th>Metric</th>${history.periods.map((p) => `<th>${formatShortDate(p)}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderHealthWheelBlock(container, overview, kpis, snapshot, history) {
  const hs = overview?.healthScore || null;
  const priorHs = overview?.priorHealthScore || null;
  const pillarMap = {};
  (overview?.pillarScores || []).forEach((p) => { pillarMap[p.pillar] = p.score; });
  const priorPillarMap = {};
  (overview?.priorPillarScores || []).forEach((p) => { priorPillarMap[p.pillar] = p.score; });
  const pillars = Object.keys(pillarMap).map((key) => ({
    key, score: pillarMap[key],
    name: PILLAR_META[key]?.name || key, color: PILLAR_META[key]?.color || '#999',
  }));
  const flags = overview?.flags || [];

  container.innerHTML = `
    <div class="hero-row">
      <div class="wheel-card">
        <p class="wheel-label">Business health</p>
        ${hs ? `
          <svg id="ov-wheel" width="240" height="240" viewBox="0 0 240 240"></svg>
          <div class="wheel-score"><b>${hs.score}</b> / 100</div>
          ${priorHs ? `<p class="trend-line">${trendArrow(hs.score, priorHs.score)}</p>` : ''}
          <div class="pillar-legend" id="ov-legend"></div>
        ` : '<p class="muted plain" style="text-align:center; margin-top:24px;">No analysis run yet for this period.</p>'}
      </div>
      <div class="side-cards">
        <div class="card full">
          <p class="card-label">Flags this period</p>
          ${flags.length
            ? flags.map((f, i) => `
              <div class="flag-row-wrap">
                <div class="flag-row"><span class="flag-dot ${f.severity === 'danger' || f.severity === 'warning' ? 'rust' : 'sage'}"></span> ${f.message}
                  <button class="mini-link" data-suggest-target="${i}" type="button">✨ suggest target</button>
                </div>
                <div class="suggest-panel" id="target-panel-${i}" style="display:none;"></div>
              </div>
            `).join('')
            : '<p class="muted plain" style="margin:0;">No flags this period.</p>'}
        </div>
      </div>
    </div>
    ${kpis && kpis.length ? `
      <p class="section-title">Key metrics</p>
      ${renderUnlockCard(kpis, snapshot)}
      ${groupKpis(kpis).map((group) => {
        const isCash = group.key === 'cash';
        const isTax = group.key === 'tax';
        const cashOutlookCard = isCash ? renderCashOutlookCard(snapshot, kpis) : '';
        const taxCard = isTax ? renderTaxAffordabilityCard(snapshot) : '';
        const taxOutlookCard = isTax ? renderTaxOutlookCard(snapshot, currentCtx) : '';
        const itemCount = group.kpis.length + (isCash ? 1 : 0) + (cashOutlookCard ? 1 : 0) + (taxCard ? 1 : 0) + (taxOutlookCard ? 1 : 0);
        const gridClass = [isCash ? 'kpi-grid-cash' : '', itemCount === 1 ? 'kpi-grid-solo' : ''].filter(Boolean).join(' ');
        return `
        <p class="kpi-group-label">${group.label}</p>
        <div class="kpi-grid ${gridClass}">
          ${group.kpis.map((k) => renderKpiCard(k, snapshot)).join('')}
          ${isCash ? renderCashFlowGlanceCard(kpis.find((k) => k.key === 'op_cash_conversion')) : ''}
          ${cashOutlookCard}
          ${taxCard}
          ${taxOutlookCard}
        </div>
      `;
      }).join('')}
    ` : ''}
    ${pillars.length ? `
      <p class="section-title">Pillar scores</p>
      <div class="card full" style="padding: 20px 24px;">
        <table style="width:100%; border-collapse: collapse; font-size: 13px;">
          <tbody>
            ${pillars.map((p) => `<tr><td style="padding:8px 0; border-top:1px solid var(--line);"><span style="display:inline-block; width:8px; height:8px; border-radius:2px; background:${p.color}; margin-right:8px;"></span>${p.name}</td><td style="padding:8px 0; border-top:1px solid var(--line); text-align:right;"><span style="font-family: var(--font-mono);">${p.score == null ? '—' : p.score.toFixed(1) + '/10'}</span>${priorPillarMap[p.key] !== undefined ? `<br>${trendArrow(p.score, priorPillarMap[p.key])}` : ''}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    ` : ''}
    ${renderKpiHistoryTable(history)}
    ${renderFinancialSnapshotCard(snapshot)}
  `;

  const unlockBtn = document.getElementById('unlock-goto-input');
  if (unlockBtn) unlockBtn.onclick = () => {
    currentWorkflow = 'input';
    renderWorkflowTabsActive();
    renderMain();
  };

  const snapshotEditBtn = document.getElementById('snapshot-edit-btn');
  if (snapshotEditBtn) snapshotEditBtn.onclick = () => {
    currentPeriodEnd = snapshotEditBtn.dataset.editPeriod;
    renderPeriodPills();
    currentWorkflow = 'input';
    currentEntrySubtab = 'manual';
    renderWorkflowTabsActive();
    renderMain();
  };

  const cashConvJump = document.getElementById('cash-conv-jump');
  if (cashConvJump) {
    cashConvJump.onclick = () => {
      const toggle = document.getElementById('recon-toggle');
      if (!toggle) return; // Cash in/out card isn't showing this period (e.g. no prior period on file)
      const panel = document.getElementById('recon-panel');
      if (panel && panel.style.display === 'none') toggle.click();
      toggle.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  }

  const cashOutlookUnit = document.getElementById('cash-outlook-unit');
  if (cashOutlookUnit && snapshot?.revenue && snapshot?.net_profit != null) {
    const conversion = kpis.find((k) => k.key === 'op_cash_conversion')?.value;
    const cashValueEl = document.getElementById('cash-outlook-value');
    const cashProvenanceEl = document.getElementById('cash-outlook-provenance');
    const cashBuildupEl = document.getElementById('cash-outlook-buildup');
    const cashRevenueInput = document.getElementById('cash-outlook-revenue');
    const cashGpInput = document.getElementById('cash-outlook-gp');
    const cashOpexInput = document.getElementById('cash-outlook-opex');
    const cashNetProfitInput = document.getElementById('cash-outlook-netprofit');
    const cashNetProfitAbsoluteInput = document.getElementById('cash-outlook-netprofit-absolute');
    const recalcCashOutlook = () => {
      cashOutlookState = {
        unit: cashOutlookUnit.value, revenue: Number(cashRevenueInput.value || 0), gp: Number(cashGpInput.value || 0),
        opex: Number(cashOpexInput.value || 0), netProfit: Number(cashNetProfitInput.value || 0), netProfitAbsolute: cashNetProfitAbsoluteInput.value,
      };
      const r = computeCashOutlookResult(
        snapshot, conversion, cashOutlookState.unit,
        cashOutlookState.revenue, cashOutlookState.gp, cashOutlookState.opex, cashOutlookState.netProfit, cashOutlookState.netProfitAbsolute
      );
      cashValueEl.textContent = r.headline;
      cashProvenanceEl.textContent = r.provenance;
      cashBuildupEl.innerHTML = r.buildup;
    };
    cashOutlookUnit.onchange = recalcCashOutlook;
    [cashRevenueInput, cashGpInput, cashOpexInput, cashNetProfitInput, cashNetProfitAbsoluteInput].forEach((el) => { el.oninput = recalcCashOutlook; });
    recalcCashOutlook();

    const cashOutlookToggle = document.getElementById('cash-outlook-toggle');
    const cashOutlookPanel = document.getElementById('cash-outlook-panel');
    const openCashOutlookPanel = () => {
      cashOutlookPanel.style.display = 'block';
      cashOutlookToggle.querySelector('.chevron').textContent = '▴';
      cashOutlookPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    cashOutlookToggle.onclick = () => {
      const willOpen = cashOutlookPanel.style.display === 'none';
      cashOutlookPanel.style.display = willOpen ? 'block' : 'none';
      cashOutlookToggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
    };
    document.getElementById('cash-outlook-provenance-link').onclick = openCashOutlookPanel;
  }

  const taxPositionToggle = document.getElementById('tax-position-toggle');
  if (taxPositionToggle) {
    const taxPositionDetail = document.getElementById('tax-position-detail');
    taxPositionToggle.onclick = () => {
      taxPositionDetail.style.display = taxPositionDetail.style.display === 'none' ? 'block' : 'none';
    };
  }

  const taxOutlookUnit = document.getElementById('tax-outlook-unit');
  if (taxOutlookUnit && snapshot?.revenue && snapshot?.net_profit != null) {
    const taxValueEl = document.getElementById('tax-outlook-tax-value');
    const taxLabelEl = document.getElementById('tax-outlook-tax-label');
    const cashLineEl = document.getElementById('tax-outlook-cash-line');
    const buildupEl = document.getElementById('tax-outlook-buildup');
    const provenanceEl = document.getElementById('tax-outlook-provenance');
    const deductionNoteEl = document.getElementById('tax-outlook-deduction-note');
    const compareTextEl = document.getElementById('tax-outlook-compare-text');
    const bracketDetailEl = document.getElementById('tax-outlook-bracket-detail');
    const revenueInput = document.getElementById('tax-outlook-revenue');
    const gpInput = document.getElementById('tax-outlook-gp');
    const opexInput = document.getElementById('tax-outlook-opex');
    const netProfitInput = document.getElementById('tax-outlook-netprofit');
    const netProfitAbsoluteInput = document.getElementById('tax-outlook-netprofit-absolute');
    const superInput = document.getElementById('tax-outlook-super');
    const equipmentInput = document.getElementById('tax-outlook-equipment');
    const compareEntityInput = document.getElementById('tax-outlook-compare-entity');
    const compareShareInputs = [...document.querySelectorAll('.tax-outlook-compare-share')];
    const compareOtherIncomeInputs = [...document.querySelectorAll('.tax-outlook-compare-other-income')];
    const recalcTaxOutlook = () => {
      taxOutlookState = {
        unit: taxOutlookUnit.value, revenue: Number(revenueInput.value || 0), gp: Number(gpInput.value || 0),
        opex: Number(opexInput.value || 0), netProfit: Number(netProfitInput.value || 0), netProfitAbsolute: netProfitAbsoluteInput.value,
        super: Number(superInput.value || 0), equipment: Number(equipmentInput.value || 0), compareEntity: compareEntityInput.value,
        compareShares: compareShareInputs.map((el) => el.value), compareOtherIncome: compareOtherIncomeInputs.map((el) => el.value),
      };
      const r = computeTaxOutlookResult(
        snapshot, snapshot.cash, currentCtx?.entity_type, taxOutlookState.unit,
        taxOutlookState.revenue, taxOutlookState.gp, taxOutlookState.opex, taxOutlookState.netProfit, taxOutlookState.netProfitAbsolute,
        taxOutlookState.super, taxOutlookState.equipment, taxOutlookState.compareEntity, taxOutlookState.compareShares, taxOutlookState.compareOtherIncome
      );
      taxValueEl.textContent = r.headline;
      taxLabelEl.textContent = r.headlineLabel;
      cashLineEl.textContent = r.cashText;
      cashLineEl.className = 'kpi-interp' + (r.cashClass ? ' ' + r.cashClass : '');
      buildupEl.innerHTML = r.buildup;
      provenanceEl.textContent = r.provenance;
      deductionNoteEl.textContent = r.deductionNote;
      compareTextEl.textContent = r.compareText;
      bracketDetailEl.innerHTML = r.bracketDetail;
    };
    taxOutlookUnit.onchange = recalcTaxOutlook;
    compareEntityInput.onchange = () => {
      // Sole trader is always the whole profit — pre-fill 100% so the row
      // reads correctly at a glance instead of showing whatever was last
      // typed for a Partnership/Trust split. Switching TO Partnership/Trust
      // resets the first two shares to an even 50/50 starting point for the
      // same reason — otherwise a leftover 100 from Sole trader (or
      // whatever was last typed) silently skews the split instead of
      // reading as the clean default it's meant to be.
      if (compareEntityInput.value === 'Sole trader') {
        compareShareInputs[0].value = 100;
        for (let i = 1; i < compareShareInputs.length; i++) compareShareInputs[i].value = '';
      } else if (compareEntityInput.value === 'Partnership' || compareEntityInput.value === 'Trust') {
        compareShareInputs[0].value = 50;
        compareShareInputs[1].value = 50;
        for (let i = 2; i < compareShareInputs.length; i++) compareShareInputs[i].value = '';
      }
      recalcTaxOutlook();
    };
    [revenueInput, gpInput, opexInput, netProfitInput, netProfitAbsoluteInput, superInput, equipmentInput, ...compareShareInputs, ...compareOtherIncomeInputs].forEach((el) => { el.oninput = recalcTaxOutlook; });
    recalcTaxOutlook();

    const taxOutlookToggle = document.getElementById('tax-outlook-toggle');
    const taxOutlookPanel = document.getElementById('tax-outlook-panel');
    const openTaxOutlookPanel = () => {
      taxOutlookPanel.style.display = 'block';
      taxOutlookToggle.querySelector('.chevron').textContent = '▴';
      taxOutlookPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    taxOutlookToggle.onclick = () => {
      const willOpen = taxOutlookPanel.style.display === 'none';
      taxOutlookPanel.style.display = willOpen ? 'block' : 'none';
      taxOutlookToggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
    };
    document.getElementById('tax-outlook-provenance-link').onclick = openTaxOutlookPanel;

    // Tax rates panel lives in the same card, so it reuses recalcTaxOutlook
    // directly (defined just above, in this same scope) instead of a full
    // renderMain() — that keeps a rate edit as fast/local as any scenario
    // field, rather than reloading the whole tab and losing scroll position
    // and every other panel's open/closed state.
    const taxRatesToggle = document.getElementById('tax-rates-toggle');
    if (taxRatesToggle) {
      const taxRatesPanel = document.getElementById('tax-rates-panel');
      taxRatesToggle.onclick = () => {
        const willOpen = taxRatesPanel.style.display === 'none';
        taxRatesPanel.style.display = willOpen ? 'block' : 'none';
        taxRatesToggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
      };
      const rateFieldIds = {
        taxFreeThreshold: 'tr-threshold', bracket2Upper: 'tr-b2-upper', bracket2Rate: 'tr-b2-rate',
        bracket3Upper: 'tr-b3-upper', bracket3Rate: 'tr-b3-rate', bracket4Upper: 'tr-b4-upper', bracket4Rate: 'tr-b4-rate',
        bracket5Rate: 'tr-b5-rate', medicareRate: 'tr-medicare-rate', medicareThreshold: 'tr-medicare-threshold',
        companyRate: 'tr-company-rate', superCap: 'tr-super-cap',
      };
      const rateInputs = Object.fromEntries(Object.entries(rateFieldIds).map(([key, id]) => [key, document.getElementById(id)]));
      const updateRateStatusLabel = () => {
        const usingDefaults = JSON.stringify(taxRatesState) === JSON.stringify(DEFAULT_TAX_RATES);
        document.getElementById('tax-rates-status-label').textContent = usingDefaults
          ? 'Defaults to FY2026-27 — edit below for a different year'
          : 'Using custom rates you’ve entered — not the FY2026-27 defaults';
      };
      const recalcRates = () => {
        taxRatesState = Object.fromEntries(Object.entries(rateInputs).map(([key, el]) => [key, Number(el.value) || 0]));
        updateRateStatusLabel();
        recalcTaxOutlook();
      };
      Object.values(rateInputs).forEach((el) => { el.onchange = recalcRates; });
      document.getElementById('tax-rates-reset').onclick = () => {
        taxRatesState = { ...DEFAULT_TAX_RATES };
        Object.entries(rateFieldIds).forEach(([key, id]) => { document.getElementById(id).value = DEFAULT_TAX_RATES[key]; });
        updateRateStatusLabel();
        recalcTaxOutlook();
      };
    }
  }

  const ocfToggle = document.getElementById('ocf-adjust-toggle');
  if (ocfToggle) {
    const ocfPanel = document.getElementById('ocf-adjust-panel');
    ocfToggle.onclick = () => {
      ocfPanel.style.display = ocfPanel.style.display === 'none' ? 'block' : 'none';
      ocfToggle.querySelector('.chevron').textContent = ocfPanel.style.display === 'none' ? '▾' : '▴';
    };

    const ocfFieldIds = ['net_profit', 'interest_expense', 'depreciation_amortisation', 'delta_debtors', 'delta_creditors', 'delta_inventory', 'manual_adjustment'];
    const ocfNum = (id) => Number(document.getElementById(`ocf-${id}`).value || 0);
    const recalcOcf = () => {
      const total = ocfNum('net_profit') + ocfNum('interest_expense') + ocfNum('depreciation_amortisation')
        - ocfNum('delta_debtors') + ocfNum('delta_creditors') - ocfNum('delta_inventory') + ocfNum('manual_adjustment');
      document.getElementById('ocf-total-value').textContent = formatMoney(total);
      return total;
    };
    ocfFieldIds.forEach((id) => { document.getElementById(`ocf-${id}`).oninput = recalcOcf; });

    document.getElementById('ocf-save-btn').onclick = async () => {
      const msg = document.getElementById('ocf-save-msg');
      const total = recalcOcf();
      msg.textContent = 'Saving…';
      msg.className = 'save-msg';
      // Sends the FULL current snapshot, not just operating_cash_flow — the save
      // endpoint treats any omitted field as blank, so a partial payload here
      // would silently wipe every other field on this period.
      const body = { type: 'financials', client_id: currentClientId, period_end: currentPeriodEnd };
      FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = snapshot[key] != null ? snapshot[key] : ''; });
      body.operating_cash_flow = total;
      try {
        const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
        const saved = await res.json();
        if (saved.error) throw new Error(saved.error);
        msg.textContent = 'Saved.';
        msg.className = 'save-msg ok';
        const scrollPos = window.scrollY;
        await renderMain();
        window.scrollTo(0, scrollPos);
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.className = 'save-msg err';
      }
    };
  }

  const reconToggle = document.getElementById('recon-toggle');
  if (reconToggle) {
    const reconPanel = document.getElementById('recon-panel');
    reconToggle.onclick = () => { reconPanel.style.display = reconPanel.style.display === 'none' ? 'block' : 'none'; };

    // "↗" next to a figure jumps to that field in the full Manual Entry form
    // — stopPropagation so clicking it doesn't also fire the parent row's
    // own click-to-expand toggle (several of these sit inside a
    // cash-item-clickable row).
    container.querySelectorAll('[data-jump-field]').forEach((btn) => {
      btn.onclick = (e) => { e.stopPropagation(); jumpToManualEntry(btn.dataset.jumpField, btn.dataset.jumpPeriod || null); };
    });

    container.querySelectorAll('[data-accordion-toggle]').forEach((head) => {
      head.onclick = () => {
        const body = document.getElementById(`recon-body-${head.dataset.accordionToggle}`);
        body.style.display = body.style.display === 'none' ? 'block' : 'none';
        head.querySelector('.chevron').textContent = body.style.display === 'none' ? '▾' : '▴';
      };
    });
    // Tiles on the compact card jump straight into the matching accordion
    // section — "cashflow" and "unexplained" have no section of their own
    // (see renderCashFlowGlanceCard), so they just open the panel and
    // scroll to the relevant fixed element instead of an accordion body.
    container.querySelectorAll('[data-tile-jump]').forEach((tileBtn) => {
      tileBtn.onclick = () => {
        const key = tileBtn.dataset.tileJump;
        reconPanel.style.display = 'block';
        if (key === 'cashflow') {
          reconPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (key === 'unexplained') {
          document.getElementById('recon-residual-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          const body = document.getElementById(`recon-body-${key}`);
          const head = container.querySelector(`[data-accordion-toggle="${key}"]`);
          body.style.display = 'block';
          head.querySelector('.chevron').textContent = '▴';
          body.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };
    });

    const r = kpis.find((k) => k.key === 'op_cash_conversion')?.cash_reconciliation;

    // Shared wiring for the two small "show calculation + edit" blocks (cash
    // balance, total debt) — same self-contained toggle/recalc/save pattern
    // as the OCF adjust block below, just for a single snapshot field each.
    const wireBalanceAdjust = (prefix, priorValue, fieldName) => {
      const toggle = document.getElementById(`${prefix}-adjust-toggle`);
      if (!toggle) return;
      const panel = document.getElementById(`${prefix}-adjust-panel`);
      toggle.onclick = () => {
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        toggle.querySelector('.chevron').textContent = panel.style.display === 'none' ? '▾' : '▴';
      };
      const input = document.getElementById(`${prefix}-current`);
      const recalc = () => {
        const total = Number(input.value || 0) - (priorValue || 0);
        document.getElementById(`${prefix}-total-value`).textContent = formatMoney(total);
        return total;
      };
      input.oninput = recalc;
      document.getElementById(`${prefix}-save-btn`).onclick = async () => {
        const msg = document.getElementById(`${prefix}-save-msg`);
        msg.textContent = 'Saving…';
        msg.className = 'save-msg';
        // Sends the FULL current snapshot, not just this one field — an
        // omitted field is treated as blank by the save endpoint.
        const body = { type: 'financials', client_id: currentClientId, period_end: currentPeriodEnd };
        FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = snapshot[key] != null ? snapshot[key] : ''; });
        body[fieldName] = input.value;
        try {
          const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
          const saved = await res.json();
          if (saved.error) throw new Error(saved.error);
          msg.textContent = 'Saved.';
          msg.className = 'save-msg ok';
          const scrollPos = window.scrollY;
          await renderMain();
          window.scrollTo(0, scrollPos);
        } catch (err) {
          msg.textContent = 'Error: ' + err.message;
          msg.className = 'save-msg err';
        }
      };
    };
    if (r) {
      wireBalanceAdjust('cashbal', r.cash_prior, 'cash');
      wireBalanceAdjust('debtbal', r.total_debt_prior, 'total_debt');
    }

    const reconFieldIds = ['loan_repayments', 'equipment_purchases', 'funds_introduced', 'owner_drawings', 'director_loan_balance'];
    const reconNum = (id) => { const v = document.getElementById(`recon-${id}`).value; return v === '' ? null : Number(v); };
    // Adjustment rows now live in 4 separate per-section lists (see
    // addItemBlock in renderCashReconciliationBlock) rather than one shared
    // list — adjRows() spans all of them; adjRowsFor() filters to one
    // section's own rows via the tag each row carries.
    const adjRows = () => [...document.querySelectorAll('.recon-adj-row')];
    const adjRowsFor = (sec) => adjRows().filter((row) => row.dataset.adjSection === sec);
    const sumAdjRows = (rows) => rows.reduce((sum, row) => sum + (Number(row.querySelector('.recon-adj-amount').value || 0)), 0);

    const recalcRecon = () => {
      const loanRepayments = reconNum('loan_repayments') || 0;
      const newBorrowing = r.delta_debt == null ? null : r.delta_debt + loanRepayments;
      document.getElementById('recon-new-borrowing').textContent = newBorrowing == null ? '—' : formatMoney(newBorrowing);

      const directorLoanBalance = reconNum('director_loan_balance');
      const directorLoanMovement = (directorLoanBalance != null && r.director_loan_balance_prior != null) ? directorLoanBalance - r.director_loan_balance_prior : null;
      document.getElementById('recon-director-loan-movement').textContent = directorLoanMovement == null ? '—' : formatMoney(directorLoanMovement);

      const equipmentInput = reconNum('equipment_purchases');
      const capex = equipmentInput != null ? equipmentInput : r.capex_estimate;

      const capexAdj = sumAdjRows(adjRowsFor('capex'));
      const borrowingsAdj = sumAdjRows(adjRowsFor('borrowings'));
      const ownerAdj = sumAdjRows(adjRowsFor('owner'));
      const otherAdj = sumAdjRows(adjRowsFor('other'));
      const adjustmentsTotal = capexAdj + borrowingsAdj + ownerAdj + otherAdj;

      const setSubtotal = (key, value) => {
        const el = document.getElementById(`recon-sub-${key}`);
        if (!el) return;
        el.childNodes[0].textContent = formatMoney(value) + ' ';
        el.classList.toggle('neg', value < 0);
      };
      setSubtotal('capex', (capex != null ? -capex : 0) + capexAdj);
      setSubtotal('borrowings', (r.delta_debt || 0) - (r.interest_applicable ? (r.interest_paid || 0) : 0) + borrowingsAdj);
      setSubtotal('owner', (directorLoanMovement || 0) + (reconNum('funds_introduced') || 0) - (reconNum('owner_drawings') || 0) + ownerAdj);
      setSubtotal('other', otherAdj);

      const financingKnown = (r.delta_debt || 0)
        + (r.interest_applicable ? -(r.interest_paid || 0) : 0)
        + (directorLoanMovement || 0)
        + (reconNum('funds_introduced') || 0) - (reconNum('owner_drawings') || 0)
        - (capex || 0)
        + adjustmentsTotal;
      const residual = r.non_operating - financingKnown;
      document.getElementById('recon-residual-value').textContent = formatMoney(residual);
      document.getElementById('recon-residual-box').classList.toggle('neg', residual < 0);
      const netExplained = r.delta_cash - residual;
      document.getElementById('recon-equation').textContent = `${formatMoney(netExplained)} net + ${formatMoney(residual)} unexplained = ${formatMoney(r.delta_cash)} actual change in cash`;
      // The headline itself (delta_cash, the real bank balance movement)
      // never changes from editing these fields — only how much of it is
      // "explained" does, which is what the Unexplained stat tracks live.
      const unexplainedStat = document.getElementById('cash-tile-unexplained');
      if (unexplainedStat) {
        unexplainedStat.textContent = formatMoney(residual);
        unexplainedStat.classList.toggle('neg', residual < 0);
      }

      return {
        loanRepayments: reconNum('loan_repayments'), equipmentPurchases: equipmentInput,
        fundsIntroduced: reconNum('funds_introduced'), ownerDrawings: reconNum('owner_drawings'),
        directorLoanBalance,
        adjustments: adjRows().map((row) => ({ label: row.querySelector('.recon-adj-label').value, amount: row.querySelector('.recon-adj-amount').value, section: row.dataset.adjSection })),
      };
    };
    reconFieldIds.forEach((id) => { document.getElementById(`recon-${id}`).oninput = recalcRecon; });

    const wireAdjRow = (row) => {
      row.querySelector('.recon-adj-amount').oninput = recalcRecon;
      row.querySelector('.recon-adj-remove').onclick = () => { row.remove(); recalcRecon(); };
    };
    adjRows().forEach(wireAdjRow);
    container.querySelectorAll('[data-adj-add]').forEach((addBtn) => {
      addBtn.onclick = () => {
        const sec = addBtn.dataset.adjAdd;
        const list = document.getElementById(`recon-adjustments-list-${sec}`);
        list.insertAdjacentHTML('beforeend', renderReconAdjustmentRow({ label: '', amount: '' }, sec));
        const newRow = list.lastElementChild;
        wireAdjRow(newRow);
        newRow.querySelector('.recon-adj-label').focus();
      };
    });

    document.getElementById('recon-save-btn').onclick = async () => {
      const msg = document.getElementById('recon-save-msg');
      const vals = recalcRecon();
      msg.textContent = 'Saving…';
      msg.className = 'save-msg';
      // Sends the FULL current snapshot — an omitted field is treated as
      // blank by the save endpoint, so only overriding these fields here
      // (not sending a partial payload) is what keeps the rest intact.
      const body = { type: 'financials', client_id: currentClientId, period_end: currentPeriodEnd };
      FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = snapshot[key] != null ? snapshot[key] : ''; });
      body.loan_repayments = vals.loanRepayments ?? '';
      body.equipment_purchases = vals.equipmentPurchases ?? '';
      body.funds_introduced = vals.fundsIntroduced ?? '';
      body.owner_drawings = vals.ownerDrawings ?? '';
      body.director_loan_balance = vals.directorLoanBalance ?? '';
      body.cash_recon_adjustments = vals.adjustments;
      // renderMain() below rebuilds this whole card from scratch, and every
      // panel/section starts collapsed by default — without restoring that,
      // a successful save LOOKS like it did nothing (everything you just
      // added visually vanishes behind a closed accordion), even though the
      // data genuinely persisted. Remember what was open, reopen it after.
      const openSections = ['capex', 'borrowings', 'owner', 'other'].filter((key) => document.getElementById(`recon-body-${key}`)?.style.display === 'block');
      try {
        const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
        const saved = await res.json();
        if (saved.error) throw new Error(saved.error);
        msg.textContent = 'Saved.';
        msg.className = 'save-msg ok';
        const scrollPos = window.scrollY;
        await renderMain();
        document.getElementById('recon-toggle')?.click();
        await new Promise((res2) => setTimeout(res2, 0));
        openSections.forEach((key) => document.querySelector(`[data-accordion-toggle="${key}"]`)?.click());
        window.scrollTo(0, scrollPos);
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.className = 'save-msg err';
      }
    };
  }

  container.querySelectorAll('button[data-set-target], button[data-edit-target]').forEach((btn) => {
    btn.onclick = () => {
      const key = btn.dataset.setTarget || btn.dataset.editTarget;
      document.getElementById(`target-editor-${key}`).style.display = 'flex';
      btn.style.display = 'none';
    };
  });
  container.querySelectorAll('button[data-cancel-target]').forEach((btn) => {
    btn.onclick = () => {
      const key = btn.dataset.cancelTarget;
      document.getElementById(`target-editor-${key}`).style.display = 'none';
      const trigger = container.querySelector(`[data-edit-target="${key}"], [data-set-target="${key}"]`);
      if (trigger) trigger.style.display = '';
    };
  });
  container.querySelectorAll('button[data-save-target]').forEach((btn) => {
    btn.onclick = async () => {
      const key = btn.dataset.saveTarget;
      // cash_net_movement isn't a real kpi_library row (see buildCashNetMovementKpi) —
      // rebuild the same synthetic object rather than looking it up in kpis.
      const kpi = key === 'cash_net_movement'
        ? buildCashNetMovementKpi(cashInOut(kpis.find((k) => k.key === 'op_cash_conversion')?.cash_reconciliation))
        : kpis.find((k) => k.key === key);
      const raw = document.getElementById(`target-input-${key}`).value;
      if (raw === '') return;
      const target = kpi.format === 'percent' ? Number(raw) / 100 : Number(raw);
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        if (btn.dataset.itemId) {
          await editKpiTargetGoal(kpi, target, btn.dataset.itemCat, btn.dataset.itemPeriod, btn.dataset.itemId);
        } else {
          await addKpiTargetGoal(kpi, target);
        }
        currentCtx = await callRead('get_context', currentClientId);
        // A full renderMain() replaces the whole tab's DOM at once — without
        // capturing/restoring scroll, that visually jumps the page back to the
        // top, reading as if the whole screen reset rather than just this card.
        const scrollPos = window.scrollY;
        await renderMain();
        window.scrollTo(0, scrollPos);
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Save';
      }
    };
  });

  if (hs) {
    drawWheel(document.getElementById('ov-wheel'), pillars, hs.score);
    const legend = document.getElementById('ov-legend');
    pillars.forEach((p) => {
      const item = document.createElement('div');
      item.className = 'pillar-legend-item';
      item.innerHTML = `<span class="pillar-swatch" style="background:${p.color}"></span><span class="pillar-legend-name">${p.name}</span><span class="pillar-legend-score">${p.score == null ? '—' : p.score.toFixed(1)}</span>`;
      legend.appendChild(item);
    });
  }

  container.querySelectorAll('button[data-suggest-target]').forEach((btn) => {
    btn.onclick = async () => {
      const idx = Number(btn.dataset.suggestTarget);
      const flag = flags[idx];
      const panel = document.getElementById(`target-panel-${idx}`);
      panel.style.display = 'block';
      panel.innerHTML = '<p class="muted plain" style="margin:0;">Thinking…</p>';
      btn.disabled = true;
      try {
        const res = await fetch('/.netlify/functions/suggest-goal', {
          method: 'POST',
          body: JSON.stringify({
            client_id: currentClientId, period_end: currentPeriodEnd,
            category: PILLAR_TO_DOMAIN[flag.pillar] === 'financial' ? 'business' : 'business',
            category_label: 'Financial Performance', focus: flag.message, count: 1,
          }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const suggestion = data.suggestions?.[0];
        if (!suggestion) {
          panel.innerHTML = '<p class="muted plain" style="margin:0;">No suggestion came back — try again.</p>';
        } else {
          panel.innerHTML = `
            <p class="suggest-caveat">Suggested, not benchmarked.</p>
            <div class="suggest-item"><p>${suggestion}</p><button class="mini-link" id="target-add-${idx}" type="button">add to goals</button></div>
          `;
          document.getElementById(`target-add-${idx}`).onclick = async (e) => {
            e.target.disabled = true;
            e.target.textContent = 'adding…';
            await addTextAsGoal(suggestion);
            e.target.textContent = '✓ added to Goals → Business';
          };
        }
      } catch (err) {
        panel.innerHTML = `<p class="muted plain" style="margin:0;">Error: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    };
  });
}

async function renderFinancialAnalyse(content) {
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot from the Input tab first, then run analysis here.</p></div>`;
    return;
  }
  content.innerHTML = `
    <button class="action" id="run-analysis-btn">Run analysis for ${formatShortDate(currentPeriodEnd)}</button>
    <div id="analyse-body" style="margin-top:16px;"></div>
  `;
  const body = document.getElementById('analyse-body');
  // These fetches are async — if the user navigates away before they resolve,
  // `body` (and its 'run-analysis-btn' sibling) may already be detached from the
  // document. Guard every write with a liveness check rather than trust closures
  // captured before the await.
  const stillLive = () => document.body.contains(body);

  const [overview, kpiData, history] = await Promise.all([
    callRead('get_overview', currentClientId, currentPeriodEnd),
    callRead('get_kpi_report', currentClientId, currentPeriodEnd),
    callRead('get_kpi_history', currentClientId, currentPeriodEnd),
  ]);
  if (!stillLive()) return;
  renderHealthWheelBlock(body, overview, kpiData?.kpis, kpiData?.snapshot, history);

  const runBtn = document.getElementById('run-analysis-btn');
  if (runBtn) runBtn.onclick = async () => {
    body.textContent = 'Analyzing…';
    const res = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      body: JSON.stringify({ client_id: currentClientId, period_end: currentPeriodEnd }),
    });
    const data = await res.json();
    if (!stillLive()) return;
    if (data.error) {
      body.innerHTML = `<div class="flag">Error: ${data.error}</div>`;
      return;
    }
    const [fresh, freshKpis, freshHistory] = await Promise.all([
      callRead('get_overview', currentClientId, currentPeriodEnd),
      callRead('get_kpi_report', currentClientId, currentPeriodEnd),
      callRead('get_kpi_history', currentClientId, currentPeriodEnd),
    ]);
    if (!stillLive()) return;
    renderHealthWheelBlock(body, fresh, freshKpis?.kpis, freshKpis?.snapshot, freshHistory);
    refreshHealthBadge();
  };
}

// ---- Growth: Analyse ----
async function renderGrowthAnalyse(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot from Financial Performance → Input first, then run analysis on Financial Performance → Analyse.</p></div>`;
    return;
  }
  const [data, kpiData, history, valuationData, ebitdaTrajectory] = await Promise.all([
    callRead('get_diagnosis', currentClientId, currentPeriodEnd),
    callRead('get_kpi_report', currentClientId, currentPeriodEnd),
    callRead('get_kpi_history', currentClientId, currentPeriodEnd),
    callRead('get_valuation_history', currentClientId, currentPeriodEnd),
    // Fixed at annual/3-years regardless of the client's native cadence or
    // whatever the (separately interactive) trajectory chart is currently
    // showing — valuation should only ever be annual, per earlier decision.
    fetch('/.netlify/functions/read-data', {
      method: 'POST',
      body: JSON.stringify({ action: 'get_growth_trajectory', client_id: currentClientId, period_end: currentPeriodEnd, view_cadence: 'annual', periods_count: 3 }),
    }).then((r) => r.json()),
  ]);
  if (myToken !== renderToken) return;
  const snapshot = kpiData?.snapshot;
  const targets = findAllKpiTargets();
  const avgEbitda = computeAverageEbitda(ebitdaTrajectory);

  const recRow = (r, i, group) => `
    <div class="flag-row-wrap">
      <div class="flag-row">
        <span class="flag-dot sage"></span>
        <span><b>${r.title}</b> — ${r.impact || ''} <span class="muted plain">(${r.difficulty || ''}${r.difficulty && r.timeframe ? ', ' : ''}${r.timeframe || ''})</span></span>
        <button class="mini-link" data-turn-rec="${group}:${i}" type="button">→ turn into goal</button>
      </div>
    </div>
  `;

  content.innerHTML = `
    ${renderGrowthOutlookCard(snapshot)}
    ${renderPaceToGoalCard(targets, history)}
    <div class="grid2">
      ${renderGrowthTrajectoryCard(data?.growthTrajectoryCommentary)}
      ${renderValuationCard(snapshot, valuationData, avgEbitda)}
    </div>
    <div class="card">
      <p class="muted">Opportunities — new/growth ideas</p>
      ${data.opportunities.length ? data.opportunities.map((r, i) => recRow(r, i, 'opportunities')).join('') : '<p class="muted plain" style="margin:0;">Nothing recorded for this period yet.</p>'}
    </div>
  `;

  content.querySelectorAll('button[data-turn-rec]').forEach((btn) => {
    btn.onclick = async () => {
      const [group, idx] = btn.dataset.turnRec.split(':');
      const r = data[group][Number(idx)];
      const text = r.impact ? `${r.title} — ${r.impact}` : r.title;
      btn.disabled = true;
      btn.textContent = 'adding…';
      try {
        await addTextAsGoal(text);
        btn.textContent = '✓ added to Goals → Business';
      } catch (err) {
        btn.textContent = 'error';
        btn.disabled = false;
        alert('Error: ' + err.message);
      }
    };
  });

  const growthOutlookUnit = document.getElementById('growth-outlook-unit');
  if (growthOutlookUnit && snapshot?.revenue && snapshot?.net_profit != null) {
    const valueEl = document.getElementById('growth-outlook-value');
    const changeEl = document.getElementById('growth-outlook-change');
    const provenanceEl = document.getElementById('growth-outlook-provenance');
    const buildupEl = document.getElementById('growth-outlook-buildup');
    const cashCostEl = document.getElementById('growth-outlook-cash-cost');
    const revenueInput = document.getElementById('growth-outlook-revenue');
    const cogsInput = document.getElementById('growth-outlook-cogs');
    const wagesInput = document.getElementById('growth-outlook-wages');
    const opexInput = document.getElementById('growth-outlook-opex');
    const netProfitInput = document.getElementById('growth-outlook-netprofit');
    const recalc = () => {
      growthOutlookState = {
        unit: growthOutlookUnit.value, revenue: Number(revenueInput.value || 0), cogs: Number(cogsInput.value || 0),
        wages: Number(wagesInput.value || 0), opex: Number(opexInput.value || 0), netProfit: Number(netProfitInput.value || 0),
      };
      const scenario = projectGrowthProfitScenario(
        snapshot, growthOutlookState.unit, growthOutlookState.revenue, growthOutlookState.cogs,
        growthOutlookState.wages, growthOutlookState.opex, growthOutlookState.netProfit
      );
      valueEl.textContent = formatMoney(scenario.projectedProfit);
      provenanceEl.textContent = scenario.provenance;
      buildupEl.innerHTML = scenario.buildup;

      // Always visible, independent of which lever produced it — "so what
      // did this actually do to profit" shouldn't require opening the
      // assumptions panel and reading the buildup line to work out.
      const extraProfit = scenario.projectedProfit - snapshot.net_profit;
      const changeSign = extraProfit >= 0 ? '+' : '−';
      const changePct = snapshot.net_profit ? Math.abs((extraProfit / snapshot.net_profit) * 100) : null;
      changeEl.textContent = `Current ${formatMoney(snapshot.net_profit)} → projected ${formatMoney(scenario.projectedProfit)} (${changeSign}${formatMoney(Math.abs(extraProfit))}${changePct != null ? ` / ${changeSign}${changePct.toFixed(0)}%` : ''})`;

      const cashCost = computeCashCostOfGrowing(snapshot, kpiData?.kpis, scenario.projectedRevenue, scenario.projectedGP);
      if (cashCost != null) {
        // Framed against the EXTRA profit this scenario adds (not total
        // profit) — a bare dollar figure doesn't tell you if it's trivial or
        // most of the upside; the % does, and naming the usable-cash
        // leftover explicitly is the actual point of this line: profit up
        // by $X, but only $Y of that is real, spendable cash — the rest is
        // sitting in debtors/stock. Sign flips the verb: a growth scenario
        // ties cash up, a decline scenario frees it.
        const magnitude = Math.abs(cashCost);
        const verb = cashCost > 0 ? 'tied up in' : 'freed up from';
        let pctText = '';
        if (extraProfit > 0) {
          const pct = Math.round((magnitude / extraProfit) * 100);
          const usable = extraProfit - cashCost;
          pctText = ` — ${pct}% of the extra profit this growth adds, leaving roughly ${formatMoney(usable)} (${100 - pct}%) as usable cash`;
        }
        cashCostEl.textContent = `Roughly ${formatMoney(magnitude)} would be ${verb} debtors/stock (net of supplier financing), not usable cash${pctText}.`;
        cashCostEl.style.display = 'block';
      } else {
        cashCostEl.style.display = 'none';
      }
    };
    growthOutlookUnit.onchange = recalc;
    [revenueInput, cogsInput, wagesInput, opexInput, netProfitInput].forEach((el) => { el.oninput = recalc; });
    recalc();

    const toggle = document.getElementById('growth-outlook-toggle');
    const panel = document.getElementById('growth-outlook-panel');
    const openPanel = () => {
      panel.style.display = 'block';
      toggle.querySelector('.chevron').textContent = '▴';
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    toggle.onclick = () => {
      const willOpen = panel.style.display === 'none';
      panel.style.display = willOpen ? 'block' : 'none';
      toggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
    };
    document.getElementById('growth-outlook-provenance-link').onclick = openPanel;
  }

  const trajectoryRegion = document.getElementById('trajectory-chart-region');
  if (trajectoryRegion) {
    const cadenceSelect = document.getElementById('trajectory-cadence');
    const countSelect = document.getElementById('trajectory-periods-count');
    const loadTrajectory = async () => {
      trajectoryRegion.innerHTML = '<p class="muted plain" style="margin:0;">Loading…</p>';
      const res = await fetch('/.netlify/functions/read-data', {
        method: 'POST',
        body: JSON.stringify({
          action: 'get_growth_trajectory', client_id: currentClientId, period_end: currentPeriodEnd,
          view_cadence: cadenceSelect ? cadenceSelect.value : undefined,
          periods_count: countSelect.value,
        }),
      });
      const trajectory = await res.json();
      trajectoryRegion.innerHTML = renderGrowthTrajectoryChartRegion(trajectory);
    };
    if (cadenceSelect) cadenceSelect.onchange = () => {
      // Relabel "Last N" with the newly selected cadence's unit — the
      // count itself doesn't change, just what it means (4 quarters vs
      // 4 years), so keep the current selection rather than resetting it.
      countSelect.innerHTML = trajectoryPeriodsCountOptionsHtml(cadenceSelect.value, Number(countSelect.value));
      loadTrajectory();
    };
    countSelect.onchange = loadTrajectory;
    loadTrajectory();
  }

  const multipleInput = document.getElementById('valuation-multiple-input');
  if (multipleInput) {
    const amountEl = document.getElementById('valuation-amount');
    const recommendedEl = document.getElementById('valuation-recommended');
    const rationaleEl = document.getElementById('valuation-rationale');
    const ebitdaInput = document.getElementById('valuation-ebitda-input');
    const saveBtn = document.getElementById('valuation-save-btn');
    const saveMsg = document.getElementById('valuation-save-msg');
    const currentEbitda = computeEbitda(snapshot);
    const defaultEbitda = avgEbitda ?? currentEbitda;
    const currentRow = (valuationData?.valuations || []).find((v) => v.period_end === currentPeriodEnd);
    const suggested = valuationData?.suggestedMultiple;
    // Prefer the FRESH recommendation (the backend now fetches one whenever
    // an industry's on file, whether or not this period's already been
    // saved) — falls back to whatever was recorded on the saved row only if
    // a live suggestion isn't available right now (industry cleared since,
    // or the AI call failed).
    const recommendedMultiple = suggested?.suggested_multiple ?? currentRow?.ai_suggested_multiple ?? null;

    recommendedEl.textContent = recommendedMultiple != null
      ? `Recommended multiple: ${recommendedMultiple}x`
      : 'No recommended multiple available — set an industry on this client\'s profile, or enter a custom one below.';
    rationaleEl.textContent = suggested?.rationale ? `🤖 ${suggested.rationale}` : '';

    // Only pre-fill a custom field when a DIFFERENT value was actually
    // chosen before — if what's saved just matches the default (average
    // EBITDA / recommended multiple), leave it blank so the default reads
    // as the active basis rather than looking like a manual override that
    // happens to agree.
    ebitdaInput.value = (currentRow && currentRow.ebitda !== defaultEbitda) ? currentRow.ebitda : '';
    multipleInput.value = (currentRow && currentRow.multiple_used !== recommendedMultiple) ? currentRow.multiple_used : '';

    const effectiveEbitda = () => {
      const custom = Number(ebitdaInput.value || 0);
      return custom > 0 ? custom : (defaultEbitda || 0);
    };
    const effectiveMultiple = () => {
      const custom = Number(multipleInput.value || 0);
      return custom > 0 ? custom : (recommendedMultiple || 0);
    };

    const recalcValuation = () => {
      const ebitdaVal = effectiveEbitda();
      const multiple = effectiveMultiple();
      amountEl.textContent = (ebitdaVal && multiple) ? formatMoney(ebitdaVal * multiple) : '—';
    };
    ebitdaInput.oninput = recalcValuation;
    multipleInput.oninput = recalcValuation;
    recalcValuation();

    saveBtn.onclick = async () => {
      const ebitdaVal = effectiveEbitda();
      const multiple = effectiveMultiple();
      if (!ebitdaVal || !multiple) { alert('Need both an EBITDA figure and a multiple — enter custom values if the defaults aren\'t available.'); return; }
      saveBtn.disabled = true;
      saveMsg.textContent = 'Saving…';
      try {
        const res = await fetch('/.netlify/functions/manual-entry', {
          method: 'POST',
          body: JSON.stringify({ type: 'save_valuation', client_id: currentClientId, period_end: currentPeriodEnd, ebitda: ebitdaVal, ai_suggested_multiple: recommendedMultiple, multiple_used: multiple }),
        });
        const data2 = await res.json();
        if (data2.error) throw new Error(data2.error);
        saveMsg.textContent = '✓ saved';
      } catch (err) {
        saveMsg.textContent = 'error';
        alert('Error: ' + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    };
  }
}

// ---- Owner Wealth: Input & Analyse ----
// Personal net worth — super/investments/property/other/debt as actual
// numbers, distinct from the Goals domain's "Owner Goals" (intentions, not
// figures). See owner-wealth-domain-build-spec.md. Deliberately no pillar
// score wired for this — scorePillar's default:return 6 still covers
// 'owner_wealth' (analyze.js), since what net worth number counts as "good"
// depends on age/goals/circumstances this app doesn't know.

// A custom box's own items sum to a plain magnitude — this folds that
// magnitude into the net worth total using its asset/liability sign, so an
// asset-type box adds and a liability-type box subtracts, same as the
// built-in buckets do implicitly.
function sumOwnerCustomBucketsNet(customBuckets) {
  if (!Array.isArray(customBuckets) || !customBuckets.length) return 0;
  return customBuckets.reduce((sum, b) => {
    const bucketTotal = (b.items || []).reduce((s, it) => s + (Number(it.value) || 0), 0);
    return sum + (b.type === 'liability' ? -bucketTotal : bucketTotal);
  }, 0);
}

function computeNetWorthTotal(wealth) {
  if (!wealth) return null;
  const fields = ['super_balance', 'investments', 'property', 'other_assets', 'debt'];
  const hasCustom = Array.isArray(wealth.custom_buckets) && wealth.custom_buckets.some((b) => (b.items || []).length);
  if (fields.every((f) => wealth[f] == null) && !hasCustom) return null; // nothing entered yet
  return (wealth.super_balance || 0) + (wealth.investments || 0) + (wealth.property || 0) + (wealth.other_assets || 0) - (wealth.debt || 0) + sumOwnerCustomBucketsNet(wealth.custom_buckets);
}

// Business equity is read live off business_valuations (Growth domain), not
// stored on owner_wealth_snapshots — so the two figures can never drift out
// of sync with each other. Hides cleanly if no Valuation's ever been saved.
// Boxed like the other buckets for visual consistency, but deliberately
// NOT summed into computeNetWorthTotal — it's an indicative estimate tied
// to assumptions set in a different domain (Growth → Valuation's AI-
// suggested or custom multiple), not a firm figure entered here. Folding it
// into the headline total would mean that number silently shifts whenever
// someone tweaks a valuation assumption elsewhere — kept visible but

  // Unboxed here — the caller (renderOwnerAnalyse) always wraps this in its

  return `
    <div class="cash-item" id="ow-business-equity-jump" title="Click to edit in Growth → Valuation" style="cursor:pointer; padding:0;">

// A small FIXED personal checklist — distinct from Goals' exit_succession

// badge/badgeVariant is a plain-English steer, not advice — same spirit as

// existing .confidence-badge pill (🟢/🟡 Calculated/Estimated elsewhere)
// rather than inventing a new badge style. Two of these are close to
// universal (will, EPOA); two are genuinely conditional on business
// structure, not a lower-priority version of the same thing — worth a
// distinct, scannable badge instead of a sentence you have to read to
// find out, and instead of implying every "No" is equally urgent.
const OWNER_ESTATE_CHECKLIST_ITEMS = [
  { key: 'will', label: 'Will up to date', why: 'See a solicitor and get a will drafted or updated — without a valid one, the estate is distributed under intestacy rules, not necessarily what the owner would have wanted.' },

  { key: 'key_person_insurance', label: 'Key-person insurance in place', why: 'Worth raising with an insurance broker or adviser — not a clear "get one" the way a will is. A policy can fund a buy-sell agreement or cover the disruption of losing the owner, but whether it\'s worth the premium depends on cost versus how much the business actually relies on that one person.' },
];

// Will and EPOA are never conditional on the business — every individual
// needs them personally, whether or not they run a business at all, so
// they're always applicable regardless of structure. Buy-sell and
// key-person insurance only matter when there's a co-owner to actually buy
// out (or insure against losing) — a sole trader has no one to buy them
// out, so it's genuinely not applicable there, not just unanswered.

// headcount, so this can only be confident in one direction: "Sole
// trader" definitionally means no co-owner (not applicable); "Partnership"
// definitionally means more than one (applicable); Company/Trust/Other/
// unset could honestly be either, so this returns null rather than
// guessing — same "exclude the unknown, don't guess" principle used
// throughout Owner & Succession's scoring.
function ownerEstateItemApplicability(key, entityType) {
  if (key !== 'buy_sell_agreement' && key !== 'key_person_insurance') return true;
  if (entityType === 'Sole trader') return false;
  if (entityType === 'Partnership') return true;

}

// Set by an Analyse tile jump right before switching to Input, so that one
// render opens just the clicked bucket instead of every bucket at once —
// consumed and cleared by the jump handler itself once it's done scrolling.
// Left null for any other way of reaching Input, which opens everything.
let ownerInputFocusBucket = null;

// A one-off lands "year" years from now and compounds at the bucket's rate
// for whatever's left of the horizon after that — a change scheduled at or
// past the horizon just lands at face value with no further growth, rather
// than erroring or being silently dropped.
function compoundWithOneOffs(startAmount, ratePct, years, oneOffs) {
  const rate = 1 + (ratePct / 100);
  let amount = (startAmount || 0) * Math.pow(rate, years);
  (oneOffs || []).forEach((o) => {
    const yearsRemaining = Math.max(0, years - (Number(o.year) || 0));
    amount += (Number(o.amount) || 0) * Math.pow(rate, yearsRemaining);
  });
  return amount;
}

// Each asset bucket compounds at its OWN rate rather than one blended rate
// (chosen deliberately over the simpler option — property/super/investments
// genuinely grow differently), plus whatever one-off changes were entered
// for it. Debt has no growth rate of its own — held flat, not projected
// forward — so a one-off change to it (an extra repayment, a new loan) is
// just added at face value rather than compounded. Custom boxes get the
// same flat treatment as debt for the same reason — no growth rate was
// ever collected for them, so pretending to model their growth would be a
// fabricated assumption; they're just carried through at today's value
// with their asset/liability sign applied.
function projectOwnerRetirementOutlook(wealth, years, growthSuper, growthInvestments, growthProperty, growthOther, desiredIncome, withdrawalRate, oneOffs, businessEquity = 0) {
  const oo = oneOffs || {};
  const projectedSuper = compoundWithOneOffs(wealth.super_balance, growthSuper, years, oo.super);
  const projectedInvestments = compoundWithOneOffs(wealth.investments, growthInvestments, years, oo.investments);
  const projectedProperty = compoundWithOneOffs(wealth.property, growthProperty, years, oo.property);
  const projectedOther = compoundWithOneOffs(wealth.other_assets, growthOther, years, oo.other);
  const debtOneOffTotal = (oo.debt || []).reduce((sum, o) => sum + (Number(o.amount) || 0), 0);
  const projectedDebt = (wealth.debt || 0) + debtOneOffTotal;
  const customNet = sumOwnerCustomBucketsNet(wealth.custom_buckets);
  const projectedAssets = projectedSuper + projectedInvestments + projectedProperty + projectedOther;
  // Business equity, when opted in, is added flat — same treatment as
  // custom boxes and debt one-offs, and for the same reason: no growth
  // rate exists for a rough indicative valuation, so it isn't compounded.
  const projectedNetWorth = projectedAssets - projectedDebt + customNet + (businessEquity || 0);
  const targetNestEgg = withdrawalRate > 0 ? desiredIncome / (withdrawalRate / 100) : null;
  const gap = targetNestEgg != null ? projectedNetWorth - targetNestEgg : null;
  return { projectedNetWorth, targetNestEgg, gap, projectedSuper, projectedInvestments, projectedProperty, projectedOther, projectedDebt, customNet, businessEquity: businessEquity || 0 };
}

// Answers "how long would this actually take" as a companion to the manual
// years input above, which only answers "am I on track BY year N." One-off
// changes are already pinned to specific years, so a yearly step matches
// their granularity exactly — no need for anything finer. Capped so a
// target that's unreachable at these rates (e.g. all growth rates left at
// 0%) doesn't loop forever.
function solveOwnerYearsToTarget(wealth, growthSuper, growthInvestments, growthProperty, growthOther, oneOffs, target, businessEquity = 0, maxYears = 60) {
  if (target == null || target <= 0) return null;
  for (let y = 0; y <= maxYears; y++) {
    const r = projectOwnerRetirementOutlook(wealth, y, growthSuper, growthInvestments, growthProperty, growthOther, 0, 0, oneOffs, businessEquity);
    if (r.projectedNetWorth >= target) return y;
  }
  return null;
}

// Tests the withdrawal-rate assumption directly instead of trusting it —
// the 4%-rule target (income / withdrawal rate) is a rule of thumb that
// only holds up if post-retirement investment growth roughly keeps pace
// with withdrawals; this simulates it year by year to check. Withdrawal
// happens first each year (you need to live on it), then the remainder
// grows — standard drawdown-modeling order. Capped at 100 years; still
// positive at the cap is reported as "lasts indefinitely" rather than a
// specific number, since nothing this simple should claim century-scale
// precision.
function simulateDrawdownYears(startBalance, annualWithdrawal, growthRatePct, maxYears = 100) {
  if (startBalance == null || startBalance <= 0 || annualWithdrawal <= 0) return null;
  let balance = startBalance;
  const rate = 1 + (growthRatePct / 100);
  for (let y = 1; y <= maxYears; y++) {
    balance = (balance - annualWithdrawal) * rate;
    if (balance <= 0) return y;
  }
  return null; // still standing after maxYears — treated as "lasts indefinitely"
}

// Present-value-of-an-annuity: how big a starting balance is actually
// needed to fund annualWithdrawal for a specific number of years, given the
// balance keeps earning growthRatePct while it's drawn down. More accurate
// than the flat income/withdrawal-rate divisor, which implicitly assumes
// the money needs to last indefinitely — this instead answers "how much do
// I need for exactly N years," which is usually a smaller number once
// ongoing growth is accounted for. growthRatePct of 0 degrades to the
// trivial case (no growth → need exactly N years of withdrawals).
function solveRequiredPrincipal(annualWithdrawal, growthRatePct, years) {
  if (annualWithdrawal <= 0 || years <= 0) return null;
  if (Math.abs(growthRatePct) < 1e-9) return annualWithdrawal * years;
  const r = 1 + (growthRatePct / 100);
  return annualWithdrawal * (Math.pow(r, years) - 1) / (Math.pow(r, years - 1) * (r - 1));
}

const OWNER_RETIREMENT_BUCKET_LABELS = { super: 'Super', investments: 'Investments', property: 'Property', other: 'Other assets', debt: 'Personal debt' };

// One row per one-off change: a year (how far out it lands) and an amount

        <p style="font-size:10px; color:var(--ink-soft); margin:0 0 6px;">Year = how many years from now it lands, on the same clock as "Project forward (years)" above — e.g. 4 means 4 years from today, not calendar year 2004.</p>
        <div id="ow-oneoff-list-${bucket}">${items.map((o) => renderOwnerOneOffRow(bucket, o)).join('')}</div>
        <button type="button" class="mini-link" data-oneoff-add="${bucket}" style="margin:6px 0 4px;">+ Add one-off change</button>
      </div>

function renderOwnerRetirementCard(latestValuation) {
  const s = ownerRetirementState;
  const row = (id, label, value) => `<div class="ocf-row"><label>${label}</label><input type="number" id="${id}" value="${value}" placeholder="0" /></div>`;
  const hasOneOffs = OWNER_RETIREMENT_BUCKETS.some((b) => (s.oneOffs[b] || []).length > 0);
  // Three separate panels, one per box, instead of one shared list of
  // every input — clicking "Amount required for retirement" should only ever surface
  // the fields that actually feed it, not the growth rates that feed a
  // different box entirely.
  // A succession goal's target_year (Goals → Exit & Succession) defaults
  // "Project forward (years)" the first time this card renders in a
  // session — only while years is still untouched (0), so it never
  // silently overwrites a value the accountant has already set or
  // deliberately cleared back to 0.
  const successionTargetYear = getOwnerSuccessionTargetYear();
  // A specific exit year (from an actual Goals → Exit & Succession item)
  // always wins when one exists. Falling back to the general goal horizon
  // (Profile) when it doesn't is deliberately kept as a SEPARATE
  // fallback rather than folded into getOwnerSuccessionTargetYear itself
  // — "I want to build wealth over the next 5 years" is not the same
  // claim as "I plan to exit in 5 years," and conflating them would make
  // this card assert an exit plan that was never actually stated.
  const horizonYears = currentCtx?.profile_extra?.goal_horizon_years ? Number(currentCtx.profile_extra.goal_horizon_years) : null;
  const successionYears = successionTargetYear != null ? Math.max(0, successionTargetYear - new Date().getFullYear()) : horizonYears;
  const usingSuccessionDefault = s.years === 0 && successionTargetYear != null;
  const usingHorizonDefault = s.years === 0 && successionTargetYear == null && horizonYears != null;
  const displayedYears = (usingSuccessionDefault || usingHorizonDefault) ? successionYears : s.years;
  const projectedPanelOpen = s.years !== 0 || usingSuccessionDefault || usingHorizonDefault || s.growthSuper !== 0 || s.growthInvestments !== 0 || s.growthProperty !== 0 || s.growthOther !== 0 || hasOneOffs;
  const targetPanelOpen = s.desiredIncome !== 0 || s.withdrawalRate !== 4 || s.targetOverride !== 0 || s.postRetirementGrowth !== 0 || s.retirementYears !== 0;
  // Same .card/.muted shell as the Net worth and Succession cards above and
  // below it on this page — was a .kpi-card before, which reads visually
  // different (smaller header text, no uppercase) and stood out as
  // inconsistent sitting between the two of them.
  return `
    <div class="card">
      <p class="muted">Retirement outlook</p>
      <div class="snapshot-grid">
        <div class="snapshot-field ow-jump-tile" data-retirement-jump="projected" title="Click to see and edit the assumptions behind this"><p class="card-label">Projected amount at retirement</p><p style="margin:0; font-family:var(--font-mono);" id="owner-retirement-projected">—</p></div>
        <div class="snapshot-field ow-jump-tile" data-retirement-jump="target" title="Click to see and edit the assumptions behind this"><p class="card-label">Amount required for retirement</p><p style="margin:0; font-family:var(--font-mono);" id="owner-retirement-target">—</p><p style="margin:2px 0 0; font-size:10px; color:var(--ink-soft);" id="owner-retirement-to-go-tile"></p></div>
        <div class="snapshot-field ow-jump-tile" data-retirement-jump="years" title="Click to see what this is based on"><p class="card-label">Years to retire</p><p style="margin:0; font-family:var(--font-mono);" id="owner-retirement-years-value">—</p></div>
      </div>
      <p class="muted plain" id="owner-retirement-headline" style="margin:10px 0 0; font-size:11px;"></p>

      <div class="cash-item cash-item-clickable" id="owner-retirement-toggle-projected" style="margin-top:8px;">
        <span class="cash-item-icon">🧮</span>
        <span class="cash-item-label">Assumptions — Projected amount at retirement</span>
        <span class="chevron">${projectedPanelOpen ? '▴' : '▾'}</span>
      </div>
      <div class="ocf-adjust-panel" id="owner-retirement-panel-projected" style="display:${projectedPanelOpen ? 'block' : 'none'};">
        ${row('owner-retirement-years', 'Project forward (years)', displayedYears)}
        <p style="font-size:11px; color:var(--ink-soft); margin:-4px 0 8px;" id="owner-retirement-years-zero-hint">${displayedYears === 0 ? 'Set this above 0 — growth rates below have nothing to compound against while this is 0.' : ''}</p>
        ${usingSuccessionDefault ? `<p style="font-size:11px; color:var(--ink-soft); margin:-4px 0 8px;">Sourced from your succession plan (target exit year ${successionTargetYear}) — still editable, this just saves you re-typing it.</p>` : ''}
        ${usingHorizonDefault ? `<p style="font-size:11px; color:var(--ink-soft); margin:-4px 0 8px;">Sourced from your stated goal horizon (${horizonYears} year${horizonYears === 1 ? '' : 's'}, set in Profile) — no specific exit year on file yet, still editable here.</p>` : ''}
        ${latestValuation ? `
          <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink); margin:0 0 10px; cursor:pointer;">
            <input type="checkbox" id="owner-retirement-include-business" ${s.includeBusinessEquity ? 'checked' : ''} />
            Include business equity (${formatMoney(latestValuation.valuation_amount)}, from Growth → Valuation)
          </label>
          <p style="font-size:11px; color:var(--ink-soft); margin:-6px 0 8px;">Excluded from the real Net Worth total above — it's an indicative estimate, not cash. Held flat here too, no growth rate applied, for the same reason. Counted in the projection at every year once checked — not just from your succession year onward.</p>
          ${successionYears != null ? `
            <p style="font-size:11px; margin:-2px 0 10px;">
              <button type="button" id="owner-retirement-suggest-business-oneoff" style="background:none; border:none; padding:0; color:var(--brass); cursor:pointer; text-decoration:underline; font-family:inherit; font-size:11px;">💡 More accurate: add it as a one-off landing in year ${successionYears} (your succession target) instead of counting it the whole time</button>
            </p>
          ` : ''}
        ` : ''}
        ${row('owner-retirement-growth-super', 'Growth rate — Super (%/yr)', s.growthSuper)}
        ${renderOwnerOneOffBucket('super', s.oneOffs.super)}
        ${row('owner-retirement-growth-investments', 'Growth rate — Investments (%/yr)', s.growthInvestments)}
        ${renderOwnerOneOffBucket('investments', s.oneOffs.investments)}
        ${row('owner-retirement-growth-property', 'Growth rate — Property (%/yr)', s.growthProperty)}
        ${renderOwnerOneOffBucket('property', s.oneOffs.property)}
        ${row('owner-retirement-growth-other', 'Growth rate — Other assets (%/yr)', s.growthOther)}
        ${renderOwnerOneOffBucket('other', s.oneOffs.other)}
        ${renderOwnerOneOffBucket('debt', s.oneOffs.debt)}
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">Each bucket compounds at its own rate; a one-off change lands in the year you give it and compounds from there. Debt has no growth rate — its one-off changes are added at face value. Custom boxes are held flat, no growth modeled.</p>
        <p class="card-label" style="margin:10px 0 4px;">Projected, per bucket</p>
        <div class="snapshot-grid">
          <div class="snapshot-field"><p class="card-label">Super</p><p style="margin:0; font-family:var(--font-mono);" id="owner-retirement-bd-super">—</p></div>
