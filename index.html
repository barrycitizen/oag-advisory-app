const FIXED_QUESTIONS = [
  { id: 'anything_changed', prompt: 'Has anything changed since we last spoke?' },
  { id: 'win_next_12mo', prompt: 'What would make the next 12 months a win?' },
  { id: 'anything_big', prompt: 'Anything big coming up?' },
  { id: 'worrying', prompt: "What's worrying you?" },
];

function uid() { return 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// Goals are period-scoped. If the viewed period has no items yet for a category,
// items from the nearest PRIOR period (that aren't done and haven't already been
// addressed this period) surface as "carried forward" — pending confirmation, not
// yet saved against this period. Each item keeps a stable id across periods so
// confirming/editing one doesn't hide the others still pending.
function resolveGoalList(goals, periodEnd, categoryKey) {
  const periods = goals.periods || {};
  const currentRaw = periods[periodEnd]?.cats?.[categoryKey]?.items || [];
  const currentIds = new Set(currentRaw.map((it) => it.id));
  const currentItems = currentRaw.filter((it) => !it.deleted);

  const priorPeriods = Object.keys(periods).filter((p) => p < periodEnd).sort().reverse();
  let priorItems = [];
  let sourcePeriod = null;
  for (const p of priorPeriods) {
    const items = (periods[p]?.cats?.[categoryKey]?.items || []).filter((it) => !it.deleted);
    if (items.length) { priorItems = items; sourcePeriod = p; break; }
  }
  const pendingCarry = priorItems.filter((it) => !it.done && !currentIds.has(it.id));

  return [
    ...currentItems.map((it) => ({ ...it, carried: false })),
    ...pendingCarry.map((it) => ({ ...it, carried: true, sourcePeriod })),
  ];
}

function goalAge(createdAt) {
  if (!createdAt) return '';
  const days = Math.floor((Date.now() - new Date(createdAt).getTime()) / 86400000);
  if (days < 1) return 'Opened today';
  if (days < 14) return `Open ${days}d`;
  if (days < 60) return `Open ${Math.floor(days / 7)}w`;
  return `Open ${Math.floor(days / 30)}mo`;
}

// How many distinct periods this exact goal (by id) has been explicitly recorded
// in — i.e. actually confirmed/created that period, not just shown as carried
// forward. Text edits reset the id's created_at but keep the same id, so this
// still tracks "how many times has this same commitment been reconfirmed."
const STALE_AFTER_CONFIRMS = 4;
function confirmedPeriodCount(goals, categoryKey, itemId) {
  const periods = goals.periods || {};
  return Object.values(periods).filter((p) => (p.cats?.[categoryKey]?.items || []).some((it) => it.id === itemId && !it.deleted)).length;
}

function findMostRecentPulse(goals, periodEnd) {
  const periods = goals.periods || {};
  const keys = Object.keys(periods).filter((p) => p <= periodEnd).sort().reverse();
  for (const p of keys) {
    if (periods[p]?.pulse) return { ...periods[p].pulse, periodEnd: p };
  }
  return null;
}

            </div>
            <div class="form-field" style="margin-top:6px;"><label>Successor readiness (optional)</label>
              <select id="goal-readiness-${it.id}">${SUCCESSION_READINESS.map((r) => `<option value="${r.value}" ${((it.successor_readiness || '') === r.value) ? 'selected' : ''}>${r.label}</option>`).join('')}</select>
            </div>
          ` : ''}
          <button class="action" style="margin-top:6px;" data-save="1" data-cat="${cat.key}" data-id="${it.id}">Save goal</button>
        </div>
      </div>
    `;
  }

  function renderAchievedBlock(cat, it) {
    return `
      <div class="goal-item-block achieved" data-cat="${cat.key}" data-id="${it.id}">
        <p class="goal-text achieved-text">${it.text}</p>
        <span class="goal-updated">${it.updated_at ? 'Achieved ' + it.updated_at.slice(0, 10) : ''}</span>
        <div class="toggle-row">
          <button class="toggle-btn" data-action="reopen" data-cat="${cat.key}" data-id="${it.id}">Reopen</button>
          <button class="item-remove-btn" data-remove-item="1" data-cat="${cat.key}" data-id="${it.id}" title="Delete this goal">×</button>
        </div>
      </div>
    `;
  }

  function renderCategoryCard(cat, isHidden) {
    const list = resolveGoalList(goals, currentPeriodEnd, cat.key);
    const activeItems = list.filter((it) => !it.done);
    const doneItems = list.filter((it) => it.done);
    const custom = isCustomCategory(cat.key);
    const card = document.createElement('div');
    card.className = 'card goal-card';
    card.id = `goal-card-${cat.key}`;
    card.style.setProperty('--cat-color', cat.color);
    const removeControl = isHidden
      ? `<button class="cat-remove-btn" data-restore-cat="${cat.key}" title="Show this goal category again">Restore</button>`
      : `<button class="cat-remove-btn" data-remove-cat="${cat.key}" data-custom="${custom}" title="${custom ? 'Delete this goal category' : 'Hide this goal category'}">${custom ? 'Remove' : 'Hide'}</button>`;
    card.innerHTML = `
      <div class="goal-card-header">
        <p class="goal-cat-label">${cat.label}</p>
        ${removeControl}
      </div>
      <div class="goal-items" id="goal-items-${cat.key}">
        ${activeItems.length ? activeItems.map((it) => renderItemBlock(cat, it)).join('') : '<p class="goal-text empty">No active goals.</p>'}
      </div>
      ${doneItems.length ? `<details class="achieved-details"><summary>Achieved (${doneItems.length})</summary>${doneItems.map((it) => renderAchievedBlock(cat, it)).join('')}</details>` : ''}
      <div class="goal-card-links">
        <button class="add-item-link" data-add-item-cat="${cat.key}" type="button">${activeItems.length ? '+ Add another goal' : '+ Add goal'}</button>
        <button class="add-item-link suggest-link" data-suggest-cat="${cat.key}" type="button">✨ Suggest a goal</button>
      </div>
      <div class="suggest-panel" id="suggest-panel-${cat.key}" style="${goalSuggestionsCache[cat.key] ? '' : 'display:none;'}">${suggestPanelHtml(cat.key)}</div>
      <div class="goal-edit-box" id="goal-new-${cat.key}" style="display:none;">
        <textarea rows="3" id="goal-new-input-${cat.key}" placeholder="What's the goal here?"></textarea>
        ${cat.key === 'exit_succession' ? `
          <div class="form-field" style="margin-top:6px;"><label>Target exit year (optional)</label><input type="number" id="goal-new-target-year-${cat.key}" placeholder="e.g. ${new Date().getFullYear() + 5}" /></div>
          <div class="form-field" style="margin-top:6px;"><label>Succession pathway (optional)</label>
            <select id="goal-new-pathway-${cat.key}">${SUCCESSION_PATHWAYS.map((p) => `<option value="${p.value}">${p.label}</option>`).join('')}</select>
          </div>
          <div class="form-field" style="margin-top:6px;"><label>Successor readiness (optional)</label>
            <select id="goal-new-readiness-${cat.key}">${SUCCESSION_READINESS.map((r) => `<option value="${r.value}">${r.label}</option>`).join('')}</select>
          </div>
        ` : ''}
        <button class="action" style="margin-top:6px;" data-save-new="${cat.key}">Save goal</button>
      </div>
    `;
    return card;
  }

  categories.forEach((cat) => cardsEl.appendChild(renderCategoryCard(cat, false)));

  // "+ Add another goal category" tile at the end of the grid
  const addCard = document.createElement('div');
  addCard.className = 'card goal-card add-goal-card';
  addCard.id = 'add-goal-card';
  addCard.innerHTML = `
    <p class="muted plain add-goal-prompt" id="add-goal-prompt" style="margin:0;">+ Add another goal category</p>
    <div id="add-goal-form" style="display:none; margin-top:10px;">
      <input type="text" id="add-goal-label" placeholder="e.g. Property, Health, Team culture" />
      <button class="action" id="add-goal-confirm" style="margin-top:8px;">Add</button>
    </div>
  `;
  cardsEl.appendChild(addCard);

  if (hiddenBuiltIns.length && showHiddenGoalCategories) {
    const hiddenEl = document.getElementById('hidden-goal-cards');
    hiddenEl.className = 'goal-cards-grid';
    hiddenBuiltIns.forEach((cat) => hiddenEl.appendChild(renderCategoryCard(cat, true)));
  }
  const showHiddenBtn = document.getElementById('show-hidden-btn');
  if (showHiddenBtn) showHiddenBtn.onclick = () => { showHiddenGoalCategories = !showHiddenGoalCategories; renderGoalsInput(content); };

  document.getElementById('add-goal-prompt').onclick = () => {
    document.getElementById('add-goal-prompt').style.display = 'none';
    document.getElementById('add-goal-form').style.display = 'block';
    document.getElementById('add-goal-label').focus();
  };
  document.getElementById('add-goal-confirm').onclick = async () => {
    const label = document.getElementById('add-goal-label').value.trim();
    if (!label) return;
    const res = await fetch('/.netlify/functions/manual-entry', {
      method: 'POST',
      body: JSON.stringify({ type: 'goal_category', client_id: currentClientId, label }),
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    renderGoalsInput(content);
  };

  async function handleGoalCardClick(e) {
    const removeCatBtn = e.target.closest('button[data-remove-cat]');
    if (removeCatBtn) {
      const isCustom = removeCatBtn.dataset.custom === 'true';
      const label = removeCatBtn.closest('.goal-card').querySelector('.goal-cat-label').textContent;
      const msg = isCustom ? `Remove the "${label}" goal category? This deletes any goals recorded under it.` : `Hide the "${label}" goal category? You can bring it back later.`;
      if (!confirm(msg)) return;
      await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'delete_goal_category', client_id: currentClientId, key: removeCatBtn.dataset.removeCat }),
      });
      renderGoalsInput(content);
      return;
    }

    const restoreCatBtn = e.target.closest('button[data-restore-cat]');
    if (restoreCatBtn) {
      await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'restore_goal_category', client_id: currentClientId, key: restoreCatBtn.dataset.restoreCat }),
      });
      renderGoalsInput(content);
      return;
    }

    const removeItemBtn = e.target.closest('button[data-remove-item]');
    if (removeItemBtn) {
      const catKey = removeItemBtn.dataset.cat;
      const id = removeItemBtn.dataset.id;
      if (!confirm('Delete this goal?')) return;
      // A carried (not-yet-in-this-period) item needs a tombstone so it doesn't
      // keep resurfacing as "carried forward" on future periods; an item that
      // already belongs to this period can just be dropped outright.
      const block = removeItemBtn.closest('.goal-item-block');
      const carried = block?.dataset.carried === 'true';
      if (carried) {
        await upsertGoalItem(catKey, { id, deleted: true });
      } else {
        const current = (goals.periods?.[currentPeriodEnd]?.cats?.[catKey]?.items || []).filter((it) => it.id !== id);
        await saveGoalItems(catKey, current);
      }
      renderGoalsInput(content);
      return;
    }

    const addItemBtn = e.target.closest('button[data-add-item-cat]');
    if (addItemBtn) {
      const cat = addItemBtn.dataset.addItemCat;
      addItemBtn.style.display = 'none';
      const box = document.getElementById(`goal-new-${cat}`);
      box.style.display = 'block';
      document.getElementById(`goal-new-input-${cat}`).focus();
      return;
    }

    const suggestBtn = e.target.closest('button[data-suggest-cat]');
    if (suggestBtn) {
      const catKey = suggestBtn.dataset.suggestCat;
      const cat = categories.find((c) => c.key === catKey) || (goals.custom_categories || []).find((c) => c.key === catKey);
      const panel = document.getElementById(`suggest-panel-${catKey}`);
      panel.style.display = 'block';
      panel.innerHTML = '<p class="muted plain" style="margin:0;">Thinking…</p>';
      suggestBtn.disabled = true;
      try {
        const res = await fetch('/.netlify/functions/suggest-goal', {
          method: 'POST',
          body: JSON.stringify({ client_id: currentClientId, period_end: currentPeriodEnd, category: catKey, category_label: cat?.label }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        if (!data.suggestions?.length) {
          delete goalSuggestionsCache[catKey];
          panel.innerHTML = '<p class="muted plain" style="margin:0;">No suggestions came back — try again, or add one manually.</p>';
        } else {
          goalSuggestionsCache[catKey] = { suggestions: data.suggestions, usedIdxs: [] };
          panel.innerHTML = suggestPanelHtml(catKey);
        }
      } catch (err) {
        panel.innerHTML = `<p class="muted plain" style="margin:0;">Error: ${err.message}</p>`;
      } finally {
        suggestBtn.disabled = false;
      }
      return;
    }

    const useSuggestionBtn = e.target.closest('button[data-use-suggestion]');
    if (useSuggestionBtn) {
      const catKey = useSuggestionBtn.dataset.useSuggestion;
      const idx = Number(useSuggestionBtn.dataset.suggestIdx);
      const cache = goalSuggestionsCache[catKey];
      const text = cache?.suggestions[idx] || '';
      document.getElementById(`goal-new-${catKey}`).style.display = 'block';
      document.getElementById(`goal-new-input-${catKey}`).value = text;
      const addLink = cardsEl.querySelector(`button[data-add-item-cat="${catKey}"]`) || hiddenCardsEl?.querySelector(`button[data-add-item-cat="${catKey}"]`);
      if (addLink) addLink.style.display = 'none';
      // Mark used but keep the panel open — the other suggestions are still there
      // to use, no need to regenerate just to reach the second or third one.
      if (cache && !cache.usedIdxs.includes(idx)) cache.usedIdxs.push(idx);
      document.getElementById(`suggest-panel-${catKey}`).innerHTML = suggestPanelHtml(catKey);
      document.getElementById(`goal-new-input-${catKey}`).focus();
      return;
    }

    const dismissSuggestBtn = e.target.closest('button[data-dismiss-suggestions]');
    if (dismissSuggestBtn) {
      const catKey = dismissSuggestBtn.dataset.dismissSuggestions;
      delete goalSuggestionsCache[catKey];
      document.getElementById(`suggest-panel-${catKey}`).style.display = 'none';
      return;
    }

    const saveNewBtn = e.target.closest('button[data-save-new]');
    if (saveNewBtn) {
      const catKey = saveNewBtn.dataset.saveNew;
      const text = document.getElementById(`goal-new-input-${catKey}`).value.trim();
      if (!text) return;
      const now = new Date().toISOString();
      const newTargetYearInput = document.getElementById(`goal-new-target-year-${catKey}`);
      const target_year = newTargetYearInput?.value ? Number(newTargetYearInput.value) : undefined;
      const newPathwayInput = document.getElementById(`goal-new-pathway-${catKey}`);
      const succession_pathway = newPathwayInput?.value || undefined;
      const newReadinessInput = document.getElementById(`goal-new-readiness-${catKey}`);
      const successor_readiness = newReadinessInput?.value || undefined;
      await upsertGoalItem(catKey, { id: uid(), text, created_at: now, updated_at: now, done: false, target_year, succession_pathway, successor_readiness });
      renderGoalsInput(content);
      return;
    }

    const toggleBtn = e.target.closest('button[data-action]');
    if (toggleBtn) {
      const catKey = toggleBtn.dataset.cat;
      const id = toggleBtn.dataset.id;
      const action = toggleBtn.dataset.action;
      const block = toggleBtn.closest('.goal-item-block');
      const source = resolveGoalList(goals, currentPeriodEnd, catKey).find((it) => it.id === id) || {};

      if (action === 'changed') {
        document.getElementById(`goal-toggle-${id}`).style.display = 'none';
        document.getElementById(`goal-edit-${id}`).style.display = 'block';
        document.getElementById(`goal-input-${id}`).focus();
        return;
      }

      if (action === 'done') {
        await upsertGoalItem(catKey, { ...source, carried: undefined, done: true, updated_at: new Date().toISOString() });
        renderGoalsInput(content);
        return;
      }

      if (action === 'reopen') {
        await upsertGoalItem(catKey, { ...source, carried: undefined, done: false, updated_at: new Date().toISOString() });
        renderGoalsInput(content);
        return;
      }

      // "Still true" — confirms into the current period (whether it already lived
      // here or is being carried forward for the first time), same text, fresh date.
      const originalLabel = toggleBtn.textContent;
      toggleBtn.disabled = true;
      try {
        const now = new Date().toISOString();
        await upsertGoalItem(catKey, { ...source, carried: undefined, updated_at: now });
        const updatedBadge = document.getElementById(`goal-updated-${id}`);
        updatedBadge.textContent = 'Confirmed ' + now.slice(0, 10);
        updatedBadge.classList.add('just-updated');
        setTimeout(() => updatedBadge.classList.remove('just-updated'), 900);
        if (block) { block.classList.remove('state-carried'); block.classList.add('state-confirmed'); }
        const carryPrompt = block?.querySelector('.carry-prompt');
        if (carryPrompt) carryPrompt.remove();
        toggleBtn.textContent = '✓ Confirmed!';
        toggleBtn.classList.add('just-confirmed');
        setTimeout(() => { toggleBtn.textContent = originalLabel; toggleBtn.classList.remove('just-confirmed'); }, 2000);
      } finally {
        toggleBtn.disabled = false;
      }
      return;
    }

    const saveBtn = e.target.closest('button[data-save]');
    if (saveBtn) {
      const catKey = saveBtn.dataset.cat;
      const id = saveBtn.dataset.id;
      const newText = document.getElementById(`goal-input-${id}`).value;
      const source = resolveGoalList(goals, currentPeriodEnd, catKey).find((it) => it.id === id) || {};
      const now = new Date().toISOString();
      const targetYearInput = document.getElementById(`goal-target-year-${id}`);
      const target_year = targetYearInput?.value ? Number(targetYearInput.value) : undefined;
      const pathwayInput = document.getElementById(`goal-pathway-${id}`);
      const succession_pathway = pathwayInput?.value || undefined;
      const readinessInput = document.getElementById(`goal-readiness-${id}`);
      const successor_readiness = readinessInput?.value || undefined;
      try {
        // A materially different goal resets its "open since" clock.
        await upsertGoalItem(catKey, { ...source, carried: undefined, text: newText, created_at: now, updated_at: now, target_year, succession_pathway, successor_readiness });
        renderGoalsInput(content);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  }

  cardsEl.addEventListener('click', handleGoalCardClick);
  const hiddenCardsEl = document.getElementById('hidden-goal-cards');
  if (hiddenCardsEl) hiddenCardsEl.addEventListener('click', handleGoalCardClick);

  // ---- Check-in questions ----
  const questionsEl = document.getElementById('pulse-questions');
  questions.forEach((q) => {
    const div = document.createElement('div');
    div.className = 'form-field full';
    div.innerHTML = `
      <label id="pulse-label-${q.id}">${q.prompt}
        <button class="question-edit-btn" data-edit-q="${q.id}" title="Edit this question">edit</button>
        ${isCustomQuestion(q.id) ? `<button class="question-remove-btn" data-remove-q="${q.id}" title="Remove this question">×</button>` : ''}
      </label>
      <div id="pulse-edit-${q.id}" style="display:none; margin-bottom:6px;">
        <input type="text" id="pulse-edit-input-${q.id}" value="${q.prompt}" />
        <button class="action" style="margin-top:6px;" data-save-q="${q.id}">Save wording</button>
      </div>
      <textarea id="pulse-${q.id}" rows="2"></textarea>
    `;
    questionsEl.appendChild(div);
  });

  questionsEl.addEventListener('click', async (e) => {
    const removeBtn = e.target.closest('button[data-remove-q]');
    if (removeBtn) {
      await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'delete_goal_question', client_id: currentClientId, id: removeBtn.dataset.removeQ }),
      });
      renderGoalsInput(content);
      return;
    }
    const editBtn = e.target.closest('button[data-edit-q]');
    if (editBtn) {
      document.getElementById(`pulse-edit-${editBtn.dataset.editQ}`).style.display = 'block';
      document.getElementById(`pulse-edit-input-${editBtn.dataset.editQ}`).focus();
      return;
    }
    const saveQBtn = e.target.closest('button[data-save-q]');
    if (saveQBtn) {
      const id = saveQBtn.dataset.saveQ;
      const prompt = document.getElementById(`pulse-edit-input-${id}`).value.trim();
      if (!prompt) return;
      await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'edit_goal_question', client_id: currentClientId, id, prompt }),
      });
      renderGoalsInput(content);
    }
  });

  document.getElementById('add-question-btn').onclick = () => {
    document.getElementById('add-question-btn').style.display = 'none';
    document.getElementById('add-question-form').style.display = 'block';
    document.getElementById('add-question-input').focus();
  };
  document.getElementById('add-question-confirm').onclick = async () => {
    const prompt = document.getElementById('add-question-input').value.trim();
    if (!prompt) return;
    const res = await fetch('/.netlify/functions/manual-entry', {
      method: 'POST',
      body: JSON.stringify({ type: 'goal_question', client_id: currentClientId, prompt }),
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    renderGoalsInput(content);
  };

  // ---- Last check-in ----
  // Its own function so a save can refresh just this section — a full
  // renderGoalsInput(content) call here would wipe the "Saved" message before
  // it's even visible, since it rebuilds the whole tab from scratch.
  function renderPulseHistory() {
    const titleEl = document.getElementById('pulse-history-title');
    const cardEl = document.getElementById('pulse-history-card');
    const entry = findMostRecentPulse(goals, currentPeriodEnd);
    if (!entry) { titleEl.style.display = 'none'; cardEl.style.display = 'none'; return; }
    titleEl.style.display = '';
    cardEl.style.display = '';
    const answerLines = Object.keys(entry).filter((k) => k !== 'date' && k !== 'periodEnd' && entry[k])
      .map((k) => `<p style="font-size:13px; margin:3px 0;"><span class="muted plain" style="display:inline;">${questionPromptById[k] || k}:</span> ${entry[k]}</p>`)
      .join('');
    const label = entry.periodEnd === currentPeriodEnd ? `This period (${entry.periodEnd})` : `From ${entry.periodEnd}`;
    cardEl.innerHTML = `<span class="goal-updated" style="margin-bottom:4px; display:inline-block;">${label}</span>${answerLines || '<p class="muted plain" style="margin:0;">No answers recorded.</p>'}`;
  }
  renderPulseHistory();

  const pulseSaveBtn = document.getElementById('pulse-save-btn');
  pulseSaveBtn.onclick = async () => {
    // Guard against a fast double-click: the first click's async save would
    // otherwise still be clearing the fields when a second click reads them —
    // reading empty values and overwriting the real answer with blanks.
    if (pulseSaveBtn.disabled) return;
    pulseSaveBtn.disabled = true;
    const msg = document.getElementById('pulse-save-msg');
    msg.textContent = 'Saving…';
    msg.className = 'save-msg';
    const answers = {};
    questions.forEach((q) => { answers[q.id] = document.getElementById(`pulse-${q.id}`).value; });
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'pulse', client_id: currentClientId, period_end: currentPeriodEnd, answers }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      msg.textContent = '✓ Saved — see "Last check-in" below.';
      msg.className = 'save-msg ok';
      questions.forEach((q) => { document.getElementById(`pulse-${q.id}`).value = ''; });
      goals.periods = goals.periods || {};
      goals.periods[currentPeriodEnd] = { ...(goals.periods[currentPeriodEnd] || {}), pulse: data.saved };
      renderPulseHistory();
    } catch (err) {
      msg.textContent = 'Error: ' + err.message;
      msg.className = 'save-msg err';
    } finally {
      pulseSaveBtn.disabled = false;
    }
  };

  renderOpenActionsCard();
}

// ---- Meeting Mode (global, cross-domain) ----
function meetingKey() { return `oag_meeting_${currentClientId}_${currentPeriodEnd}`; }
function loadMeeting() { try { return JSON.parse(localStorage.getItem(meetingKey())); } catch { return null; } }
function saveMeeting(brief) { localStorage.setItem(meetingKey(), JSON.stringify(brief)); }
function clearMeeting() { localStorage.removeItem(meetingKey()); }

// A risk_items row, reshaped into the same {pillar, message, severity}
// shape flags already have, so scoreFlag() and the rest of Meeting Mode
// can treat both as one candidate pool without knowing the difference.
// 'risk' (not a specific pillar) for business/industry — there's no
// finer-grained pillar those sources map to; owner_wealth already has a
// real pillar of its own.
// Owner & Succession risk_items don't carry their own .recommendation
// column (unlike business/industry — see below), but for estate and exit
// readiness gaps specifically, the exact same "why/what to do" copy
// already written for their own cards (OWNER_ESTATE_CHECKLIST_ITEMS,
// OWNER_EXIT_READINESS_ITEMS) is a free match by risk_name — no new
// writing, just reuse. Succession readiness/pathway rows have no matching
// entry here, but their own .detail message is already a concrete
// instruction (e.g. "no valuation ever saved"), so there's nothing lost.
function ownerWealthTalkingPoint(riskName) {
  const estateItem = OWNER_ESTATE_CHECKLIST_ITEMS.find((it) => it.label === riskName);
  if (estateItem) return estateItem.why;
  const exitItem = OWNER_EXIT_READINESS_ITEMS.find((it) => it.label === riskName);
  if (exitItem) return exitItem.why;
  return null;
}

// talkingPoint answers "how do I actually raise this with the client" —
// distinct from message, which is written for the accountant's own
// screen. business/industry risk_items already carry a real
// .recommendation (AI-generated at answer/detection time, see
// business-risk-questionnaire.js and industry-risk-checklist.js); plain
// financial flags carry neither, so their priorities just show the raw
// message — acceptable since those numbers are already sitting in full
// context on the KPI cards moments before the meeting.
function normalizeRiskItemToFlagShape(r) {
  return {
    pillar: r.source === 'owner_wealth' ? 'owner_wealth' : 'risk',
    source: r.source,
    message: r.detail ? `${r.risk_name}: ${r.detail}` : r.risk_name,
    severity: r.severity,
    talkingPoint: r.source === 'owner_wealth' ? ownerWealthTalkingPoint(r.risk_name) : (r.recommendation || null),
  };
}

// Financial flags (the `flags` table) plus every other ACTIVE risk_items
// source — business, industry, owner_wealth — so a meeting priority can
// come from any of them, not just financial ratios. financial is
// deliberately excluded from the risk_items side: its risk_items rows are
// just a mirror of `flags` itself (see syncFinancialRiskItems), so pulling
// both would double-count the same issue twice in the candidate pool.
async function buildMeetingCandidates() {
  const [overview, riskData] = await Promise.all([
    callRead('get_overview', currentClientId, currentPeriodEnd),
    callRead('get_risk_items', currentClientId, currentPeriodEnd),
  ]);
  const flags = overview?.flags || [];
  const businessLatest = dedupeBusinessToLatestPerCategory(riskData?.business || []);
  const riskCandidates = [...businessLatest, ...(riskData?.industry || []), ...(riskData?.owner_wealth || [])]
    .filter((r) => RISK_ACTIVE_STATUSES.has(r.status))
    .map(normalizeRiskItemToFlagShape);
  return [...flags, ...riskCandidates];
}

async function renderMeetingTab(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot and run analysis before building a meeting.</p></div>`;
    return;
  }
  const existing = loadMeeting();
  if (existing && existing.priorities?.length) return renderMeetingSession(content, existing);

  // Accountability check before scoring anything new — what got agreed
  // last time that's still sitting open. Fetched fresh every time this
  // screen renders (not cached with the meeting brief), so it always
  // reflects whatever's actually still outstanding in Actions, including
  // items added outside a meeting entirely (Exit Readiness, Continuity,
  // the estate checklist).
  const actionsData = await callRead('get_action_items', currentClientId);
  if (myToken !== renderToken) return;
  const outstanding = (actionsData?.items || [])
    .filter((it) => it.status !== 'done')
    .sort((a, b) => (a.due_date || '9999-99-99').localeCompare(b.due_date || '9999-99-99'));

  content.innerHTML = `
    ${outstanding.length ? `
      <div class="card">
        <p class="muted">Outstanding actions</p>
        <p class="muted plain" style="margin:0 0 10px;">Still open from before — worth checking on before raising anything new.</p>
        ${outstanding.map((it) => {
          const overdue = isActionOverdue(it);
          return `<p class="muted plain" style="margin:0 0 6px; ${overdue ? 'color:var(--rust);' : ''}">${overdue ? '⚠' : '○'} ${escAttr(it.text)}${it.due_date ? ` <span style="color:${overdue ? 'var(--rust)' : 'var(--ink-soft)'}; font-size:11px;">(due ${formatShortDate(it.due_date)}${overdue ? ' — overdue' : ''})</span>` : ''}</p>`;
        }).join('')}
        <button class="mini-link" id="goto-actions-from-meeting-prep-link" type="button" style="margin-top:6px;">→ View in Actions</button>
      </div>
    ` : ''}
    <div class="card">
      <p class="muted">Meeting mode — ${formatShortDate(currentPeriodEnd)}</p>
      <p class="muted plain" style="margin:0 0 14px;">Build Meeting scores every flagged issue this period by Impact × Urgency × Ease and locks the top 3 into a brief to walk through with the client. Numbers won't move once locked, even if you re-run analysis afterward.</p>
      <button class="action" id="build-meeting-btn">Build Meeting</button>
      <div id="build-meeting-msg" style="margin-top:10px;"></div>
    </div>
  `;
  const gotoActionsFromMeetingPrepLink = document.getElementById('goto-actions-from-meeting-prep-link');
  if (gotoActionsFromMeetingPrepLink) {
    gotoActionsFromMeetingPrepLink.onclick = async () => {
      currentDomain = 'actions';
      currentWorkflow = 'input';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
    };
  }
  document.getElementById('build-meeting-btn').onclick = async () => {
    const msg = document.getElementById('build-meeting-msg');
    msg.textContent = 'Scoring flags…';
    const candidates = await buildMeetingCandidates();
    if (!candidates.length) {
      msg.innerHTML = `<div class="flag">No flags for this period — run analysis on Financial Performance → Analyse first.</div>`;
      return;
    }
    const scored = candidates
      .map((f) => ({ ...f, ...scoreFlag(f) }))
      .sort((a, b) => b.priorityScore - a.priorityScore)
      .slice(0, 3);
    const brief = {
      client_id: currentClientId, period_end: currentPeriodEnd, created_at: new Date().toISOString(),
      priorities: scored.map((f) => ({
        pillar: f.pillar, message: f.message, severity: f.severity,
        impact: f.impact, urgency: f.urgency, ease: f.ease, priorityScore: f.priorityScore,
        talkingPoint: f.talkingPoint || null,
        decision: '', action: '',
      })),
      currentIndex: 0, completed: false,
    };
    saveMeeting(brief);
    renderMeetingSession(content, brief);
  };
}

function renderMeetingSession(content, brief) {
  if (brief.completed) {
    content.innerHTML = `
      <div class="card">
        <p class="muted">Meeting complete — ${brief.period_end}</p>
        <p class="muted plain" style="margin:0 0 6px;">This meeting's priorities and decisions were recorded. See the Report tab for the summary.</p>
        <p class="muted plain" style="margin:0 0 12px;">${brief.actionsPushedCount ? `${brief.actionsPushedCount} action${brief.actionsPushedCount === 1 ? '' : 's'} sent to Actions.` : 'No action text was recorded, so nothing was sent to Actions.'}</p>
        <button class="mini-link" id="goto-actions-from-meeting-link" type="button" style="margin-bottom:10px;">→ View in Actions</button><br>
        <button class="action secondary" id="restart-meeting-btn">Start a new meeting for this period</button>
      </div>
    `;
    document.getElementById('restart-meeting-btn').onclick = () => {
      clearMeeting();
      renderMeetingTab(content);
    };
    const gotoActionsFromMeetingLink = document.getElementById('goto-actions-from-meeting-link');
    if (gotoActionsFromMeetingLink) {
      gotoActionsFromMeetingLink.onclick = async () => {
        currentDomain = 'actions';
        currentWorkflow = 'input';
        renderWorkflowTabsActive();
        renderSidebarDomains();
        await renderMain();
      };
    }
    return;
  }

  const idx = brief.currentIndex;
  const p = brief.priorities[idx];
  const meta = PILLAR_META[p.pillar] || { name: p.pillar, color: '#999' };
  const isLast = idx === brief.priorities.length - 1;

  content.innerHTML = `
    <div class="card priority-card">
      <p class="muted">Priority ${idx + 1} of ${brief.priorities.length}</p>
      <p class="card-value" style="margin-bottom:6px;">${meta.name}</p>
      <p style="font-size:14px; margin:0 0 10px;">${p.message}</p>
      ${p.talkingPoint ? `<p style="font-size:13px; margin:0 0 10px; padding:8px 10px; background:var(--sage-bg); border-radius:6px;">💬 ${p.talkingPoint}</p>` : ''}
      <p class="priority-meta">Impact ${p.impact} · Urgency ${p.urgency} · Ease ${p.ease} · Priority score ${p.priorityScore}</p>
      <div class="form-field full" style="margin-top:14px;"><label>Decision</label><textarea id="mtg-decision" rows="2" placeholder="What did you agree with the client?">${p.decision || ''}</textarea></div>
      <div class="form-field full"><label>Action</label><textarea id="mtg-action" rows="2" placeholder="What happens next, and who owns it?">${p.action || ''}</textarea></div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="action" id="mtg-next-btn">${isLast ? 'Finish meeting' : 'Next priority'}</button>
        <button class="action secondary" id="mtg-detail-btn">Show detail</button>
      </div>
    </div>
  `;

  const captureInputs = () => {
    p.decision = document.getElementById('mtg-decision').value;
    p.action = document.getElementById('mtg-action').value;
  };

  document.getElementById('mtg-next-btn').onclick = async () => {
    captureInputs();
    if (isLast) {
      // The actual "end of the meeting" moment — whatever action text was
      // recorded per priority gets pushed into Actions here, so it's a
      // tracked to-do afterward instead of only ever living in this
      // meeting's own (localStorage-only, un-persisted) record.
      const pushable = brief.priorities.filter((pr) => pr.action && pr.action.trim());
      for (const pr of pushable) {
        try {
          await addActionItem(pr.action.trim(), 'meeting', meetingPriorityToActionPriority(pr.severity), pr.decision?.trim() || null);
        } catch (err) {
          console.error('Failed to push meeting action to Actions:', err.message);
        }
      }
      brief.completed = true;
      brief.actionsPushedCount = pushable.length;
      saveMeeting(brief);
      currentWorkflow = 'report';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      renderMain();
      return;
    }
    brief.currentIndex += 1;
    saveMeeting(brief);
    renderMeetingSession(content, brief);
  };

  document.getElementById('mtg-detail-btn').onclick = () => {
    captureInputs();
    saveMeeting(brief);
    currentDomain = PILLAR_TO_DOMAIN[p.pillar] || 'financial';
    currentWorkflow = 'analyse';
    renderWorkflowTabsActive();
    renderSidebarDomains();
    renderMain();
  };
}

// ---- Report (global — meeting-derived, falls back to legacy health/recommendations) ----
async function renderReportTab(content) {
  const myToken = renderToken;
  const brief = currentPeriodEnd ? loadMeeting() : null;
  if (brief && brief.priorities?.length) {
    content.innerHTML = `
      <div class="card">
        <p class="muted">Meeting report — ${brief.period_end}</p>
        <p class="muted plain" style="margin:0;">${brief.completed ? 'Completed' : 'In progress'} · Generated from this period's Meeting Mode session.</p>
        ${brief.completed ? `<p class="muted plain" style="margin:6px 0 0;">${brief.actionsPushedCount ? `${brief.actionsPushedCount} action${brief.actionsPushedCount === 1 ? '' : 's'} sent to Actions.` : 'No action text was recorded, so nothing was sent to Actions.'} <button class="mini-link" id="goto-actions-from-report-link" type="button">→ View in Actions</button></p>` : ''}
      </div>
      ${brief.priorities.map((p, i) => {
        const meta = PILLAR_META[p.pillar] || { name: p.pillar };
        return `<div class="card">
          <p class="card-label">Priority ${i + 1} — ${meta.name}</p>
          <p style="font-size:13px; margin:4px 0;">${p.message}</p>
          <p style="font-size:13px; margin:4px 0;"><b>Decision:</b> ${p.decision || '<span class="muted plain">Not recorded</span>'}</p>
          <p style="font-size:13px; margin:4px 0;"><b>Action:</b> ${p.action || '<span class="muted plain">Not recorded</span>'}</p>
        </div>`;
      }).join('')}
    `;
    const gotoActionsFromReportLink = document.getElementById('goto-actions-from-report-link');
    if (gotoActionsFromReportLink) {
      gotoActionsFromReportLink.onclick = async () => {
        currentDomain = 'actions';
        currentWorkflow = 'input';
        renderWorkflowTabsActive();
        renderSidebarDomains();
        await renderMain();
      };
    }
    return;
  }

  const data = await callRead('get_report_data', currentClientId);
  if (myToken !== renderToken) return;
  const hs = data?.healthScore;
  const recs = data?.recommendations;
  content.innerHTML = `
    <div class="card">
      <p class="muted">Business action plan — draft</p>
      <p>Health score: ${hs?.score ?? '—'}/100</p>
      ${(recs || []).length
        ? recs.map((r, i) => `<p>${i + 1}. ${r.title} — <span class="muted plain">${r.timeframe || ''}</span></p>`).join('')
        : '<p class="muted plain" style="margin:0;">No meeting recorded yet for this period, and no recommendations on file. Run analysis or build a meeting first.</p>'}
    </div>
  `;
}

loadClients();
</script>
