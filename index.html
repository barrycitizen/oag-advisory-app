}

async function renderPdfReview(container, data) {
  const notFoundHtml = data.not_found?.length
    ? `<div class="flag">Not found in PDF: ${data.not_found.join(', ')} — left as 0, fill in manually if known.</div>` : '';
  const notesHtml = data.notes ? `<div class="flag">Note: ${data.notes}</div>` : '';
  const comp = data.comparative;
  // Claude may only give a rough label ("prior year") rather than an exact
  // date — only pre-select it in the picker if it actually looks like one of
  // the valid cadence-derived dates; otherwise fall back to the picker's own
  // default rather than silently drop an unparseable guess into the field.
  const compDateLooksValid = comp?.period_end && /^\d{4}-\d{2}-\d{2}$/.test(comp.period_end);
  const initialCompDate = compDateLooksValid ? comp.period_end : null;

  // Fetched fresh (not the possibly-stale global) so a comparative column from
  // a LATER upload can't silently overwrite a period that already has fuller
  // data from its own direct upload — e.g. uploading FY22's statement (with an
  // abbreviated FY21 comparative column) shouldn't clobber FY21's own full
  // statement, already saved when FY21 was uploaded directly.
  const existingPeriods = comp ? (await callRead('list_periods', currentClientId) || []) : [];

  container.innerHTML = `
    ${notFoundHtml}${notesHtml}
    <p class="muted">Review extracted figures before saving</p>
    <div class="form-grid" id="pdf-review-fields"></div>
    <button class="action" id="pdf-confirm-save" style="margin-top:10px;">Confirm &amp; save</button>
    <div class="save-msg" id="pdf-save-msg"></div>
    ${comp ? `
      <div class="card" style="margin-top:16px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="pdf-comp-enable" />
          <span class="muted" style="margin:0;">Comparative period found in this PDF${compDateLooksValid ? '' : ` (labelled "${comp.period_end || 'unknown'}" — pick the actual date)`} — also save it?</span>
        </label>
        <p class="muted plain" id="pdf-comp-warning" style="margin:6px 0 0; color:var(--rust); display:none;"></p>
        <div id="pdf-comp-body" style="margin-top:12px; display:none;">
          <div class="form-field">
            <label>Comparative period end date</label>
            ${periodPickerHtml('pdfcomp-period-end', currentCtx.cadence, currentCtx.fy_end, initialCompDate)}
          </div>
          <div class="form-grid" id="pdf-comp-fields" style="margin-top:10px;"></div>
        </div>
      </div>
    ` : ''}
  `;
  const fieldsEl = document.getElementById('pdf-review-fields');
  FINANCIAL_FIELD_DEFS.forEach(([key, label]) => {
    const div = document.createElement('div');
    div.className = 'form-field';
    // Genuinely blank (not 0) when Claude didn't find it — a real $0 and "not
    // extracted" are different things, and defaulting to 0 here would hide that.
    const notFound = data.not_found?.includes(key);
    const val = data.extracted?.[key];
    const valAttr = (val === undefined || val === null) ? '' : `value="${val}"`;
    div.innerHTML = `<label>${label}${notFound ? ' <span class="muted plain" style="display:inline; color:var(--rust);">(not found)</span>' : ''}</label><input type="number" step="0.01" id="pdfrev-${key}" placeholder="${notFound ? 'not found — fill in if known' : ''}" ${valAttr} />`;
    fieldsEl.appendChild(div);
  });

  if (comp) {
    const compFieldsEl = document.getElementById('pdf-comp-fields');
    FINANCIAL_FIELD_DEFS.forEach(([key, label]) => {
      const div = document.createElement('div');
      div.className = 'form-field';
      const notFound = comp.not_found?.includes(key);
      const val = comp.extracted?.[key];
      const valAttr = (val === undefined || val === null) ? '' : `value="${val}"`;
      div.innerHTML = `<label>${label}${notFound ? ' <span class="muted plain" style="display:inline; color:var(--rust);">(not found)</span>' : ''}</label><input type="number" step="0.01" id="pdfcomp-${key}" placeholder="${notFound ? 'not found — fill in if known' : ''}" ${valAttr} />`;
      compFieldsEl.appendChild(div);
    });

    const compEnable = document.getElementById('pdf-comp-enable');
    const compWarning = document.getElementById('pdf-comp-warning');
    // Defaults to UNCHECKED (and warns) whenever the selected comparative date
    // already has saved data — "don't put the data in again" is the safe
    // default; saving over it is still one click away if that's genuinely wanted.
    const updateForDate = (dateVal) => {
      const alreadyExists = existingPeriods.includes(dateVal);
      compWarning.style.display = alreadyExists ? 'block' : 'none';
      compWarning.textContent = alreadyExists ? `${formatShortDate(dateVal)} already has saved data — leave unchecked to keep it as-is, or check to overwrite with this PDF's comparative figures.` : '';
      compEnable.checked = !alreadyExists;
      document.getElementById('pdf-comp-body').style.display = compEnable.checked ? 'block' : 'none';
    };
    updateForDate(initialCompDate || document.getElementById('pdfcomp-period-end').value);

    wirePeriodPicker('pdfcomp-period-end', currentCtx.cadence, currentCtx.fy_end, updateForDate);
    compEnable.onchange = (e) => {
      document.getElementById('pdf-comp-body').style.display = e.target.checked ? 'block' : 'none';
    };
  }

  document.getElementById('pdf-confirm-save').onclick = async () => {
    const msg = document.getElementById('pdf-save-msg');
    msg.textContent = 'Saving…';
    msg.className = 'save-msg';
    const body = { type: 'financials', client_id: data.client_id, period_end: data.period_end };
    FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = document.getElementById(`pdfrev-${key}`).value; });

    const saveComp = comp && document.getElementById('pdf-comp-enable')?.checked;
    const compBody = saveComp ? { type: 'financials', client_id: data.client_id, period_end: document.getElementById('pdfcomp-period-end').value } : null;
    if (saveComp) FINANCIAL_FIELD_DEFS.forEach(([key]) => { compBody[key] = document.getElementById(`pdfcomp-${key}`).value; });

    try {
      const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
      const saved = await res.json();
      if (saved.error) throw new Error(saved.error);
      if (compBody) {
        const compRes = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(compBody) });
        const compSaved = await compRes.json();
        if (compSaved.error) throw new Error('Main period saved, but comparative failed: ' + compSaved.error);
      }
      msg.textContent = compBody ? 'Saved both periods.' : 'Saved.';
      msg.className = 'save-msg ok';
      await loadPeriods(body.period_end);
      refreshHealthBadge();
      renderSidebarDomains();
      // Same fix as Manual Entry's save handler — loadPeriods refreshes the
      // top-bar dropdown, but this screen (still showing "review extracted
      // figures") doesn't reflect the save at all otherwise. Back to a
      // fresh upload screen, which now picks up the just-saved period via
      // the refreshed availablePeriods/currentPeriodEnd.
      await renderPdfUpload(document.getElementById('tab-content'));
      refreshUnsavedPeriodBanner();
      return;
    } catch (err) {
      msg.textContent = 'Error: ' + err.message;
      msg.className = 'save-msg err';
    }
  };
}

// ---- Financial Performance: Analyse (health wheel + flags + pillar table) ----
function polar(cx, cy, r, angle) {
  return [cx + r * Math.cos(angle - Math.PI / 2), cy + r * Math.sin(angle - Math.PI / 2)];
}

function drawWheel(svg, pillars, centerScore) {
  svg.innerHTML = '';
  const cx = 120, cy = 120, rOuter = 100, rInner = 44;
  const n = pillars.length;
  const gap = 0.035;
  const anglePer = (2 * Math.PI) / n;

  pillars.forEach((p, i) => {
    const startAngle = i * anglePer + gap / 2;
    const endAngle = (i + 1) * anglePer - gap / 2;
    const rScore = rInner + (rOuter - rInner) * ((p.score || 0) / 10);
    const largeArc = endAngle - startAngle > Math.PI ? 1 : 0;

    const [gx1, gy1] = polar(cx, cy, rInner, startAngle);
    const [ox2, oy2] = polar(cx, cy, rOuter, startAngle);
    const [ox3, oy3] = polar(cx, cy, rOuter, endAngle);
    const [ox4, oy4] = polar(cx, cy, rInner, endAngle);
    const ghost = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    ghost.setAttribute('d', `M ${gx1} ${gy1} L ${ox2} ${oy2} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${ox3} ${oy3} L ${ox4} ${oy4} A ${rInner} ${rInner} 0 ${largeArc} 0 ${gx1} ${gy1} Z`);
    ghost.setAttribute('fill', '#DDD8C8');
    ghost.setAttribute('opacity', '0.35');
    svg.appendChild(ghost);

    const [x1, y1] = polar(cx, cy, rInner, startAngle);
    const [x2, y2] = polar(cx, cy, rScore, startAngle);
    const [x3, y3] = polar(cx, cy, rScore, endAngle);
    const [x4, y4] = polar(cx, cy, rInner, endAngle);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2} A ${rScore} ${rScore} 0 ${largeArc} 1 ${x3} ${y3} L ${x4} ${y4} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x1} ${y1} Z`);
    path.setAttribute('fill', p.color);
    svg.appendChild(path);
  });

  const centerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  centerText.setAttribute('x', cx);
  centerText.setAttribute('y', cy + 6);
  centerText.setAttribute('text-anchor', 'middle');
  centerText.setAttribute('font-family', 'Fraunces, serif');
  centerText.setAttribute('font-size', '26');
  centerText.setAttribute('fill', '#1E2A24');
  centerText.textContent = centerScore;
  svg.appendChild(centerText);
}

function trendArrow(current, prior) {
  if (current == null || prior == null) return '';
  const diff = current - prior;
  if (Math.abs(diff) < 0.05) return '<span class="trend-flat">— no change</span>';
  const up = diff > 0;
  return `<span class="${up ? 'trend-up' : 'trend-down'}">${up ? '↑' : '↓'} ${Math.abs(diff).toFixed(1)} vs last period</span>`;
}

function escAttr(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

// Jumps from a derived/calculated figure straight to the raw field it's
// built from, in the full Manual Entry form — "where does this number come
// from" answered by showing the actual source, not just a formula. Used
// throughout the cash reconciliation panel via data-jump-field/data-jump-period.
// periodEnd lets a "prior period" figure (e.g. last period's cash balance)
// jump there directly rather than being stuck on the currently-viewed period.
// jumpOrigin remembers where the jump started so the back banner can return
// there exactly — only set on the FIRST jump so a second jump (e.g. current
// period cash, then prior period total_debt) doesn't overwrite it and strand
// the original starting point.
let jumpOrigin = null;
async function jumpToManualEntry(fieldKey, periodEnd) {
  if (!jumpOrigin) jumpOrigin = { workflow: currentWorkflow, domain: currentDomain, periodEnd: currentPeriodEnd };
  currentWorkflow = 'input';
  currentEntrySubtab = 'manual';
  if (periodEnd) currentPeriodEnd = periodEnd;
  renderPeriodPills();
  renderWorkflowTabsActive();
  await renderMain();
  await new Promise((res) => setTimeout(res, 60));

  renderJumpBackButtons();

  const el = document.getElementById(`me-${fieldKey}`);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.focus();
  el.classList.add('field-highlight');
  setTimeout(() => el.classList.add('field-highlight-fade'), 50);
  setTimeout(() => el.classList.remove('field-highlight', 'field-highlight-fade'), 2000);
}
function jumpLink(fieldKey, periodEnd) { return `<button type="button" class="cash-jump-link" data-jump-field="${fieldKey}"${periodEnd ? ` data-jump-period="${periodEnd}"` : ''} title="Edit in Manual Entry">↗</button>`; }

// Places the back button both at the top (visible the moment you land) and
// at the bottom, next to Save (so you don't have to scroll back up after
// editing a field further down the form) — both wired to the same restore.
function renderJumpBackButtons() {
  document.getElementById('jump-back-banner')?.remove();
  document.getElementById('jump-back-banner-bottom')?.remove();
  if (!jumpOrigin) return;
  const label = `← Back to ${formatShortDate(jumpOrigin.periodEnd)}`;
  const content = document.getElementById('tab-content');
  if (content) {
    content.insertAdjacentHTML('afterbegin', `<div class="jump-back-banner" id="jump-back-banner"><button type="button" id="jump-back-btn">${label}</button></div>`);
    document.getElementById('jump-back-btn').onclick = backToJumpOrigin;
  }
  const bottomAnchor = document.getElementById('me-financials-msg');
  if (bottomAnchor) {
    bottomAnchor.insertAdjacentHTML('afterend', `<div class="jump-back-banner" id="jump-back-banner-bottom"><button type="button" id="jump-back-btn-bottom">${label}</button></div>`);
    document.getElementById('jump-back-btn-bottom').onclick = backToJumpOrigin;
  }
}

// Restores exactly where a jump started — workflow, domain, period — then
// scrolls to and re-opens the cash reconciliation panel, since "back" should
// land on the same page you left, not just the same tab with everything
// collapsed again.
async function backToJumpOrigin() {
  const origin = jumpOrigin;
  if (!origin) return;
  jumpOrigin = null;
  currentWorkflow = origin.workflow;
  currentDomain = origin.domain;
  currentPeriodEnd = origin.periodEnd;
  renderPeriodPills();
  renderSidebarDomains();
  renderWorkflowTabsActive();
  await renderMain();
  // The Analyse tab's KPI data loads via its own async fetch inside
  // renderHealthWheelBlock, which isn't guaranteed to have finished (and
  // wired up #recon-toggle) by the time renderMain()'s own promise resolves
  // — poll briefly rather than guessing a fixed delay.
  let toggle = null;
  for (let i = 0; i < 30 && !toggle; i++) {
    toggle = document.getElementById('recon-toggle');
    if (!toggle) await new Promise((res) => setTimeout(res, 100));
  }
  if (!toggle) return;
  const panel = document.getElementById('recon-panel');
  if (panel && panel.style.display === 'none') toggle.click();
  toggle.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Recomputed fresh from the persisted financial_snapshot every render (via
// get_kpi_report) rather than trusting anything analyze.js returned in the
// moment — that response was never stored, so the snapshot + kpi_library are
// the only things that reliably "stick." Interpretations DO persist (analyze.js
// writes them to diagnostics), so get_kpi_report reads those back too.
function formatKpi(value, format) {
  if (value == null || !isFinite(value)) return '—';
  if (format === 'percent') return (value * 100).toFixed(1) + '%';
  if (format === 'days') return value.toFixed(0) + 'd';
  if (format === 'ratio') return value.toFixed(2) + 'x';
  if (format === 'money') return formatMoney(value);
  return value.toFixed(2);
}

const CONFIDENCE_LABEL = { green: '🟢 Calculated', yellow: '🟡 Estimated', red: '🔴 Unavailable' };
const FIELD_LABEL = Object.fromEntries(FINANCIAL_FIELD_DEFS);

function formatMoney(value) {
  if (value == null || !isFinite(value)) return '—';
  return '$' + Math.round(value).toLocaleString('en-AU');
}

// Which raw snapshot fields a red (Unavailable) KPI is still missing, so the
// card can say what to add instead of just "not enough data."
function missingFieldsFor(kpi, snapshot) {
  const fields = [...(kpi.numerator || []), ...(kpi.denominator || [])];
  return [...new Set(fields.filter((f) => snapshot?.[f] == null))];
}

const KPI_CATEGORY_META = {
  profitability: 'Profitability & Growth',
  working_capital: 'Working Capital',
  balance_sheet: 'Balance Sheet',
  cash: 'Cash',
  tax: 'Tax',
};
const KPI_CATEGORY_ORDER = ['profitability', 'working_capital', 'balance_sheet', 'cash', 'tax'];

// Whether a HIGHER or LOWER value is generally the goal, for coloring a KPI's
// value green/rust against its target (once one is set) — deliberately a
// simple, presentation-only lookup rather than a kpi_library column, since
// direction isn't a universal fact for every metric in the abstract. But
// once someone has actually SET a target, coloring by the common-case
// direction is more useful than leaving it permanently neutral — so every
// KPI gets a default here, including the two genuinely judgment-call ones:
// creditor_days as 'higher' (extending supplier payment terms preserves the
// business's own cash — the standard cash-flow-advisory framing, even
// though very slow payment can strain supplier relationships) and
// effective_tax_rate as 'lower' (the near-universal intent behind setting a
// tax-rate target is minimising it, even though an unusually low rate can
// also flag a loss rather than good planning).
const KPI_DIRECTION = {
  revenue_growth: 'higher', gp_margin: 'higher', np_margin: 'higher', roe: 'higher',
  current_ratio: 'higher', op_cash_conversion: 'higher', creditor_days: 'higher',
  wages_pct: 'lower', debtor_days: 'lower', inventory_days: 'lower', debt_to_equity: 'lower', effective_tax_rate: 'lower',
};

function groupKpis(kpis) {
  const byCategory = {};
  kpis.forEach((k) => {
    const cat = k.category || 'other';
    (byCategory[cat] = byCategory[cat] || []).push(k);
  });
  const order = [...KPI_CATEGORY_ORDER, ...Object.keys(byCategory).filter((c) => !KPI_CATEGORY_ORDER.includes(c))];
  return order.filter((c) => byCategory[c]?.length).map((c) => ({ key: c, label: KPI_CATEGORY_META[c] || c, kpis: byCategory[c] }));
}

// Format-aware trend, unlike trendArrow (which assumes 0-10 pillar scores) —
// a 0.02 swing in a percent KPI (2 points) reads very differently to a 0.02 swing
// in a ratio KPI (2 hundredths), so the diff has to be scaled per KPI format.
function kpiTrendLine(kpi) {
  const { value, priorValue, format } = kpi;
  const diff = value - priorValue;
  const scaled = format === 'percent' ? diff * 100 : diff;
  if (Math.abs(scaled) < 0.05) return '<span class="trend-flat">— no change</span>';
  const up = diff > 0;
  const unit = format === 'percent' ? ' pts' : format === 'days' ? 'd' : 'x';
  return `<span class="${up ? 'trend-up' : 'trend-down'}">${up ? '↑' : '↓'} ${Math.abs(scaled).toFixed(1)}${unit} vs last period</span>`;
}

// Format-aware raw difference (e.g. current vs. target) — same unit handling as
// kpiTrendLine, but signed and without the up/down colour framing, since we
// can't assume which direction is "good" for every KPI (more debtor days is
// bad, more creditor days is often fine, effective tax rate has no universal
// direction) — so this states the number, not a verdict.
function formatDiff(diff, format) {
  if (format === 'money') return (diff >= 0 ? '+' : '−') + formatMoney(Math.abs(diff));
  const scaled = format === 'percent' ? diff * 100 : diff;
  const unit = format === 'percent' ? ' pts' : format === 'days' ? 'd' : 'x';
  return `${scaled >= 0 ? '+' : ''}${scaled.toFixed(1)}${unit}`;
}

// A KPI target is a goal item (in the 'business' category, same bridge
// addTextAsGoal uses) carrying extra kpi_key/target fields. Deliberately NOT
// using resolveGoalList's category carry-forward here: that anchors to the
// nearest prior period with ANY item in the category, so an unrelated goal in
// a more recent period (e.g. "Grow to $1.5m revenue") would shadow an older
// KPI target and hide it. Instead this searches every period up to the one
// being viewed, most recent first, across every category, for the first
// non-done match on this specific kpi_key.
function findKpiTarget(kpiKey) {
  if (!currentCtx?.owner_goals || !currentPeriodEnd) return null;
  const goals = currentCtx.owner_goals;
  const periods = goals.periods || {};
  const allCats = [...GOAL_CATEGORIES, ...(goals.custom_categories || [])];
  const candidatePeriods = Object.keys(periods).filter((p) => p <= currentPeriodEnd).sort().reverse();
  for (const p of candidatePeriods) {
    for (const cat of allCats) {
      const items = (periods[p]?.cats?.[cat.key]?.items || []).filter((it) => !it.deleted);
      const match = items.find((it) => !it.done && it.kpi_key === kpiKey && it.target != null);
      if (match) return { ...match, category: cat.key, sourcePeriod: p };
    }
  }
  return null;
}

// Same walk as findKpiTarget, but collects every distinct kpi_key with an
// active target instead of stopping at one requested key — feeds the
// Pace-to-goal card, which needs to show all of a client's KPI targets at
// once, not just one.
function findAllKpiTargets() {
  if (!currentCtx?.owner_goals || !currentPeriodEnd) return [];
  const goals = currentCtx.owner_goals;
  const periods = goals.periods || {};
  const allCats = [...GOAL_CATEGORIES, ...(goals.custom_categories || [])];
  const candidatePeriods = Object.keys(periods).filter((p) => p <= currentPeriodEnd).sort().reverse();
  const found = {};
  for (const p of candidatePeriods) {
    for (const cat of allCats) {
      const items = (periods[p]?.cats?.[cat.key]?.items || []).filter((it) => !it.deleted);
      items.filter((it) => !it.done && it.kpi_key && it.target != null).forEach((it) => {
        if (!found[it.kpi_key]) found[it.kpi_key] = { ...it, category: cat.key, sourcePeriod: p };
      });
    }
  }
  return Object.values(found);
}

async function addKpiTargetGoal(kpi, target, category = 'business') {
  const fresh = await callRead('get_context', currentClientId);
  const current = fresh?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.[category]?.items || [];
  const now = new Date().toISOString();
  const text = `Get ${kpi.name} to ${formatKpi(target, kpi.format)}.`;
  const items = [...current, { id: uid(), text, kpi_key: kpi.key, target, created_at: now, updated_at: now, done: false }];
  await saveGoalItems(category, items);
}

// Updates the target value in place, at whichever period it actually lives in
// (sourcePeriod may be an earlier period than the one currently being viewed) —
// writing it to currentPeriodEnd instead would create a disconnected duplicate.
async function editKpiTargetGoal(kpi, target, category, sourcePeriod, itemId) {
  const fresh = await callRead('get_context', currentClientId);
  const current = fresh?.owner_goals?.periods?.[sourcePeriod]?.cats?.[category]?.items || [];
  const now = new Date().toISOString();
  const items = current.map((it) => it.id === itemId ? { ...it, target, text: `Get ${kpi.name} to ${formatKpi(target, kpi.format)}.`, updated_at: now } : it);
  const res = await fetch('/.netlify/functions/manual-entry', {
    method: 'POST',
    body: JSON.stringify({ type: 'goal_items', client_id: currentClientId, period_end: sourcePeriod, category, items }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
}

// Explains the gap between the actual change in the bank balance and the
// (usually smaller) operating cash flow figure — deliberately separate from

// movement. delta_cash/operating_cf/delta_debt are facts derived from
// entered balances/OCF, shown read-only here — edit them via Manual Entry
// instead. The financing/investing pieces below ARE editable inline (like
// renderOcfAdjustBlock's breakdown), since a bookkeeper may know these
// numbers more precisely than what's currently saved. Anything still left
// over after all of that is an honest residual, not a guess.
function renderReconAdjustmentRow(a, section) {
  return `
    <div class="cash-item cash-adj-item recon-adj-row" data-adj-section="${section}">
      <span class="cash-item-icon">·</span>

    </div>
  `;
}

// Collapses a cash_reconciliation object into per-category subtotals — the
// same 4 numbers whether they're shown as compact-card tiles or as accordion
// section headers, so the two views can never drift out of sync. Each is
// signed (not a fixed in/out bucket) so a category can land on either side
// depending on what actually happened this period (e.g. Borrowings goes rust
// in a quarter where repayments outpaced new drawdowns).
// Identity: cashflow + capex + borrowings + owner + other + residual = delta_cash.
// Custom "+ Add item" adjustments carry a section tag (defaulting to 'other'
// for older items saved before sections existed) so each one folds into the
// category it was actually added under, not always the generic Other bucket.
function adjustmentsFor(r, section) {
  return (r.adjustments || []).filter((a) => (a.section || 'other') === section);
}
function sumAdjustmentsFor(r, section) {
  return adjustmentsFor(r, section).reduce((sum, a) => sum + (Number(a.amount) || 0), 0);
}
function buildCashTiles(r) {
  const interestPaid = (r.interest_applicable && r.interest_paid) ? r.interest_paid : 0;
  return {
    cashflow: r.operating_cf,
    capex: (r.capex != null ? -r.capex : 0) + sumAdjustmentsFor(r, 'capex'),
    borrowings: (r.delta_debt || 0) - interestPaid + sumAdjustmentsFor(r, 'borrowings'),
    owner: (r.delta_director_loan || 0) + (r.funds_introduced || 0) - (r.owner_drawings || 0) + sumAdjustmentsFor(r, 'owner'),
    other: sumAdjustmentsFor(r, 'other'),
  };
}

// item(): a single breakdown line inside an accordion section — icon, label,
// and either a plain (read-only, computed) amount or a live input. Every id

function renderCashReconciliationBlock(kpi) {

  const section = (key, icon, label, subtotal, bodyHtml) => `
    <div class="cash-accordion-section">

        <span class="cash-accordion-head-label">${icon} ${label}</span>
        <span class="cash-accordion-head-value ${subtotal < 0 ? 'neg' : ''}" id="recon-sub-${key}">${formatMoney(subtotal)} <span class="chevron">▾</span></span>
      </button>
      <div class="cash-accordion-body" id="recon-body-${key}" style="display:none;">${bodyHtml}</div>
    </div>
  `;
  // Every section gets its own "+ Add item" — a custom line the built-in
  // fields don't cover, tagged to that section so it folds into that
  // section's own subtotal (see buildCashTiles) rather than always landing
  // in a generic Other bucket.
  const addItemBlock = (sec) => `
    <div id="recon-adjustments-list-${sec}">${adjustmentsFor(r, sec).map((a) => renderReconAdjustmentRow(a, sec)).join('')}</div>
    <button type="button" class="mini-link cash-adj-add-row" data-adj-add="${sec}">+ Add item</button>
  `;
  return `
    <div class="kpi-ocf-adjust">
      <button class="mini-link" id="recon-toggle" type="button">Where did the cash go?</button>
      <div class="ocf-adjust-panel" id="recon-panel" style="display:none;">
        <div class="cash-breakdown">
          ${renderCashBalanceAdjustBlock(r)}
          ${renderOcfAdjustBlock(kpi)}

          ${section('capex', '🏗️', 'Capex', tiles.capex, `
            ${item('🏗️', 'Equipment/assets (capex)', r.capex_is_estimate ? 'estimated from fixed assets + depreciation — type to override' : null, editable('equipment_purchases', r.equipment_purchases, r.capex_estimate != null ? `est. ${formatMoney(r.capex_estimate)}` : '0', r.capex_is_estimate ? 'fixed_assets' : 'equipment_purchases'))}
            ${addItemBlock('capex')}
          `)}

          ${section('borrowings', '🏦', 'Borrowings', tiles.borrowings, `
            ${renderDebtAdjustBlock(r)}
            ${item('↳', 'Loan repayments', null, editable('loan_repayments', r.loan_repayments, null, 'loan_repayments'))}
            ${item('↳', 'New borrowing', 'derived', `<span class="cash-item-amount readonly" id="recon-new-borrowing">${r.delta_debt == null ? '—' : formatMoney((r.delta_debt || 0) + (r.loan_repayments || 0))}</span>`)}
            ${r.interest_applicable ? item('％', 'Interest paid', 'excluded from operating CF above', readonly(r.interest_paid)) : ''}
            ${addItemBlock('borrowings')}
          `)}

          ${section('owner', '👤', 'Owner', tiles.owner, `
            ${item('👤', 'Director/shareholder loan balance', 'closing balance for this period', editable('director_loan_balance', r.director_loan_balance, null, 'director_loan_balance'))}
            ${item('↳', 'movement this period', r.director_loan_balance_prior != null ? `vs ${formatMoney(r.director_loan_balance_prior)} prior` : null, `<span class="cash-item-amount readonly" id="recon-director-loan-movement">${r.delta_director_loan == null ? '—' : formatMoney(r.delta_director_loan)}</span>${(r.director_loan_balance_prior != null && r.prior_period_end) ? jumpLink('director_loan_balance', r.prior_period_end) : ''}`)}
            ${item('＋', 'Funds introduced', null, editable('funds_introduced', r.funds_introduced, null, 'funds_introduced'))}
            ${item('－', 'Owner drawings', null, editable('owner_drawings', r.owner_drawings, null, 'owner_drawings'))}
            ${addItemBlock('owner')}
          `)}

          ${section('other', '📝', 'Other', tiles.other, addItemBlock('other'))}

          <div class="cash-residual-box ${r.residual < 0 ? 'neg' : ''}" id="recon-residual-box">
            <span class="cash-residual-label">Still unexplained</span>
            <span class="cash-residual-value" id="recon-residual-value">${formatMoney(r.residual)}</span>
          </div>
          <p class="kpi-note" id="recon-equation">${formatMoney(r.delta_cash - r.residual)} net + ${formatMoney(r.residual)} unexplained = ${formatMoney(r.delta_cash)} actual change in cash</p>
          <p class="kpi-note" id="recon-note">${r.has_financing_data
            ? 'Add an item above if you know what the remainder is.'
            : 'Fill in the figures above (from bank/loan statements) to explain this period’s cash movement.'}</p>
          <button class="action secondary" id="recon-save-btn" type="button">Save these figures</button>
          <div class="save-msg" id="recon-save-msg"></div>
        </div>
      </div>

  `;
}

// Collapses a cash_reconciliation object into two totals — "cash in" and
// "cash out" — for the at-a-glance card, rather than the line-by-line ledger
// the detailed panel shows. net should equal delta_cash exactly when nothing
// is missing; when a residual exists (fields not entered), in+out under-
// explains the actual change, and the glance card says so rather than
// silently presenting a total that doesn't foot to the real cash movement.
function cashInOut(r) {
  if (!r) return null;
  let cashIn = 0, cashOut = 0;
  const add = (v) => { if (v == null) return; if (v >= 0) cashIn += v; else cashOut += -v; };
  add(r.operating_cf);
  if (r.capex) cashOut += r.capex;
  add(r.delta_debt);
  if (r.interest_applicable && r.interest_paid) cashOut += r.interest_paid;
  add(r.delta_director_loan);
  if (r.funds_introduced) cashIn += r.funds_introduced;
  if (r.owner_drawings) cashOut += r.owner_drawings;
  (r.adjustments || []).forEach((a) => add(Number(a.amount) || 0));
  return { cashIn, cashOut, net: cashIn - cashOut, delta_cash: r.delta_cash };
}

// Plain-English, entirely template-driven (no AI) — every number here is
// already computed, so this is just picking which clauses are worth saying
// out loud and skipping the ones that are zero/not entered.
function cashStorySentence(r) {
  if (!r) return null;
  const parts = [];
  if (r.operating_cf != null) parts.push(r.operating_cf >= 0 ? `generated ${formatMoney(r.operating_cf)} from operations` : `used ${formatMoney(Math.abs(r.operating_cf))} in operations`);
  if (r.capex) parts.push(`spent ${formatMoney(r.capex)} on equipment/assets`);
  if (r.delta_debt) parts.push(r.delta_debt > 0 ? `borrowed ${formatMoney(r.delta_debt)}` : `paid down ${formatMoney(Math.abs(r.delta_debt))} of debt`);
  if (r.interest_applicable && r.interest_paid) parts.push(`paid ${formatMoney(r.interest_paid)} in interest`);
  if (r.delta_director_loan) parts.push(r.delta_director_loan > 0 ? `the director lent ${formatMoney(r.delta_director_loan)} to the business` : `repaid ${formatMoney(Math.abs(r.delta_director_loan))} to the director`);
  if (r.funds_introduced) parts.push(`the owner put in ${formatMoney(r.funds_introduced)}`);
  if (r.owner_drawings) parts.push(`the owner drew ${formatMoney(r.owner_drawings)}`);
  (r.adjustments || []).forEach((a) => { const amt = Number(a.amount) || 0; if (amt) parts.push(`${(a.label || 'an item').toLowerCase()} ${amt > 0 ? '+' : '−'}${formatMoney(Math.abs(amt))}`); });
  if (!parts.length) return null;
  const tail = r.delta_cash > 0 ? `cash grew by ${formatMoney(r.delta_cash)}.` : r.delta_cash < 0 ? `cash fell by ${formatMoney(Math.abs(r.delta_cash))}.` : `cash was flat.`;
  return 'This period: ' + parts.join(', ') + ' — ' + tail;
}

// Synthetic KPI object (not a real kpi_library row) purely so this card can
// reuse renderKpiTargetBlock/addKpiTargetGoal/editKpiTargetGoal exactly as
// they already work for real KPIs — 'money' format (see formatKpi/formatDiff)
// rather than percent/days/ratio, since the target here is a dollar figure.
// Targets the ACTUAL cash movement (delta_cash), not just the explained
// portion — same reasoning as the headline number below.
function buildCashNetMovementKpi(cur) {
  return { key: 'cash_net_movement', name: 'Where the cash went', format: 'money', category: 'cash', value: cur.delta_cash, priorValue: null };
}

function renderCashFlowGlanceCard(kpi) {
  const r = kpi.cash_reconciliation;
  const cur = cashInOut(r);
  if (!cur) return '';
  const prior = cashInOut(kpi.prior_cash_reconciliation);
  const story = cashStorySentence(r);
  // "Net this period" is the ACTUAL change in the bank balance (delta_cash),
  // not the sum of the tiles below — those only cover what's been entered,
  // so summing them and calling it "net" would silently disagree with the
  // real cash movement whenever anything is missing. The Unexplained badge
  // in the header is what accounts for the gap between the two.
  const tip = cur.delta_cash >= 0
    ? 'Building cash with no clear use? Consider accelerating debt repayment, reinvesting in the business, or setting a cash reserve target.'
    : 'Cash is being drawn down — check whether debt repayments, capex, or drawings outpaced what the business generated this period.';

  let trendLine = '<p class="cash-prior-compare muted plain">No prior period on file</p>';
  if (prior) {
    const diff = cur.delta_cash - prior.delta_cash;
    trendLine = Math.abs(diff) < 1
      ? `<p class="cash-prior-compare"><span class="trend-flat">— no change</span> vs last period (${formatMoney(prior.delta_cash)})</p>`
      : `<p class="cash-prior-compare"><span class="${diff > 0 ? 'trend-up' : 'trend-down'}">${diff > 0 ? '↑' : '↓'} ${formatMoney(Math.abs(diff))}</span> vs last period (${formatMoney(prior.delta_cash)})</p>`;
  }

  // Tiles double as shortcuts into the matching accordion section below (see
  // data-tile-jump wiring) — "cashflow" has no section of its own (operating
  // cash flow is a plain fact at the top of the panel, not editable), so it
  // just opens the panel without expanding anything. "Other" only shows up
  // here when it actually has something in it, to avoid an always-empty tile.
  const tiles = buildCashTiles(r);
  const tile = ([key, icon, label, value]) => `
    <button type="button" class="cash-tile" data-tile-jump="${key}">
      <p class="cash-tile-label">${icon} ${label}</p>
      <p class="cash-tile-value ${value < 0 ? 'neg' : ''}">${formatMoney(value)}</p>
    </button>
  `;
  const tileDefs = [
    ['cashflow', '⚙️', 'Cash flow', tiles.cashflow],
    ['capex', '🏗️', 'Capex', tiles.capex],
    ['borrowings', '🏦', 'Borrowings', tiles.borrowings],
    ['owner', '👤', 'Owner', tiles.owner],
  ];
  if (Math.abs(tiles.other) > 0.5) tileDefs.push(['other', '📝', 'Other', tiles.other]);
  // Money in on the left, money out on the right — sorted by each tile's own
  // sign rather than a fixed position, so a quarter where Borrowings went
  // negative (repaid more than drawn) shows it on the right like any other
  // outflow. Nil/not-entered (exactly 0) defaults to the right rather than
  // the left — "nothing recorded" isn't a genuine inflow, so it shouldn't
  // read as one just because 0 isn't technically negative.
  const tileHtml = `
    <div class="cash-tile-col">${tileDefs.filter((t) => t[3] > 0).map(tile).join('')}</div>
    <div class="cash-tile-col">${tileDefs.filter((t) => t[3] <= 0).map(tile).join('')}</div>
  `;

  return `
    <div class="kpi-card">
      <div class="kpi-card-head">
        <p class="kpi-name">Where the cash went</p>
      </div>
      <div class="cash-net-headline">
        <button type="button" class="cash-net-stat" data-tile-jump="cashflow" title="Net this period">
          <p class="cash-net-value cash-net-primary ${cur.delta_cash < 0 ? 'neg' : ''}" id="cash-net-headline-value">${formatMoney(cur.delta_cash)}</p>
          <span class="cash-net-stat-label">net this period</span>
        </button>
        <button type="button" class="cash-net-stat" data-tile-jump="unexplained" title="Still unexplained">
          <p class="cash-net-value ${r.residual < 0 ? 'neg' : ''}" id="cash-tile-unexplained">${formatMoney(r.residual)}</p>
          <span class="cash-net-stat-label">unexplained</span>
        </button>
      </div>
      ${trendLine}
      <div class="cash-tile-grid">${tileHtml}</div>
      ${story ? `<p class="kpi-cash-story">${story}</p>` : ''}
      <p class="kpi-tip">🔧 ${tip}</p>
      ${renderCashReconciliationBlock(kpi)}
      ${renderKpiTargetBlock(buildCashNetMovementKpi(cur))}
    </div>
  `;
}

// Same shape as Tax outlook (Financial Performance -> Analyse -> Cash) —
// same four-level scenario buildup (net profit direct > net profit change >
// GP change > revenue change, opex change layered on top, see
// projectProfitScenario), same collapsed "Adjust assumptions" panel, same
// provenance/buildup pattern — just one step further: apply the client's OWN
// historical operating cash conversion rate (already computed, not invented
// — see op_cash_conversion) to turn projected profit into projected
// operating cash flow. Deliberately doesn't try to model capex, debt
// draws/repayments, owner drawings, or tax payment timing — those are lumpy,
// judgment-heavy, and exactly the kind of stacked-assumption forecast this
// app has stayed away from all session. This is one clean extension of a
// number the app already trusts, not a full cash flow projection.
let cashOutlookState = { unit: 'pct', revenue: 0, gp: 0, opex: 0, netProfit: 0, netProfitAbsolute: '' };
let growthOutlookState = { unit: 'pct', revenue: 0, cogs: 0, wages: 0, opex: 0, netProfit: 0 };
function computeCashOutlookResult(snapshot, conversion, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute) {
  const { projectedProfit, buildup, provenance } = projectProfitScenario(snapshot, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute);
  const projectedOCF = projectedProfit * conversion;
  return {
    headline: formatMoney(projectedOCF),
    buildup: `${buildup} × <b>${(conversion * 100).toFixed(0)}%</b> cash conversion (this period's actual rate) = projected operating cash flow <b>${formatMoney(projectedOCF)}</b>`,
    provenance,
  };
}
function renderCashOutlookCard(snapshot, kpis) {

  return `

      <div style="background:var(--sage-bg); border-radius:8px; padding:8px 12px; display:inline-block;">
        <p class="kpi-value" id="cash-outlook-value" style="margin:0;">—</p>

      </p>

      <div class="cash-item cash-item-clickable" id="cash-outlook-toggle">
        <span class="cash-item-icon">🧮</span>

      </div>

        <div class="ocf-row"><label>Change amounts as</label><select id="cash-outlook-unit" style="${selectStyle}"><option value="pct" ${s.unit === 'pct' ? 'selected' : ''}>%</option><option value="dollar" ${s.unit === 'dollar' ? 'selected' : ''}>$</option></select></div>
        ${row('cash-outlook-revenue', 'Revenue', s.revenue)}
        ${row('cash-outlook-gp', 'Gross profit', s.gp)}
        ${row('cash-outlook-opex', 'Operating expenses', s.opex)}
        ${row('cash-outlook-netprofit', 'Net profit', s.netProfit)}
        <div class="ocf-row"><label>Or set net profit directly ($)</label><input type="number" id="cash-outlook-netprofit-absolute" value="${s.netProfitAbsolute}" placeholder="e.g. 150000" /></div>
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">Fill in the most specific level you want to model — setting net profit directly overrides everything else, Net profit change overrides Gross profit, Gross profit overrides Revenue.</p>
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;" id="cash-outlook-buildup"></p>

      <p style="font-size:11px; color:var(--ink-soft); margin-top:8px; font-style:italic;">Rough estimate — assumes this period's cash conversion rate holds. Doesn't account for capex, debt, drawings, or tax payment timing.</p>
    </div>
  `;
