// A user-named box beyond the fixed five — same collapsible shell, but the
// header carries an editable name and an asset/liability picker instead of
// a fixed label, plus a "remove this box" action in the body. Name/type
// controls sit next to (not inside) the toggle target so editing them
// doesn't also collapse the box.
function renderOwnerCustomBucket(bucket, openByDefault) {
  const items = bucket.items || [];
  const total = items.reduce((sum, it) => sum + (Number(it.value) || 0), 0);
  const key = `custom-${bucket.id}`;
  return `
    <div class="cash-accordion-section" data-ow-custom-id="${bucket.id}">
      <div class="cash-accordion-head" style="cursor:default;">
        <input type="text" class="ow-item-label ow-custom-name" data-ow-custom-name="${bucket.id}" value="${escAttr(bucket.label || '')}" placeholder="Box name" style="flex:1; max-width:220px;" />
        <select class="ow-custom-type" data-ow-custom-type="${bucket.id}" style="font-size:12px; font-family:var(--font-body); border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); color:var(--ink); padding:6px 8px;">
          <option value="asset" ${bucket.type !== 'liability' ? 'selected' : ''}>Asset (adds)</option>
          <option value="liability" ${bucket.type === 'liability' ? 'selected' : ''}>Liability (subtracts)</option>
        </select>
        <span class="cash-accordion-head-value ${bucket.type === 'liability' ? 'neg' : ''}" data-accordion-toggle="${key}" style="cursor:pointer;" id="ow-bucket-total-${key}"><span class="ow-bucket-amount-text">${bucket.type === 'liability' && total ? '− ' : ''}${formatMoney(total)}</span> <span class="chevron">${openByDefault ? '▴' : '▾'}</span></span>
      </div>
      <div class="cash-accordion-body" id="ow-body-${key}" style="display:${openByDefault ? 'block' : 'none'};">
        <div id="ow-items-list-${key}">${items.map((it) => renderOwnerWealthItemRow(it, key)).join('')}</div>
        <button type="button" class="mini-link" data-ow-add="${key}" style="margin:6px 0 9px;">+ Add item</button>
        <button type="button" class="mini-link" data-ow-remove-box="${bucket.id}" style="color:var(--rust);">✕ Remove this box</button>
      </div>
    </div>
  `;
}

// Same "carry forward from the nearest non-empty prior period" pattern
// findPriorMeetingPriorities uses for meeting priorities — a will/EPOA/
// buy-sell/exit-readiness answer doesn't reset to Unknown just because a
// new period got created; it should still read as "confirmed last time"
// until the adviser actually revisits it. Per ITEM, not per whole
// checklist — this period can already have its own saved row (even one
// that's mostly "Unknown") without every individual item in it ever
// having a real answer anywhere: e.g. Will got answered fresh this period
// while EPOA has only ever been Unknown here, even though an earlier
// period does have a real EPOA answer on file. Checking "has this period
// been saved at all" misses that case entirely, so this looks at each key
// independently and only treats yes/no/partial (not "unknown") as a real
// answer worth surfacing.
function buildPriorAnswerMap(snapshots, periodEnd, field, keys) {
  const sorted = (snapshots || [])
    .filter((s) => s.period_end < periodEnd)
    .sort((a, b) => (a.period_end < b.period_end ? 1 : -1));
  const map = {};
  for (const key of keys) {
    for (const s of sorted) {
      const it = (s[field] || []).find((x) => x.key === key);
      if (it?.status && it.status !== 'unknown') { map[key] = { status: it.status, notes: it.notes, periodEnd: s.period_end }; break; }
    }
  }
  return map;
}

// Same carry-forward search as the checklist helper above, but for a net
// worth bucket (super/investments/property/other/debt) — different
// treatment once found, though: a will's status is a durable fact that's
// usually still true next period, but a super balance or property value
// genuinely moves every period. The old figure still comes back as a real,
// editable value (not just a placeholder) so the bucket/grand totals read
// correctly right away instead of showing $0 — but every carried item is
// flagged (see renderOwnerWealthItemRow's carriedFrom) so it reads as
// "needs a look," not as freshly-confirmed data.
function findPriorBucketItems(snapshots, periodEnd, itemsField, totalField) {
  const candidates = (snapshots || [])
    .filter((s) => s.period_end < periodEnd)
    .sort((a, b) => (a.period_end < b.period_end ? 1 : -1));
  for (const s of candidates) {
    if (Array.isArray(s[itemsField]) && s[itemsField].length) return { periodEnd: s.period_end, items: s[itemsField] };
    if (s[totalField] != null) return { periodEnd: s.period_end, items: [{ label: '', value: s[totalField] }] };
  }
  return null;
}

async function renderOwnerInput(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No period selected</p><p class="muted plain" style="margin:0;">Select or create a period first.</p></div>`;
    return;
  }
  const data = await callRead('get_owner_wealth', currentClientId, currentPeriodEnd);
  if (myToken !== renderToken) return;
  const existing = (data?.snapshots || []).find((s) => s.period_end === currentPeriodEnd) || {};
  const estatePriorAnswers = buildPriorAnswerMap(data?.snapshots, currentPeriodEnd, 'estate_planning_checklist', OWNER_ESTATE_CHECKLIST_ITEMS.map((i) => i.key));
  const exitPriorAnswers = buildPriorAnswerMap(data?.snapshots, currentPeriodEnd, 'exit_readiness_checklist', OWNER_EXIT_READINESS_ITEMS.map((i) => i.key));

  // Backward-compatible with a bucket that has an old lump-sum total but no
  // itemized rows yet (saved before itemization existed) — shows it as one
  // pre-filled, editable line rather than silently losing the figure.
  //
  // Once this period is genuinely blank (no items, no lump-sum total),
  // falls back to the nearest prior period's item labels AND figures as a
  // real, editable starting point (see findPriorBucketItems) — every
  // carried item is flagged via carriedFrom so it reads as "needs a
  // look," not as this period's confirmed number. bucketCarry records
  // which buckets did this, so the bucket-level note below can show it too.
  const bucketCarry = {};
  const itemsFor = (itemsField, totalField, bucketKey) => {
    if (Array.isArray(existing[itemsField]) && existing[itemsField].length) return existing[itemsField];
    if (existing[totalField] != null) return [{ label: '', value: existing[totalField] }];
    const carry = findPriorBucketItems(data?.snapshots, currentPeriodEnd, itemsField, totalField);
    if (carry) {
      bucketCarry[bucketKey] = carry.periodEnd;
      return carry.items.map((it) => ({ label: it.label, value: it.value, carriedFrom: carry.periodEnd }));
    }
    return [];
  };
  const bucketItems = {
    super: itemsFor('super_items', 'super_balance', 'super'),
    investments: itemsFor('investments_items', 'investments', 'investments'),
    property: itemsFor('property_items', 'property', 'property'),
    other: itemsFor('other_assets_items', 'other_assets', 'other'),
    debt: itemsFor('debt_items', 'debt', 'debt'),
  };
  const customBuckets = Array.isArray(existing.custom_buckets) ? existing.custom_buckets : [];

  // A jump from one Analyse tile opens just that bucket; any other way of
  // reaching Input (the sidebar tab, Save-and-return, etc.) opens everything
  // — see ownerInputFocusBucket's declaration for why.
  const isOpen = (key) => (ownerInputFocusBucket ? ownerInputFocusBucket === key : true);

  // Same formula as computeNetWorthTotal, just run against these live
  // client-side item lists instead of the saved snapshot fields — the
  // saved fields don't exist until the first Save, but the adviser should
  // see a running total (carried-forward figures included) immediately.
  const bucketSum = (items) => items.reduce((sum, it) => sum + (Number(it.value) || 0), 0);
  const initialGrandTotal = bucketSum(bucketItems.super) + bucketSum(bucketItems.investments)
    + bucketSum(bucketItems.property) + bucketSum(bucketItems.other) - bucketSum(bucketItems.debt)
    + sumOwnerCustomBucketsNet(customBuckets);

  content.innerHTML = `
    <div class="card">
      <button type="button" class="mini-link" id="ow-back-to-analyse" style="margin-bottom:8px;">← Back to Owner & Succession summary</button>
      <p class="muted">Owner & Succession — ${formatShortDate(currentPeriodEnd)}</p>
      <p class="muted plain" style="margin:0 0 14px;">Personal net worth, captured once a year. Break each bucket into as many named items as you like — a super fund, a specific property, a share portfolio — add or remove lines freely; each bucket's total is just the sum of its items. Not the business's own numbers; those live under Financial Performance.</p>
      <div class="cash-net-headline" style="margin:0 0 14px;">
        <div class="cash-net-stat">
          <p class="cash-net-value cash-net-primary ${initialGrandTotal < 0 ? 'neg' : ''}" id="ow-grand-total">${formatMoney(initialGrandTotal)}</p>
          <span class="cash-net-stat-label">Total personal net worth</span>
        </div>
      </div>
      ${renderOwnerWealthBucket('super', 'Superannuation', bucketItems.super, isOpen('super'), bucketCarry.super)}
      ${renderOwnerWealthBucket('investments', 'Investments', bucketItems.investments, isOpen('investments'), bucketCarry.investments)}
      ${renderOwnerWealthBucket('property', 'Property', bucketItems.property, isOpen('property'), bucketCarry.property)}
      ${renderOwnerWealthBucket('other', 'Other assets', bucketItems.other, isOpen('other'), bucketCarry.other)}
      ${renderOwnerWealthBucket('debt', 'Personal debt', bucketItems.debt, isOpen('debt'), bucketCarry.debt)}
      <div id="ow-custom-boxes">${customBuckets.map((b) => renderOwnerCustomBucket(b, isOpen(`custom-${b.id}`))).join('')}</div>
      <button type="button" class="mini-link" id="ow-add-box-btn" style="margin:8px 0 0;">+ Add box</button>
      ${renderOwnerEstateChecklistInput(existing.estate_planning_checklist, currentCtx?.entity_type, estatePriorAnswers)}
      ${renderOwnerExitReadinessInput(existing.exit_readiness_checklist, exitPriorAnswers)}
      <div class="form-field" style="margin-top:14px;"><label>Notes (optional)</label><textarea id="ow-notes" rows="2">${existing.notes || ''}</textarea></div>
      <button class="action" id="ow-save-btn" type="button">Save</button>
      <span id="ow-save-msg" style="margin-left:8px; font-size:12px; color:var(--ink-soft);"></span>
    </div>
  `;

  const rowsFor = (bucket) => [...content.querySelectorAll(`.ow-item-row[data-ow-bucket="${bucket}"]`)];
  // Every fixed bucket plus every custom box, net of its asset/liability
  // sign — same shape as sumOwnerCustomBucketsNet, just reading live DOM
  // values instead of saved data, so it updates as the adviser types.
  const recalcGrandTotal = () => {
    const fixed = ['super', 'investments', 'property', 'other'].reduce((sum, b) => sum + bucketSum(rowsFor(b).map((row) => ({ value: row.querySelector('.ow-item-value').value }))), 0);
    const debt = bucketSum(rowsFor('debt').map((row) => ({ value: row.querySelector('.ow-item-value').value })));
    const customNet = [...content.querySelectorAll('#ow-custom-boxes > [data-ow-custom-id]')].reduce((sum, section) => {
      const id = section.dataset.owCustomId;
      const t = bucketSum(rowsFor(`custom-${id}`).map((row) => ({ value: row.querySelector('.ow-item-value').value })));
      const isLiability = section.querySelector('[data-ow-custom-type]').value === 'liability';
      return sum + (isLiability ? -t : t);
    }, 0);
    const total = fixed - debt + customNet;
    const el = document.getElementById('ow-grand-total');
    if (el) { el.textContent = formatMoney(total); el.classList.toggle('neg', total < 0); }
  };
  // Custom-box totals carry a sign (liabilities show "− $x" and use the
  // same .neg colour cash reconciliation uses for negative subtotals) —
  // built-in buckets never do, their sign is implied by which bucket it is.
  const recalcBucket = (bucket) => {
    const total = rowsFor(bucket).reduce((sum, row) => sum + (Number(row.querySelector('.ow-item-value').value || 0)), 0);
    const valueEl = document.getElementById(`ow-bucket-total-${bucket}`);
    const amountEl = valueEl.querySelector('.ow-bucket-amount-text');
    const customId = bucket.startsWith('custom-') ? bucket.slice(7) : null;
    const isLiability = customId && content.querySelector(`[data-ow-custom-type="${customId}"]`)?.value === 'liability';
    valueEl.classList.toggle('neg', !!isLiability);
    amountEl.textContent = `${isLiability && total ? '− ' : ''}${formatMoney(total)}`;
    recalcGrandTotal();
  };
  const wireItemRow = (row, bucket) => {
    row.querySelector('.ow-item-value').oninput = () => recalcBucket(bucket);
    row.querySelector('.ow-item-remove').onclick = () => { row.remove(); recalcBucket(bucket); };
  };
  const wireAddButton = (bucket) => {
    const addBtn = content.querySelector(`[data-ow-add="${bucket}"]`);
    if (!addBtn) return;
    addBtn.onclick = () => {
      const list = document.getElementById(`ow-items-list-${bucket}`);
      list.insertAdjacentHTML('beforeend', renderOwnerWealthItemRow({ label: '', value: '' }, bucket));
      const newRow = list.lastElementChild;
      wireItemRow(newRow, bucket);
      newRow.querySelector('.ow-item-label').focus();
    };
  };
  const wireAccordionToggle = (key) => {
    const toggleEl = content.querySelector(`[data-accordion-toggle="${key}"]`);
    if (!toggleEl) return;
    toggleEl.onclick = () => {
      const body = document.getElementById(`ow-body-${key}`);
      body.style.display = body.style.display === 'none' ? 'block' : 'none';
      const chevron = toggleEl.querySelector('.chevron');
      if (chevron) chevron.textContent = body.style.display === 'none' ? '▾' : '▴';
    };
  };
  const wireCustomBox = (section) => {
    const id = section.dataset.owCustomId;
    const key = `custom-${id}`;
    rowsFor(key).forEach((row) => wireItemRow(row, key));
    wireAddButton(key);
    wireAccordionToggle(key);
    section.querySelector('[data-ow-custom-type]').onchange = () => recalcBucket(key);
    section.querySelector('[data-ow-remove-box]').onclick = () => {
      const name = section.querySelector('[data-ow-custom-name]').value || 'this box';
      if (!confirm(`Remove "${name}" and all its items? This only takes effect once you Save.`)) return;
      section.remove();
      recalcGrandTotal();
    };
  };

  ['super', 'investments', 'property', 'other', 'debt'].forEach((bucket) => {
    rowsFor(bucket).forEach((row) => wireItemRow(row, bucket));
    wireAddButton(bucket);
    wireAccordionToggle(bucket);
  });
  content.querySelectorAll('#ow-custom-boxes > [data-ow-custom-id]').forEach(wireCustomBox);

  document.getElementById('ow-add-box-btn').onclick = () => {
    const id = `new-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const container = document.getElementById('ow-custom-boxes');
    container.insertAdjacentHTML('beforeend', renderOwnerCustomBucket({ id, label: '', type: 'asset', items: [] }, true));
    const section = container.lastElementChild;
    wireCustomBox(section);
    section.querySelector('.ow-custom-name').focus();
  };

  const goBackToAnalyse = async () => {
    currentWorkflow = 'analyse';
    renderWorkflowTabsActive();
    renderSidebarDomains();
    await renderMain();
  };
  document.getElementById('ow-back-to-analyse').onclick = goBackToAnalyse;

  document.getElementById('ow-save-btn').onclick = async () => {
    const btn = document.getElementById('ow-save-btn');
    const msg = document.getElementById('ow-save-msg');
    btn.disabled = true;
    msg.textContent = 'Saving…';
    const itemsPayload = (bucket) => rowsFor(bucket).map((row) => ({ label: row.querySelector('.ow-item-label').value, value: row.querySelector('.ow-item-value').value }));
    const customBucketsPayload = [...content.querySelectorAll('#ow-custom-boxes > [data-ow-custom-id]')].map((section) => {
      const id = section.dataset.owCustomId;
      return {
        id,
        label: section.querySelector('[data-ow-custom-name]').value,
        type: section.querySelector('[data-ow-custom-type]').value,
        items: itemsPayload(`custom-${id}`),
      };
    });
    const estateChecklistPayload = [...content.querySelectorAll('[data-estate-key]')].map((row) => ({
      key: row.dataset.estateKey,
      status: row.querySelector('.ow-estate-status').value,
      notes: row.querySelector('.ow-estate-notes').value,
    }));
    const exitReadinessChecklistPayload = [...content.querySelectorAll('[data-exit-key]')].map((row) => ({
      key: row.dataset.exitKey,
      status: row.querySelector('.ow-exit-status').value,
      notes: row.querySelector('.ow-exit-notes').value,
    }));
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({
          type: 'save_owner_wealth', client_id: currentClientId, period_end: currentPeriodEnd,
          super_items: itemsPayload('super'), investments_items: itemsPayload('investments'),
          property_items: itemsPayload('property'), other_assets_items: itemsPayload('other'),
          debt_items: itemsPayload('debt'), custom_buckets: customBucketsPayload,
          estate_planning_checklist: estateChecklistPayload,
          exit_readiness_checklist: exitReadinessChecklistPayload,
          notes: document.getElementById('ow-notes').value,
        }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      // Straight back to the summary on success — you just entered data,
      // seeing the recalculated total/chart is the natural next thing to
      // see, not sitting on the now-stale form.
      await goBackToAnalyse();
    } catch (err) {
      msg.textContent = 'error';
      alert('Error: ' + err.message);
      btn.disabled = false;
    }
  };
}

async function renderOwnerAnalyse(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add this period's numbers on Owner & Succession → Input first.</p></div>`;
    return;
  }
  const [data, riskData, overview] = await Promise.all([
    callRead('get_owner_wealth', currentClientId, currentPeriodEnd),
    callRead('get_risk_items', currentClientId, currentPeriodEnd),
    callRead('get_overview', currentClientId, currentPeriodEnd),
  ]);
  if (myToken !== renderToken) return;
  const snapshots = data?.snapshots || [];
  const wealth = snapshots.find((s) => s.period_end === currentPeriodEnd) || {};
  const total = computeNetWorthTotal(wealth);

  // Owner Wealth is annual-only by design (CADENCE_PILLARS, analyze.js) so
  // there's at most one saved row per year already — no dedupe-by-year step
  // needed the way the Valuation card's history chart needed one.
  const periods = snapshots.map((s) => s.period_end);
  const netWorthValues = snapshots.map((s) => computeNetWorthTotal(s));
  // Bigger than the default chart size — this is the headline trend for the
  // whole domain, given more visual weight than the business-equity
  // cross-reference it sits next to.
  const trendChart = periods.length >= 2 ? renderTrendLineChart(periods, netWorthValues, 'var(--sage)', 420, 110) : '';
  const equityTile = renderBusinessEquityTile(data?.latestValuation);
  const profitabilityScore = (overview?.pillarScores || []).find((p) => p.pillar === 'profitability')?.score ?? null;
  const exitReadinessResult = computeExitReadinessScore(wealth.exit_readiness_checklist, riskData?.business || [], riskData?.allQuestions || [], profitabilityScore);
  // Computed once here (not inside renderOwnerContinuityCard) purely so
  // the summary strip's suggestion below can reference the same verdict
  // without the two silently drifting out of sync with each other.
  const continuitySignals = OWNER_CONTINUITY_QUESTIONS.map((q) => ({ label: q.label, why: q.why, ...findBusinessQuestionAnswer(q.text, riskData?.business || [], riskData?.allQuestions || []) }));
  const continuityVerdict = ownerContinuityVerdict(continuitySignals);
  // Lifted out of renderOwnerSuccessionCard so the summary strip's
  // suggestion (computeOwnerExitSuggestion) and the succession card itself
  // can both use them without computing them twice.
  const successionItems = (currentCtx?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.['exit_succession']?.items || []).filter((it) => !it.deleted && !it.done);
  const successionTargetYear = getOwnerSuccessionTargetYear();
  const successionReadinessFlag = getOwnerSuccessionReadinessFlag(data?.latestValuation);
  const successionPathwayFlag = getOwnerSuccessionPathwayFlag();
  const estateGaps = computeOwnerEstateGaps(wealth.estate_planning_checklist, currentCtx?.entity_type);
  const exitSuggestion = computeOwnerExitSuggestion(successionItems, successionTargetYear, successionReadinessFlag, successionPathwayFlag, exitReadinessResult, continuityVerdict, estateGaps);

  content.innerHTML = `
    ${renderOwnerSummaryStrip(total, exitReadinessResult, exitSuggestion)}
    <div class="card" id="owner-networth-card">
      <p class="muted">Net worth — ${formatShortDate(currentPeriodEnd)}</p>
      ${total == null ? `<p class="muted plain" style="margin:0;">Nothing entered yet for this period — add figures on Owner & Succession → Input.</p>` : `
        <div style="background:var(--sage-bg); border-radius:8px; padding:8px 12px; display:inline-block;">
          <p class="kpi-value" style="margin:0;">${formatMoney(total)}</p>
          <p class="card-label" style="margin:2px 0 0;">Total net worth</p>
        </div>
        <div class="snapshot-grid" style="margin-top:12px;">
          <div class="snapshot-field ow-jump-tile" data-ow-jump="super" title="Click to edit"><p class="card-label">Superannuation</p><p style="margin:0; font-family:var(--font-mono);">${formatMoney(wealth.super_balance)}</p></div>
          <div class="snapshot-field ow-jump-tile" data-ow-jump="investments" title="Click to edit"><p class="card-label">Investments</p><p style="margin:0; font-family:var(--font-mono);">${formatMoney(wealth.investments)}</p></div>
          <div class="snapshot-field ow-jump-tile" data-ow-jump="property" title="Click to edit"><p class="card-label">Property</p><p style="margin:0; font-family:var(--font-mono);">${formatMoney(wealth.property)}</p></div>
          <div class="snapshot-field ow-jump-tile" data-ow-jump="other" title="Click to edit"><p class="card-label">Other assets</p><p style="margin:0; font-family:var(--font-mono);">${formatMoney(wealth.other_assets)}</p></div>
          <div class="snapshot-field ow-jump-tile" data-ow-jump="debt" title="Click to edit"><p class="card-label">Personal debt</p><p style="margin:0; font-family:var(--font-mono);">${wealth.debt != null ? '− ' + formatMoney(wealth.debt) : '—'}</p></div>
          ${(Array.isArray(wealth.custom_buckets) ? wealth.custom_buckets : []).map((b) => {
            const bTotal = (b.items || []).reduce((sum, it) => sum + (Number(it.value) || 0), 0);
            return `<div class="snapshot-field ow-jump-tile" data-ow-jump="custom-${b.id}" title="Click to edit"><p class="card-label">${escAttr(b.label || 'Untitled box')}</p><p style="margin:0; font-family:var(--font-mono);">${b.type === 'liability' && bTotal ? '− ' : ''}${formatMoney(bTotal)}</p></div>`;
          }).join('')}
        </div>
      `}
      ${trendChart && equityTile ? `
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:16px; margin-top:14px; align-items:start;">
          <div style="border:1px solid var(--line); border-radius:8px; padding:12px;">
            <p class="card-label" style="margin:0 0 4px;">Net worth over time</p>${trendChart}
          </div>
          <div style="border:1px solid var(--line); border-radius:8px; padding:12px;">${equityTile}</div>
        </div>
      ` : `
        ${trendChart ? `<div style="border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:14px;"><p class="card-label" style="margin:0 0 4px;">Net worth over time</p>${trendChart}</div>` : ''}
        ${equityTile ? `<div style="border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:14px;">${equityTile}</div>` : ''}
      `}
    </div>
    <div id="owner-retirement-card">${renderOwnerRetirementCard(data?.latestValuation)}</div>
    <div id="owner-exitreadiness-card">${renderOwnerExitReadinessCard(exitReadinessResult)}</div>
    ${renderOwnerContinuityCard(riskData?.business || [], riskData?.allQuestions || [], wealth.estate_planning_checklist)}
    ${renderOwnerSuccessionCard(data?.latestValuation, wealth.estate_planning_checklist, successionTargetYear, successionReadinessFlag, successionPathwayFlag, successionItems)}
  `;
  wireAddToActionsButtons(content);

  // Summary strip tiles jump straight to the card with the detail behind
  // that number — same "click a number, land on its source" pattern as the
  // net worth bucket tiles below.
  const jumpTargets = {
    'owner-summary-tile-networth': 'owner-networth-card',
    'owner-summary-tile-years': 'owner-retirement-card',
    'owner-summary-tile-exit': 'owner-exitreadiness-card',
  };
  Object.entries(jumpTargets).forEach(([tileId, targetId]) => {
    const tile = document.getElementById(tileId);
    if (tile) tile.onclick = () => document.getElementById(targetId)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Click a net worth tile → jump straight to editing that bucket, same
  // "click a number, land where it's entered" pattern already used
  // elsewhere in this app (e.g. the cash reconciliation jump links) —
  // rather than making the accountant hunt for the separate Input tab
  // themselves.
  content.querySelectorAll('[data-ow-jump]').forEach((el) => {
    el.onclick = async () => {
      const bucket = el.dataset.owJump;
      // Opens just this one bucket on the Input form (see
      // ownerInputFocusBucket's declaration) instead of dropping the
      // accountant into all five-plus-custom boxes at once.
      ownerInputFocusBucket = bucket;
      currentWorkflow = 'input';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
      ownerInputFocusBucket = null;
      const list = document.getElementById(`ow-items-list-${bucket}`);
      if (!list) return;
      const firstValueInput = list.querySelector('.ow-item-value');
      if (firstValueInput) { firstValueInput.focus(); firstValueInput.select(); }
      list.closest('.cash-accordion-section')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  });

  const businessEquityJump = document.getElementById('ow-business-equity-jump');
  if (businessEquityJump) {
    businessEquityJump.onclick = async () => {
      currentDomain = 'growth';
      currentWorkflow = 'analyse';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
      const valuationEl = document.getElementById('valuation-amount');
      if (!valuationEl) return;
      valuationEl.closest('.kpi-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  }

  const yearsInput = document.getElementById('owner-retirement-years');
  if (yearsInput) {
    const headlineEl = document.getElementById('owner-retirement-headline');
    const projectedEl = document.getElementById('owner-retirement-projected');
    const targetEl = document.getElementById('owner-retirement-target');
    const yearsValueEl = document.getElementById('owner-retirement-years-value');
    const growthSuperInput = document.getElementById('owner-retirement-growth-super');
    const growthInvestmentsInput = document.getElementById('owner-retirement-growth-investments');
    const growthPropertyInput = document.getElementById('owner-retirement-growth-property');
    const growthOtherInput = document.getElementById('owner-retirement-growth-other');
    const incomeInput = document.getElementById('owner-retirement-income');
    const withdrawalInput = document.getElementById('owner-retirement-withdrawal');
    const targetOverrideInput = document.getElementById('owner-retirement-target-override');
    const toGoEl = document.getElementById('owner-retirement-to-go');
    const toGoTileEl = document.getElementById('owner-retirement-to-go-tile');
    const postGrowthInput = document.getElementById('owner-retirement-post-growth');
    const retirementYearsInput = document.getElementById('owner-retirement-years-needed');
    const drawdownResultEl = document.getElementById('owner-retirement-drawdown-result');
    const yearsSummaryEl = document.getElementById('owner-retirement-years-summary');
    const yearsZeroHintEl = document.getElementById('owner-retirement-years-zero-hint');
    const includeBusinessInput = document.getElementById('owner-retirement-include-business');
    const businessEquityAmount = data?.latestValuation?.valuation_amount || 0;
    const successionYearsForSuggestion = (() => {
      const ty = getOwnerSuccessionTargetYear();
      return ty != null ? Math.max(0, ty - new Date().getFullYear()) : null;
    })();
    const gatherOneOffs = (bucket) => [...content.querySelectorAll(`.ow-oneoff-row[data-oneoff-bucket="${bucket}"]`)]
      .map((row) => ({ year: Number(row.querySelector('.ow-oneoff-year').value || 0), amount: Number(row.querySelector('.ow-oneoff-amount').value || 0) }))
      .filter((o) => o.year || o.amount); // drop a freshly-added, still-empty row rather than let it distort the projection as a $0-in-year-0 change
    const recalcRetirement = () => {
      const oneOffs = {};
      OWNER_RETIREMENT_BUCKETS.forEach((b) => { oneOffs[b] = gatherOneOffs(b); });
      ownerRetirementState = {
        years: Number(yearsInput.value || 0), growthSuper: Number(growthSuperInput.value || 0),
        growthInvestments: Number(growthInvestmentsInput.value || 0), growthProperty: Number(growthPropertyInput.value || 0),
        growthOther: Number(growthOtherInput.value || 0), desiredIncome: Number(incomeInput.value || 0),
        withdrawalRate: Number(withdrawalInput.value || 0), targetOverride: Number(targetOverrideInput.value || 0),
        postRetirementGrowth: Number(postGrowthInput.value || 0), retirementYears: Number(retirementYearsInput.value || 0),
        includeBusinessEquity: includeBusinessInput ? includeBusinessInput.checked : false, oneOffs,
      };
      const activeBusinessEquity = ownerRetirementState.includeBusinessEquity ? businessEquityAmount : 0;
      const result = projectOwnerRetirementOutlook(
        wealth, ownerRetirementState.years, ownerRetirementState.growthSuper, ownerRetirementState.growthInvestments,
        ownerRetirementState.growthProperty, ownerRetirementState.growthOther, ownerRetirementState.desiredIncome, ownerRetirementState.withdrawalRate,
        ownerRetirementState.oneOffs, activeBusinessEquity
      );
      // Box 1: projected net worth at "Project forward (years)".
      projectedEl.textContent = formatMoney(result.projectedNetWorth);
      yearsZeroHintEl.textContent = ownerRetirementState.years === 0
        ? 'Set this above 0 — growth rates below have nothing to compound against while this is 0.' : '';

      // Three ways to land on a target, most-specific wins: a typed-in
      // override beats the growth-adjusted present-value calc (only kicks
      // in once both income AND a retirement length are set), which beats
      // the flat income/withdrawal-rate divisor.
      const growthAdjustedTarget = ownerRetirementState.retirementYears > 0
        ? solveRequiredPrincipal(ownerRetirementState.desiredIncome, ownerRetirementState.postRetirementGrowth, ownerRetirementState.retirementYears)
        : null;
      const target = ownerRetirementState.targetOverride > 0 ? ownerRetirementState.targetOverride
        : growthAdjustedTarget != null ? growthAdjustedTarget
        : result.targetNestEgg;

      // Box 2 + 3: the target and how long it'd take to reach it — both
      // independent of "Project forward (years)", which only drives Box 1.
      if (target == null) {
        targetEl.textContent = '—';
        yearsValueEl.textContent = '—';
        toGoEl.textContent = '';
        toGoTileEl.textContent = '';
        headlineEl.textContent = 'Set a desired income and withdrawal rate — or type a target directly — below to see a target and a years-to-retire estimate.';
        yearsSummaryEl.textContent = 'Set a target in Amount required for retirement first — years-to-retire has nothing to solve for yet.';
      } else {
        targetEl.textContent = formatMoney(target);
        // "To go" tracks against Projected net worth (Box 1) — not today's
        // static figure — so it actually moves when you adjust "Project
        // forward (years)" or a growth rate, instead of sitting frozen at
        // today's gap while everything else on the card responds live.
        const toGo = target - result.projectedNetWorth;
        const toGoText = toGo <= 0 ? `${formatMoney(Math.abs(toGo))} past target at year ${ownerRetirementState.years}` : `${formatMoney(toGo)} to go at year ${ownerRetirementState.years}`;
        toGoEl.textContent = toGo <= 0
          ? `You're projected to be ${formatMoney(Math.abs(toGo))} past this target by year ${ownerRetirementState.years} (Project forward).`
          : `${formatMoney(toGo)} still to go, based on your Project forward projection at year ${ownerRetirementState.years}.`;
        toGoTileEl.textContent = toGoText;
        // Years-to-retire's own "already reached" check is separate — it
        // solves from TODAY's actual balance (plus business equity, if
        // opted in), independent of whatever "Project forward (years)"
        // happens to be set to elsewhere.
        const startingTotal = computeNetWorthTotal(wealth);
        const effectiveStartingTotal = startingTotal != null ? startingTotal + activeBusinessEquity : null;
        if (effectiveStartingTotal != null && effectiveStartingTotal >= target) {
          yearsValueEl.textContent = '0';
          headlineEl.textContent = `Already at or above the ${formatMoney(target)} target based on today's figures.`;
          yearsSummaryEl.textContent = `0 years — already at or above the ${formatMoney(target)} target.`;
        } else {
          const yearsToTarget = solveOwnerYearsToTarget(
            wealth, ownerRetirementState.growthSuper, ownerRetirementState.growthInvestments,
            ownerRetirementState.growthProperty, ownerRetirementState.growthOther, ownerRetirementState.oneOffs, target, activeBusinessEquity
          );
          yearsValueEl.textContent = yearsToTarget == null ? '60+' : String(yearsToTarget);
          headlineEl.textContent = yearsToTarget == null
            ? `Not reached within 60 years at these growth rates — try higher rates or an extra one-off contribution.`
            : `About ${yearsToTarget} year${yearsToTarget === 1 ? '' : 's'} to reach the ${formatMoney(target)} target.`;
          yearsSummaryEl.textContent = yearsToTarget == null
            ? `Not reached within 60 years at these growth rates — you'd need ${formatMoney(target)}.`
            : `${yearsToTarget} year${yearsToTarget === 1 ? '' : 's'} — you'll need ${formatMoney(target)} by then.`;
        }
      }
      // Tests the withdrawal-rate assumption itself: withdraw the desired
      // income from the target every year, growing what's left at the
      // post-retirement rate, and see whether it actually holds up.
      if (target == null || ownerRetirementState.desiredIncome <= 0) {
        drawdownResultEl.textContent = target == null ? '' : 'Set a desired annual income above to check how long this would last.';
      } else {
        const drawdownYears = simulateDrawdownYears(target, ownerRetirementState.desiredIncome, ownerRetirementState.postRetirementGrowth);
        drawdownResultEl.textContent = drawdownYears == null
          ? `At a ${ownerRetirementState.postRetirementGrowth}%/yr post-retirement return, ${formatMoney(target)} withdrawing ${formatMoney(ownerRetirementState.desiredIncome)}/yr lasts indefinitely — growth keeps pace with withdrawals.`
          : `At a ${ownerRetirementState.postRetirementGrowth}%/yr post-retirement return, ${formatMoney(target)} withdrawing ${formatMoney(ownerRetirementState.desiredIncome)}/yr runs out in about ${drawdownYears} year${drawdownYears === 1 ? '' : 's'}.`;
      }
      document.getElementById('owner-retirement-bd-super').textContent = formatMoney(result.projectedSuper);
      document.getElementById('owner-retirement-bd-investments').textContent = formatMoney(result.projectedInvestments);
      document.getElementById('owner-retirement-bd-property').textContent = formatMoney(result.projectedProperty);
      document.getElementById('owner-retirement-bd-other').textContent = formatMoney(result.projectedOther);
      document.getElementById('owner-retirement-bd-debt').textContent = (result.projectedDebt ? '− ' : '') + formatMoney(result.projectedDebt);
      const bdBusinessWrap = document.getElementById('owner-retirement-bd-business-wrap');
      if (result.businessEquity > 0) {
        bdBusinessWrap.style.display = '';
        document.getElementById('owner-retirement-bd-business').textContent = formatMoney(result.businessEquity);
      } else {
        bdBusinessWrap.style.display = 'none';
      }
      OWNER_RETIREMENT_BUCKETS.forEach((bucket) => {
        const items = oneOffs[bucket] || [];
        const total = items.reduce((sum, o) => sum + o.amount, 0);
        const headerEl = document.getElementById(`ow-oneoff-total-${bucket}`);
        if (!headerEl) return;
        headerEl.classList.toggle('neg', total < 0);
        headerEl.querySelector('.ow-oneoff-amount-text').textContent = items.length ? (total < 0 ? '− ' : '') + formatMoney(Math.abs(total)) : 'None';
      });
      // Mirrors whatever yearsValueEl landed on above (one of 3 branches) —
      // simpler and less error-prone than duplicating that branching logic
      // to independently set the summary-strip tile.
      const summaryYearsEl = document.getElementById('owner-summary-years-value');

    };
    const wireOneOffRow = (row) => {
      row.querySelector('.ow-oneoff-year').oninput = recalcRetirement;
      row.querySelector('.ow-oneoff-amount').oninput = recalcRetirement;
      row.querySelector('.ow-oneoff-remove').onclick = () => { row.remove(); recalcRetirement(); };
    };
    content.querySelectorAll('.ow-oneoff-row').forEach(wireOneOffRow);
    content.querySelectorAll('[data-oneoff-add]').forEach((addBtn) => {
      addBtn.onclick = () => {
        const bucket = addBtn.dataset.oneoffAdd;

        list.insertAdjacentHTML('beforeend', renderOwnerOneOffRow(bucket, {}));
        const newRow = list.lastElementChild;

        newRow.querySelector('.ow-oneoff-year').focus();

    });
    content.querySelectorAll('[data-accordion-toggle^="oneoff-"]').forEach((toggleEl) => {
      toggleEl.onclick = () => {

// ---- Actions ----
// The piece that ties the rest of the app together. Every other domain can
// flag a gap and point at where to fix it, but nothing remembered you'd
// agreed to actually do it — this is that memory, backed by a real table
// (migration_action_items.sql) rather than living only in one browser's
// localStorage the way Meeting Mode's decisions/actions currently do.
// Client-level, not period-scoped — see the migration's header note.
const ACTION_STATUS_META = {
  not_started: { label: 'To do' },
  in_progress: { label: 'In progress' },
  done: { label: 'Done' },
};
const ACTION_SOURCE_LABEL = {
  manual: 'Manual', meeting: 'Meeting', exit_readiness: 'Exit Readiness',
  continuity: 'Continuity', estate: 'Estate', risk: 'Risk', diagnose: 'Diagnose',
};

// Meeting priorities carry two different severity vocabularies depending
// on where the candidate came from — flags use 'danger'/'warning' (see
// runFlags), risk_items use 'High'/'Medium'/'Low' (see normalizeRiskItem-
// ToFlagShape) — normalized here into the one vocabulary Actions' priority
// badge understands.
function meetingPriorityToActionPriority(severity) {
  if (severity === 'danger' || severity === 'High') return 'High';
  if (severity === 'warning' || severity === 'Medium') return 'Medium';
  if (severity === 'Low') return 'Low';
  return null;
}

// Shared by every "+ Add to Actions" button across the app (Meeting,
// Exit Readiness, Business Continuity, the estate checklist) as well as
// the Actions view's own manual-add field — one call site for the actual
// write, so every entry point stays consistent without each one
// reimplementing the fetch.
async function addActionItem(text, source, priority, why) {
  const res = await fetch('/.netlify/functions/manual-entry', {
    method: 'POST',
    body: JSON.stringify({ type: 'save_action_item', client_id: currentClientId, text, source, priority: priority || null, why: why || null }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.saved;
}

// Shared dismiss/suggested-target state for the various "recommendation"
// surfaces (Financial flags, KPI improvement tips, Diagnose/Growth
// recommendations) — none of these have a real database id (they're
// derived fresh from that period's diagnostics/kpi_report each time), so
// rec_id is an opaque string built from whatever's stable about that item
// (a flag's own message text, a KPI's key, a recommendation's title — see
// the flag:/kpitip:/rec: prefixes at each call site). Dismissed items don't
// vanish outright, same reasoning as Risk's own status workflow: a bad call
// needs to be reversible, so callers render a "N dismissed — show" toggle
// rather than just dropping the row.
function getRecommendationState() {
  return currentCtx?.recommendation_state?.[currentPeriodEnd] || { dismissed: {}, suggestedTargets: {} };
}
function isRecDismissed(recId) {
  return !!getRecommendationState().dismissed[recId];
}
async function toggleRecDismissed(recId, dismissed) {
  const res = await fetch('/.netlify/functions/manual-entry', {
    method: 'POST',
    body: JSON.stringify({ type: 'save_recommendation_state', client_id: currentClientId, period_end: currentPeriodEnd, rec_id: recId, dismissed }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  if (!currentCtx.recommendation_state) currentCtx.recommendation_state = {};
  currentCtx.recommendation_state[currentPeriodEnd] = data.saved.period_state;
}
async function saveSuggestedTargetText(recId, text) {
  const res = await fetch('/.netlify/functions/manual-entry', {
    method: 'POST',
    body: JSON.stringify({ type: 'save_recommendation_state', client_id: currentClientId, period_end: currentPeriodEnd, rec_id: recId, suggested_target: text }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  if (!currentCtx.recommendation_state) currentCtx.recommendation_state = {};
  currentCtx.recommendation_state[currentPeriodEnd] = data.saved.period_state;
}

// A single visible confirmation for a background "+ Add to Actions" click
// made from another card (Exit Readiness, Continuity, the estate checklist,
// a domain brief's "What to do") — those buttons don't navigate anywhere,
// so without this the only feedback would be silence. Stays "✓ Added"
// rather than reverting to the original label after a timeout — reverting
// looked like nothing had happened and invited a second, duplicate click —
// with an inline "undo" next to it so removing a mistaken add doesn't need
// a trip to the Actions view.
function flashAddedToActions(btn, actionId) {
  const original = btn.textContent;
  btn.textContent = '✓ Added';
  btn.disabled = true;
  btn.insertAdjacentHTML('afterend', ` <button type="button" class="mini-link" data-undo-action-id="${actionId}">undo</button>`);
  btn.nextElementSibling.onclick = async (e) => {
    const undoBtn = e.currentTarget;
    undoBtn.disabled = true;
    try {
      await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'delete_action_item', id: actionId, client_id: currentClientId }),
      });
      btn.textContent = original;
      btn.disabled = false;
      undoBtn.remove();
    } catch (err) {
      alert('Error: ' + err.message);
      undoBtn.disabled = false;
    }
  };
}

// One button markup shared by every gap row across Exit Readiness,
// Business Continuity, and the estate checklist — each just supplies its
// own text/priority/source, and wireAddToActionsButtons (called once per
// page after the whole card set renders) wires all of them the same way.
function addToActionsButtonHtml(text, priority, source, why) {
  return `<button type="button" class="mini-link add-to-actions-btn" data-action-text="${escAttr(text)}" data-action-priority="${priority || ''}" data-action-source="${source}" data-action-why="${escAttr(why || '')}" style="font-size:11px; margin:0 0 8px;">+ Add to Actions</button>`;
}

function wireAddToActionsButtons(content) {
  content.querySelectorAll('.add-to-actions-btn').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const saved = await addActionItem(btn.dataset.actionText, btn.dataset.actionSource, btn.dataset.actionPriority || null, btn.dataset.actionWhy || null);
        flashAddedToActions(btn, saved.id);
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });
}

const ACTION_ITEM_OWNERS = ['Client', 'Adviser'];
let actionsOwnerFilter = '';
let actionsStatusFilter = '';
let actionsSourceFilter = '';
let actionsUrgencyFilter = '';
let actionsPriorityFilter = '';
// Set by a click on a row inside the Opening check-in's Outstanding Actions
// card, just before it flips to the full Actions view — read once, on that
// view's very next render, to scroll straight to and flash that one row
// instead of leaving the accountant to hunt for it in the full list.
let pendingActionJumpId = null;
// Same idea as the full Actions view's own filters, just scoped to the
// Outstanding Actions card's own (already not-done) item set — kept
// separate so filtering the compact pre-meeting card doesn't disturb
// whatever filter state the full Actions view has active.
let outstandingActionsUrgencyFilter = '';
let outstandingActionsOwnerFilter = '';
let outstandingActionsSourceFilter = '';
let outstandingActionsStatusFilter = '';

// One row of pills for one filter axis, shared by the full Actions view and
// the Outstanding Actions card — same "All" + per-value pill with a live
// count, same visual language as the Risk summary's own filter pills
// (riskFilterAxis). dataAttrPrefix keeps the two call sites' pills wired
// independently (data-${prefix}-axis/-value) so clicking one never touches
// the other's filter state.
function pillFilterRowHtml(label, dataAttrPrefix, axis, activeValue, options, allCount) {
  return `
    <div>
      <p class="muted" style="margin:10px 0 4px;">${label}</p>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button type="button" class="risk-filter-pill ${!activeValue ? 'active' : ''}" data-${dataAttrPrefix}-axis="${axis}" data-${dataAttrPrefix}-value="">All <span class="risk-filter-count">(${allCount})</span></button>
        ${options.map((o) => `<button type="button" class="risk-filter-pill ${activeValue === o.value ? 'active' : ''}" data-${dataAttrPrefix}-axis="${axis}" data-${dataAttrPrefix}-value="${o.value}">${o.icon ? o.icon + ' ' : ''}${o.label} <span class="risk-filter-count">(${o.count})</span></button>`).join('')}
      </div>
    </div>
  `;
}

// Overdue = has a due date, that date's passed, and it isn't done yet —
// same "don't flag what's already resolved" logic used everywhere else
// this app marks something as a gap (e.g. isGap on the estate checklist).
function isActionOverdue(item) {
  return !!item.due_date && item.status !== 'done' && item.due_date < new Date().toISOString().slice(0, 10);
}

// Grouped by URGENCY, not workflow status — "in progress" doesn't tell you
// whether to worry, "overdue" does. status (not_started/in_progress) is
// still tracked per-item via the status dropdown, it just isn't what
// organizes the page anymore. 14 days is the "due soon" window — no
// significance beyond "close enough to flag before it becomes overdue."
// caption spells out actionUrgencyBucket's own thresholds — worth stating
// explicitly since "Open" isn't just "no due date set" (an easy assumption
// to make from the label alone), it's also where anything due MORE than 14
// days out lands, same bucket either way.
const ACTION_URGENCY_META = {
  overdue: { label: 'Overdue', icon: '🔴', caption: 'Past its due date.' },
  due_soon: { label: 'Due soon', icon: '🟠', caption: 'Due within the next 14 days.' },
  open: { label: 'Open', icon: '⚪', caption: 'No due date yet, or due further out than 14 days.' },
  completed: { label: 'Completed', icon: '🟢' },
};
// Actions is client-level, not period-scoped (see its own header note) —
// it never resets, so completed items only ever accumulate. Collapsed by
// default so a client with a year of history doesn't bury what's actually
// still open under a long list of done ones.
let showCompletedActions = false;
function actionUrgencyBucket(item) {
  if (item.status === 'done') return 'completed';
  if (item.due_date) {
    const today = new Date().toISOString().slice(0, 10);
    const soonThreshold = new Date(Date.now() + 14 * 24 * 3600 * 1000).toISOString().slice(0, 10);
    if (item.due_date < today) return 'overdue';
    if (item.due_date <= soonThreshold) return 'due_soon';
  }
  return 'open';
}

// isNew: this item's created_at is at/after the current meeting's own
// created_at (see renderActionsView's sinceIso) — marked right on the row
// itself, inside the one real plan, rather than the plan being duplicated
// into a second "added this meeting" list sitting above it. Undefined/false
// outside Meeting Mode, where there's no meeting to compare against.
function actionItemRow(item, isNew) {
  const priorityBadge = item.priority ? `<span class="confidence-badge ${item.priority === 'High' ? 'red' : item.priority === 'Medium' ? 'yellow' : 'neutral'}">${item.priority}</span>` : '';
  const sourceBadge = `<span class="confidence-badge neutral">${ACTION_SOURCE_LABEL[item.source] || item.source}</span>`;
  const overdue = isActionOverdue(item);
  const overdueBadge = overdue ? `<span class="confidence-badge red">Overdue</span>` : '';
  const newBadge = isNew ? `<span class="confidence-badge green">🆕 This meeting</span>` : '';
  return `
    <div class="action-item-row ${item.status === 'done' ? 'done' : ''}" data-action-id="${item.id}">
      <div class="action-item-top">
        <p class="action-item-text" style="${item.status === 'done' ? 'text-decoration:line-through; color:var(--ink-soft);' : ''}">${escAttr(item.text)}</p>
        <div class="action-item-badges">${newBadge}${priorityBadge}${sourceBadge}${overdueBadge}</div>
      </div>
      ${item.why ? `<p class="action-item-why">${escAttr(item.why)}</p>` : ''}
      <div class="action-item-controls">
        <label class="action-item-field" title="Owner">👤
          <select class="action-item-owner">
            <option value="" ${!item.owner ? 'selected' : ''}>—</option>
            ${ACTION_ITEM_OWNERS.map((o) => `<option value="${o}" ${item.owner === o ? 'selected' : ''}>${o}</option>`).join('')}
          </select>
        </label>
        <label class="action-item-field" title="Due date">📅
          <input type="date" class="action-item-due" value="${item.due_date || ''}" style="${overdue ? 'color:var(--rust); border-color:var(--rust);' : ''}" />
        </label>
        <label class="action-item-field" title="Status">🔄
          <select class="action-item-status">
            ${Object.entries(ACTION_STATUS_META).map(([val, meta]) => `<option value="${val}" ${item.status === val ? 'selected' : ''}>${meta.label}</option>`).join('')}
          </select>
        </label>
        <button type="button" class="action-item-remove cash-adj-remove" title="Remove">✕</button>
      </div>
    </div>
  `;
}

// Every inline edit (status/owner/due date) resends the item's other
// fields unchanged, same "full row, single endpoint" shape saveActionItem
// expects — one shared call site so status/owner/due-date edits can't
// drift into three slightly different payload shapes.
async function updateActionItem(id, item, changes) {
  await fetch('/.netlify/functions/manual-entry', {
    method: 'POST',
    body: JSON.stringify({
      type: 'save_action_item', id, client_id: currentClientId,
      text: item.text, source: item.source, priority: item.priority,
      status: item.status, owner: item.owner, due_date: item.due_date, why: item.why,
      ...changes,
    }),
  });
}

// sinceIso: only passed from Meeting Mode's own 'actions' step (brief's
// created_at) — this used to be a completely unsummarized re-show of the
// standalone Action Plan tab, the one meeting step that never got the
// "brief" treatment every domain did. Doesn't replace the full list (still
// genuinely useful as "the full board including what we just decided," see
// MEETING_STEPS' own ordering comment) — just adds the one thing missing:
// a quick recap of what's actually new from THIS conversation, since by
// the time you reach this step there could be quick-adds from four
// different domain briefs plus Priorities mixed into however much history
// already existed, with no way to tell which is which.
async function renderActionsView(content, sinceIso) {
  const myToken = renderToken;
  const data = await callRead('get_action_items', currentClientId);
  if (myToken !== renderToken) return;
  await drawActionsView(content, sinceIso, data?.items || []);
}

// Split from renderActionsView above so a pure filter/stat-tile click can
// redraw INSTANTLY from data already in hand, instead of re-awaiting a full
// get_action_items round-trip it doesn't actually need — that round-trip
// was the real cause of "I clicked Overdue but still see all actions":
// the click registered immediately, but the list didn't visibly update
// until the fetch resolved, which reads as "the pill doesn't do anything"
// even though it does, just late. Only handlers that actually change data
// (add/status/owner/due-date/delete) still call renderActionsView to
// refetch; every filter-only handler below calls this directly.
async function drawActionsView(content, sinceIso, allItems) {
  const myToken = renderToken;
  const addedThisMeeting = sinceIso ? allItems.filter((it) => it.created_at && it.created_at >= sinceIso).sort((a, b) => (a.created_at || '').localeCompare(b.created_at || '')) : [];
  // Faceted, not independent — each axis's own pill counts are computed
  // against the OTHER three axes' current selections (excluding itself), so
  // e.g. Source's counts always reflect whatever Urgency/Owner/Status are
  // currently set to, the same "count of what clicking this would actually
  // show" faceted-search behaviour the Risk summary's own filter pills use
  // (see riskFilterAxis).
  // '__unassigned__' is a sentinel actionsOwnerFilter value (set only by
  // the Action Plan header's "Unassigned" stat, see planSummaryHtml/its
  // wiring below) — no owner pill for it exists since ACTION_ITEM_OWNERS
  // only lists real owners, but the filter still needs to recognize it as
  // "no owner set" rather than literally matching an owner string.
  const facetItems = (excludeAxis) => allItems.filter((it) =>
    (excludeAxis === 'urgency' || !actionsUrgencyFilter || actionUrgencyBucket(it) === actionsUrgencyFilter) &&
    (excludeAxis === 'source' || !actionsSourceFilter || (it.source || 'manual') === actionsSourceFilter) &&
    (excludeAxis === 'owner' || !actionsOwnerFilter || (actionsOwnerFilter === '__unassigned__' ? !it.owner : it.owner === actionsOwnerFilter)) &&
    (excludeAxis === 'status' || !actionsStatusFilter || it.status === actionsStatusFilter) &&
    (excludeAxis === 'priority' || !actionsPriorityFilter || it.priority === actionsPriorityFilter));
  const items = facetItems(null);
  // Grouped by WHO'S DOING IT, not just urgency — a plan's actual job is
  // answering "who owns what," which a flat overdue/open/completed list
  // never showed (owner sat buried in a small per-row dropdown). Unassigned
  // leads: an action nobody owns yet is the most planning-relevant gap to
  // surface, ahead of ones already assigned to someone. Urgency isn't lost
  // — isActionOverdue's red styling still marks each row's own due date —
  // it's just no longer the PRIMARY grouping.
  const activeItems = items.filter((it) => it.status !== 'done');
  const completedItems = items.filter((it) => it.status === 'done');
  const byDueDate = (a, b) => (a.due_date || '9999-99-99').localeCompare(b.due_date || '9999-99-99');
  const OWNER_LANES = [
    { key: 'Unassigned', label: '<span style="color:var(--brass);">⚠ Unassigned</span>', match: (it) => !it.owner },
    { key: 'Client', label: '👤 Client', match: (it) => it.owner === 'Client' },
    { key: 'Adviser', label: '👤 Adviser', match: (it) => it.owner === 'Adviser' },
  ];
  const byOwnerLane = OWNER_LANES.map((lane) => ({ ...lane, rows: activeItems.filter(lane.match).sort(byDueDate) }));
  completedItems.sort((a, b) => (b.completed_at || '').localeCompare(a.completed_at || ''));
  // Filtering to "Done"/"Completed" (Status pill OR the header's "Done"
  // stat) is a request to actually see the completed ones — force the
  // section open rather than making someone also toggle "Show completed"
  // on top of a filter they just set. completedForcedByFilter is the same
  // condition minus the manual toggle — used below to also fix the label
  // itself: without it, clicking the header's "Done" tile correctly
  // revealed the completed items but the button above them still read
  // "Show 2 completed actions ▾" as if nothing had happened yet.
  const completedForcedByFilter = actionsStatusFilter === 'done' || actionsUrgencyFilter === 'completed';
  const effectiveShowCompleted = showCompletedActions || completedForcedByFilter;

  // Only offer a way back when Actions is being viewed as its own tab (not
  // already inside the meeting wizard's own Actions step, which already has
  // Back in its nav bar), you actually arrived via a "View in Actions" link
  // (cameFromMeetingLink — see its own comment; a merely-unfinished meeting
  // isn't reason enough on its own), and there's still something unfinished
  // to return to.
  const inProgressMeeting = (currentWorkflow === 'input' && cameFromMeetingLink) ? await loadMeetingWithFallback() : null;
  const backToMeetingHtml = (inProgressMeeting && !inProgressMeeting.completed) ? `<button class="mini-link" id="back-to-meeting-btn" type="button" style="margin-bottom:8px;">← Back to meeting</button>` : '';

  // One pill row per axis (source/status), each built from whatever's
  // ACTUALLY on file rather than a fixed list — a source with zero items
  // on this client just doesn't get a pill, same reasoning as the Risk
  // summary's own axes.
  // Urgency and Owner pill rows dropped — the header's clickable stat tiles
  // (below) now cover exactly what those two rows did (Overdue/Done,
  // Client/Adviser/Unassigned), so keeping both was two controls for the
  // same filter, one of them a wall of pills that "didn't do anything" a
  // click on the header hadn't already covered. Relates-to and Status have
  // no header equivalent, so they're the only pill rows left.
  // Scoped to ACTIVE items only (status !== 'done') — matches "Active" in
  // the header. Without this, "All" here counted every item including the
  // 2 completed ones (9), sitting right under a header that just said 7 —
  // two different numbers both claiming to be "everything," for no reason
  // anyone looking at the screen could tell. Completed items are reachable
  // via the header's own "Done" tile or the toggle further down, not
  // through these two pill rows, so "done" is also dropped as a Status
  // pill option — it was a second path to the exact same filter the Done
  // tile already sets.
  const activeFacetItems = (excludeAxis) => facetItems(excludeAxis).filter((it) => it.status !== 'done');
  const filterAxisHtml = (label, axis, activeValue, options) => pillFilterRowHtml(label, 'actions-filter', axis, activeValue, options, activeFacetItems(axis).length);
  const sourcesPresent = [...new Set(activeFacetItems('source').map((it) => it.source || 'manual'))];
  const sourceOptions = sourcesPresent.map((key) => ({
    value: key, label: ACTION_SOURCE_LABEL[key] || key,
    count: activeFacetItems('source').filter((it) => (it.source || 'manual') === key).length,
  })).filter((o) => o.count > 0 || actionsSourceFilter === o.value);
  const statusOptions = Object.entries(ACTION_STATUS_META)
    .filter(([val]) => val !== 'done')
    .map(([val, meta]) => ({ value: val, label: meta.label, count: activeFacetItems('status').filter((it) => it.status === val).length }));

  // Plan-level shape at a glance, computed from allItems (never affected by
  // the filter pills below it — a "plan" summary that shrank every time you
  // filtered would misrepresent the actual plan, not describe it).
  // "Active" (not "Open") deliberately avoids the word the Urgency axis
  // used for its OWN, narrower bucket (excluding Overdue) — two different
  // things both labelled "Open" was exactly the "numbers keep changing"
  // confusion being fixed here.
  const totalActive = allItems.filter((it) => it.status !== 'done').length;
  const overdueCount = allItems.filter(isActionOverdue).length;
  const doneCount = allItems.filter((it) => it.status === 'done').length;
  const highPriorityCount = allItems.filter((it) => it.priority === 'High' && it.status !== 'done').length;
  // status !== 'done' on all three — without it, an owner whose ONLY item
  // happened to already be marked done showed a real count (e.g. "1") that
  // then filtered to an apparently-empty list: the owner-lane view only
  // ever shows active items, and clicking one of these tiles didn't also
  // force the (collapsed-by-default) completed section open, so the 1
  // matching row was real but invisible. Also the reason Client+Adviser+
  // Unassigned silently summed to 8 while "Active" said 7 — now all three
  // describe the same 7 active items' ownership, so they sum correctly.
  const clientOwnedCount = allItems.filter((it) => it.owner === 'Client' && it.status !== 'done').length;
  const adviserOwnedCount = allItems.filter((it) => it.owner === 'Adviser' && it.status !== 'done').length;
  const unassignedCount = allItems.filter((it) => !it.owner && it.status !== 'done').length;
  // An actual sentence, not just numbers — "what IS the plan" needs a
  // one-line answer in words, the same reasoning every domain brief's own
  // so-what line uses, not a stat strip standing in for one.
  const planSentence = totalActive === 0
    ? 'Nothing open — the plan is clear.'
    : `${totalActive} action${totalActive === 1 ? '' : 's'} open${overdueCount ? `, ${overdueCount} overdue` : ''}${highPriorityCount ? `, ${highPriorityCount} high priority` : ''}${unassignedCount ? `, ${unassignedCount} without an owner yet` : ''}.`;
  // Clickable, not just decorative — each drives the same filter state the
  // pill rows below use (click again to clear), so the header is a genuine
  // shortcut into the list, not a static summary sitting above the actual
  // controls. Colour-coded (rust/sage/brass) rather than uniform black —
  // this screen was the one flat, monochrome spot next to every other
  // brief's use of colour for severity/status. "Active" is now clickable
  // too — it's the "clear every filter, show me everything open" reset,
  // not tied to one single axis the way the others are.
  const addedIds = new Set(addedThisMeeting.map((it) => it.id));
  const divider = `<div style="border-top:1px solid var(--line); margin:16px 0 14px;"></div>`;
  // Which stat is the one currently shaping the visible list — "Active"
  // is the implicit default (nothing else selected), so it now lights up
  // too when none of the other six are — previously it never highlighted
  // at all, which read as "clicking this does nothing" even after using
  // it to clear a filter back to the default view.
  const activeStat = actionsUrgencyFilter === 'overdue' ? 'overdue'
    : actionsPriorityFilter === 'High' ? 'high_priority'
    : actionsUrgencyFilter === 'completed' ? 'done'
    : actionsOwnerFilter === 'Client' ? 'client'
    : actionsOwnerFilter === 'Adviser' ? 'adviser'
    : actionsOwnerFilter === '__unassigned__' ? 'unassigned'
    : 'active';
  const statCls = (key) => `cash-net-stat${activeStat === key ? ' active' : ''}`;

  // Everything below used to be 4-6 separate stacked .card boxes (header
  // stats, a filter card, one card PER owner lane, a completed card) — each
  // one reads as its OWN independent widget, which is exactly what made
  // "is All actions separate from the stats above it?" a reasonable
  // question to ask. It isn't separate — it's all one plan. Now it's
  // rendered as ONE card with internal dividers, so the stats, the filters,
  // and the list are visibly sections of the same thing, not different
  // things sitting next to each other.
  const planCardHtml = `
    <div class="card">
      <p class="muted">Action Plan</p>
      ${allItems.length ? `
        <p class="brief-sowhat">${escAttr(planSentence)}</p>
        <div class="brief-figures">
          <button type="button" class="${statCls('active')}" data-plan-stat="active" title="Click to clear filters"><div class="v">${totalActive}</div><div class="l">Active</div></button>
          <button type="button" class="${statCls('overdue')}" data-plan-stat="overdue" title="Click to filter"><div class="v" style="color:var(--rust);">${overdueCount}</div><div class="l">Overdue</div></button>
          <button type="button" class="${statCls('high_priority')}" data-plan-stat="high_priority" title="Click to filter"><div class="v">${highPriorityCount}</div><div class="l">High priority</div></button>
          <button type="button" class="${statCls('done')}" data-plan-stat="done" title="Click to filter"><div class="v" style="color:var(--sage);">${doneCount}</div><div class="l">Done</div></button>
          <button type="button" class="${statCls('client')}" data-plan-stat="client" title="Click to filter"><div class="v">${clientOwnedCount}</div><div class="l">Client owns</div></button>
          <button type="button" class="${statCls('adviser')}" data-plan-stat="adviser" title="Click to filter"><div class="v">${adviserOwnedCount}</div><div class="l">Adviser owns</div></button>
          <button type="button" class="${statCls('unassigned')}" data-plan-stat="unassigned" title="Click to filter"><div class="v" style="color:var(--brass);">${unassignedCount}</div><div class="l">Unassigned</div></button>
        </div>
        <p class="muted plain" style="margin:8px 0 0; font-size:11px;">${activeStat !== 'active' ? 'Filtered — click the highlighted number again to clear.' : 'Click a number above to filter the list below — the highlighted one is what you\'re currently seeing.'}${currentWorkflow === 'meeting' && sinceIso ? ' 🆕 marks anything added since this meeting started.' : ''}</p>
      ` : `<p class="muted plain" style="margin:0 0 14px;">Nothing here yet — add one below, or use "+ Add to Actions" from Meeting, Exit Readiness, Business Continuity, or the estate checklist.</p>`}

      ${divider}
      <div class="cash-item" style="flex-wrap:wrap; padding:0;">
        <input type="text" id="action-new-text" placeholder="Add an action…" style="flex:1 1 auto; min-width:200px; border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); font-size:13px; font-family:var(--font-body); color:var(--ink); padding:8px 10px;" />
        <select id="action-new-owner" style="font-size:12px; font-family:var(--font-body); border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); color:var(--ink); padding:8px;">
          <option value="">Owner: —</option>
          ${ACTION_ITEM_OWNERS.map((o) => `<option value="${o}">${o}</option>`).join('')}
        </select>
        <label style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--ink-soft);" title="Due date">📅
          <input type="date" id="action-new-due" style="font-size:12px; font-family:var(--font-body); border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); color:var(--ink); padding:7px 8px;" />
        </label>
        <button class="action" id="action-add-btn" type="button">Add</button>
      </div>

      ${allItems.length ? `
        ${completedForcedByFilter ? '' : `
          ${filterAxisHtml('Relates to', 'source', actionsSourceFilter, sourceOptions)}
          ${filterAxisHtml('Status', 'status', actionsStatusFilter, statusOptions)}
        `}
        ${divider}
        ${byOwnerLane.map((lane) => {
          if (!lane.rows.length) return '';
          const overdueInLane = lane.rows.filter(isActionOverdue).length;
          return `
            <p class="card-label" style="margin:0 0 6px;">${lane.label} (${lane.rows.length})${overdueInLane ? ` <span style="color:var(--rust); font-weight:normal;">— ${overdueInLane} overdue</span>` : ''}</p>
            ${lane.rows.map((it) => actionItemRow(it, addedIds.has(it.id))).join('')}
          `;
        }).join('')}
        ${completedItems.length ? `
          ${completedForcedByFilter ? `<p class="card-label" style="margin:14px 0 6px;">${ACTION_URGENCY_META.completed.icon} ${completedItems.length} completed action${completedItems.length === 1 ? '' : 's'}</p>` : `<button type="button" class="add-item-link" id="toggle-completed-actions-btn" style="margin-top:14px;">${showCompletedActions ? 'Hide' : 'Show'} ${ACTION_URGENCY_META.completed.icon} ${completedItems.length} completed action${completedItems.length === 1 ? '' : 's'} ${showCompletedActions ? '▴' : '▾'}</button>`}
          ${effectiveShowCompleted ? `<div style="margin-top:10px;">${completedItems.map((it) => actionItemRow(it, addedIds.has(it.id))).join('')}</div>` : ''}
        ` : ''}
        ${!items.length ? `<p class="muted plain" style="margin:14px 0 0;">Nothing matches the current filter.</p>` : ''}
      ` : ''}
    </div>
  `;

  content.innerHTML = `
    ${backToMeetingHtml}
    ${planCardHtml}
  `;

  const addNew = async () => {
    const input = document.getElementById('action-new-text');
    const text = input.value.trim();
    if (!text) return;
    const btn = document.getElementById('action-add-btn');
    btn.disabled = true;
    try {
      const owner = document.getElementById('action-new-owner').value || null;
      const dueDate = document.getElementById('action-new-due').value || null;
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'save_action_item', client_id: currentClientId, text, source: 'manual', owner, due_date: dueDate }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      await renderActionsView(content, sinceIso);
    } catch (err) {
      alert('Error: ' + err.message);
      btn.disabled = false;
    }
  };
  document.getElementById('action-add-btn').onclick = addNew;
  document.getElementById('action-new-text').onkeydown = (e) => { if (e.key === 'Enter') addNew(); };

  content.querySelectorAll('[data-actions-filter-axis]').forEach((pill) => {
    pill.onclick = () => {
      const axis = pill.dataset.actionsFilterAxis;
      const value = pill.dataset.actionsFilterValue;
      if (axis === 'urgency') actionsUrgencyFilter = value;
      else if (axis === 'source') actionsSourceFilter = value;
      else if (axis === 'owner') actionsOwnerFilter = value;
      else if (axis === 'status') actionsStatusFilter = value;
      drawActionsView(content, sinceIso, allItems);
    };
  });

  content.querySelectorAll('[data-plan-stat]').forEach((btn) => {
    btn.onclick = () => {
      const stat = btn.dataset.planStat;
      // These 6 tiles are mutually EXCLUSIVE — clicking one now always
      // clears whichever other tile was active first, rather than ANDing
      // on top of it. That AND-ing was the real bug behind "sometimes you
      // have to click something else, or Active, or again, before it
      // works": clicking "Client owns" right after "Overdue" silently
      // filtered to Overdue-AND-Client (usually 0 results, since the two
      // rarely overlap), not just Client, with nothing on screen showing
      // Overdue was still secretly applied. Clicking the SAME tile again
      // still toggles it off (back to the unfiltered "Active" view).
      const wasActive = activeStat === stat;
      actionsUrgencyFilter = '';
      actionsPriorityFilter = '';
      actionsOwnerFilter = '';
      if (!wasActive) {
        if (stat === 'overdue') actionsUrgencyFilter = 'overdue';
        else if (stat === 'high_priority') actionsPriorityFilter = 'High';
        else if (stat === 'done') actionsUrgencyFilter = 'completed';
        else if (stat === 'client') actionsOwnerFilter = 'Client';
        else if (stat === 'adviser') actionsOwnerFilter = 'Adviser';
        else if (stat === 'unassigned') actionsOwnerFilter = '__unassigned__';
        // stat === 'active' falls through here too — already cleared above.
      }
      drawActionsView(content, sinceIso, allItems);
    };
  });

  const backToMeetingBtn = document.getElementById('back-to-meeting-btn');
  if (backToMeetingBtn) {
    backToMeetingBtn.onclick = async () => {
      currentDomain = 'actions';
      currentWorkflow = 'meeting';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
    };
  }

  const toggleCompletedBtn = document.getElementById('toggle-completed-actions-btn');
  if (toggleCompletedBtn) {
    toggleCompletedBtn.onclick = () => {
      showCompletedActions = !showCompletedActions;
      drawActionsView(content, sinceIso, allItems);
    };
  }

  content.querySelectorAll('[data-action-id]').forEach((row) => {
    const id = row.dataset.actionId;
    const item = items.find((it) => it.id === id);
    row.querySelector('.action-item-status').onchange = async (e) => {
      try {
        await updateActionItem(id, item, { status: e.target.value });
        await renderActionsView(content, sinceIso);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
    row.querySelector('.action-item-owner').onchange = async (e) => {
      try {
        await updateActionItem(id, item, { owner: e.target.value || null });
        await renderActionsView(content, sinceIso);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
    row.querySelector('.action-item-due').onchange = async (e) => {
      try {
        await updateActionItem(id, item, { due_date: e.target.value || null });
        await renderActionsView(content, sinceIso);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
    row.querySelector('.action-item-remove').onclick = async () => {
      if (!confirm('Remove this action?')) return;
      try {
        await fetch('/.netlify/functions/manual-entry', {
          method: 'POST',
          body: JSON.stringify({ type: 'delete_action_item', id, client_id: currentClientId }),
        });
        await renderActionsView(content, sinceIso);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
  });

  // Land straight on the action a click from the Outstanding Actions card
  // (Opening check-in) jumped in for — see pendingActionJumpId — instead of
  // leaving the accountant to scan every urgency bucket to find it again.
  if (pendingActionJumpId) {
    const jumpId = pendingActionJumpId;
    pendingActionJumpId = null;
    const row = content.querySelector(`[data-action-id="${jumpId}"]`);
    if (row) {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('kpi-card-flash');
      setTimeout(() => row.classList.remove('kpi-card-flash'), 1600);
    }
  }
}

// ---- Risk: Analyse ----
// Rolls up all sources sharing risk_items (financial/business/industry, see
// lib/financial-risk-sync.js, lib/business-risk-questionnaire.js,
// lib/industry-risk-checklist.js) into one view, in that order — the order
// the accountant would actually work through them: the numbers first
// (already computed), then what only a human can answer, then general
// industry context last. Financial is period-scoped, so it reads for
// currentPeriodEnd like every other Analyse tab; industry and business
// don't change per period (see read-data.js's get_risk_items), so both
// always show the client's full history regardless of which period is
// selected.
const RISK_SOURCE_META = {
  financial: { label: 'Financial', hint: 'Detected automatically from this period’s ratios and trends.' },
  business: { label: 'Business', hint: 'From check-in questions only a human can answer.' },
  industry: { label: 'Industry', hint: 'AI-generated from this client’s industry — general knowledge, not verified. Review each one.' },
  owner_wealth: { label: 'Owner & Succession', hint: 'From Owner & Succession’s estate planning checklist and succession readiness/pathway — edit the source there, not here.' },
};
const RISK_SEVERITY_BADGE = { High: 'red', Medium: 'yellow', Low: 'green' };
const RISK_STATUS_BADGE = { Detected: 'red', Identified: 'yellow', Watch: 'yellow', Managed: 'green', 'Not applicable': 'green', Unknown: 'yellow' };
const RISK_REVIEW_ACTIONS = [
  ['confirm', 'Confirm'], ['investigate', 'Investigate'],
  ['not_applicable', 'Not applicable'], ['no_longer_a_risk', 'No longer a risk'],
];

// "Get more advice" — on-demand, per-risk AI call (risk-advice.js), deeper
// and client-specific vs. the stored recommendation/talking point already
// shown next to it (that one's either frozen at creation time or a generic
// hardcoded line, see risk-advice.js's own header comment). Shared between
// riskItemRow (full detail) and the Risk brief's Top risks rows so the same
// button/behavior is available whether or not you've clicked through — see
// the delegated '.risk-advice-btn' handler on #tab-content for the wiring.
// Data needed for the API call rides on the button itself (data-risk-*)
// rather than a lookup table, and the content div is the button's own next
// sibling (not a getElementById'd id) since riskItemRow can render the same
// risk_items row twice on one page — an id would collide.
function riskAdviceButtonHtml(r) {
  return `
    <div style="margin-top:6px;">
      <button type="button" class="mini-link risk-advice-btn" style="margin-left:0;"
        data-risk-name="${escAttr(r.risk_name)}" data-risk-detail="${escAttr(r.detail || '')}"
        data-risk-category="${escAttr(r.category || '')}" data-risk-source="${escAttr(r.source || '')}"
        data-risk-severity="${escAttr(r.severity || '')}">✨ Get more advice</button>
      <div class="risk-advice-content muted plain" style="display:none; font-style:italic; margin-top:4px;"></div>
    </div>
  `;
}
function capitalizeWord(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// A "no risk identified" row from a question's no-risk branch (see
// submitQuestionAnswer) never gets a recommendation — a real risk always
