      </div>
      <p style="font-size:11px; color:var(--ink-soft); margin-top:8px; font-style:italic;">Rough estimate — assumes this period's cash conversion rate holds, unless overridden above, plus any one-off amounts entered. Doesn't account for capex, debt, drawings, or tax payment timing beyond what's typed in.</p>
    </div>
  `;
}

// Wiring for renderCashOutlookCard's markup — pulled out into its own
// function so it can be called from wherever that card is mounted: the
// Financial Performance → Analyse screen (its original home) and the
// Meeting's Financial brief (meeting-intelligence-build-spec.md §4),
// without duplicating the recalc logic between them.
function wireCashOutlookCard(snapshot, kpis) {
  const cashOutlookUnit = document.getElementById('cash-outlook-unit');
  if (!cashOutlookUnit || !snapshot?.revenue || snapshot?.net_profit == null) return;
  const conversion = kpis.find((k) => k.key === 'op_cash_conversion')?.value;
  const cashProfitValueEl = document.getElementById('cash-outlook-profit-value');
  const cashValueEl = document.getElementById('cash-outlook-value');
  const cashValueBoxEl = document.getElementById('cash-outlook-value-box');
  const cashProvenanceEl = document.getElementById('cash-outlook-provenance');
  const cashBuildupEl = document.getElementById('cash-outlook-buildup');
  const cashRevenueInput = document.getElementById('cash-outlook-revenue');
  const cashGpInput = document.getElementById('cash-outlook-gp');
  const cashOpexInput = document.getElementById('cash-outlook-opex');
  const cashNetProfitInput = document.getElementById('cash-outlook-netprofit');
  const cashNetProfitAbsoluteInput = document.getElementById('cash-outlook-netprofit-absolute');
  const cashConversionInput = document.getElementById('cash-outlook-conversion');
  const cashOneOffIncomeInput = document.getElementById('cash-outlook-oneoff-income');
  const cashOneOffExpenseInput = document.getElementById('cash-outlook-oneoff-expense');
  const cashSuperInput = document.getElementById('cash-outlook-super');
  const cashEquipmentInput = document.getElementById('cash-outlook-equipment');
  // Always genuine dollar figures regardless of the Change-amounts-as %/$
  // toggle (that only affects the revenue/GP/opex/net-profit CHANGE rows) —
  // cash-outlook-conversion is deliberately excluded, it's a rate (%), not $.
  [cashNetProfitAbsoluteInput, cashOneOffIncomeInput, cashOneOffExpenseInput, cashSuperInput, cashEquipmentInput].forEach((el) => wireMoneyInputPreview(el));
  // These 4 flip between %/$ with the toggle — only preview as money while
  // it currently means dollars (see wireMoneyInputPreview's isActive).
  [cashRevenueInput, cashGpInput, cashOpexInput, cashNetProfitInput].forEach((el) => wireMoneyInputPreview(el, () => cashOutlookUnit.value === 'dollar'));
  const recalcCashOutlook = () => {
    cashOutlookState = { conversionOverride: cashConversionInput.value };
    persistScenarioState();
    // Nothing to show until an actual scenario's been entered — "0% change
    // everywhere" still computed a real number (this period's actual profit
    // × actual conversion rate, unchanged), which read as an automatic
    // answer nobody asked for. Same fix Tax outlook already got, same
    // condition panelOpen above already uses to decide whether this panel
    // starts expanded.
    const hasScenario = scenarioState.revenue !== 0 || scenarioState.gp !== 0 || scenarioState.opex !== 0 || scenarioState.netProfit !== 0
      || scenarioState.netProfitAbsolute !== '' || cashOutlookState.conversionOverride !== '' || scenarioState.oneOffIncome !== 0 || scenarioState.oneOffExpense !== 0
      || scenarioState.super !== 0 || scenarioState.equipment !== 0;
    if (!hasScenario) {
      cashProfitValueEl.textContent = '—';
      cashValueEl.textContent = '—';
      cashValueEl.style.color = '';
      cashValueBoxEl.style.background = 'var(--paper-raised)';
      // Names the actual baseline up front — otherwise the only place it
      // ever showed up was buried inside the Net profit change buildup
      // line, so anyone modeling via Revenue/GP instead never saw what
      // number they were actually moving away from.
      cashProvenanceEl.textContent = `This period's actual net profit is ${formatMoney(snapshot.net_profit)} — enter a scenario below to model a change.`;
      cashBuildupEl.innerHTML = '';
      return;
    }
    const r = computeCashOutlookResult(
      snapshot, conversion, scenarioState.unit,
      scenarioState.revenue, scenarioState.gp, scenarioState.opex, scenarioState.netProfit, scenarioState.netProfitAbsolute,
      cashOutlookState.conversionOverride, scenarioState.oneOffIncome, scenarioState.oneOffExpense,
      scenarioState.super, scenarioState.equipment
    );
    cashProfitValueEl.textContent = formatMoney(r.projectedProfit);
    cashValueEl.textContent = r.headline;
    // Was hardcoded sage (green) regardless of sign — a negative projected
    // cash flow read as good news. Colours by the actual sign of the
    // number, same green/rust pairing as everywhere else in the app. A pale
    // bg alone (sage-bg vs rust-bg are both very close to paper) barely
    // registers as coloured, so the value text itself carries the same
    // colour too — same reasoning as SCORE_TILE_COLORS elsewhere.
    const cashGood = r.projectedOCF >= 0;
    cashValueBoxEl.style.background = cashGood ? 'var(--sage-bg)' : 'var(--rust-bg)';
    cashValueEl.style.color = cashGood ? 'var(--sage)' : 'var(--rust)';
    cashProvenanceEl.textContent = r.provenance;
    cashBuildupEl.innerHTML = r.buildup;
  };
  scenarioRecalcs.push(recalcCashOutlook);
  // These 4 fields' meaning (and step) flips with the unit toggle — 1
  // makes sense for a percentage-point change, but is useless for a dollar
  // one (clicking a spinner from $0 to $20,000 one dollar at a time).
  const toggleStepFields = [cashRevenueInput, cashGpInput, cashOpexInput, cashNetProfitInput];
  const updateToggleSteps = () => {
    const step = cashOutlookUnit.value === 'dollar' ? '1000' : '1';
    toggleStepFields.forEach((el) => { el.step = step; el._moneyPreviewUpdate?.(); });
  };
  scenarioUnitSyncs.push(updateToggleSteps);
  // Shared fields sync through syncSharedScenarioField (updates
  // scenarioState, mirrors the value onto Tax outlook's matching input if
  // it's mounted, then reruns every registered recalc/step-sync) instead of
  // touching only this card's own local recalc — conversionOverride stays
  // purely local, it has no Tax outlook counterpart.
  cashOutlookUnit.onchange = () => syncSharedScenarioField('unit', 'cash', cashOutlookUnit.value);
  [
    [cashRevenueInput, 'revenue'], [cashGpInput, 'gp'], [cashOpexInput, 'opex'], [cashNetProfitInput, 'netProfit'],
    [cashNetProfitAbsoluteInput, 'netProfitAbsolute'], [cashOneOffIncomeInput, 'oneOffIncome'], [cashOneOffExpenseInput, 'oneOffExpense'],
    [cashSuperInput, 'super'], [cashEquipmentInput, 'equipment'],
  ].forEach(([el, key]) => { el.oninput = () => syncSharedScenarioField(key, 'cash', el.value); });
  cashConversionInput.oninput = recalcCashOutlook;
  recalcCashOutlook();

  const cashOutlookToggle = document.getElementById('cash-outlook-toggle');
  const cashOutlookPanel = document.getElementById('cash-outlook-panel');
  const openCashOutlookPanel = () => {
    cashOutlookPanel.style.display = 'block';
    cashOutlookToggle.querySelector('.chevron').textContent = '▴';
    cashOutlookPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
  cashOutlookToggle.onclick = () => {
    const willOpen = cashOutlookPanel.style.display === 'none';
    cashOutlookPanel.style.display = willOpen ? 'block' : 'none';
    cashOutlookToggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
  };
  document.getElementById('cash-outlook-provenance-link').onclick = openCashOutlookPanel;
  // The ⓘ info icon's own toggle is normally wired once, container-wide,
  // by renderHealthWheelBlock's own [data-kpi-info] delegation on the full
  // Financial Performance → Analyse page — this card is ALSO embedded in
  // the Meeting brief (renderFinancialBrief), which never mounts that
  // container-wide wiring at all, so the icon did nothing there. Wired
  // directly here instead so it works in either place this card appears.
  const cashInfoBtn = cashOutlookUnit.closest('.kpi-card')?.querySelector('[data-kpi-info]');
  if (cashInfoBtn) {
    cashInfoBtn.onclick = () => {
      const panel = cashInfoBtn.closest('.kpi-card')?.querySelector('.kpi-description');
      if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    };
  }
}

// Companion to the Tax category's KPI card, same slot the Cash category uses
// for "Where the cash went" — a standing answer to "can they actually afford
// this period's tax bill", always visible rather than only surfacing once it
// crosses a flag threshold (see the Tax affordability risk flag in analyze.js
// for the threshold version of this same comparison). Deliberately just
// income tax vs cash on hand — no GST/PAYG/super/FBT forecasting here.
// Shared by the card below and the Metric summary table row (renderKpiSummaryTable)
// so the two can never disagree on the same coverage figure/verdict — same
// lesson as every other badge-vs-text fix this session.
function computeTaxAffordability(snapshot) {
  const taxExpense = snapshot?.tax_expense;
  const cash = snapshot?.cash;
  // Only cash on hand is truly required — tax_expense being null (as opposed
  // to an explicit 0) is the normal state for a Sole trader/Partnership/Trust,
  // where the entity itself doesn't pay income tax directly, not a data gap.
  // Hiding the whole card on a null used to make this disappear for exactly
  // those entity types; treating null the same as an explicit 0 (below)
  // keeps the card and just states plainly there's nothing to cover.
  if (cash == null) return null;
  let interp;
  // Same >=1 boundary the backend affordability flag treats as "danger" —
  // below it, cash alone can't cover the bill, which is worth a color, not
  // just a sentence, so it reads at a glance mid-meeting.
  let colorClass = '';
  let coverage = null;
  if (taxExpense == null || taxExpense <= 0) {
    interp = 'No tax expense recorded this period.';
  } else {
    coverage = cash / taxExpense;
    colorClass = coverage >= 1 ? 'good' : 'bad';
    if (coverage >= 2) interp = `Cash on hand comfortably covers this period's tax expense (${coverage.toFixed(1)}x).`;
    else if (coverage >= 1) interp = `Cash on hand covers this period's tax expense (${coverage.toFixed(1)}x) — worth setting it aside before it's spent elsewhere.`;
    else if (coverage >= 0.5) interp = `Cash on hand covers about ${Math.round(coverage * 100)}% of this period's tax expense — worth planning for the shortfall.`;
    else interp = `Cash on hand covers only ${Math.round(coverage * 100)}% of this period's tax expense — funding this may be a stretch.`;
  }
  return { taxExpense, cash, coverage, colorClass, interp };
}
function renderTaxAffordabilityCard(snapshot) {
  const a = computeTaxAffordability(snapshot);
  if (!a) return '';
  const { taxExpense, cash, colorClass, interp } = a;
  // Same boxed-tile treatment as the Current tax position card right next
  // to it in this same group (background tint carries the verdict, see that
  // card's own rateBg) — reads as a matching pair instead of two different
  // visual languages for the same kind of content. The tint sits on CASH,
  // not tax expense — the amount owed isn't itself good/bad (see the Current
  // tax position card's own "no inherent good/bad" note), it's whether cash
  // on hand actually covers it that's the good/bad read here.
  const cashBg = colorClass === 'good' ? 'var(--sage-bg)' : colorClass === 'bad' ? 'var(--rust-bg)' : 'var(--paper)';
  return `
    <div class="kpi-card" data-kpi-card-key="tax_vs_cash">
      <div class="kpi-card-head"><p class="kpi-name" data-kpi-info="1" title="Click to see what this measures">Tax vs cash on hand <span class="kpi-info-icon">ⓘ</span></p></div>
      <p class="kpi-interp kpi-description" style="display:none;">Not whether the tax amount itself is right — that's the Current tax position card's job — just whether this period's tax bill could actually be paid from cash on hand today, without touching anything else. A business can be genuinely profitable and tax-efficient and still get caught short if the cash to cover the bill wasn't set aside as it came in.</p>
      <div style="display:flex; gap:12px; margin:4px 0 2px; flex-wrap:wrap;">
        <div style="background:var(--paper); border-radius:8px; padding:8px 12px; flex:1 1 110px; min-width:0;">
          <p class="kpi-value" style="margin:0;">${formatMoney(taxExpense)}</p>
          <p class="card-label" style="margin:2px 0 0;">Tax expense</p>
        </div>
        <div style="background:${cashBg}; border-radius:8px; padding:8px 12px; flex:1 1 110px; min-width:0;">
          <p class="kpi-value ${colorClass}" style="margin:0;">${formatMoney(cash)}</p>
          <p class="card-label" style="margin:2px 0 0;">Cash on hand</p>
        </div>
      </div>
      <p class="kpi-interp">${interp}</p>
    </div>
  `;
}

// Narrow, deliberately scoped version of "what's coming, if things grow" —
// projects revenue by a simple growth %, applies THIS period's own margin to
// get a projected profit, then estimates tax off that. Company is a flat
// rate so it's safe to estimate with zero owner-level data. Individual
// (sole trader) uses the FY2026-27 resident marginal brackets + a flat 2%
// Medicare levy — a real simplification (ignores LITO, the levy's low-income
// phase-in, and that brackets/rates change every year), which is exactly why
// this is labeled a rough estimate, not advice, everywhere it's shown.
// Partnership/Trust are deliberately NOT estimated: those are flow-through
// structures where the real tax depends on each partner's/beneficiary's own
// marginal rate and distribution split — data this app doesn't capture at
// all — so guessing a number there would be worse than showing nothing.
// Rates/thresholds/caps get reset almost every year, and a client's OLDER
// periods should keep using whatever was actually legislated for THEM, not
// silently inherit whatever's newest here — so this is keyed by FY, one
// entry per year, instead of a single flat "current" table. Add a new year
// by adding a new key; never edit an existing year's numbers in place
// (unless correcting a genuine mistake in that year's own figures) — that
// way rolling on to next year can't retroactively change what an adviser
// sees for a period they already reviewed under this year's rates.
// FY2026-27 — bracket2Rate is 15%, not 16%, reflecting the legislated cut to
// the lowest marginal rate from 1 July 2026 (2025 Federal Budget). Every
// OTHER figure here (thresholds, Medicare levy, super cap) is carried over
// unchanged from 2024-25, the last year this app has fully confirmed — those
// typically get indexed a little most years and haven't been verified for
// FY2026-27, so treat them as a starting point to check against the ATO, not
// a guarantee. Future years (e.g. modeling 2029) genuinely AREN'T legislated
// yet — no lookup table could have the right answer for those — so rather
// than guessing, taxRatesForFY falls back to the latest year actually
// entered here and taxRatesStatusLabel flags that it's a guess (see its own
// comment). The Tax outlook card shows the financial year detected from the
// period being analyzed purely as context ("you're looking at FY2026-27") —
// the adviser can always type in the real numbers for whatever year actually
// applies, rather than the app pretending to know them.
// This hardcoded entry is only the SEED — a brand-new install with nothing
// saved yet, or a fallback if the database can't be reached. Once
// migration_tax_rates_by_fy.sql is applied, hydrateTaxRatesByFY() (called
// once at startup, see the bottom of this script) merges in whatever's
// actually been saved from the Tax rates panel's "Save as a year's
// defaults" control — that's the version meant to be current; this literal
// object is not meant to be hand-edited as the yearly update path any more.
const TAX_RATES_BY_FY = {
  'FY2026-27': {
    taxFreeThreshold: 18200, bracket2Upper: 45000, bracket2Rate: 15, bracket3Upper: 135000, bracket3Rate: 30,
    bracket4Upper: 190000, bracket4Rate: 37, bracket5Rate: 45, medicareRate: 2, medicareThreshold: 24276,
    companyRate: 25, superCap: 30000,
  },
};
// The most recent year actually on file — NOT hardcoded, so a newly-saved
// (or newly-hydrated) year automatically becomes the new fallback/"latest"
// year everywhere this is used, with no separate constant to remember to
// bump. `let`, not `const` — recomputeDefaultTaxRates() reassigns both
// whenever TAX_RATES_BY_FY gains an entry (startup hydration, or a save from
// the panel), so every reader of these two always sees the current table,
// not a snapshot frozen at page load. FY string sort works lexically here
// (FY2026-27 < FY2027-28 < ...) as long as every key stays in this same
// "FYyyyy-yy" shape.
let DEFAULT_TAX_RATES_FY = Object.keys(TAX_RATES_BY_FY).sort().pop();
let DEFAULT_TAX_RATES = TAX_RATES_BY_FY[DEFAULT_TAX_RATES_FY];
function recomputeDefaultTaxRates() {
  DEFAULT_TAX_RATES_FY = Object.keys(TAX_RATES_BY_FY).sort().pop();
  DEFAULT_TAX_RATES = TAX_RATES_BY_FY[DEFAULT_TAX_RATES_FY];
}
// Looks up the table entry for the exact FY being modeled; falls back to the
// latest year on file when that FY hasn't been entered (a genuinely future
// year, or an older year nobody's added rates for yet) — "latest known" is a
// reasonable guess, not a claim that it's correct, which is exactly why that
// fallback case is what taxRatesStatusLabel's warning exists to flag.
function taxRatesForFY(fy) {
  return (fy && TAX_RATES_BY_FY[fy]) || DEFAULT_TAX_RATES;
}
// "FY2026-27" -> "FY2027-28" — just a sensible prefill for the "save as"
// FY field (rolling forward is the common case), not a constraint; the
// adviser can type over it to correct an existing year instead.
function nextFYLabel(fy) {
  const m = /^FY(\d{4})-(\d{2})$/.exec(fy || '');
  if (!m) return '';
  const nextStart = Number(m[1]) + 1;
  return `FY${nextStart}-${String(nextStart + 1).slice(-2)}`;
}
// Two independent copies, not one shared object — Current tax position (this
// period's actual, factual tax position) and Tax outlook (a what-if scenario
// that might deliberately model a DIFFERENT — even future — year's rates)
// answer genuinely different questions. They used to share one taxRatesState,
// which meant hand-editing rates while exploring a scenario in Outlook would
// silently overwrite what Current tax position showed for the real period —
// confusing at best, wrong at worst. Now editing one never touches the
// other; the only thing still shared between them is TAX_RATES_BY_FY itself
// (see saveFyBtn in wireTaxRatesPanel) — saving a year's rates from EITHER
// card is a genuine fact about that year, not a scenario, so that part
// staying shared is correct.
let taxOutlookRatesState = { ...DEFAULT_TAX_RATES };
let taxPositionRatesState = { ...DEFAULT_TAX_RATES };
// A client's own company tax rate (set on Profile — profile_extra.company_
// tax_rate, no migration needed, same ad-hoc-field pattern as posture/
// goal_horizon_years) seeds this table's companyRate when THAT client
// loads, instead of every client silently starting from the same hardcoded
// 25% until the adviser notices and hand-edits it here. Everything else
// still comes from taxRatesForFY(detectedFY) — this override is deliberately
// narrow (see the Profile field's own comment for why the fuller bracket
// table isn't persisted this way). detectedFY is optional (some call sites
// resolve before a period's picked yet) — falls back to the latest year on
// file the same way taxRatesForFY does.
function resolveTaxRatesForClient(ctx, detectedFY) {
  const companyRate = Number(ctx?.profile_extra?.company_tax_rate);
  return { ...taxRatesForFY(detectedFY), ...(companyRate > 0 ? { companyRate } : {}) };
}
// Called once at startup (see loadClients() at the bottom of this script) —
// merges whatever's actually been saved to tax_rates_by_fy on top of the
// hardcoded seed entry above, so a year saved from the panel (on any device,
// by anyone) becomes what every client sees, not just the browser it was
// typed into. If a client's already loaded by the time this resolves (should
// be rare — this fires in parallel with the very first loadClients call),
// re-resolves BOTH cards' rates and refreshes any open rate panel so nothing
// briefly shows the seed year's numbers and then silently swaps. Resolves
// both independently (not from one shared value) — same reasoning as the
// split above.
async function hydrateTaxRatesByFY() {
  try {
    const saved = await callRead('get_tax_rates_by_fy');
    if (saved && typeof saved === 'object') Object.assign(TAX_RATES_BY_FY, saved);
  } catch (err) {
    // Table not migrated yet, or a network hiccup — the hardcoded seed
    // entry above is a perfectly good fallback, so this fails silently
    // rather than blocking app startup over it.
  }
  recomputeDefaultTaxRates();
  if (currentClientId) {
    taxOutlookRatesState = resolveTaxRatesForClient(currentCtx, auFinancialYearLabel(currentPeriodEnd));
    taxPositionRatesState = resolveTaxRatesForClient(currentCtx, auFinancialYearLabel(currentPeriodEnd));
    taxRatesPanelRefreshers.forEach((fn) => fn());
  }
}
// Maps each rates-object key to the id suffix every rate-editor copy on
// this screen uses (Tax outlook's own ids are literally tr-threshold etc;
// the Current tax position card's are tax-position-tr-threshold etc — see
// renderTaxRatesPanel) — shared so refreshTaxRatesInputs can re-populate
// either copy's input values from ITS OWN rates object.
const TAX_RATE_FIELD_SUFFIXES = {
  taxFreeThreshold: 'threshold', bracket2Upper: 'b2-upper', bracket2Rate: 'b2-rate',
  bracket3Upper: 'b3-upper', bracket3Rate: 'b3-rate', bracket4Upper: 'b4-upper', bracket4Rate: 'b4-rate',
  bracket5Rate: 'b5-rate', medicareRate: 'medicare-rate', medicareThreshold: 'medicare-threshold',
  companyRate: 'company-rate', superCap: 'super-cap',
};
// Which of the above are genuine dollar amounts (thresholds/caps) vs a rate
// (%) — only the former get the step="1000"/comma-preview treatment (see
// renderTaxRatesPanel and wireTaxRatesPanel below); a "37" in a rate field
// has no business previewing as "$37".
const MONEY_TAX_RATE_KEYS = new Set(['taxFreeThreshold', 'bracket2Upper', 'bracket3Upper', 'bracket4Upper', 'medicareThreshold', 'superCap']);
function refreshTaxRatesInputs(idPrefix, rates) {
  Object.entries(TAX_RATE_FIELD_SUFFIXES).forEach(([key, suffix]) => {
    const el = document.getElementById(`${idPrefix}${suffix}`);
    if (el) { el.value = rates[key]; el._moneyPreviewUpdate?.(); }
  });
}
// Each mounted rate-editor copy registers its own refresh callback here —
// used only by hydrateTaxRatesByFY (a startup DB fetch landing after a
// panel's already open) to repaint whichever panel(s) happen to be mounted
// from THEIR OWN current rates. Since Current tax position and Tax outlook
// now hold independent state (see taxOutlookRatesState's own comment), this
// is no longer a cross-card sync — each entry only ever touches its own
// panel. Reset once per render (top of renderHealthWheelBlock) so closures
// from a prior render don't pile up.
let taxRatesPanelRefreshers = [];
// Wires ONE rate-editor copy (toggle, 12 fields, reset button, status
// label) — used for both Tax outlook's own copy (ids: tax-rates-toggle,
// tr-threshold, ...) and the Current tax position card's copy (ids:
// tax-position-rates-toggle, tax-position-tr-threshold, ...) via different
// prefixes, so the exact same wiring logic backs both instead of two
// versions that could quietly drift out of sync with each other. getState/
// setState point this instance at ITS OWN rates object (taxOutlookRatesState
// or taxPositionRatesState) — see that pair's own comment for why editing
// one must never touch the other.
function wireTaxRatesPanel(panelPrefix, inputIdPrefix, labelElId, onChange, getState, setState) {
  const toggle = document.getElementById(`${panelPrefix}-rates-toggle`);
  if (!toggle) return;
  const panel = document.getElementById(`${panelPrefix}-rates-panel`);
  const label = document.getElementById(labelElId);
  const savedYearsEl = document.getElementById(`${panelPrefix}-rates-saved-years`);
  const refresh = () => {
    refreshTaxRatesInputs(inputIdPrefix, getState());
    if (label) label.innerHTML = taxRatesStatusLabel(auFinancialYearLabel(currentPeriodEnd), getState());
    // Delete buttons are re-rendered here (not built once) so the list
    // always reflects TAX_RATES_BY_FY's current keys — the click handler
    // below is a single delegated listener on the container, so it keeps
    // working across every re-render instead of needing rewiring per button.
    if (savedYearsEl) {
      const years = Object.keys(TAX_RATES_BY_FY).sort();
      savedYearsEl.innerHTML = years.length
        ? 'Saved years: ' + years.map((y) => `<span style="margin-right:10px; white-space:nowrap;">${y} <button type="button" class="mini-link" data-fy="${y}" style="padding:0; font-size:10px;">delete</button></span>`).join('')
        : '';
    }
    // Names the actual year it'll copy — DEFAULT_TAX_RATES_FY can change
    // after a save/delete on either panel, so this is re-set here rather
    // than baked into the initial HTML.
    const carryFyBtn = document.getElementById(`${panelPrefix}-rates-carry-fy`);
    if (carryFyBtn) carryFyBtn.textContent = `Same as ${DEFAULT_TAX_RATES_FY} — carry forward unchanged`;
  };
  // renderTaxRatesPanel trims fields per entity type (a Company's copy has
  // no individual-bracket inputs at all, etc.) — this copy's rateInputs
  // only ever has SOME of TAX_RATE_FIELD_SUFFIXES' keys as a result, so
  // recalc has to leave whatever's not present here alone rather than
  // assuming every field exists and blanking the rest to 0.
  const rateInputs = Object.fromEntries(
    Object.entries(TAX_RATE_FIELD_SUFFIXES)
      .map(([key, suffix]) => [key, document.getElementById(`${inputIdPrefix}${suffix}`)])
      .filter(([, el]) => el)
  );
  Object.entries(rateInputs).forEach(([key, el]) => { if (MONEY_TAX_RATE_KEYS.has(key)) wireMoneyInputPreview(el); });
  const recalc = () => {
    setState({ ...getState(), ...Object.fromEntries(Object.entries(rateInputs).map(([key, el]) => [key, Number(el.value) || 0])) });
    refresh();
    onChange();
  };
  toggle.onclick = () => {
    const willOpen = panel.style.display === 'none';
    panel.style.display = willOpen ? 'block' : 'none';
    toggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
  };
  Object.values(rateInputs).forEach((el) => { el.onchange = recalc; });
  const resetBtn = document.getElementById(`${panelPrefix}-rates-reset`);
  if (resetBtn) {
    resetBtn.onclick = () => {
      setState(resolveTaxRatesForClient(currentCtx, auFinancialYearLabel(currentPeriodEnd)));
      refresh();
      onChange();
    };
  }
  // Persists whatever's CURRENTLY in this copy's own state (not just its
  // rateInputs, which may be a trimmed subset per entity type — see the
  // comment above) to tax_rates_by_fy under the typed FY. Global, not
  // client-scoped (see migration_tax_rates_by_fy.sql) — this is how a new
  // year's numbers become every client's default from here on, without
  // touching index.html at all. Unlike recalc/reset above, this genuinely
  // SHOULD be shared — a saved year's rates are a fact, not a scenario — so
  // it updates TAX_RATES_BY_FY (the one thing both copies still read from)
  // rather than the other copy's live state directly.
  const saveFyBtn = document.getElementById(`${panelPrefix}-rates-save-fy`);
  const carryFyBtn = document.getElementById(`${panelPrefix}-rates-carry-fy`);
  const saveFyInput = document.getElementById(`${panelPrefix}-rates-save-fy-input`);
  const saveFyStatus = document.getElementById(`${panelPrefix}-rates-save-status`);
  // Shared by both buttons below — the only difference between "Save for
  // every client" and "Carry forward unchanged" is WHERE `rates` comes from
  // (this panel's current edited values, vs. a straight copy of the latest
  // year already on file); everything else (validation, overwrite confirm,
  // the network call, refreshing every mounted panel afterward) is identical.
  async function performSaveFy(fy, rates, triggerBtn) {
    const rateInputsExist = saveFyBtn && saveFyInput;
    if (!rateInputsExist) return;
    // Checks the two halves actually agree (2035-36, not just any two
    // digits after the dash) — the shape alone would happily accept a
    // typo like "FY2035-99" as a real, saveable year.
    const fyMatch = /^FY(\d{4})-(\d{2})$/.exec(fy);
    const expectedSuffix = fyMatch ? String(Number(fyMatch[1]) + 1).slice(-2) : null;
    if (!fyMatch || fyMatch[2] !== expectedSuffix) {
      if (saveFyStatus) saveFyStatus.textContent = 'Enter a year like FY2027-28 (the second half must be the next year).';
      return;
    }
    const existing = TAX_RATES_BY_FY[fy];
    if (existing && JSON.stringify(existing) !== JSON.stringify(rates)) {
      const proceed = confirm(`${fy} already has saved rates — this replaces them for every client. Continue?`);
      if (!proceed) return;
    }
    saveFyBtn.disabled = true;
    if (carryFyBtn) carryFyBtn.disabled = true;
    if (saveFyStatus) saveFyStatus.textContent = 'Saving…';
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'save_tax_rates_by_fy', fy, rates }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      TAX_RATES_BY_FY[fy] = rates;
      recomputeDefaultTaxRates();
      saveFyInput.value = nextFYLabel(DEFAULT_TAX_RATES_FY);
      if (saveFyStatus) saveFyStatus.textContent = `Saved — every client now uses these for ${fy}.`;
      // TAX_RATES_BY_FY changing is genuinely global (unlike recalc/reset
      // above) — every mounted panel's "no rates on file" warning depends
      // on its keys, so every one gets repainted here. Harmless to the
      // OTHER card's own working values: refresh only repaints from that
      // card's own getState(), which this save never touched.
      taxRatesPanelRefreshers.forEach((fn) => fn());
    } catch (err) {
      if (saveFyStatus) saveFyStatus.textContent = 'Error: ' + err.message;
    } finally {
      saveFyBtn.disabled = false;
      if (carryFyBtn) carryFyBtn.disabled = false;
    }
  }
  if (saveFyBtn && saveFyInput) {
    saveFyBtn.onclick = () => performSaveFy((saveFyInput.value || '').trim(), { ...getState() });
  }
  // "Nothing changed this year" shouldn't mean retyping all 12 fields just
  // to silence the missing-year warning — this copies the LATEST year
  // actually on file (not this panel's own live edits, which might be
  // mid-way through an unrelated scenario edit) straight into whatever FY
  // is typed above, so confirming "still the same" costs one click.
  if (carryFyBtn && saveFyInput) {
    carryFyBtn.onclick = () => performSaveFy((saveFyInput.value || '').trim(), { ...TAX_RATES_BY_FY[DEFAULT_TAX_RATES_FY] });
  }
  // One delegated listener on the container (not per-button) — refresh()
  // rebuilds the buttons' HTML on every recalc/save/delete, which would
  // orphan a directly-attached .onclick each time; delegation survives that.
  if (savedYearsEl && !savedYearsEl._deleteWired) {
    savedYearsEl._deleteWired = true;
    savedYearsEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-fy]');
      if (!btn) return;
      const fy = btn.dataset.fy;
      // taxRatesForFY always needs somewhere to fall back to — deleting the
      // last remaining year would leave every tax estimate app-wide with
      // nothing to compute from, not just break it for whoever deleted it.
      if (Object.keys(TAX_RATES_BY_FY).length <= 1) {
        alert(`Can't delete ${fy} — at least one saved year has to stay on file as the fallback default.`);
        return;
      }
      const proceed = confirm(`Delete ${fy}'s saved rates for every client? This can't be undone.`);
      if (!proceed) return;
      btn.disabled = true;
      try {
        const res = await fetch('/.netlify/functions/manual-entry', {
          method: 'POST',
          body: JSON.stringify({ type: 'delete_tax_rates_by_fy', fy }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        recomputeDefaultTaxRates();
        taxRatesPanelRefreshers.forEach((fn) => fn());
      } catch (err) {
        alert('Error deleting ' + fy + ': ' + err.message);
        btn.disabled = false;
      }
    });
  }
  taxRatesPanelRefreshers.push(refresh);
  refresh();
}

// `rates` is passed explicitly (not read off one implicit shared global) so
// Current tax position (this period's real, factual position) and Tax
// outlook (a what-if scenario, which might deliberately model a different —
// even future — year's numbers) can each hold their own independent rates
// without editing one silently changing what the other computes. See
// taxOutlookRatesState/taxPositionRatesState's own comments.
function estimateIndividualTax(income, rates) {
  if (income <= 0) return 0;
  const r = rates;
  const bands = [[r.taxFreeThreshold, 0], [r.bracket2Upper, r.bracket2Rate], [r.bracket3Upper, r.bracket3Rate], [r.bracket4Upper, r.bracket4Rate], [Infinity, r.bracket5Rate]];
  let tax = 0, lower = 0;
  for (const [upper, ratePct] of bands) {
    if (income <= lower) break;
    tax += (Math.min(income, upper) - lower) * (ratePct / 100);
    lower = upper;
  }
  const medicareLevy = income > r.medicareThreshold ? income * (r.medicareRate / 100) : 0;
  return tax + medicareLevy;
}

// Which bracket income's TOP dollar falls in — "which bracket are they
// roughly in" answers the marginal rate on the next dollar earned, not an
// average, which is what makes e.g. the 4-way even split's $0 result
// actually explainable (each share sits under the tax-free threshold) rather
// than just a number with no story behind it. Reads the same rates table
// the caller is using for its own estimate.
function individualTaxBracket(income, rates) {
  const r = rates;
  if (income <= 0) return 'no income';
  if (income <= r.taxFreeThreshold) return 'under the tax-free threshold';
  if (income <= r.bracket2Upper) return `${r.bracket2Rate}% bracket`;
  if (income <= r.bracket3Upper) return `${r.bracket3Rate}% bracket`;
  if (income <= r.bracket4Upper) return `${r.bracket4Rate}% bracket`;
  return `${r.bracket5Rate}% bracket`;
}

function estimateCompanyTax(income, rates) {
  return income > 0 ? income * (rates.companyRate / 100) : 0; // base rate entity assumption (small/medium co.)
}

// Division 6AA — a minor's UNEARNED income (trust distributions, dividends,
// etc.) is taxed nothing like an adult's: a $416 tax-free amount, a narrow
// 66%-of-the-excess "shade-in" band to stop $1 over the threshold jumping
// straight to the top rate, then a flat 45% on the WHOLE amount above
// $1,307 (not just the excess) — these thresholds are long-standing
// statutory figures, not indexed like the adult brackets, so they're fixed
// constants here rather than in the editable rates tables. Deliberately
// NOT modeling "excepted income" (a minor's own wages, Centrelink payments,
// income from a deceased estate, or a disabled/prescribed-person exception —
// each taxed at ORDINARY adult rates instead) — that exception genuinely
// depends on where the money came from, which this tool has no way to know,
// so every minor beneficiary here is assumed to be receiving ordinary
// (unexcepted) trust income. Flag this to the client rather than silently
// guessing which of their kids' distributions might actually qualify.
function estimateMinorTax(income) {
  if (income <= 416) return 0;
  if (income <= 1307) return (income - 416) * 0.66;
  return income * 0.45;
}

// Australian FY runs 1 July - 30 June — a period ending in Jan-Jun belongs to
// the FY that started the PREVIOUS calendar year (30 June 2027 -> FY2026-27),
// Jul-Dec belongs to the FY starting that same year.
function auFinancialYearLabel(periodEnd) {
  if (!periodEnd) return null;
  const d = new Date(periodEnd);
  if (isNaN(d)) return null;
  const month = d.getMonth() + 1;
  const startYear = month >= 7 ? d.getFullYear() : d.getFullYear() - 1;
  return `FY${startYear}-${String(startYear + 1).slice(-2)}`;
}

// Single source of truth for the "Using default rates" label wherever it
// appears (Tax outlook's own rates toggle, Current tax position's rates
// toggle, Current tax position's fuller status line) — used to be three
// separately hand-written copies, one of which (Current tax position's own
// status line) had a missing-year warning and the other two didn't. That's
// exactly the kind of drift that leaves a gap open silently: TAX_RATES_BY_FY
// is a deliberately manual, once-a-year edit (see its own comment) — the
// actual risk isn't that it needs updating, it's that if an update is ever
// missed for a particular year, every copy of this label should say so
// loudly, not just whichever copy happened to get the check hand-added to
// it. usingDefaults compares the caller's own rates (each card passes its
// own — see taxOutlookRatesState/taxPositionRatesState) against
// taxRatesForFY(detectedFY) specifically — the rates for the period actually
// being modeled — so an
// older period that already has its own correct year on file in
// TAX_RATES_BY_FY is never treated as "wrong" just because a newer year's
// also been added since; only a period with NO year on file at all (a
// genuinely future year, or an older one nobody's entered yet) falls back to
// the latest known year and gets flagged.
function taxRatesStatusLabel(detectedFY, rates) {
  const usingDefaults = JSON.stringify(rates) === JSON.stringify(resolveTaxRatesForClient(currentCtx, detectedFY));
  const noRatesOnFile = detectedFY && !TAX_RATES_BY_FY[detectedFY];
  // The year only earns its place in the text when it's actually doing
  // work — explaining a gap. Printing it in the ordinary/calm case too
  // ("Defaults to FY2026-27") reads as a permanent, standing claim that a
  // year has passed since — exactly what invites this going stale-looking
  // forever if a new year's entry is ever left unadded. Say "default"/
  // "defaults" there instead; the one place the actual year still needs to
  // show is the warning below, where naming the missing year is the entire
  // point.
  if (usingDefaults && noRatesOnFile) {
    return `<span style="color:var(--rust);">⚠ No rates on file for ${detectedFY} — showing ${DEFAULT_TAX_RATES_FY}'s instead, check before relying on it.</span>`;
  }
  return usingDefaults
    ? `Using default rates — edit below for a different year`
    : `Using custom rates you’ve entered — not the defaults`;
}

// Shared by Tax outlook and Cash outlook (both "model a scenario" cards) —
// same four-level buildup: net profit set directly overrides everything,
// else net profit change, else GP change (opex layered on top either way),
// else revenue change at this period's own GP margin as the fallback. One
// function so the two cards can never drift into computing "projected
// profit" two different ways.
function projectProfitScenario(snapshot, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute) {
  const revenue = snapshot.revenue;
  const actualNetProfit = snapshot.net_profit;
  // "Set net profit directly" used to be its own terminal branch that
  // skipped every other field — so typing a known number and then a
  // Revenue/GP % on top of it silently did nothing (the % just got
  // ignored). It now instead REPLACES this period's actual net profit as
  // the baseline everything below is built from — Revenue, GP, and Net
  // profit change all compose on top of the number you set, exactly like
  // they would on top of the real actual, instead of only Net profit
  // change being able to.
  const hasOverride = netProfitAbsolute !== '' && netProfitAbsolute != null;
  const netProfit = hasOverride ? Number(netProfitAbsolute) : actualNetProfit;
  const baselineGP = snapshot.cogs != null ? revenue - snapshot.cogs : null;
  const baselineOpex = baselineGP != null ? baselineGP - netProfit : revenue - netProfit;
  const delta = (val, baseline) => unit === 'dollar' ? val : baseline * (val / 100);

  // Nothing on the card itself hints that the headline is derived from this
  // period's actual figures until you open the (collapsed) assumptions panel
  // — this caption says so up front, and switches to a "you're modeling a
  // scenario" flag once anything's been changed. Keeps citing the actual
  // net profit even while modeling (previously dropped it entirely, so the
  // only place it was still visible was inside the Net profit change
  // buildup line specifically — Revenue/GP change never showed it at all).
  const isBaseline = !hasOverride && !netProfitChange && !gpChange && !revenueChange && !opexChange;
  const provenance = isBaseline
    ? `Based on this period's actual net profit (${formatMoney(actualNetProfit)}).`
    : hasOverride
    ? `Modeling a scenario — net profit set directly at ${formatMoney(netProfit)}, not this period's actual (${formatMoney(actualNetProfit)}).`
    : `Modeling a scenario against this period's actual net profit (${formatMoney(actualNetProfit)}), not the actual figures.`;

  const overridePrefix = hasOverride ? `Net profit set directly at <b>${formatMoney(netProfit)}</b>, then ` : '';
  let projectedProfit, buildup;
  if (netProfitChange) {
    projectedProfit = netProfit + delta(netProfitChange, netProfit);
    buildup = hasOverride
      ? `Net profit set directly at <b>${formatMoney(netProfit)}</b> → projected profit <b>${formatMoney(projectedProfit)}</b>`
      : `Net profit ${formatMoney(netProfit)} → projected profit <b>${formatMoney(projectedProfit)}</b>`;
  } else if (gpChange && baselineGP != null) {
    const projectedGP = baselineGP + delta(gpChange, baselineGP);
    const projectedOpex = baselineOpex + delta(opexChange, baselineOpex);
    projectedProfit = projectedGP - projectedOpex;
    buildup = `${overridePrefix}Gross profit <b>${formatMoney(projectedGP)}</b> − operating expenses <b>${formatMoney(projectedOpex)}</b> = projected profit <b>${formatMoney(projectedProfit)}</b>`;
  } else {
    const projectedRevenue = revenue + delta(revenueChange, revenue);
    const gpMargin = baselineGP != null ? baselineGP / revenue : null;
    const projectedGP = gpMargin != null ? projectedRevenue * gpMargin : projectedRevenue; // no cogs recorded — treat revenue as GP; baselineOpex already covers ALL costs in this case
    const projectedOpex = baselineOpex + delta(opexChange, baselineOpex);
    projectedProfit = projectedGP - projectedOpex;
    buildup = `${overridePrefix}Revenue <b>${formatMoney(projectedRevenue)}</b> → gross profit <b>${formatMoney(projectedGP)}</b> − operating expenses <b>${formatMoney(projectedOpex)}</b> = projected profit <b>${formatMoney(projectedProfit)}</b>`;
  }
  return { projectedProfit, buildup, isBaseline, provenance };
}

// Growth's own version of the scenario buildup — Revenue and Cost of sales
// are independent levers (not mutually exclusive alternatives) that combine
// into gross profit, same as Wages is independent of Other opex. Net profit
// change is the one shortcut lever left: fill that in and it skips the whole
// Revenue/COGS/wages/opex chain, for "I know how much it'll move" instead of
// "let me build it up from the parts." Deliberately a separate function (not
// a param added to projectProfitScenario) so Cash Outlook and Tax Outlook's
// existing calls can never be affected by this.
function projectGrowthProfitScenario(snapshot, unit, revenueChange, cogsChange, wagesChange, opexChange, netProfitChange, otherIncomeChange, gpMarginChangePts) {
  const revenue = snapshot.revenue;
  const netProfit = snapshot.net_profit;
  const baselineCogs = snapshot.cogs;
  const baselineGP = baselineCogs != null ? revenue - baselineCogs : null;
  const baselineOpex = baselineGP != null ? baselineGP - netProfit : revenue - netProfit;
  const baselineWages = snapshot.wages || 0;
  const baselineOtherOpex = baselineOpex - baselineWages;
  // Other income is already netted into baselineOpex above (it's a plug
  // derived backward from actual net profit, so it silently absorbs
  // whatever other income/expense/interest sat between GP and net profit).
  // otherIncomeChange is modeled as a further ADDITIVE term on top of that
  // plug, not a replacement for it — baseline (0 change) still nets to the
  // real net profit either way, so this is safe to add without touching
  // any existing behaviour.
  const baselineOtherIncome = snapshot.other_income || 0;
  const delta = (val, baseline) => unit === 'dollar' ? val : baseline * (val / 100);

  const isBaseline = !netProfitChange && !revenueChange && !cogsChange && !wagesChange && !opexChange && !otherIncomeChange && !gpMarginChangePts;
  const provenance = isBaseline
    ? `Based on this period's actual net profit (${formatMoney(netProfit)}).`
    : `Modeling a scenario, not this period's actual figures.`;

  // projectedRevenue/projectedGP only come out non-null when the
  // Revenue/COGS/wages/opex chain actually runs — the Net profit override
  // below skips deriving a revenue figure entirely, and inventing one would
  // mean showing a number nobody actually computed. Cash cost of growing
  // (see computeCashCostOfGrowing) depends on these staying null unless real.
  let projectedProfit, buildup, projectedRevenueOut = null, projectedGPOut = null;
  if (netProfitChange) {
    projectedProfit = netProfit + delta(netProfitChange, netProfit);
    buildup = `Net profit ${formatMoney(netProfit)} → projected profit <b>${formatMoney(projectedProfit)}</b>`;
  } else {
    const projectedRevenue = revenue + delta(revenueChange, revenue);
    // GP margin change is a shortcut for "what does revenue growth look
    // like at a different margin" — set a target margin (current margin +
    // the points typed in) and derive COGS from it, instead of typing a
    // raw $/% change to COGS directly. Takes over from the Cost of sales
    // lever whenever it's used (both ultimately just move GP/COGS; letting
    // both apply at once would double up), and only makes sense when COGS
    // is actually tracked (baselineGP != null) — with no COGS recorded,
    // margin isn't a meaningful concept to adjust.
    const currentMarginPct = baselineGP != null && revenue ? (baselineGP / revenue) * 100 : null;
    const useMarginLever = gpMarginChangePts && currentMarginPct != null;
    const projectedGP = useMarginLever
      ? projectedRevenue * ((currentMarginPct + gpMarginChangePts) / 100)
      : (baselineCogs != null ? projectedRevenue - (baselineCogs + delta(cogsChange, baselineCogs)) : projectedRevenue); // no cogs recorded — treat revenue as GP
    const projectedCogs = (baselineCogs != null || useMarginLever) ? projectedRevenue - projectedGP : null;
    const projectedWages = baselineWages + delta(wagesChange, baselineWages);
    const projectedOtherOpex = baselineOtherOpex + delta(opexChange, baselineOtherOpex);
    const otherIncomeDelta = delta(otherIncomeChange, baselineOtherIncome);
    projectedProfit = projectedGP - projectedWages - projectedOtherOpex + otherIncomeDelta;
    // Shown whenever a margin is knowable at all (projectedRevenue > 0 and
    // COGS tracked), not just when the GP margin lever itself was used —
    // moving Revenue or Cost of sales independently changes the margin
    // just as much, and that shift should be visible either way, not only
    // when it was the thing being directly dialled in.
    const projectedMarginPct = (currentMarginPct != null && projectedRevenue) ? (projectedGP / projectedRevenue) * 100 : null;
    const marginNote = projectedMarginPct != null
      ? ` <span style="color:var(--ink-soft);">(GP margin ${currentMarginPct.toFixed(1)}% → ${projectedMarginPct.toFixed(1)}%)</span>`
      : '';
    buildup = projectedCogs != null
      ? `Revenue <b>${formatMoney(projectedRevenue)}</b> − cost of sales <b>${formatMoney(projectedCogs)}</b> = gross profit <b>${formatMoney(projectedGP)}</b>${marginNote} − wages <b>${formatMoney(projectedWages)}</b> − other operating expenses <b>${formatMoney(projectedOtherOpex)}</b>`
      : `Revenue <b>${formatMoney(projectedRevenue)}</b> → gross profit <b>${formatMoney(projectedGP)}</b> − wages <b>${formatMoney(projectedWages)}</b> − other operating expenses <b>${formatMoney(projectedOtherOpex)}</b>`;
    buildup += otherIncomeDelta ? ` + other income change <b>${formatMoney(otherIncomeDelta)}</b> = projected profit <b>${formatMoney(projectedProfit)}</b>` : ` = projected profit <b>${formatMoney(projectedProfit)}</b>`;
    projectedRevenueOut = projectedRevenue;
    projectedGPOut = projectedGP;
  }
  return { projectedProfit, buildup, isBaseline, provenance, projectedRevenue: projectedRevenueOut, projectedGP: projectedGPOut };
}

// Repeats the SAME single-period scenario as an annual rate, compounded —
// deliberately not a second set of assumptions per year, just "what does
// this scenario look like if it holds for N years." Each lever's year-1
// value below matches projectGrowthProfitScenario's own output exactly
// (same delta() shape, just raised to year N instead of applied once), so
// this is a pure generalization of that function, not a different model.
// GP margin is the one exception: a margin lever sets a NEW target margin
// that's treated as reached and then held flat, not compounded further —
// compounding a margin percentage itself (rather than the revenue it
// applies to) would drift toward 100% or negative with nothing grounding
// it. Returns null when there's no year-by-year story to tell: the Net
// profit override skips the whole P&L chain this needs, and with nothing
// entered at all every year would just repeat today's actual figure.
function computeGrowthOutlookYears(snapshot, unit, revenueChange, cogsChange, wagesChange, opexChange, otherIncomeChange, gpMarginChangePts, netProfitChange, maxYears) {
  if (netProfitChange) return null;
  if (!revenueChange && !cogsChange && !wagesChange && !opexChange && !otherIncomeChange && !gpMarginChangePts) return null;
  const revenue = snapshot.revenue;
  const baselineCogs = snapshot.cogs;
  const baselineGP = baselineCogs != null ? revenue - baselineCogs : null;
  const baselineOpex = baselineGP != null ? baselineGP - snapshot.net_profit : revenue - snapshot.net_profit;
  const baselineWages = snapshot.wages || 0;
  const baselineOtherOpex = baselineOpex - baselineWages;
  const baselineOtherIncome = snapshot.other_income || 0;
  const currentMarginPct = baselineGP != null && revenue ? (baselineGP / revenue) * 100 : null;
  const useMarginLever = gpMarginChangePts && currentMarginPct != null;
  const targetMarginPct = useMarginLever ? currentMarginPct + gpMarginChangePts : null;
  // pct mode: baseline * (1 + rate/100)^year — dollar mode: baseline + year * amount.
  // Both match projectGrowthProfitScenario's own delta() exactly at year 1.
  const grow = (val, baseline, year) => unit === 'dollar' ? baseline + year * val : baseline * Math.pow(1 + val / 100, year);
  const years = [];
  for (let year = 1; year <= maxYears; year++) {
    const rev = grow(revenueChange, revenue, year);
    const gp = useMarginLever ? rev * (targetMarginPct / 100) : (baselineCogs != null ? rev - grow(cogsChange, baselineCogs, year) : rev);
    const wages = grow(wagesChange, baselineWages, year);
    const otherOpex = grow(opexChange, baselineOtherOpex, year);
    const otherIncomeDelta = unit === 'dollar' ? year * otherIncomeChange : baselineOtherIncome * (Math.pow(1 + otherIncomeChange / 100, year) - 1);
    const profit = gp - wages - otherOpex + otherIncomeDelta;
    years.push({ year, revenue: rev, profit });
  }
  return years;
}

// Applies the client's OWN debtor/creditor/inventory-days ratios (never
// invented ones) to a modeled revenue increase to estimate the net extra
// cash growth would tie up — standard working-capital treatment: extra
// debtors + extra inventory, netted against extra creditors (supplier
// financing reduces the cash burden, it doesn't add to it). Deliberately
// gated on projectedRevenue being non-null — the Net profit override branch
// of projectGrowthProfitScenario doesn't derive a real revenue figure to
// work from, so this returns null there rather than guess one.
function computeCashCostOfGrowing(snapshot, kpis, projectedRevenue, projectedGP) {
  if (projectedRevenue == null || snapshot?.cogs == null) return null;
  const kpi = (key) => kpis?.find((k) => k.key === key);
  const debtorDays = kpi('debtor_days');
  const creditorDays = kpi('creditor_days');
  const inventoryDays = kpi('inventory_days');
  if (!debtorDays || debtorDays.confidence === 'red' || debtorDays.value == null) return null;
  if (!inventoryDays || inventoryDays.confidence === 'red' || inventoryDays.value == null) return null;

  const extraRevenue = projectedRevenue - snapshot.revenue;
  const extraDebtors = extraRevenue * (debtorDays.value / 365);
  const extraCogs = (projectedRevenue - projectedGP) - snapshot.cogs;
  const extraInventory = extraCogs * (inventoryDays.value / 365);
  const extraCreditors = (creditorDays && creditorDays.confidence !== 'red' && creditorDays.value != null)
    ? extraCogs * (creditorDays.value / 365) : 0;

  const netCashTiedUp = extraDebtors + extraInventory - extraCreditors;
  if (Math.abs(netCashTiedUp) < 1) return null; // no meaningful growth modeled
  return netCashTiedUp;
}

function renderGrowthOutlookCard(snapshot) {
  const revenue = snapshot?.revenue;
  const netProfit = snapshot?.net_profit;

  const selectStyle = 'padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);';
  const s = growthOutlookState;
  const hasCogs = snapshot?.cogs != null;

  const row = (id, label, value) => `<div class="ocf-row"><label>${label}</label><input type="number" id="${id}" value="${value}" placeholder="0" /></div>`;
  // s.panelOpen wins whenever the user has explicitly set it — only fall
  // back to "open because there's something to show" when they never have.
  const hasScenario = s.revenue !== 0 || s.cogs !== 0 || s.wages !== 0 || s.opex !== 0 || s.netProfit !== 0 || s.otherIncome !== 0 || s.gpMarginChange !== 0;
  const panelOpen = s.panelOpen != null ? s.panelOpen : hasScenario;
  return `
    <div class="kpi-card">

        <p class="kpi-value" id="growth-outlook-value" style="margin:0; font-size:22px;">—</p>

        <p style="font-size:10px; color:var(--ink-soft); margin:6px 0 0; font-style:italic;">Compounds the same % (or repeats the same $) entered above, year over year — not a separate assumption per year.</p>
      </div>
      <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">
        <span id="growth-outlook-provenance"></span>
        <button type="button" id="growth-outlook-provenance-link" style="background:none; border:none; padding:0; margin-left:2px; color:var(--brass); font-size:11px; cursor:pointer; text-decoration:underline; font-family:inherit;">Adjust assumptions</button>
      </p>

      <div class="cash-item cash-item-clickable" id="growth-outlook-toggle">
        <span class="cash-item-icon">🧮</span>
        <span class="cash-item-label">Adjust assumptions</span>
        <span class="chevron">${panelOpen ? '▴' : '▾'}</span>
      </div>
      <div class="ocf-adjust-panel" id="growth-outlook-panel" style="display:${panelOpen ? 'block' : 'none'};">
        <div class="ocf-row"><label>Change amounts as</label><select id="growth-outlook-unit" style="${selectStyle}"><option value="pct" ${s.unit === 'pct' ? 'selected' : ''}>%</option><option value="dollar" ${s.unit === 'dollar' ? 'selected' : ''}>$</option></select></div>
        ${row('growth-outlook-revenue', 'Revenue', s.revenue)}
        ${hasCogs ? row('growth-outlook-cogs', 'Cost of sales', s.cogs) : ''}
        ${hasCogs ? `<div class="ocf-row"><label>Or move GP margin directly, in points — currently ${currentMarginPct.toFixed(1)}% (overrides Cost of sales above)</label><input type="number" id="growth-outlook-gpmargin" value="${s.gpMarginChange}" placeholder="0" /></div>` : ''}
        ${row('growth-outlook-wages', 'Wages', s.wages)}
        ${row('growth-outlook-opex', 'Other operating expenses', s.opex)}
        ${row('growth-outlook-otherincome', 'Other income (not part of revenue)', s.otherIncome)}
        ${row('growth-outlook-netprofit', 'Or move net profit directly (skips everything above)', s.netProfit)}
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">Revenue, cost of sales (or a direct GP margin move), wages, other opex and other income combine to build up projected profit — adjust any of them together. Net profit overrides all of them if you'd rather just model a bottom-line move directly.</p>
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;" id="growth-outlook-buildup"></p>
        <button type="button" class="mini-link" id="growth-outlook-reset" style="margin-top:8px;">↺ Reset to nil</button>
