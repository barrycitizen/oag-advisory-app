          <div class="snapshot-field"><p class="card-label">Investments</p><p style="margin:0; font-family:var(--font-mono);" id="owner-retirement-bd-investments">—</p></div>
          <div class="snapshot-field"><p class="card-label">Property</p><p style="margin:0; font-family:var(--font-mono);" id="owner-retirement-bd-property">—</p></div>
          <div class="snapshot-field"><p class="card-label">Other assets</p><p style="margin:0; font-family:var(--font-mono);" id="owner-retirement-bd-other">—</p></div>
          <div class="snapshot-field"><p class="card-label">Personal debt</p><p style="margin:0; font-family:var(--font-mono);" id="owner-retirement-bd-debt">—</p></div>
          <div class="snapshot-field" id="owner-retirement-bd-business-wrap" style="display:none;"><p class="card-label">Business equity</p><p style="margin:0; font-family:var(--font-mono);" id="owner-retirement-bd-business">—</p></div>
        </div>
      </div>

      <div class="cash-item cash-item-clickable" id="owner-retirement-toggle-target" style="margin-top:8px;">
        <span class="cash-item-icon">🧮</span>
        <span class="cash-item-label">Assumptions — Amount required for retirement</span>
        <span class="chevron">${targetPanelOpen ? '▴' : '▾'}</span>
      </div>
      <div class="ocf-adjust-panel" id="owner-retirement-panel-target" style="display:${targetPanelOpen ? 'block' : 'none'};">
        ${row('owner-retirement-income', 'Desired annual income in retirement ($)', s.desiredIncome)}
        ${row('owner-retirement-withdrawal', 'Safe withdrawal rate (%)', s.withdrawalRate)}
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">The 4% withdrawal rate is a flat rule of thumb that assumes the money needs to last indefinitely.</p>
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">This amount doesn't change based on your timeline — it's set by the income you want, not by how many years you have to save. To see what you'd <b>actually have</b> on a given timeline, set "Project forward (years)" in <b>Projected amount at retirement</b> instead — that's the figure to compare against this one.</p>
        <p class="card-label" style="margin:10px 0 4px;">More precise — factor in growth &amp; a specific retirement length</p>
        ${row('owner-retirement-post-growth', 'Investment growth during retirement (%/yr)', s.postRetirementGrowth)}
        ${row('owner-retirement-years-needed', 'Years the money needs to last', s.retirementYears)}
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">Fill both of these in and the target above switches to a proper present-value calc — usually a smaller, more realistic number than the flat 25x-style divisor, since ongoing growth funds part of the withdrawals too.</p>
        <p class="card-label" style="margin:10px 0 4px;">Or skip the maths — type a target directly</p>
        ${row('owner-retirement-target-override', 'Target net worth ($, overrides everything above)', s.targetOverride)}
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;" id="owner-retirement-to-go"></p>
        <p class="card-label" style="margin:10px 0 4px;">Will it actually last?</p>
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;" id="owner-retirement-drawdown-result"></p>
      </div>

      <div class="cash-item cash-item-clickable" id="owner-retirement-toggle-years" style="margin-top:8px;">
        <span class="cash-item-icon">🧮</span>
        <span class="cash-item-label">Assumptions — Years to retire</span>
        <span class="chevron">▾</span>
      </div>
      <div class="ocf-adjust-panel" id="owner-retirement-panel-years" style="display:none;">
        <p class="muted plain" style="margin:0;" id="owner-retirement-years-summary"></p>
        <p class="muted plain" style="margin:6px 0 0;">Nothing extra to enter here — this is worked out from the growth rates in <b>Projected amount at retirement</b> and the target in <b>Amount required for retirement</b>.</p>
        <button type="button" class="mini-link" data-retirement-jump="projected" style="margin:6px 8px 0 0;">→ Edit growth rates</button>
        <button type="button" class="mini-link" data-retirement-jump="target" style="margin-top:6px;">→ Edit target</button>
      </div>

      <p style="font-size:11px; color:var(--ink-soft); margin-top:8px; font-style:italic;">Simple rule-of-thumb projection, not a retirement or financial plan.</p>
    </div>
  `;
}

// The earliest target_year among active exit_succession goals — feeds both
// the succession card's own display and Retirement Outlook's "Project
// forward (years)" default. Earliest, not just "first" in array order,
// since an accountant could plausibly enter more than one exit-related
// goal and the nearest one is the one that should drive the projection.
function getOwnerSuccessionTargetYear() {
  const items = (currentCtx?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.['exit_succession']?.items || []).filter((it) => !it.deleted && !it.done && it.target_year);
  if (!items.length) return null;
  return Math.min(...items.map((it) => Number(it.target_year)));
}

// Flags a real gap: exiting soon but no way to tell whether the plan is
// financially realistic, since business equity is usually the single
// biggest number missing from a purely personal net worth picture. "Soon"
// = within 3 years; a valuation older than 2 years is treated as stale
// rather than current, since a business's value can shift materially over
// that long — same spirit as Growth → Valuation's own "as of" caveat.
function getOwnerSuccessionReadinessFlag(latestValuation) {
  const targetYear = getOwnerSuccessionTargetYear();
  if (targetYear == null) return null;
  const yearsAway = targetYear - new Date().getFullYear();
  if (yearsAway > 3) return null;
  const dueText = yearsAway <= 0 ? 'due now' : `${yearsAway} year${yearsAway === 1 ? '' : 's'} away`;
  if (!latestValuation) {
    return `Exit planned for ${targetYear} (${dueText}) but no business valuation has ever been saved — can't tell if the plan is financially realistic without a current number.`;
  }
  const ageYears = (Date.now() - new Date(latestValuation.period_end)) / (365.25 * 24 * 3600 * 1000);
  if (ageYears > 2) {
    return `Exit planned for ${targetYear} (${dueText}) but the last business valuation is from ${formatShortDate(latestValuation.period_end)} — worth refreshing before relying on it.`;
  }
  return null;
}

// A separate gap from valuation readiness — someone can have plenty of
// warning and a perfectly good financial plan and still have no viable way
// to actually hand the business over. Only fires once there's an actual
// exit item on file (no point flagging "no successor" before anyone's said
// they're planning to leave), and treats "developing" as fine, not a gap
// — a successor being actively prepared isn't the same problem as no
// pathway at all or an explicitly not-ready one.
function getOwnerSuccessionPathwayFlag() {
  const items = (currentCtx?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.['exit_succession']?.items || []).filter((it) => !it.deleted && !it.done);
  if (!items.length) return null;
  const withPathway = items.filter((it) => it.succession_pathway);
  if (!withPathway.length) return 'Exit planned but no succession pathway set — who takes over isn\'t identified yet.';
  if (withPathway.some((it) => it.succession_pathway === 'none')) return 'No identified successor for the business.';
  const notReady = withPathway.find((it) => it.successor_readiness === 'not_ready');
  if (notReady) return `${successionPathwayLabel(notReady.succession_pathway)} identified as the succession pathway, but marked not ready to take over yet.`;
  return null;
}

// One card, not two — the exit plan (who/when, from Goals) and the estate
// paperwork checklist are different questions but both live under the same
// "succession & estate planning" umbrella from the original framework list,
// and having them as adjacent cards read as more separation than intended.
// Read-only both ways: the exit plan lives in Goals → Exit & Succession
// (same cross-link pattern as goto-growth-link, renderFinancialDiagnose),
// the checklist lives on Owner Wealth → Input — this card only summarizes
// and links to each, not a third place either gets edited.
// One synthesized recommendation, not a fourth checklist — combines the
// signals already computed elsewhere on this page (succession pathway,
// exit readiness, business continuity, estate gaps) into a single "what
// matters most right now" line. Deliberately rules-based, not AI-written:
// deterministic and free, using only data already on file, rather than a
// fresh model call for something an AI-generated version could do more
// naturally later. Priority order is the point — this names ONE thing,
// not everything that could be better, in roughly the order it'd block
// the next one (who takes over, before when, before is the number current,
// before optimizing value, before operational resilience, before
// paperwork).
function computeOwnerExitSuggestion(items, targetYear, readinessFlag, pathwayFlag, exitReadinessResult, continuityVerdict, estateGaps) {
  if (!items.length) {
    return { text: 'No exit or succession plan on file yet — start in Goals → Exit & Succession with a rough target year and who you\'d want to take over. Everything below builds on that.', tone: 'neutral' };
  }
  if (pathwayFlag) {
    const readinessNote = exitReadinessResult.overall != null && exitReadinessResult.overall < 60
      ? ` Exit Readiness is also only ${exitReadinessResult.overall}/100 — both need sorting out before the timeline is realistic.`
      : '';
    return { text: `${pathwayFlag}${readinessNote}`, tone: 'urgent' };
  }
  if (targetYear == null) {
    return { text: 'A successor is identified but no target year is set — pin one down, even roughly, so the readiness checks below have something to measure against.', tone: 'neutral' };
  }
  if (readinessFlag) {
    return { text: readinessFlag, tone: 'urgent' };
  }
  if (exitReadinessResult.overall != null && exitReadinessResult.overall < 60 && exitReadinessResult.topGaps.length) {
    return { text: `Succession looks set, but Exit Readiness is only ${exitReadinessResult.overall}/100 — "${exitReadinessResult.topGaps[0].label}" would do the most for what a buyer would pay. See the gaps below.`, tone: 'urgent' };
  }
  if (continuityVerdict && continuityVerdict.text.startsWith('Currently NO')) {
    return { text: 'Succession and Exit Readiness look on track, but the business currently couldn\'t continue 3 months without the owner — worth fixing regardless of the exit timeline. See Business continuity below.', tone: 'urgent' };
  }
  if (estateGaps > 0) {
    return { text: `Succession and exit readiness are in reasonable shape — ${estateGaps} estate document${estateGaps === 1 ? '' : 's'} still need${estateGaps === 1 ? 's' : ''} sorting. See the checklist below.`, tone: 'urgent' };
  }
  if (exitReadinessResult.overall == null || exitReadinessResult.assessedCount < exitReadinessResult.totalCount) {
    return { text: `On track so far — but Exit Readiness has only ${exitReadinessResult.assessedCount} of ${exitReadinessResult.totalCount} factors assessed. Answer more of the checklist below and the Business Risk Questionnaire for a fuller picture.`, tone: 'neutral' };
  }
  return { text: `On track — successor identified, Exit Readiness ${exitReadinessResult.overall}/100, no other flags. Keep monitoring as ${targetYear} approaches.`, tone: 'positive' };
}

function renderOwnerSuccessionCard(latestValuation, checklist, exitReadinessResult, continuityVerdict) {
  const items = (currentCtx?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.['exit_succession']?.items || []).filter((it) => !it.deleted && !it.done);
  const targetYear = getOwnerSuccessionTargetYear();
  const readinessFlag = getOwnerSuccessionReadinessFlag(latestValuation);
  const pathwayFlag = getOwnerSuccessionPathwayFlag();
  const byKey = Object.fromEntries((checklist || []).map((it) => [it.key, it]));
  const entityType = currentCtx?.entity_type;
  // "No" only counts as a gap when the item is actually applicable — a
  // sole trader marked "No" on buy-sell agreement isn't missing anything,
  // there's no co-owner for it to apply to.
  const gaps = OWNER_ESTATE_CHECKLIST_ITEMS.filter((item) => byKey[item.key]?.status === 'no' && ownerEstateItemApplicability(item.key, entityType) !== false).length;
  const suggestion = computeOwnerExitSuggestion(items, targetYear, readinessFlag, pathwayFlag, exitReadinessResult, continuityVerdict, gaps);
  const suggestionBg = suggestion.tone === 'urgent' ? 'var(--rust-bg)' : suggestion.tone === 'positive' ? 'var(--sage-bg)' : 'var(--paper-raised)';
  const suggestionColor = suggestion.tone === 'urgent' ? 'var(--rust)' : suggestion.tone === 'positive' ? 'var(--sage)' : 'var(--ink)';
  return `
    <div class="card">
      <p class="muted">Succession &amp; estate planning</p>
      <div style="background:${suggestionBg}; ${suggestion.tone === 'neutral' ? 'border:1px solid var(--line);' : ''} border-radius:8px; padding:10px 14px; margin-bottom:12px;">
        <p class="card-label" style="margin:0 0 4px; color:${suggestionColor};">💡 Suggested next step</p>
        <p class="muted plain" style="margin:0; color:${suggestionColor}; font-size:13px;">${suggestion.text}</p>
      </div>
      ${readinessFlag ? `<div class="flag">⚠ ${readinessFlag} <button type="button" id="goto-valuation-from-succession-link" class="mini-link" style="margin-left:4px;">→ Growth · Valuation</button></div>` : ''}
      ${pathwayFlag ? `<div class="flag">⚠ ${pathwayFlag} <button type="button" id="goto-pathway-from-succession-link" class="mini-link" style="margin-left:4px;">→ Edit in Goals</button></div>` : ''}

      <p class="card-label" style="margin:0 0 4px;">Exit plan</p>
      ${items.length ? items.map((it) => `<p class="muted plain" style="margin:0 0 6px;">• ${it.text}${it.target_year ? ` <span style="color:var(--ink-soft);">(target: ${it.target_year})</span>` : ''}${it.succession_pathway ? ` <span style="color:var(--ink-soft);">— ${successionPathwayLabel(it.succession_pathway)}${it.succession_pathway !== 'none' && it.successor_readiness ? `, ${successionReadinessLabel(it.successor_readiness)}` : ''}</span>` : ''}</p>`).join('') : '<p class="muted plain" style="margin:0;">Nothing recorded yet.</p>'}
      ${targetYear ? `<p class="muted plain" style="margin:6px 0 0; font-size:11px;">Feeds the Retirement outlook below — "Project forward (years)" defaults to ${targetYear - new Date().getFullYear()} years from this.</p>` : ''}
      <button class="mini-link" id="goto-succession-goals-link" type="button" style="margin-top:8px;">→ Edit in Goals</button>

      <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
        <p class="card-label" style="margin:0 0 4px;">Estate planning checklist</p>
        ${OWNER_ESTATE_CHECKLIST_ITEMS.map((item) => {
          const it = byKey[item.key];
          const status = it?.status || 'unknown';
          const statusLabel = status === 'yes' ? 'Yes' : status === 'no' ? 'No' : 'Unknown';
          const applicable = ownerEstateItemApplicability(item.key, entityType);
          const { badge, badgeVariant } = ownerEstateItemBadge(item.key, entityType);
          const isGap = status === 'no' && applicable !== false;
          const priority = (item.key === 'will' || item.key === 'epoa') ? 'High' : 'Medium';
          return `<p class="muted plain" style="margin:0 0 4px; ${isGap ? 'color:var(--rust);' : ''} ${applicable === false ? 'opacity:0.7;' : ''}">${isGap ? '⚠ ' : '• '}${item.label} <span class="confidence-badge ${badgeVariant}" style="margin:0 4px;">${badge}</span> — <b>${applicable === false ? 'Not applicable' : statusLabel}</b>${it?.notes ? ` <span style="color:var(--ink-soft);">(${escAttr(it.notes)})</span>` : ''}${isGap ? `<br><span style="font-size:11px; font-style:italic;">${item.why}</span>` : ''}</p>${isGap ? `<div style="margin:0 0 8px;">${addToActionsButtonHtml(item.label, priority, 'estate', item.why)}</div>` : ''}`;
        }).join('')}
        ${gaps > 0 ? `<p class="muted plain" style="margin:6px 0 0; font-size:11px; color:var(--rust);">${gaps} item${gaps === 1 ? '' : 's'} flagged as not in place — also visible from Risk → Owner & Succession.</p>` : ''}
        <button class="mini-link" id="goto-estate-checklist-link" type="button" style="margin-top:8px;">→ Edit in Owner & Succession Input</button>
      </div>
    </div>
  `;
}

// Business continuity asks a different question from succession — "what
// happens if something goes wrong tomorrow" vs succession's "what happens
// when I intentionally leave." The Business Risk Questionnaire (People and
// Operations categories) already asks almost exactly this — "Could the
// business continue if the owner was unavailable for 3 months?" among
// others — and the estate checklist already covers death-of-owner
// protection (will/EPOA/buy-sell/key-person insurance). This card
// deliberately does NOT re-ask any of that; it reads what's already on
// file and synthesizes it into one view, same "enter once" principle the
// Risk/Meeting propagation work just proved out.
const OWNER_CONTINUITY_QUESTIONS = [
  { text: 'Is the business heavily dependent on the owner?', label: 'Owner dependence', why: 'Build a second-in-command who can make the calls you\'d normally make, and start moving key relationships (customers, suppliers, the bank) onto them too — not just tasks.' },
  { text: 'Is there a key employee the business couldn\'t easily replace?', label: 'Key employee dependence', why: 'Cross-train at least one other person on what only they know, and document it — a single point of failure is a gap whether it\'s the owner or someone else.' },
  { text: 'Could the business continue if the owner was unavailable for 3 months?', label: 'Could continue 3 months without the owner', why: 'This is the direct test — if the honest answer is no, the fix is the same as owner dependence and processes documented above: delegate real authority, and write down how things actually run.' },
  { text: 'Are critical processes documented?', label: 'Processes documented', why: 'Start with whatever would cause the most damage undocumented (payroll, key supplier terms, how a job actually gets quoted and delivered) — it doesn\'t need to be everything at once.' },
];
const OWNER_CONTINUITY_DEATH_KEYS = ['will', 'epoa', 'buy_sell_agreement', 'key_person_insurance'];

// Matched by exact question text against allQuestions (get_risk_items), then
// the latest business risk_items row for that question_id — same
// latest-per-question logic getCategoriesForReview uses server-side,
// reimplemented client-side since this card only needs a read, not the
// full due-for-review machinery.
function findBusinessQuestionAnswer(questionText, businessRows, allQuestions) {
  const question = (allQuestions || []).find((q) => q.question_text === questionText);
  if (!question) return { answered: false };
  const rows = (businessRows || [])
    .filter((r) => r.question_id === question.id)
    .sort((a, b) => (b.last_reviewed_date || '').localeCompare(a.last_reviewed_date || ''));
  if (!rows.length) return { answered: false };
  return { answered: true, riskPresent: rows[0].status === 'Identified' || rows[0].status === 'Watch' };
}

// Verdict comes straight from the one question that actually asks this —
// "Could the business continue if the owner was unavailable for 3 months?"
// — rather than inferring it from the other signals, which are supporting
// evidence, not the test itself. No 30-day figure exists in the data
// collected anywhere, so this deliberately doesn't invent one — it reports
// the 3-month answer honestly rather than presenting false precision.
function ownerContinuityVerdict(signals) {
  const core = signals.find((s) => s.label === 'Could continue 3 months without the owner');
  if (!core || !core.answered) {
    return { text: 'Not yet known — answer "Could the business continue if the owner was unavailable for 3 months?" in Risk → Business to see a verdict here.', color: 'var(--ink-soft)' };
  }
  if (core.riskPresent) {
    return { text: 'Currently NO — the business is not set up to continue 3 months without the owner, based on the answer on file.', color: 'var(--rust)' };
  }
  const supportingGaps = signals.filter((s) => s.label !== 'Could continue 3 months without the owner' && s.answered && s.riskPresent).length;
  return supportingGaps
    ? { text: `Currently YES, on file — though ${supportingGaps} supporting gap${supportingGaps === 1 ? '' : 's'} below could undermine that if left unaddressed.`, color: 'var(--rust)' }
    : { text: 'Currently YES — the business is set up to continue 3 months without the owner, based on answers on file.', color: 'var(--sage)' };
}

// Same shape as ownerContinuityVerdict above, but for the 4 estate items
// rather than the single "3 months" question — there's no one question
// that tests this directly, so the verdict comes from whether all 4 are
// answered and clean, not from inferring a single yes/no the way the
// continuity verdict does.
function ownerDeathReadinessVerdict(deathSignals) {
  const unanswered = deathSignals.filter((s) => !s.answered).length;
  const gaps = deathSignals.filter((s) => s.answered && s.riskPresent).length;
  if (!deathSignals.length) {
    return { text: 'No estate protections apply to this business structure.', color: 'var(--ink-soft)' };
  }
  if (unanswered === deathSignals.length) {
    return { text: `Not yet known — none of the ${deathSignals.length} estate protection${deathSignals.length === 1 ? '' : 's'} below have been assessed. Answer them in Owner & Succession → Input to see a verdict here.`, color: 'var(--ink-soft)' };
  }
  if (gaps > 0) {
    return { text: `${gaps} of ${deathSignals.length} estate protection${deathSignals.length === 1 ? '' : 's'} missing — the business and/or family would face real complications if the owner died today. See below for what to do about each.`, color: 'var(--rust)' };
  }
  if (unanswered > 0) {
    return { text: `No gaps in what's been assessed, but ${unanswered} estate protection${unanswered === 1 ? '' : 's'} still not checked — not fully covered yet.`, color: 'var(--ink-soft)' };
  }
  return { text: `Covered — all ${deathSignals.length} applicable estate protection${deathSignals.length === 1 ? '' : 's'} in place, based on answers on file.`, color: 'var(--sage)' };
}

function renderOwnerContinuityCard(businessRows, allQuestions, checklist) {
  const entityType = currentCtx?.entity_type;
  const signals = OWNER_CONTINUITY_QUESTIONS.map((q) => ({ label: q.label, why: q.why, ...findBusinessQuestionAnswer(q.text, businessRows, allQuestions) }));
  const byKey = Object.fromEntries((checklist || []).map((it) => [it.key, it]));
  // Not-applicable items (e.g. buy-sell agreement for a sole trader) are
  // excluded outright rather than shown as a permanent "Covered" — they're
  // not a protection this business needs, so counting them either way
  // would misstate how many actually apply.
  const deathSignals = OWNER_ESTATE_CHECKLIST_ITEMS
    .filter((item) => OWNER_CONTINUITY_DEATH_KEYS.includes(item.key) && ownerEstateItemApplicability(item.key, entityType) !== false)
    .map((item) => {
      const status = byKey[item.key]?.status;
      return { label: item.label, why: item.why, answered: status === 'yes' || status === 'no', riskPresent: status === 'no' };
    });
  const allSignals = [...signals, ...deathSignals];
  const gapCount = allSignals.filter((s) => s.answered && s.riskPresent).length;
  const unansweredCount = allSignals.filter((s) => !s.answered).length;
  // Split by where each actually gets answered — the 4 business-risk
  // signals live in Risk → Business, the estate ones live in Owner &
  // Succession → Input. One combined "go answer" link would send someone
  // to the wrong screen half the time if only one side had gaps.
  const unansweredBusinessCount = signals.filter((s) => !s.answered).length;
  const unansweredDeathCount = deathSignals.filter((s) => !s.answered).length;
  const verdict = ownerContinuityVerdict(signals);
  const deathVerdict = ownerDeathReadinessVerdict(deathSignals);
  // Nothing-assessed gets its own line rather than falling into "No gaps in
  // what's been assessed so far" — that's technically true (0 gaps found
  // among 0 checked) but reads as a false all-clear sitting right next to
  // a verdict that just said "Not yet known" above it.
  const summaryText = unansweredCount === allSignals.length
    ? 'Nothing assessed yet.'
    : (gapCount ? `${gapCount} gap${gapCount === 1 ? '' : 's'} identified.` : 'No gaps in what\'s been assessed so far.')
      + (unansweredCount ? ` ${unansweredCount} not yet assessed.` : '');

  const signalRow = (s) => {
    const icon = !s.answered ? '❓' : s.riskPresent ? '⚠' : '✓';
    const statusText = !s.answered ? 'Not yet assessed' : s.riskPresent ? 'Gap' : 'Covered';
    const color = !s.answered ? 'var(--ink-soft)' : s.riskPresent ? 'var(--rust)' : 'var(--sage)';
    const isGap = s.answered && s.riskPresent;
    return `<p class="muted plain" style="margin:0 0 6px; color:${color};">${icon} ${s.label} — <b>${statusText}</b></p>${isGap && s.why ? `<p style="font-size:11px; color:var(--ink-soft); margin:-4px 0 4px 18px; font-style:italic;">${s.why}</p>` : ''}${isGap ? `<div style="margin:0 0 8px 18px;">${addToActionsButtonHtml(s.label, null, 'continuity', s.why)}</div>` : ''}`;
  };

  return `
    <div class="card">
      <p class="muted">Business continuity</p>
      <p class="muted plain" style="margin:0 0 10px;">What happens if something goes wrong tomorrow — different from succession above, which is about intentionally leaving. Pulled from answers already on file in Risk and the estate checklist, not asked again here.</p>
      <p class="card-label" style="margin:0 0 4px;">If the owner were suddenly unavailable</p>
      <p class="muted plain" style="margin:0 0 8px; color:${verdict.color};"><b>${verdict.text}</b></p>
      ${signals.map(signalRow).join('')}
      <p class="card-label" style="margin:10px 0 4px;">If the owner died</p>
      <p class="muted plain" style="margin:0 0 8px; color:${deathVerdict.color};"><b>${deathVerdict.text}</b></p>
      ${deathSignals.map(signalRow).join('')}
      <p class="muted plain" style="margin:8px 0 0; font-size:11px; ${gapCount ? 'color:var(--rust);' : ''}">${summaryText}</p>
      ${unansweredBusinessCount ? `<button class="mini-link" id="goto-continuity-risk-link" type="button" style="margin-top:8px;">→ Answer in Risk → Business</button>` : ''}
      ${unansweredDeathCount ? `<button class="mini-link" id="goto-continuity-estate-link" type="button" style="margin-top:8px; margin-left:8px;">→ Answer in Owner & Succession Input</button>` : ''}
    </div>
  `;
}

// Converts a findBusinessQuestionAnswer result into this card's 0-10 scale.
// Unanswered stays null — excluded from the average below rather than
// scored as a 0, so a client who hasn't touched the Business Risk
// Questionnaire yet doesn't get punished for it. All four reused
// questions here are "a risk being present is bad for a buyer" (owner/
// key-employee dependence, customer concentration, undocumented
// processes), so one mapping covers all four.
function exitReadinessBusinessSignalScore(questionText, businessRows, allQuestions) {
  const { answered, riskPresent } = findBusinessQuestionAnswer(questionText, businessRows, allQuestions);
  if (!answered) return null;
  return riskPresent ? 0 : 10;
}

// yes=10, partial=5, no=0, unknown/missing=null — same "exclude the
// unknown rather than penalize it" treatment as the business signals above.
function exitReadinessChecklistScore(status) {
  if (status === 'yes') return 10;
  if (status === 'partial') return 5;
  if (status === 'no') return 0;
  return null;
}

// "What to do" copy for the 5 REUSED factors — the 5 new checklist items
// already carry their own "why" text in OWNER_EXIT_READINESS_ITEMS above;
// this is the equivalent for the factors pulled in from elsewhere, so the
// top-gaps list on the card can show real guidance instead of just naming
// the gap.
const EXIT_READINESS_SIGNAL_WHY = {
  owner_dependence: 'A business a buyer thinks can\'t run without you gets discounted hard, or walked away from — delegate real decisions and relationships, not just tasks.',
  key_employee_dependence: 'One irreplaceable employee is a single point of failure a buyer will price in — cross-train and document what only they know.',
  customer_concentration: 'Revenue a buyer assumes could leave with one relationship is revenue they won\'t pay full price for — winning a broader customer base directly lifts what they\'ll offer.',
  processes_documented: 'Undocumented processes mean a buyer is really buying you, not the business — write down how the critical work actually gets done.',
  profitability: 'Profitability is one of the most directly-priced factors in a sale — most exit multiples apply straight to profit, so improving margin has an outsized effect on price.',
};

// 10 factors on a 0-10 scale each: 4 reused Business Risk Q answers +
// reused profitability pillar score + the 5 new exit readiness checklist
// items above. Overall = average of only the ASSESSED (non-null) factors
// × 10 — a client who's only answered half the picture still gets a real
// score for the half that's known, shown next to "X of 10 assessed" rather
// than dragged toward 0 by treating "not yet asked" the same as "asked,
// and it's bad." Top gaps = the lowest-scoring assessed factors under 7,
// capped at 3 — matches the original proposal's "Top 3 things reducing
// value" framing.
function computeExitReadinessScore(checklist, businessRows, allQuestions, profitabilityScore) {
  const byKey = Object.fromEntries((checklist || []).map((it) => [it.key, it]));
  const factors = [
    { key: 'owner_dependence', label: 'Not overly dependent on the owner', why: EXIT_READINESS_SIGNAL_WHY.owner_dependence, score: exitReadinessBusinessSignalScore('Is the business heavily dependent on the owner?', businessRows, allQuestions) },
    { key: 'key_employee_dependence', label: 'Not overly dependent on one key employee', why: EXIT_READINESS_SIGNAL_WHY.key_employee_dependence, score: exitReadinessBusinessSignalScore('Is there a key employee the business couldn\'t easily replace?', businessRows, allQuestions) },
    { key: 'customer_concentration', label: 'Revenue not concentrated in one customer', why: EXIT_READINESS_SIGNAL_WHY.customer_concentration, score: exitReadinessBusinessSignalScore('Is a significant amount of revenue dependent on one customer?', businessRows, allQuestions) },
    { key: 'processes_documented', label: 'Critical processes documented', why: EXIT_READINESS_SIGNAL_WHY.processes_documented, score: exitReadinessBusinessSignalScore('Are critical processes documented?', businessRows, allQuestions) },
    { key: 'profitability', label: 'Profitability', why: EXIT_READINESS_SIGNAL_WHY.profitability, score: profitabilityScore != null ? profitabilityScore : null },
    ...OWNER_EXIT_READINESS_ITEMS.map((item) => ({ key: item.key, label: item.label, why: item.why, score: exitReadinessChecklistScore(byKey[item.key]?.status) })),
  ];
  const assessed = factors.filter((f) => f.score != null);
  const overall = assessed.length ? Math.round((assessed.reduce((sum, f) => sum + f.score, 0) / assessed.length) * 10) : null;
  const topGaps = assessed.filter((f) => f.score < 7).sort((a, b) => a.score - b.score).slice(0, 3);
  return { overall, assessedCount: assessed.length, totalCount: factors.length, topGaps };
}

// A genuine new subsystem, not a bolt-on score — separate card from
// Succession above, since that asks "who takes over" and this asks "what
// would a buyer actually pay for it." Same "read the score, jump to fix
// the gap" shape as the other Owner Wealth cards.
// A verdict, not just a number — a 62/100 means nothing to a client on its
// own. Thresholds are a rule of thumb, same spirit as the 4% withdrawal
// rate default elsewhere in this app: not a formal valuation methodology,
// just enough to turn the score into "ready," "getting there," or "not
// ready" plus what that actually means. Needing at least half the factors
// assessed before calling it "ready" or "not ready" stops a score built on
// 2 of 10 factors from reading as a confident verdict it hasn't earned.
function exitReadinessVerdict(overall, assessedCount, totalCount) {
  if (overall == null) {
    return { text: 'Not enough on file yet to say — answer the exit readiness checklist below, and the Business Risk Questionnaire, to get a verdict here.', tone: 'neutral' };
  }
  if (assessedCount < totalCount / 2) {
    return { text: `Too early to call — only ${assessedCount} of ${totalCount} factors assessed so far, so ${overall}/100 is based on a partial picture. Answer more below to firm it up.`, tone: 'neutral' };
  }
  if (overall >= 80) {
    return { text: `Ready — at ${overall}/100, a buyer would likely see this as a strong, sellable business as-is.`, tone: 'positive' };
  }
  if (overall >= 60) {
    return { text: `Getting there — ${overall}/100. A buyer would have real questions, but nothing here looks like a deal-breaker yet.`, tone: 'neutral' };
  }
  return { text: `Not ready — ${overall}/100. The gaps below would materially reduce what a buyer pays, or give them a reason to walk. Worth addressing before actively pursuing a sale.`, tone: 'urgent' };
}

function renderOwnerExitReadinessCard(result) {
  const { overall, assessedCount, totalCount, topGaps } = result;
  const verdict = exitReadinessVerdict(overall, assessedCount, totalCount);
  const verdictBg = verdict.tone === 'urgent' ? 'var(--rust-bg)' : verdict.tone === 'positive' ? 'var(--sage-bg)' : 'var(--paper-raised)';
  const verdictColor = verdict.tone === 'urgent' ? 'var(--rust)' : verdict.tone === 'positive' ? 'var(--sage)' : 'var(--ink)';
  return `
    <div class="card">
      <p class="muted">Exit readiness</p>
      <p class="muted plain" style="margin:0 0 10px;">What a buyer would actually pay for — separate from succession above, which is about who takes over, not what the business is worth to someone else.</p>
      ${overall != null ? `
        <div style="background:var(--sage-bg); border-radius:8px; padding:8px 12px; display:inline-block; margin-bottom:10px;">
          <p class="kpi-value" style="margin:0;">${overall}/100</p>
          <p class="card-label" style="margin:2px 0 0;">Exit Readiness — ${assessedCount} of ${totalCount} assessed</p>
        </div>
      ` : ''}
      <div style="background:${verdictBg}; ${verdict.tone === 'neutral' ? 'border:1px solid var(--line);' : ''} border-radius:8px; padding:10px 14px; margin-bottom:12px;">
        <p class="muted plain" style="margin:0; color:${verdictColor}; font-size:13px;"><b>${verdict.text}</b></p>
      </div>
      ${topGaps.length ? `
        <p class="card-label" style="margin:12px 0 4px;">Top things reducing value</p>
        ${topGaps.map((g) => `<p class="muted plain" style="margin:0 0 2px; color:var(--rust);">⚠ ${g.label} <span style="color:var(--ink-soft);">(${g.score}/10)</span></p>${g.why ? `<p style="font-size:11px; color:var(--ink-soft); margin:0 0 4px; font-style:italic;">${g.why}</p>` : ''}${addToActionsButtonHtml(g.label, g.score < 4 ? 'High' : 'Medium', 'exit_readiness', g.why)}`).join('')}
      ` : ''}
      <button class="mini-link" id="goto-exit-readiness-input-link" type="button" style="margin-top:8px;">→ Answer in Owner & Succession Input</button>
      <button class="mini-link" id="goto-exit-readiness-business-link" type="button" style="margin-top:8px; margin-left:8px;">→ Answer in Risk → Business</button>
    </div>
  `;
}

// One row per named item within a bucket (e.g. "AustralianSuper", "12 Smith
// St") — exact same shape/classes as renderReconAdjustmentRow's cash
// reconciliation adjustment rows, reused rather than reinvented.
function renderOwnerWealthItemRow(item, bucket) {
  return `
    <div class="cash-item cash-adj-item ow-item-row" data-ow-bucket="${bucket}">
      <span class="cash-item-icon">·</span>
      <input type="text" class="ow-item-label" placeholder="e.g. AustralianSuper" value="${escAttr(item.label || '')}" />
      <input type="number" step="0.01" class="ow-item-value" value="${item.value ?? ''}" placeholder="Amount" />
      <button type="button" class="ow-item-remove cash-adj-remove" title="Remove">✕</button>
    </div>
  `;
}

// Each bucket gets its own bordered box (.cash-accordion-section — same
// boxed-list treatment already used for cash reconciliation's adjustments),
// collapsible so a click from the Analyse tiles can open just the one
// bucket you clicked into instead of dropping you into all five at once.
function renderOwnerWealthBucket(bucket, label, items, openByDefault) {
  const total = items.reduce((sum, it) => sum + (Number(it.value) || 0), 0);
  return `
    <div class="cash-accordion-section">
      <button type="button" class="cash-accordion-head" data-accordion-toggle="${bucket}">
        <span class="cash-accordion-head-label">${label}</span>
        <span class="cash-accordion-head-value" id="ow-bucket-total-${bucket}"><span class="ow-bucket-amount-text">${formatMoney(total)}</span> <span class="chevron">${openByDefault ? '▴' : '▾'}</span></span>
      </button>
      <div class="cash-accordion-body" id="ow-body-${bucket}" style="display:${openByDefault ? 'block' : 'none'};">
        <div id="ow-items-list-${bucket}">${items.map((it) => renderOwnerWealthItemRow(it, bucket)).join('')}</div>
        <button type="button" class="mini-link" data-ow-add="${bucket}" style="margin:6px 0 9px;">+ Add item</button>
      </div>
    </div>
  `;
}

// A user-named box beyond the fixed five — same collapsible shell, but the
// header carries an editable name and an asset/liability picker instead of
// a fixed label, plus a "remove this box" action in the body. Name/type
// controls sit next to (not inside) the toggle target so editing them
// doesn't also collapse the box.
function renderOwnerCustomBucket(bucket, openByDefault) {
  const items = bucket.items || [];
  const total = items.reduce((sum, it) => sum + (Number(it.value) || 0), 0);
  const key = `custom-${bucket.id}`;
  return `
    <div class="cash-accordion-section" data-ow-custom-id="${bucket.id}">
      <div class="cash-accordion-head" style="cursor:default;">
        <input type="text" class="ow-item-label ow-custom-name" data-ow-custom-name="${bucket.id}" value="${escAttr(bucket.label || '')}" placeholder="Box name" style="flex:1; max-width:220px;" />
        <select class="ow-custom-type" data-ow-custom-type="${bucket.id}" style="font-size:12px; font-family:var(--font-body); border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); color:var(--ink); padding:6px 8px;">
          <option value="asset" ${bucket.type !== 'liability' ? 'selected' : ''}>Asset (adds)</option>
          <option value="liability" ${bucket.type === 'liability' ? 'selected' : ''}>Liability (subtracts)</option>
        </select>
        <span class="cash-accordion-head-value ${bucket.type === 'liability' ? 'neg' : ''}" data-accordion-toggle="${key}" style="cursor:pointer;" id="ow-bucket-total-${key}"><span class="ow-bucket-amount-text">${bucket.type === 'liability' && total ? '− ' : ''}${formatMoney(total)}</span> <span class="chevron">${openByDefault ? '▴' : '▾'}</span></span>
      </div>
      <div class="cash-accordion-body" id="ow-body-${key}" style="display:${openByDefault ? 'block' : 'none'};">
        <div id="ow-items-list-${key}">${items.map((it) => renderOwnerWealthItemRow(it, key)).join('')}</div>
        <button type="button" class="mini-link" data-ow-add="${key}" style="margin:6px 0 9px;">+ Add item</button>
        <button type="button" class="mini-link" data-ow-remove-box="${bucket.id}" style="color:var(--rust);">✕ Remove this box</button>
      </div>
    </div>
  `;
}

async function renderOwnerInput(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No period selected</p><p class="muted plain" style="margin:0;">Select or create a period first.</p></div>`;
    return;
  }
  const data = await callRead('get_owner_wealth', currentClientId, currentPeriodEnd);
  if (myToken !== renderToken) return;
  const existing = (data?.snapshots || []).find((s) => s.period_end === currentPeriodEnd) || {};

  // Backward-compatible with a bucket that has an old lump-sum total but no
  // itemized rows yet (saved before itemization existed) — shows it as one
  // pre-filled, editable line rather than silently losing the figure.
  const itemsFor = (itemsField, totalField) => {
    if (Array.isArray(existing[itemsField]) && existing[itemsField].length) return existing[itemsField];
    if (existing[totalField] != null) return [{ label: '', value: existing[totalField] }];
    return [];
  };
  const bucketItems = {
    super: itemsFor('super_items', 'super_balance'),
    investments: itemsFor('investments_items', 'investments'),
    property: itemsFor('property_items', 'property'),
    other: itemsFor('other_assets_items', 'other_assets'),
    debt: itemsFor('debt_items', 'debt'),
  };
  const customBuckets = Array.isArray(existing.custom_buckets) ? existing.custom_buckets : [];

  // A jump from one Analyse tile opens just that bucket; any other way of
  // reaching Input (the sidebar tab, Save-and-return, etc.) opens everything
  // — see ownerInputFocusBucket's declaration for why.
  const isOpen = (key) => (ownerInputFocusBucket ? ownerInputFocusBucket === key : true);

  content.innerHTML = `
    <div class="card">
      <button type="button" class="mini-link" id="ow-back-to-analyse" style="margin-bottom:8px;">← Back to Owner & Succession summary</button>
      <p class="muted">Owner & Succession — ${formatShortDate(currentPeriodEnd)}</p>
      <p class="muted plain" style="margin:0 0 14px;">Personal net worth, captured once a year. Break each bucket into as many named items as you like — a super fund, a specific property, a share portfolio — add or remove lines freely; each bucket's total is just the sum of its items. Not the business's own numbers; those live under Financial Performance.</p>
      ${renderOwnerWealthBucket('super', 'Superannuation', bucketItems.super, isOpen('super'))}
      ${renderOwnerWealthBucket('investments', 'Investments', bucketItems.investments, isOpen('investments'))}
      ${renderOwnerWealthBucket('property', 'Property', bucketItems.property, isOpen('property'))}
      ${renderOwnerWealthBucket('other', 'Other assets', bucketItems.other, isOpen('other'))}
      ${renderOwnerWealthBucket('debt', 'Personal debt', bucketItems.debt, isOpen('debt'))}
      <div id="ow-custom-boxes">${customBuckets.map((b) => renderOwnerCustomBucket(b, isOpen(`custom-${b.id}`))).join('')}</div>
      <button type="button" class="mini-link" id="ow-add-box-btn" style="margin:8px 0 0;">+ Add box</button>
      ${renderOwnerEstateChecklistInput(existing.estate_planning_checklist, currentCtx?.entity_type)}
      ${renderOwnerExitReadinessInput(existing.exit_readiness_checklist)}
      <div class="form-field" style="margin-top:14px;"><label>Notes (optional)</label><textarea id="ow-notes" rows="2">${existing.notes || ''}</textarea></div>
      <button class="action" id="ow-save-btn" type="button">Save</button>
      <span id="ow-save-msg" style="margin-left:8px; font-size:12px; color:var(--ink-soft);"></span>
    </div>
  `;

  const rowsFor = (bucket) => [...content.querySelectorAll(`.ow-item-row[data-ow-bucket="${bucket}"]`)];
  // Custom-box totals carry a sign (liabilities show "− $x" and use the
  // same .neg colour cash reconciliation uses for negative subtotals) —
  // built-in buckets never do, their sign is implied by which bucket it is.
  const recalcBucket = (bucket) => {
    const total = rowsFor(bucket).reduce((sum, row) => sum + (Number(row.querySelector('.ow-item-value').value || 0)), 0);
    const valueEl = document.getElementById(`ow-bucket-total-${bucket}`);
    const amountEl = valueEl.querySelector('.ow-bucket-amount-text');
    const customId = bucket.startsWith('custom-') ? bucket.slice(7) : null;
    const isLiability = customId && content.querySelector(`[data-ow-custom-type="${customId}"]`)?.value === 'liability';
    valueEl.classList.toggle('neg', !!isLiability);
    amountEl.textContent = `${isLiability && total ? '− ' : ''}${formatMoney(total)}`;
  };
  const wireItemRow = (row, bucket) => {
    row.querySelector('.ow-item-value').oninput = () => recalcBucket(bucket);
    row.querySelector('.ow-item-remove').onclick = () => { row.remove(); recalcBucket(bucket); };
  };
  const wireAddButton = (bucket) => {
    const addBtn = content.querySelector(`[data-ow-add="${bucket}"]`);
    if (!addBtn) return;
    addBtn.onclick = () => {
      const list = document.getElementById(`ow-items-list-${bucket}`);
      list.insertAdjacentHTML('beforeend', renderOwnerWealthItemRow({ label: '', value: '' }, bucket));
      const newRow = list.lastElementChild;
      wireItemRow(newRow, bucket);
      newRow.querySelector('.ow-item-label').focus();
    };
  };
  const wireAccordionToggle = (key) => {
    const toggleEl = content.querySelector(`[data-accordion-toggle="${key}"]`);
    if (!toggleEl) return;
    toggleEl.onclick = () => {
      const body = document.getElementById(`ow-body-${key}`);
      body.style.display = body.style.display === 'none' ? 'block' : 'none';
      const chevron = toggleEl.querySelector('.chevron');
      if (chevron) chevron.textContent = body.style.display === 'none' ? '▾' : '▴';
    };
  };
  const wireCustomBox = (section) => {
    const id = section.dataset.owCustomId;
    const key = `custom-${id}`;
    rowsFor(key).forEach((row) => wireItemRow(row, key));
    wireAddButton(key);
    wireAccordionToggle(key);
    section.querySelector('[data-ow-custom-type]').onchange = () => recalcBucket(key);
    section.querySelector('[data-ow-remove-box]').onclick = () => {
      const name = section.querySelector('[data-ow-custom-name]').value || 'this box';
      if (!confirm(`Remove "${name}" and all its items? This only takes effect once you Save.`)) return;
      section.remove();
    };
  };

  ['super', 'investments', 'property', 'other', 'debt'].forEach((bucket) => {
    rowsFor(bucket).forEach((row) => wireItemRow(row, bucket));
    wireAddButton(bucket);
    wireAccordionToggle(bucket);
  });
  content.querySelectorAll('#ow-custom-boxes > [data-ow-custom-id]').forEach(wireCustomBox);

  document.getElementById('ow-add-box-btn').onclick = () => {
    const id = `new-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const container = document.getElementById('ow-custom-boxes');
    container.insertAdjacentHTML('beforeend', renderOwnerCustomBucket({ id, label: '', type: 'asset', items: [] }, true));
    const section = container.lastElementChild;
    wireCustomBox(section);
    section.querySelector('.ow-custom-name').focus();
  };

  const goBackToAnalyse = async () => {
    currentWorkflow = 'analyse';
    renderWorkflowTabsActive();
    renderSidebarDomains();
    await renderMain();
  };
  document.getElementById('ow-back-to-analyse').onclick = goBackToAnalyse;

  document.getElementById('ow-save-btn').onclick = async () => {
    const btn = document.getElementById('ow-save-btn');
    const msg = document.getElementById('ow-save-msg');
    btn.disabled = true;
    msg.textContent = 'Saving…';
    const itemsPayload = (bucket) => rowsFor(bucket).map((row) => ({ label: row.querySelector('.ow-item-label').value, value: row.querySelector('.ow-item-value').value }));
    const customBucketsPayload = [...content.querySelectorAll('#ow-custom-boxes > [data-ow-custom-id]')].map((section) => {
      const id = section.dataset.owCustomId;
      return {
        id,
        label: section.querySelector('[data-ow-custom-name]').value,
        type: section.querySelector('[data-ow-custom-type]').value,
        items: itemsPayload(`custom-${id}`),
      };
    });
    const estateChecklistPayload = [...content.querySelectorAll('[data-estate-key]')].map((row) => ({
      key: row.dataset.estateKey,
      status: row.querySelector('.ow-estate-status').value,
      notes: row.querySelector('.ow-estate-notes').value,
    }));
    const exitReadinessChecklistPayload = [...content.querySelectorAll('[data-exit-key]')].map((row) => ({
      key: row.dataset.exitKey,
      status: row.querySelector('.ow-exit-status').value,
      notes: row.querySelector('.ow-exit-notes').value,
    }));
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({
          type: 'save_owner_wealth', client_id: currentClientId, period_end: currentPeriodEnd,
          super_items: itemsPayload('super'), investments_items: itemsPayload('investments'),
          property_items: itemsPayload('property'), other_assets_items: itemsPayload('other'),
          debt_items: itemsPayload('debt'), custom_buckets: customBucketsPayload,
          estate_planning_checklist: estateChecklistPayload,
          exit_readiness_checklist: exitReadinessChecklistPayload,
          notes: document.getElementById('ow-notes').value,
        }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      // Straight back to the summary on success — you just entered data,
      // seeing the recalculated total/chart is the natural next thing to
      // see, not sitting on the now-stale form.
      await goBackToAnalyse();
    } catch (err) {
      msg.textContent = 'error';
      alert('Error: ' + err.message);
      btn.disabled = false;
    }
  };
}

async function renderOwnerAnalyse(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add this period's numbers on Owner & Succession → Input first.</p></div>`;
    return;
  }
  const [data, riskData, overview] = await Promise.all([
    callRead('get_owner_wealth', currentClientId, currentPeriodEnd),
    callRead('get_risk_items', currentClientId, currentPeriodEnd),
    callRead('get_overview', currentClientId, currentPeriodEnd),
  ]);
  if (myToken !== renderToken) return;
  const snapshots = data?.snapshots || [];
  const wealth = snapshots.find((s) => s.period_end === currentPeriodEnd) || {};
  const total = computeNetWorthTotal(wealth);

  // Owner Wealth is annual-only by design (CADENCE_PILLARS, analyze.js) so
  // there's at most one saved row per year already — no dedupe-by-year step
  // needed the way the Valuation card's history chart needed one.
  const periods = snapshots.map((s) => s.period_end);
  const netWorthValues = snapshots.map((s) => computeNetWorthTotal(s));
  // Bigger than the default chart size — this is the headline trend for the
  // whole domain, given more visual weight than the business-equity
  // cross-reference it sits next to.
  const trendChart = periods.length >= 2 ? renderTrendLineChart(periods, netWorthValues, 'var(--sage)', 420, 110) : '';
  const equityTile = renderBusinessEquityTile(data?.latestValuation);
  const profitabilityScore = (overview?.pillarScores || []).find((p) => p.pillar === 'profitability')?.score ?? null;
  const exitReadinessResult = computeExitReadinessScore(wealth.exit_readiness_checklist, riskData?.business || [], riskData?.allQuestions || [], profitabilityScore);
  // Computed once here (not inside renderOwnerContinuityCard) purely so
  // the succession card's suggestion above can reference the same verdict
  // without the two cards silently drifting out of sync with each other.
  const continuitySignals = OWNER_CONTINUITY_QUESTIONS.map((q) => ({ label: q.label, why: q.why, ...findBusinessQuestionAnswer(q.text, riskData?.business || [], riskData?.allQuestions || []) }));
  const continuityVerdict = ownerContinuityVerdict(continuitySignals);

  content.innerHTML = `
    <div class="card">
      <p class="muted">Net worth — ${formatShortDate(currentPeriodEnd)}</p>
      ${total == null ? `<p class="muted plain" style="margin:0;">Nothing entered yet for this period — add figures on Owner & Succession → Input.</p>` : `
        <div style="background:var(--sage-bg); border-radius:8px; padding:8px 12px; display:inline-block;">
          <p class="kpi-value" style="margin:0;">${formatMoney(total)}</p>
          <p class="card-label" style="margin:2px 0 0;">Total net worth</p>
        </div>
        <div class="snapshot-grid" style="margin-top:12px;">
          <div class="snapshot-field ow-jump-tile" data-ow-jump="super" title="Click to edit"><p class="card-label">Superannuation</p><p style="margin:0; font-family:var(--font-mono);">${formatMoney(wealth.super_balance)}</p></div>
          <div class="snapshot-field ow-jump-tile" data-ow-jump="investments" title="Click to edit"><p class="card-label">Investments</p><p style="margin:0; font-family:var(--font-mono);">${formatMoney(wealth.investments)}</p></div>
          <div class="snapshot-field ow-jump-tile" data-ow-jump="property" title="Click to edit"><p class="card-label">Property</p><p style="margin:0; font-family:var(--font-mono);">${formatMoney(wealth.property)}</p></div>
          <div class="snapshot-field ow-jump-tile" data-ow-jump="other" title="Click to edit"><p class="card-label">Other assets</p><p style="margin:0; font-family:var(--font-mono);">${formatMoney(wealth.other_assets)}</p></div>
          <div class="snapshot-field ow-jump-tile" data-ow-jump="debt" title="Click to edit"><p class="card-label">Personal debt</p><p style="margin:0; font-family:var(--font-mono);">${wealth.debt != null ? '− ' + formatMoney(wealth.debt) : '—'}</p></div>
          ${(Array.isArray(wealth.custom_buckets) ? wealth.custom_buckets : []).map((b) => {
            const bTotal = (b.items || []).reduce((sum, it) => sum + (Number(it.value) || 0), 0);
            return `<div class="snapshot-field ow-jump-tile" data-ow-jump="custom-${b.id}" title="Click to edit"><p class="card-label">${escAttr(b.label || 'Untitled box')}</p><p style="margin:0; font-family:var(--font-mono);">${b.type === 'liability' && bTotal ? '− ' : ''}${formatMoney(bTotal)}</p></div>`;
          }).join('')}
        </div>
      `}
      ${trendChart && equityTile ? `
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:16px; margin-top:14px; align-items:start;">
          <div style="border:1px solid var(--line); border-radius:8px; padding:12px;">
            <p class="card-label" style="margin:0 0 4px;">Net worth over time</p>${trendChart}
          </div>
          <div style="border:1px solid var(--line); border-radius:8px; padding:12px;">${equityTile}</div>
        </div>
      ` : `
        ${trendChart ? `<div style="border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:14px;"><p class="card-label" style="margin:0 0 4px;">Net worth over time</p>${trendChart}</div>` : ''}
        ${equityTile ? `<div style="border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:14px;">${equityTile}</div>` : ''}
      `}
    </div>
    ${renderOwnerRetirementCard(data?.latestValuation)}
    ${renderOwnerSuccessionCard(data?.latestValuation, wealth.estate_planning_checklist, exitReadinessResult, continuityVerdict)}
    ${renderOwnerExitReadinessCard(exitReadinessResult)}
    ${renderOwnerContinuityCard(riskData?.business || [], riskData?.allQuestions || [], wealth.estate_planning_checklist)}
  `;
  wireAddToActionsButtons(content);

  // Click a net worth tile → jump straight to editing that bucket, same
  // "click a number, land where it's entered" pattern already used
  // elsewhere in this app (e.g. the cash reconciliation jump links) —
  // rather than making the accountant hunt for the separate Input tab
  // themselves.
  content.querySelectorAll('[data-ow-jump]').forEach((el) => {
    el.onclick = async () => {
      const bucket = el.dataset.owJump;
      // Opens just this one bucket on the Input form (see
      // ownerInputFocusBucket's declaration) instead of dropping the
      // accountant into all five-plus-custom boxes at once.
      ownerInputFocusBucket = bucket;
      currentWorkflow = 'input';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
      ownerInputFocusBucket = null;
      const list = document.getElementById(`ow-items-list-${bucket}`);
      if (!list) return;
      const firstValueInput = list.querySelector('.ow-item-value');
      if (firstValueInput) { firstValueInput.focus(); firstValueInput.select(); }
      list.closest('.cash-accordion-section')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  });

  const businessEquityJump = document.getElementById('ow-business-equity-jump');
  if (businessEquityJump) {
    businessEquityJump.onclick = async () => {
      currentDomain = 'growth';
      currentWorkflow = 'analyse';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
      const valuationEl = document.getElementById('valuation-amount');
      if (!valuationEl) return;
      valuationEl.closest('.kpi-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  }

  const yearsInput = document.getElementById('owner-retirement-years');
  if (yearsInput) {
    const headlineEl = document.getElementById('owner-retirement-headline');
    const projectedEl = document.getElementById('owner-retirement-projected');
    const targetEl = document.getElementById('owner-retirement-target');
    const yearsValueEl = document.getElementById('owner-retirement-years-value');
    const growthSuperInput = document.getElementById('owner-retirement-growth-super');
    const growthInvestmentsInput = document.getElementById('owner-retirement-growth-investments');
    const growthPropertyInput = document.getElementById('owner-retirement-growth-property');
    const growthOtherInput = document.getElementById('owner-retirement-growth-other');
    const incomeInput = document.getElementById('owner-retirement-income');
    const withdrawalInput = document.getElementById('owner-retirement-withdrawal');
    const targetOverrideInput = document.getElementById('owner-retirement-target-override');
    const toGoEl = document.getElementById('owner-retirement-to-go');
    const toGoTileEl = document.getElementById('owner-retirement-to-go-tile');
    const postGrowthInput = document.getElementById('owner-retirement-post-growth');
    const retirementYearsInput = document.getElementById('owner-retirement-years-needed');
    const drawdownResultEl = document.getElementById('owner-retirement-drawdown-result');
    const yearsSummaryEl = document.getElementById('owner-retirement-years-summary');
    const yearsZeroHintEl = document.getElementById('owner-retirement-years-zero-hint');
    const includeBusinessInput = document.getElementById('owner-retirement-include-business');
    const businessEquityAmount = data?.latestValuation?.valuation_amount || 0;
    const successionYearsForSuggestion = (() => {
      const ty = getOwnerSuccessionTargetYear();
      return ty != null ? Math.max(0, ty - new Date().getFullYear()) : null;
    })();
    const gatherOneOffs = (bucket) => [...content.querySelectorAll(`.ow-oneoff-row[data-oneoff-bucket="${bucket}"]`)]
      .map((row) => ({ year: Number(row.querySelector('.ow-oneoff-year').value || 0), amount: Number(row.querySelector('.ow-oneoff-amount').value || 0) }))
      .filter((o) => o.year || o.amount); // drop a freshly-added, still-empty row rather than let it distort the projection as a $0-in-year-0 change
    const recalcRetirement = () => {
      const oneOffs = {};
      OWNER_RETIREMENT_BUCKETS.forEach((b) => { oneOffs[b] = gatherOneOffs(b); });
      ownerRetirementState = {
        years: Number(yearsInput.value || 0), growthSuper: Number(growthSuperInput.value || 0),
        growthInvestments: Number(growthInvestmentsInput.value || 0), growthProperty: Number(growthPropertyInput.value || 0),
        growthOther: Number(growthOtherInput.value || 0), desiredIncome: Number(incomeInput.value || 0),
        withdrawalRate: Number(withdrawalInput.value || 0), targetOverride: Number(targetOverrideInput.value || 0),
        postRetirementGrowth: Number(postGrowthInput.value || 0), retirementYears: Number(retirementYearsInput.value || 0),
        includeBusinessEquity: includeBusinessInput ? includeBusinessInput.checked : false, oneOffs,
      };
      const activeBusinessEquity = ownerRetirementState.includeBusinessEquity ? businessEquityAmount : 0;
      const result = projectOwnerRetirementOutlook(
        wealth, ownerRetirementState.years, ownerRetirementState.growthSuper, ownerRetirementState.growthInvestments,
        ownerRetirementState.growthProperty, ownerRetirementState.growthOther, ownerRetirementState.desiredIncome, ownerRetirementState.withdrawalRate,
        ownerRetirementState.oneOffs, activeBusinessEquity
      );
      // Box 1: projected net worth at "Project forward (years)".
      projectedEl.textContent = formatMoney(result.projectedNetWorth);
      yearsZeroHintEl.textContent = ownerRetirementState.years === 0
        ? 'Set this above 0 — growth rates below have nothing to compound against while this is 0.' : '';

      // Three ways to land on a target, most-specific wins: a typed-in
      // override beats the growth-adjusted present-value calc (only kicks
      // in once both income AND a retirement length are set), which beats
      // the flat income/withdrawal-rate divisor.
      const growthAdjustedTarget = ownerRetirementState.retirementYears > 0
        ? solveRequiredPrincipal(ownerRetirementState.desiredIncome, ownerRetirementState.postRetirementGrowth, ownerRetirementState.retirementYears)
        : null;
      const target = ownerRetirementState.targetOverride > 0 ? ownerRetirementState.targetOverride
        : growthAdjustedTarget != null ? growthAdjustedTarget
        : result.targetNestEgg;

      // Box 2 + 3: the target and how long it'd take to reach it — both
      // independent of "Project forward (years)", which only drives Box 1.
      if (target == null) {
        targetEl.textContent = '—';
        yearsValueEl.textContent = '—';
        toGoEl.textContent = '';
        toGoTileEl.textContent = '';
        headlineEl.textContent = 'Set a desired income and withdrawal rate — or type a target directly — below to see a target and a years-to-retire estimate.';
        yearsSummaryEl.textContent = 'Set a target in Amount required for retirement first — years-to-retire has nothing to solve for yet.';
      } else {
        targetEl.textContent = formatMoney(target);
        // "To go" tracks against Projected net worth (Box 1) — not today's
        // static figure — so it actually moves when you adjust "Project
        // forward (years)" or a growth rate, instead of sitting frozen at
        // today's gap while everything else on the card responds live.
        const toGo = target - result.projectedNetWorth;
        const toGoText = toGo <= 0 ? `${formatMoney(Math.abs(toGo))} past target at year ${ownerRetirementState.years}` : `${formatMoney(toGo)} to go at year ${ownerRetirementState.years}`;
        toGoEl.textContent = toGo <= 0
          ? `You're projected to be ${formatMoney(Math.abs(toGo))} past this target by year ${ownerRetirementState.years} (Project forward).`
          : `${formatMoney(toGo)} still to go, based on your Project forward projection at year ${ownerRetirementState.years}.`;
        toGoTileEl.textContent = toGoText;
        // Years-to-retire's own "already reached" check is separate — it
        // solves from TODAY's actual balance (plus business equity, if
        // opted in), independent of whatever "Project forward (years)"
        // happens to be set to elsewhere.
        const startingTotal = computeNetWorthTotal(wealth);
        const effectiveStartingTotal = startingTotal != null ? startingTotal + activeBusinessEquity : null;
        if (effectiveStartingTotal != null && effectiveStartingTotal >= target) {
          yearsValueEl.textContent = '0';
          headlineEl.textContent = `Already at or above the ${formatMoney(target)} target based on today's figures.`;
          yearsSummaryEl.textContent = `0 years — already at or above the ${formatMoney(target)} target.`;
        } else {
          const yearsToTarget = solveOwnerYearsToTarget(
            wealth, ownerRetirementState.growthSuper, ownerRetirementState.growthInvestments,
            ownerRetirementState.growthProperty, ownerRetirementState.growthOther, ownerRetirementState.oneOffs, target, activeBusinessEquity
          );
          yearsValueEl.textContent = yearsToTarget == null ? '60+' : String(yearsToTarget);
          headlineEl.textContent = yearsToTarget == null
            ? `Not reached within 60 years at these growth rates — try higher rates or an extra one-off contribution.`
            : `About ${yearsToTarget} year${yearsToTarget === 1 ? '' : 's'} to reach the ${formatMoney(target)} target.`;
          yearsSummaryEl.textContent = yearsToTarget == null
            ? `Not reached within 60 years at these growth rates — you'd need ${formatMoney(target)}.`
            : `${yearsToTarget} year${yearsToTarget === 1 ? '' : 's'} — you'll need ${formatMoney(target)} by then.`;
        }
      }
      // Tests the withdrawal-rate assumption itself: withdraw the desired
      // income from the target every year, growing what's left at the
      // post-retirement rate, and see whether it actually holds up.
      if (target == null || ownerRetirementState.desiredIncome <= 0) {
        drawdownResultEl.textContent = target == null ? '' : 'Set a desired annual income above to check how long this would last.';
      } else {
        const drawdownYears = simulateDrawdownYears(target, ownerRetirementState.desiredIncome, ownerRetirementState.postRetirementGrowth);
        drawdownResultEl.textContent = drawdownYears == null
          ? `At a ${ownerRetirementState.postRetirementGrowth}%/yr post-retirement return, ${formatMoney(target)} withdrawing ${formatMoney(ownerRetirementState.desiredIncome)}/yr lasts indefinitely — growth keeps pace with withdrawals.`
          : `At a ${ownerRetirementState.postRetirementGrowth}%/yr post-retirement return, ${formatMoney(target)} withdrawing ${formatMoney(ownerRetirementState.desiredIncome)}/yr runs out in about ${drawdownYears} year${drawdownYears === 1 ? '' : 's'}.`;
      }
      document.getElementById('owner-retirement-bd-super').textContent = formatMoney(result.projectedSuper);
      document.getElementById('owner-retirement-bd-investments').textContent = formatMoney(result.projectedInvestments);
      document.getElementById('owner-retirement-bd-property').textContent = formatMoney(result.projectedProperty);
      document.getElementById('owner-retirement-bd-other').textContent = formatMoney(result.projectedOther);
      document.getElementById('owner-retirement-bd-debt').textContent = (result.projectedDebt ? '− ' : '') + formatMoney(result.projectedDebt);
      const bdBusinessWrap = document.getElementById('owner-retirement-bd-business-wrap');
      if (result.businessEquity > 0) {
        bdBusinessWrap.style.display = '';
        document.getElementById('owner-retirement-bd-business').textContent = formatMoney(result.businessEquity);
      } else {
        bdBusinessWrap.style.display = 'none';
      }
      OWNER_RETIREMENT_BUCKETS.forEach((bucket) => {
        const items = oneOffs[bucket] || [];
        const total = items.reduce((sum, o) => sum + o.amount, 0);
        const headerEl = document.getElementById(`ow-oneoff-total-${bucket}`);
        if (!headerEl) return;
        headerEl.classList.toggle('neg', total < 0);
        headerEl.querySelector('.ow-oneoff-amount-text').textContent = items.length ? (total < 0 ? '− ' : '') + formatMoney(Math.abs(total)) : 'None';
      });
    };
    const wireOneOffRow = (row) => {
      row.querySelector('.ow-oneoff-year').oninput = recalcRetirement;
      row.querySelector('.ow-oneoff-amount').oninput = recalcRetirement;
      row.querySelector('.ow-oneoff-remove').onclick = () => { row.remove(); recalcRetirement(); };
    };
    content.querySelectorAll('.ow-oneoff-row').forEach(wireOneOffRow);
    content.querySelectorAll('[data-oneoff-add]').forEach((addBtn) => {
      addBtn.onclick = () => {
        const bucket = addBtn.dataset.oneoffAdd;
        const list = document.getElementById(`ow-oneoff-list-${bucket}`);
        list.insertAdjacentHTML('beforeend', renderOwnerOneOffRow(bucket, {}));
        const newRow = list.lastElementChild;
        wireOneOffRow(newRow);
        newRow.querySelector('.ow-oneoff-year').focus();
      };
    });
    content.querySelectorAll('[data-accordion-toggle^="oneoff-"]').forEach((toggleEl) => {
      toggleEl.onclick = () => {
        const key = toggleEl.dataset.accordionToggle;
        const body = document.getElementById(`ow-body-${key}`);
        body.style.display = body.style.display === 'none' ? 'block' : 'none';
        const chevron = toggleEl.querySelector('.chevron');
        if (chevron) chevron.textContent = body.style.display === 'none' ? '▾' : '▴';
      };
    });
    const suggestBusinessOneOffBtn = document.getElementById('owner-retirement-suggest-business-oneoff');
    if (suggestBusinessOneOffBtn) {
      suggestBusinessOneOffBtn.onclick = () => {
        // Swap the flat "counted every year" toggle for a one-off landing
        // specifically at the succession year — avoids double-counting it
        // and models it more accurately: not available until the year it's
        // actually planned to be realised. "Other assets" since business
        // equity doesn't naturally belong to Super/Investments/Property.
        if (includeBusinessInput) includeBusinessInput.checked = false;
        const bucket = 'other';
        const list = document.getElementById(`ow-oneoff-list-${bucket}`);
        list.insertAdjacentHTML('beforeend', renderOwnerOneOffRow(bucket, { year: successionYearsForSuggestion, amount: businessEquityAmount }));
        const newRow = list.lastElementChild;
        wireOneOffRow(newRow);
        const body = document.getElementById(`ow-body-oneoff-${bucket}`);
        body.style.display = 'block';
        const toggleEl = content.querySelector(`[data-accordion-toggle="oneoff-${bucket}"]`);
        if (toggleEl) toggleEl.querySelector('.chevron').textContent = '▴';
        newRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        recalcRetirement();
      };
    }
    [yearsInput, growthSuperInput, growthInvestmentsInput, growthPropertyInput, growthOtherInput, incomeInput, withdrawalInput, targetOverrideInput, postGrowthInput, retirementYearsInput].forEach((el) => { el.oninput = recalcRetirement; });
    if (includeBusinessInput) includeBusinessInput.onchange = recalcRetirement;
    recalcRetirement();

    // Three independently-collapsible panels, one per box — each toggles on
    // its own, matching the other accordion sections on this page.
    const RETIREMENT_PANELS = {
      projected: { toggle: document.getElementById('owner-retirement-toggle-projected'), panel: document.getElementById('owner-retirement-panel-projected'), focusEl: yearsInput },
      target: { toggle: document.getElementById('owner-retirement-toggle-target'), panel: document.getElementById('owner-retirement-panel-target'), focusEl: incomeInput },
      years: { toggle: document.getElementById('owner-retirement-toggle-years'), panel: document.getElementById('owner-retirement-panel-years'), focusEl: null },
    };
    Object.values(RETIREMENT_PANELS).forEach(({ toggle, panel }) => {
      toggle.onclick = () => {
        const willOpen = panel.style.display === 'none';
        panel.style.display = willOpen ? 'block' : 'none';
        toggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
      };
    });

    // Click a box (or a "→ Edit …" link inside the Years-to-retire panel) →
    // open ONLY that box's panel — closing the other two — and land in the
    // field that actually drives it, same "click a number, land where it's
    // entered" pattern as the net worth tiles above.
    content.querySelectorAll('[data-retirement-jump]').forEach((tile) => {
      tile.onclick = () => {
        const key = tile.dataset.retirementJump;
        Object.entries(RETIREMENT_PANELS).forEach(([k, { toggle, panel }]) => {
          const open = k === key;
          panel.style.display = open ? 'block' : 'none';
          toggle.querySelector('.chevron').textContent = open ? '▴' : '▾';
        });
        const target = RETIREMENT_PANELS[key];
        if (target.focusEl) { target.focusEl.focus(); target.focusEl.select(); }
        target.panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };
    });
  }

  const gotoSuccessionLink = document.getElementById('goto-succession-goals-link');
  if (gotoSuccessionLink) {
    gotoSuccessionLink.onclick = async () => {
      currentDomain = 'goals';
      currentWorkflow = 'input';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
    };
  }
  const gotoPathwayLink = document.getElementById('goto-pathway-from-succession-link');
  if (gotoPathwayLink) {
    gotoPathwayLink.onclick = async () => {
      currentDomain = 'goals';
      currentWorkflow = 'input';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
    };
  }

  const gotoValuationFromSuccessionLink = document.getElementById('goto-valuation-from-succession-link');
  if (gotoValuationFromSuccessionLink) {
    gotoValuationFromSuccessionLink.onclick = async () => {
      currentDomain = 'growth';
      currentWorkflow = 'analyse';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
      const valuationEl = document.getElementById('valuation-amount');
      if (!valuationEl) return;
      valuationEl.closest('.kpi-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
