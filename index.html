// Companion to the Tax category's KPI card, same slot the Cash category uses
// for "Where the cash went" — a standing answer to "can they actually afford
// this period's tax bill", always visible rather than only surfacing once it
// crosses a flag threshold (see the Tax affordability risk flag in analyze.js
// for the threshold version of this same comparison). Deliberately just
// income tax vs cash on hand — no GST/PAYG/super/FBT forecasting here.
function renderTaxAffordabilityCard(snapshot) {
  const taxExpense = snapshot?.tax_expense;
  const cash = snapshot?.cash;
  if (taxExpense == null || cash == null) return '';
  let interp;
  // Same >=1 boundary the backend affordability flag treats as "danger" —
  // below it, cash alone can't cover the bill, which is worth a color, not
  // just a sentence, so it reads at a glance mid-meeting.
  let colorClass = '';
  if (taxExpense <= 0) {
    interp = 'No tax expense recorded this period.';
  } else {
    const coverage = cash / taxExpense;
    colorClass = coverage >= 1 ? 'good' : 'bad';
    if (coverage >= 2) interp = `Cash on hand comfortably covers this period's tax expense (${coverage.toFixed(1)}x).`;
    else if (coverage >= 1) interp = `Cash on hand covers this period's tax expense (${coverage.toFixed(1)}x) — worth setting it aside before it's spent elsewhere.`;
    else if (coverage >= 0.5) interp = `Cash on hand covers about ${Math.round(coverage * 100)}% of this period's tax expense — worth planning for the shortfall.`;
    else interp = `Cash on hand covers only ${Math.round(coverage * 100)}% of this period's tax expense — funding this may be a stretch.`;
  }
  return `
    <div class="kpi-card">
      <div class="kpi-card-head"><p class="kpi-name">Tax vs cash on hand</p></div>
      <div style="display:flex; gap:20px; margin:4px 0 2px; flex-wrap:wrap;">
        <div><p class="kpi-value ${colorClass}">${formatMoney(taxExpense)}</p><p class="card-label" style="margin:0;">Tax expense</p></div>
        <div><p class="kpi-value">${formatMoney(cash)}</p><p class="card-label" style="margin:0;">Cash on hand</p></div>
      </div>
      <p class="kpi-interp">${interp}</p>
    </div>
  `;
}

// Narrow, deliberately scoped version of "what's coming, if things grow" —
// projects revenue by a simple growth %, applies THIS period's own margin to
// get a projected profit, then estimates tax off that. Company is a flat
// rate so it's safe to estimate with zero owner-level data. Individual
// (sole trader) uses the FY2026-27 resident marginal brackets + a flat 2%
// Medicare levy — a real simplification (ignores LITO, the levy's low-income
// phase-in, and that brackets/rates change every year), which is exactly why
// this is labeled a rough estimate, not advice, everywhere it's shown.
// Partnership/Trust are deliberately NOT estimated: those are flow-through
// structures where the real tax depends on each partner's/beneficiary's own
// marginal rate and distribution split — data this app doesn't capture at
// all — so guessing a number there would be worse than showing nothing.
// Targets FY2026-27 — bracket2Rate is 15%, not 16%, reflecting the
// legislated cut to the lowest marginal rate from 1 July 2026 (2025 Federal
// Budget). Every OTHER figure here (thresholds, Medicare levy, super cap)
// is carried over unchanged from 2024-25, the last year this app has fully
// confirmed — those typically get indexed a little most years and haven't
// been verified for FY2026-27, so treat them as a starting point to check
// against the ATO, not a guarantee. Rates/thresholds/caps get reset almost
// every year (and future years, e.g. modeling 2029, genuinely AREN'T
// legislated yet — no lookup table could have the right answer), so rather
// than hardcoding a handful of years and guessing at the rest, this whole
// table lives in one editable, session-persisted object. The Tax outlook
// card shows the financial year detected from the period being analyzed
// purely as context ("you're looking at FY2026-27") — the adviser types in
// the real numbers for whatever year actually applies, rather than the app
// pretending to know them.
const DEFAULT_TAX_RATES = {
  taxFreeThreshold: 18200, bracket2Upper: 45000, bracket2Rate: 15, bracket3Upper: 135000, bracket3Rate: 30,
  bracket4Upper: 190000, bracket4Rate: 37, bracket5Rate: 45, medicareRate: 2, medicareThreshold: 24276,
  companyRate: 25, superCap: 30000,
};
let taxRatesState = { ...DEFAULT_TAX_RATES };

function estimateIndividualTax(income) {
  if (income <= 0) return 0;
  const r = taxRatesState;
  const bands = [[r.taxFreeThreshold, 0], [r.bracket2Upper, r.bracket2Rate], [r.bracket3Upper, r.bracket3Rate], [r.bracket4Upper, r.bracket4Rate], [Infinity, r.bracket5Rate]];
  let tax = 0, lower = 0;
  for (const [upper, ratePct] of bands) {
    if (income <= lower) break;
    tax += (Math.min(income, upper) - lower) * (ratePct / 100);
    lower = upper;
  }
  const medicareLevy = income > r.medicareThreshold ? income * (r.medicareRate / 100) : 0;
  return tax + medicareLevy;
}

// Which bracket income's TOP dollar falls in — "which bracket are they
// roughly in" answers the marginal rate on the next dollar earned, not an
// average, which is what makes e.g. the 4-way even split's $0 result
// actually explainable (each share sits under the tax-free threshold) rather
// than just a number with no story behind it. Reads the same editable table.
function individualTaxBracket(income) {
  const r = taxRatesState;
  if (income <= 0) return 'no income';
  if (income <= r.taxFreeThreshold) return 'under the tax-free threshold';
  if (income <= r.bracket2Upper) return `${r.bracket2Rate}% bracket`;
  if (income <= r.bracket3Upper) return `${r.bracket3Rate}% bracket`;
  if (income <= r.bracket4Upper) return `${r.bracket4Rate}% bracket`;
  return `${r.bracket5Rate}% bracket`;
}

function estimateCompanyTax(income) {
  return income > 0 ? income * (taxRatesState.companyRate / 100) : 0; // base rate entity assumption (small/medium co.)
}

// Australian FY runs 1 July - 30 June — a period ending in Jan-Jun belongs to
// the FY that started the PREVIOUS calendar year (30 June 2027 -> FY2026-27),
// Jul-Dec belongs to the FY starting that same year.
function auFinancialYearLabel(periodEnd) {
  if (!periodEnd) return null;
  const d = new Date(periodEnd);
  if (isNaN(d)) return null;
  const month = d.getMonth() + 1;
  const startYear = month >= 7 ? d.getFullYear() : d.getFullYear() - 1;
  return `FY${startYear}-${String(startYear + 1).slice(-2)}`;
}

// Shared by Tax outlook and Cash outlook (both "model a scenario" cards) —
// same four-level buildup: net profit set directly overrides everything,
// else net profit change, else GP change (opex layered on top either way),
// else revenue change at this period's own GP margin as the fallback. One
// function so the two cards can never drift into computing "projected
// profit" two different ways.
function projectProfitScenario(snapshot, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute) {
  const revenue = snapshot.revenue;
  const netProfit = snapshot.net_profit;
  const baselineGP = snapshot.cogs != null ? revenue - snapshot.cogs : null;
  const baselineOpex = baselineGP != null ? baselineGP - netProfit : revenue - netProfit;
  const delta = (val, baseline) => unit === 'dollar' ? val : baseline * (val / 100);

  // Nothing on the card itself hints that the headline is derived from this
  // period's actual figures until you open the (collapsed) assumptions panel
  // — this caption says so up front, and switches to a plain "you're
  // modeling a scenario" flag once anything's been changed, so the source
  // of the number is never a mystery at a glance.
  const isBaseline = (netProfitAbsolute === '' || netProfitAbsolute == null) && !netProfitChange && !gpChange && !revenueChange && !opexChange;
  const provenance = isBaseline
    ? `Based on this period's actual net profit (${formatMoney(netProfit)}).`
    : `Modeling a scenario, not this period's actual figures.`;

  let projectedProfit, buildup;
  if (netProfitAbsolute !== '' && netProfitAbsolute != null) {
    // Highest priority — this is "I already know the number", so it skips
    // every other field entirely, including the Net profit CHANGE field
    // below (which is for "I know how much it'll move", a different mental
    // model of the same end goal).
    projectedProfit = Number(netProfitAbsolute);
    buildup = `Net profit set directly at <b>${formatMoney(projectedProfit)}</b>`;
  } else if (netProfitChange) {
    projectedProfit = netProfit + delta(netProfitChange, netProfit);
    buildup = `Net profit ${formatMoney(netProfit)} → projected profit <b>${formatMoney(projectedProfit)}</b>`;
  } else if (gpChange && baselineGP != null) {
    const projectedGP = baselineGP + delta(gpChange, baselineGP);
    const projectedOpex = baselineOpex + delta(opexChange, baselineOpex);
    projectedProfit = projectedGP - projectedOpex;
    buildup = `Gross profit <b>${formatMoney(projectedGP)}</b> − operating expenses <b>${formatMoney(projectedOpex)}</b> = projected profit <b>${formatMoney(projectedProfit)}</b>`;
  } else {
    const projectedRevenue = revenue + delta(revenueChange, revenue);
    const gpMargin = baselineGP != null ? baselineGP / revenue : null;
    const projectedGP = gpMargin != null ? projectedRevenue * gpMargin : projectedRevenue; // no cogs recorded — treat revenue as GP; baselineOpex already covers ALL costs in this case
    const projectedOpex = baselineOpex + delta(opexChange, baselineOpex);
    projectedProfit = projectedGP - projectedOpex;
    buildup = `Revenue <b>${formatMoney(projectedRevenue)}</b> → gross profit <b>${formatMoney(projectedGP)}</b> − operating expenses <b>${formatMoney(projectedOpex)}</b> = projected profit <b>${formatMoney(projectedProfit)}</b>`;
  }
  return { projectedProfit, buildup, isBaseline, provenance };
}

// Growth's own version of the scenario buildup — Revenue and Cost of sales
// are independent levers (not mutually exclusive alternatives) that combine
// into gross profit, same as Wages is independent of Other opex. Net profit
// change is the one shortcut lever left: fill that in and it skips the whole
// Revenue/COGS/wages/opex chain, for "I know how much it'll move" instead of
// "let me build it up from the parts." Deliberately a separate function (not
// a param added to projectProfitScenario) so Cash Outlook and Tax Outlook's
// existing calls can never be affected by this.
function projectGrowthProfitScenario(snapshot, unit, revenueChange, cogsChange, wagesChange, opexChange, netProfitChange) {
  const revenue = snapshot.revenue;
  const netProfit = snapshot.net_profit;
  const baselineCogs = snapshot.cogs;
  const baselineGP = baselineCogs != null ? revenue - baselineCogs : null;
  const baselineOpex = baselineGP != null ? baselineGP - netProfit : revenue - netProfit;
  const baselineWages = snapshot.wages || 0;
  const baselineOtherOpex = baselineOpex - baselineWages;
  const delta = (val, baseline) => unit === 'dollar' ? val : baseline * (val / 100);

  const isBaseline = !netProfitChange && !revenueChange && !cogsChange && !wagesChange && !opexChange;
  const provenance = isBaseline
    ? `Based on this period's actual net profit (${formatMoney(netProfit)}).`
    : `Modeling a scenario, not this period's actual figures.`;

  // projectedRevenue/projectedGP only come out non-null when the
  // Revenue/COGS/wages/opex chain actually runs — the Net profit override
  // below skips deriving a revenue figure entirely, and inventing one would
  // mean showing a number nobody actually computed. Cash cost of growing
  // (see computeCashCostOfGrowing) depends on these staying null unless real.
  let projectedProfit, buildup, projectedRevenueOut = null, projectedGPOut = null;
  if (netProfitChange) {
    projectedProfit = netProfit + delta(netProfitChange, netProfit);
    buildup = `Net profit ${formatMoney(netProfit)} → projected profit <b>${formatMoney(projectedProfit)}</b>`;
  } else {
    const projectedRevenue = revenue + delta(revenueChange, revenue);
    const projectedCogs = baselineCogs != null ? baselineCogs + delta(cogsChange, baselineCogs) : null;
    const projectedGP = projectedCogs != null ? projectedRevenue - projectedCogs : projectedRevenue; // no cogs recorded — treat revenue as GP
    const projectedWages = baselineWages + delta(wagesChange, baselineWages);
    const projectedOtherOpex = baselineOtherOpex + delta(opexChange, baselineOtherOpex);
    projectedProfit = projectedGP - projectedWages - projectedOtherOpex;
    buildup = projectedCogs != null
      ? `Revenue <b>${formatMoney(projectedRevenue)}</b> − cost of sales <b>${formatMoney(projectedCogs)}</b> = gross profit <b>${formatMoney(projectedGP)}</b> − wages <b>${formatMoney(projectedWages)}</b> − other operating expenses <b>${formatMoney(projectedOtherOpex)}</b> = projected profit <b>${formatMoney(projectedProfit)}</b>`
      : `Revenue <b>${formatMoney(projectedRevenue)}</b> → gross profit <b>${formatMoney(projectedGP)}</b> − wages <b>${formatMoney(projectedWages)}</b> − other operating expenses <b>${formatMoney(projectedOtherOpex)}</b> = projected profit <b>${formatMoney(projectedProfit)}</b>`;
    projectedRevenueOut = projectedRevenue;
    projectedGPOut = projectedGP;
  }
  return { projectedProfit, buildup, isBaseline, provenance, projectedRevenue: projectedRevenueOut, projectedGP: projectedGPOut };
}

// Applies the client's OWN debtor/creditor/inventory-days ratios (never
// invented ones) to a modeled revenue increase to estimate the net extra
// cash growth would tie up — standard working-capital treatment: extra
// debtors + extra inventory, netted against extra creditors (supplier
// financing reduces the cash burden, it doesn't add to it). Deliberately
// gated on projectedRevenue being non-null — the Net profit override branch
// of projectGrowthProfitScenario doesn't derive a real revenue figure to
// work from, so this returns null there rather than guess one.
function computeCashCostOfGrowing(snapshot, kpis, projectedRevenue, projectedGP) {
  if (projectedRevenue == null || snapshot?.cogs == null) return null;
  const kpi = (key) => kpis?.find((k) => k.key === key);
  const debtorDays = kpi('debtor_days');
  const creditorDays = kpi('creditor_days');
  const inventoryDays = kpi('inventory_days');
  if (!debtorDays || debtorDays.confidence === 'red' || debtorDays.value == null) return null;
  if (!inventoryDays || inventoryDays.confidence === 'red' || inventoryDays.value == null) return null;

  const extraRevenue = projectedRevenue - snapshot.revenue;
  const extraDebtors = extraRevenue * (debtorDays.value / 365);
  const extraCogs = (projectedRevenue - projectedGP) - snapshot.cogs;
  const extraInventory = extraCogs * (inventoryDays.value / 365);
  const extraCreditors = (creditorDays && creditorDays.confidence !== 'red' && creditorDays.value != null)
    ? extraCogs * (creditorDays.value / 365) : 0;

  const netCashTiedUp = extraDebtors + extraInventory - extraCreditors;
  if (Math.abs(netCashTiedUp) < 1) return null; // no meaningful growth modeled
  return netCashTiedUp;
}

function renderGrowthOutlookCard(snapshot) {
  const revenue = snapshot?.revenue;
  const netProfit = snapshot?.net_profit;
  if (!revenue || netProfit == null) return '';
  const selectStyle = 'padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);';
  const s = growthOutlookState;
  const row = (id, label, value) => `<div class="ocf-row"><label>${label}</label><input type="number" id="${id}" value="${value}" placeholder="0" /></div>`;
  const panelOpen = s.revenue !== 0 || s.cogs !== 0 || s.wages !== 0 || s.opex !== 0 || s.netProfit !== 0;
  return `
    <div class="kpi-card">
      <div class="kpi-card-head"><p class="kpi-name">Growth outlook — model a scenario</p></div>
      <div style="background:var(--sage-bg); border-radius:8px; padding:8px 12px; display:inline-block;">
        <p class="kpi-value" id="growth-outlook-value" style="margin:0;">—</p>
        <p class="card-label" style="margin:2px 0 0;">Projected net profit</p>
      </div>
      <p class="muted plain" id="growth-outlook-change" style="margin:6px 0 0;"></p>
      <p class="muted plain" id="growth-outlook-cash-cost" style="margin:6px 0 0; display:none;"></p>
      <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">
        <span id="growth-outlook-provenance"></span>
        <button type="button" id="growth-outlook-provenance-link" style="background:none; border:none; padding:0; margin-left:2px; color:var(--brass); font-size:11px; cursor:pointer; text-decoration:underline; font-family:inherit;">Adjust assumptions</button>
      </p>

      <div class="cash-item cash-item-clickable" id="growth-outlook-toggle">
        <span class="cash-item-icon">🧮</span>
        <span class="cash-item-label">Adjust assumptions</span>
        <span class="chevron">${panelOpen ? '▴' : '▾'}</span>
      </div>
      <div class="ocf-adjust-panel" id="growth-outlook-panel" style="display:${panelOpen ? 'block' : 'none'};">
        <div class="ocf-row"><label>Change amounts as</label><select id="growth-outlook-unit" style="${selectStyle}"><option value="pct" ${s.unit === 'pct' ? 'selected' : ''}>%</option><option value="dollar" ${s.unit === 'dollar' ? 'selected' : ''}>$</option></select></div>
        ${row('growth-outlook-revenue', 'Revenue', s.revenue)}
        ${row('growth-outlook-cogs', 'Cost of sales', s.cogs)}
        ${row('growth-outlook-wages', 'Wages', s.wages)}
        ${row('growth-outlook-opex', 'Other operating expenses', s.opex)}
        ${row('growth-outlook-netprofit', 'Or move net profit directly (skips everything above)', s.netProfit)}
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">Revenue, cost of sales, wages and other opex combine to build up projected profit — adjust any of them together. Net profit overrides all of them if you'd rather just model a bottom-line move directly.</p>
        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;" id="growth-outlook-buildup"></p>
      </div>
      <p style="font-size:11px; color:var(--ink-soft); margin-top:8px; font-style:italic;">Rough estimate — gross profit is Revenue minus Cost of sales; Wages and Other opex only move if you enter a change for them.</p>
    </div>
  `;
}

const CADENCE_UNIT = { quarterly: 'quarters', half_yearly: 'half-years', annual: 'years' };

// Simple two-point trend (oldest vs newest non-null value in the client's
// KPI history) projected forward to a goal's target — no real regression,
// deliberately, per the build spec's "v1" scope. Uses KPI_DIRECTION to know
// whether the target's already been reached (can't just compare magnitudes —
// a lower value is the win for some KPIs, higher for others).
function computePaceToGoal(targetItem, kpiHistoryEntry) {
  const values = kpiHistoryEntry?.values || [];
  const points = values.map((v, i) => ({ v, i })).filter((p) => p.v != null);
  if (points.length < 2) return { status: 'insufficient' };

  const oldest = points[0];
  const newest = points[points.length - 1];
  const rate = (newest.v - oldest.v) / (newest.i - oldest.i);
  const target = targetItem.target;
  const direction = KPI_DIRECTION[targetItem.kpi_key];
  const reached = direction === 'higher' ? newest.v >= target : direction === 'lower' ? newest.v <= target : Math.abs(newest.v - target) < 1e-9;
  if (reached) return { status: 'reached', current: newest.v };

  const distanceRemaining = target - newest.v;
  if (rate === 0 || Math.sign(rate) !== Math.sign(distanceRemaining)) {
    return { status: 'off-track', current: newest.v };
  }
  const periodsAway = Math.ceil(distanceRemaining / rate);
  return { status: 'on-track', current: newest.v, periodsAway };
}

function renderPaceToGoalCard(targets, history) {
  if (!targets.length) {
    return `<div class="card"><p class="muted">Pace to goal</p><p class="muted plain" style="margin:0;">Set a target on a Goals item (with a linked KPI) to see pace-to-goal here.</p></div>`;
  }
  const unit = CADENCE_UNIT[currentCtx?.cadence] || 'periods';
  const lines = targets.map((t) => {
    const kpiEntry = (history?.kpis || []).find((k) => k.key === t.kpi_key);
    const pace = computePaceToGoal(t, kpiEntry);
    const format = kpiEntry?.format;
    const targetLabel = `${kpiEntry?.name || t.kpi_key} target ${formatKpi(t.target, format)}`;
    let statusText;
    if (pace.status === 'insufficient') statusText = 'not enough history yet to project a trend.';
    else if (pace.status === 'reached') statusText = `target reached — currently ${formatKpi(pace.current, format)}.`;
    else if (pace.status === 'off-track') statusText = `trending the wrong way — not on track at the current rate (currently ${formatKpi(pace.current, format)}).`;
    else statusText = `at the current trend, ~${pace.periodsAway} ${unit} away (currently ${formatKpi(pace.current, format)}).`;
    return `<p class="muted plain" style="margin:0 0 6px;">${targetLabel} — ${statusText}</p>`;
  }).join('');
  return `<div class="card"><p class="muted">Pace to goal</p>${lines}</div>`;
}

// Small single-series line chart, plain inline SVG (no charting library
// anywhere in this app — matches the cash-conversion donut/health wheel
// convention). One series per call, not Revenue+NP on a shared axis — at
// most clients' scale Net profit would be nearly invisible next to Revenue
// on one y-scale (the #1 rule from this project's dataviz skill: never a
// dual-axis chart). Straight polyline segments between adjacent non-null
// points — a genuine gap (a period with no snapshot saved) would draw a
// straight line across it rather than a visible break; acceptable for v1
// since most clients have no gaps once a period's saved.
// Value/date labels are deliberately plain HTML below the chart, NOT text
// inside the SVG. SVG scales everything — text included — proportionally
// to however wide its container ends up being; once these cards went
// side-by-side, the shrunk render width shrank in-chart <text> right along
// with it, undoing any font-size bump. Plain HTML text stays real CSS
// pixels regardless of how narrow the column gets.
function renderTrendLineChart(periods, values, color, width = 320, height = 70) {
  const points = values.map((v, i) => ({ v, i })).filter((p) => p.v != null);
  if (points.length < 2) return '<p class="muted plain" style="margin:0;">Not enough history yet.</p>';
  const padX = 10, padY = 10;
  const vals = points.map((p) => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const xFor = (i) => padX + (i / (values.length - 1)) * (width - padX * 2);
  const yFor = (v) => height - padY - ((v - min) / range) * (height - padY * 2);
  const linePoints = points.map((p) => `${xFor(p.i)},${yFor(p.v)}`).join(' ');
  const dots = points.map((p) => `<circle cx="${xFor(p.i)}" cy="${yFor(p.v)}" r="3.5" fill="${color}" />`).join('');
  const svg = `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%; max-width:${width}px; height:auto; display:block;">
      <polyline points="${linePoints}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      ${dots}
    </svg>
  `;
  const labels = periods.map((p, i) => `
    <div style="text-align:center; min-width:56px;">
      <div style="font-size:10px; color:var(--ink-soft); font-family:var(--font-mono);">${formatShortDate(p).replace(/^\d+ /, '')}</div>
      <div style="font-size:13px; font-weight:600; color:var(--ink); font-family:var(--font-mono); white-space:nowrap;">${values[i] != null ? formatMoney(values[i]) : '—'}</div>
    </div>
  `).join('');
  return `${svg}<div style="display:flex; flex-wrap:wrap; justify-content:center; gap:6px 10px; margin-top:4px;">${labels}</div>`;
}

const TRAJECTORY_PERIODS_PER_YEAR = { quarterly: 4, half_yearly: 2, annual: 1 };
const CADENCE_LABEL_SHORT = { quarterly: 'Quarterly', half_yearly: 'Half-yearly', annual: 'Annual' };

// Which view-cadence options make sense to offer — same or coarser than
// what the client's own data was actually entered at. You can't view
// quarterly detail for a client who only ever files annually; that data
// doesn't exist to roll DOWN into.
function availableTrajectoryCadences(nativeCadence) {
  return ['quarterly', 'half_yearly', 'annual'].filter((c) => TRAJECTORY_PERIODS_PER_YEAR[c] <= TRAJECTORY_PERIODS_PER_YEAR[nativeCadence]);
}

// "Last N" alone doesn't say whether that's 4 quarters or 4 years — every
// option is labelled with the actual unit for whichever cadence is
// currently selected, and relabelled live when the cadence dropdown changes
// (see wireTrajectoryCard in renderGrowthAnalyse).
function trajectoryPeriodsCountOptionsHtml(cadence, selectedCount) {
  const unit = CADENCE_UNIT[cadence] || 'periods';
  return [4, 6, 8, 12].map((n) => `<option value="${n}" ${n === selectedCount ? 'selected' : ''}>Last ${n} ${unit}</option>`).join('');
}

// Static shell only — the chart region is filled in by loadTrajectory()
// (wired in renderGrowthAnalyse) since view-cadence/period-count are
// interactive and require a fresh fetch from get_growth_trajectory, not
// just a re-render of already-loaded data.
function renderGrowthTrajectoryCard(commentary) {
  const nativeCadence = currentCtx?.cadence || 'quarterly';
  const cadenceOptions = availableTrajectoryCadences(nativeCadence);
  // Default to Annual, not the client's native cadence — 'annual' is always
  // a valid option (it's the coarsest possible view, so it's never finer
  // than what was entered), and a quarterly/half-yearly client's raw
  // per-period noise is rarely what you want to see first. The dropdown is
  // still there to drill into finer detail on demand.
  const defaultCadence = 'annual';
  const selectStyle = 'padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);';
  return `
    <div class="card">
      <p class="muted">Growth trajectory</p>
      ${commentary ? `<p class="muted plain" style="font-size:12px; margin:6px 0 10px; padding:8px 10px; background:var(--sage-bg); border-radius:6px;">🤖 ${commentary}</p>` : ''}
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;">
        ${cadenceOptions.length > 1 ? `
          <select id="trajectory-cadence" style="${selectStyle}">
            ${cadenceOptions.map((c) => `<option value="${c}" ${c === defaultCadence ? 'selected' : ''}>${CADENCE_LABEL_SHORT[c]}</option>`).join('')}
          </select>
        ` : ''}
        <select id="trajectory-periods-count" style="${selectStyle}">
          ${trajectoryPeriodsCountOptionsHtml(defaultCadence, 6)}
        </select>
      </div>
      <div id="trajectory-chart-region"><p class="muted plain" style="margin:0;">Loading…</p></div>
    </div>
  `;
}

function renderGrowthTrajectoryChartRegion(trajectory) {
  const periods = trajectory?.periods || [];
  if (periods.length < 2) {
    return `<p class="muted plain" style="margin:0;">Not enough periods on file yet to show a trend — needs at least 2.</p>`;
  }
  return `
    <p class="card-label" style="margin:0 0 4px;">Revenue</p>
    ${renderTrendLineChart(periods, trajectory.revenue || [], 'var(--sage)')}
    <p class="card-label" style="margin:10px 0 4px;">Net profit</p>
    ${renderTrendLineChart(periods, trajectory.netProfit || [], 'var(--brass)')}
  `;
}

function computeEbitda(snapshot) {
  if (snapshot?.net_profit == null || snapshot?.interest_expense == null || snapshot?.depreciation_amortisation == null) return null;
  return snapshot.net_profit + snapshot.interest_expense + snapshot.depreciation_amortisation;
}

// Standard valuation practice: average EBITDA over a few years rather than
// whatever the current period happens to be — a single year can be
// unusually good or bad and skew the multiple-of-EBITDA estimate either
// way. `trajectory` is a get_growth_trajectory response fetched specifically
// as { view_cadence: 'annual', periods_count: 3 } — annual only, per the
// "valuation should only be annual" decision, regardless of the client's
// own native cadence. Averages whichever of those years actually have
// complete data rather than requiring all 3 (a year with one missing field
// is excluded from the average, not zero-filled or allowed to break it).
function computeAverageEbitda(trajectory) {
  const periods = trajectory?.periods || [];
  if (!periods.length) return null;
  const yearly = periods.map((_, i) => {
    const np = trajectory.netProfit?.[i];
    const ie = trajectory.interestExpense?.[i];
    const da = trajectory.depreciationAmortisation?.[i];
    return (np != null && ie != null && da != null) ? np + ie + da : null;
  }).filter((v) => v != null);
  if (!yearly.length) return null;
  return yearly.reduce((sum, v) => sum + v, 0) / yearly.length;
}

// Mirrors dedupeBusinessToLatestPerCategory (analyze.js) — one row per
// calendar year (latest period_end within the year wins) rather than one
// per category — a quarter-to-quarter valuation comparison isn't a
// meaningful cadence for this figure.
function dedupeValuationsToLatestPerYear(rows) {
  const latestPeriodByYear = {};
  (rows || []).forEach((r) => {
    const year = r.period_end.slice(0, 4);
    if (!latestPeriodByYear[year] || r.period_end > latestPeriodByYear[year]) latestPeriodByYear[year] = r.period_end;
  });
  return (rows || []).filter((r) => latestPeriodByYear[r.period_end.slice(0, 4)] === r.period_end);
}

// Saved history only (deliberately not the live/unsaved figure being
// edited above it) — always one point per calendar year via the dedupe,
// regardless of how often a valuation gets saved.
function renderValuationHistoryChart(valuations) {
  const deduped = dedupeValuationsToLatestPerYear(valuations || []).sort((a, b) => a.period_end.localeCompare(b.period_end));
  if (deduped.length < 2) return '';
  const periods = deduped.map((v) => v.period_end);
  const amounts = deduped.map((v) => v.valuation_amount);
  return `<p class="card-label" style="margin:10px 0 4px;">Valuation over time</p>${renderTrendLineChart(periods, amounts, 'var(--sage)')}`;
}

function renderValuationCard(snapshot, valuationData, avgEbitda) {
  const currentEbitda = computeEbitda(snapshot);
  // Prefer the multi-year average when it's available — falls back to this
  // period alone only when there isn't enough history to average (e.g. the
  // client's first period on file). Either way, a Custom EBITDA field below
  // covers the case where NEITHER is computable — the card never dead-ends
  // with no way forward now, unlike the old hard "can't estimate" stop.
  const defaultEbitda = avgEbitda ?? currentEbitda;
  const ebitdaLabel = avgEbitda != null
    ? `EBITDA (avg, up to 3yr): ${formatMoney(avgEbitda)}`
    : currentEbitda != null
      ? `EBITDA (this period): ${formatMoney(currentEbitda)}`
      : 'EBITDA not available — enter one below';
  return `
    <div class="kpi-card">
      <div class="kpi-card-head"><p class="kpi-name">Business valuation — indicative estimate</p></div>
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:4px 0;">
        <div style="background:var(--sage-bg); border-radius:8px; padding:5px 10px;">
          <p class="kpi-value" id="valuation-amount" style="margin:0; font-size:20px;">—</p>
        </div>
        <span class="muted plain" style="font-size:12px;">${ebitdaLabel}</span>
      </div>
      <p class="muted plain" id="valuation-recommended" style="font-size:12px; margin:2px 0 0;"></p>
      <div class="ocf-row" style="margin-top:8px;"><label>Custom EBITDA (optional)</label><input type="number" id="valuation-ebitda-input" placeholder="e.g. 90000" /></div>
      <div class="ocf-row"><label>Custom multiple (optional)</label><input type="number" step="0.1" id="valuation-multiple-input" placeholder="e.g. 3.5" /></div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="action" id="valuation-save-btn" type="button" style="font-size:12px; padding:6px 10px;">Save</button>
        <span id="valuation-save-msg" style="font-size:12px; color:var(--ink-soft);"></span>
      </div>
      <p id="valuation-rationale" style="font-size:11px; color:var(--ink-soft); margin:4px 0 0;"></p>
      ${renderValuationHistoryChart(valuationData?.valuations)}
      <p style="font-size:10px; color:var(--ink-soft); margin-top:8px; font-style:italic;">Indicative estimate for internal/advisory discussion only — not a formal valuation. Adjust the EBITDA basis and multiple based on your own judgement.</p>
    </div>
  `;
}

function computeTaxOutlookResult(snapshot, cash, entityType, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute, superContribution, equipmentPurchase, compareEntity, compareShares, compareOtherIncome) {
  let { projectedProfit, buildup, provenance } = projectProfitScenario(snapshot, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute);

  // Super contribution and equipment purchase both work the same way here —
  // a deduction against taxable profit — even though the real-world
  // mechanics differ (super is capped and might be a business expense or a
  // personal deduction depending on who's contributing; equipment assumes
  // full instant write-off, which has its own eligibility rules). Deliberately
  // not modeling those rules — just showing the mechanical tax effect of "if
  // this much comes off taxable profit", with a cap warning as the one
  // real constraint worth surfacing without pretending to know the rest.
  const deductions = (superContribution || 0) + (equipmentPurchase || 0);
  let deductionNote = '';
  if (deductions > 0) {
    const taxableProfit = projectedProfit - deductions;
    buildup += ` − super/equipment <b>${formatMoney(deductions)}</b> = taxable profit <b>${formatMoney(taxableProfit)}</b>`;
    projectedProfit = taxableProfit;
    if (superContribution > taxRatesState.superCap) {
      deductionNote = `Note: $${superContribution.toLocaleString('en-AU')} super exceeds the ${formatMoney(taxRatesState.superCap)} concessional cap set below — anything over that isn't deductible and may attract extra tax.`;
    }
  }

  let tax = null;
  let headline, headlineLabel;
  if (entityType === 'Company') {
    tax = estimateCompanyTax(projectedProfit);
    headline = formatMoney(tax);
    headlineLabel = 'Estimated tax — company, 25% base rate';
  } else if (entityType === 'Sole trader') {
    tax = estimateIndividualTax(projectedProfit);
    headline = formatMoney(tax);
    headlineLabel = `Estimated tax — individual marginal rates + Medicare levy (${individualTaxBracket(projectedProfit)})`;
  } else if (entityType === 'Partnership' || entityType === 'Trust') {
    const who = entityType === 'Trust' ? 'beneficiary' : 'partner';
    headline = '—';
    headlineLabel = `Tax depends on each ${who}'s own marginal rate and distribution split — not estimated here.`;
  } else {
    headline = '—';
    headlineLabel = 'Set an entity structure on Profile to estimate tax here.';
  }

  // Partnership/Trust can't be estimated for the CLIENT'S ACTUAL structure
  // (see the branch above) because guessing their real split/other-income
  // would misrepresent their actual position. A COMPARISON is different —
  // the adviser is explicitly told to supply the assumption (a % share per
  // partner/beneficiary, each with their own other income) rather than the
  // app guessing it, so it's an informed hypothetical, not a claim about
  // reality. Sole trader runs through the exact same per-person mechanism
  // as Partnership/Trust — it's just the N=1 case (fixed 100% share) — so
  // "other income" works identically everywhere instead of being a special
  // case that only some entity types support.
  let compareText = '';
  let bracketDetail = '';
  if (compareEntity && compareEntity !== entityType) {
    // "Effective rate" here is TOTAL TAX ÷ INCOME for that person — the
    // average rate their business share works out to once combined with
    // whatever else they earn — NOT their marginal bracket rate on the next
    // dollar (which is usually higher). Labeled that way explicitly in the
    // column header below so it's never read as the marginal rate.
    let personRows = [];
    if (compareEntity === 'Company') {
      const t = estimateCompanyTax(projectedProfit);
      personRows = [{ label: 'Company', share: 100, amt: projectedProfit, tax: t, rate: 25, context: 'flat company rate' }];
    } else if (compareEntity === 'Sole trader' || compareEntity === 'Partnership' || compareEntity === 'Trust') {
      const isSolo = compareEntity === 'Sole trader';
      const rawShares = isSolo ? [100] : (compareShares || [50, 50]).map(Number);
      const rawOtherIncome = compareOtherIncome || [];
      const validIdx = rawShares.map((v, i) => (!isNaN(v) && v > 0 ? i : -1)).filter((i) => i >= 0);
      const shares = validIdx.length ? validIdx.map((i) => rawShares[i]) : [100];
      const otherIncomes = validIdx.length ? validIdx.map((i) => Number(rawOtherIncome[i]) || 0) : [0];
      const sum = shares.reduce((a, b) => a + b, 0);
      const who = compareEntity === 'Trust' ? 'Beneficiary' : (isSolo ? 'Sole trader' : 'Partner');
      personRows = shares.map((s, i) => {
        const amt = projectedProfit * (s / sum);
        const other = otherIncomes[i];
        const t = other > 0 ? estimateIndividualTax(amt + other) - estimateIndividualTax(other) : estimateIndividualTax(amt);
        const rate = amt > 0 ? (t / amt * 100) : 0;
        const context = other > 0 ? `combined with ${formatMoney(other)} other income` : 'no other income assumed';
        return { label: isSolo ? who : `${who} ${i + 1}`, share: Math.round(s / sum * 100), amt, tax: t, rate, context };
      });
    }
    if (personRows.length) {
      const altTax = personRows.reduce((sum, r) => sum + r.tax, 0);
      const existingLabel = entityType || 'not set';
      const existingRow = `<div class="ocf-row" style="font-weight:600;"><label>Existing (${existingLabel})</label><span>${tax != null ? formatMoney(tax) : '—'}</span></div>`;
      const header = `<div style="display:flex; gap:8px; font-size:10px; color:var(--ink-soft); margin:6px 0 2px;"><span style="flex:2;">Who</span><span style="width:50px;">Share</span><span style="width:70px;">Eff. rate</span><span style="width:70px;">Tax on share</span></div>`;
      const personHtml = personRows.map((r, i) => `
        <div style="display:flex; gap:8px; font-size:12px; align-items:baseline;">
          <span style="flex:2;">${i + 1}. ${r.label}</span>
          <span style="width:50px;">${r.share}%</span>
          <span style="width:70px;">${r.rate.toFixed(0)}%</span>
          <span style="width:70px;">${formatMoney(r.tax)}</span>
        </div>
        <div style="font-size:10px; color:var(--ink-soft); margin:0 0 4px;">${formatMoney(r.amt)} — ${r.context}</div>
      `).join('');
      const diff = tax != null ? altTax - tax : null;
      const totalRow = `<div class="ocf-row" style="font-weight:600; border-top:1px solid var(--line); margin-top:4px; padding-top:4px;"><label>Total (${compareEntity.toLowerCase()})</label><span>${formatMoney(altTax)}${diff != null ? ` <span style="font-weight:400; color:var(--ink-soft);">(${diff >= 0 ? '+' : '−'}${formatMoney(Math.abs(diff))} vs existing)</span>` : ''}</span></div>`;
      const scopeNote = `<p style="font-size:10px; color:var(--ink-soft); font-style:italic; margin:4px 0 0;">"Tax on share" is only the tax this business distribution adds — not each person's whole personal tax bill (which would also include tax on their other income by itself).</p>`;
      bracketDetail = existingRow + header + personHtml + totalRow + scopeNote;
    }
  }

  let cashText = '', cashClass = '';
  if (tax != null && tax > 0 && cash != null) {
    const coverage = cash / tax;
    cashClass = coverage >= 1 ? 'good' : 'bad';
    cashText = coverage >= 2 ? `Today's cash (${formatMoney(cash)}) would comfortably cover this (${coverage.toFixed(1)}x).`
      : coverage >= 1 ? `Today's cash (${formatMoney(cash)}) would cover this (${coverage.toFixed(1)}x) — worth starting to set aside now.`
      : coverage >= 0.5 ? `Today's cash (${formatMoney(cash)}) covers about ${Math.round(coverage * 100)}% of this — worth planning ahead for the gap.`
      : `Today's cash (${formatMoney(cash)}) covers only ${Math.round(coverage * 100)}% of this — a growth scenario worth funding for in advance.`;
  }

  return { headline, headlineLabel, cashText, cashClass, buildup, provenance, deductionNote, compareText, bracketDetail };
}

// Headline (estimated tax) is what the card is FOR, so it sits up top in
// the same .kpi-value treatment every other card uses — everything that
// gets there (unit, four change fields, the buildup line) is secondary and
// collapses behind a chevron, same click-to-expand shape as the OCF/cash
// reconciliation rows above (.cash-item-clickable + .ocf-row), rather than
// sitting open by default and dominating the card.
function renderTaxOutlookCard(snapshot, ctx) {
  const revenue = snapshot?.revenue;
  const netProfit = snapshot?.net_profit;
  if (!revenue || netProfit == null) return '';
  const selectStyle = 'padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);';
  const s = taxOutlookState;
  const rs = taxRatesState;
  const detectedFY = auFinancialYearLabel(currentPeriodEnd);
  // "not yet legislated" only made sense while nothing had been touched —
  // once the adviser has actually typed in a year's figures, the label
  // should reflect THAT, not keep pointing back at the default year like
  // nothing changed.
  const usingDefaultRates = JSON.stringify(rs) === JSON.stringify(DEFAULT_TAX_RATES);
  const rateStatusLabel = usingDefaultRates
    ? 'Defaults to FY2026-27 — edit below for a different year'
    : 'Using custom rates you’ve entered — not the FY2026-27 defaults';
  const row = (id, label, value) => `<div class="ocf-row"><label>${label}</label><input type="number" id="${id}" value="${value}" placeholder="0" /></div>`;

        ${row('tax-outlook-revenue', 'Revenue', s.revenue)}
        ${row('tax-outlook-gp', 'Gross profit', s.gp)}

        <div class="ocf-row"><label>Super contribution ($)</label><input type="number" id="tax-outlook-super" value="${s.super}" placeholder="0" /></div>

        <div style="margin:4px 0 0;">
          <p style="font-size:11px; color:var(--ink-soft); margin:0 0 4px;">Share % per partner/beneficiary — add their other income (job, investments) to tax the business share at their real marginal rate, stacked on top; leave blank to assume no other income</p>
          <div style="display:flex; gap:10px; font-size:10px; color:var(--ink-soft); margin:0 0 2px 20px;"><span style="width:60px;">Share %</span><span>Other income $ (optional)</span></div>
          ${[0, 1, 2, 3].map((i) => `
            <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">

        <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">Fill in the most specific level you want to model — setting net profit directly overrides everything else, Net profit change overrides Gross profit, Gross profit overrides Revenue. Super and equipment apply on top of whichever level is active.</p>

      <div class="cash-item cash-item-clickable" id="tax-rates-toggle">
        <span class="cash-item-icon">🗓️</span>
        <span class="cash-item-label">Tax rates used${detectedFY ? ` — period detected as ${detectedFY}` : ''} <span class="sub" id="tax-rates-status-label">${rateStatusLabel}</span></span>
        <span class="chevron">▾</span>
      </div>
      <div class="ocf-adjust-panel" id="tax-rates-panel" style="display:none;">
        <div class="ocf-row"><label>Tax-free threshold ($)</label><input type="number" id="tr-threshold" value="${rs.taxFreeThreshold}" /></div>
        <div class="ocf-row"><label>Bracket 2 — up to ($) / rate (%)</label><div style="display:flex; gap:4px;"><input type="number" id="tr-b2-upper" value="${rs.bracket2Upper}" style="width:80px;" /><input type="number" id="tr-b2-rate" value="${rs.bracket2Rate}" style="width:50px;" /></div></div>
        <div class="ocf-row"><label>Bracket 3 — up to ($) / rate (%)</label><div style="display:flex; gap:4px;"><input type="number" id="tr-b3-upper" value="${rs.bracket3Upper}" style="width:80px;" /><input type="number" id="tr-b3-rate" value="${rs.bracket3Rate}" style="width:50px;" /></div></div>
        <div class="ocf-row"><label>Bracket 4 — up to ($) / rate (%)</label><div style="display:flex; gap:4px;"><input type="number" id="tr-b4-upper" value="${rs.bracket4Upper}" style="width:80px;" /><input type="number" id="tr-b4-rate" value="${rs.bracket4Rate}" style="width:50px;" /></div></div>
        <div class="ocf-row"><label>Top bracket rate (%, above bracket 4)</label><input type="number" id="tr-b5-rate" value="${rs.bracket5Rate}" style="width:50px;" /></div>
