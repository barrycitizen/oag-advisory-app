  cash_net_movement: '💵',
  tax_vs_cash: '🧾',
};

// Whether a HIGHER or LOWER value is generally the goal, for coloring a KPI's
// value green/rust against its target (once one is set) — deliberately a
// simple, presentation-only lookup rather than a kpi_library column, since
// direction isn't a universal fact for every metric in the abstract. But
// once someone has actually SET a target, coloring by the common-case
// direction is more useful than leaving it permanently neutral — so every
// KPI gets a default here, including the two genuinely judgment-call ones:
// creditor_days as 'higher' (extending supplier payment terms preserves the
// business's own cash — the standard cash-flow-advisory framing, even
// though very slow payment can strain supplier relationships) and
// effective_tax_rate as 'lower' (the near-universal intent behind setting a
// tax-rate target is minimising it, even though an unusually low rate can
// also flag a loss rather than good planning).
const KPI_DIRECTION = {
  revenue_growth: 'higher', gp_margin: 'higher', np_margin: 'higher', roe: 'higher',
  current_ratio: 'higher', op_cash_conversion: 'higher', creditor_days: 'higher',
  wages_pct: 'lower', debtor_days: 'lower', inventory_days: 'lower', debt_to_equity: 'lower', effective_tax_rate: 'lower',
};

// Plain-language "what this measures, and what it's trying to answer" for
// each KPI — static and universal (same for every client), so this lives as
// a fixed lookup rather than anything AI-generated or DB-stored, same
// convention as KPI_DIRECTION/KPI_VERDICT_META above. Distinct from
// kpi.interpretation (this period's AI-read value) and kpi.benchmark
// (industry-specific) — this is the metric's own definition, unchanging
// regardless of client or period.
const KPI_DESCRIPTIONS = {
  revenue_growth: 'How much revenue grew or shrank versus the same measure last period. Trying to answer: is the business expanding, and is that pace accelerating or slowing?',
  gp_margin: 'The share of every sales dollar left after direct costs (materials, subcontractors, cost of goods) before overheads. Trying to answer: are pricing and production costs under control — the foundation everything else, including wages and profit, gets funded from.',
  np_margin: 'The share of every sales dollar left as actual profit, before tax, after every cost is paid. Trying to answer the bottom-line question: is this business actually making money?',
  wages_pct: 'Wages as a share of revenue — how much of every sales dollar goes to paying staff. Trying to answer: is labour cost proportionate to what the business earns, or quietly eating into margin?',
  debtor_days: 'How many days, on average, it takes customers to pay their invoices. Trying to answer: how much cash is tied up waiting to be collected instead of sitting in the bank?',
  creditor_days: 'How many days, on average, the business takes to pay its own suppliers. Trying to answer: how much breathing room exists before cash actually has to leave the business?',
  inventory_days: 'How many days\' worth of stock sits on the shelf before it sells. Trying to answer: how much cash is tied up in inventory that isn\'t working for the business yet?',
  debt_to_equity: 'How much the business is funded by debt versus the owner\'s own equity. Trying to answer: how leveraged — and how exposed to interest-rate or repayment pressure — is the business really?',
  current_ratio: 'Current assets divided by current liabilities — whether the business could cover what it owes over the next 12 months with what it can turn into cash in that time. Trying to answer a simple solvency question: can short-term bills actually be paid?',
  op_cash_conversion: 'How much of the business\'s profit actually turned into real cash this period, rather than sitting in debtors, inventory, or unpaid bills. Trying to catch the gap between "profitable on paper" and "cash in the bank."',
  effective_tax_rate: 'Tax expense as a share of pre-tax profit — what the business is actually paying in tax relative to what it earned. Trying to flag something worth asking about: a timing issue, a genuine planning opportunity, or a mistake.',
  roe: 'Return on Equity — profit generated relative to the owner\'s own stake in the business. Trying to answer: is the money the owner has tied up here working as hard as it could be somewhere else?',
};

// A general "what's typically considered healthy" reference for the two
// Balance Sheet KPIs the AI deliberately never benchmarks (see analyze-
// background.js's diagnosis prompt point 6: current ratio and debt/equity
// are capital-structure/lifecycle choices, not industry-driven, so an
// industry benchmark for them would be misleading). That's a real reason to
// skip an INDUSTRY figure — it isn't a reason to leave the reader with no
// reference point at all, since both of these do have well-established
// general accounting rules of thumb independent of industry. Current
// ratio's numbers match the same 0.8/2.0 poor/good anchors
// scoreCashFlowPillar already uses server-side, so the card and the pillar
// score agree on what "healthy" means here rather than drifting apart.
const KPI_GENERAL_BENCHMARK = {
  current_ratio: 'Typically 1.5–2.0x is considered healthy; below 1.0x can signal short-term liquidity strain — current liabilities outweighing what can be turned into cash within a year.',
  debt_to_equity: 'Typically under 1–2x is considered conservative for a small business; higher means heavier reliance on debt over the owner\'s own equity to fund the business.',
  roe: 'Typically 15-20%+ is considered strong for a small business, single digits weak — but a high number can also come from thin equity or heavy debt rather than genuine performance, so read it alongside net profit margin and debt/equity, not on its own.',
  revenue_growth: 'For a business trying to grow: 10%+ is strong, 3–10% solid, -3–3% flat, below -10% a real concern. For a business whose stated posture is Consolidate or Hold wealth, flat (±5%) is read as the actual goal instead — see Profile — so the bands shift rather than staying fixed.',
};

// Numeric cutoffs mirroring KPI_GENERAL_BENCHMARK's own prose above — gives
// effectiveKpiVerdict a real threshold to check for these 3 KPIs instead of
// falling through to the AI's independent per-period judgment call, so the
// badge on a card can never contradict the benchmark text sitting right
// below it on the same card (a real, confusing case this fixes: 1.96x
// current ratio showing "OK" while the text right underneath says 1.5-2.0x
// is healthy — two unconnected sources of "is this good" disagreeing on
// the same card). Values are in the same units as kpi.value (current_ratio/
// debt_to_equity as a raw ratio, roe as a decimal fraction).
const KPI_GENERAL_BENCHMARK_THRESHOLDS = {
  current_ratio: { bad: 1.0, good: 1.5 },
  debt_to_equity: { bad: 2.0, good: 1.0 },
  roe: { bad: 0.08, good: 0.15 },
  // Matches renderCashConversionExplainer's own `isHigh = pct >= 0.8` cutoff
  // exactly — that explainer renders on this same card, so its badge and
  // its narrative need to agree on what "high" means, not just this card
  // and its (nonexistent, for this KPI) benchmark text.
  op_cash_conversion: { bad: 0.5, good: 0.8 },
};
function generalBenchmarkVerdict(key, value) {
  const t = KPI_GENERAL_BENCHMARK_THRESHOLDS[key];
  if (!t || value == null) return null;
  const higherIsBetter = KPI_DIRECTION[key] === 'higher';
  if (higherIsBetter) {
    if (value >= t.good) return 'good';
    if (value < t.bad) return 'bad';
    return 'ok';
  }
  if (value <= t.good) return 'good';
  if (value > t.bad) return 'bad';
  return 'ok';
}

// Revenue growth doesn't fit generalBenchmarkVerdict's flat two-number
// shape — it's posture-aware, mirroring analyze-background.js's
// scoreGrowthPillar bands exactly (duplicated client-side, same per-file-
// independence convention already used throughout this codebase), so this
// KPI card's badge agrees with what the Growth pillar score computes for
// the same underlying number, rather than a second, unrelated scheme. A
// client whose stated posture is Consolidate/Hold wealth explicitly said
// flat revenue IS the goal — flat reads as "very good" for them, not
// merely "OK" the way a flat universal threshold would call it.
// Collapses that function's 5-value score (2/4/6/7/9) into the 3-tier
// good/ok/bad this app's KPI badges use everywhere else.
function revenueGrowthVerdict(value) {
  if (value == null) return null;
  const posture = currentCtx?.profile_extra?.posture;
  const wantsSteady = posture === 'consolidate' || posture === 'hold_wealth';
  let score;
  if (wantsSteady) {
    if (value >= -0.05 && value <= 0.05) score = 9;
    else if (value < -0.05 && value >= -0.15) score = 6;
    else if (value < -0.15) score = 3;
    else score = 6;
  } else {
    if (value >= 0.10) score = 9;
    else if (value >= 0.03) score = 7;
    else if (value >= -0.03) score = 6;
    else if (value >= -0.10) score = 4;
    else score = 2;
  }
  if (score >= 7) return 'good';
  if (score <= 4) return 'bad';
  return 'ok';
}

// A plain good/ok/bad read on a KPI's value, shown as its own badge (distinct
// from the confidence-badge up top, which is about data COMPLETENESS, not
// performance). Target-based (client's own explicit goal) always wins when
// one's set — the AI's verdict, judged against general industry/lifecycle
// expectations, is the fallback for the many KPIs nobody's set a target on.
const KPI_VERDICT_META = {
  good: { label: 'Good', cls: 'green' },
  ok: { label: 'OK', cls: 'yellow' },
  bad: { label: 'Needs attention', cls: 'red' },
};

function groupKpis(kpis) {
  const byCategory = {};
  kpis.forEach((k) => {
    const cat = k.category || 'other';
    (byCategory[cat] = byCategory[cat] || []).push(k);
  });
  const order = [...KPI_CATEGORY_ORDER, ...Object.keys(byCategory).filter((c) => !KPI_CATEGORY_ORDER.includes(c))];
  return order.filter((c) => byCategory[c]?.length).map((c) => ({ key: c, label: KPI_CATEGORY_META[c] || c, kpis: byCategory[c] }));
}

// Format-aware trend, unlike trendArrow (which assumes 0-10 pillar scores) —
// a 0.02 swing in a percent KPI (2 points) reads very differently to a 0.02 swing
// in a ratio KPI (2 hundredths), so the diff has to be scaled per KPI format.
function kpiTrendLine(kpi) {
  const { value, priorValue, format, key } = kpi;
  const diff = value - priorValue;
  const scaled = format === 'percent' ? diff * 100 : diff;
  if (Math.abs(scaled) < 0.05) return '<span class="trend-flat">— no change</span>';
  const up = diff > 0;
  // The arrow always shows the literal direction the number moved — but its
  // colour is favourable/unfavourable, via the same KPI_DIRECTION lookup the
  // KPI card's own target-comparison colouring uses, not just "up=green."
  // Debtor days rising is worse, even though the value itself went up — a
  // plain diff>0 check would have shown that in green. No entry in
  // KPI_DIRECTION (shouldn't happen for the 12 KPIs it's called on) falls
  // back to neutral rather than guessing.
  const direction = KPI_DIRECTION[key];
  const favorable = direction ? (direction === 'higher' ? up : !up) : null;
  const colorClass = favorable == null ? 'trend-flat' : favorable ? 'trend-up' : 'trend-down';
  const unit = format === 'percent' ? ' pts' : format === 'days' ? 'd' : 'x';
  return `<span class="${colorClass}">${up ? '↑' : '↓'} ${Math.abs(scaled).toFixed(1)}${unit} vs last period</span>`;
}

// Format-aware raw difference (e.g. current vs. target) — same unit handling as
// kpiTrendLine, but signed and without the up/down colour framing, since we
// can't assume which direction is "good" for every KPI (more debtor days is
// bad, more creditor days is often fine, effective tax rate has no universal
// direction) — so this states the number, not a verdict.
function formatDiff(diff, format) {
  if (format === 'money') return (diff >= 0 ? '+' : '−') + formatMoney(Math.abs(diff));
  const scaled = format === 'percent' ? diff * 100 : diff;
  const unit = format === 'percent' ? ' pts' : format === 'days' ? 'd' : 'x';
  return `${scaled >= 0 ? '+' : ''}${scaled.toFixed(1)}${unit}`;
}

// A KPI target is a goal item (in the 'business' category, same bridge
// addTextAsGoal uses) carrying extra kpi_key/target fields. Deliberately NOT
// using resolveGoalList's category carry-forward here: that anchors to the
// nearest prior period with ANY item in the category, so an unrelated goal in
// a more recent period (e.g. "Grow to $1.5m revenue") would shadow an older
// KPI target and hide it. Instead this searches every period up to the one
// being viewed, most recent first, across every category, for the first
// non-done match on this specific kpi_key.
function findKpiTarget(kpiKey) {
  if (!currentCtx?.owner_goals || !currentPeriodEnd) return null;
  const goals = currentCtx.owner_goals;
  const periods = goals.periods || {};
  const allCats = [...GOAL_CATEGORIES, ...(goals.custom_categories || [])];
  const candidatePeriods = Object.keys(periods).filter((p) => p <= currentPeriodEnd).sort().reverse();
  for (const p of candidatePeriods) {
    for (const cat of allCats) {
      const items = (periods[p]?.cats?.[cat.key]?.items || []).filter((it) => !it.deleted);
      const match = items.find((it) => !it.done && it.kpi_key === kpiKey && it.target != null);
      if (match) return { ...match, category: cat.key, sourcePeriod: p };
    }
  }
  return null;
}

// Same walk as findKpiTarget, but collects every distinct kpi_key with an
// active target instead of stopping at one requested key — feeds the
// Pace-to-goal card, which needs to show all of a client's KPI targets at
// once, not just one.
function findAllKpiTargets() {
  if (!currentCtx?.owner_goals || !currentPeriodEnd) return [];
  const goals = currentCtx.owner_goals;
  const periods = goals.periods || {};
  const allCats = [...GOAL_CATEGORIES, ...(goals.custom_categories || [])];
  const candidatePeriods = Object.keys(periods).filter((p) => p <= currentPeriodEnd).sort().reverse();
  const found = {};
  for (const p of candidatePeriods) {
    for (const cat of allCats) {
      const items = (periods[p]?.cats?.[cat.key]?.items || []).filter((it) => !it.deleted);
      items.filter((it) => !it.done && it.kpi_key && it.target != null).forEach((it) => {
        if (!found[it.kpi_key]) found[it.kpi_key] = { ...it, category: cat.key, sourcePeriod: p };
      });
    }
  }
  return Object.values(found);
}

async function addKpiTargetGoal(kpi, target, category = 'business') {
  const fresh = await callRead('get_context', currentClientId);
  const current = fresh?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.[category]?.items || [];
  const now = new Date().toISOString();
  const text = `Get ${kpi.name} to ${formatKpi(target, kpi.format)}.`;
  const items = [...current, { id: uid(), text, kpi_key: kpi.key, target, created_at: now, updated_at: now, done: false }];
  await saveGoalItems(category, items);
}

// Updates the target value in place, at whichever period it actually lives in
// (sourcePeriod may be an earlier period than the one currently being viewed) —
// writing it to currentPeriodEnd instead would create a disconnected duplicate.
async function editKpiTargetGoal(kpi, target, category, sourcePeriod, itemId) {
  const fresh = await callRead('get_context', currentClientId);
  const current = fresh?.owner_goals?.periods?.[sourcePeriod]?.cats?.[category]?.items || [];
  const now = new Date().toISOString();
  const items = current.map((it) => it.id === itemId ? { ...it, target, text: `Get ${kpi.name} to ${formatKpi(target, kpi.format)}.`, updated_at: now } : it);
  const res = await fetch('/.netlify/functions/manual-entry', {
    method: 'POST',
    body: JSON.stringify({ type: 'goal_items', client_id: currentClientId, period_end: sourcePeriod, category, items }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
}

// editable=false (used for division cards — see renderKpiCard) shows the
// same target comparison line with no edit affordance at all: a target is
// one client-wide number (Goals has no concept of "Jim's own GP target"),
// so it's read-only context on a division card, not something to set or
// edit from there. This also sidesteps a real bug the by-division cards
// otherwise reintroduce — target-editor-${kpi.key}/target-input-${kpi.key}
// are plain ids with no per-view scoping, so if the SAME kpi key (e.g.
// gp_margin) rendered its full editable block in more than one
// simultaneously-mounted panel (all panels pre-render, only toggled via
// display:none), document.getElementById would only ever find the FIRST
// one — clicking "edit" on a later panel's card would silently open a
// DIFFERENT panel's hidden editor. Not rendering the editor markup at all
// for non-editable cards avoids the duplicate-id situation outright rather
// than trying to scope/fix it.
function renderKpiTargetBlock(kpi, editable = true) {
  const targetItem = findKpiTarget(kpi.key);
  if (targetItem) {
    const comparisonLine = `<p class="kpi-target">🎯 Target ${formatKpi(targetItem.target, kpi.format)} — ${formatDiff(kpi.value - targetItem.target, kpi.format)} vs target</p>`;
    if (!editable) return `<div class="kpi-target-row">${comparisonLine}</div>`;
    return `
      <div class="kpi-target-row">
        ${comparisonLine}
        <button class="mini-link" data-edit-target="${kpi.key}" type="button">edit</button>
      </div>
      <div class="kpi-target-editor" id="target-editor-${kpi.key}" style="display:none;">
        <input type="number" step="0.01" id="target-input-${kpi.key}" value="${kpi.format === 'percent' ? +(targetItem.target * 100).toFixed(4) : targetItem.target}" />
        <button class="mini-link" data-save-target="${kpi.key}" data-item-id="${targetItem.id}" data-item-cat="${targetItem.category}" data-item-period="${targetItem.sourcePeriod}" type="button">Save</button>
        <button class="mini-link" data-cancel-target="${kpi.key}" data-was-set="1" type="button">Cancel</button>
      </div>
    `;
  }
  if (!editable) return ''; // nothing to compare against, and can't set one from a division card either
  return `
    <div class="kpi-target-set">
      <button class="mini-link" data-set-target="${kpi.key}" type="button">🎯 Set target</button>
      <div class="kpi-target-editor" id="target-editor-${kpi.key}" style="display:none;">
        <input type="number" step="0.01" id="target-input-${kpi.key}" placeholder="e.g. ${kpi.format === 'percent' ? '55' : kpi.format === 'days' ? '30' : kpi.format === 'money' ? '20000' : '1.5'}" />
        <button class="mini-link" data-save-target="${kpi.key}" type="button">Save</button>
        <button class="mini-link" data-cancel-target="${kpi.key}" type="button">Cancel</button>
      </div>
    </div>
  `;
}

// The derived operating cash flow is a formula's best guess, not something
// the user entered — this lets them see exactly what went into it and
// override any component (or add a manual adjustment) rather than being
// stuck accepting the formula's output as final. The item row itself is the
// toggle (click "Operating cash flow" to see where it came from) rather than
// a separate link, so every derived figure in this panel behaves the same way.
function renderOcfAdjustBlock(kpi) {
  const b = kpi.ocf_breakdown;
  if (!b) return '';
  const total = b.net_profit + b.interest_expense + b.depreciation_amortisation - b.delta_debtors + b.delta_creditors - b.delta_inventory;
  const row = (id, label, value, jumpField) => `<div class="ocf-row"><label>${label}</label><input type="number" step="1000" id="ocf-${id}" value="${value ?? 0}" />${jumpField ? jumpLink(jumpField) : ''}</div>`;
  return `
    <div class="cash-item cash-item-clickable" id="ocf-adjust-toggle">
      <span class="cash-item-icon">⚙️</span>
      <span class="cash-item-label">Operating cash flow</span>
      <span class="cash-item-amount readonly ${total < 0 ? 'neg' : ''}">${formatMoney(total)}</span>
      <span class="chevron">▾</span>
    </div>
    <div class="ocf-adjust-panel" id="ocf-adjust-panel" style="display:none;">
      ${row('net_profit', 'Net profit', b.net_profit, 'net_profit')}
      ${row('interest_expense', '+ Interest', b.interest_expense, 'interest_expense')}
      ${row('depreciation_amortisation', '+ Depreciation/Amortisation', b.depreciation_amortisation, 'depreciation_amortisation')}
      ${row('delta_debtors', '− Change in debtors', b.delta_debtors, 'debtors')}
      ${row('delta_creditors', '+ Change in creditors', b.delta_creditors, 'creditors')}
      ${row('delta_inventory', '− Change in inventory', b.delta_inventory, 'inventory')}
      ${row('manual_adjustment', '+/− Manual adjustment', 0)}
      <p class="ocf-total">= <span id="ocf-total-value">${formatMoney(total)}</span></p>
      <button class="action secondary" id="ocf-save-btn" type="button">Save as Operating Cash Flow</button>
      <div class="save-msg" id="ocf-save-msg"></div>
    </div>
  `;
}

// "Where do these numbers come from" for the lines in the cash reconciliation

function renderDebtAdjustBlock(r) {

// Explains the gap between the actual change in the bank balance and the
// (usually smaller) operating cash flow figure — deliberately separate from
// deriveOperatingCashFlow/renderOcfAdjustBlock above: that formula stays
// "pure" (operating activities only), while this reconciles the REST of the
// movement. delta_cash/operating_cf/delta_debt are facts derived from
// entered balances/OCF, shown read-only here — edit them via Manual Entry
// instead. The financing/investing pieces below ARE editable inline (like
// renderOcfAdjustBlock's breakdown), since a bookkeeper may know these
// numbers more precisely than what's currently saved. Anything still left
// over after all of that is an honest residual, not a guess.
function renderReconAdjustmentRow(a, section) {
  return `
    <div class="cash-item cash-adj-item recon-adj-row" data-adj-section="${section}">
      <span class="cash-item-icon">·</span>
      <input type="text" class="recon-adj-label cash-adj-label-input" placeholder="e.g. Insurance payout" value="${escAttr(a.label)}" />
      <input type="number" step="1000" class="recon-adj-amount cash-item-input" value="${a.amount ?? ''}" placeholder="+/− amount" />
      <button type="button" class="recon-adj-remove cash-adj-remove" title="Remove">✕</button>
    </div>
  `;
}

// Collapses a cash_reconciliation object into per-category subtotals — the
// same 4 numbers whether they're shown as compact-card tiles or as accordion
// section headers, so the two views can never drift out of sync. Each is
// signed (not a fixed in/out bucket) so a category can land on either side
// depending on what actually happened this period (e.g. Borrowings goes rust
// in a quarter where repayments outpaced new drawdowns).
// Identity: cashflow + capex + borrowings + owner + other + residual = delta_cash.
// Custom "+ Add item" adjustments carry a section tag (defaulting to 'other'
// for older items saved before sections existed) so each one folds into the
// category it was actually added under, not always the generic Other bucket.
function adjustmentsFor(r, section) {
  return (r.adjustments || []).filter((a) => (a.section || 'other') === section);
}
function sumAdjustmentsFor(r, section) {
  return adjustmentsFor(r, section).reduce((sum, a) => sum + (Number(a.amount) || 0), 0);
}
function buildCashTiles(r) {
  // Borrowings is a pure cash-flow category (new borrowing drawn minus
  // repayments made) — capitalised interest never touched the bank, so it's
  // excluded even though it's part of the balance movement. Interest
  // actually paid in cash gets its own category below, not folded in here —
  // paying interest isn't itself a borrowing activity.
  const interestPaid = (r.interest_applicable && r.cash_interest_paid) ? r.cash_interest_paid : 0;
  return {
    cashflow: r.operating_cf,
    capex: (r.capex != null ? -r.capex : 0) + sumAdjustmentsFor(r, 'capex'),
    borrowings: (r.borrowings_cash_flow || 0) + sumAdjustmentsFor(r, 'borrowings'),
    interest: -interestPaid,
    owner: (r.delta_director_loan || 0) + (r.funds_introduced || 0) - (r.owner_drawings || 0) + sumAdjustmentsFor(r, 'owner'),
    other: sumAdjustmentsFor(r, 'other'),
  };
}

// item(): a single breakdown line inside an accordion section — icon, label,
// and either a plain (read-only, computed) amount or a live input. Every id
// used by the JS wiring below is preserved exactly across redesigns — only
// the markup/classes have changed.
function renderCashReconciliationBlock(kpi) {
  const r = kpi.cash_reconciliation;
  if (!r) return '';
  const tiles = buildCashTiles(r);
  const item = (icon, label, sub, amountHtml) => `
    <div class="cash-item">
      <span class="cash-item-icon">${icon}</span>
      <span class="cash-item-label">${label}${sub ? `<span class="sub">${sub}</span>` : ''}</span>
      ${amountHtml}
    </div>
  `;
  const readonly = (value) => `<span class="cash-item-amount readonly ${value < 0 ? 'neg' : ''}">${value == null ? '—' : formatMoney(value)}</span>`;
  const editable = (id, value, placeholder, jumpField) => `<input type="number" step="1000" id="recon-${id}" value="${value ?? ''}" placeholder="${placeholder ?? '0'}" class="cash-item-input" />${jumpField ? jumpLink(jumpField) : ''}`;
  const section = (key, icon, label, subtotal, bodyHtml) => `
    <div class="cash-accordion-section">
      <button type="button" class="cash-accordion-head" data-accordion-toggle="${key}">
        <span class="cash-accordion-head-label">${icon} ${label}</span>
        <span class="cash-accordion-head-value ${subtotal < 0 ? 'neg' : ''}" id="recon-sub-${key}">${formatMoney(subtotal)} <span class="chevron">▾</span></span>
      </button>
      <div class="cash-accordion-body" id="recon-body-${key}" style="display:none;">${bodyHtml}</div>
    </div>
  `;
  // Every section gets its own "+ Add item" — a custom line the built-in
  // fields don't cover, tagged to that section so it folds into that
  // section's own subtotal (see buildCashTiles) rather than always landing
  // in a generic Other bucket.
  const addItemBlock = (sec) => `
    <div id="recon-adjustments-list-${sec}">${adjustmentsFor(r, sec).map((a) => renderReconAdjustmentRow(a, sec)).join('')}</div>
    <button type="button" class="mini-link cash-adj-add-row" data-adj-add="${sec}">+ Add item</button>
  `;
  // Same "show the actual arithmetic" convention as Cash/Tax outlook's own
  // buildup lines — only shown while the capex figure IS the estimate (a
  // typed-in override needs no working, it's just the number entered), and
  // only appends the capital works/disposals terms when they're non-zero so
  // the common case (neither applies) doesn't show two "+ $0" terms.
  const capexBreakdown = (r.capex_is_estimate && r.delta_fixed_assets != null && r.depreciation_amortisation != null) ? (() => {
    let s = `Δ fixed assets (${formatMoney(r.fixed_assets_current)} − ${formatMoney(r.fixed_assets_prior)}) = <b>${r.delta_fixed_assets < 0 ? '−' : ''}${formatMoney(Math.abs(r.delta_fixed_assets))}</b> + depreciation <b>${formatMoney(r.depreciation_amortisation)}</b>`;
    if (r.capital_works_deduction) s += ` + capital works <b>${formatMoney(r.capital_works_deduction)}</b>`;
    if (r.nbv_assets_sold) s += ` + disposals (NBV) <b>${formatMoney(r.nbv_assets_sold)}</b>`;
    s += ` = est. <b>${formatMoney(r.capex_estimate)}</b>`;
    return s;
  })() : '';
  return `
    <div class="kpi-ocf-adjust">
      <button class="mini-link" id="recon-toggle" type="button">Where did the cash go?</button>
      <div class="ocf-adjust-panel" id="recon-panel" style="display:none;">
        <div class="cash-breakdown">
          ${renderCashBalanceAdjustBlock(r)}
          ${renderOcfAdjustBlock(kpi)}

          ${section('capex', '🏗️', 'Capex', tiles.capex, `
            ${item('🏗️', 'Equipment/assets (capex)', r.capex_is_estimate ? 'estimated — type to override, or ↗ to correct an input in Manual Entry' : null, editable('equipment_purchases', r.equipment_purchases, r.capex_estimate != null ? `est. ${formatMoney(r.capex_estimate)}` : '0', r.capex_is_estimate ? 'fixed_assets' : 'equipment_purchases'))}
            ${capexBreakdown ? `<p style="font-size:11px; color:var(--ink-soft); margin:6px 0 8px 24px;">${capexBreakdown}</p>` : ''}
            ${addItemBlock('capex')}
          `)}

          ${section('borrowings', '🏦', 'Borrowings', tiles.borrowings, `
            ${renderDebtAdjustBlock(r)}
            ${r.interest_applicable ? `
              <div class="cash-item cash-item-clickable" data-accordion-toggle="interest">
                <span class="cash-item-icon">💸</span>
                <span class="cash-item-label">Interest expense (P&amp;L)<span class="sub">click to split into capitalised vs cash-paid</span></span>
                <span class="cash-item-amount readonly neg" id="recon-interest-expense">${formatMoney(-r.interest_paid)}</span>
                <span class="chevron">▾</span>
              </div>
              <div class="ocf-adjust-panel cash-accordion-body" id="recon-body-interest" style="display:none;">
                <div class="ocf-row"><label>+ Interest capitalised<span class="sub">added to the loan rather than paid in cash — from a loan statement, if disclosed</span></label><input type="number" step="1000" id="recon-interest_capitalised" value="${r.capitalised_interest ?? ''}" placeholder="0" />${jumpLink('interest_capitalised')}</div>
                <div class="ocf-row"><label>Interest paid (cash) — calculated<span class="sub">expense above minus capitalised above — not its own input, just the rest of that subtraction</span></label><span class="cash-item-amount readonly" id="recon-cash-interest">${r.cash_interest_paid == null ? '—' : formatMoney(r.cash_interest_paid)}</span></div>
              </div>
              <p class="kpi-note" id="recon-borrowings-tieout" style="margin:2px 0 0; padding:0 0 10px 24px; border-bottom:1px solid var(--line);">Borrowings <b id="recon-borrowings-tieout-tile">${formatMoney(tiles.borrowings)}</b> + <b>only</b> the capitalised portion of interest, <b id="recon-borrowings-tieout-capint">${formatMoney(r.capitalised_interest || 0)}</b> — not the full expense above — = net change in borrowings <b>${formatMoney(r.delta_debt)}</b></p>
            ` : ''}
            <div class="cash-item cash-item-clickable" data-accordion-toggle="net-calculated">
              <span class="cash-item-icon">↳</span>
              <span class="cash-item-label">Net change (calculated)<span class="sub">optional cross-check — compare to the balance figure above</span></span>
              <span class="cash-item-amount readonly ${r.borrowings_net_calculated < 0 ? 'neg' : ''}" id="recon-net-calculated">${r.borrowings_net_calculated == null ? '—' : formatMoney(r.borrowings_net_calculated)}</span>
              <span class="chevron">▾</span>
            </div>
            <div class="ocf-adjust-panel cash-accordion-body" id="recon-body-net-calculated" style="display:none;">
              <div class="ocf-row"><label>New borrowing</label><input type="number" step="1000" id="recon-new_borrowing" value="${r.new_borrowing ?? ''}" placeholder="${r.new_borrowing_estimate != null ? `est. ${formatMoney(r.new_borrowing_estimate)}` : '0'}" />${jumpLink('new_borrowing')}</div>
              <div class="ocf-row"><label>− Loan repayments (regular)</label><input type="number" step="1000" id="recon-loan_repayments" value="${r.loan_repayments ?? ''}" />${jumpLink('loan_repayments')}</div>
              <div class="ocf-row"><label>− One-off/extra repayment</label><input type="number" step="1000" id="recon-one_off_loan_repayment" value="${r.one_off_loan_repayment ?? ''}" placeholder="0" />${jumpLink('one_off_loan_repayment')}</div>
              <div class="ocf-row" id="recon-nc-capint-row" style="display:${r.capitalised_interest ? '' : 'none'};"><label>+ Capitalised interest<span class="sub">see Interest expense above to change this</span></label><span class="cash-item-amount readonly" id="recon-nc-capint">${r.capitalised_interest ? formatMoney(r.capitalised_interest) : ''}</span></div>
              <p class="ocf-total">= <span id="recon-nc-total">${r.borrowings_net_calculated == null ? '—' : formatMoney(r.borrowings_net_calculated)}</span></p>
            </div>
            ${addItemBlock('borrowings')}
          `)}

          ${section('owner', '👤', 'Owner', tiles.owner, `
            ${item('👤', 'Director/shareholder loan balance', 'closing balance for this period — positive if the business owes them, negative if it\'s a receivable (they owe the business)', editable('director_loan_balance', r.director_loan_balance, null, 'director_loan_balance'))}
            ${item('↳', 'movement this period', r.director_loan_balance_prior != null ? `vs ${formatMoney(r.director_loan_balance_prior)} prior` : null, `<span class="cash-item-amount readonly" id="recon-director-loan-movement">${r.delta_director_loan == null ? '—' : formatMoney(r.delta_director_loan)}</span>${(r.director_loan_balance_prior != null && r.prior_period_end) ? jumpLink('director_loan_balance', r.prior_period_end) : ''}`)}
            ${item('＋', 'Funds introduced', null, editable('funds_introduced', r.funds_introduced, null, 'funds_introduced'))}
            ${item('－', 'Owner drawings', null, editable('owner_drawings', r.owner_drawings, null, 'owner_drawings'))}
            ${addItemBlock('owner')}
          `)}

          ${section('other', '📝', 'Other', tiles.other, addItemBlock('other'))}

          <div class="cash-residual-box ${r.residual < 0 ? 'neg' : ''}" id="recon-residual-box">
            <span class="cash-residual-label">Still unexplained</span>
            <span class="cash-residual-value" id="recon-residual-value">${formatMoney(r.residual)}</span>
          </div>
          <p class="kpi-note" id="recon-equation">${formatMoney(r.delta_cash - r.residual)} net + ${formatMoney(r.residual)} unexplained = ${formatMoney(r.delta_cash)} actual change in cash</p>
          <p class="kpi-note" id="recon-note">${r.has_financing_data
            ? 'Add an item above if you know what the remainder is.'
            : 'Fill in the figures above (from bank/loan statements) to explain this period’s cash movement.'}</p>
          <button class="action secondary" id="recon-save-btn" type="button">Save these figures</button>
          <div class="save-msg" id="recon-save-msg"></div>
        </div>
      </div>
    </div>
  `;
}

// Collapses a cash_reconciliation object into two totals — "cash in" and
// "cash out" — for the at-a-glance card, rather than the line-by-line ledger
// the detailed panel shows. net should equal delta_cash exactly when nothing
// is missing; when a residual exists (fields not entered), in+out under-
// explains the actual change, and the glance card says so rather than
// silently presenting a total that doesn't foot to the real cash movement.
function cashInOut(r) {
  if (!r) return null;
  let cashIn = 0, cashOut = 0;
  const add = (v) => { if (v == null) return; if (v >= 0) cashIn += v; else cashOut += -v; };
  add(r.operating_cf);
  if (r.capex) cashOut += r.capex;
  add(r.borrowings_cash_flow);
  if (r.interest_applicable && r.cash_interest_paid) cashOut += r.cash_interest_paid;
  add(r.delta_director_loan);
  if (r.funds_introduced) cashIn += r.funds_introduced;
  if (r.owner_drawings) cashOut += r.owner_drawings;
  (r.adjustments || []).forEach((a) => add(Number(a.amount) || 0));
  return { cashIn, cashOut, net: cashIn - cashOut, delta_cash: r.delta_cash };
}

// Plain-English, entirely template-driven (no AI) — every number here is
// already computed, so this is just picking which clauses are worth saying
// out loud and skipping the ones that are zero/not entered.
function cashStorySentence(r) {
  if (!r) return null;
  const parts = [];
  if (r.operating_cf != null) parts.push(r.operating_cf >= 0 ? `generated ${formatMoney(r.operating_cf)} from operations` : `used ${formatMoney(Math.abs(r.operating_cf))} in operations`);
  if (r.capex) parts.push(`spent ${formatMoney(r.capex)} on equipment/assets`);
  if (r.borrowings_cash_flow) parts.push(r.borrowings_cash_flow > 0 ? `borrowed ${formatMoney(r.borrowings_cash_flow)}` : `paid down ${formatMoney(Math.abs(r.borrowings_cash_flow))} of debt`);
  if (r.interest_applicable && r.cash_interest_paid) parts.push(`paid ${formatMoney(r.cash_interest_paid)} in interest`);
  if (r.delta_director_loan) parts.push(r.delta_director_loan > 0 ? `the director lent ${formatMoney(r.delta_director_loan)} to the business` : `repaid ${formatMoney(Math.abs(r.delta_director_loan))} to the director`);
  if (r.funds_introduced) parts.push(`the owner put in ${formatMoney(r.funds_introduced)}`);
  if (r.owner_drawings) parts.push(`the owner drew ${formatMoney(r.owner_drawings)}`);
  (r.adjustments || []).forEach((a) => { const amt = Number(a.amount) || 0; if (amt) parts.push(`${(a.label || 'an item').toLowerCase()} ${amt > 0 ? '+' : '−'}${formatMoney(Math.abs(amt))}`); });
  if (!parts.length) return null;
  const tail = r.delta_cash > 0 ? `cash grew by ${formatMoney(r.delta_cash)}.` : r.delta_cash < 0 ? `cash fell by ${formatMoney(Math.abs(r.delta_cash))}.` : `cash was flat.`;
  return 'This period: ' + parts.join(', ') + ' — ' + tail;
}

// Synthetic KPI object (not a real kpi_library row) purely so this card can
// reuse renderKpiTargetBlock/addKpiTargetGoal/editKpiTargetGoal exactly as
// they already work for real KPIs — 'money' format (see formatKpi/formatDiff)
// rather than percent/days/ratio, since the target here is a dollar figure.
// Targets the ACTUAL cash movement (delta_cash), not just the explained
// portion — same reasoning as the headline number below.
function buildCashNetMovementKpi(cur) {
  return { key: 'cash_net_movement', name: 'Where the cash went', format: 'money', category: 'cash', value: cur.delta_cash, priorValue: null };
}

function renderCashFlowGlanceCard(kpi) {
  const r = kpi.cash_reconciliation;
  const cur = cashInOut(r);
  if (!cur) return '';
  const prior = cashInOut(kpi.prior_cash_reconciliation);
  const story = cashStorySentence(r);
  // "Net this period" is the ACTUAL change in the bank balance (delta_cash),
  // not the sum of the tiles below — those only cover what's been entered,
  // so summing them and calling it "net" would silently disagree with the
  // real cash movement whenever anything is missing. The Unexplained badge
  // in the header is what accounts for the gap between the two.
  const tip = cur.delta_cash >= 0
    ? 'Building cash with no clear use? Consider accelerating debt repayment, reinvesting in the business, or setting a cash reserve target.'
    : 'Cash is being drawn down — check whether debt repayments, capex, or drawings outpaced what the business generated this period.';

  let trendLine = '<p class="cash-prior-compare muted plain">No prior period on file</p>';
  if (prior) {
    const diff = cur.delta_cash - prior.delta_cash;
    trendLine = Math.abs(diff) < 1
      ? `<p class="cash-prior-compare"><span class="trend-flat">— no change</span> vs last period (${formatMoney(prior.delta_cash)})</p>`
      : `<p class="cash-prior-compare"><span class="${diff > 0 ? 'trend-up' : 'trend-down'}">${diff > 0 ? '↑' : '↓'} ${formatMoney(Math.abs(diff))}</span> vs last period (${formatMoney(prior.delta_cash)})</p>`;
  }

  // Tiles double as shortcuts into the matching accordion section below (see
  // data-tile-jump wiring) — "cashflow" has no section of its own (operating
  // cash flow is a plain fact at the top of the panel, not editable), so it
  // just opens the panel without expanding anything. "Other" only shows up
  // here when it actually has something in it, to avoid an always-empty tile.
  const tiles = buildCashTiles(r);
  const tile = ([key, icon, label, value]) => `
    <button type="button" class="cash-tile" data-tile-jump="${key}">
      <p class="cash-tile-label">${icon} ${label}</p>
      <p class="cash-tile-value ${value < 0 ? 'neg' : ''}">${formatMoney(value)}</p>
    </button>
  `;
  const tileDefs = [
    ['cashflow', '⚙️', 'Cash flow', tiles.cashflow],
    ['capex', '🏗️', 'Capex', tiles.capex],
  ];
  // Once New borrowing has been entered as its own independent fact (not
  // just the default estimate), split it from repayments into separate
  // in/out tiles instead of one netted Borrowings figure — same net total
  // either way, just not hidden inside a single number. Both jump to the
  // same accordion section. Interest paid is always its own tile (below),
  // never folded into either of these — it isn't itself a borrowing.
  if (r.new_borrowing_is_estimate === false) {
    tileDefs.push(['borrowings', '🏦', 'New borrowing', r.new_borrowing]);
    tileDefs.push(['borrowings', '🏦', 'Repayments', -(r.total_repayments || 0)]);
  } else {
    tileDefs.push(['borrowings', '🏦', 'Borrowings', tiles.borrowings]);
  }
  if (r.interest_applicable && r.cash_interest_paid) tileDefs.push(['borrowings', '💸', 'Interest paid', tiles.interest]);
  tileDefs.push(['owner', '👤', 'Owner', tiles.owner]);
  if (Math.abs(tiles.other) > 0.5) tileDefs.push(['other', '📝', 'Other', tiles.other]);
  // Money in on the left, money out on the right — sorted by each tile's own
  // sign rather than a fixed position, so a quarter where Borrowings went
  // negative (repaid more than drawn) shows it on the right like any other
  // outflow. Nil/not-entered (exactly 0) defaults to the right rather than
  // the left — "nothing recorded" isn't a genuine inflow, so it shouldn't
  // read as one just because 0 isn't technically negative.
  const tileHtml = `
    <div class="cash-tile-col">${tileDefs.filter((t) => t[3] > 0).map(tile).join('')}</div>
    <div class="cash-tile-col">${tileDefs.filter((t) => t[3] <= 0).map(tile).join('')}</div>
  `;

  return `
    <div class="kpi-card" data-kpi-card-key="cash_net_movement">
      <div class="kpi-card-head">
        <p class="kpi-name" data-kpi-info="1" title="Click to see what this measures">Where the cash went <span class="kpi-info-icon">ⓘ</span></p>
      </div>
      <p class="kpi-interp kpi-description" style="display:none;">Cash on hand rising or falling doesn't say why — a $50K drop could be a healthy equipment purchase or a real trading problem, and this card is what tells those apart. Each tile below is one real driver of the movement (operating cash flow, capex, debt, owner drawings/contributions); anything left over shows as "unexplained" — a signal something wasn't captured or entered, not a rounding error to ignore.</p>
      <div class="cash-net-headline">
        <button type="button" class="cash-net-stat" data-tile-jump="cashflow" title="Net this period">
          <p class="cash-net-value cash-net-primary ${cur.delta_cash < 0 ? 'neg' : ''}" id="cash-net-headline-value">${formatMoney(cur.delta_cash)}</p>
          <span class="cash-net-stat-label">net this period</span>
        </button>
        <button type="button" class="cash-net-stat" data-tile-jump="unexplained" title="Still unexplained">
          <p class="cash-net-value ${r.residual < 0 ? 'neg' : ''}" id="cash-tile-unexplained">${formatMoney(r.residual)}</p>
          <span class="cash-net-stat-label">unexplained</span>
        </button>
      </div>
      ${trendLine}
      <div class="cash-tile-grid">${tileHtml}</div>
      ${story ? `<p class="kpi-cash-story">${story}</p>` : ''}
      <p class="kpi-tip">🔧 ${tip}</p>
      ${renderCashReconciliationBlock(kpi)}
      ${renderKpiTargetBlock(buildCashNetMovementKpi(cur))}
    </div>
  `;
}

// Same shape as Tax outlook (Financial Performance -> Analyse -> Cash) —
// same four-level scenario buildup (net profit direct > net profit change >
// GP change > revenue change, opex change layered on top, see
// projectProfitScenario), same collapsed "Adjust assumptions" panel, same
// provenance/buildup pattern — just one step further: apply the client's OWN
// historical operating cash conversion rate (already computed, not invented
// — see op_cash_conversion) to turn projected profit into projected
// operating cash flow. Deliberately doesn't try to model capex, debt
// draws/repayments, owner drawings, or tax payment timing — those are lumpy,
// judgment-heavy, and exactly the kind of stacked-assumption forecast this
// app has stayed away from all session. This is one clean extension of a
// number the app already trusts, not a full cash flow projection.
let cashOutlookState = defaultCashOutlookState();
// panelOpen: null means "no explicit preference — default to open only
// when there's a non-baseline scenario to show." Once the user manually
// toggles the panel, this becomes true/false and WINS from then on, even
// once re-derived from the exact same non-zero values — otherwise closing
// the panel is pointless: the next render (any navigation away and back,
// or a refresh) would recompute "open" from the values again and silently
// reopen it, ignoring that the user just closed it. Saved as part of the
// same JSON blob as the rest of the scenario, so the preference survives a
// real page reload too, not just in-session navigation.
function defaultGrowthOutlookState() { return { unit: 'pct', revenue: 0, cogs: 0, wages: 0, opex: 0, netProfit: 0, otherIncome: 0, gpMarginChange: 0, panelOpen: null }; }
let growthOutlookState = defaultGrowthOutlookState();
// Set fresh from the snapshot at the top of renderGrowthAnalyse, every
// render — this is genuinely per client+period saved state (see
// migration_growth_outlook_scenario.sql), not a carry-over scratchpad, so
// switching client or period must never leave a previous one's scenario
// showing.
let growthOutlookSaveTimer = null;
function isGrowthOutlookBaseline(s) {
  return !s.revenue && !s.cogs && !s.wages && !s.opex && !s.netProfit && !s.otherIncome && !s.gpMarginChange;
}
// Debounced, not on every keystroke directly — same reasoning as any other
// autosave-while-typing field in this app: wait for a pause, not every
// single input event, or a fast typist fires a save per digit. Saves null
// (not an all-zero blob) once the scenario is back to baseline, so
// resetting the fields also cleanly resets what's on file — no separate
// "delete" action needed.
function scheduleGrowthOutlookSave() {
  clearTimeout(growthOutlookSaveTimer);
  const clientId = currentClientId, periodEnd = currentPeriodEnd;
  const payload = isGrowthOutlookBaseline(growthOutlookState) ? null : { ...growthOutlookState };
  growthOutlookSaveTimer = setTimeout(async () => {
    try {
      await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'save_growth_outlook_scenario', client_id: clientId, period_end: periodEnd, growth_outlook_scenario: payload }),
      });
    } catch (err) {
      console.error('Growth outlook scenario save failed:', err.message);
    }
  }, 800);
}
// conversionOverride lets the adviser model "what if collection/payment
// timing were different" separately from "what if profit were different" —
// e.g. a client actively working on debtor days can see the cash impact of
// BOTH improving simultaneously, not just profit changes at a frozen
// conversion rate. Blank/0 keeps using this period's own actual rate.
// oneOffIncome/oneOffExpense are added AFTER the conversion step, not
// before — a one-off item (an asset sale, an insurance payout, a legal
// settlement) hits cash directly, at face value; running it through the
// operating cash conversion rate the way ongoing revenue/profit does would
// misrepresent a lump sum as if only ~X% of it ever reached the bank.
function computeCashOutlookResult(snapshot, actualConversion, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute, conversionOverride, oneOffIncome, oneOffExpense, superContribution, equipmentPurchase) {
  const { projectedProfit, buildup, provenance } = projectProfitScenario(snapshot, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute);
  const overrideNum = conversionOverride === '' || conversionOverride == null ? null : Number(conversionOverride) / 100;
  const conversion = overrideNum != null ? overrideNum : actualConversion;
  const fromOperations = projectedProfit * conversion;
  const oneOffNet = (Number(oneOffIncome) || 0) - (Number(oneOffExpense) || 0);
  // Super contribution and equipment purchase are real cash LEAVING the
  // business, not just a tax deduction — Tax outlook already reduces the
  // tax bill by these (see computeTaxOutlookResult), but until now Cash
  // outlook had no idea they existed, so a scenario with a $10k super
  // contribution and $20k of new equipment looked like a "free" tax saving
  // with zero cash cost. Deducted the same way one-off expense is — at
  // face value, after the conversion step, since neither is ongoing
  // revenue/profit that should run through the conversion rate.
  const deductionsCashOut = (Number(superContribution) || 0) + (Number(equipmentPurchase) || 0);
  const projectedOCF = fromOperations + oneOffNet - deductionsCashOut;
  const conversionLabel = overrideNum != null
    ? `<b>${(conversion * 100).toFixed(0)}%</b> cash conversion (overridden — this period's actual is ${(actualConversion * 100).toFixed(0)}%)`
    : `<b>${(conversion * 100).toFixed(0)}%</b> cash conversion (this period's actual rate)`;
  const oneOffLabel = oneOffNet !== 0
    ? ` ${oneOffNet > 0 ? '+' : '−'} <b>${formatMoney(Math.abs(oneOffNet))}</b> one-off${(Number(oneOffIncome) || 0) > 0 && (Number(oneOffExpense) || 0) > 0 ? ' (net)' : ''}`
    : '';
  const deductionsLabel = deductionsCashOut !== 0 ? ` − <b>${formatMoney(deductionsCashOut)}</b> super/equipment` : '';
  return {
    headline: formatMoney(projectedOCF),
    projectedOCF,
    projectedProfit,
    buildup: `${buildup} × ${conversionLabel} = ${formatMoney(fromOperations)} from operations${oneOffLabel}${deductionsLabel} = projected operating cash flow <b>${formatMoney(projectedOCF)}</b>`,
    provenance,
  };
}
function renderCashOutlookCard(snapshot, kpis) {
  const revenue = snapshot?.revenue;
  const netProfit = snapshot?.net_profit;
  const conversion = kpis?.find((k) => k.key === 'op_cash_conversion')?.value;
  if (!revenue || netProfit == null || conversion == null) return '';
  const selectStyle = 'padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);';
  const s = cashOutlookState;
  const shared = scenarioState;
  // step defaults to 1 (fine for a percentage-point field) — dollar fields
  // need a much bigger step, or the native spinner arrows are useless
  // (clicking from $0 to $20,000 one dollar at a time). The 4 fields that
  // toggle between % and $ (see the unit selector below) get their step
  // switched live in wireCashOutlookCard whenever that toggle changes.
  const row = (id, label, value, step = 1) => `<div class="ocf-row"><label>${label}</label><input type="number" id="${id}" value="${value}" placeholder="0" step="${step}" /></div>`;
  const toggleStep = shared.unit === 'dollar' ? 1000 : 1;
  const panelOpen = shared.revenue !== 0 || shared.gp !== 0 || shared.opex !== 0 || shared.netProfit !== 0 || shared.netProfitAbsolute !== '' || s.conversionOverride !== ''
    || shared.oneOffIncome !== 0 || shared.oneOffExpense !== 0 || shared.super !== 0 || shared.equipment !== 0;
  return `
    <div class="kpi-card">
      <div class="kpi-card-head"><p class="kpi-name" data-kpi-info="1" title="Click to see what this measures">Cash outlook — model a scenario <span class="kpi-info-icon">ⓘ</span></p></div>
      <p class="kpi-interp kpi-description" style="display:none;">Projects what operating cash flow would look like under a hypothetical change — a revenue increase, a margin improvement — rather than showing what already happened. Trying to answer "if we did X, what would that actually mean for cash" live, in front of the client, instead of after the meeting. Starts from this period's actual profit and this period's actual cash-conversion rate, then applies whatever scenario is typed in below — a rough estimate, not a forecast, since it doesn't model capex, debt, drawings, or tax payment timing.</p>
      <div style="display:flex; gap:12px; margin:4px 0 2px; flex-wrap:wrap;">
        <div style="background:var(--paper); border-radius:8px; padding:8px 12px; flex:1 1 110px; min-width:0;">
          <p class="kpi-value" id="cash-outlook-profit-value" style="margin:0;">—</p>
          <p class="card-label" style="margin:2px 0 0;">Projected profit</p>
        </div>
        <div id="cash-outlook-value-box" style="background:var(--paper-raised); border-radius:8px; padding:8px 12px; flex:1 1 110px; min-width:0;">
          <p class="kpi-value" id="cash-outlook-value" style="margin:0;">—</p>
          <p class="card-label" style="margin:2px 0 0;">Projected operating cash flow</p>
        </div>
      </div>
      <p style="font-size:11px; color:var(--ink-soft); margin:6px 0 0;">
        <span id="cash-outlook-provenance"></span>
        <button type="button" id="cash-outlook-provenance-link" style="background:none; border:none; padding:0; margin-left:2px; color:var(--brass); font-size:11px; cursor:pointer; text-decoration:underline; font-family:inherit;">Adjust assumptions</button>
      </p>

      <div class="cash-item cash-item-clickable" id="cash-outlook-toggle">
        <span class="cash-item-icon">🧮</span>
        <span class="cash-item-label">Adjust assumptions</span>
        <span class="chevron">${panelOpen ? '▴' : '▾'}</span>
      </div>
      <div class="ocf-adjust-panel" id="cash-outlook-panel" style="display:${panelOpen ? 'block' : 'none'};">
        <div class="ocf-row"><label>Change amounts as</label><select id="cash-outlook-unit" style="${selectStyle}"><option value="pct" ${shared.unit === 'pct' ? 'selected' : ''}>%</option><option value="dollar" ${shared.unit === 'dollar' ? 'selected' : ''}>$</option></select></div>
        ${row('cash-outlook-revenue', 'Revenue', shared.revenue, toggleStep)}
        ${row('cash-outlook-gp', 'Gross profit', shared.gp, toggleStep)}
        ${row('cash-outlook-opex', 'Operating expenses', shared.opex, toggleStep)}
        ${row('cash-outlook-netprofit', 'Net profit', shared.netProfit, toggleStep)}
        <div class="ocf-row"><label>Or set net profit directly ($)</label><input type="number" id="cash-outlook-netprofit-absolute" value="${shared.netProfitAbsolute}" placeholder="e.g. 150000" step="1000" /></div>
        <p style="font-size:11px; color:var(--ink-soft); margin:-4px 0 14px;">Setting net profit directly replaces this period's actual as the starting point everything below is built from — Revenue, Gross profit, and Net profit change all still apply on top of it. Among those three, fill in the most specific level: Net profit change overrides Gross profit, Gross profit overrides Revenue.</p>
        <div class="ocf-row"><label>Cash conversion rate override (%)</label><input type="number" id="cash-outlook-conversion" value="${s.conversionOverride}" placeholder="e.g. ${(conversion * 100).toFixed(0)} (this period's actual)" step="1" /></div>
        <p style="font-size:11px; color:var(--ink-soft); margin:-4px 0 14px;">Separate from the profit changes above — models "what if collection/payment timing were different" on its own, e.g. the impact of debtor days actually improving. Leave blank to keep using this period's own ${(conversion * 100).toFixed(0)}% rate.</p>
        ${row('cash-outlook-oneoff-income', 'One-off income ($) — e.g. asset sale, insurance payout', shared.oneOffIncome, 1000)}
        ${row('cash-outlook-oneoff-expense', 'One-off expense ($) — e.g. legal settlement, bad debt write-off', shared.oneOffExpense, 1000)}
        ${row('cash-outlook-super', 'Super contribution ($)', shared.super, 1000)}
        ${row('cash-outlook-equipment', 'Equipment purchase ($)', shared.equipment, 1000)}
        <p style="font-size:11px; color:var(--ink-soft); margin:-4px 0 14px;">All four added or deducted straight to projected cash at face value, after the conversion step above — real cash movements, not revenue or profit, so none of them run through the conversion rate. Super and equipment are also shared with Tax outlook below — but only for the CASH impact; how much of each actually reduces the tax bill (equipment especially — not everything qualifies for an immediate write-off) is set independently there, since that doesn't change what left the bank.</p>
