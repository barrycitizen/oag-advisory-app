// Consolidated nudge above the KPI grid — one short line rather than
// spelling out every missing field (that used to run to a whole paragraph
// for a client missing a dozen+ fields). Each category is collapsed by
// default now anyway, and opening one already tells you exactly what that
// specific card needs — this banner just needs to say "there's more here."
function renderUnlockCard(kpis, snapshot) {
  const missingSet = new Set();
  kpis.filter((k) => k.confidence === 'red').forEach((k) => missingFieldsFor(k, snapshot).forEach((f) => missingSet.add(f)));
  if (!missingSet.size) return '';
  const redCount = kpis.filter((k) => k.confidence === 'red').length;
  return `
    <div class="unlock-card">
      <p>${missingSet.size} field${missingSet.size === 1 ? '' : 's'} missing — unlocks ${redCount} more metric${redCount === 1 ? '' : 's'} once added.</p>
      <button class="action secondary" id="unlock-goto-input" type="button">Go to Input</button>
    </div>
  `;
}

function renderKpiHistoryTable(history) {
  if (!history?.periods?.length) return '';
  const groups = {};
  history.kpis.forEach((k) => { (groups[k.category || 'other'] = groups[k.category || 'other'] || []).push(k); });
  const order = [...KPI_CATEGORY_ORDER, ...Object.keys(groups).filter((c) => !KPI_CATEGORY_ORDER.includes(c))];
  const rows = order.filter((c) => groups[c]?.length).map((c) => `
    <tr class="history-group-row"><td colspan="${history.periods.length + 1}">${KPI_CATEGORY_META[c] || c}</td></tr>
    ${groups[c].map((k) => `
      <tr>
        <td>${k.name}</td>
        ${k.values.map((v) => `<td class="${v == null ? 'blank' : ''}">${v == null ? '—' : formatKpi(v, k.format)}</td>`).join('')}
      </tr>
    `).join('')}
  `).join('');
  return `
    <button type="button" class="collapsible-section-toggle" data-section-toggle="1">
      <span class="section-title">Metric history</span>
      <span class="chevron">▾</span>
    </button>
    <div class="card full history-table-wrap" style="display:none;">
      <table class="history-table">
        <thead><tr><th>Metric</th>${history.periods.map((p) => `<th>${formatShortDate(p)}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// Turns a collapsed category header from a blank label into something
// worth reading before you even click it — how many of its metrics are
// bad/ok/good, reusing the exact same badge styling (KPI_VERDICT_META) the
// individual cards already use, so a "2 needs attention" pill here means
// the same thing it means everywhere else in the app. Used by both the
// Key metrics group toggles and the Metric summary table's group rows.
function kpiCategoryVerdictCounts(categoryKpis) {
  const counts = { good: 0, ok: 0, bad: 0 };
  categoryKpis.forEach((k) => {
    const verdict = effectiveKpiVerdict(k);
    if (verdict && counts[verdict.key] !== undefined) counts[verdict.key]++;
  });
  return counts;
}
function kpiVerdictCountPillsHtml(counts) {
  return ['bad', 'ok', 'good']
    .filter((key) => counts[key])
    .map((key) => `<span class="confidence-badge ${KPI_VERDICT_META[key].cls}">${counts[key]} ${KPI_VERDICT_META[key].label}</span>`)
    .join('');
}

// Scannable "what needs attention" table sitting above the (collapsed-by-
// default) KPI category cards — triaging today meant opening every group one
// at a time just to see which metrics were bad. Pure presentation over the
// same entity-level kpis array the cards already render from; a row click
// jumps to and expands that metric's own card rather than duplicating its
// calculation detail here (see the click wiring in renderHealthWheelBlock,
// which scopes the lookup to the entity/"All" view specifically — division
// panels reuse some of the same kpi keys, e.g. gp_margin, so an unscoped
// lookup could resolve to the wrong panel's card, the same class of bug
// data-kpi-tip-text was built to avoid for the capture buttons).
// Same >=20% threshold runFlags' Liquidity risk flag already uses server-
// side (analyze-background.js) for "did cash fall meaningfully" — reused
// here so this row is never more or less alarmed than the Flags panel
// already is about the exact same movement.
function cashNetMovementVerdict(deltaCash, currentCash) {
  if (deltaCash == null || currentCash == null) return null;
  const priorCash = currentCash - deltaCash;
  if (priorCash > 0 && currentCash < priorCash * 0.8) return 'bad';
  return deltaCash >= 0 ? 'good' : 'ok';
}
function renderKpiSummaryTable(kpis, snapshot) {
  const groups = groupKpis(kpis).map((group) => ({
    ...group,
    rows: group.kpis.filter((k) => k.confidence !== 'red').map((k) => {
      const verdict = effectiveKpiVerdict(k);
      const verdictMeta = verdict ? KPI_VERDICT_META[verdict.key] : null;
      const targetItem = findKpiTarget(k.key);
      const isTaxRate = k.key === 'effective_tax_rate';
      return {
        key: k.key,
        name: isTaxRate ? 'Current tax position' : k.name,
        verdictKey: verdict?.key || 'none',
        verdictMeta,
        value: formatKpi(k.value, k.format),
        target: targetItem ? formatKpi(targetItem.target, k.format) : '—',
        tip: isRecDismissed(`kpitip:${k.key}`) ? '' : (k.improvement_tip || ''),
      };
    }),
  }));

  // Two synthetic rows for the "Metric summary" gaps that DO have a real,
  // fixed current-period value worth surfacing — "Where the cash went" and
  // "Tax vs cash on hand". Cash outlook / Tax outlook deliberately do NOT
  // get a row here: they're interactive what-if tools with no fixed value,
  // and a snapshot of "today's default projection" sitting in a table next
  // to real metrics like GP margin would read as a fact when it isn't one.
  const ocfKpi = kpis.find((k) => k.key === 'op_cash_conversion');
  const cur = ocfKpi ? cashInOut(ocfKpi.cash_reconciliation) : null;
  if (cur) {
    const cashGroup = groups.find((g) => g.key === 'cash');
    if (cashGroup) {
      const verdictKey = cashNetMovementVerdict(cur.delta_cash, snapshot?.cash) || 'none';
      const targetItem = findKpiTarget('cash_net_movement');
      cashGroup.rows.push({
        key: 'cash_net_movement',
        name: 'Where the cash went',
        verdictKey,
        verdictMeta: verdictKey !== 'none' ? KPI_VERDICT_META[verdictKey] : null,
        value: formatMoney(cur.delta_cash),
        target: targetItem ? formatMoney(targetItem.target) : '—',
        tip: cur.delta_cash >= 0
          ? 'Building cash with no clear use? Consider accelerating debt repayment, reinvesting in the business, or setting a cash reserve target.'
          : 'Cash is being drawn down — check whether debt repayments, capex, or drawings outpaced what the business generated this period.',
      });
    }
  }
  const taxAfford = computeTaxAffordability(snapshot);
  if (taxAfford) {
    const taxGroup = groups.find((g) => g.key === 'tax');
    if (taxGroup) {
      taxGroup.rows.push({
        key: 'tax_vs_cash',
        name: 'Tax vs cash on hand',
        verdictKey: taxAfford.colorClass || 'none',
        verdictMeta: taxAfford.colorClass ? KPI_VERDICT_META[taxAfford.colorClass] : null,
        value: taxAfford.coverage != null ? `${taxAfford.coverage.toFixed(1)}x coverage` : formatMoney(taxAfford.taxExpense),
        target: '—',
        tip: taxAfford.interp,
      });
    }
  }

  const filteredGroups = groups.filter((g) => g.rows.length);
  if (!filteredGroups.length) return '';

  const filterPills = ['all', 'bad', 'ok', 'good'].map((f) => {
    const tint = f === 'all' ? '' : ` pill-${KPI_VERDICT_META[f].cls}`;
    return `<button type="button" class="risk-filter-pill${f === 'all' ? ' active' : ''}${tint}" data-summary-filter="${f}">${f === 'all' ? 'All' : KPI_VERDICT_META[f].label}</button>`;
  }).join('');

  const bodyRows = filteredGroups.map((g) => `
    <tr class="history-group-row kpi-summary-group-toggle" data-summary-group-toggle="${g.key}">
      <td colspan="6">
        <span style="display:inline-flex; align-items:center; gap:8px;">
          <span class="chevron">▾</span>
          <span class="kpi-group-icon">${KPI_CATEGORY_ICON[g.key] || ''}</span>
          <span class="kpi-summary-group-label">${g.label}</span>
          ${kpiVerdictCountPillsHtml(kpiCategoryVerdictCounts(g.kpis))}
        </span>
      </td>
    </tr>
    ${g.rows.map((r) => `
      <tr data-summary-row="1" data-summary-group="${g.key}" data-summary-verdict="${r.verdictKey}" data-summary-kpi-key="${escAttr(r.key)}" title="Click to view this metric's card">
        <td><span class="kpi-summary-metric-icon">${KPI_ICON[r.key] || ''}</span>${r.name}</td>
        <td>${r.verdictMeta ? `<span class="confidence-badge ${r.verdictMeta.cls}">${r.verdictMeta.label}</span>` : '<span class="muted plain">—</span>'}</td>
        <td class="kpi-summary-value">${r.value}</td>
        <td>${r.target}</td>
        <td class="kpi-summary-tip">${r.tip || '<span class="muted plain">—</span>'}</td>
        <td class="kpi-summary-arrow">›</td>
      </tr>
    `).join('')}
  `).join('');

  return `
    <div class="card full kpi-summary-card">
      <p class="card-label">Metric summary</p>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px;">${filterPills}</div>
      <div class="history-table-wrap">
        <table class="kpi-summary-table">
          <thead><tr><th>Metric</th><th>Result</th><th>Value</th><th>Target</th><th>Recommendation</th><th></th></tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

// The category-grouped card grid (Profitability & Growth, Working Capital,
// etc.) — pulled out of renderHealthWheelBlock so the same rendering can run
// twice: once for the full entity view ("All"), once per division with a
// filtered kpis array. groupKpis already drops any category with zero
// items, so a division's 6-key list naturally produces only the categories
// that apply (Profitability & Growth, Working Capital) with no empty
// section headers — no extra filtering needed here for that. editable=false
// (division panels) suppresses the cash/tax special-case cards too, but
// that's already automatic: those only ever trigger off a 'cash'/'tax'
// group, which never exists in a division's filtered kpi list.
// Each category collapsed by default — the score/flags above already give
// the at-a-glance read; this is the detail you opt into per category
// instead of always scrolling past all five to get anywhere.
//
// categoryKeys optionally restricts which of groupKpis' categories render —
// used to split "Key metrics" into two physically separate columns (see
// renderHealthWheelBlock): Profitability/Working Capital/Balance Sheet is a
// backward-looking performance read, while Cash and Tax each bundle their
// KPI card together with a forward-looking scenario tool (Cash Outlook, Tax
// Outlook) — enough of a different conversation to earn their own column,
// not just another category in the same scrolling list.
function renderKpiGroupsHtml(kpis, snapshot, editable, categoryKeys) {
  const groups = categoryKeys ? groupKpis(kpis).filter((g) => categoryKeys.includes(g.key)) : groupKpis(kpis);
  return groups.map((group, i) => {
    const isCash = group.key === 'cash';
    const isTax = group.key === 'tax';
    const cashOutlookCard = isCash ? renderCashOutlookCard(snapshot, kpis) : '';
    const taxCard = isTax ? renderTaxAffordabilityCard(snapshot) : '';
    const taxOutlookCard = isTax ? renderTaxOutlookCard(snapshot, currentCtx, kpis) : '';
    const itemCount = group.kpis.length + (isCash ? 1 : 0) + (cashOutlookCard ? 1 : 0) + (taxCard ? 1 : 0) + (taxOutlookCard ? 1 : 0);
    const gridClass = [isCash ? 'kpi-grid-cash' : '', itemCount === 1 ? 'kpi-grid-solo' : ''].filter(Boolean).join(' ');
    return `
      <button type="button" class="kpi-group-toggle${i === 0 ? ' kpi-group-toggle-first' : ''}" data-kpi-group-toggle="1">
        <span class="kpi-group-icon">${KPI_CATEGORY_ICON[group.key] || ''}</span>
        <span class="kpi-group-label">${group.label}</span>
        ${kpiVerdictCountPillsHtml(kpiCategoryVerdictCounts(group.kpis))}
        <span class="chevron">▾</span>
      </button>
      <div class="kpi-grid ${gridClass}" style="display:none;">
        ${group.kpis.map((k) => renderKpiCard(k, snapshot, editable)).join('')}
        ${isCash ? renderCashFlowGlanceCard(kpis.find((k) => k.key === 'op_cash_conversion')) : ''}
        ${cashOutlookCard}
        ${taxCard}
        ${taxOutlookCard}
      </div>
    `;
  }).join('');
}

// The only ratios that are mathematically meaningful per division — every
// other kpi_library row needs an entity-only field (equity, current_assets,
// tax_expense, etc.) that a division entry never has, so its computed value
// already comes back null for those; this just keeps a division's tab from
// showing a wall of unavailable cards for KPIs that were never going to apply.
const DIVISION_KPI_KEYS = ['revenue_growth', 'gp_margin', 'wages_pct', 'debtor_days', 'creditor_days', 'inventory_days'];

// "All" (the full entity view, exactly what rendered here before divisions
// existed) plus one pill per division, all pre-rendered and toggled via
// display — switching is instant. Division panels are NOT editable
// (renderKpiGroupsHtml's editable=false) — see renderKpiTargetBlock's
// comment for why reusing the same kpi keys across multiple simultaneously-
// mounted panels made that a real constraint, not just a style choice.
function renderKpiViewTabs(kpis, snapshot, divisionData, categoryKeys) {
  const divisions = divisionData.divisions;
  const divisionBreakdown = snapshot?.division_breakdown || [];
  return `
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;">
      <button type="button" class="risk-filter-pill active" data-kpiview-tab="__all__">All</button>
      ${divisions.map((d) => `<button type="button" class="risk-filter-pill" data-kpiview-tab="${d.id}">${d.name}</button>`).join('')}
    </div>
    <div data-kpiview-panel="__all__">
      ${renderUnlockCard(kpis, snapshot)}
      ${renderKpiGroupsHtml(kpis, snapshot, true, categoryKeys)}
    </div>
    ${divisions.map((d) => {
      const entry = divisionData.byDivision[d.id];
      const snap = divisionBreakdown.find((b) => b.division_id === d.id) || {};
      const divKpis = (entry?.kpis || [])
        .filter((k) => DIVISION_KPI_KEYS.includes(k.key))
        .map((k) => {
          const value = k.values.length ? k.values[k.values.length - 1] : null;
          const priorValue = k.values.length > 1 ? k.values[k.values.length - 2] : null;
          return { ...k, value, priorValue, confidence: value == null ? 'red' : 'green' };
        });
      return `<div data-kpiview-panel="${d.id}" style="display:none;">${renderKpiGroupsHtml(divKpis, snap, false, categoryKeys)}</div>`;
    }).join('')}
  `;
}

// ---- Overview (global — every pillar at a glance, the client's landing page) ----
// The wheel + pillar table used to live bolted onto Financial Performance,
// showing all 8 pillars there even though only 3 (Profitability, Cash flow,
// Tax) are actually driven by that page's own data — Risk, Growth, Owner
// wealth, Owner goals get scored on their own separate tabs. This is the one
// place all 8 genuinely belong shown together; Financial Performance now
// shows a Financial-only score instead (see renderHealthWheelBlock).
async function renderOverviewTab(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot and run analysis first — this fills in once that's done.</p></div>`;
    return;
  }
  const [overview, diagnosisData, riskData, ranking] = await Promise.all([
    callRead('get_overview', currentClientId, currentPeriodEnd),
    callRead('get_diagnosis', currentClientId, currentPeriodEnd),
    callRead('get_risk_items', currentClientId, currentPeriodEnd),
    getCandidateRanking(),
  ]);
  if (myToken !== renderToken) return;

  const hs = overview?.healthScore || null;
  const priorHs = overview?.priorHealthScore || null;
  const pillarMap = {};
  (overview?.pillarScores || []).forEach((p) => { pillarMap[p.pillar] = p.score; });
  const priorPillarMap = {};
  (overview?.priorPillarScores || []).forEach((p) => { priorPillarMap[p.pillar] = p.score; });
  const pillars = Object.keys(pillarMap).map((key) => ({
    key, score: pillarMap[key],
    name: PILLAR_META[key]?.name || key, color: PILLAR_META[key]?.color || '#999',
  }));

  // "What changed" — the 3 pillars that moved most (either direction) since
  // last period. Read-only, same as everything else on this screen — see
  // meeting-intelligence-build-spec.md §1.
  const changedPillars = pillars
    .filter((p) => priorPillarMap[p.key] !== undefined && p.score != null)
    .map((p) => ({ ...p, delta: Math.abs(p.score - priorPillarMap[p.key]) }))
    .sort((a, b) => b.delta - a.delta)
    .slice(0, 3);

  const rollup = computeRiskRollup(riskData?.financial || [], riskData?.business || [], riskData?.industry || [], riskData?.owner_wealth || []);
  const topRisk = [...rollup.buckets.High, ...rollup.buckets.Medium][0];
  const digestRows = [
    ['Financial Performance', diagnosisData?.briefSummary?.financial],
    ['Growth', diagnosisData?.briefSummary?.growth],
    ['Risk', topRisk ? `Most worth raising: ${topRisk.risk_name}.` : (rollup.buckets.High.length + rollup.buckets.Medium.length === 0 ? 'Nothing active on the risk register.' : null)],
    ['Owner & Succession', diagnosisData?.briefSummary?.owner],
  ].filter(([, text]) => text);

  content.innerHTML = `
    <div class="hero-row">
      <div class="wheel-card">
        <p class="wheel-label">Business health</p>
        ${hs ? `
          <svg id="ov-wheel" width="240" height="240" viewBox="0 0 240 240"></svg>
          <div class="wheel-score"><b>${hs.score}</b> / 100</div>
          ${priorHs ? `<p class="trend-line">${trendArrow(hs.score, priorHs.score)}</p>` : ''}
          <div class="pillar-legend" id="ov-legend"></div>
        ` : '<p class="muted plain" style="text-align:center; margin-top:24px;">No analysis run yet for this period.</p>'}
      </div>
    </div>
    ${diagnosisData?.diagnosis ? `
      <div class="card">
        <p class="muted">AI diagnosis</p>
        <p class="muted plain" style="margin:0; white-space:pre-wrap;">${diagnosisData.diagnosis}</p>
      </div>
    ` : ''}
    ${changedPillars.length ? `
      <div class="card">
        <p class="muted">What changed</p>
        ${changedPillars.map((p) => `<div class="flag-row-wrap"><div class="flag-row"><span style="flex:1;">${p.name}</span><span>${trendArrow(p.score, priorPillarMap[p.key])}</span></div></div>`).join('')}
      </div>
    ` : ''}
    ${ranking.length ? `
      <div class="card">
        <p class="muted">What matters</p>
        ${[...new Set(ranking.map((c) => PILLAR_META[c.pillar]?.name || c.pillar))].map((name) => `<div class="flag-row-wrap"><div class="flag-row"><span class="flag-dot rust"></span>${escAttr(name)}</div></div>`).join('')}
      </div>
      <div class="card">
        <p class="muted">Today's priorities</p>
        <p class="muted plain" style="margin:0 0 10px;">Ranked by impact × urgency × ease — see the full walkthrough on This period's priorities.</p>
        ${ranking.map((c, i) => `<div class="flag-row-wrap"><div class="flag-row"><span style="font-family:var(--font-mono); color:var(--brass); font-weight:600;">${i + 1}</span>${escAttr(c.message)}</div></div>`).join('')}
      </div>
    ` : ''}
    ${digestRows.length ? `
      <div class="card">
        <p class="muted">The fuller picture</p>
        ${digestRows.map(([label, text]) => `<div style="padding:8px 0; border-top:1px solid var(--line);"><p style="font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--brass); margin:0 0 3px;">${label}</p><p class="muted plain" style="margin:0;">${escAttr(text)}</p></div>`).join('')}
      </div>
    ` : ''}
    ${pillars.length ? `
      <p class="section-title">Pillar scores</p>
      <div class="card full" style="padding: 20px 24px;">
        <table style="width:100%; border-collapse: collapse; font-size: 13px;">
          <tbody>
            ${pillars.map((p) => `<tr><td style="padding:8px 0; border-top:1px solid var(--line);"><span style="display:inline-block; width:8px; height:8px; border-radius:2px; background:${p.color}; margin-right:8px;"></span>${p.name}</td><td style="padding:8px 0; border-top:1px solid var(--line); text-align:right;"><span style="font-family: var(--font-mono);">${p.score == null ? '—' : p.score.toFixed(1) + '/10'}</span>${p.score != null ? ` ${scoreBadgeHtml(p.score, false)}` : ''}${priorPillarMap[p.key] !== undefined ? `<br>${trendArrow(p.score, priorPillarMap[p.key])}` : ''}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    ` : ''}
  `;

  if (hs) {
    drawWheel(document.getElementById('ov-wheel'), pillars, hs.score);
    const legend = document.getElementById('ov-legend');
    pillars.forEach((p) => {
      const item = document.createElement('div');
      item.className = 'pillar-legend-item';
      item.innerHTML = `<span class="pillar-swatch" style="background:${p.color}"></span><span class="pillar-legend-name">${p.name}</span>${p.score != null ? scoreBadgeHtml(p.score, false) : ''}<span class="pillar-legend-score">${p.score == null ? '—' : p.score.toFixed(1)}</span>`;
      legend.appendChild(item);
    });
  }
}

// FINANCIAL_PILLAR_KEYS mirrors PILLAR_TO_DOMAIN's 'financial' entries —
// the only 3 pillars actually driven by this page's own data (Profitability,
// Cash flow, Tax). Everything else (Risk, Growth, Owner wealth, Owner goals)
// gets scored on its own separate tab, so the wheel here reads a plain
// average of just these 3 rather than reusing the whole-business health
// score — same 0-10-per-pillar-averaged-to-100 formula analyze.js already
// uses for the overall score, just over a smaller set. The full 8-pillar
// wheel lives on the Overview tab (see renderOverviewTab).
const FINANCIAL_PILLAR_KEYS = ['profitability', 'cash_flow', 'tax'];
function computeFinancialScore(pillarScores) {
  const scores = (pillarScores || []).filter((p) => FINANCIAL_PILLAR_KEYS.includes(p.pillar));
  if (!scores.length) return null;
  return Math.round((scores.reduce((sum, s) => sum + (s.score || 0), 0) / (10 * scores.length)) * 100);
}

// Key metrics splits into two physically separate columns rather than one
// scrolling list: Profitability/Working Capital/Balance Sheet (+ Metric
// history + Financial snapshot below them) on the left is the backward-
// looking performance read, Cash & Tax on the right is the forward-looking
// planning conversation (each bundles its KPI card with a scenario tool —
// Cash Outlook, Tax Outlook). Cash & Tax never varies by division tab (see
// DIVISION_KPI_KEYS — a division's filtered kpi list never reaches these
// categories), so the right column always renders off the full entity kpis
// regardless of which division tab the left column has selected.
const LEFT_KPI_CATEGORIES = ['profitability', 'working_capital', 'balance_sheet'];
const RIGHT_KPI_CATEGORIES = ['cash', 'tax'];

function renderHealthWheelBlock(container, overview, kpis, snapshot, history, divisionData) {
  taxRatesPanelRefreshers = [];
  scenarioRecalcs = [];
  scenarioUnitSyncs = [];
  const pillarMap = {};
  (overview?.pillarScores || []).forEach((p) => { pillarMap[p.pillar] = p.score; });
  const priorPillarMap = {};
  (overview?.priorPillarScores || []).forEach((p) => { priorPillarMap[p.pillar] = p.score; });
  const financialPillars = FINANCIAL_PILLAR_KEYS
    .filter((key) => pillarMap[key] !== undefined)
    .map((key) => ({ key, score: pillarMap[key], name: PILLAR_META[key]?.name || key, color: PILLAR_META[key]?.color || '#999' }));
  const financialScore = computeFinancialScore(overview?.pillarScores);
  const priorFinancialScore = computeFinancialScore(overview?.priorPillarScores);
  const flags = overview?.flags || [];
  const flagId = (f) => `flag:${f.message}`;
  const recState = getRecommendationState();
  const visibleFlags = flags.filter((f) => !recState.dismissed[flagId(f)]);
  const dismissedFlags = flags.filter((f) => recState.dismissed[flagId(f)]);

  const suggestPanelHtml = (recId) => {
    const saved = recState.suggestedTargets[recId];
    if (!saved) return '';
    return `
      <p class="suggest-caveat">Suggested, not benchmarked.</p>
      <div class="suggest-item">
        <p>${saved}</p>
        <button class="mini-link" data-suggest-add-goal="${escAttr(recId)}" type="button">→ turn into goal</button>
        <button class="mini-link" data-suggest-add-action="${escAttr(recId)}" type="button">→ turn into action</button>
      </div>
    `;
  };

  container.innerHTML = `
    <div class="hero-row">
      <div class="wheel-card">
        <p class="wheel-label">Financial score</p>
        ${financialScore != null ? `
          <svg id="ov-wheel" width="240" height="240" viewBox="0 0 240 240"></svg>
          <div class="wheel-score"><b>${financialScore}</b> / 100</div>
          <p class="trend-line" style="margin:6px 0;">${scoreBadgeHtml(financialScore, true, true)}</p>
          ${priorFinancialScore != null ? `<p class="trend-line">${trendArrow(financialScore, priorFinancialScore)}</p>` : ''}
          <div class="pillar-legend" id="ov-legend"></div>
        ` : '<p class="muted plain" style="text-align:center; margin-top:24px;">No analysis run yet for this period.</p>'}
      </div>
      <div class="side-cards">
        <div class="card full">
          <p class="card-label">Flags this period</p>
          ${visibleFlags.length
            ? visibleFlags.map((f) => `
              <div class="flag-row-wrap">
                <div class="flag-row"><span class="flag-dot ${f.severity === 'danger' || f.severity === 'warning' ? 'rust' : 'sage'}"></span> ${f.message}
                  <button class="mini-link" data-suggest-target="${escAttr(flagId(f))}" type="button">✨ suggest target</button>
                  <button class="mini-link" data-dismiss-flag="${escAttr(flagId(f))}" type="button">✕ dismiss</button>
                </div>
                <div class="suggest-panel" style="${recState.suggestedTargets[flagId(f)] ? '' : 'display:none;'}">${suggestPanelHtml(flagId(f))}</div>
              </div>
            `).join('')
            : '<p class="muted plain" style="margin:0;">No flags this period.</p>'}
          ${dismissedFlags.length ? `
            <button type="button" class="mini-link" id="flags-show-dismissed" style="margin-top:6px;">${dismissedFlags.length} dismissed — show</button>
            <div id="flags-dismissed-list" style="display:none; margin-top:6px;">
              ${dismissedFlags.map((f) => `
                <div class="flag-row-wrap">
                  <div class="flag-row"><span class="flag-dot"></span> <span class="muted plain">${f.message}</span>
                    <button class="mini-link" data-restore-flag="${escAttr(flagId(f))}" type="button">↺ restore</button>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
        ${kpis && kpis.length ? renderKpiSummaryTable(kpis, snapshot) : ''}
      </div>
    </div>
    ${kpis && kpis.length ? `
      <div class="card full">
        <p class="section-title">Key metrics</p>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;">
          <button type="button" class="risk-filter-pill active" data-metrics-tab="performance">Performance</button>
          <button type="button" class="risk-filter-pill" data-metrics-tab="cashtax">Cash &amp; Tax</button>
        </div>
        <div data-metrics-panel="performance">
          ${divisionData?.divisions?.length ? renderKpiViewTabs(kpis, snapshot, divisionData, LEFT_KPI_CATEGORIES) : `
            ${renderUnlockCard(kpis, snapshot)}
            ${renderKpiGroupsHtml(kpis, snapshot, true, LEFT_KPI_CATEGORIES)}
          `}
        </div>
        <div data-metrics-panel="cashtax" style="display:none;">
          ${renderKpiGroupsHtml(kpis, snapshot, true, RIGHT_KPI_CATEGORIES)}
        </div>
      </div>
      ${renderKpiHistoryTable(history)}
      ${renderFinancialSnapshotCard(snapshot)}
    ` : ''}
  `;

  container.querySelectorAll('[data-kpiview-tab]').forEach((btn) => {
    btn.onclick = () => {
      container.querySelectorAll('[data-kpiview-tab]').forEach((b) => b.classList.toggle('active', b === btn));
      container.querySelectorAll('[data-kpiview-panel]').forEach((panel) => {
        panel.style.display = panel.dataset.kpiviewPanel === btn.dataset.kpiviewTab ? '' : 'none';
      });
    };
  });

  // Performance / Cash & Tax — a tab switch, not a side-by-side column:
  // Cash Outlook and Tax Outlook are wide, multi-field scenario tools that
  // need the full page width to lay out without forcing extra scrolling —
  // a column always squeezes SOMETHING (tried both narrow-right and narrow-
  // left splits; whichever side loses the width stacks its cards). Full
  // width per active tab is the only split that keeps every group's cards
  // laid out exactly as they were before this section had two areas at all.
  container.querySelectorAll('[data-metrics-tab]').forEach((btn) => {
    btn.onclick = () => {
      container.querySelectorAll('[data-metrics-tab]').forEach((b) => b.classList.toggle('active', b === btn));
      container.querySelectorAll('[data-metrics-panel]').forEach((panel) => {
        panel.style.display = panel.dataset.metricsPanel === btn.dataset.metricsTab ? '' : 'none';
      });
    };
  });

  // Metric summary table: verdict filter and per-category collapse are two
  // independent reasons a row can be hidden, tracked as separate data flags
  // per row (rather than both fighting over row.style.display directly) so
  // neither one clobbers the other's decision when both are in play at once
  // — e.g. collapsing "Working Capital" while the "Needs attention" filter
  // is active shouldn't un-hide a filtered-out row the moment it re-expands.
  const applySummaryVisibility = () => {
    container.querySelectorAll('[data-summary-row]').forEach((row) => {
      row.style.display = (row.dataset.filterHidden === '1' || row.dataset.groupHidden === '1') ? 'none' : '';
    });
    container.querySelectorAll('[data-summary-group-toggle]').forEach((header) => {
      const key = header.dataset.summaryGroupToggle;
      const anyMatchesFilter = [...container.querySelectorAll(`[data-summary-row][data-summary-group="${key}"]`)]
        .some((r) => r.dataset.filterHidden !== '1');
      header.style.display = anyMatchesFilter ? '' : 'none';
    });
  };
  container.querySelectorAll('[data-summary-filter]').forEach((pill) => {
    pill.onclick = () => {
      container.querySelectorAll('[data-summary-filter]').forEach((p) => p.classList.toggle('active', p === pill));
      const filter = pill.dataset.summaryFilter;
      container.querySelectorAll('[data-summary-row]').forEach((row) => {
        row.dataset.filterHidden = (filter !== 'all' && row.dataset.summaryVerdict !== filter) ? '1' : '0';
      });
      applySummaryVisibility();
    };
  });

  // Each category header ("Profitability & Growth" etc.) collapses its own
  // rows independently, same drop-down affordance as the KPI cards below.
  container.querySelectorAll('[data-summary-group-toggle]').forEach((header) => {
    header.onclick = () => {
      const key = header.dataset.summaryGroupToggle;
      const willCollapse = header.dataset.collapsed !== '1';
      header.dataset.collapsed = willCollapse ? '1' : '0';
      header.querySelector('.chevron').textContent = willCollapse ? '▸' : '▾';
      container.querySelectorAll(`[data-summary-row][data-summary-group="${key}"]`).forEach((row) => {
        row.dataset.groupHidden = willCollapse ? '1' : '0';
      });
      applySummaryVisibility();
    };
  });

  // Row click jumps to and expands that metric's own card, scoped to the
  // entity/"All" view — a division panel can reuse the same kpi key (see
  // DIVISION_KPI_KEYS), so an unscoped lookup could land on the wrong
  // panel's card. Switches to the "All" division tab first if a division
  // tab is currently active, and to the Performance/Cash & Tax metrics tab
  // that actually holds this kpi's category — a Cash or Tax row otherwise
  // expands the right card inside a panel that's still display:none because
  // "Performance" is the one showing.
  container.querySelectorAll('[data-summary-row]').forEach((row) => {
    row.onclick = () => {
      const key = row.dataset.summaryKpiKey;
      const kpiMeta = kpis.find((k) => k.key === key);
      // cash_net_movement/tax_vs_cash aren't in kpis (see renderKpiSummaryTable's
      // synthetic rows) — both live in the Cash & Tax column same as their
      // category-mates, so they're just hardcoded here rather than needing
      // a real kpi_library entry.
      const category = kpiMeta?.category || (['cash_net_movement', 'tax_vs_cash'].includes(key) ? 'cash' : null);
      const metricsTabKey = category && RIGHT_KPI_CATEGORIES.includes(category) ? 'cashtax' : 'performance';
      const metricsTabBtn = container.querySelector(`[data-metrics-tab="${metricsTabKey}"]`);
      if (metricsTabBtn && !metricsTabBtn.classList.contains('active')) metricsTabBtn.click();
      const allTabBtn = container.querySelector('[data-kpiview-tab="__all__"]');
      if (allTabBtn && !allTabBtn.classList.contains('active')) allTabBtn.click();
      const card = container.querySelector(`[data-kpiview-panel="__all__"] [data-kpi-card-key="${key}"]`)
        || container.querySelector(`[data-kpi-card-key="${key}"]`);
      if (!card) return;
      const grid = card.closest('.kpi-grid');
      if (grid && grid.style.display === 'none') {
        const toggle = grid.previousElementSibling;
        if (toggle?.classList.contains('kpi-group-toggle')) toggle.click();
      }
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('kpi-card-flash');
      setTimeout(() => card.classList.remove('kpi-card-flash'), 1600);
    };
  });

  const unlockBtn = document.getElementById('unlock-goto-input');
  if (unlockBtn) unlockBtn.onclick = () => {
    currentWorkflow = 'input';
    renderWorkflowTabsActive();
    renderMain();
  };

  const snapshotEditBtn = document.getElementById('snapshot-edit-btn');
  if (snapshotEditBtn) snapshotEditBtn.onclick = () => {
    currentPeriodEnd = snapshotEditBtn.dataset.editPeriod;
    renderPeriodPills();
    currentWorkflow = 'input';
    currentEntrySubtab = 'manual';
    renderWorkflowTabsActive();
    renderMain();
  };

  const cashConvJump = document.getElementById('cash-conv-jump');
  if (cashConvJump) {
    cashConvJump.onclick = () => {
      const toggle = document.getElementById('recon-toggle');
      if (!toggle) return; // Cash in/out card isn't showing this period (e.g. no prior period on file)
      const panel = document.getElementById('recon-panel');
      if (panel && panel.style.display === 'none') toggle.click();
      toggle.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  }

  wireCashOutlookCard(snapshot, kpis);

  // "Show the calculation" is now its own simple toggle (raw arithmetic
  // only) — the estimate used to be bundled behind the same click, but now
  // lives as its own always-visible tile (see renderTaxPositionEstimateTile)
  // instead of something you had to discover by clicking.
  const taxPositionToggle = document.getElementById('tax-position-toggle');
  if (taxPositionToggle) {
    const taxPositionDetail = document.getElementById('tax-position-detail');
    taxPositionToggle.onclick = () => {
      taxPositionDetail.style.display = taxPositionDetail.style.display === 'none' ? 'block' : 'none';
    };
  }

  const taxPositionEstimateValueEl = document.getElementById('tax-position-estimate-value');
  if (taxPositionEstimateValueEl && snapshot?.net_profit != null) {
    const entityType = currentCtx?.entity_type;
    const actualTaxExpense = snapshot.tax_expense || 0;
    // Recomputed every time the estimate itself recomputes (initial wire,
    // any share/income input change, any rate change here) — this card's
    // OWN taxPositionRatesState, independent of whatever Tax outlook's
    // editor is doing (see that pair's own comment).
    const updateTaxPositionRatesStatus = () => {
      const ratesStatusEl = document.getElementById('tax-position-rates-status');
      if (!ratesStatusEl) return;
      // See taxRatesStatusLabel's own comment (also backs Tax outlook's own
      // rates toggle) — flags whenever the period being estimated isn't the
      // FY the coded defaults are actually calibrated for, rather than
      // letting an adviser assume "default" means "correct for this period"
      // when it isn't FY2026-27 (or whatever DEFAULT_TAX_RATES_FY is
      // currently set to) at all.
      ratesStatusEl.innerHTML = taxRatesStatusLabel(auFinancialYearLabel(currentPeriodEnd), taxPositionRatesState);
    };
    const actualRateKpi = kpis?.find((k) => k.key === 'effective_tax_rate');
    const actualRate = actualRateKpi?.value ?? null;
    const recalcTaxPositionEstimate = () => {
      updateTaxPositionRatesStatus();
      const valueEl = document.getElementById('tax-position-estimate-value');
      const diffEl = document.getElementById('tax-position-estimate-diff');
      const rateEl = document.getElementById('tax-position-estimate-rate');
      const rateDiffEl = document.getElementById('tax-position-estimate-rate-diff');
      const basisEl = document.getElementById('tax-position-estimate-profit-basis');
      const hintEl = document.getElementById('tax-position-estimate-hint');
      if (!valueEl || !entityType) return;
      // Mirrors renderTaxPositionEstimateTiles' own hint logic — kept in
      // sync here because the toggle click that activates the estimate
      // doesn't re-render that markup, just this element's text.
      if (hintEl) {
        const isCompanyHint = entityType === 'Company';
        const isSoloHint = entityType === 'Sole trader';
        const hasInputNow = (isCompanyHint || isSoloHint) ? !!taxPositionCompareState.otherIncome[0]
          : (taxPositionCompareState.shares.some((v) => v) || !!taxPositionCompareState.profitAdjustment);
        const whoHint = entityType === 'Trust' ? 'beneficiary' : 'partner';
        hintEl.textContent = !taxPositionCompareState.activated ? '▾ click to estimate'
          : hasInputNow ? '' : isCompanyHint ? '▾ add investment income or deductions' : isSoloHint ? '▾ adjust for non-business income' : `▾ enter ${whoHint} shares`;
      }
      // Read whichever inputs actually exist for this entity type — Sole
      // trader only has an other-income field (no share inputs at all,
      // fixed at 100%), so gating this behind shareInputs.length (as this
      // used to) silently skipped reading it for that case.
      const shareInputs = [...document.querySelectorAll('.tax-position-compare-share')];
      const incomeInputs = [...document.querySelectorAll('.tax-position-compare-other-income')];
      const profitAdjInput = document.querySelector('.tax-position-compare-profit-adj');
      if (incomeInputs.length) {
        taxPositionCompareState = {
          ...taxPositionCompareState,
          shares: shareInputs.length ? shareInputs.map((el) => el.value) : taxPositionCompareState.shares,
          otherIncome: incomeInputs.map((el) => el.value),
          profitAdjustment: profitAdjInput ? profitAdjInput.value : taxPositionCompareState.profitAdjustment,
        };
      }
      // Nothing shows until the tile's been opened once (see the toggle's
      // onclick) — Company/Sole trader can otherwise compute a confident-
      // looking number off profit alone with zero adviser interaction, which
      // read as more authoritative than "here's profit × the default rate."
      if (!taxPositionCompareState.activated) {
        valueEl.textContent = '—'; if (diffEl) diffEl.textContent = '';
        if (rateEl) rateEl.textContent = '—'; if (rateDiffEl) rateDiffEl.textContent = '';
        if (basisEl) basisEl.textContent = '';
        return;
      }
      // Adjusts the POOL being split (e.g. income taxed differently to
      // ordinary business profit, or something excluded from taxable
      // income) — separate from each person's own "other income", which
      // adjusts THEIR share after the split. The rate tile below still
      // divides by the real, unadjusted net profit either way, so it always
      // reads as "% of actual business profit", not "% of the adjusted pool".
      const profitAdjustment = Number(taxPositionCompareState.profitAdjustment) || 0;
      const { tax } = estimateTaxForEntity(entityType, snapshot.net_profit + profitAdjustment, taxPositionCompareState.shares, taxPositionCompareState.otherIncome, undefined, undefined, taxPositionRatesState);
      if (basisEl) {
        // Company/Sole trader have no per-partner shares, so their own
        // income-adjustment field IS the profit basis here (Company adds it
        // straight to taxable profit; Sole trader stacks it as other income)
        // — same figure shown either way, just what actually feeds the calc.
        const basisAdj = (entityType === 'Company' || entityType === 'Sole trader')
          ? (Number(taxPositionCompareState.otherIncome[0]) || 0) : profitAdjustment;
        basisEl.textContent = basisAdj
          ? `On ${formatMoney(snapshot.net_profit)} profit → ${formatMoney(snapshot.net_profit + basisAdj)}`
          : `On ${formatMoney(snapshot.net_profit)} profit`;
      }
      if (tax == null) {
        valueEl.textContent = '—'; if (diffEl) diffEl.textContent = '';
        if (rateEl) rateEl.textContent = '—'; if (rateDiffEl) rateDiffEl.textContent = '';
        return;
      }
      valueEl.textContent = formatMoney(tax);
      const diff = tax - actualTaxExpense;
      if (diffEl) diffEl.textContent = Math.abs(diff) > 0.5 ? `${diff >= 0 ? '+' : '−'}${formatMoney(Math.abs(diff))} vs actual` : 'matches actual';
      if (rateEl) {
        const estRate = snapshot.net_profit > 0 ? tax / snapshot.net_profit : 0;
        rateEl.textContent = `${(estRate * 100).toFixed(1)}%`;
        if (rateDiffEl) {
          if (actualRate == null) { rateDiffEl.textContent = ''; }
          else {
            const rateDiff = (estRate - actualRate) * 100;
            rateDiffEl.textContent = Math.abs(rateDiff) > 0.05 ? `${rateDiff >= 0 ? '+' : '−'}${Math.abs(rateDiff).toFixed(1)}% vs actual` : 'matches actual';
          }
        }
      }
    };
    recalcTaxPositionEstimate();
    const estimateToggle = document.getElementById('tax-position-estimate-toggle');
    if (estimateToggle) {
      const estimateInputs = document.getElementById('tax-position-estimate-inputs');
      // A genuine on/off toggle, not a one-way switch — closing it puts the
      // estimate back to nil (not just hiding the input fields underneath),
      // for whenever this structure's estimate isn't actually needed this
      // conversation. Reopening it shows the estimate again using whatever
      // was last typed in — nothing entered gets cleared, just hidden.
      estimateToggle.onclick = () => {
        const willOpen = estimateInputs.style.display === 'none';
        estimateInputs.style.display = willOpen ? 'block' : 'none';
        taxPositionCompareState = { ...taxPositionCompareState, activated: willOpen };
        recalcTaxPositionEstimate();
      };
    }
    document.querySelectorAll('.tax-position-compare-share, .tax-position-compare-other-income, .tax-position-compare-profit-adj').forEach((el) => { el.oninput = recalcTaxPositionEstimate; });
    document.querySelectorAll('.tax-position-compare-other-income, .tax-position-compare-profit-adj').forEach((el) => wireMoneyInputPreview(el));

    const saveSplitBtn = document.getElementById('tax-position-save-split-btn');
    if (saveSplitBtn) {
      saveSplitBtn.onclick = async () => {
        const saveStatusEl = document.getElementById('tax-position-save-split-status');
        // Blank everything and click Save to clear a previously saved split
        // back to nothing — mirrors the live toggle's own "goes back to
        // nil" behaviour, just for the persisted copy the score/AI read.
        const hasAnything = taxPositionCompareState.shares.some((v) => v) || taxPositionCompareState.otherIncome.some((v) => v) || !!taxPositionCompareState.profitAdjustment;
        const payload = hasAnything ? {
          shares: taxPositionCompareState.shares, otherIncome: taxPositionCompareState.otherIncome,
          profitAdjustment: taxPositionCompareState.profitAdjustment,
        } : null;
        // There's no history — overwriting or clearing an existing saved
        // split loses it for good, so confirm first whenever this save
        // would actually change what's on file. Comparing to the snapshot
        // (not just re-checking the DB) is enough since this render's
        // snapshot.tax_structure_split is kept in sync with every save
        // below — skips the prompt on a no-op re-save of the same values.
        if (snapshot.tax_structure_split && JSON.stringify(snapshot.tax_structure_split) !== JSON.stringify(payload)) {
          const proceed = confirm(payload
            ? 'This replaces the currently saved split for this period — the old one can\'t be recovered. Continue?'
            : 'This clears the currently saved split for this period — it can\'t be recovered. Continue?');
          if (!proceed) return;
        }
        saveSplitBtn.disabled = true;
        if (saveStatusEl) saveStatusEl.textContent = 'Saving…';
        try {
          const res = await fetch('/.netlify/functions/manual-entry', {
            method: 'POST',
            body: JSON.stringify({ type: 'save_tax_structure_split', client_id: currentClientId, period_end: snapshot.period_end, tax_structure_split: payload }),
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          snapshot.tax_structure_split = payload; // keeps this render's in-memory snapshot in sync, so a re-render before the next fetch doesn't reseed from the stale pre-save value
          if (saveStatusEl) saveStatusEl.textContent = payload ? 'Saved — the Tax pillar score and AI diagnosis will use this from the next analysis run.' : 'Cleared.';
        } catch (err) {
          if (saveStatusEl) saveStatusEl.textContent = 'Error: ' + err.message;
        } finally {
          saveSplitBtn.disabled = false;
        }
      };
    }

    // Same shared wiring Tax outlook's own rate editor uses (see
    // wireTaxRatesPanel) — a different id prefix AND its own independent
    // taxPositionRatesState this time, not Tax outlook's — see that pair's
    // own comment for why they no longer stay in sync with each other.
    wireTaxRatesPanel('tax-position', 'tax-position-tr-', 'tax-position-rates-toggle-label', recalcTaxPositionEstimate, () => taxPositionRatesState, (v) => { taxPositionRatesState = v; });
  }

  // One delegated listener covers every KPI card's confidence badge — there
  // can be a dozen+ on screen at once (more once division tabs are in play),
  // so wiring each individually would mean either duplicate ids (the exact
  // bug already hit once with target-editor ids) or a lot of repetition.
  // closest()/querySelector relative to the clicked badge sidesteps needing
  // an id at all.
  container.querySelectorAll('[data-kpi-calc]').forEach((badge) => {
    badge.onclick = () => {
      const panel = badge.closest('.kpi-card')?.querySelector('.kpi-calc-breakdown');
      if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    };
  });

  // "What does this metric measure" — separate from the calculation toggle
  // above (that shows the arithmetic; this shows the plain-language intent
  // behind the number, KPI_DESCRIPTIONS). Same closest()/querySelector
  // delegation pattern, same reason: a dozen+ cards on screen at once.
  container.querySelectorAll('[data-kpi-info]').forEach((name) => {
    name.onclick = () => {
      const panel = name.closest('.kpi-card')?.querySelector('.kpi-description');
      if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    };
  });

  // Each KPI category group (Profitability & Growth, Working Capital, etc.)
  // collapses independently — the toggle button's own next sibling is
  // always its grid, so no ids needed even with several groups on the page.
  container.querySelectorAll('[data-kpi-group-toggle]').forEach((toggle) => {
    toggle.onclick = () => {
      const grid = toggle.nextElementSibling;
      if (!grid) return;
      const willOpen = grid.style.display === 'none';
      grid.style.display = willOpen ? 'grid' : 'none';
      toggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
    };
  });

  // A KPI's own improvement tip, captured straight from the card — this
  // shows up regardless of the card's verdict (a "Good" metric can still
  // have a genuine next step, e.g. revenue growth's own tip is about
  // accelerating further, not fixing a problem), so it needs its own path
  // to Goals/Actions rather than only reaching them via a "bad" verdict
  // making it into Meeting's Priorities step. The text to save is baked
  // into the button itself (not looked up from the kpis array by key) so
  // this works the same whether the card is the entity-level "All" view or
  // a division panel's own filtered kpi list.
  container.querySelectorAll('[data-turn-kpi-goal]').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'adding…';
      try {
        await addTextAsGoal(btn.dataset.kpiTipText);
        btn.textContent = '✓ added to Goals → Business';
      } catch (err) {
        btn.textContent = 'error';
        btn.disabled = false;
        alert('Error: ' + err.message);
      }
    };
  });
  container.querySelectorAll('[data-turn-kpi-action]').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'adding…';
      try {
        await addActionItem(btn.dataset.kpiTipText, 'diagnose', null, null);
        btn.textContent = '✓ added to Actions';
      } catch (err) {
        btn.textContent = 'error';
        btn.disabled = false;
        alert('Error: ' + err.message);
      }
    };
  });
  container.querySelectorAll('[data-dismiss-kpi-tip]').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await toggleRecDismissed(btn.dataset.dismissKpiTip, true);
        rerender();
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });
  container.querySelectorAll('[data-restore-kpi-tip]').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await toggleRecDismissed(btn.dataset.restoreKpiTip, false);
        rerender();
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });

  // Metric history / Financial snapshot — same collapse behaviour, one
  // difference: Financial snapshot's toggle shares a row with its "edit"
  // link (a flex div wrapping both), so the actual content panel is that
  // row's next sibling, not the toggle's own; Metric history's toggle has
  // no such wrapper, so it's the toggle's own next sibling. The wrapper is
  // identifiable by its inline flex style — nothing else uses that here.
  container.querySelectorAll('[data-section-toggle]').forEach((toggle) => {
    toggle.onclick = () => {
      const row = toggle.parentElement?.style.display === 'flex' ? toggle.parentElement : toggle;
      const panel = row.nextElementSibling;
      if (!panel) return;
      const willOpen = panel.style.display === 'none';
      panel.style.display = willOpen ? '' : 'none';
      toggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
    };
  });

  wireTaxOutlookCard(snapshot, kpis);

  const ocfToggle = document.getElementById('ocf-adjust-toggle');
  if (ocfToggle) {
    const ocfPanel = document.getElementById('ocf-adjust-panel');
    ocfToggle.onclick = () => {
      ocfPanel.style.display = ocfPanel.style.display === 'none' ? 'block' : 'none';
      ocfToggle.querySelector('.chevron').textContent = ocfPanel.style.display === 'none' ? '▾' : '▴';
    };

    const ocfFieldIds = ['net_profit', 'interest_expense', 'depreciation_amortisation', 'delta_debtors', 'delta_creditors', 'delta_inventory', 'manual_adjustment'];
    const ocfNum = (id) => Number(document.getElementById(`ocf-${id}`).value || 0);
    const recalcOcf = () => {
      const total = ocfNum('net_profit') + ocfNum('interest_expense') + ocfNum('depreciation_amortisation')
        - ocfNum('delta_debtors') + ocfNum('delta_creditors') - ocfNum('delta_inventory') + ocfNum('manual_adjustment');
      document.getElementById('ocf-total-value').textContent = formatMoney(total);
      return total;
    };
    ocfFieldIds.forEach((id) => {
      const el = document.getElementById(`ocf-${id}`);
      el.oninput = recalcOcf;
      wireMoneyInputPreview(el);
    });

    document.getElementById('ocf-save-btn').onclick = async () => {
      const msg = document.getElementById('ocf-save-msg');
      const total = recalcOcf();
      msg.textContent = 'Saving…';
      msg.className = 'save-msg';
      // Sends the FULL current snapshot, not just operating_cash_flow — the save
      // endpoint treats any omitted field as blank, so a partial payload here
      // would silently wipe every other field on this period.
      const body = { type: 'financials', client_id: currentClientId, period_end: currentPeriodEnd };
      FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = snapshot[key] != null ? snapshot[key] : ''; });
      body.operating_cash_flow = total;
      try {
        const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
        const saved = await res.json();
        if (saved.error) throw new Error(saved.error);
        msg.textContent = 'Saved.';
        msg.className = 'save-msg ok';
        const scrollPos = window.scrollY;
        await renderMain();
        window.scrollTo(0, scrollPos);
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.className = 'save-msg err';
      }
    };
  }

  const reconToggle = document.getElementById('recon-toggle');
  if (reconToggle) {
    const reconPanel = document.getElementById('recon-panel');
    reconToggle.onclick = () => { reconPanel.style.display = reconPanel.style.display === 'none' ? 'block' : 'none'; };

    // "↗" next to a figure jumps to that field in the full Manual Entry form
    // — stopPropagation so clicking it doesn't also fire the parent row's
    // own click-to-expand toggle (several of these sit inside a
    // cash-item-clickable row).
    container.querySelectorAll('[data-jump-field]').forEach((btn) => {
      btn.onclick = (e) => { e.stopPropagation(); jumpToManualEntry(btn.dataset.jumpField, btn.dataset.jumpPeriod || null); };
    });

    container.querySelectorAll('[data-accordion-toggle]').forEach((head) => {
      head.onclick = () => {
        const body = document.getElementById(`recon-body-${head.dataset.accordionToggle}`);
        body.style.display = body.style.display === 'none' ? 'block' : 'none';
        head.querySelector('.chevron').textContent = body.style.display === 'none' ? '▾' : '▴';
      };
    });
    // Tiles on the compact card jump straight into the matching accordion
    // section — "cashflow" and "unexplained" have no section of their own
    // (see renderCashFlowGlanceCard), so they just open the panel and
    // scroll to the relevant fixed element instead of an accordion body.
    container.querySelectorAll('[data-tile-jump]').forEach((tileBtn) => {
      tileBtn.onclick = () => {
        const key = tileBtn.dataset.tileJump;
        reconPanel.style.display = 'block';
        if (key === 'cashflow') {
          reconPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (key === 'unexplained') {
          document.getElementById('recon-residual-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          const body = document.getElementById(`recon-body-${key}`);
          const head = container.querySelector(`[data-accordion-toggle="${key}"]`);
          body.style.display = 'block';
          head.querySelector('.chevron').textContent = '▴';
          body.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };
    });

    const r = kpis.find((k) => k.key === 'op_cash_conversion')?.cash_reconciliation;

    // Shared wiring for the two small "show calculation + edit" blocks (cash
    // balance, total debt) — same self-contained toggle/recalc/save pattern
    // as the OCF adjust block below, just for a single snapshot field each.
    const wireBalanceAdjust = (prefix, priorValue, fieldName) => {
      const toggle = document.getElementById(`${prefix}-adjust-toggle`);
      if (!toggle) return;
      const panel = document.getElementById(`${prefix}-adjust-panel`);
      toggle.onclick = () => {
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        toggle.querySelector('.chevron').textContent = panel.style.display === 'none' ? '▾' : '▴';
      };
      const input = document.getElementById(`${prefix}-current`);
      const recalc = () => {
        const total = Number(input.value || 0) - (priorValue || 0);
        document.getElementById(`${prefix}-total-value`).textContent = formatMoney(total);
        return total;
      };
      input.oninput = recalc;
      wireMoneyInputPreview(input);
      document.getElementById(`${prefix}-save-btn`).onclick = async () => {
        const msg = document.getElementById(`${prefix}-save-msg`);
        msg.textContent = 'Saving…';
        msg.className = 'save-msg';
        // Sends the FULL current snapshot, not just this one field — an
        // omitted field is treated as blank by the save endpoint.
        const body = { type: 'financials', client_id: currentClientId, period_end: currentPeriodEnd };
        FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = snapshot[key] != null ? snapshot[key] : ''; });
        body[fieldName] = input.value;
        try {
          const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
          const saved = await res.json();
          if (saved.error) throw new Error(saved.error);
          msg.textContent = 'Saved.';
          msg.className = 'save-msg ok';
          const scrollPos = window.scrollY;
          await renderMain();
          window.scrollTo(0, scrollPos);
        } catch (err) {
          msg.textContent = 'Error: ' + err.message;
          msg.className = 'save-msg err';
        }
      };
    };
    if (r) {
      wireBalanceAdjust('cashbal', r.cash_prior, 'cash');
      wireBalanceAdjust('debtbal', r.total_debt_prior, 'total_debt');
    }

    const reconFieldIds = ['new_borrowing', 'loan_repayments', 'one_off_loan_repayment', 'interest_capitalised', 'equipment_purchases', 'funds_introduced', 'owner_drawings', 'director_loan_balance'];
    const reconNum = (id) => { const v = document.getElementById(`recon-${id}`).value; return v === '' ? null : Number(v); };
    // Adjustment rows now live in 4 separate per-section lists (see
    // addItemBlock in renderCashReconciliationBlock) rather than one shared
    // list — adjRows() spans all of them; adjRowsFor() filters to one
    // section's own rows via the tag each row carries.
    const adjRows = () => [...document.querySelectorAll('.recon-adj-row')];
    const adjRowsFor = (sec) => adjRows().filter((row) => row.dataset.adjSection === sec);
    const sumAdjRows = (rows) => rows.reduce((sum, row) => sum + (Number(row.querySelector('.recon-adj-amount').value || 0)), 0);

    const recalcRecon = () => {
      const loanRepayments = reconNum('loan_repayments') || 0;
      // One-off is ADDITIONAL to Loan repayments (regular), not a slice
      // already inside it — total principal repaid this period is both
      // combined, which is what New borrowing actually needs to back out
      // against the balance movement.
      const oneOffRepayment = reconNum('one_off_loan_repayment') || 0;
      const totalRepayments = loanRepayments + oneOffRepayment;
      // New borrowing is now an independent fact, not back-solved from the
      // balance movement. Net change (calculated) — built from New borrowing
      // and repayments — sits in its own dropdown alongside those inputs, so
      // its header can be compared directly to the balance-based Net change
      // above (renderDebtAdjustBlock); Capitalised interest is just the gap
      // between them, made explicit instead of silently forcing one of the
      // fields to change.
      const newBorrowingInput = reconNum('new_borrowing');
      // Capitalised interest is now its own directly-entered fact (not
      // back-solved from New borrowing vs the balance movement) — so
      // Net change (calculated) is a genuine sum of three independent inputs
      // and can legitimately disagree with the balance-based figure above if
      // one of them is wrong, rather than always matching by construction.
      const capitalisedInterest = reconNum('interest_capitalised') || 0;
      const netCalculated = newBorrowingInput != null ? (newBorrowingInput - totalRepayments + capitalisedInterest) : null;
      const netCalculatedEl = document.getElementById('recon-net-calculated');
      if (netCalculatedEl) {
        netCalculatedEl.textContent = netCalculated == null ? '—' : formatMoney(netCalculated);
        netCalculatedEl.classList.toggle('neg', netCalculated < 0);
      }
      const ncTotalEl = document.getElementById('recon-nc-total');
      if (ncTotalEl) ncTotalEl.textContent = netCalculated == null ? '—' : formatMoney(netCalculated);
      // Read-only reference inside Net change (calculated) — the editable
      // input for this lives up under Interest expense, not duplicated here,
      // so the two never fall out of sync.
      const ncCapintRow = document.getElementById('recon-nc-capint-row');
      if (ncCapintRow) {
        if (capitalisedInterest) {
          ncCapintRow.style.display = '';
          document.getElementById('recon-nc-capint').textContent = formatMoney(capitalisedInterest);
        } else {
          ncCapintRow.style.display = 'none';
        }
      }
      // Interest paid (cash) is just the rest of the P&L expense once
      // capitalised interest is backed out — independent of New borrowing,
      // so it updates whenever Capitalised interest itself changes.
      const liveCashInterestPaid = r.interest_paid != null ? r.interest_paid - capitalisedInterest : null;
      const cashInterestEl = document.getElementById('recon-cash-interest');
      if (cashInterestEl) {
        cashInterestEl.textContent = liveCashInterestPaid == null ? '—' : formatMoney(liveCashInterestPaid);
        cashInterestEl.classList.toggle('neg', liveCashInterestPaid < 0);
      }
      // Borrowings (the cash-flow tile/section total) excludes capitalised
      // interest — it's non-cash — same three-way derivation as
      // read-data.js's borrowingsCashFlow: New borrowing minus repayments
      // when entered, else the balance movement minus whatever capitalised
      // interest is now typed in (so this recalculates live even before New
      // borrowing itself is ever entered).
      const liveBorrowingsCashFlow = newBorrowingInput != null
        ? (newBorrowingInput - totalRepayments)
        : (r.delta_debt != null ? (r.delta_debt - capitalisedInterest) : null);
      const tieoutTileEl = document.getElementById('recon-borrowings-tieout-tile');
      if (tieoutTileEl) tieoutTileEl.textContent = liveBorrowingsCashFlow == null ? '—' : formatMoney(liveBorrowingsCashFlow);
      const tieoutCapintEl = document.getElementById('recon-borrowings-tieout-capint');
      if (tieoutCapintEl) tieoutCapintEl.textContent = formatMoney(capitalisedInterest);

      const directorLoanBalance = reconNum('director_loan_balance');
      const directorLoanMovement = (directorLoanBalance != null && r.director_loan_balance_prior != null) ? directorLoanBalance - r.director_loan_balance_prior : null;
      document.getElementById('recon-director-loan-movement').textContent = directorLoanMovement == null ? '—' : formatMoney(directorLoanMovement);

      const equipmentInput = reconNum('equipment_purchases');
      const capex = equipmentInput != null ? equipmentInput : r.capex_estimate;

      const capexAdj = sumAdjRows(adjRowsFor('capex'));
      const borrowingsAdj = sumAdjRows(adjRowsFor('borrowings'));
      const ownerAdj = sumAdjRows(adjRowsFor('owner'));
      const otherAdj = sumAdjRows(adjRowsFor('other'));
      const adjustmentsTotal = capexAdj + borrowingsAdj + ownerAdj + otherAdj;

      const setSubtotal = (key, value) => {
        const el = document.getElementById(`recon-sub-${key}`);
        if (!el) return;
        el.childNodes[0].textContent = formatMoney(value) + ' ';
        el.classList.toggle('neg', value < 0);
      };
      setSubtotal('capex', (capex != null ? -capex : 0) + capexAdj);
      setSubtotal('borrowings', (liveBorrowingsCashFlow || 0) + borrowingsAdj);
      setSubtotal('owner', (directorLoanMovement || 0) + (reconNum('funds_introduced') || 0) - (reconNum('owner_drawings') || 0) + ownerAdj);
      setSubtotal('other', otherAdj);

      const financingKnown = (liveBorrowingsCashFlow || 0)
        + (r.interest_applicable ? -(liveCashInterestPaid || 0) : 0)
        + (directorLoanMovement || 0)
        + (reconNum('funds_introduced') || 0) - (reconNum('owner_drawings') || 0)
        - (capex || 0)
        + adjustmentsTotal;
      const residual = r.non_operating - financingKnown;
      document.getElementById('recon-residual-value').textContent = formatMoney(residual);
      document.getElementById('recon-residual-box').classList.toggle('neg', residual < 0);
      const netExplained = r.delta_cash - residual;
      document.getElementById('recon-equation').textContent = `${formatMoney(netExplained)} net + ${formatMoney(residual)} unexplained = ${formatMoney(r.delta_cash)} actual change in cash`;
      // The headline itself (delta_cash, the real bank balance movement)
      // never changes from editing these fields — only how much of it is
      // "explained" does, which is what the Unexplained stat tracks live.
      const unexplainedStat = document.getElementById('cash-tile-unexplained');
      if (unexplainedStat) {
        unexplainedStat.textContent = formatMoney(residual);
        unexplainedStat.classList.toggle('neg', residual < 0);
      }

      return {
        newBorrowing: newBorrowingInput, interestCapitalised: reconNum('interest_capitalised'),
        loanRepayments: reconNum('loan_repayments'), oneOffLoanRepayment: oneOffRepayment, equipmentPurchases: equipmentInput,
        fundsIntroduced: reconNum('funds_introduced'), ownerDrawings: reconNum('owner_drawings'),
        directorLoanBalance,
        adjustments: adjRows().map((row) => ({ label: row.querySelector('.recon-adj-label').value, amount: row.querySelector('.recon-adj-amount').value, section: row.dataset.adjSection })),
      };
    };
    reconFieldIds.forEach((id) => {
      const el = document.getElementById(`recon-${id}`);
      el.oninput = recalcRecon;
      wireMoneyInputPreview(el);
    });

    const wireAdjRow = (row) => {
      const amountInput = row.querySelector('.recon-adj-amount');
      amountInput.oninput = recalcRecon;
      wireMoneyInputPreview(amountInput);
      row.querySelector('.recon-adj-remove').onclick = () => { row.remove(); recalcRecon(); };
    };
    adjRows().forEach(wireAdjRow);
    container.querySelectorAll('[data-adj-add]').forEach((addBtn) => {
      addBtn.onclick = () => {
        const sec = addBtn.dataset.adjAdd;
        const list = document.getElementById(`recon-adjustments-list-${sec}`);
        list.insertAdjacentHTML('beforeend', renderReconAdjustmentRow({ label: '', amount: '' }, sec));
        const newRow = list.lastElementChild;
        wireAdjRow(newRow);
        newRow.querySelector('.recon-adj-label').focus();
      };
    });

    document.getElementById('recon-save-btn').onclick = async () => {
      const msg = document.getElementById('recon-save-msg');
      const vals = recalcRecon();
      msg.textContent = 'Saving…';
      msg.className = 'save-msg';
      // Sends the FULL current snapshot — an omitted field is treated as
      // blank by the save endpoint, so only overriding these fields here
      // (not sending a partial payload) is what keeps the rest intact.
      const body = { type: 'financials', client_id: currentClientId, period_end: currentPeriodEnd };
      FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = snapshot[key] != null ? snapshot[key] : ''; });
      body.new_borrowing = vals.newBorrowing ?? '';
      body.interest_capitalised = vals.interestCapitalised ?? '';
      body.loan_repayments = vals.loanRepayments ?? '';
      body.one_off_loan_repayment = vals.oneOffLoanRepayment ?? '';
      body.equipment_purchases = vals.equipmentPurchases ?? '';
      body.funds_introduced = vals.fundsIntroduced ?? '';
      body.owner_drawings = vals.ownerDrawings ?? '';
      body.director_loan_balance = vals.directorLoanBalance ?? '';
      body.cash_recon_adjustments = vals.adjustments;
      // renderMain() below rebuilds this whole card from scratch, and every
      // panel/section/dropdown/category-group starts collapsed by default —
      // without restoring that, a successful save LOOKS like it did nothing
      // (everything you just added visually vanishes behind closed
      // accordions), even though the data genuinely persisted. Remember
      // what was open, reopen it after — generically, via the same
      // data-accordion-toggle attribute every dropdown in this panel
      // already carries, so a newly-added one never needs adding to a list
      // here by hand. This also has to cover every OTHER category group
      // (Profitability & Growth, Working Capital, Balance Sheet, Tax — not
      // just Cash): the plain pixel scrollTo below assumes the page is the
      // same height before and after, and if any of those were open too and
      // silently collapse on re-render, the page gets shorter and the old
      // scroll offset lands somewhere else entirely (typically back up
      // near "Key metrics") even though Cash itself reopened correctly.
      const openGroupLabels = [...document.querySelectorAll('[data-kpi-group-toggle]')]
        .filter((t) => t.nextElementSibling?.style.display !== 'none')
        .map((t) => t.querySelector('.kpi-group-label')?.textContent.trim());
      const openSections = [...document.querySelectorAll('[data-accordion-toggle]')]
        .filter((head) => document.getElementById(`recon-body-${head.dataset.accordionToggle}`)?.style.display === 'block')
        .map((head) => head.dataset.accordionToggle);
      try {
        const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
        const saved = await res.json();
        if (saved.error) throw new Error(saved.error);
        msg.textContent = 'Saved.';
        msg.className = 'save-msg ok';
        const scrollPos = window.scrollY;
        await renderMain();
        openGroupLabels.forEach((label) => {
          const toggle = [...document.querySelectorAll('[data-kpi-group-toggle]')].find((t) => t.querySelector('.kpi-group-label')?.textContent.trim() === label);
          toggle?.click();
        });
        document.getElementById('recon-toggle')?.click();
        await new Promise((res2) => setTimeout(res2, 0));
        openSections.forEach((key) => document.querySelector(`[data-accordion-toggle="${key}"]`)?.click());
        window.scrollTo(0, scrollPos);
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.className = 'save-msg err';
      }
    };
  }

  container.querySelectorAll('button[data-set-target], button[data-edit-target]').forEach((btn) => {
    btn.onclick = () => {
      const key = btn.dataset.setTarget || btn.dataset.editTarget;
      document.getElementById(`target-editor-${key}`).style.display = 'flex';
      btn.style.display = 'none';
    };
  });
  container.querySelectorAll('button[data-cancel-target]').forEach((btn) => {
    btn.onclick = () => {
      const key = btn.dataset.cancelTarget;
      document.getElementById(`target-editor-${key}`).style.display = 'none';
      const trigger = container.querySelector(`[data-edit-target="${key}"], [data-set-target="${key}"]`);
      if (trigger) trigger.style.display = '';
    };
  });
  container.querySelectorAll('button[data-save-target]').forEach((btn) => {
    btn.onclick = async () => {
      const key = btn.dataset.saveTarget;
      // cash_net_movement isn't a real kpi_library row (see buildCashNetMovementKpi) —
      // rebuild the same synthetic object rather than looking it up in kpis.
      const kpi = key === 'cash_net_movement'
        ? buildCashNetMovementKpi(cashInOut(kpis.find((k) => k.key === 'op_cash_conversion')?.cash_reconciliation))
        : kpis.find((k) => k.key === key);
      const raw = document.getElementById(`target-input-${key}`).value;
      if (raw === '') return;
      const target = kpi.format === 'percent' ? Number(raw) / 100 : Number(raw);
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        if (btn.dataset.itemId) {
          await editKpiTargetGoal(kpi, target, btn.dataset.itemCat, btn.dataset.itemPeriod, btn.dataset.itemId);
        } else {
          await addKpiTargetGoal(kpi, target);
        }
        currentCtx = await callRead('get_context', currentClientId);
        // A full renderMain() replaces the whole tab's DOM at once — without
        // capturing/restoring scroll, that visually jumps the page back to the
        // top, reading as if the whole screen reset rather than just this card.
        const scrollPos = window.scrollY;
        await renderMain();
        window.scrollTo(0, scrollPos);
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Save';
      }
    };
  });

  if (financialScore != null) {
    drawWheel(document.getElementById('ov-wheel'), financialPillars, financialScore);
    const legend = document.getElementById('ov-legend');
    financialPillars.forEach((p) => {
      const item = document.createElement('div');
      item.className = 'pillar-legend-item';
      item.innerHTML = `<span class="pillar-swatch" style="background:${p.color}"></span><span class="pillar-legend-name">${p.name}</span>${p.score != null ? scoreBadgeHtml(p.score, false) : ''}<span class="pillar-legend-score">${p.score == null ? '—' : p.score.toFixed(1)}</span>`;
      legend.appendChild(item);
    });
  }

  // Re-draws this whole block from data already in hand (no refetch — the
  // overview/kpis/snapshot/history/divisionData args are still fresh; only
  // currentCtx.recommendation_state changed) after a dismiss/restore/
  // suggest-target save. Simplest way to keep the visible/dismissed flag
  // split and any saved suggestion panel correct without hand-patching the
  // DOM in three different places; the one cost is any expanded KPI group
  // collapses back to its default closed state, an acceptable trade for
  // this being a rare action rather than a frequent one.
  const rerender = () => renderHealthWheelBlock(container, overview, kpis, snapshot, history, divisionData);

  container.querySelectorAll('button[data-suggest-target]').forEach((btn) => {
    btn.onclick = async () => {
      const recId = btn.dataset.suggestTarget;
      const flag = flags.find((f) => flagId(f) === recId);
      if (!flag) return;
      const panel = btn.closest('.flag-row-wrap').querySelector('.suggest-panel');
      panel.style.display = 'block';
      panel.innerHTML = '<p class="muted plain" style="margin:0;">Thinking…</p>';
      btn.disabled = true;
      try {
        const res = await fetch('/.netlify/functions/suggest-goal', {
          method: 'POST',
          body: JSON.stringify({
            client_id: currentClientId, period_end: currentPeriodEnd,
            category: 'business', category_label: 'Financial Performance', focus: flag.message, count: 1,
          }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const suggestion = data.suggestions?.[0];
        if (!suggestion) {
          panel.innerHTML = '<p class="muted plain" style="margin:0;">No suggestion came back — try again.</p>';
          btn.disabled = false;
        } else {
          await saveSuggestedTargetText(recId, suggestion);
          rerender();
        }
      } catch (err) {
        panel.innerHTML = `<p class="muted plain" style="margin:0;">Error: ${err.message}</p>`;
        btn.disabled = false;
      }
    };
  });

  container.querySelectorAll('button[data-dismiss-flag]').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await toggleRecDismissed(btn.dataset.dismissFlag, true);
        rerender();
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });
  container.querySelectorAll('button[data-restore-flag]').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await toggleRecDismissed(btn.dataset.restoreFlag, false);
        rerender();
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });
  container.querySelectorAll('button[data-suggest-add-goal]').forEach((btn) => {
    btn.onclick = async () => {
      const text = recState.suggestedTargets[btn.dataset.suggestAddGoal];
      btn.disabled = true;
      btn.textContent = 'adding…';
      try {
        await addTextAsGoal(text);
        btn.textContent = '✓ added to Goals → Business';
      } catch (err) {
        btn.textContent = 'error';
        btn.disabled = false;
        alert('Error: ' + err.message);
      }
    };
  });
  container.querySelectorAll('button[data-suggest-add-action]').forEach((btn) => {
    btn.onclick = async () => {
      const text = recState.suggestedTargets[btn.dataset.suggestAddAction];
      btn.disabled = true;
      btn.textContent = 'adding…';
      try {
        await addActionItem(text, 'diagnose', null, null);
