      ${figure('Revenue', formatMoney(snapshot.revenue), hasLastYear && moneyVsLastYear(snapshot.revenue, lySnap.revenue))}
      ${figure('Net profit', formatMoney(snapshot.net_profit), hasLastYear && moneyVsLastYear(snapshot.net_profit, lySnap.net_profit))}
      ${figure('Gross margin', formatKpi(kpi('gp_margin')?.value, 'percent'), hasLastYear && pctVsLastYear(kpi('gp_margin')?.value, lyKpi('gp_margin')?.value))}
      ${figure('Net margin', formatKpi(kpi('np_margin')?.value, 'percent'), hasLastYear && pctVsLastYear(kpi('np_margin')?.value, lyKpi('np_margin')?.value))}
      ${figure('Cash on hand', formatMoney(snapshot.cash), hasLastYear && moneyVsLastYear(snapshot.cash, lySnap.cash))}
    </div>
    <p class="report-sub" style="margin:10px 0 0;">${hasLastYear ? `Compared with the same period last year (ending ${formatShortDate(lastYearEnd)}).` : `No figures on file for the same period last year (ending ${formatShortDate(lastYearEnd)}), so there's no comparison.`}</p>
  ` : `<p class="report-empty">No financial figures entered for this period yet.</p>`;

  // 2. Where the cash went — same sentence the Analyse tab's cash card uses.
  const cashStory = cashStorySentence(kpi('op_cash_conversion')?.cash_reconciliation);

  // 3 & 7. Check-in answers, opening and closing — only questions that
  // actually got an answer, so a skipped question doesn't print as a blank.
  const goals = ctx?.owner_goals || {};
  const pulse = goals.periods?.[currentPeriodEnd]?.pulse || {};
  const allQuestions = [
    ...FIXED_QUESTIONS.map((q) => ({ ...q, prompt: goals.question_overrides?.[q.id] || q.prompt })),
    ...(goals.custom_questions || []),
  ];
  const answered = (phase) => allQuestions.filter((q) => (q.phase || 'open') === phase && (pulse[q.id] || '').trim());
  const qaHtml = (qs) => `<div class="report-grid2">${qs.map((q) => `<div class="report-qa"><p class="q">${esc(q.prompt)}</p><p class="a">${esc(pulse[q.id].trim())}</p></div>`).join('')}</div>`;
  const openingQs = answered('open');
  const closingQs = answered('close');

  // What the analysis found — the AI diagnosis plus the one-line "so what"
  // per domain the Meeting briefs use. Diagnose's own data, read-only here.
  // get_diagnosis falls back to the latest analysed period when there's
  // nothing for this one — only trust it when it's actually this period.
  const diag = diagnosisData?.period_end === currentPeriodEnd ? diagnosisData : null;
  const summaryRows = [
    ['Financial performance', diag?.briefSummary?.financial],
    ['Growth', diag?.briefSummary?.growth],
    ['Owner & succession', diag?.briefSummary?.owner],
  ].filter(([, text]) => text);
  // The diagnosis paragraph is the page-1 summary; the per-area lines go
  // with the detail.
  const summaryRowsHtml = summaryRows.length
    ? `<ul class="report-list">${summaryRows.map(([label, text]) => `<li><b>${label}:</b> ${esc(text)}</li>`).join('')}</ul>`
    : '';

  // Recommendations — every group Diagnose/Growth show (Get better, Tax
  // planning, Opportunities), minus anything dismissed in the app for this
  // period (same rec:<group>:<title> ids as renderFinancialDiagnose), so a
  // recommendation the adviser has ruled out never reaches the client.
  const dismissedRecs = ctx?.recommendation_state?.[currentPeriodEnd]?.dismissed || {};
  const recGroups = [
    ['getBetter', 'Improving the business'],
    ['taxPlanning', 'Tax planning'],
    ['opportunities', 'Growth opportunities'],
  ].map(([group, label]) => ({ label, items: (diag?.[group] || []).filter((r) => !dismissedRecs[`rec:${group}:${r.title}`]) }))
    .filter((g) => g.items.length);
  // One 2-across grid for all groups, each card tagged with its group,
  // rather than a heading per group — a heading-per-group list ran to a
  // page and a half on its own.
  const recsHtml = recGroups.length ? `<div class="report-grid2">${recGroups.map((g) => `
    ${g.items.map((r) => `<div class="report-rec">
      <p class="rg">${g.label}</p>
      <p class="rt">${esc(r.title)}</p>
      ${r.impact || r.impact_estimate ? `<p>${esc(r.impact || r.impact_estimate)}</p>` : ''}
      ${r.difficulty || r.timeframe ? `<p class="rm">${esc([r.difficulty && `Effort: ${r.difficulty}`, r.timeframe && `Timeframe: ${r.timeframe}`].filter(Boolean).join(' · '))}</p>` : ''}
      ${r.takes ? `<p><b>What it would take:</b> ${esc(r.takes)}</p>` : ''}
      ${r.risk ? `<p><b>Risk:</b> ${esc(r.risk)}</p>` : ''}
      ${r.decision ? `<p><b>Decision:</b> ${esc(r.decision)}</p>` : ''}
    </div>`).join('')}
  `).join('')}</div>` : '';

  // 4. Priorities — the meeting's decisions.
  const prioritiesHtml = hasMeeting
    ? brief.priorities.map((p, i) => {
        const meta = PILLAR_META[p.pillar] || { name: p.pillar, color: 'var(--brass)' };
        return `<div class="report-priority" style="--pc:${meta.color};">
          <p class="pname">${i + 1}. ${esc(meta.name)}</p>
          <p>${esc(p.talkingPoint || p.message)}</p>
          ${p.decision ? `<p><b>What we decided:</b> ${esc(p.decision)}</p>` : ''}
          ${p.action ? `<p><b>Next step:</b> ${esc(p.action)}</p>` : ''}
        </div>`;
      }).join('')
    : '';

  // 5. Goals — achieved this period, and what's still being worked toward,
  // grouped by category.
  const hidden = goals.hidden_categories || [];
  const categories = [...GOAL_CATEGORIES.filter((c) => !hidden.includes(c.key)), ...(goals.custom_categories || [])];
  const goalGroups = categories.map((cat) => {
    // Exact-duplicate texts collapse to one line (the same check-in answer
    // can get added to a category more than once).
    const seen = new Set();
    const items = resolveGoalList(goals, currentPeriodEnd, cat.key).filter((it) => {
      const key = (it.text || '').trim().toLowerCase();
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    return { cat, achieved: items.filter((it) => it.done), open: items.filter((it) => !it.done) };
  }).filter((g) => g.achieved.length || g.open.length);
  // One box per category, 2 across; achieved goals stay in their own
  // category with a tick rather than a separate list.
  const goalsHtml = goalGroups.length ? `
    <div class="report-grid2">
      ${goalGroups.map((g) => `<div class="report-goal-box" style="--gc:${g.cat.color};">
        <p class="gn">${esc(g.cat.label)}</p>
        <ul>
          ${g.achieved.map((it) => `<li class="done">✓ ${esc(it.text)} <span>— achieved</span></li>`).join('')}
          ${g.open.map((it) => `<li>${esc(it.text)}</li>`).join('')}
        </ul>
      </div>`).join('')}
    </div>
  ` : `<p class="report-empty">No goals recorded yet.</p>`;

  // 6. Agreed actions — everything still open on the Actions list, soonest
  // due first, so the client leaves with one list of who does what.
  const openActions = (actionsData?.items || [])
    .filter((it) => it.status !== 'done')
    .sort((a, b) => (a.due_date || '9999-99-99').localeCompare(b.due_date || '9999-99-99'));
  const actionsHtml = openActions.length ? `
    <table class="report-actions">
      <thead><tr><th>Action</th><th>Who</th><th>Due</th><th>Status</th></tr></thead>
      <tbody>${openActions.map((it) => `<tr>
        <td>${esc(it.text)}</td>
        <td>${esc(it.owner || '—')}</td>
        <td style="white-space:nowrap;">${it.due_date ? formatShortDate(it.due_date) : '—'}</td>
        <td style="white-space:nowrap;">${esc(ACTION_STATUS_META[it.status]?.label || 'To do')}</td>
      </tr>`).join('')}</tbody>
    </table>
  ` : `<p class="report-empty">No open actions.</p>`;

  // Out-of-date analysis — figures saved (synced_at, only bumped by a real
  // financials save, not the tax-split/scenario saves) after the analysis
  // last ran. The diagnosis, scores and recommendations then describe the
  // OLD numbers while the figures section shows the new ones, so the report
  // contradicts itself. Screen-only warning (inside .report-toolbar, which
  // print hides) — the adviser needs to see it, the client never should.
  const analysedAt = diag?.analysedAt ? new Date(diag.analysedAt) : null;
  const figuresSavedAt = snapshot?.synced_at ? new Date(snapshot.synced_at) : null;
  const analysisStale = !!(analysedAt && figuresSavedAt && figuresSavedAt > analysedAt);
  const staleWarningHtml = analysisStale ? `
    <div class="report-stale">
      <p style="margin:0;"><b>Analysis is out of date.</b> The figures were changed on ${formatShortDate(snapshot.synced_at.slice(0, 10))}, after the analysis last ran on ${formatShortDate(diag.analysedAt.slice(0, 10))}. The scores, analysis and recommendations below may describe the old numbers. Re-run the analysis before sharing this report.</p>
      <button class="mini-link" id="report-rerun-analysis-link" type="button" style="margin-top:6px;">→ Go to Financial Performance → Analyse</button>
    </div>
  ` : '';

  // Page 1's "next steps" — the meeting's agreed next step per priority
  // (falling back to the decision, then the issue itself), or with no
  // meeting, the first few recommendations as "where to focus".
  const nextSteps = hasMeeting
    ? brief.priorities.map((p) => ({ area: PILLAR_META[p.pillar]?.name || p.pillar, color: PILLAR_META[p.pillar]?.color, text: p.action || p.decision || p.talkingPoint || p.message }))
    : recGroups.flatMap((g) => g.items.map((r) => ({ area: g.label, text: r.title }))).slice(0, 3);
  const nextStepsHtml = nextSteps.length ? `
    <ol class="report-next">${nextSteps.map((s) => `<li><span class="a" ${s.color ? `style="color:${s.color};"` : ''}>${esc(s.area)}</span>${esc(s.text)}</li>`).join('')}</ol>
    ${openActions.length ? `<p class="report-sub" style="margin:8px 0 0;">${openActions.length} open action${openActions.length === 1 ? '' : 's'} in total — see the action plan.</p>` : ''}
  ` : '';

  const section = (title, body) => `<div class="report-section"><h2>${title}</h2>${body}</div>`;
  const meetingLine = brief
    ? `Meeting ${brief.created_at ? formatShortDate(brief.created_at.slice(0, 10)) : 'on file'}${brief.completed ? '' : ' (in progress)'}`
    : 'No meeting recorded for this period';
  const performanceDetail = [
    pillarGridHtml ? `<h3>Scores by area</h3>${pillarGridHtml}` : '',
    cashStory ? `<h3>Where the cash went</h3><p style="margin:0;">${esc(cashStory)}</p>` : '',
    summaryRowsHtml ? `<h3>In short</h3>${summaryRowsHtml}` : '',
  ].filter(Boolean).join('');

  content.innerHTML = `
    <div class="report-toolbar">
      <p class="muted plain" style="margin:0;">Client report for this period — built from the meeting, goals, figures and Actions.</p>
      <button class="action" id="report-print-btn" type="button">Print / Save as PDF</button>
      ${staleWarningHtml}
    </div>
    <div class="client-report" id="client-report">
      <!-- Page 1 — at a glance: built to fit one A4 sheet on its own. -->
      <div class="report-masthead">
        <p class="eyebrow">Advisory report</p>
        <h1>${esc(clientName)}</h1>
        <p class="report-sub">Period ending ${formatShortDate(currentPeriodEnd)} · ${meetingLine}</p>
      </div>
      ${scoreTilesHtml ? `<div class="report-scores">${scoreTilesHtml}</div>` : ''}
      ${section('How the business performed', figuresHtml)}
      ${diag?.diagnosis ? section('What we found', `<p class="report-diagnosis">${esc(diag.diagnosis)}</p>`) : ''}
      ${nextStepsHtml ? section(hasMeeting ? 'Your next steps' : 'Where to focus', nextStepsHtml) : ''}

      <!-- Detail — starts on a fresh page when printed. -->
      <div class="report-page-break"><span>Detail</span></div>
      ${openingQs.length ? section('What you told us', qaHtml(openingQs)) : ''}
      ${performanceDetail ? section('Performance in detail', performanceDetail) : ''}
      ${hasMeeting ? section('Priorities we discussed', prioritiesHtml) : ''}
      ${section('Recommendations', recsHtml || `<p class="report-empty">${diag ? 'No open recommendations for this period.' : 'No analysis run for this period yet.'}</p>`)}
      ${section('Goals', goalsHtml)}
      ${section('Action plan', actionsHtml)}
      ${closingQs.length ? section('Looking ahead', qaHtml(closingQs)) : ''}
      <p class="report-footer">Prepared ${formatShortDate(today())} · ${esc(clientName)} · period ending ${formatShortDate(currentPeriodEnd)}</p>
    </div>
  `;
  document.getElementById('report-print-btn').onclick = () => window.print();
  const rerunLink = document.getElementById('report-rerun-analysis-link');
  if (rerunLink) {
    rerunLink.onclick = async () => {
      currentDomain = 'financial';
      currentWorkflow = 'analyse';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
    };
  }
}

loadClients();
hydrateTaxRatesByFY();
</script>
</body>
</html>
