// Tax outlook (Financial Performance -> Analyse -> Tax) is a scratch
// scenario tool, not saved data — but renderMain() re-runs on nearly every
// action (tab switch, suggest-target click, saving something elsewhere),
// which rebuilds the card's HTML from scratch each time. Without holding the
// typed values here, that rebuild would reset every field back to its
// hardcoded default and silently discard whatever the adviser was modelling
// mid-meeting. Initial value here is just the shape/fallback — the real
// current value is swapped in per client+period by
// restoreScenarioStateIfNeeded (see its own comment, further down).
let taxOutlookState = defaultTaxOutlookState();
// Cash outlook and Tax outlook both model "what if this period's Revenue/
// GP/Opex/Net profit had been different" (same projectProfitScenario
// buildup) and only diverge at the last step — × cash conversion rate vs →
// tax calculation. They render side by side in the same (right) column
// (see RIGHT_KPI_CATEGORIES) and in the Meeting brief together, so typing a
// change into either card's Revenue field now updates BOTH, instead of the
// same number needing to be typed twice into two state objects that could
// silently describe two different scenarios. Super contribution and
// equipment purchase are shared too — both are real cash leaving the
// business AND a tax deduction, so they affect Cash outlook's projected
// cash exactly as much as Tax outlook's projected tax bill (see
// computeCashOutlookResult) — a scenario with a $10k super contribution
// shouldn't look like a "free" tax saving with no cash cost. Only
// conversion override (Cash outlook) and compare-entity (Tax outlook) stay
// on each card's own state below instead, having no counterpart on the
// other card at all.
let scenarioState = defaultScenarioState();
// Registered by whichever of Cash outlook/Tax outlook is currently mounted
// (see wireCashOutlookCard/wireTaxOutlookCard) — a shared-field change on
// EITHER card calls every registered recalc, so both stay in sync even
// though they're two separate DOM subtrees. Reset once per render (every
// place either card can be mounted) so closures from a prior render don't
// pile up — same pattern taxRatesPanelRefreshers already uses.
let scenarioRecalcs = [];
// Same idea as scenarioRecalcs, but specifically for each card's step-
// attribute/money-preview-mode updater (see wireCashOutlookCard's
// updateToggleSteps) — changing the %/$ toggle on EITHER card needs both
// cards' step="1"/"1000" and preview-active state to flip, not just a
// recalc. Reset alongside scenarioRecalcs at every mount point.
let scenarioUnitSyncs = [];
// Field key → {cash: domId, tax: domId} for every scenario field shared
// between the two cards — used to find and mirror the OTHER card's
// matching input whenever one changes on either side.
const SHARED_SCENARIO_FIELD_IDS = {
  unit: { cash: 'cash-outlook-unit', tax: 'tax-outlook-unit' },
  revenue: { cash: 'cash-outlook-revenue', tax: 'tax-outlook-revenue' },
  gp: { cash: 'cash-outlook-gp', tax: 'tax-outlook-gp' },
  opex: { cash: 'cash-outlook-opex', tax: 'tax-outlook-opex' },
  netProfit: { cash: 'cash-outlook-netprofit', tax: 'tax-outlook-netprofit' },
  netProfitAbsolute: { cash: 'cash-outlook-netprofit-absolute', tax: 'tax-outlook-netprofit-absolute' },
  oneOffIncome: { cash: 'cash-outlook-oneoff-income', tax: 'tax-outlook-oneoff-income' },
  oneOffExpense: { cash: 'cash-outlook-oneoff-expense', tax: 'tax-outlook-oneoff-expense' },
  super: { cash: 'cash-outlook-super', tax: 'tax-outlook-super' },
  equipment: { cash: 'cash-outlook-equipment', tax: 'tax-outlook-equipment' },
};
const SHARED_SCENARIO_NUMERIC_KEYS = new Set(['revenue', 'gp', 'opex', 'netProfit', 'oneOffIncome', 'oneOffExpense', 'super', 'equipment']);
// Call on every shared-field input's change, from EITHER card — updates the
// one scenarioState, mirrors the raw typed value into the OTHER card's
// matching input if it's currently mounted (without re-triggering this same
// function — a direct .value set, not a dispatched event), refreshes that
// input's money-preview if it has one, then reruns every registered recalc
// (and, for the unit toggle specifically, every registered step-updater
// first) so both cards' numbers and both cards' input steps stay in sync
// regardless of which card was actually typed into.
function syncSharedScenarioField(key, sourceCardId, rawValue) {
  scenarioState[key] = SHARED_SCENARIO_NUMERIC_KEYS.has(key) ? (Number(rawValue) || 0) : rawValue;
  const ids = SHARED_SCENARIO_FIELD_IDS[key];
  const otherCardId = sourceCardId === 'cash' ? 'tax' : 'cash';
  const otherEl = document.getElementById(ids[otherCardId]);
  if (otherEl && otherEl.value !== rawValue) {
    otherEl.value = rawValue;
    otherEl._moneyPreviewUpdate?.();
  }
  if (key === 'unit') scenarioUnitSyncs.forEach((fn) => fn());
  scenarioRecalcs.forEach((fn) => fn());
  persistScenarioState();
}
// Cash/Tax outlook are a scratch "what if" tool, not saved data — deliberately
// not written to Supabase (nothing here is a fact about the client, just a
// hypothetical the adviser is trying out) — but it's specific to ONE client's
// ONE period, so it's kept in the browser's own localStorage keyed by both,
// not just held in memory: surviving a tab switch, a page reload, or closing
// and reopening the browser, while a DIFFERENT client or period always starts
// from a clean slate instead of silently inheriting whatever was last typed
// somewhere else. See restoreScenarioStateIfNeeded (called from
// renderMainDispatch) and persistScenarioState (called after every edit).
function defaultScenarioState() {
  return { unit: 'pct', revenue: 0, gp: 0, opex: 0, netProfit: 0, netProfitAbsolute: '', oneOffIncome: 0, oneOffExpense: 0, super: 0, equipment: 0 };
}
function defaultTaxOutlookState() {
  return { compareEntity: '', compareShareUnit: 'pct', compareShares: [50, 50, 0, 0, 0, 0, 0, 0], compareOtherIncome: ['', '', '', '', '', '', '', ''], compareTypes: ['adult', 'adult', 'adult', 'adult', 'adult', 'adult', 'adult', 'adult'], carriedLosses: 0, equipmentDeductible: '' };
}
function defaultCashOutlookState() {
  return { conversionOverride: '' };
}
function scenarioStorageKey() {
  return `oag-scenario:${currentClientId}:${currentPeriodEnd}`;
}
// try/catch throughout: localStorage can throw (private browsing, storage
// disabled, quota) — none of that should ever break the app, it just means
// the scratch scenario won't survive a reload this time.
function persistScenarioState() {
  if (!currentClientId || !currentPeriodEnd) return;
  try {
    localStorage.setItem(scenarioStorageKey(), JSON.stringify({ scenarioState, taxOutlookState, cashOutlookState }));
  } catch (e) { /* not fatal — scratch scenario just won't survive a reload */ }
}
// Tracks which client:period the in-memory state was last restored for, so
// this only actually resets on a genuine client/period change — renderMain()
// reruns constantly (tab switches, saves elsewhere) and must NOT wipe live
// edits just because it happened to re-render.
let scenarioStateRestoredKey = null;
function restoreScenarioStateIfNeeded() {
  const key = scenarioStorageKey();
  if (key === scenarioStateRestoredKey) return;
  scenarioStateRestoredKey = key;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(key)); } catch (e) { saved = null; }
  scenarioState = { ...defaultScenarioState(), ...(saved?.scenarioState || {}) };
  taxOutlookState = { ...defaultTaxOutlookState(), ...(saved?.taxOutlookState || {}) };
  cashOutlookState = { ...defaultCashOutlookState(), ...(saved?.cashOutlookState || {}) };
}
// Every renderMain() call bumps this. A render function that awaits something
// before writing to #tab-content captures the token at entry and checks it's
// still current right before writing — if a newer render started meanwhile
// (fast tab/domain switching), the stale one silently no-ops instead of
// clobbering whatever the newer render already put on screen.
let renderToken = 0;

async function callRead(action, client_id, period_end, extra) {
  const res = await fetch('/.netlify/functions/read-data', {
    method: 'POST',
    body: JSON.stringify({ action, client_id, period_end, ...(extra || {}) }),
  });
  return res.json();
}

function capCadence(c) {
  return (c || '').replace('_', ' ').replace(/\b\w/g, (ch) => ch.toUpperCase());
}

// No dedicated name field existed before — client name and business description
// used to be conflated (first sentence of the description shown as the "name").
// Falls back gracefully for clients that haven't set a real name yet.
function clientDisplayName(ctx, fallbackId) {
  return ctx?.profile_extra?.business_name || ctx?.business_description?.split('.')[0] || fallbackId;
}

// ---- Client list / selection ----
// Archived clients (is_archived on client_context) never appear in this
// picker — they're managed entirely from the dedicated Archived clients
// panel (renderArchivedClients), reached via the sidebar link.
async function loadClients() {
  const data = await callRead('list_clients');
  const sel = document.getElementById('client-select');
  sel.innerHTML = '<option value="">Select a client…</option>' +
    (data || []).map((c) => `<option value="${c.client_id}">${clientDisplayName(c, c.client_id)}</option>`).join('');
  sel.value = currentClientId || '';
  // A long client name still clips in the closed <select> at this sidebar
  // width — title gives a hover tooltip with the full name as a fallback,
  // since text-overflow: ellipsis doesn't reliably apply to native selects.
  sel.title = sel.options[sel.selectedIndex]?.text || '';
}

// Dedicated management view for archived clients — reached via the sidebar's
// "Archived clients" link, not tied to currentClientId. One click to
// unarchive; permanent delete is tick-box + single confirm (no typed name —
// that was too much friction for what's meant to be a quick cleanup action).
async function renderArchivedClients() {
  const content = document.getElementById('tab-content');
  document.getElementById('workflow-tabs').style.display = 'none';
  const returningClientId = currentClientId;
  const clients = await callRead('list_clients', undefined, undefined, { include_archived: true });
  const archived = (clients || []).filter((c) => c.is_archived);

  content.innerHTML = `
    <div class="card">
      <p class="muted">Archived clients</p>
      ${archived.length ? '<p class="muted plain" style="margin:0 0 12px;">Tick a client to permanently delete them, or unarchive to bring them back to the client list.</p>' : '<p class="muted plain" style="margin:0;">No archived clients.</p>'}
      ${archived.map((c) => `
        <div class="cash-item" style="align-items:center; gap:10px;">
          <input type="checkbox" class="archived-delete-check" data-id="${c.client_id}" data-name="${escAttr(clientDisplayName(c, c.client_id))}" />
          <span style="flex:1;">${clientDisplayName(c, c.client_id)}</span>
          <button class="mini-link archived-unarchive-btn" data-id="${c.client_id}" type="button">Unarchive</button>
        </div>
      `).join('')}
      ${archived.length ? `<button class="action" id="archived-delete-selected-btn" type="button" style="margin-top:14px; background:#9C4B3C;">Permanently delete selected</button>` : ''}
      <div class="save-msg" id="archived-msg"></div>
      <button class="mini-link" id="archived-back-btn" type="button" style="margin-top:16px; display:block;">← Back</button>
    </div>
  `;

  const goBack = async () => {
    if (returningClientId) { currentClientId = returningClientId; await selectClient(returningClientId); }
    else await resetToNoClient();
  };
  document.getElementById('archived-back-btn').onclick = goBack;

  content.querySelectorAll('.archived-unarchive-btn').forEach((btn) => {
    btn.onclick = async () => {
      const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify({ type: 'unarchive_client', client_id: btn.dataset.id }) });
      const data = await res.json();
      const msg = document.getElementById('archived-msg');
      if (data.error) { msg.textContent = 'Error: ' + data.error; msg.className = 'save-msg err'; return; }
      await loadClients();
      await renderArchivedClients();
    };
  });

  const deleteBtn = document.getElementById('archived-delete-selected-btn');
  if (deleteBtn) deleteBtn.onclick = async () => {
    const checked = [...content.querySelectorAll('.archived-delete-check:checked')];
    const msg = document.getElementById('archived-msg');
    if (!checked.length) { msg.textContent = 'Tick at least one client first.'; msg.className = 'save-msg err'; return; }
    const names = checked.map((c) => c.dataset.name).join(', ');
    if (!confirm(`Permanently delete ${checked.length === 1 ? names : `${checked.length} clients (${names})`}? This deletes everything on file for them and cannot be undone.`)) return;
    for (const c of checked) {
      const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify({ type: 'delete_client', client_id: c.dataset.id }) });
      const data = await res.json();
      if (data.error) { msg.textContent = 'Error: ' + data.error; msg.className = 'save-msg err'; return; }
    }
    await loadClients();
    await renderArchivedClients();
  };
}

// preferredPeriod lets a save handler keep viewing the period it just wrote to
// instead of silently jumping to "most recent" — without this, saving data for
// an older period (e.g. a catch-up entry) would switch the whole app to showing
// a different period's numbers, making the save look like it didn't take.
async function loadPeriods(preferredPeriod) {
  const periods = await callRead('list_periods', currentClientId);
  availablePeriods = periods || [];
  currentPeriodEnd = (preferredPeriod && availablePeriods.includes(preferredPeriod)) ? preferredPeriod : (availablePeriods[0] || null);
  renderPeriodPills();
}

// Two separate top-bar pills — Year (FYxx) and Quarter/Half (Qx/Hx) — rather
// than one combined dropdown, so switching within a year or jumping years is
// two clicks apart instead of scanning one long flat list. The quarter pill
// hides entirely for annual clients (the year pill alone already picks a
// single date). These only ever list REAL periods (availablePeriods) — no
// speculative "+" candidates cluttering the list; adding a period that isn't
// on file yet is a separate, explicit action (see the "+ New period" panel)
// rather than something these pills try to offer inline. The one exception:
// if a period was just chosen via that panel and has no data saved yet,
// it's shown too (plainly, no marker) so the pills stay truthful about what
// you're actually looking at.
function renderPeriodPills() {
  const yearSel = document.getElementById('period-year-select');
  const qSel = document.getElementById('period-quarter-select');
  const cadence = currentCtx?.cadence;
  const fyEnd = currentCtx?.fy_end;
  const dates = [...availablePeriods];
  if (currentPeriodEnd && !dates.includes(currentPeriodEnd)) dates.push(currentPeriodEnd);

  if (!fyEnd || !dates.length) {
    yearSel.innerHTML = '<option value="">No data yet</option>';
    qSel.innerHTML = '';
    qSel.style.display = 'none';
    return;
  }
  const byYear = {};
  dates.forEach((p) => { const y = periodFyYear(p, fyEnd); (byYear[y] = byYear[y] || []).push(p); });
  Object.values(byYear).forEach((list) => list.sort());
  const years = Object.keys(byYear).sort((a, b) => b.localeCompare(a));

  const curFyYear = currentPeriodEnd ? periodFyYear(currentPeriodEnd, fyEnd) : null;
  const selYear = (curFyYear && byYear[curFyYear]) ? curFyYear : years[0];
  yearSel.innerHTML = years.map((y) => `<option value="${y}" ${y === selYear ? 'selected' : ''}>FY${y.slice(-2)}</option>`).join('');

  const periodsInYear = byYear[selYear] || [];
  const isSingle = cadence !== 'quarterly' && cadence !== 'half_yearly';
  qSel.style.display = isSingle ? 'none' : '';
  if (!currentPeriodEnd || !periodsInYear.includes(currentPeriodEnd)) currentPeriodEnd = periodsInYear[0] || null;
  qSel.innerHTML = periodsInYear.map((p) => {
    const tag = periodQuarterLabel(p, cadence, fyEnd).replace(/^FY\d+\s*/, '') || formatShortDate(p);
    return `<option value="${p}" ${p === currentPeriodEnd ? 'selected' : ''}>${tag}</option>`;
  }).join('');
}

async function refreshHealthBadge() {
  const badge = document.getElementById('health-badge');
  if (!currentPeriodEnd) { badge.textContent = 'Health: —'; return; }
  const overview = await callRead('get_overview', currentClientId, currentPeriodEnd);
  badge.textContent = overview?.healthScore ? `Health: ${overview.healthScore.score}/100` : 'Health: —';
}

function renderSidebarDomains() {
  const wrap = document.getElementById('domain-list');
  const domainBtn = (d) => {
    let dotClass = 'domain-dot';
    if (d.key === 'financial' && currentPeriodEnd && availablePeriods.includes(currentPeriodEnd)) dotClass += ' dot-done';
    if (d.key === 'goals' && currentPeriodEnd && GOAL_CATEGORIES.some((c) => (currentCtx?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.[c.key]?.items || []).some((it) => !it.deleted))) dotClass += ' dot-done';
    return `<button data-domain="${d.key}" class="${d.key === currentDomain ? 'active' : ''}"><span class="${dotClass}"></span>${d.label}</button>`;
  };
  // Three groups, one shared #domain-list container and delegated click
  // listener (still matches on data-domain regardless of which group a
  // button sits in) — Profile above Framework (setup, read by everything
  // else), Framework in the middle (the 5 intelligence domains), Decisions
  // below (the execution layer — Meeting/Plan/Report). See
  // PROFILE_DOMAIN/ACTIONS_DOMAIN for why each sits outside DOMAINS instead
  // of being a 6th/7th framework item.
  wrap.innerHTML = `<p class="muted sidebar-section-gap" style="margin-top:0;">${OVERVIEW_DOMAIN.label}</p>`
    + domainBtn(OVERVIEW_DOMAIN)
    + `<p class="muted sidebar-section-gap">Profile</p>`
    + domainBtn(PROFILE_DOMAIN)
    // Pill sits inline with the heading, not in the button list below it —
    // it's not a 6th framework item with its own dot/completeness state,
    // just a second, more visible entry point to the same topbar overlay
    // (renderFrameworkSummary); as a heading-row pill that's visually
    // distinct from the start, rather than reading as one more item at the
    // end of the domain list below (the topbar button alone wasn't
    // recognisable enough in practice, which is why this exists at all).
    + `<div class="muted sidebar-section-gap" style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
        <span>Framework</span>
        <button id="sidebar-framework-summary-btn" type="button" title="Everything the framework currently says, in one read" style="text-transform:none; letter-spacing:normal; display:flex; align-items:center; gap:3px; border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink-soft); font-family:var(--font-body); font-size:10px; padding:2px 7px; cursor:pointer;">📄 Summary</button>
      </div>`
    + DOMAINS.map(domainBtn).join('')
    + `<p class="muted sidebar-section-gap">${ACTIONS_DOMAIN.label}</p>`
    + domainBtn(ACTIONS_DOMAIN);
  document.getElementById('sidebar-framework-summary-btn').onclick = () => { frameworkSummaryOpen = true; renderMain(); };
}

function renderWorkflowTabsActive() {
  const overrides = WORKFLOW_LABEL_OVERRIDES[currentDomain] || {};
  [...document.querySelectorAll('#workflow-tabs button')].forEach((b) => {
    b.classList.toggle('active', b.dataset.workflow === currentWorkflow);
    b.textContent = overrides[b.dataset.workflow] || WORKFLOW_LABELS[b.dataset.workflow];
    b.style.display = isWorkflowVisible(b.dataset.workflow, currentDomain) ? '' : 'none';
  });
}

function updatePeriodSelectorState() {

  document.getElementById('period-disabled-note').style.display = 'none';

async function selectClient(id) {
  currentClientId = id;
  currentDomain = 'overview';
  currentWorkflow = 'input';
  goalSuggestionsCache = {};
  document.getElementById('workflow-tabs').style.display = '';
  document.getElementById('client-select').value = id;
  currentCtx = await callRead('get_context', id);
  document.getElementById('client-name').textContent = clientDisplayName(currentCtx, id);
  document.getElementById('client-subline').textContent = currentCtx?.cadence ? `${capCadence(currentCtx.cadence)} cadence` : '';
  await loadPeriods();
  // After loadPeriods (not before) so currentPeriodEnd is this client's own
  // — resolveTaxRatesForClient needs it to pick the right year's table entry
  // from TAX_RATES_BY_FY, not just the client's company-rate override.
  // Both independently, not from one shared value — see their own comment.
  taxOutlookRatesState = resolveTaxRatesForClient(currentCtx, auFinancialYearLabel(currentPeriodEnd));
  taxPositionRatesState = resolveTaxRatesForClient(currentCtx, auFinancialYearLabel(currentPeriodEnd));
  renderSidebarDomains();
  renderWorkflowTabsActive();
  updatePeriodSelectorState();
  refreshHealthBadge();
  renderMain();
}

    }
    msg.textContent = 'Creating…';
    msg.className = 'save-msg';
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({
          type: 'add_client',
          business_name,
          industry: document.getElementById('nc-industry').value.trim(),
          cadence: document.getElementById('nc-cadence').value,
          fy_end,
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      panel.style.display = 'none';
      await loadClients();
      await selectClient(data.saved.client_id);
    } catch (err) {
      msg.textContent = 'Error: ' + err.message;
      msg.className = 'save-msg err';
    }
  };
});

document.getElementById('domain-list').addEventListener('click', (e) => {

function onWorkflowClick(e) {

// Risk review actions (Confirm/Investigate/Not applicable/No longer a risk)
// — wired ONCE here rather than inside renderRiskAnalyse. #tab-content is a
// single persistent element that only ever gets its innerHTML replaced, not
// recreated, so an addEventListener call inside a function that reruns
// every time the Risk tab is opened (renderRiskAnalyse does, via renderMain)
// would stack up one extra listener per visit — every click on a status
// button would then fire the save, and the refresh, once per stacked
// listener, racing several overlapping refreshRiskLists() calls against
// each other. That's what was making the industry list's order look like it
// was shuffling itself and the whole section flicker/reset on a click: it
// wasn't one click, it was N of them landing at once. Delegation still
// catches buttons injected later (e.g. a business questionnaire's inline
// synthesis result), same as before — this only changes WHERE it's wired.
document.getElementById('tab-content').addEventListener('click', async (e) => {
  const delBtn = e.target.closest('.risk-delete-btn');
  if (delBtn) {
    if (!confirm('Delete this risk item permanently? This removes it entirely, not just marks it resolved — there\'s no undo.')) return;
    delBtn.disabled = true;
    const original = delBtn.textContent;
    delBtn.textContent = '…';
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'delete_risk_item', risk_item_id: delBtn.dataset.riskId, client_id: currentClientId }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      await refreshRiskLists();
    } catch (err) {
      delBtn.disabled = false;
      delBtn.textContent = original;
      alert('Error: ' + err.message);
    }
    return;
  }
  const adviceBtn = e.target.closest('.risk-advice-btn');
  if (adviceBtn) {
    adviceBtn.disabled = true;
    const original = adviceBtn.textContent;
    adviceBtn.textContent = 'Thinking…';
    const contentEl = adviceBtn.nextElementSibling;
    try {
      const res = await fetch('/.netlify/functions/risk-advice', {
        method: 'POST',
        body: JSON.stringify({
          risk_name: adviceBtn.dataset.riskName, detail: adviceBtn.dataset.riskDetail,
          category: adviceBtn.dataset.riskCategory, source: adviceBtn.dataset.riskSource,
          severity: adviceBtn.dataset.riskSeverity,
          client_context: currentCtx ? {
            business_description: currentCtx.business_description, industry: currentCtx.industry,
            entity_type: currentCtx.entity_type, structure_notes: currentCtx.structure_notes,
            years_trading: currentCtx.profile_extra?.years_trading, employee_count: currentCtx.profile_extra?.employee_count,
          } : null,
        }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      contentEl.textContent = result.advice;
      contentEl.style.display = 'block';
      adviceBtn.style.display = 'none';
    } catch (err) {
      adviceBtn.disabled = false;
      adviceBtn.textContent = original;
      alert('Error: ' + err.message);
    }
    return;
  }
  const btn = e.target.closest('.risk-action-btn');
  if (!btn) return;
  const buttonsInRow = btn.parentElement.querySelectorAll('.risk-action-btn');
  buttonsInRow.forEach((b) => { b.disabled = true; });
  const original = btn.textContent;
  btn.textContent = '…';
  try {
    const res = await fetch('/.netlify/functions/manual-entry', {
      method: 'POST',
      body: JSON.stringify({ type: 'risk_review_action', risk_item_id: btn.dataset.riskId, action: btn.dataset.riskAction }),
    });
    const result = await res.json();
    if (result.error) throw new Error(result.error);
    await refreshRiskLists();
  } catch (err) {
    buttonsInRow.forEach((b) => { b.disabled = false; });
    btn.textContent = original;
    alert('Error: ' + err.message);
  }
});

// Picking a period — existing or a "+ not yet on file" candidate — just
// updates the top bar and re-renders whatever screen is already open. It
// never navigates to Financial Input on its own; entering data for a new
// period is a separate, deliberate trip the user makes themselves.
function onPeriodPillChanged() {
  goalSuggestionsCache = {};
  refreshHealthBadge();
  renderSidebarDomains();
  renderMain();
}

document.getElementById('period-year-select').addEventListener('change', () => {
  // Jumping year: land on that year's most recent real period if it has
  // one; otherwise fall back to that year's own Q4/H2/annual date so
  // there's always something sensible selected, even for a year with no
  // data on file yet.
  const targetYear = document.getElementById('period-year-select').value;
  const cadence = currentCtx.cadence, fyEnd = currentCtx.fy_end;
  const realInYear = availablePeriods.filter((p) => periodFyYear(p, fyEnd) === targetYear).sort();
  const periodsPerYear = cadence === 'quarterly' ? 4 : cadence === 'half_yearly' ? 2 : 1;
  currentPeriodEnd = realInYear[realInYear.length - 1] || periodEndFromFyYearAndNumber(Number(targetYear), periodsPerYear, cadence, fyEnd);
  renderPeriodPills();
  onPeriodPillChanged();
});

document.getElementById('period-quarter-select').addEventListener('change', (e) => {
  currentPeriodEnd = e.target.value || null;
  onPeriodPillChanged();
});

// "+ New period" opens a small explicit form — type the financial year and
// pick the quarter/half (for quarterly/half-yearly clients) directly, e.g.
// "FY29 Q1" — rather than expecting the pills above to double as an "add"
// control. The year is a free-typed number, not a bounded dropdown — there's
// no reason a client's history or plans should be capped to some arbitrary
// window. Confirming just selects that date at the top and stays on
// whatever screen is already open; nothing is saved until the user actually
// enters data for it (Financial Input or any other input screen).
function populateNewPeriodForm() {
  const cadence = currentCtx?.cadence;
  const fyEnd = currentCtx?.fy_end;
  const defaultValue = computeAddNextPeriodValue(cadence, fyEnd, availablePeriods[0] || null);
  const anchor = availablePeriods[0] ? Number(periodFyYear(availablePeriods[0], fyEnd)) : new Date().getUTCFullYear();
  const defaultYear = defaultValue ? Number(periodFyYear(defaultValue, fyEnd)) : anchor;
  const defaultPeriodNumber = defaultValue ? periodNumberOf(defaultValue, cadence, fyEnd) : 1;

  document.getElementById('np-year').value = defaultYear;

  const qWrap = document.getElementById('np-quarter-wrap');
  const qSel = document.getElementById('np-quarter');
  const isSingle = cadence !== 'quarterly' && cadence !== 'half_yearly';
  qWrap.style.display = isSingle ? 'none' : '';
  const periodsPerYear = cadence === 'quarterly' ? 4 : 2;
  const qLabel = cadence === 'quarterly' ? 'Q' : 'H';
  qSel.innerHTML = Array.from({ length: periodsPerYear }, (_, i) => i + 1)
    .map((n) => `<option value="${n}" ${n === defaultPeriodNumber ? 'selected' : ''}>${qLabel}${n}</option>`).join('');
  validateNewPeriodForm();
}

// Live-checked as year/quarter change (not just on Go) — a combination that
// already exists greys the button out immediately, rather than only telling
// the user after they click. Returns the target date when it's addable, or
// null when the form is invalid/a duplicate.
function validateNewPeriodForm() {
  const cadence = currentCtx?.cadence;
  const fyEnd = currentCtx?.fy_end;
  const msg = document.getElementById('np-msg');
  const goBtn = document.getElementById('np-go-btn');
  const year = Number(document.getElementById('np-year').value);
  if (!year) {
    msg.textContent = 'Enter a year.';
    msg.className = 'save-msg';
    goBtn.disabled = true;
    return null;
  }
  const isSingle = cadence !== 'quarterly' && cadence !== 'half_yearly';
  const periodNumber = isSingle ? 1 : Number(document.getElementById('np-quarter').value);
  const target = periodEndFromFyYearAndNumber(year, periodNumber, cadence, fyEnd);
  if (availablePeriods.includes(target)) {
    msg.textContent = `FY${String(year).slice(-2)}${isSingle ? '' : ` ${qLabelFor(cadence)}${periodNumber}`} already exists — use the pills above to view it.`;
    msg.className = 'save-msg err';
    goBtn.disabled = true;
    return null;
  }
  msg.textContent = '';
  goBtn.disabled = false;
  return target;
}

function qLabelFor(cadence) { return cadence === 'quarterly' ? 'Q' : 'H'; }

// Jumps straight into Financial Input, already pointed at the next period —
// one click, since "add a new period" almost always means "I want to enter

// ---- Main render dispatch ----
// Wraps the actual dispatch so every screen — not just Financial Input —
// gets the "this period isn't saved yet" banner appended afterward, without
// each of the ~10 render functions needing to remember to call it
// themselves.
async function renderMain() {
  await renderMainDispatch();
  refreshUnsavedPeriodBanner();
}

async function renderMainDispatch() {
  renderToken += 1;
  const content = document.getElementById('tab-content');
  // The wizard's nav bar is a persistent element OUTSIDE #tab-content (see
  // its declaration comment) — every non-meeting render must explicitly
  // hide it, since nothing else clears it automatically.
  const navBar = document.getElementById('meeting-nav-bar');
  if (currentWorkflow !== 'meeting') navBar.style.display = 'none';
  if (!currentClientId) { content.innerHTML = ''; return; }
  // Cash/Tax outlook's scratch scenario state is per client+period (see
  // restoreScenarioStateIfNeeded) — this is the one funnel point every
  // navigation change passes through, so it's the one place that needs to
  // notice a client/period switch and swap the in-memory state for it,
  // rather than trying to catch every currentClientId/currentPeriodEnd
  // assignment site individually.
  restoreScenarioStateIfNeeded();
  // Same funnel-point reasoning as restoreScenarioStateIfNeeded above —
  // clears cameFromMeetingLink (see its own comment) the moment you're
  // looking at anything other than Actions' own Input tab, so "← Back to
  // meeting" only ever shows right after actually arriving via a "View in
  // Actions" link, not indefinitely just because a meeting happens to be
  // left in progress for this client/period.
  if (!(currentDomain === 'actions' && currentWorkflow === 'input')) cameFromMeetingLink = false;
  if (frameworkSummaryOpen) return renderFrameworkSummary(content);

  if (currentWorkflow === 'meeting') return renderMeetingWizardStep(content);
  if (currentWorkflow === 'report') return renderReportTab(content);

  if (currentDomain === 'financial') {
    if (currentWorkflow === 'input') return renderFinancialInput(content);
    if (currentWorkflow === 'analyse') return renderFinancialAnalyse(content);
    if (currentWorkflow === 'diagnose') return renderFinancialDiagnose(content);
  }

  if (currentDomain === 'profile') return renderGoalsProfile(content);
  if (currentDomain === 'overview') return renderOverviewTab(content);

  if (currentDomain === 'goals') {
    if (currentWorkflow === 'input') return renderGoalsInput(content);
    return renderPlaceholder(content, `Goals — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet.`);
  }

  if (currentDomain === 'risk') {
    if (currentWorkflow === 'analyse') return renderRiskAnalyse(content);
    return renderPlaceholder(content, `Risk — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet.`);
  }

  if (currentDomain === 'growth') {
    if (currentWorkflow === 'analyse') return renderGrowthAnalyse(content);
    return renderPlaceholder(content, `Growth — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet.`);
  }

  if (currentDomain === 'owner') {
    if (currentWorkflow === 'input') return renderOwnerInput(content);
    if (currentWorkflow === 'analyse') return renderOwnerAnalyse(content);
    return renderPlaceholder(content, `Owner & Succession — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet.`);
  }

  if (currentDomain === 'actions') {
    if (currentWorkflow === 'input') return renderActionsView(content);
    return renderPlaceholder(content, `${ACTIONS_DOMAIN.label} — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet.`);
  }

  const domainLabel = DOMAINS.find((d) => d.key === currentDomain)?.label || currentDomain;
  return renderPlaceholder(content, `${domainLabel} — ${WORKFLOW_LABELS[currentWorkflow]} isn't wired up yet. This domain is still placeholder only, no real data behind it.`);
}

// The period picked from the top bar is only real once a financial snapshot
// has actually been saved against it (see list_periods — driven entirely by
// financial_snapshots rows) — until then it's just an in-memory selection,
// and anything entered on a non-financial screen (Profile, Goals, Risk...)
// for it won't persist as "this period's data" the way it looks like it
// should. Surfacing that here, on every screen, rather than leaving it
// silent, is the fix for someone picking a new period, wandering into
// Profile, and having no idea nothing they're about to do will stick to it.
function refreshUnsavedPeriodBanner() {
  document.getElementById('unsaved-period-banner')?.remove();
  const content = document.getElementById('tab-content');
  if (!content || !currentClientId || !currentPeriodEnd || availablePeriods.includes(currentPeriodEnd)) return;
  const alreadyOnInput = currentDomain === 'financial' && currentWorkflow === 'input';
  content.insertAdjacentHTML('afterbegin', `
    <div class="flag" id="unsaved-period-banner" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <span>⚠ ${formatShortDate(currentPeriodEnd)} needs a financial snapshot saved to create it as a real period — nothing will be saved otherwise.</span>
      ${alreadyOnInput ? '' : `<button type="button" id="unsaved-period-goto-btn" class="mini-link" style="flex-shrink:0;">→ Go to Financial Input</button>`}
    </div>
  `);
  const btn = document.getElementById('unsaved-period-goto-btn');
  if (btn) btn.onclick = () => {
    currentDomain = 'financial';
    currentWorkflow = 'input';
    currentEntrySubtab = 'manual';
    renderSidebarDomains();
    renderWorkflowTabsActive();
    renderMain();
  };
}

function renderPlaceholder(content, message) {
  content.innerHTML = `<div class="card placeholder"><p class="muted">Not yet wired</p><p class="muted plain" style="margin:0;">${message}</p></div>`;
}

// ---- Financial Performance: Input ----
async function renderFinancialInput(content) {
  content.innerHTML = `
    <div class="subtabs" id="entry-subtabs">
      <button data-sub="manual" class="${currentEntrySubtab === 'manual' ? 'active' : ''}">Manual entry</button>
      <button data-sub="pdf" class="${currentEntrySubtab === 'pdf' ? 'active' : ''}">Upload PDF</button>
      <button data-sub="xero" class="${currentEntrySubtab === 'xero' ? 'active' : ''}">Xero sync</button>
    </div>
    <div id="entry-subcontent"></div>
  `;
  document.getElementById('entry-subtabs').addEventListener('click', (e) => {
    if (e.target.dataset.sub) {
      renderToken += 1; // invalidates any in-flight async work from the sub-tab being left
      currentEntrySubtab = e.target.dataset.sub;
      renderFinancialInput(content);
    }
  });
  const sub = document.getElementById('entry-subcontent');
  if (currentEntrySubtab === 'manual') return renderManualEntry(sub);
  if (currentEntrySubtab === 'pdf') return renderPdfUpload(sub);
  if (currentEntrySubtab === 'xero') return renderXeroSync(sub);
}

// One mini-form per client division: revenue/cogs/wages/operating_expenses/
// debtors/creditors, same labels as the general grid. The general grid's own
// inputs for these six fields become read-only totals fed from this block
// (see recalcDivisionTotals in renderManualEntry) — never entered directly
// once a client has divisions, so the two can never disagree with each other
// client-side either, matching the server's own "always derived" rule.
function renderDivisionInputRow(division) {
  return `
    <div class="card" data-me-division-id="${division.id}" style="margin-bottom:10px;">
      <p class="muted plain" style="margin:0 0 8px; font-weight:600;">${division.name}</p>
      <div class="form-grid">
        ${DIVISION_FIELD_DEFS.map(([key, label]) => `
          <div class="form-field"><label>${label}</label><input type="number" step="1000" class="me-division-field" data-me-division-field="${key}" /></div>
        `).join('')}
      </div>
    </div>
  `;
}

async function renderManualEntry(content) {
  if (!currentCtx?.fy_end) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">Financial year end not set</p><p class="muted plain" style="margin:0;">Set this client's financial year end in Profile before entering financial data — period-end dates are derived from it.</p></div>`;
    return;
  }
  const divisions = currentCtx.divisions || [];
  content.innerHTML = `
    <div class="card">
      <p class="muted">Financial snapshot — manual entry</p>
      <div class="form-field">
        <label>Period end date</label>
        ${periodPickerHtml('me-period-end', currentCtx.cadence, currentCtx.fy_end, currentPeriodEnd, availablePeriods[0] || null)}
      </div>
      <p class="muted plain" id="me-existing-note" style="margin:-4px 0 10px; display:none;"></p>
    </div>
    ${divisions.length ? `
      <div class="card">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin:0;">
          <input type="checkbox" id="me-split-toggle" />
          <span class="muted" style="margin:0;">Split this period by division</span>
        </label>
        <p class="muted plain" style="margin:6px 0 0; font-size:11px;">A per-period choice, not all-or-nothing — only turn this on for a period you actually have a divisional breakdown for; most periods can stay blended. Manage the division list itself in Profile.</p>
      </div>
      <div id="me-divisions-block" style="display:none;">
        <p class="muted plain" style="margin:0 0 8px;">Revenue, COGS, wages, operating expenses, debtors and creditors are entered per division below; everything else is entity-level, entered once in the general fields further down.</p>
        <div id="me-divisions">${divisions.map((d) => renderDivisionInputRow(d)).join('')}</div>
      </div>
    ` : ''}
    <div class="card">
      <div class="form-grid" id="me-financial-fields"></div>
      <button class="action" id="me-save-financials" style="margin-top:10px;">Save financial snapshot</button>
      <div class="save-msg" id="me-financials-msg"></div>
    </div>
  `;

  const fieldsEl = document.getElementById('me-financial-fields');
  FINANCIAL_FIELD_DEFS.forEach(([key, label]) => {
    const div = document.createElement('div');
    div.className = 'form-field';
    div.innerHTML = `<label>${label}</label><input type="number" step="1000" id="me-${key}" />
       ${DIVISION_DERIVED_FIELDS.has(key) ? `<p class="muted plain" id="me-derived-hint-${key}" style="margin:2px 0 0; font-size:11px; display:none;">= sum of divisions</p>` : ''}`;
    fieldsEl.appendChild(div);
    wireMoneyInputPreview(document.getElementById(`me-${key}`));
  });

  // Live-recomputes the six general-field totals from whatever's currently
  // typed into the division rows — same null-safe-sum rule saveFinancials
  // applies server-side (blank across every division stays blank, not a
  // fabricated 0), so what's shown here before Save matches what gets saved.
  const recalcDivisionTotals = () => {
    DIVISION_FIELD_DEFS.forEach(([key]) => {
      const values = [...document.querySelectorAll(`[data-me-division-field="${key}"]`)]
        .map((input) => input.value)
        .filter((v) => v !== '');
      const input = document.getElementById(`me-${key}`);
      if (input) input.value = values.length ? values.reduce((sum, v) => sum + Number(v), 0) : '';
    });
    refreshMoneyInputPreviews(fieldsEl);
  };
  document.querySelectorAll('.me-division-field').forEach((input) => { wireMoneyInputPreview(input); input.oninput = recalcDivisionTotals; });

  // Toggling is the per-period on/off switch: ON shows the division rows and
  // makes the six shared general fields read-only totals fed from them
  // (never entered directly while split, so the two can't disagree); OFF
  // hides the rows and hands those six fields back for direct entry, same
  // as a client with no divisions at all — this period's data just won't
  // carry a division_breakdown when saved (see saveFinancials).
  const setSplitMode = (enabled) => {
    const block = document.getElementById('me-divisions-block');
    if (block) block.style.display = enabled ? '' : 'none';
    DIVISION_FIELD_DEFS.forEach(([key]) => {
      const input = document.getElementById(`me-${key}`);
      const hint = document.getElementById(`me-derived-hint-${key}`);
      if (input) input.disabled = enabled;
      if (hint) hint.style.display = enabled ? '' : 'none';
    });
    if (enabled) recalcDivisionTotals();
  };
  const splitToggle = document.getElementById('me-split-toggle');
  if (splitToggle) splitToggle.onchange = (e) => setSplitMode(e.target.checked);

  // Without this, switching to a period that already has data (from a prior
  // manual entry, PDF, or Xero sync) silently showed blank fields — making it
  // look like the earlier save "didn't stick," and risking overwriting real
  // figures with blanks if the user hit Save without noticing. Reuses the
  // shared renderToken (bumped by renderMain and the Input sub-tab switcher)
  // rather than a separate token, so navigating away by ANY route — not just
  // back into Manual Entry — correctly invalidates this in-flight fetch.
  const myFillToken = renderToken;
  async function fillFromExisting(periodEnd) {
    const existing = await callRead('get_kpi_report', currentClientId, periodEnd);
    if (myFillToken !== renderToken) return;
    const snap = existing?.snapshot || null;
    // Always fill every general field directly from the saved snapshot first
    // — entity-level values are correct whether or not THIS period turns out
    // to be split, so this is the right base state either way.
    FINANCIAL_FIELD_DEFS.forEach(([key]) => {
      const input = document.getElementById(`me-${key}`);
      if (input) input.value = (snap && snap[key] != null) ? snap[key] : '';
    });
    if (divisions.length) {
      const breakdown = snap?.division_breakdown || [];
      const hasSplit = breakdown.length > 0;
      divisions.forEach((d) => {
        const entry = breakdown.find((b) => b.division_id === d.id);
        const row = content.querySelector(`[data-me-division-id="${d.id}"]`);
        DIVISION_FIELD_DEFS.forEach(([key]) => {
          const input = row?.querySelector(`[data-me-division-field="${key}"]`);
          if (input) input.value = (entry && entry[key] != null) ? entry[key] : '';
        });
      });
      // Reflects what's ACTUALLY saved for this specific period — not a
      // sticky "always split" setting — so a new/blank period, or one that
      // was previously saved blended, correctly opens with the toggle off.
      document.getElementById('me-split-toggle').checked = hasSplit;
      setSplitMode(hasSplit);
    }
    refreshMoneyInputPreviews(content);
    const note = document.getElementById('me-existing-note');
    if (note) {
      note.style.display = snap ? 'block' : 'none';
      note.textContent = snap ? `Showing existing ${snap.source || 'saved'} data for this period — saving will overwrite it.` : '';
    }
  }

  wirePeriodPicker('me-period-end', currentCtx.cadence, currentCtx.fy_end, fillFromExisting, availablePeriods[0] || null, true);
  await fillFromExisting(document.getElementById('me-period-end').value);
  // If the user navigated away (e.g. to a different Input sub-tab) while that
  // fetch was in flight, this whole render is stale — the fields/button it's
  // about to wire up no longer exist in the DOM.
  if (myFillToken !== renderToken) return;

  document.getElementById('me-save-financials').onclick = async () => {
    const msg = document.getElementById('me-financials-msg');
    msg.textContent = 'Saving…';
    msg.className = 'save-msg';
    const body = {
      type: 'financials',
      client_id: currentClientId,
      period_end: document.getElementById('me-period-end').value,
    };
    FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = document.getElementById(`me-${key}`).value; });
    if (divisions.length && document.getElementById('me-split-toggle').checked) {
      body.division_breakdown = divisions.map((d) => {
        const row = content.querySelector(`[data-me-division-id="${d.id}"]`);
        const entry = { division_id: d.id };
        DIVISION_FIELD_DEFS.forEach(([key]) => { entry[key] = row?.querySelector(`[data-me-division-field="${key}"]`)?.value ?? ''; });
        return entry;
      });
    }
    try {
      const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      msg.textContent = 'Saved.';
      msg.className = 'save-msg ok';
      await loadPeriods(body.period_end);
      refreshHealthBadge();
      renderSidebarDomains();
      // loadPeriods refreshes the top-bar dropdown, but this form's OWN
      // period picker was already rendered before the save — without
      // rebuilding it too, the period you just saved never shows up as a
      // pill here, even though it genuinely saved. Re-rendering the whole
      // form also re-selects the period you just saved (loadPeriods set
      // currentPeriodEnd to it) and re-fills it from what's now on file,
      // doubling as visible confirmation the save actually took.
      await renderManualEntry(content);
      refreshUnsavedPeriodBanner();
      return;
    } catch (err) {
      msg.textContent = 'Error: ' + err.message;
      msg.className = 'save-msg err';
    }
  };
}

async function renderPdfUpload(content) {
  if (!currentCtx?.fy_end) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">Financial year end not set</p><p class="muted plain" style="margin:0;">Set this client's financial year end in Profile before entering financial data — period-end dates are derived from it.</p></div>`;
    return;
  }
  content.innerHTML = `
    <div class="card">
      <p class="muted">Upload financial statement PDF</p>
      <p class="muted plain" style="margin-top:-4px;">For MYOB, Reckon, or any statement not coming from Xero. Claude reads the PDF and extracts the figures — nothing is saved until you review and confirm.</p>
      <div class="form-field">
        <label>Period end date</label>
        ${periodPickerHtml('pdf-period-end', currentCtx.cadence, currentCtx.fy_end, currentPeriodEnd, availablePeriods[0] || null, true)}
      </div>
      <div class="form-field">
        <label>PDF file</label>
        <input type="file" id="pdf-file" accept="application/pdf" />
      </div>
      <button class="action" id="pdf-extract-btn">Extract from PDF</button>
      <div id="pdf-result" style="margin-top:12px;"></div>
    </div>
  `;
  wirePeriodPicker('pdf-period-end', currentCtx.cadence, currentCtx.fy_end, undefined, availablePeriods[0] || null, true, true);

  document.getElementById('pdf-extract-btn').onclick = async () => {
    const fileInput = document.getElementById('pdf-file');
    const resultEl = document.getElementById('pdf-result');
    if (!fileInput.files[0]) { resultEl.innerHTML = '<div class="flag">Choose a PDF first.</div>'; return; }
    resultEl.textContent = 'Reading PDF…';

    const file = fileInput.files[0];
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    try {
      const res = await fetch('/.netlify/functions/pdf-extract', {
        method: 'POST',
        body: JSON.stringify({
          client_id: currentClientId,
          period_end: document.getElementById('pdf-period-end').value,
          pdf_base64: base64,
        }),
      });
      // The function can be killed by the platform's execution timeout on a
      // large/complex PDF, which returns a plain-text body (e.g. "TimeoutError:
      // ..."), not JSON — parse as text first so that shows as a clear message
      // instead of a raw "Unexpected token" JSON.parse error.
      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch {
        throw new Error(res.ok ? 'Server returned an unexpected response.' : `Extraction took too long or failed (${res.status}). This can happen with a large or complex PDF — try a smaller/clearer file, or enter this period manually instead.`);
      }
      if (data.error) throw new Error(data.error);
      await renderPdfReview(resultEl, data);
    } catch (err) {
      resultEl.innerHTML = `<div class="flag">Error: ${err.message}</div>`;
    }
  };
}

// Loose match so "Jim's Auto Service" (Profile) and "Jim Chaillon's Auto
// Service" (as the PDF happens to name it — a real case, confirmed against
// an actual client document) still line up by default. Word-overlap rather
// than substring containment: a plain substring check fails exactly this
// case, since "jimsautoservice" isn't a contiguous substring of
// "jimchaillonsautoservice" once a middle name is inserted. Always just a
// pre-fill default: the review screen's own source dropdown lets the
// accountant override or blank it out either way.
function normalizeDivisionWords(s) { return String(s || '').toLowerCase().replace(/'/g, '').split(/[^a-z0-9]+/).filter(Boolean); }
function bestDivisionMatchIndex(configuredName, extractedDivisions) {
  const words = new Set(normalizeDivisionWords(configuredName));
  if (!words.size) return null;
  let bestIdx = null, bestScore = 0;
  extractedDivisions.forEach((d, i) => {
    const score = normalizeDivisionWords(d.name).filter((w) => words.has(w)).length;
    if (score > bestScore) { bestScore = score; bestIdx = i; }
  });
  return bestScore > 0 ? bestIdx : null;
}

async function renderPdfReview(container, data) {
  const notFoundHtml = data.not_found?.length
    ? `<div class="flag">Not found in PDF: ${data.not_found.join(', ')} — left as 0, fill in manually if known.</div>` : '';
  const notesHtml = data.notes ? `<div class="flag">Note: ${data.notes}</div>` : '';
  const comp = data.comparative;
  const configuredDivisions = currentCtx.divisions || [];
  const extractedDivisions = data.divisions || [];
  const noDivisionsSetUpNote = (!configuredDivisions.length && extractedDivisions.length)
    ? `<div class="flag">This document shows figures split across ${extractedDivisions.length} division${extractedDivisions.length === 1 ? '' : 's'} (${extractedDivisions.map((d) => d.name).join(', ')}) — only the combined totals below will be saved. Set up divisions in this client's Profile first to capture them separately.</div>`
    : '';
  // Claude may only give a rough label ("prior year") rather than an exact
  // date — only pre-select it in the picker if it actually looks like one of
  // the valid cadence-derived dates; otherwise fall back to the picker's own
  // default rather than silently drop an unparseable guess into the field.
  const compDateLooksValid = comp?.period_end && /^\d{4}-\d{2}-\d{2}$/.test(comp.period_end);
  const initialCompDate = compDateLooksValid ? comp.period_end : null;

  // Fetched fresh (not the possibly-stale global) so a comparative column from
  // a LATER upload can't silently overwrite a period that already has fuller
  // data from its own direct upload — e.g. uploading FY22's statement (with an
  // abbreviated FY21 comparative column) shouldn't clobber FY21's own full
  // statement, already saved when FY21 was uploaded directly.
  const existingPeriods = comp ? (await callRead('list_periods', currentClientId) || []) : [];

  container.innerHTML = `
    ${notFoundHtml}${notesHtml}${noDivisionsSetUpNote}
    <p class="muted">Review extracted figures before saving</p>
    ${configuredDivisions.length ? `
      <div class="card">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin:0;">
          <input type="checkbox" id="pdfrev-split-toggle" ${extractedDivisions.length ? 'checked' : ''} />
          <span class="muted" style="margin:0;">Split this period by division</span>
        </label>
        <p class="muted plain" style="margin:6px 0 0; font-size:11px;">${extractedDivisions.length ? 'This document shows a divisional breakdown — pre-checked, but turn it off to save this period blended instead.' : 'This document doesn’t appear to show a divisional breakdown — turn this on only if you want to enter one manually.'} A per-period choice, not all-or-nothing.</p>
      </div>
      <div id="pdf-review-divisions-block" style="display:${extractedDivisions.length ? '' : 'none'};">
      <p class="muted plain" style="margin:0 0 8px;">The PDF's own per-division figures are pre-filled below where a division name could be matched; check/correct against the source document, or pick a different one to fill from.</p>
      <div id="pdf-review-divisions">${configuredDivisions.map((d) => {
        const matchIdx = bestDivisionMatchIndex(d.name, extractedDivisions);
        const matched = matchIdx != null ? extractedDivisions[matchIdx] : null;
        return `
          <div class="card" data-pdfrev-division-id="${d.id}" style="margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
              <p class="muted plain" style="margin:0; font-weight:600;">${d.name}</p>
              <select class="pdfrev-division-source" data-pdfrev-division-source style="font-size:12px; font-family:var(--font-body); border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); color:var(--ink); padding:5px;">
                <option value="">— none, enter manually —</option>
                ${extractedDivisions.map((ed, i) => `<option value="${i}" ${matchIdx === i ? 'selected' : ''}>Fill from PDF's "${ed.name}"</option>`).join('')}
              </select>
            </div>
            <div class="form-grid">
              ${DIVISION_FIELD_DEFS.map(([key, label]) => `
                <div class="form-field"><label>${label}</label><input type="number" step="1000" class="pdfrev-division-field" data-pdfrev-division-field="${key}" value="${matched && matched[key] != null ? matched[key] : ''}" /></div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('')}</div>
      </div>
    ` : ''}
    <div class="form-grid" id="pdf-review-fields"></div>
    <button class="action" id="pdf-confirm-save" style="margin-top:10px;">Confirm &amp; save</button>
    <div class="save-msg" id="pdf-save-msg"></div>
    ${comp ? `
      <div class="card" style="margin-top:16px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="pdf-comp-enable" />
          <span class="muted" style="margin:0;">Comparative period found in this PDF${compDateLooksValid ? '' : ` (labelled "${comp.period_end || 'unknown'}" — pick the actual date)`} — also save it?</span>
        </label>
        <p class="muted plain" id="pdf-comp-warning" style="margin:6px 0 0; color:var(--rust); display:none;"></p>
        <div id="pdf-comp-body" style="margin-top:12px; display:none;">
          <div class="form-field">
            <label>Comparative period end date</label>
            ${periodPickerHtml('pdfcomp-period-end', currentCtx.cadence, currentCtx.fy_end, initialCompDate)}
          </div>
          <div class="form-grid" id="pdf-comp-fields" style="margin-top:10px;"></div>
        </div>
      </div>
    ` : ''}
  `;
  const fieldsEl = document.getElementById('pdf-review-fields');
  FINANCIAL_FIELD_DEFS.forEach(([key, label]) => {
    const div = document.createElement('div');
    div.className = 'form-field';
    // Genuinely blank (not 0) when Claude didn't find it — a real $0 and "not
    // extracted" are different things, and defaulting to 0 here would hide that.
    const notFound = data.not_found?.includes(key);
    const val = data.extracted?.[key];
    const valAttr = (val === undefined || val === null) ? '' : `value="${val}"`;
    div.innerHTML = `<label>${label}${notFound ? ' <span class="muted plain" style="display:inline; color:var(--rust);">(not found)</span>' : ''}</label><input type="number" step="1000" id="pdfrev-${key}" placeholder="${notFound ? 'not found — fill in if known' : ''}" ${valAttr} />`;
    fieldsEl.appendChild(div);
  });

  // Switching a division's source re-fills its six fields from whichever
  // extracted division was picked (or blanks them for "enter manually") —
  // doesn't touch anything already typed in the OTHER fields on the page.
  container.querySelectorAll('[data-pdfrev-division-source]').forEach((select) => {
    select.onchange = () => {
      const row = select.closest('[data-pdfrev-division-id]');
      const ed = select.value === '' ? null : extractedDivisions[Number(select.value)];
      DIVISION_FIELD_DEFS.forEach(([key]) => {
        const input = row.querySelector(`[data-pdfrev-division-field="${key}"]`);
        if (input) input.value = (ed && ed[key] != null) ? ed[key] : '';
      });
    };
  });

  const pdfSplitToggle = document.getElementById('pdfrev-split-toggle');
  if (pdfSplitToggle) pdfSplitToggle.onchange = (e) => {
    document.getElementById('pdf-review-divisions-block').style.display = e.target.checked ? '' : 'none';
  };

  if (comp) {
    const compFieldsEl = document.getElementById('pdf-comp-fields');
    FINANCIAL_FIELD_DEFS.forEach(([key, label]) => {
      const div = document.createElement('div');
      div.className = 'form-field';
      const notFound = comp.not_found?.includes(key);
      const val = comp.extracted?.[key];
      const valAttr = (val === undefined || val === null) ? '' : `value="${val}"`;
      div.innerHTML = `<label>${label}${notFound ? ' <span class="muted plain" style="display:inline; color:var(--rust);">(not found)</span>' : ''}</label><input type="number" step="1000" id="pdfcomp-${key}" placeholder="${notFound ? 'not found — fill in if known' : ''}" ${valAttr} />`;
      compFieldsEl.appendChild(div);
    });

    const compEnable = document.getElementById('pdf-comp-enable');
    const compWarning = document.getElementById('pdf-comp-warning');
    // Defaults to UNCHECKED (and warns) whenever the selected comparative date
    // already has saved data — "don't put the data in again" is the safe
    // default; saving over it is still one click away if that's genuinely wanted.
    const updateForDate = (dateVal) => {
      const alreadyExists = existingPeriods.includes(dateVal);
      compWarning.style.display = alreadyExists ? 'block' : 'none';
      compWarning.textContent = alreadyExists ? `${formatShortDate(dateVal)} already has saved data — leave unchecked to keep it as-is, or check to overwrite with this PDF's comparative figures.` : '';
      compEnable.checked = !alreadyExists;
      document.getElementById('pdf-comp-body').style.display = compEnable.checked ? 'block' : 'none';
    };
    updateForDate(initialCompDate || document.getElementById('pdfcomp-period-end').value);

    wirePeriodPicker('pdfcomp-period-end', currentCtx.cadence, currentCtx.fy_end, updateForDate);
    compEnable.onchange = (e) => {
      document.getElementById('pdf-comp-body').style.display = e.target.checked ? 'block' : 'none';
    };
  }

  document.getElementById('pdf-confirm-save').onclick = async () => {
    const msg = document.getElementById('pdf-save-msg');
    msg.textContent = 'Saving…';
    msg.className = 'save-msg';
    const body = { type: 'financials', client_id: data.client_id, period_end: data.period_end };
    FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = document.getElementById(`pdfrev-${key}`).value; });
    if (configuredDivisions.length && document.getElementById('pdfrev-split-toggle')?.checked) {
      body.division_breakdown = configuredDivisions.map((d) => {
        const row = container.querySelector(`[data-pdfrev-division-id="${d.id}"]`);
        const entry = { division_id: d.id };
        DIVISION_FIELD_DEFS.forEach(([key]) => { entry[key] = row?.querySelector(`[data-pdfrev-division-field="${key}"]`)?.value ?? ''; });
        return entry;
      });
    }

    const saveComp = comp && document.getElementById('pdf-comp-enable')?.checked;
    const compBody = saveComp ? { type: 'financials', client_id: data.client_id, period_end: document.getElementById('pdfcomp-period-end').value } : null;
    if (saveComp) FINANCIAL_FIELD_DEFS.forEach(([key]) => { compBody[key] = document.getElementById(`pdfcomp-${key}`).value; });

    try {
      const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
      const saved = await res.json();
      if (saved.error) throw new Error(saved.error);
      if (compBody) {
        const compRes = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(compBody) });
        const compSaved = await compRes.json();
        if (compSaved.error) throw new Error('Main period saved, but comparative failed: ' + compSaved.error);
      }
      msg.textContent = compBody ? 'Saved both periods.' : 'Saved.';
      msg.className = 'save-msg ok';
      await loadPeriods(body.period_end);
      refreshHealthBadge();
      renderSidebarDomains();
      // Same fix as Manual Entry's save handler — loadPeriods refreshes the
      // top-bar dropdown, but this screen (still showing "review extracted
      // figures") doesn't reflect the save at all otherwise. Back to a
      // fresh upload screen, which now picks up the just-saved period via
      // the refreshed availablePeriods/currentPeriodEnd.
      await renderPdfUpload(document.getElementById('tab-content'));
      refreshUnsavedPeriodBanner();
      return;
    } catch (err) {
      msg.textContent = 'Error: ' + err.message;
      msg.className = 'save-msg err';
    }
  };
}

async function renderXeroSync(content) {
  if (!currentCtx?.fy_end) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">Financial year end not set</p><p class="muted plain" style="margin:0;">Set this client's financial year end in Profile before syncing — period-end dates are derived from it.</p></div>`;
    return;
  }
  const myToken = renderToken;
  const status = await callRead('get_xero_status', currentClientId);
  if (myToken !== renderToken) return;
  // No connect/reconnect flow exists yet — this only reports whether a
  // xero_connections row already exists for this client (set up outside the
  // app). The picker and button still render either way (same familiar
  // layout as before) — Sync is just disabled with a clear reason, rather
  // than clicking it dumping xero-pull.js's raw {"error": "No Xero
  // connection found..."} JSON on screen.
  const connected = !!status?.connected;
  const lastSynced = status?.last_synced_at ? new Date(status.last_synced_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : null;
  content.innerHTML = `
    <p class="muted plain">Sync a period's financials from Xero.${connected && lastSynced ? ` Last synced ${lastSynced}.` : ''}</p>
    ${connected ? '' : `<div class="flag">⚠ This client isn't connected to Xero yet — there's no in-app way to connect one. Use Manual Entry or Upload PDF instead for now.</div>`}
    <div class="form-field">
      <label>Period end date</label>
      ${periodPickerHtml('xero-period-end', currentCtx.cadence, currentCtx.fy_end, currentPeriodEnd, availablePeriods[0] || null, true)}
    </div>
    <button class="action" id="sync-btn" ${connected ? '' : 'disabled'} title="${connected ? '' : 'Not connected to Xero'}">Sync from Xero</button>
    <div id="entry-result" style="margin-top:12px;"></div>`;
  wirePeriodPicker('xero-period-end', currentCtx.cadence, currentCtx.fy_end, undefined, availablePeriods[0] || null, true, true);
  if (!connected) return;
  document.getElementById('sync-btn').onclick = async () => {
    document.getElementById('entry-result').textContent = 'Syncing…';
    const syncPeriod = document.getElementById('xero-period-end').value;
    const res = await fetch('/.netlify/functions/xero-pull', {
      method: 'POST',
      body: JSON.stringify({ client_id: currentClientId, period_end: syncPeriod }),
    });
    const data = await res.json();
    document.getElementById('entry-result').innerHTML = `<pre style="font-size:12px;">${JSON.stringify(data, null, 2)}</pre>`;
    await loadPeriods(syncPeriod);
    refreshHealthBadge();
    renderSidebarDomains();
    // Same fix as Manual Entry/PDF Upload — without rebuilding this screen
    // too, a successful sync's period never shows up as a pill here even
    // though it genuinely saved.
    if (!data.error) { await renderXeroSync(content); refreshUnsavedPeriodBanner(); }
  };
}

// ---- Financial Performance: Analyse (health wheel + flags + pillar table) ----
function polar(cx, cy, r, angle) {
  return [cx + r * Math.cos(angle - Math.PI / 2), cy + r * Math.sin(angle - Math.PI / 2)];
}

function drawWheel(svg, pillars, centerScore) {
  svg.innerHTML = '';
  const cx = 120, cy = 120, rOuter = 100, rInner = 44;
  const n = pillars.length;
  const gap = 0.035;
  const anglePer = (2 * Math.PI) / n;

  pillars.forEach((p, i) => {
    const startAngle = i * anglePer + gap / 2;
    const endAngle = (i + 1) * anglePer - gap / 2;
    const rScore = rInner + (rOuter - rInner) * ((p.score || 0) / 10);
    const largeArc = endAngle - startAngle > Math.PI ? 1 : 0;

    const [gx1, gy1] = polar(cx, cy, rInner, startAngle);
    const [ox2, oy2] = polar(cx, cy, rOuter, startAngle);
    const [ox3, oy3] = polar(cx, cy, rOuter, endAngle);
    const [ox4, oy4] = polar(cx, cy, rInner, endAngle);
    const ghost = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    ghost.setAttribute('d', `M ${gx1} ${gy1} L ${ox2} ${oy2} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${ox3} ${oy3} L ${ox4} ${oy4} A ${rInner} ${rInner} 0 ${largeArc} 0 ${gx1} ${gy1} Z`);
    ghost.setAttribute('fill', '#DDD8C8');
    ghost.setAttribute('opacity', '0.35');
    svg.appendChild(ghost);

    const [x1, y1] = polar(cx, cy, rInner, startAngle);
    const [x2, y2] = polar(cx, cy, rScore, startAngle);
    const [x3, y3] = polar(cx, cy, rScore, endAngle);
    const [x4, y4] = polar(cx, cy, rInner, endAngle);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2} A ${rScore} ${rScore} 0 ${largeArc} 1 ${x3} ${y3} L ${x4} ${y4} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x1} ${y1} Z`);
    path.setAttribute('fill', p.color);
    svg.appendChild(path);
  });

  const centerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  centerText.setAttribute('x', cx);
  centerText.setAttribute('y', cy + 6);
  centerText.setAttribute('text-anchor', 'middle');
  centerText.setAttribute('font-family', 'Fraunces, serif');
  centerText.setAttribute('font-size', '26');
  centerText.setAttribute('fill', '#1E2A24');
  centerText.textContent = centerScore;
  svg.appendChild(centerText);
}

function trendArrow(current, prior) {
  if (current == null || prior == null) return '';
  const diff = current - prior;
  if (Math.abs(diff) < 0.05) return '<span class="trend-flat">— no change</span>';
  const up = diff > 0;
  return `<span class="${up ? 'trend-up' : 'trend-down'}">${up ? '↑' : '↓'} ${Math.abs(diff).toFixed(1)} vs last period</span>`;
}

function escAttr(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

// Jumps from a derived/calculated figure straight to the raw field it's
// built from, in the full Manual Entry form — "where does this number come
// from" answered by showing the actual source, not just a formula. Used
// throughout the cash reconciliation panel via data-jump-field/data-jump-period.
// periodEnd lets a "prior period" figure (e.g. last period's cash balance)
// jump there directly rather than being stuck on the currently-viewed period.
// jumpOrigin remembers where the jump started so the back banner can return
// there exactly — only set on the FIRST jump so a second jump (e.g. current
// period cash, then prior period total_debt) doesn't overwrite it and strand
// the original starting point.
let jumpOrigin = null;
async function jumpToManualEntry(fieldKey, periodEnd) {
  if (!jumpOrigin) jumpOrigin = { workflow: currentWorkflow, domain: currentDomain, periodEnd: currentPeriodEnd };
  currentWorkflow = 'input';
  currentEntrySubtab = 'manual';
  if (periodEnd) currentPeriodEnd = periodEnd;
  renderPeriodPills();
  renderWorkflowTabsActive();
  await renderMain();
  await new Promise((res) => setTimeout(res, 60));

  renderJumpBackButtons();

  const el = document.getElementById(`me-${fieldKey}`);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.focus();
  el.classList.add('field-highlight');
  setTimeout(() => el.classList.add('field-highlight-fade'), 50);
  setTimeout(() => el.classList.remove('field-highlight', 'field-highlight-fade'), 2000);
}
function jumpLink(fieldKey, periodEnd) { return `<button type="button" class="cash-jump-link" data-jump-field="${fieldKey}"${periodEnd ? ` data-jump-period="${periodEnd}"` : ''} title="Edit in Manual Entry">↗</button>`; }

// Places the back button both at the top (visible the moment you land) and
// at the bottom, next to Save (so you don't have to scroll back up after
// editing a field further down the form) — both wired to the same restore.
function renderJumpBackButtons() {
  document.getElementById('jump-back-banner')?.remove();
  document.getElementById('jump-back-banner-bottom')?.remove();
  if (!jumpOrigin) return;
  // "← Back to meeting" when the jump started from Meeting Mode — the
  // period-dated label reads as "back to a different period" rather than
  // "back to where you actually were," and every other domain's jump-to-
  // detail flow already says "Back to meeting" (renderMeetingDomainStep).
  const label = jumpOrigin.workflow === 'meeting' ? '← Back to meeting' : `← Back to ${formatShortDate(jumpOrigin.periodEnd)}`;
  const content = document.getElementById('tab-content');
  if (content) {
    content.insertAdjacentHTML('afterbegin', `<div class="jump-back-banner" id="jump-back-banner"><button type="button" id="jump-back-btn">${label}</button></div>`);
    document.getElementById('jump-back-btn').onclick = backToJumpOrigin;
  }
  const bottomAnchor = document.getElementById('me-financials-msg');
  if (bottomAnchor) {
    bottomAnchor.insertAdjacentHTML('afterend', `<div class="jump-back-banner" id="jump-back-banner-bottom"><button type="button" id="jump-back-btn-bottom">${label}</button></div>`);
    document.getElementById('jump-back-btn-bottom').onclick = backToJumpOrigin;
  }
}

// Restores exactly where a jump started — workflow, domain, period — then
// scrolls to and re-opens the cash reconciliation panel, since "back" should
// land on the same page you left, not just the same tab with everything
// collapsed again.
async function backToJumpOrigin() {
  const origin = jumpOrigin;
  if (!origin) return;
  jumpOrigin = null;
  currentWorkflow = origin.workflow;
  currentDomain = origin.domain;
  currentPeriodEnd = origin.periodEnd;
  renderPeriodPills();
  renderSidebarDomains();
  renderWorkflowTabsActive();
  await renderMain();
  // The Analyse tab's KPI data loads via its own async fetch inside
  // renderHealthWheelBlock, which isn't guaranteed to have finished (and
  // wired up #recon-toggle) by the time renderMain()'s own promise resolves
  // — poll briefly rather than guessing a fixed delay.
  let toggle = null;
  for (let i = 0; i < 30 && !toggle; i++) {
    toggle = document.getElementById('recon-toggle');
    if (!toggle) await new Promise((res) => setTimeout(res, 100));
  }
  if (!toggle) return;
  const panel = document.getElementById('recon-panel');
  if (panel && panel.style.display === 'none') toggle.click();
  toggle.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Recomputed fresh from the persisted financial_snapshot every render (via
// get_kpi_report) rather than trusting anything analyze.js returned in the
// moment — that response was never stored, so the snapshot + kpi_library are
// the only things that reliably "stick." Interpretations DO persist (analyze.js
// writes them to diagnostics), so get_kpi_report reads those back too.
function formatKpi(value, format) {
  if (value == null || !isFinite(value)) return '—';
  if (format === 'percent') return (value * 100).toFixed(1) + '%';
  if (format === 'days') return value.toFixed(0) + 'd';
  if (format === 'ratio') return value.toFixed(2) + 'x';
  if (format === 'money') return formatMoney(value);
  return value.toFixed(2);
}

const CONFIDENCE_LABEL = { green: '🟢 Calculated', yellow: '🟡 Estimated', red: '🔴 Unavailable' };
const FIELD_LABEL = { ...Object.fromEntries(FINANCIAL_FIELD_DEFS), gross_profit: 'Gross Profit' };

function formatMoney(value) {
  if (value == null || !isFinite(value)) return '—';
  return '$' + Math.round(value).toLocaleString('en-AU');
}

// A real <input type="number"> can't display thousand-separator commas
// while it's being edited — the browser strips them, since commas aren't
// valid in a number input's value. Rather than rewriting every money field
// as a text input with custom formatting/parsing (a much bigger, more
// fragile change), this adds a small always-on "= $1,234,567" readout right
// after the input instead, so it's still obvious at a glance whether you
// typed 100000 or 1000000 — the input itself, arrows/keypad/validation
// included, stays untouched. One shared helper, called once per money input
// wherever one is rendered.
// isActive lets a field that only SOMETIMES means dollars (the revenue/GP/
// opex/net-profit change rows on Cash outlook/Tax outlook, which flip
// between % and $ via their own unit toggle) opt out of the preview while
// it currently means something else — a "15" in percent mode has no
// business showing "= $15". Callers whose unit can change must re-run
// input._moneyPreviewUpdate() themselves when it does, since flipping mode
// alone fires no 'input' event.
function wireMoneyInputPreview(input, isActive) {
  if (!input || input._moneyPreviewUpdate) return;
  const preview = document.createElement('p');
  preview.className = 'money-input-preview';
  input.insertAdjacentElement('afterend', preview);
  const update = () => {
    const n = Number(input.value);
    preview.textContent = (!isActive || isActive()) && input.value !== '' && !isNaN(n) ? formatMoney(n) : '';
  };
  input._moneyPreviewUpdate = update;
  input.addEventListener('input', update);
  update();
}
// For after a value is set programmatically (loading saved data, division
// totals recomputing) — those don't fire a real 'input' event, so the
// preview would otherwise sit stale/blank next to a filled-in field.
function refreshMoneyInputPreviews(container) {
  (container || document).querySelectorAll('input[type="number"]').forEach((input) => { input._moneyPreviewUpdate?.(); });
}

// Which raw snapshot fields a red (Unavailable) KPI is still missing, so the
// card can say what to add instead of just "not enough data."
function missingFieldsFor(kpi, snapshot) {
  const fields = [...(kpi.numerator || []), ...(kpi.denominator || [])];
  return [...new Set(fields.filter((f) => snapshot?.[f] == null))];
}

  cash: '💵',
  tax: '🧾',
};
const KPI_CATEGORY_ORDER = ['profitability', 'working_capital', 'balance_sheet', 'cash', 'tax'];

// Per-metric icon (distinct from KPI_CATEGORY_ICON) so the Metric summary
// table's rows read as individual ratios rather than repeating the same
// category glyph five times in a row — falls back to no icon for any kpi
// key not covered here rather than a generic placeholder.
const KPI_ICON = {
  revenue_growth: '📈',
  gp_margin: '🏷️',
  np_margin: '💰',
  wages_pct: '👷',
  roe: '🏆',
  debtor_days: '📥',
  creditor_days: '📤',
  inventory_days: '📦',
  debt_to_equity: '🏦',

  effective_tax_rate: '🏛️',
  // Not real kpi_library entries — synthetic rows renderKpiSummaryTable
