        FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = snapshot[key] != null ? snapshot[key] : ''; });
        body[fieldName] = input.value;
        try {
          const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
          const saved = await res.json();
          if (saved.error) throw new Error(saved.error);
          msg.textContent = 'Saved.';
          msg.className = 'save-msg ok';
          const scrollPos = window.scrollY;
          await renderMain();
          window.scrollTo(0, scrollPos);
        } catch (err) {
          msg.textContent = 'Error: ' + err.message;
          msg.className = 'save-msg err';
        }
      };
    };
    if (r) {
      wireBalanceAdjust('cashbal', r.cash_prior, 'cash');
      wireBalanceAdjust('debtbal', r.total_debt_prior, 'total_debt');
    }

    const reconFieldIds = ['loan_repayments', 'equipment_purchases', 'funds_introduced', 'owner_drawings', 'director_loan_balance'];
    const reconNum = (id) => { const v = document.getElementById(`recon-${id}`).value; return v === '' ? null : Number(v); };
    // Adjustment rows now live in 4 separate per-section lists (see
    // addItemBlock in renderCashReconciliationBlock) rather than one shared
    // list — adjRows() spans all of them; adjRowsFor() filters to one
    // section's own rows via the tag each row carries.
    const adjRows = () => [...document.querySelectorAll('.recon-adj-row')];
    const adjRowsFor = (sec) => adjRows().filter((row) => row.dataset.adjSection === sec);
    const sumAdjRows = (rows) => rows.reduce((sum, row) => sum + (Number(row.querySelector('.recon-adj-amount').value || 0)), 0);

    const recalcRecon = () => {
      const loanRepayments = reconNum('loan_repayments') || 0;
      const newBorrowing = r.delta_debt == null ? null : r.delta_debt + loanRepayments;
      document.getElementById('recon-new-borrowing').textContent = newBorrowing == null ? '—' : formatMoney(newBorrowing);

      const directorLoanBalance = reconNum('director_loan_balance');
      const directorLoanMovement = (directorLoanBalance != null && r.director_loan_balance_prior != null) ? directorLoanBalance - r.director_loan_balance_prior : null;
      document.getElementById('recon-director-loan-movement').textContent = directorLoanMovement == null ? '—' : formatMoney(directorLoanMovement);

      const equipmentInput = reconNum('equipment_purchases');
      const capex = equipmentInput != null ? equipmentInput : r.capex_estimate;

      const capexAdj = sumAdjRows(adjRowsFor('capex'));
      const borrowingsAdj = sumAdjRows(adjRowsFor('borrowings'));
      const ownerAdj = sumAdjRows(adjRowsFor('owner'));
      const otherAdj = sumAdjRows(adjRowsFor('other'));
      const adjustmentsTotal = capexAdj + borrowingsAdj + ownerAdj + otherAdj;

      const setSubtotal = (key, value) => {
        const el = document.getElementById(`recon-sub-${key}`);
        if (!el) return;
        el.childNodes[0].textContent = formatMoney(value) + ' ';
        el.classList.toggle('neg', value < 0);
      };
      setSubtotal('capex', (capex != null ? -capex : 0) + capexAdj);
      setSubtotal('borrowings', (r.delta_debt || 0) - (r.interest_applicable ? (r.interest_paid || 0) : 0) + borrowingsAdj);
      setSubtotal('owner', (directorLoanMovement || 0) + (reconNum('funds_introduced') || 0) - (reconNum('owner_drawings') || 0) + ownerAdj);
      setSubtotal('other', otherAdj);

      const financingKnown = (r.delta_debt || 0)
        + (r.interest_applicable ? -(r.interest_paid || 0) : 0)
        + (directorLoanMovement || 0)
        + (reconNum('funds_introduced') || 0) - (reconNum('owner_drawings') || 0)
        - (capex || 0)
        + adjustmentsTotal;
      const residual = r.non_operating - financingKnown;
      document.getElementById('recon-residual-value').textContent = formatMoney(residual);
      document.getElementById('recon-residual-box').classList.toggle('neg', residual < 0);
      const netExplained = r.delta_cash - residual;
      document.getElementById('recon-equation').textContent = `${formatMoney(netExplained)} net + ${formatMoney(residual)} unexplained = ${formatMoney(r.delta_cash)} actual change in cash`;
      // The headline itself (delta_cash, the real bank balance movement)
      // never changes from editing these fields — only how much of it is
      // "explained" does, which is what the Unexplained stat tracks live.
      const unexplainedStat = document.getElementById('cash-tile-unexplained');
      if (unexplainedStat) {
        unexplainedStat.textContent = formatMoney(residual);
        unexplainedStat.classList.toggle('neg', residual < 0);
      }

      return {
        loanRepayments: reconNum('loan_repayments'), equipmentPurchases: equipmentInput,
        fundsIntroduced: reconNum('funds_introduced'), ownerDrawings: reconNum('owner_drawings'),
        directorLoanBalance,
        adjustments: adjRows().map((row) => ({ label: row.querySelector('.recon-adj-label').value, amount: row.querySelector('.recon-adj-amount').value, section: row.dataset.adjSection })),
      };
    };
    reconFieldIds.forEach((id) => { document.getElementById(`recon-${id}`).oninput = recalcRecon; });

    const wireAdjRow = (row) => {
      row.querySelector('.recon-adj-amount').oninput = recalcRecon;
      row.querySelector('.recon-adj-remove').onclick = () => { row.remove(); recalcRecon(); };
    };
    adjRows().forEach(wireAdjRow);
    container.querySelectorAll('[data-adj-add]').forEach((addBtn) => {
      addBtn.onclick = () => {
        const sec = addBtn.dataset.adjAdd;
        const list = document.getElementById(`recon-adjustments-list-${sec}`);
        list.insertAdjacentHTML('beforeend', renderReconAdjustmentRow({ label: '', amount: '' }, sec));
        const newRow = list.lastElementChild;
        wireAdjRow(newRow);
        newRow.querySelector('.recon-adj-label').focus();
      };
    });

    document.getElementById('recon-save-btn').onclick = async () => {
      const msg = document.getElementById('recon-save-msg');
      const vals = recalcRecon();
      msg.textContent = 'Saving…';
      msg.className = 'save-msg';
      // Sends the FULL current snapshot — an omitted field is treated as
      // blank by the save endpoint, so only overriding these fields here
      // (not sending a partial payload) is what keeps the rest intact.
      const body = { type: 'financials', client_id: currentClientId, period_end: currentPeriodEnd };
      FINANCIAL_FIELD_DEFS.forEach(([key]) => { body[key] = snapshot[key] != null ? snapshot[key] : ''; });
      body.loan_repayments = vals.loanRepayments ?? '';
      body.equipment_purchases = vals.equipmentPurchases ?? '';
      body.funds_introduced = vals.fundsIntroduced ?? '';
      body.owner_drawings = vals.ownerDrawings ?? '';
      body.director_loan_balance = vals.directorLoanBalance ?? '';
      body.cash_recon_adjustments = vals.adjustments;
      // renderMain() below rebuilds this whole card from scratch, and every
      // panel/section starts collapsed by default — without restoring that,
      // a successful save LOOKS like it did nothing (everything you just
      // added visually vanishes behind a closed accordion), even though the
      // data genuinely persisted. Remember what was open, reopen it after.
      const openSections = ['capex', 'borrowings', 'owner', 'other'].filter((key) => document.getElementById(`recon-body-${key}`)?.style.display === 'block');
      try {
        const res = await fetch('/.netlify/functions/manual-entry', { method: 'POST', body: JSON.stringify(body) });
        const saved = await res.json();
        if (saved.error) throw new Error(saved.error);
        msg.textContent = 'Saved.';
        msg.className = 'save-msg ok';
        const scrollPos = window.scrollY;
        await renderMain();
        document.getElementById('recon-toggle')?.click();
        await new Promise((res2) => setTimeout(res2, 0));
        openSections.forEach((key) => document.querySelector(`[data-accordion-toggle="${key}"]`)?.click());
        window.scrollTo(0, scrollPos);
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.className = 'save-msg err';
      }
    };
  }

  container.querySelectorAll('button[data-set-target], button[data-edit-target]').forEach((btn) => {
    btn.onclick = () => {
      const key = btn.dataset.setTarget || btn.dataset.editTarget;
      document.getElementById(`target-editor-${key}`).style.display = 'flex';
      btn.style.display = 'none';
    };
  });
  container.querySelectorAll('button[data-cancel-target]').forEach((btn) => {
    btn.onclick = () => {
      const key = btn.dataset.cancelTarget;
      document.getElementById(`target-editor-${key}`).style.display = 'none';
      const trigger = container.querySelector(`[data-edit-target="${key}"], [data-set-target="${key}"]`);
      if (trigger) trigger.style.display = '';
    };
  });
  container.querySelectorAll('button[data-save-target]').forEach((btn) => {
    btn.onclick = async () => {
      const key = btn.dataset.saveTarget;
      // cash_net_movement isn't a real kpi_library row (see buildCashNetMovementKpi) —
      // rebuild the same synthetic object rather than looking it up in kpis.
      const kpi = key === 'cash_net_movement'
        ? buildCashNetMovementKpi(cashInOut(kpis.find((k) => k.key === 'op_cash_conversion')?.cash_reconciliation))
        : kpis.find((k) => k.key === key);
      const raw = document.getElementById(`target-input-${key}`).value;
      if (raw === '') return;
      const target = kpi.format === 'percent' ? Number(raw) / 100 : Number(raw);
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        if (btn.dataset.itemId) {
          await editKpiTargetGoal(kpi, target, btn.dataset.itemCat, btn.dataset.itemPeriod, btn.dataset.itemId);
        } else {
          await addKpiTargetGoal(kpi, target);
        }
        currentCtx = await callRead('get_context', currentClientId);
        // A full renderMain() replaces the whole tab's DOM at once — without
        // capturing/restoring scroll, that visually jumps the page back to the
        // top, reading as if the whole screen reset rather than just this card.
        const scrollPos = window.scrollY;
        await renderMain();
        window.scrollTo(0, scrollPos);
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Save';
      }
    };
  });

  if (hs) {
    drawWheel(document.getElementById('ov-wheel'), pillars, hs.score);
    const legend = document.getElementById('ov-legend');
    pillars.forEach((p) => {
      const item = document.createElement('div');
      item.className = 'pillar-legend-item';
      item.innerHTML = `<span class="pillar-swatch" style="background:${p.color}"></span><span class="pillar-legend-name">${p.name}</span><span class="pillar-legend-score">${p.score == null ? '—' : p.score.toFixed(1)}</span>`;
      legend.appendChild(item);
    });
  }

  container.querySelectorAll('button[data-suggest-target]').forEach((btn) => {
    btn.onclick = async () => {
      const idx = Number(btn.dataset.suggestTarget);
      const flag = flags[idx];
      const panel = document.getElementById(`target-panel-${idx}`);
      panel.style.display = 'block';
      panel.innerHTML = '<p class="muted plain" style="margin:0;">Thinking…</p>';
      btn.disabled = true;
      try {
        const res = await fetch('/.netlify/functions/suggest-goal', {
          method: 'POST',
          body: JSON.stringify({
            client_id: currentClientId, period_end: currentPeriodEnd,
            category: PILLAR_TO_DOMAIN[flag.pillar] === 'financial' ? 'business' : 'business',
            category_label: 'Financial Performance', focus: flag.message, count: 1,
          }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        const suggestion = data.suggestions?.[0];
        if (!suggestion) {
          panel.innerHTML = '<p class="muted plain" style="margin:0;">No suggestion came back — try again.</p>';
        } else {
          panel.innerHTML = `
            <p class="suggest-caveat">Suggested, not benchmarked.</p>
            <div class="suggest-item"><p>${suggestion}</p><button class="mini-link" id="target-add-${idx}" type="button">add to goals</button></div>
          `;
          document.getElementById(`target-add-${idx}`).onclick = async (e) => {
            e.target.disabled = true;
            e.target.textContent = 'adding…';
            await addTextAsGoal(suggestion);
            e.target.textContent = '✓ added to Goals → Business';
          };
        }
      } catch (err) {
        panel.innerHTML = `<p class="muted plain" style="margin:0;">Error: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    };
  });
}

async function renderFinancialAnalyse(content) {
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot from the Input tab first, then run analysis here.</p></div>`;
    return;
  }
  content.innerHTML = `
    <button class="action" id="run-analysis-btn">Run analysis for ${formatShortDate(currentPeriodEnd)}</button>
    <div id="analyse-body" style="margin-top:16px;"></div>
  `;
  const body = document.getElementById('analyse-body');
  // These fetches are async — if the user navigates away before they resolve,
  // `body` (and its 'run-analysis-btn' sibling) may already be detached from the
  // document. Guard every write with a liveness check rather than trust closures
  // captured before the await.
  const stillLive = () => document.body.contains(body);

  const [overview, kpiData, history] = await Promise.all([
    callRead('get_overview', currentClientId, currentPeriodEnd),
    callRead('get_kpi_report', currentClientId, currentPeriodEnd),
    callRead('get_kpi_history', currentClientId, currentPeriodEnd),
  ]);
  if (!stillLive()) return;
  renderHealthWheelBlock(body, overview, kpiData?.kpis, kpiData?.snapshot, history);

  const runBtn = document.getElementById('run-analysis-btn');
  if (runBtn) runBtn.onclick = async () => {
    body.textContent = 'Analyzing…';
    const res = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      body: JSON.stringify({ client_id: currentClientId, period_end: currentPeriodEnd }),
    });
    const data = await res.json();
    if (!stillLive()) return;
    if (data.error) {
      body.innerHTML = `<div class="flag">Error: ${data.error}</div>`;
      return;
    }
    const [fresh, freshKpis, freshHistory] = await Promise.all([
      callRead('get_overview', currentClientId, currentPeriodEnd),
      callRead('get_kpi_report', currentClientId, currentPeriodEnd),
      callRead('get_kpi_history', currentClientId, currentPeriodEnd),
    ]);
    if (!stillLive()) return;
    renderHealthWheelBlock(body, fresh, freshKpis?.kpis, freshKpis?.snapshot, freshHistory);
    refreshHealthBadge();
  };
}

// ---- Financial Performance: Diagnose ----
async function renderFinancialDiagnose(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot and run analysis first.</p></div>`;
    return;
  }
  const data = await callRead('get_diagnosis', currentClientId, currentPeriodEnd);
  if (myToken !== renderToken) return;

  const recRow = (r, i, group) => `
    <div class="flag-row-wrap">
      <div class="flag-row">
        <span class="flag-dot sage"></span>
        <span><b>${r.title}</b> — ${r.impact || ''} <span class="muted plain">(${r.difficulty || ''}${r.difficulty && r.timeframe ? ', ' : ''}${r.timeframe || ''})</span></span>
        <button class="mini-link" data-turn-rec="${group}:${i}" type="button">→ turn into goal</button>
      </div>
    </div>
  `;
  const riskRow = (r, i) => `
    <div class="flag-row-wrap">
      <div class="flag-row">
        <span class="flag-dot ${r.severity === 'danger' ? 'rust' : 'sage'}"></span>
        <span><b>${r.risk_category}</b> — ${r.message}${r.impact_estimate ? ` <span class="muted plain">(${r.impact_estimate})</span>` : ''}</span>
        <button class="mini-link" data-turn-risk="${i}" type="button">→ turn into goal</button>
      </div>
    </div>
  `;

  content.innerHTML = `
    <div class="card">
      <p class="muted">AI diagnosis</p>
      <p class="muted plain" style="margin:0; white-space:pre-wrap;">${data.diagnosis || 'Run analysis on the Analyse tab first to generate a diagnosis.'}</p>
    </div>
    <div class="card">
      <p class="muted">Risk review — detected from the numbers</p>
      ${data.risks.length ? data.risks.map(riskRow).join('') : '<p class="muted plain" style="margin:0;">No financial risks detected this period.</p>'}
    </div>
    <div class="card">
      <p class="muted">Get better — fixes for a current gap</p>
      ${data.getBetter.length ? data.getBetter.map((r, i) => recRow(r, i, 'getBetter')).join('') : '<p class="muted plain" style="margin:0;">Nothing recorded for this period yet.</p>'}
    </div>
    <div class="card">
      <p class="muted">Opportunities — new/growth ideas</p>
      ${data.opportunities.length ? data.opportunities.map((r, i) => recRow(r, i, 'opportunities')).join('') : '<p class="muted plain" style="margin:0;">Nothing recorded for this period yet.</p>'}
    </div>
    <div class="card">
      <p class="muted">Tax planning — worth reviewing with the client</p>
      ${data.taxPlanning.length ? data.taxPlanning.map((r, i) => recRow(r, i, 'taxPlanning')).join('') : '<p class="muted plain" style="margin:0;">Nothing recorded for this period yet.</p>'}
      <button class="mini-link" id="tax-planning-model-link" type="button" style="margin-top:8px;">🧮 Model super, equipment or structure changes in Tax Outlook →</button>
      <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--line);">
        <p class="muted" style="margin:0 0 6px;">Ask a tax question</p>
        <div style="display:flex; gap:6px;">
          <input type="text" id="tax-question-input" placeholder="e.g. what about negative gearing a property?" style="flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:var(--font-body); background:var(--paper-raised); color:var(--ink); font-size:13px;" />
          <button class="action" id="tax-question-ask-btn" type="button" style="white-space:nowrap;">Ask</button>
        </div>
        <div id="tax-question-answer" style="margin-top:8px;"></div>
      </div>
    </div>
  `;

  content.querySelectorAll('button[data-turn-rec]').forEach((btn) => {
    btn.onclick = async () => {
      const [group, idx] = btn.dataset.turnRec.split(':');
      const r = data[group][Number(idx)];
      const text = r.impact ? `${r.title} — ${r.impact}` : r.title;
      btn.disabled = true;
      btn.textContent = 'adding…';
      try {
        await addTextAsGoal(text);
        btn.textContent = '✓ added to Goals → Business';
      } catch (err) {
        btn.textContent = 'error';
        btn.disabled = false;
        alert('Error: ' + err.message);
      }
    };
  });
  content.querySelectorAll('button[data-turn-risk]').forEach((btn) => {
    btn.onclick = async () => {
      const r = data.risks[Number(btn.dataset.turnRisk)];
      const text = `${r.risk_category}: ${r.message}${r.impact_estimate ? ' — ' + r.impact_estimate : ''}`;
      btn.disabled = true;
      btn.textContent = 'adding…';
      try {
        await addTextAsGoal(text);
        btn.textContent = '✓ added to Goals → Business';
      } catch (err) {
        btn.textContent = 'error';
        btn.disabled = false;
        alert('Error: ' + err.message);
      }
    };
  });

  // "AI suggests it, calculator quantifies it" — rather than have the AI
  // state a specific dollar tax saving in free text (the exact failure mode
  // that produced a wrong effective-tax-rate figure earlier), this just
  // routes straight to the deterministic Tax Outlook card so the adviser can
  // plug the client's actual numbers into the same super/equipment/structure
  // levers and see a real, computed answer instead.
  const taxPlanningModelLink = document.getElementById('tax-planning-model-link');
  if (taxPlanningModelLink) {
    taxPlanningModelLink.onclick = async () => {
      currentDomain = 'financial';
      currentWorkflow = 'analyse';
      renderWorkflowTabsActive();
      renderSidebarDomains();
      await renderMain();
      const toggle = document.getElementById('tax-outlook-toggle');
      if (!toggle) return;
      const panel = document.getElementById('tax-outlook-panel');
      if (panel && panel.style.display === 'none') toggle.click();
      toggle.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  }

  const taxQuestionInput = document.getElementById('tax-question-input');
  const taxQuestionBtn = document.getElementById('tax-question-ask-btn');
  const taxQuestionAnswer = document.getElementById('tax-question-answer');
  if (taxQuestionInput && taxQuestionBtn) {
    const askTaxQuestion = async () => {
      const question = taxQuestionInput.value.trim();
      if (!question) return;
      taxQuestionBtn.disabled = true;
      taxQuestionBtn.textContent = '…';
      taxQuestionAnswer.innerHTML = '';
      try {
        const res = await fetch('/.netlify/functions/tax-question', {
          method: 'POST',
          body: JSON.stringify({ client_id: currentClientId, period_end: currentPeriodEnd, question }),
        });
        const result = await res.json();
        if (result.error) throw new Error(result.error);
        const flagClass = result.isFinancialAdviceQuestion ? 'kpi-note' : 'muted plain';
        const flagIcon = result.isFinancialAdviceQuestion ? '⚠️ ' : '';
        taxQuestionAnswer.innerHTML = `<p class="${flagClass}" style="margin:0;">${flagIcon}${result.answer}</p>`;
      } catch (err) {
        taxQuestionAnswer.innerHTML = `<p class="muted plain" style="margin:0; color:var(--rust);">Error: ${err.message}</p>`;
      } finally {
        taxQuestionBtn.disabled = false;
        taxQuestionBtn.textContent = 'Ask';
      }
    };
    taxQuestionBtn.onclick = askTaxQuestion;
    taxQuestionInput.onkeydown = (e) => { if (e.key === 'Enter') askTaxQuestion(); };
  }
}

// ---- Risk: Analyse ----
// Rolls up all sources sharing risk_items (financial/business/industry, see
// lib/financial-risk-sync.js, lib/business-risk-questionnaire.js,
// lib/industry-risk-checklist.js) into one view, in that order — the order
// the accountant would actually work through them: the numbers first
// (already computed), then what only a human can answer, then general
// industry context last. Financial is period-scoped, so it reads for
// currentPeriodEnd like every other Analyse tab; industry and business
// don't change per period (see read-data.js's get_risk_items), so both
// always show the client's full history regardless of which period is
// selected.
const RISK_SOURCE_META = {
  financial: { label: 'Financial', hint: 'Detected automatically from this period’s ratios and trends.' },
  business: { label: 'Business', hint: 'From check-in questions only a human can answer.' },
  industry: { label: 'Industry', hint: 'AI-generated from this client’s industry — general knowledge, not verified. Review each one.' },
};
const RISK_SEVERITY_BADGE = { High: 'red', Medium: 'yellow', Low: 'green' };
const RISK_STATUS_BADGE = { Detected: 'red', Identified: 'yellow', Watch: 'yellow', Managed: 'green', 'Not applicable': 'green', Unknown: 'yellow' };
const RISK_REVIEW_ACTIONS = [
  ['confirm', 'Confirm'], ['investigate', 'Investigate'],
  ['not_applicable', 'Not applicable'], ['no_longer_a_risk', 'No longer a risk'],
];
function capitalizeWord(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// A "no risk identified" row from a question's no-risk branch (see
// submitQuestionAnswer) never gets a recommendation — a real risk always
// does, even after a review action later marks it Managed/resolved (the
// action only touches status, never recommendation). That's the reliable
// way to tell "never was a risk" apart from "was a risk, now resolved"
// without a dedicated column.
function isQuietNoRiskRow(r) {
  return r.source === 'business' && !r.recommendation;
}

function riskItemRow(r) {
  if (isQuietNoRiskRow(r)) {
    return `
      <div class="flag-row-wrap">
        <div class="flag-row">
          <span class="flag-dot sage"></span>
          <span class="muted plain" style="margin:0;">${businessCategoryLabel(r.category)} — reviewed, no risk identified${r.last_reviewed_date ? ` <span style="font-size:11px;">(${formatShortDate(r.last_reviewed_date)})</span>` : ''}</span>
        </div>
      </div>
    `;
  }
  return `
    <div class="flag-row-wrap">
      <div class="flag-row" style="align-items:flex-start;">
        <span class="flag-dot ${r.severity === 'High' ? 'rust' : 'sage'}" style="margin-top:5px;"></span>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;">
            <b>${r.risk_name}</b>
            <span class="confidence-badge ${RISK_SEVERITY_BADGE[r.severity] || 'yellow'}">${r.severity || 'Medium'}</span>
            <span class="confidence-badge ${RISK_STATUS_BADGE[r.status] || 'yellow'}">${r.status}</span>
            ${r.is_new ? '<span class="confidence-badge yellow">New</span>' : ''}
            ${r.is_changed ? '<span class="confidence-badge yellow">Changed</span>' : ''}
          </div>
          ${r.detail ? `<p class="muted plain" style="margin:4px 0 0;">${r.detail}</p>` : ''}
          ${r.recommendation ? `<p class="muted plain" style="margin:2px 0 0;"><b>Recommended:</b> ${r.recommendation}</p>` : ''}
          ${r.notes ? `<p class="muted plain" style="margin:2px 0 0; white-space:pre-wrap;">${r.notes}</p>` : ''}
          ${r.impact_estimate ? `<p class="muted plain" style="margin:2px 0 0;">${r.impact_estimate}</p>` : ''}
          ${r.last_reviewed_date ? `<p class="muted plain" style="margin:2px 0 0; font-size:11px;">Reviewed ${formatShortDate(r.last_reviewed_date)}</p>` : ''}
          <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:6px;">
            ${RISK_REVIEW_ACTIONS.map(([action, label]) => `<button type="button" class="mini-link risk-action-btn" style="margin-left:0;" data-risk-id="${r.id}" data-risk-action="${action}">${label}</button>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

// ---- Risk: rollup banner ----
// Pure client-side rollup over what get_risk_items already returns — no new
// query, just querying-by-status/severity as already discussed. Business
// rows accumulate one row-set per period a category gets reviewed (the
// delete-then-insert guard only clears THIS period's rows, so a category
// reviewed in 2026 and again in 2027 leaves both on file as history) — the
// rollup only wants the CURRENT standing, so it dedupes to each category's
// most-recently-reviewed period first. Financial and industry don't need
// this: financial's query is already period-scoped, and industry rows are
// only ever written once, per client, on first generation.
function dedupeBusinessToLatestPerCategory(business) {
  const latestPeriodByCategory = {};
  business.forEach((r) => {
    if (!latestPeriodByCategory[r.category] || r.period_end > latestPeriodByCategory[r.category]) {
      latestPeriodByCategory[r.category] = r.period_end;
    }
  });
  return business.filter((r) => r.period_end === latestPeriodByCategory[r.category]);
}

// 'Unknown' (industry's default until an accountant confirms/dismisses each
// one — no such UI yet, see ideas.md) counts as needing attention alongside
// Detected/Identified/Watch; Managed/Not applicable are resolved and don't.
const RISK_ACTIVE_STATUSES = new Set(['Detected', 'Identified', 'Watch', 'Unknown']);

function computeRiskRollup(financial, business, industry) {
  const businessLatest = dedupeBusinessToLatestPerCategory(business);
  const activeFinancial = financial.filter((r) => RISK_ACTIVE_STATUSES.has(r.status));
  const activeBusiness = businessLatest.filter((r) => RISK_ACTIVE_STATUSES.has(r.status));
  const activeIndustry = industry.filter((r) => RISK_ACTIVE_STATUSES.has(r.status));
  const allActive = [...activeFinancial, ...activeBusiness, ...activeIndustry];

  // Severity is only ever 'High'/'Medium' on a genuinely active item in
  // practice — 'Low' only shows up on business's "no risk" rows, which are
  // always Managed, never active. A "Low priority, still open" bucket would
  // sit empty forever, so the third bucket is Managed/Not applicable
  // instead — "what's actually fine" is at least as useful to see at a
  // glance as an always-empty bucket.
  const buckets = { High: [], Medium: [] };
  allActive.forEach((r) => { (buckets[r.severity] || buckets.Medium).push(r); });
  const managed = [...financial, ...businessLatest, ...industry].filter((r) => r.status === 'Managed' || r.status === 'Not applicable');

  // Source counts span everything shown (active + managed), not just
  // active — otherwise the Source filter axis's "All" total wouldn't match
  // the Priority axis's "All" total, and clicking "Business" would hide
  // any managed business item entirely (resolved doesn't mean sourceless).
  const allShown = [...allActive, ...managed];
  const countBySource = (src) => allShown.filter((r) => r.source === src).length;

  // is_new/is_changed only means something for sources that get re-synced
  // over time (financial every analysis run, business every review cycle)
  // — industry is generated once and never revisited, so "new this cycle"
  // doesn't apply to it; it gets its own "needs review" count instead,
  // since every industry item starts at Unknown until confirmed/dismissed.
  const newCount = [...activeFinancial, ...activeBusiness].filter((r) => r.is_new).length;
  const changedCount = [...activeFinancial, ...activeBusiness].filter((r) => r.is_changed).length;
  const industryNeedsReview = activeIndustry.filter((r) => r.status === 'Unknown').length;

  const level = buckets.High.length ? 'High' : buckets.Medium.length ? 'Medium' : 'Low';
  const isQuiet = level === 'Low' && newCount === 0 && changedCount === 0 && industryNeedsReview === 0;

  return {
    buckets, managed,
    counts: { financial: countBySource('financial'), business: countBySource('business'), industry: countBySource('industry') },
    allActiveCount: allActive.length, newCount, changedCount, industryNeedsReview,
    level, isQuiet,
  };
}

const RISK_SOURCE_PILL = {
  financial: { icon: '📊', label: 'Financial' },
  business: { icon: '🧑', label: 'Business' },
  industry: { icon: '🏭', label: 'Industry' },
};

// One clickable line per risk in the summary — name, then three pills in
// three different visual registers so they read as different KINDS of
// fact, not one row of same-looking tags: severity is filled (the urgency
// verdict), status is outlined (a workflow stage, not a verdict), source
// is a neutral icon tag (just a category). Click anywhere on the row
// (except an action button) to expand the SAME riskItemRow() detail used
// in the full source-grouped lists below (recommendation, notes, Confirm/
// Investigate/etc.) right in place — seeing "the stuff" behind a summary
// line never requires scrolling to hunt for it elsewhere on the page. The
// full detail is rendered into the DOM up front (just hidden), not
// fetched on click — this dataset is small (a handful of risks at most)
// and it means the action buttons work immediately via the existing
// content-level .risk-action-btn delegation, no extra wiring needed per
// row. data-source/data-level drive the two filter pill rows above (see
// wireRiskSummaryRegion) — level is the bucket it's grouped under
// (High/Medium/Managed), passed in from riskSummarySection rather than
// read off severity, since Managed items keep whatever severity they were
// given (often Low) but belong in the Managed filter, not a "Low" one.
function riskSummaryRow(r, level) {
  const detail = r.detail || '';
  const preview = detail.length > 90 ? detail.slice(0, 90) + '…' : detail;
  const sourceMeta = RISK_SOURCE_PILL[r.source] || { icon: '', label: r.source };
  return `
    <div class="risk-summary-row" data-source="${r.source}" data-level="${level}" style="padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer;">
      <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
        <b style="font-size:13px;">${r.risk_name}</b>
        <span class="risk-pill risk-pill-severity ${(r.severity || 'Medium').toLowerCase()}">${r.severity || 'Medium'}</span>
        <span class="risk-pill risk-pill-status">${r.status}</span>
        <span class="risk-pill risk-pill-source">${sourceMeta.icon} ${sourceMeta.label}</span>
        ${r.is_new ? '<span class="risk-pill risk-pill-flag">New</span>' : ''}
        ${r.is_changed ? '<span class="risk-pill risk-pill-flag">Changed</span>' : ''}
        <span class="muted plain risk-summary-chevron" style="font-size:11px; margin-left:auto;">▾</span>
      </div>
      ${preview ? `<p class="muted plain" style="margin:4px 0 0;">${preview}</p>` : ''}
      <div class="risk-summary-expand" style="display:none; margin:8px 0 0;">${riskItemRow(r)}</div>
    </div>
  `;
}

function riskSummarySection(icon, label, level, rows) {
  if (!rows.length) return '';
  return `<div class="risk-section-header ${level}">${icon} ${label} (${rows.length})</div>${rows.map((r) => riskSummaryRow(r, level)).join('')}`;
}

// One row of pills for one filter axis. The count in each pill is faceted
// — it recomputes live as the OTHER axis's selection changes (see
// updateRiskFilterCounts in wireRiskSummaryRegion), so "Industry" under
// Type of Risk shows however many industry risks match whatever Priority
// is currently selected, not a fixed number frozen at render time. The
// count sits in its own span so it can be updated in place without
// touching the icon/label text. "All" always sits first and starts active.
function riskFilterAxis(axisLabel, axis, options) {
  const allCount = options.reduce((sum, o) => sum + o.count, 0);
  return `
    <p class="muted" style="margin:14px 0 4px;">${axisLabel}</p>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button type="button" class="risk-filter-pill active" data-filter-axis="${axis}" data-filter-value="all">All <span class="risk-filter-count">(${allCount})</span></button>
      ${options.map((o) => `<button type="button" class="risk-filter-pill" data-filter-axis="${axis}" data-filter-value="${o.value}">${o.icon ? o.icon + ' ' : ''}${o.label} <span class="risk-filter-count">(${o.count})</span></button>`).join('')}
    </div>
  `;
}

// Business questionnaire category display names — separate from the
// Type of Risk filter's "Financial" (source='financial', auto-detected
// from ratios). The questionnaire's "financial" CATEGORY (cash/debt/
// funding questions) is a different thing that happens to share the word
// — relabeled here so "Financial" doesn't mean two unrelated things
// depending which part of the page you're looking at.
const BUSINESS_CATEGORY_LABEL = {
  people: 'People', customers: 'Customers', suppliers: 'Suppliers', operations: 'Operations',
  financial: 'Cash & Funding', legal: 'Legal', insurance: 'Insurance', technology: 'Technology',
};
function businessCategoryLabel(category) {
  return BUSINESS_CATEGORY_LABEL[category] || capitalizeWord(category);
}

// The full card content, shared between the always-expanded state and
// what's revealed when the quiet collapsed state is clicked open — same
// content either way, just a different entry point to it.
function renderRiskRollupContent(rollup) {
  const levelIcon = rollup.level === 'High' ? '🔴' : rollup.level === 'Medium' ? '🟠' : '🟢';
  const bits = [];
  if (rollup.newCount) bits.push(`${rollup.newCount} new`);
  if (rollup.changedCount) bits.push(`${rollup.changedCount} changed`);
  return `
    <div class="card">
      <p class="muted" style="margin:0 0 6px;">Overall Risk</p>
      <div class="risk-overall-pill ${rollup.level}">${levelIcon} ${rollup.level}</div>
      ${bits.length ? `<p class="muted plain" style="margin:8px 0 0; font-size:12px;">${bits.join(' · ')} this cycle</p>` : ''}
      <div style="margin-top:10px;">
        <button type="button" class="mini-link" style="margin-left:0;" id="risk-ai-summary-btn">✨ Generate AI summary</button>
        <div id="risk-ai-summary-content" style="display:none; margin-top:6px;"></div>
      </div>
      ${riskFilterAxis('Priority', 'level', [
        { value: 'High', icon: '🔴', label: 'High', count: rollup.buckets.High.length },
        { value: 'Medium', icon: '🟠', label: 'Medium', count: rollup.buckets.Medium.length },
        { value: 'Managed', icon: '🟢', label: 'Managed', count: rollup.managed.length },
      ])}
      ${riskFilterAxis('Type of Risk', 'source', [
        { value: 'financial', icon: '📊', label: 'Financial', count: rollup.counts.financial },
        { value: 'business', icon: '🧑', label: 'Business', count: rollup.counts.business },
        { value: 'industry', icon: '🏭', label: 'Industry', count: rollup.counts.industry },
      ])}
      <div id="risk-summary-sections" style="margin-top:10px;">
        ${riskSummarySection('🔴', 'High priority', 'High', rollup.buckets.High)}
        ${riskSummarySection('🟠', 'Medium priority', 'Medium', rollup.buckets.Medium)}
        ${riskSummarySection('🟢', 'Managed', 'Managed', rollup.managed)}
      </div>
      <button type="button" class="action" id="risk-review-btn" style="margin-top:14px;">Review risks</button>
    </div>
  `;
}

function renderRiskRollupBanner(rollup) {
  if (rollup.isQuiet) {
    return `
      <div class="cash-item cash-item-clickable" id="risk-rollup-toggle">
        <span class="cash-item-icon">✅</span>
        <span class="cash-item-label">Risk: Low — no significant new risks</span>
        <span class="chevron">▾</span>
      </div>
      <div id="risk-rollup-detail" style="display:none; margin-top:8px;">${renderRiskRollupContent(rollup)}</div>
    `;
  }
  return renderRiskRollupContent(rollup);
}

// Wires the summary region — the collapse toggle (quiet state only), the
// "Review risks" button (scrolls to the interactive due-for-review
// section), and click-to-expand on every summary row. Called after both
// the initial render and every refreshRiskLists() call, since
// summary-region's innerHTML gets replaced wholesale each time.
function wireRiskSummaryRegion(rollup) {
  const summaryEl = document.getElementById('risk-summary-region');
  if (!summaryEl) return;

  const rollupToggle = document.getElementById('risk-rollup-toggle');
  if (rollupToggle) {
    const rollupDetail = document.getElementById('risk-rollup-detail');
    rollupToggle.onclick = () => {
      const willOpen = rollupDetail.style.display === 'none';
      rollupDetail.style.display = willOpen ? 'block' : 'none';
      rollupToggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
    };
  }

  const reviewBtn = document.getElementById('risk-review-btn');
  if (reviewBtn) {
    reviewBtn.onclick = () => {
      document.getElementById('risk-business-review-region')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  }

  // AI narrative over the top risks — deliberately on-demand (a click), not
  // generated automatically on every page load, same reasoning as
  // Financial Performance's "Run analysis" being a button rather than
  // running on every visit: an AI call per page view would be wasteful
  // when nothing's necessarily changed. Not persisted anywhere — there's
  // no natural home for it in the schema, and it goes stale the moment any
  // risk changes anyway, so regenerating fresh on request is simpler than
  // caching something that needs invalidating constantly.
  const aiSummaryBtn = document.getElementById('risk-ai-summary-btn');
  if (aiSummaryBtn && rollup) {
    aiSummaryBtn.onclick = async () => {
      aiSummaryBtn.disabled = true;
      aiSummaryBtn.textContent = 'Generating…';
      try {
        const risks = [...rollup.buckets.High, ...rollup.buckets.Medium]
          .map((r) => ({ risk_name: r.risk_name, severity: r.severity, source: r.source, category: r.category, detail: r.detail }));
        const res = await fetch('/.netlify/functions/risk-summary', {
          method: 'POST',
          body: JSON.stringify({ risks, managedCount: rollup.managed.length }),
        });
        const result = await res.json();
        if (result.error) throw new Error(result.error);
        const contentEl = document.getElementById('risk-ai-summary-content');
        contentEl.style.display = 'block';
        contentEl.innerHTML = `<p class="muted plain" style="margin:0; font-style:italic;">${result.summary}</p>`;
        aiSummaryBtn.style.display = 'none';
      } catch (err) {
        aiSummaryBtn.disabled = false;
        aiSummaryBtn.textContent = '✨ Generate AI summary';
        alert('Error: ' + err.message);
      }
    };
  }

  summaryEl.querySelectorAll('.risk-summary-row').forEach((row) => {
    row.onclick = (e) => {
      if (e.target.closest('.risk-action-btn')) return; // let the action button's own handler run, don't also toggle the row
      const expandEl = row.querySelector('.risk-summary-expand');
      const chevron = row.querySelector('.risk-summary-chevron');
      const willOpen = expandEl.style.display === 'none';
      expandEl.style.display = willOpen ? 'block' : 'none';
      chevron.textContent = willOpen ? '▴' : '▾';
    };
  });

  // Two independent filter axes (Priority via data-level, Type of Risk via
  // data-source) that COMBINE — picking "High" and "Business" shows only
  // High-priority Business risks, not either/or. Instant show/hide, not a
  // re-render (this dataset is small and already fully in the DOM). Each
  // axis's pills only toggle "active" against siblings on the SAME axis
  // (the data-filter-axis scoped query below), so picking a priority
  // doesn't reset the type-of-risk selection or vice versa. A section
  // header hides itself if every row under it got filtered out, so
  // filtering to "Business" doesn't leave an empty "High priority" heading
  // sitting above nothing.
  //
  // Each pill's own count is FACETED, not fixed at render time — it always
  // reflects how many rows would match if you picked it TOGETHER with
  // whatever's currently active on the other axis, recomputed after every
  // filter change. "Industry" under Type of Risk showing (4) when Priority
  // = Medium means 4 industry risks are Medium, not "4 industry risks
  // total" — the two numbers are different questions, and this always
  // answers the one that matches what's actually about to happen if you
  // click it.
  let activeLevel = 'all';
  let activeSource = 'all';
  const rows = () => [...summaryEl.querySelectorAll('.risk-summary-row')];
  const updateRiskFilterCounts = () => {
    summaryEl.querySelectorAll('.risk-filter-pill[data-filter-axis="level"]').forEach((pill) => {
      const value = pill.dataset.filterValue;
      const count = rows().filter((row) =>
        (value === 'all' || row.dataset.level === value) && (activeSource === 'all' || row.dataset.source === activeSource)
      ).length;
      pill.querySelector('.risk-filter-count').textContent = `(${count})`;
    });
    summaryEl.querySelectorAll('.risk-filter-pill[data-filter-axis="source"]').forEach((pill) => {
      const value = pill.dataset.filterValue;
      const count = rows().filter((row) =>
        (value === 'all' || row.dataset.source === value) && (activeLevel === 'all' || row.dataset.level === activeLevel)
      ).length;
      pill.querySelector('.risk-filter-count').textContent = `(${count})`;
    });
  };
  const applyRiskFilters = () => {
    rows().forEach((row) => {
      const matchesLevel = activeLevel === 'all' || row.dataset.level === activeLevel;
      const matchesSource = activeSource === 'all' || row.dataset.source === activeSource;
      row.style.display = (matchesLevel && matchesSource) ? '' : 'none';
    });
    summaryEl.querySelectorAll('.risk-section-header').forEach((header) => {
      let sib = header.nextElementSibling;
      let anyVisible = false;
      while (sib && sib.classList.contains('risk-summary-row')) {
        if (sib.style.display !== 'none') anyVisible = true;
        sib = sib.nextElementSibling;
      }
      header.style.display = anyVisible ? '' : 'none';
    });
    updateRiskFilterCounts();
  };
  summaryEl.querySelectorAll('.risk-filter-pill').forEach((pill) => {
    pill.onclick = () => {
      const axis = pill.dataset.filterAxis;
      const value = pill.dataset.filterValue;
      summaryEl.querySelectorAll(`.risk-filter-pill[data-filter-axis="${axis}"]`).forEach((p) => p.classList.toggle('active', p === pill));
      if (axis === 'level') activeLevel = value; else activeSource = value;
      applyRiskFilters();
    };
  });
}

function renderRiskItemsCard(rows) {
  return `
    <div class="card">
      ${rows.length ? rows.map(riskItemRow).join('') : `<p class="muted plain" style="margin:0;">Nothing on file yet.</p>`}
    </div>
  `;
}

// A clickable header (same chevron-toggle pattern as the cash reconciliation
// panels) that collapses/expands everything under it — for Financial and
// Industry that's just the read-only list, for Business it's the
// interactive due-for-review area AND the read-only list together, since
// "collapse the Business section" means the whole thing, not half of it.
// Starts expanded (current behavior stays the default); collapsing is
// something the accountant opts into per section, not something sprung on
// them, since the due-for-review prompts are time-sensitive.
function riskSectionHeader(id, icon, label, hint) {
  return `
    <div class="cash-item cash-item-clickable" id="risk-section-toggle-${id}">
      <span class="cash-item-icon">${icon}</span>
      <span class="cash-item-label">${label} <span class="sub">${hint}</span></span>
      <span class="chevron">▴</span>
    </div>
  `;
}
function wireRiskSectionToggle(id) {
  const toggle = document.getElementById(`risk-section-toggle-${id}`);
  const body = document.getElementById(`risk-section-body-${id}`);
  if (!toggle || !body) return;
  toggle.onclick = () => {
    const willOpen = body.style.display === 'none';
    body.style.display = willOpen ? 'block' : 'none';
    toggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
  };
}

// One category's questions, all shown together, flat — no anchor gating
// whether the others appear. People shows Q1, Q2, Q3 all at once, each
// independently answerable in any order, each getting its own AI write-up
// when answered in its risk-indicating direction. Kept as its own card per
// category so leaving mid-review doesn't lose progress on questions
// already answered.
function renderBusinessQuestionShell(q) {
  return `
    <div id="biz-q-${q.id}" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line);">
      <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px;">

// Wires one question's Yes/No -> (auto-save if that answer means no risk,
// else show a notes box + Save that triggers AI synthesis) -> result +
// Edit link. Standalone (not nested in renderRiskAnalyse) so a freshly
// added question (see wireAddQuestionForm) can be wired the same way
// without re-rendering the whole tab.
function wireBusinessQuestion(q, category) {
  const buttonsEl = document.getElementById(`biz-q-buttons-${q.id}`);
  const notesFieldEl = document.getElementById(`biz-q-notes-field-${q.id}`);
  const notesInput = document.getElementById(`biz-q-notes-${q.id}`);
  const saveBtn = document.getElementById(`biz-q-save-${q.id}`);
  const resultEl = document.getElementById(`biz-q-result-${q.id}`);
  const deleteBtn = document.getElementById(`biz-q-delete-${q.id}`);

  const submitAnswer = async (answer, notes) => {
    const res = await fetch('/.netlify/functions/manual-entry', {
      method: 'POST',
      body: JSON.stringify({
        type: 'business_risk_question_answer', client_id: currentClientId, period_end: currentPeriodEnd,
        category, question: { id: q.id, question_text: q.question_text, risk_if_yes: q.risk_if_yes },
        answer, notes,
      }),
    });
    const result = await res.json();
    if (result.error) throw new Error(result.error);
    return result.saved;
  };

  const showResult = (item) => {
    buttonsEl.style.display = 'none';
    notesFieldEl.style.display = 'none';
    resultEl.style.display = 'block';
    resultEl.innerHTML = riskItemRow(item)
      + `<button type="button" class="mini-link" style="margin-top:6px;" id="biz-q-edit-${q.id}">Edit this answer</button>`;
    document.getElementById(`biz-q-edit-${q.id}`).onclick = () => {
      // Notes (if any were typed) were only ever hidden, never cleared —
      // still there if this question goes back through the risk-present
      // branch. Re-saving re-runs submitQuestionAnswer, which deletes only
      // THIS question's existing row before inserting the new one —
      // sibling questions in the same category are untouched.
      resultEl.style.display = 'none';
      buttonsEl.style.display = 'flex';
      buttonsEl.querySelectorAll('.biz-q-btn').forEach((b) => { b.disabled = false; });
    };
    // Keeps the summary and the read-only Business list (further down the
    // page) in sync with what was just answered, without touching this
    // card or any other still-open question elsewhere in the section —
    // see refreshRiskLists(). This used to only happen on the next full
    // tab reload, which read as "nothing changed."
    refreshRiskLists();
  };

  buttonsEl.querySelectorAll('.biz-q-btn').forEach((btn) => {
    btn.onclick = async () => {
      const answer = btn.dataset.value === 'true';
      const riskPresent = answer === q.risk_if_yes;
      notesFieldEl.style.display = 'none'; // reset in case notes was left open from a prior click on the other button

      if (!riskPresent) {
        buttonsEl.querySelectorAll('.biz-q-btn').forEach((b) => { b.disabled = true; });
        try {
          const saved = await submitAnswer(answer, '');
          showResult(saved.item);
        } catch (err) {
          buttonsEl.querySelectorAll('.biz-q-btn').forEach((b) => { b.disabled = false; });
          alert('Error: ' + err.message);
        }
        return;
      }

      buttonsEl.querySelectorAll('.biz-q-btn').forEach((b) => b.classList.toggle('secondary', b !== btn));
      notesFieldEl.style.display = 'block';
      saveBtn.onclick = async () => {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        try {
          const saved = await submitAnswer(answer, notesInput.value.trim());
          showResult(saved.item);
        } catch (err) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save';
          alert('Error: ' + err.message);
        }
      };
    };
  });

  deleteBtn.onclick = async () => {
    if (!confirm(`Delete "${q.question_text}"? It won't be asked again — any past answers stay on file.`)) return;
    deleteBtn.disabled = true;
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'business_risk_question_delete', question_id: q.id }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      document.getElementById(`biz-q-${q.id}`).remove();
    } catch (err) {
      deleteBtn.disabled = false;
      alert('Error: ' + err.message);
    }
  };
}

function wireAddQuestionForm(category) {
  const safeCategory = escAttr(category);
  const toggleBtn = document.getElementById(`biz-addq-toggle-${safeCategory}`);
  const formEl = document.getElementById(`biz-addq-form-${safeCategory}`);
  const textInput = document.getElementById(`biz-addq-text-${safeCategory}`);
  const directionSelect = document.getElementById(`biz-addq-direction-${safeCategory}`);
  const saveBtn = document.getElementById(`biz-addq-save-${safeCategory}`);
  const questionsListEl = document.getElementById(`biz-questions-${safeCategory}`);

  toggleBtn.onclick = () => {
    formEl.style.display = formEl.style.display === 'none' ? 'block' : 'none';
  };

  saveBtn.onclick = async () => {
    const text = textInput.value.trim();
    if (!text) return;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Adding…';
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'business_risk_question_add', category, question_text: text, risk_if_yes: directionSelect.value === 'true' }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      const newQ = result.saved;
      questionsListEl.insertAdjacentHTML('beforeend', renderBusinessQuestionShell(newQ));
      wireBusinessQuestion(newQ, category);
      textInput.value = '';
      formEl.style.display = 'none';
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Add question';
    }
  };
}

// Re-fetches and re-renders the summary + all three read-only lists —
// everything EXCEPT the interactive "due for review" business questions
// (risk-business-review-region), which is deliberately left untouched so
// answering one question, confirming an industry item, etc. never wipes
// out progress on other questions still open elsewhere in that section.
// Called after every business question save and every review action,
// instead of the old renderMain() full-tab reload — that's what used to
// leave the summary/lists looking like "nothing changed" until you left
// the tab and came back.
async function refreshRiskLists() {
  const data = await callRead('get_risk_items', currentClientId, currentPeriodEnd);
  const rollup = computeRiskRollup(data.financial || [], data.business || [], data.industry || []);

  const summaryEl = document.getElementById('risk-summary-region');
  if (summaryEl) summaryEl.innerHTML = renderRiskRollupBanner(rollup);
  const financialEl = document.getElementById('risk-financial-region');
  if (financialEl) financialEl.innerHTML = renderRiskItemsCard(data.financial || []);
  const businessListEl = document.getElementById('risk-business-list-region');
  if (businessListEl) businessListEl.innerHTML = renderRiskItemsCard(data.business || []);
  const industryEl = document.getElementById('risk-industry-region');
  if (industryEl) industryEl.innerHTML = renderRiskItemsCard(data.industry || []);

  wireRiskSummaryRegion(rollup);
}

async function renderRiskAnalyse(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot from Financial Performance → Input first — financial risk is detected from it, and industry risk is generated the first time a period is saved.</p></div>`;
    return;
  }
  const data = await callRead('get_risk_items', currentClientId, currentPeriodEnd);
  if (myToken !== renderToken) return;

  const categoriesToReview = data.categoriesToReview || [];
  // Due for review can be up to all 8 categories stacked at once (People,
  // Customers, Suppliers, Operations, Cash & Funding, Legal, Insurance,
  // Technology) — a picker shows just one at a time instead of all of them
  // down the page; the rest stay in the DOM (just hidden), not re-fetched,
  // so switching between them is instant.
  const categoryPickerHtml = categoriesToReview.length > 1
    ? `
      <div class="form-field" style="max-width:280px;">
        <label>Category (${categoriesToReview.length} due for review)</label>
        <select id="biz-category-picker" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:var(--font-body); background:var(--paper-raised); color:var(--ink); font-size:13px;">
          ${categoriesToReview.map((c) => `<option value="${escAttr(c.category)}">${businessCategoryLabel(c.category)} (${c.questions.length})</option>`).join('')}
        </select>
      </div>
    `
    : (categoriesToReview.length === 1
      ? `<p class="muted plain" style="margin:0 0 8px;">1 category due for review this cycle:</p>`
      : '');
  const reviewHtml = categoriesToReview.length
    ? categoryPickerHtml + categoriesToReview.map(renderBusinessReviewCategory).join('')
    : '';

  const rollup = computeRiskRollup(data.financial || [], data.business || [], data.industry || []);

  content.innerHTML = `
    <p class="section-title">Risk Review</p>
    <div id="risk-summary-region">${renderRiskRollupBanner(rollup)}</div>
    ${riskSectionHeader('financial', '📊', RISK_SOURCE_META.financial.label, RISK_SOURCE_META.financial.hint)}
    <div id="risk-section-body-financial" style="margin-top:8px;">
      <div id="risk-financial-region">${renderRiskItemsCard(data.financial || [])}</div>
    </div>
    ${riskSectionHeader('business', '🧑', RISK_SOURCE_META.business.label, RISK_SOURCE_META.business.hint)}
    <div id="risk-section-body-business" style="margin-top:8px;">
      <div id="risk-business-review-region">${reviewHtml}</div>
      <div id="risk-business-list-region">${renderRiskItemsCard(data.business || [])}</div>
    </div>
    ${riskSectionHeader('industry', '🏭', RISK_SOURCE_META.industry.label, RISK_SOURCE_META.industry.hint)}
    <div id="risk-section-body-industry" style="margin-top:8px;">
      <div id="risk-industry-region">${renderRiskItemsCard(data.industry || [])}</div>
    </div>
  `;

  wireRiskSummaryRegion(rollup);
  ['financial', 'business', 'industry'].forEach(wireRiskSectionToggle);

  const categoryPicker = document.getElementById('biz-category-picker');
  if (categoryPicker) {
    const showOnlyCategory = (category) => {
      categoriesToReview.forEach((c) => {
        const card = document.getElementById(`biz-cat-${c.category}`);
        if (card) card.style.display = (c.category === category) ? 'block' : 'none';
      });
    };
    showOnlyCategory(categoriesToReview[0].category);
    categoryPicker.onchange = () => showOnlyCategory(categoryPicker.value);
  }

  categoriesToReview.forEach((c) => {
    c.questions.forEach((q) => wireBusinessQuestion(q, c.category));
    wireAddQuestionForm(c.category);
  });

  // Review actions (Confirm/Investigate/Not applicable/No longer a risk) —
  // one listener on `content` itself (true event delegation via bubbling,
  // not a forEach over buttons present at render time) so it also catches
  // clicks on action buttons injected later — e.g. the inline synthesis
  // preview a business questionnaire Save renders directly into its own
  // category card, well after this initial wiring pass has already run.
  // Works on any row regardless of source, see lib/risk-review-actions.js.
  content.addEventListener('click', async (e) => {
    const btn = e.target.closest('.risk-action-btn');
    if (!btn) return;
    const buttonsInRow = btn.parentElement.querySelectorAll('.risk-action-btn');
    buttonsInRow.forEach((b) => { b.disabled = true; });
    const original = btn.textContent;
    btn.textContent = '…';
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'risk_review_action', risk_item_id: btn.dataset.riskId, action: btn.dataset.riskAction }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      await refreshRiskLists();
    } catch (err) {
      buttonsInRow.forEach((b) => { b.disabled = false; });
      btn.textContent = original;
      alert('Error: ' + err.message);
    }
  });
}

// Manual drag-resize is a transient browser-only state — it's gone the moment
// the textarea's DOM node is recreated (navigate away and back, reload, etc.),
// since there's nothing for the app to remember it by. Auto-growing to fit
// whatever's actually in the box sidesteps needing to resize at all.
function autoGrowTextarea(el) {
  el.style.overflowY = 'hidden';
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}

async function expandField(seedElId, btnEl, field, industryElId) {
  const ta = document.getElementById(seedElId);
  const seed = ta.value.trim();
  if (!seed) { alert('Type a short seed first — e.g. "small local electrician".'); return; }
  const original = btnEl.textContent;
  btnEl.disabled = true;
  btnEl.textContent = '…';
  try {
    const res = await fetch('/.netlify/functions/expand-text', {
      method: 'POST',
      body: JSON.stringify({ seed, field, industry: industryElId ? document.getElementById(industryElId).value : undefined }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    ta.value = data.draft || seed;
    autoGrowTextarea(ta);
  } catch (err) {
    alert('Error: ' + err.message);
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = original;
  }
}

// Bridges Financial Performance (Analyse flags, Diagnose opportunities) into
// Goals — always the current period's "business" category, since that's the
// closest existing fit for a financial-flavoured commitment. Fetches fresh
// context rather than trusting any cached copy, since this can be called from
// screens that never loaded the client's goals in the first place.
async function addTextAsGoal(text, category = 'business') {
  const fresh = await callRead('get_context', currentClientId);
  const current = fresh?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.[category]?.items || [];
  const now = new Date().toISOString();
  const items = [...current, { id: uid(), text, created_at: now, updated_at: now, done: false }];

// The only real "action" data that exists today lives inside Meeting Mode's
// localStorage briefs (the .action field recorded per priority) — there's no
// Actions-domain tracker built yet, so this reads directly from that instead
// of fabricating anything.
function getOpenActionsForClient() {
  const items = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(`oag_meeting_${currentClientId}_`)) continue;
    let brief;
    try { brief = JSON.parse(localStorage.getItem(key)); } catch { continue; }
    (brief?.priorities || []).forEach((p, idx) => {
      if (p.action && !p.actionDone) {
        items.push({ meetingKey: key, priorityIndex: idx, period_end: brief.period_end, pillar: p.pillar, action: p.action });
      }
    });
  }
  return items.sort((a, b) => (a.period_end < b.period_end ? 1 : -1));
}

function markActionDone(meetingKey, priorityIndex) {
  try {
    const brief = JSON.parse(localStorage.getItem(meetingKey));
    if (brief?.priorities?.[priorityIndex]) {
      brief.priorities[priorityIndex].actionDone = true;
      localStorage.setItem(meetingKey, JSON.stringify(brief));
    }
  } catch { /* ignore malformed entries */ }
}

function renderOpenActionsCard() {
  const wrap = document.getElementById('open-actions-card');
  const items = getOpenActionsForClient();
  if (!items.length) {
    wrap.innerHTML = '<p class="muted plain" style="margin:0;">No open commitments from past meetings on this browser.</p>';
    return;
  }
  wrap.innerHTML = items.map((it, i) => {
    const meta = PILLAR_META[it.pillar] || { name: it.pillar };
    return `<label class="action-item"><input type="checkbox" data-idx="${i}" /><span><b>${meta.name}</b> <span class="muted plain" style="display:inline;">(${it.period_end})</span> — ${it.action}</span></label>`;
  }).join('');
  wrap.querySelectorAll('input[type="checkbox"]').forEach((cb, i) => {
    cb.onchange = () => {
