// ---- Actions ----
// The piece that ties the rest of the app together. Every other domain can
// flag a gap and point at where to fix it, but nothing remembered you'd
// agreed to actually do it — this is that memory, backed by a real table
// (migration_action_items.sql) rather than living only in one browser's
// localStorage the way Meeting Mode's decisions/actions currently do.
// Client-level, not period-scoped — see the migration's header note.
const ACTION_STATUS_META = {
  not_started: { label: 'To do' },
  in_progress: { label: 'In progress' },
  done: { label: 'Done' },
};
const ACTION_SOURCE_LABEL = {
  manual: 'Manual', meeting: 'Meeting', exit_readiness: 'Exit Readiness',
  continuity: 'Continuity', estate: 'Estate', risk: 'Risk',
};

// Meeting priorities carry two different severity vocabularies depending
// on where the candidate came from — flags use 'danger'/'warning' (see
// runFlags), risk_items use 'High'/'Medium'/'Low' (see normalizeRiskItem-
// ToFlagShape) — normalized here into the one vocabulary Actions' priority
// badge understands.
function meetingPriorityToActionPriority(severity) {
  if (severity === 'danger' || severity === 'High') return 'High';
  if (severity === 'warning' || severity === 'Medium') return 'Medium';
  if (severity === 'Low') return 'Low';
  return null;
}

// Shared by every "+ Add to Actions" button across the app (Meeting,
// Exit Readiness, Business Continuity, the estate checklist) as well as
// the Actions view's own manual-add field — one call site for the actual
// write, so every entry point stays consistent without each one
// reimplementing the fetch.
async function addActionItem(text, source, priority, why) {
  const res = await fetch('/.netlify/functions/manual-entry', {
    method: 'POST',
    body: JSON.stringify({ type: 'save_action_item', client_id: currentClientId, text, source, priority: priority || null, why: why || null }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.saved;
}

// A single visible confirmation for a background "+ Add to Actions" click
// made from another card (Exit Readiness, Continuity, the estate
// checklist) — those buttons don't navigate anywhere, so without this the
// only feedback would be silence.
function flashAddedToActions(btn) {
  const original = btn.textContent;
  btn.textContent = '✓ Added';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1800);
}

// One button markup shared by every gap row across Exit Readiness,
// Business Continuity, and the estate checklist — each just supplies its
// own text/priority/source, and wireAddToActionsButtons (called once per
// page after the whole card set renders) wires all of them the same way.
function addToActionsButtonHtml(text, priority, source, why) {
  return `<button type="button" class="mini-link add-to-actions-btn" data-action-text="${escAttr(text)}" data-action-priority="${priority || ''}" data-action-source="${source}" data-action-why="${escAttr(why || '')}" style="font-size:11px; margin:0 0 8px;">+ Add to Actions</button>`;
}

function wireAddToActionsButtons(content) {
  content.querySelectorAll('.add-to-actions-btn').forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await addActionItem(btn.dataset.actionText, btn.dataset.actionSource, btn.dataset.actionPriority || null, btn.dataset.actionWhy || null);
        flashAddedToActions(btn);
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
      }
    };
  });
}

const ACTION_ITEM_OWNERS = ['Client', 'Accountant'];

// Overdue = has a due date, that date's passed, and it isn't done yet —
// same "don't flag what's already resolved" logic used everywhere else
// this app marks something as a gap (e.g. isGap on the estate checklist).
function isActionOverdue(item) {
  return !!item.due_date && item.status !== 'done' && item.due_date < new Date().toISOString().slice(0, 10);
}

// Grouped by URGENCY, not workflow status — "in progress" doesn't tell you
// whether to worry, "overdue" does. status (not_started/in_progress) is
// still tracked per-item via the status dropdown, it just isn't what
// organizes the page anymore. 14 days is the "due soon" window — no
// significance beyond "close enough to flag before it becomes overdue."
const ACTION_URGENCY_META = {
  overdue: { label: 'Overdue', icon: '🔴' },
  due_soon: { label: 'Due soon', icon: '🟠' },
  open: { label: 'Open', icon: '⚪' },
  completed: { label: 'Completed', icon: '🟢' },
};
// Actions is client-level, not period-scoped (see its own header note) —
// it never resets, so completed items only ever accumulate. Collapsed by
// default so a client with a year of history doesn't bury what's actually
// still open under a long list of done ones.
let showCompletedActions = false;
function actionUrgencyBucket(item) {
  if (item.status === 'done') return 'completed';
  if (item.due_date) {
    const today = new Date().toISOString().slice(0, 10);
    const soonThreshold = new Date(Date.now() + 14 * 24 * 3600 * 1000).toISOString().slice(0, 10);
    if (item.due_date < today) return 'overdue';
    if (item.due_date <= soonThreshold) return 'due_soon';
  }
  return 'open';
}

function actionItemRow(item) {
  const priorityBadge = item.priority ? `<span class="confidence-badge ${item.priority === 'High' ? 'red' : item.priority === 'Medium' ? 'yellow' : 'neutral'}" style="margin-left:6px;">${item.priority}</span>` : '';
  const sourceBadge = `<span class="confidence-badge neutral" style="margin-left:6px;">${ACTION_SOURCE_LABEL[item.source] || item.source}</span>`;
  const overdue = isActionOverdue(item);
  const overdueBadge = overdue ? `<span class="confidence-badge red" style="margin-left:6px;">Overdue</span>` : '';
  const ownerSelectStyle = 'font-size:12px; font-family:var(--font-body); border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); color:var(--ink); padding:6px 8px;';
  return `
    <div class="cash-item" data-action-id="${item.id}" style="align-items:flex-start; flex-wrap:wrap; padding:8px 0; border-bottom:1px solid var(--line);">
      <span class="cash-item-label" style="font-size:13px; flex:1 1 100%; ${item.status === 'done' ? 'text-decoration:line-through; color:var(--ink-soft);' : ''}">${escAttr(item.text)}${priorityBadge}${sourceBadge}${overdueBadge}</span>
      ${item.why ? `<p style="font-size:11px; color:var(--ink-soft); margin:2px 0 0; font-style:italic; flex:1 1 100%;">${escAttr(item.why)}</p>` : ''}
      <div style="display:flex; gap:6px; align-items:center; flex:1 1 100%; margin-top:6px; flex-wrap:wrap;">
        <select class="action-item-owner" style="${ownerSelectStyle}">
          <option value="" ${!item.owner ? 'selected' : ''}>Owner: —</option>
          ${ACTION_ITEM_OWNERS.map((o) => `<option value="${o}" ${item.owner === o ? 'selected' : ''}>${o}</option>`).join('')}
        </select>
        <input type="date" class="action-item-due" value="${item.due_date || ''}" style="${ownerSelectStyle} ${overdue ? 'color:var(--rust); border-color:var(--rust);' : ''}" />
        <select class="action-item-status" style="${ownerSelectStyle}">
          ${Object.entries(ACTION_STATUS_META).map(([val, meta]) => `<option value="${val}" ${item.status === val ? 'selected' : ''}>${meta.label}</option>`).join('')}
        </select>
        <button type="button" class="action-item-remove cash-adj-remove" title="Remove">✕</button>
      </div>
    </div>
  `;
}

// Every inline edit (status/owner/due date) resends the item's other
// fields unchanged, same "full row, single endpoint" shape saveActionItem
// expects — one shared call site so status/owner/due-date edits can't
// drift into three slightly different payload shapes.
async function updateActionItem(id, item, changes) {
  await fetch('/.netlify/functions/manual-entry', {
    method: 'POST',
    body: JSON.stringify({
      type: 'save_action_item', id, client_id: currentClientId,
      text: item.text, source: item.source, priority: item.priority,
      status: item.status, owner: item.owner, due_date: item.due_date, why: item.why,
      ...changes,
    }),
  });
}

async function renderActionsView(content) {
  const myToken = renderToken;
  const data = await callRead('get_action_items', currentClientId);
  if (myToken !== renderToken) return;
  const items = data?.items || [];
  const byUrgency = { overdue: [], due_soon: [], open: [], completed: [] };
  items.forEach((it) => { byUrgency[actionUrgencyBucket(it)].push(it); });
  // Soonest-due first within the open groups — undated items sort last
  // rather than first, so a stale action without a date doesn't crowd out
  // ones that actually have a deadline. Completed keeps its own order
  // (most recently completed first).
  const byDueDate = (a, b) => (a.due_date || '9999-99-99').localeCompare(b.due_date || '9999-99-99');
  byUrgency.overdue.sort(byDueDate);
  byUrgency.due_soon.sort(byDueDate);
  byUrgency.open.sort(byDueDate);
  byUrgency.completed.sort((a, b) => (b.completed_at || '').localeCompare(a.completed_at || ''));

  content.innerHTML = `
    <div class="card">
      <p class="muted">Actions</p>
      <p class="muted plain" style="margin:0 0 14px;">Everything agreed to across Meeting, Risk, and Owner &amp; Succession lands here, plus anything typed in directly — tracked to done, not just flagged and forgotten.</p>
      <div class="cash-item" style="flex-wrap:wrap; padding:0;">
        <input type="text" id="action-new-text" placeholder="Add an action…" style="flex:1 1 auto; min-width:200px; border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); font-size:13px; font-family:var(--font-body); color:var(--ink); padding:8px 10px;" />
        <select id="action-new-owner" style="font-size:12px; font-family:var(--font-body); border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); color:var(--ink); padding:8px;">
          <option value="">Owner: —</option>
          ${ACTION_ITEM_OWNERS.map((o) => `<option value="${o}">${o}</option>`).join('')}
        </select>
        <input type="date" id="action-new-due" style="font-size:12px; font-family:var(--font-body); border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); color:var(--ink); padding:7px 8px;" />
        <button class="action" id="action-add-btn" type="button">Add</button>
      </div>
    </div>
    ${['overdue', 'due_soon', 'open'].map((bucket) => {
      const rows = byUrgency[bucket];
      if (!rows.length) return '';
      const meta = ACTION_URGENCY_META[bucket];
      return `
        <div class="card">
          <p class="card-label" style="margin:0 0 6px;">${meta.icon} ${meta.label.toUpperCase()} (${rows.length})</p>
          ${rows.map(actionItemRow).join('')}
        </div>
      `;
    }).join('')}
    ${byUrgency.completed.length ? `
      <div class="card">
        <button type="button" class="add-item-link" id="toggle-completed-actions-btn">${showCompletedActions ? 'Hide' : 'Show'} ${ACTION_URGENCY_META.completed.icon} ${byUrgency.completed.length} completed action${byUrgency.completed.length === 1 ? '' : 's'} ${showCompletedActions ? '▴' : '▾'}</button>
        ${showCompletedActions ? `<div style="margin-top:10px;">${byUrgency.completed.map(actionItemRow).join('')}</div>` : ''}
      </div>
    ` : ''}
    ${!items.length ? `<div class="card placeholder"><p class="muted">Nothing here yet</p><p class="muted plain" style="margin:0;">Add one above, or use "+ Add to Actions" from Meeting, Exit Readiness, Business Continuity, or the estate checklist.</p></div>` : ''}
  `;

  const addNew = async () => {
    const input = document.getElementById('action-new-text');
    const text = input.value.trim();
    if (!text) return;
    const btn = document.getElementById('action-add-btn');
    btn.disabled = true;
    try {
      const owner = document.getElementById('action-new-owner').value || null;
      const dueDate = document.getElementById('action-new-due').value || null;
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'save_action_item', client_id: currentClientId, text, source: 'manual', owner, due_date: dueDate }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      await renderActionsView(content);
    } catch (err) {
      alert('Error: ' + err.message);
      btn.disabled = false;
    }
  };
  document.getElementById('action-add-btn').onclick = addNew;
  document.getElementById('action-new-text').onkeydown = (e) => { if (e.key === 'Enter') addNew(); };

  const toggleCompletedBtn = document.getElementById('toggle-completed-actions-btn');
  if (toggleCompletedBtn) {
    toggleCompletedBtn.onclick = () => {
      showCompletedActions = !showCompletedActions;
      renderActionsView(content);
    };
  }

  content.querySelectorAll('[data-action-id]').forEach((row) => {
    const id = row.dataset.actionId;
    const item = items.find((it) => it.id === id);
    row.querySelector('.action-item-status').onchange = async (e) => {
      try {
        await updateActionItem(id, item, { status: e.target.value });
        await renderActionsView(content);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
    row.querySelector('.action-item-owner').onchange = async (e) => {
      try {
        await updateActionItem(id, item, { owner: e.target.value || null });
        await renderActionsView(content);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
    row.querySelector('.action-item-due').onchange = async (e) => {
      try {
        await updateActionItem(id, item, { due_date: e.target.value || null });
        await renderActionsView(content);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
    row.querySelector('.action-item-remove').onclick = async () => {
      if (!confirm('Remove this action?')) return;
      try {
        await fetch('/.netlify/functions/manual-entry', {
          method: 'POST',
          body: JSON.stringify({ type: 'delete_action_item', id, client_id: currentClientId }),
        });
        await renderActionsView(content);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
  });
}

// ---- Risk: Analyse ----
// Rolls up all sources sharing risk_items (financial/business/industry, see
// lib/financial-risk-sync.js, lib/business-risk-questionnaire.js,
// lib/industry-risk-checklist.js) into one view, in that order — the order
// the accountant would actually work through them: the numbers first
// (already computed), then what only a human can answer, then general
// industry context last. Financial is period-scoped, so it reads for
// currentPeriodEnd like every other Analyse tab; industry and business
// don't change per period (see read-data.js's get_risk_items), so both
// always show the client's full history regardless of which period is
// selected.
const RISK_SOURCE_META = {
  financial: { label: 'Financial', hint: 'Detected automatically from this period’s ratios and trends.' },
  business: { label: 'Business', hint: 'From check-in questions only a human can answer.' },
  industry: { label: 'Industry', hint: 'AI-generated from this client’s industry — general knowledge, not verified. Review each one.' },
  owner_wealth: { label: 'Owner & Succession', hint: 'From Owner & Succession’s estate planning checklist and succession readiness/pathway — edit the source there, not here.' },
};
const RISK_SEVERITY_BADGE = { High: 'red', Medium: 'yellow', Low: 'green' };
const RISK_STATUS_BADGE = { Detected: 'red', Identified: 'yellow', Watch: 'yellow', Managed: 'green', 'Not applicable': 'green', Unknown: 'yellow' };
const RISK_REVIEW_ACTIONS = [
  ['confirm', 'Confirm'], ['investigate', 'Investigate'],
  ['not_applicable', 'Not applicable'], ['no_longer_a_risk', 'No longer a risk'],
];
function capitalizeWord(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// A "no risk identified" row from a question's no-risk branch (see
// submitQuestionAnswer) never gets a recommendation — a real risk always
// does, even after a review action later marks it Managed/resolved (the
// action only touches status, never recommendation). That's the reliable
// way to tell "never was a risk" apart from "was a risk, now resolved"
// without a dedicated column.
function isQuietNoRiskRow(r) {
  return r.source === 'business' && !r.recommendation;
}

function riskItemRow(r, opts = {}) {
  // Off by default: the same risk_items row gets rendered twice on the
  // page (once here, once hidden inside the summary's click-to-expand
  // panel — see riskSummaryRow) and the row id/edit button only make
  // sense — and only need to be unique — in ONE of those places at a
  // time. Only renderBusinessHistoryGrouped passes editable:true, since
  // that's the one read-only list an accountant would actually click
  // "Edit answer" from.
  const editable = opts.editable === true;
  if (isQuietNoRiskRow(r)) {
    // Includes WHICH question this answered (r.detail holds the literal
    // question text for the no-risk branch, see submitQuestionAnswer) —
    // a category can have 2-3 separate questions each land here, and
    // without the question text every line just reads as "Category —
    // reviewed, no risk identified" repeated with no way to tell them
    // apart or know whether every question's actually been covered.
    return `
      <div class="flag-row-wrap"${editable ? ` id="risk-row-${r.id}"` : ''}>
        <div class="flag-row" style="align-items:flex-start;">
          <span class="flag-dot sage" style="margin-top:5px;"></span>
          <div style="flex:1; min-width:0;">
            <span class="muted plain" style="margin:0;">No risk${r.last_reviewed_date ? ` <span style="font-size:11px;">(${formatShortDate(r.last_reviewed_date)})</span>` : ''}</span>
            ${r.detail ? `<p class="muted plain" style="margin:2px 0 0; font-size:12px;">${r.detail}</p>` : ''}
            ${editable && r.question_id ? `
              <button type="button" class="mini-link" style="margin-top:4px;" data-edit-risk-row-id="${r.id}" data-edit-question-id="${r.question_id}" data-edit-category="${escAttr(r.category || '')}">Edit answer</button>
              <button type="button" class="mini-link" style="margin-top:4px;" data-unanswer-risk-row-id="${r.id}">Unanswer</button>
            ` : ''}
          </div>
        </div>
      </div>
    `;
  }
  return `
    <div class="flag-row-wrap">
      <div class="flag-row" style="align-items:flex-start;">
        <span class="flag-dot ${r.severity === 'High' ? 'rust' : 'sage'}" style="margin-top:5px;"></span>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;">
            <b>${r.risk_name}</b>
            <span class="confidence-badge ${RISK_SEVERITY_BADGE[r.severity] || 'yellow'}">${r.severity || 'Medium'}</span>
            <span class="confidence-badge ${RISK_STATUS_BADGE[r.status] || 'yellow'}">${r.status}</span>
            ${r.is_new ? '<span class="confidence-badge yellow">New</span>' : ''}
            ${r.is_changed ? '<span class="confidence-badge yellow">Changed</span>' : ''}
          </div>
          ${r.detail ? `<p class="muted plain" style="margin:4px 0 0;">${r.detail}</p>` : ''}
          ${r.recommendation ? `<p class="muted plain" style="margin:2px 0 0;"><b>Recommended:</b> ${r.recommendation}</p>` : ''}
          ${r.notes ? `<p class="muted plain" style="margin:2px 0 0; white-space:pre-wrap;">${r.notes}</p>` : ''}
          ${r.impact_estimate ? `<p class="muted plain" style="margin:2px 0 0;">${r.impact_estimate}</p>` : ''}
          ${r.last_reviewed_date ? `<p class="muted plain" style="margin:2px 0 0; font-size:11px;">Reviewed ${formatShortDate(r.last_reviewed_date)}</p>` : ''}
          <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:6px;">
            ${RISK_REVIEW_ACTIONS.map(([action, label]) => `<button type="button" class="mini-link risk-action-btn" style="margin-left:0;" data-risk-id="${r.id}" data-risk-action="${action}">${label}</button>`).join('')}
            ${editable && r.question_id ? `<button type="button" class="mini-link" style="margin-left:0;" data-unanswer-risk-row-id="${r.id}">Unanswer</button>` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

// ---- Risk: rollup banner ----
// Pure client-side rollup over what get_risk_items already returns — no new
// query, just querying-by-status/severity as already discussed. Business
// rows accumulate one row-set per period a category gets reviewed (the
// delete-then-insert guard only clears THIS period's rows, so a category
// reviewed in 2026 and again in 2027 leaves both on file as history) — the
// rollup only wants the CURRENT standing, so it dedupes to each category's
// most-recently-reviewed period first. Financial and industry don't need
// this: financial's query is already period-scoped, and industry rows are
// only ever written once, per client, on first generation.
function dedupeBusinessToLatestPerCategory(business) {
  const latestPeriodByCategory = {};
  business.forEach((r) => {
    if (!latestPeriodByCategory[r.category] || r.period_end > latestPeriodByCategory[r.category]) {
      latestPeriodByCategory[r.category] = r.period_end;
    }
  });
  return business.filter((r) => r.period_end === latestPeriodByCategory[r.category]);
}

// 'Unknown' (industry's default until an accountant confirms/dismisses each
// one — no such UI yet, see ideas.md) counts as needing attention alongside
// Detected/Identified/Watch; Managed/Not applicable are resolved and don't.
const RISK_ACTIVE_STATUSES = new Set(['Detected', 'Identified', 'Watch', 'Unknown']);

function computeRiskRollup(financial, business, industry, ownerWealth) {
  ownerWealth = ownerWealth || [];
  const businessLatest = dedupeBusinessToLatestPerCategory(business);
  const activeFinancial = financial.filter((r) => RISK_ACTIVE_STATUSES.has(r.status));
  const activeBusiness = businessLatest.filter((r) => RISK_ACTIVE_STATUSES.has(r.status));
  const activeIndustry = industry.filter((r) => RISK_ACTIVE_STATUSES.has(r.status));
  // No new/changed tracking for owner_wealth, same reasoning industry
  // already uses — it's fully replaced (delete-then-reinsert) on every
  // Owner Wealth save, not incrementally re-synced like financial/business,
  // so "new this cycle" isn't a meaningful distinction for it.
  const activeOwnerWealth = ownerWealth.filter((r) => RISK_ACTIVE_STATUSES.has(r.status));
  const allActive = [...activeFinancial, ...activeBusiness, ...activeIndustry, ...activeOwnerWealth];

  // Severity is only ever 'High'/'Medium' on a genuinely active item in
  // practice — 'Low' only shows up on business's "no risk" rows, which are
  // always Managed, never active. A "Low priority, still open" bucket would
  // sit empty forever, so the third bucket is Managed/Not applicable
  // instead — "what's actually fine" is at least as useful to see at a
  // glance as an always-empty bucket.
  const buckets = { High: [], Medium: [] };
  allActive.forEach((r) => { (buckets[r.severity] || buckets.Medium).push(r); });
  const managed = [...financial, ...businessLatest, ...industry, ...ownerWealth].filter((r) => r.status === 'Managed' || r.status === 'Not applicable');

  // Source counts span everything shown (active + managed), not just
  // active — otherwise the Source filter axis's "All" total wouldn't match
  // the Priority axis's "All" total, and clicking "Business" would hide
  // any managed business item entirely (resolved doesn't mean sourceless).
  const allShown = [...allActive, ...managed];
  const countBySource = (src) => allShown.filter((r) => r.source === src).length;
  const countByStatus = (status) => allShown.filter((r) => r.status === status).length;

  // is_new/is_changed only means something for sources that get re-synced
  // over time (financial every analysis run, business every review cycle)
  // — industry is generated once and never revisited, so "new this cycle"
  // doesn't apply to it; it gets its own "needs review" count instead,
  // since every industry item starts at Unknown until confirmed/dismissed.
  const newCount = [...activeFinancial, ...activeBusiness].filter((r) => r.is_new).length;
  const changedCount = [...activeFinancial, ...activeBusiness].filter((r) => r.is_changed).length;
  const industryNeedsReview = activeIndustry.filter((r) => r.status === 'Unknown').length;

  const level = buckets.High.length ? 'High' : buckets.Medium.length ? 'Medium' : 'Low';
  const isQuiet = level === 'Low' && newCount === 0 && changedCount === 0 && industryNeedsReview === 0;

  return {
    buckets, managed,
    counts: { financial: countBySource('financial'), business: countBySource('business'), industry: countBySource('industry'), owner_wealth: countBySource('owner_wealth') },
    statusCounts: {
      Detected: countByStatus('Detected'), Identified: countByStatus('Identified'), Watch: countByStatus('Watch'),
      Managed: countByStatus('Managed'), 'Not applicable': countByStatus('Not applicable'), Unknown: countByStatus('Unknown'),
    },
    allActiveCount: allActive.length, newCount, changedCount, industryNeedsReview,
    level, isQuiet,
  };
}

const RISK_SOURCE_PILL = {
  financial: { icon: '📊', label: 'Financial' },
  business: { icon: '🧑', label: 'Business' },
  industry: { icon: '🏭', label: 'Industry' },
};

// Deliberately distinct from Priority's red/orange/green dots (High/Medium/
// Managed) even though some of these overlap in meaning — using the same
// colored-dot icons on two different axes would read as duplicate
// information instead of two different questions ("how urgent" vs "what
// stage of review is it at").
const RISK_STATUS_PILL = {
  Detected: { icon: '🆕', label: 'Detected' },
  Identified: { icon: '⚠️', label: 'Identified' },
  Watch: { icon: '👀', label: 'Watch' },
  Managed: { icon: '✅', label: 'Managed' },
  'Not applicable': { icon: '🚫', label: 'Not applicable' },
  Unknown: { icon: '❓', label: 'Unknown' },
};

// One clickable line per risk in the summary — name, then three pills in
// three different visual registers so they read as different KINDS of
// fact, not one row of same-looking tags: severity is filled (the urgency
// verdict), status is outlined (a workflow stage, not a verdict), source
// is a neutral icon tag (just a category). Click anywhere on the row
// (except an action button) to expand the SAME riskItemRow() detail used
// in the full source-grouped lists below (recommendation, notes, Confirm/
// Investigate/etc.) right in place — seeing "the stuff" behind a summary
// line never requires scrolling to hunt for it elsewhere on the page. The
// full detail is rendered into the DOM up front (just hidden), not
// fetched on click — this dataset is small (a handful of risks at most)
// and it means the action buttons work immediately via the existing
// content-level .risk-action-btn delegation, no extra wiring needed per
// row. data-source/data-level drive the two filter pill rows above (see
// wireRiskSummaryRegion) — level is the bucket it's grouped under
// (High/Medium/Managed), passed in from riskSummarySection rather than
// read off severity, since Managed items keep whatever severity they were
// given (often Low) but belong in the Managed filter, not a "Low" one.
function riskSummaryRow(r, level) {
  const detail = r.detail || '';
  const preview = detail.length > 90 ? detail.slice(0, 90) + '…' : detail;
  const sourceMeta = RISK_SOURCE_PILL[r.source] || { icon: '', label: r.source };
  return `
    <div class="risk-summary-row" data-source="${r.source}" data-level="${level}" data-status="${r.status}" style="padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer;">
      <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
        <b style="font-size:13px;">${r.risk_name}</b>
        <span class="risk-pill risk-pill-severity ${(r.severity || 'Medium').toLowerCase()}">${r.severity || 'Medium'}</span>
        <span class="risk-pill risk-pill-status">${r.status}</span>
        <span class="risk-pill risk-pill-source">${sourceMeta.icon} ${sourceMeta.label}</span>
        ${r.is_new ? '<span class="risk-pill risk-pill-flag">New</span>' : ''}
        ${r.is_changed ? '<span class="risk-pill risk-pill-flag">Changed</span>' : ''}
        <span class="muted plain risk-summary-chevron" style="font-size:11px; margin-left:auto;">▾</span>
      </div>
      ${preview ? `<p class="muted plain" style="margin:4px 0 0;">${preview}</p>` : ''}
      <div class="risk-summary-expand" style="display:none; margin:8px 0 0;">${riskItemRow(r)}</div>
    </div>
  `;
}

function riskSummarySection(icon, label, level, rows) {
  if (!rows.length) return '';
  return `<div class="risk-section-header ${level}">${icon} ${label} <span class="risk-section-count">(${rows.length})</span></div>${rows.map((r) => riskSummaryRow(r, level)).join('')}`;
}

// One row of pills for one filter axis. The count in each pill is faceted
// — it recomputes live as the OTHER axis's selection changes (see
// updateRiskFilterCounts in wireRiskSummaryRegion), so "Industry" under
// Type of Risk shows however many industry risks match whatever Priority
// is currently selected, not a fixed number frozen at render time. The
// count sits in its own span so it can be updated in place without
// touching the icon/label text. "All" always sits first and starts active.
//
// totalCount is the true total row count, passed in explicitly rather than
// summed from options — Priority only lists High/Medium as pills (Managed
// isn't a priority), so summing its options undercounts "All" against what
// clicking it actually shows (everything, Managed included: "All" means no
// restriction from this axis, not "sum of this axis's own listed values").
// Without this, the initial render showed "All (2)" but any click at all
// triggered a live recompute in updateRiskFilterCounts that correctly used
// the true total and showed "All (10)" — same data, two different numbers
// for the same label depending on interaction history.
function riskFilterAxis(axisLabel, axis, options, totalCount) {
  const allCount = totalCount !== undefined ? totalCount : options.reduce((sum, o) => sum + o.count, 0);
  return `
    <p class="muted" style="margin:14px 0 4px;">${axisLabel}</p>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button type="button" class="risk-filter-pill active" data-filter-axis="${axis}" data-filter-value="all">All <span class="risk-filter-count">(${allCount})</span></button>
      ${options.map((o) => `<button type="button" class="risk-filter-pill" data-filter-axis="${axis}" data-filter-value="${o.value}">${o.icon ? o.icon + ' ' : ''}${o.label} <span class="risk-filter-count">(${o.count})</span></button>`).join('')}
    </div>
  `;
}

// Business questionnaire category display names — separate from the
// Type of Risk filter's "Financial" (source='financial', auto-detected
// from ratios). The questionnaire's "financial" CATEGORY (cash/debt/
// funding questions) is a different thing that happens to share the word
// — relabeled here so "Financial" doesn't mean two unrelated things
// depending which part of the page you're looking at.
const BUSINESS_CATEGORY_LABEL = {
  people: 'People', customers: 'Customers', suppliers: 'Suppliers', operations: 'Operations',
  financial: 'Cash & Funding', legal: 'Legal', insurance: 'Insurance', technology: 'Technology',
};
function businessCategoryLabel(category) {
  return BUSINESS_CATEGORY_LABEL[category] || capitalizeWord(category);
}

// The full card content, shared between the always-expanded state and
// what's revealed when the quiet collapsed state is clicked open — same
// content either way, just a different entry point to it.
function renderRiskRollupContent(rollup) {
  const levelIcon = rollup.level === 'High' ? '🔴' : rollup.level === 'Medium' ? '🟠' : '🟢';
  const bits = [];
  if (rollup.newCount) bits.push(`${rollup.newCount} new`);
  if (rollup.changedCount) bits.push(`${rollup.changedCount} changed`);
  // Same denominator for every axis's "All" pill — the true count of every
  // risk item on file, since selecting "All" on any one axis means "don't
  // restrict by this axis," not "sum of whatever this axis happens to list."
  const totalCount = rollup.buckets.High.length + rollup.buckets.Medium.length + rollup.managed.length;
  return `
    <div class="card">
      <p class="muted" style="margin:0 0 6px;">Overall Risk</p>
      <div class="risk-overall-pill ${rollup.level}">${levelIcon} ${rollup.level}</div>
      ${bits.length ? `<p class="muted plain" style="margin:8px 0 0; font-size:12px;">${bits.join(' · ')} this cycle</p>` : ''}
      <div style="margin-top:10px;">
        <button type="button" class="mini-link" style="margin-left:0;" id="risk-ai-summary-btn">✨ Generate AI summary</button>
        <div id="risk-ai-summary-content" style="display:none; margin-top:6px;"></div>
      </div>
      <!-- Third pill's value is still "Managed" (same rollup.managed rows,
           same data-level token as the Resolved section below) but the
           LABEL says "No priority" — resolved items don't have an urgency
           tier, and Status already has its own "Managed" pill with a
           different, more precise count (Managed only, not Not applicable
           too). Reusing the word "Managed" here would put the same label
           on two different numbers again. This way Priority's own options
           still add up to All, like Type of Risk and Status do, without
           the naming collision. -->
      ${riskFilterAxis('Priority', 'level', [
        { value: 'High', icon: '🔴', label: 'High', count: rollup.buckets.High.length },
        { value: 'Medium', icon: '🟠', label: 'Medium', count: rollup.buckets.Medium.length },
        { value: 'Managed', icon: '⚪', label: 'No priority', count: rollup.managed.length },
      ], totalCount)}
      ${riskFilterAxis('Type of Risk', 'source', [
        { value: 'financial', icon: '📊', label: 'Financial', count: rollup.counts.financial },
        { value: 'business', icon: '🧑', label: 'Business', count: rollup.counts.business },
        { value: 'industry', icon: '🏭', label: 'Industry', count: rollup.counts.industry },
        { value: 'owner_wealth', icon: '👤', label: 'Owner & Succession', count: rollup.counts.owner_wealth },
      ], totalCount)}
      ${riskFilterAxis('Status', 'status', Object.entries(RISK_STATUS_PILL)
        .map(([status, meta]) => ({ value: status, icon: meta.icon, label: meta.label, count: rollup.statusCounts[status] })), totalCount)}
      <div id="risk-summary-sections" style="margin-top:10px;">
        ${riskSummarySection('🔴', 'High priority', 'High', rollup.buckets.High)}
        ${riskSummarySection('🟠', 'Medium priority', 'Medium', rollup.buckets.Medium)}
        <!-- Label says "Resolved", not "Managed" — this bucket is Managed
             AND Not applicable combined (see computeRiskRollup), and the
             Status axis right above it has its own separate "Managed"
             pill with a DIFFERENT, smaller count (Managed only, no Not
             applicable). Same word, two different numbers side by side
             was the actual bug being reported — the section itself
             (rollup.managed / the 'Managed' internal level/CSS token)
             is unchanged, only this user-facing label. -->
        ${riskSummarySection('🟢', 'Resolved', 'Managed', rollup.managed)}
      </div>
      <button type="button" class="action" id="risk-review-btn" style="margin-top:14px;">Review risks</button>
    </div>
  `;
}

function renderRiskRollupBanner(rollup) {
  if (rollup.isQuiet) {
    return `
      <div class="cash-item cash-item-clickable" id="risk-rollup-toggle">
        <span class="cash-item-icon">✅</span>
        <span class="cash-item-label">Risk: Low — no significant new risks</span>
        <span class="chevron">▾</span>
      </div>
      <div id="risk-rollup-detail" style="display:none; margin-top:8px;">${renderRiskRollupContent(rollup)}</div>
    `;
  }
  return renderRiskRollupContent(rollup);
}

// Wires the summary region — the collapse toggle (quiet state only), the
// "Review risks" button (scrolls to the interactive due-for-review
// section), and click-to-expand on every summary row. Called after both
// the initial render and every refreshRiskLists() call, since
// summary-region's innerHTML gets replaced wholesale each time.
function wireRiskSummaryRegion(rollup) {
  const summaryEl = document.getElementById('risk-summary-region');
  if (!summaryEl) return;

  const rollupToggle = document.getElementById('risk-rollup-toggle');
  if (rollupToggle) {
    const rollupDetail = document.getElementById('risk-rollup-detail');
    rollupToggle.onclick = () => {
      const willOpen = rollupDetail.style.display === 'none';
      rollupDetail.style.display = willOpen ? 'block' : 'none';
      rollupToggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
    };
  }

  const reviewBtn = document.getElementById('risk-review-btn');
  if (reviewBtn) {
    reviewBtn.onclick = () => {
      document.getElementById('risk-business-review-region')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  }

  // AI narrative over the top risks — deliberately on-demand (a click), not
  // generated automatically on every page load, same reasoning as
  // Financial Performance's "Run analysis" being a button rather than
  // running on every visit: an AI call per page view would be wasteful
  // when nothing's necessarily changed. Not persisted anywhere — there's
  // no natural home for it in the schema, and it goes stale the moment any
  // risk changes anyway, so regenerating fresh on request is simpler than
  // caching something that needs invalidating constantly.
  const aiSummaryBtn = document.getElementById('risk-ai-summary-btn');
  if (aiSummaryBtn && rollup) {
    aiSummaryBtn.onclick = async () => {
      aiSummaryBtn.disabled = true;
      aiSummaryBtn.textContent = 'Generating…';
      try {
        const risks = [...rollup.buckets.High, ...rollup.buckets.Medium]
          .map((r) => ({ risk_name: r.risk_name, severity: r.severity, source: r.source, category: r.category, detail: r.detail }));
        const res = await fetch('/.netlify/functions/risk-summary', {
          method: 'POST',
          body: JSON.stringify({ risks, managedCount: rollup.managed.length }),
        });
        const result = await res.json();
        if (result.error) throw new Error(result.error);
        const contentEl = document.getElementById('risk-ai-summary-content');
        contentEl.style.display = 'block';
        contentEl.innerHTML = `<p class="muted plain" style="margin:0; font-style:italic;">${result.summary}</p>`;
        aiSummaryBtn.style.display = 'none';
      } catch (err) {
        aiSummaryBtn.disabled = false;
        aiSummaryBtn.textContent = '✨ Generate AI summary';
        alert('Error: ' + err.message);
      }
    };
  }

  summaryEl.querySelectorAll('.risk-summary-row').forEach((row) => {
    row.onclick = (e) => {
      if (e.target.closest('.risk-action-btn')) return; // let the action button's own handler run, don't also toggle the row
      const expandEl = row.querySelector('.risk-summary-expand');
      const chevron = row.querySelector('.risk-summary-chevron');
      const willOpen = expandEl.style.display === 'none';
      expandEl.style.display = willOpen ? 'block' : 'none';
      chevron.textContent = willOpen ? '▴' : '▾';
    };
  });

  // Two independent filter axes (Priority via data-level, Type of Risk via
  // data-source) that COMBINE — picking "High" and "Business" shows only
  // High-priority Business risks, not either/or. Instant show/hide, not a
  // re-render (this dataset is small and already fully in the DOM). Each
  // axis's pills only toggle "active" against siblings on the SAME axis
  // (the data-filter-axis scoped query below), so picking a priority
  // doesn't reset the type-of-risk selection or vice versa. A section
  // header hides itself if every row under it got filtered out, so
  // filtering to "Business" doesn't leave an empty "High priority" heading
  // sitting above nothing.
  //
  // Each pill's own count is FACETED, not fixed at render time — it always
  // reflects how many rows would match if you picked it TOGETHER with
  // whatever's currently active on the OTHER axes, recomputed after every
  // filter change. "Industry" under Type of Risk showing (4) when Priority
  // = Medium means 4 industry risks are Medium, not "4 industry risks
  // total" — the two numbers are different questions, and this always
  // answers the one that matches what's actually about to happen if you
  // click it. Three axes now (level/source/status) driven off one config
  // object rather than one pair of hardcoded variables/branches per axis —
  // axis names match their .risk-summary-row data-* attribute 1:1
  // (data-level/data-source/data-status), so row.dataset[axis] reads
  // straight through with no per-axis special-casing.
  //
  // Each axis holds a SET of selected values, not a single one — click
  // "High" and "Medium" together under Priority to see both without
  // Managed, click one again to drop just that one back out. An empty set
  // means no filter on that axis (equivalent to "All"), which is also what
  // clicking "All" itself resets it to. Values within an axis OR together
  // (High or Medium); axes AND together (Priority AND Type AND Status),
  // same combining behavior as before, just no longer capped at one
  // selection per axis.
  const AXES = ['level', 'source', 'status'];
  const activeFilters = { level: new Set(), source: new Set(), status: new Set() };
  const rows = () => [...summaryEl.querySelectorAll('.risk-summary-row')];
  const axisMatches = (row, axis) => activeFilters[axis].size === 0 || activeFilters[axis].has(row.dataset[axis]);
  const rowMatchesOtherAxes = (row, exceptAxis) => AXES.every((axis) => axis === exceptAxis || axisMatches(row, axis));
  const updateRiskFilterCounts = () => {
    AXES.forEach((axis) => {
      summaryEl.querySelectorAll(`.risk-filter-pill[data-filter-axis="${axis}"]`).forEach((pill) => {
        const value = pill.dataset.filterValue;
        const count = rows().filter((row) =>
          (value === 'all' || row.dataset[axis] === value) && rowMatchesOtherAxes(row, axis)
        ).length;
        pill.querySelector('.risk-filter-count').textContent = `(${count})`;
      });
    });
  };
  const applyRiskFilters = () => {
    rows().forEach((row) => {
      const matches = AXES.every((axis) => axisMatches(row, axis));
      row.style.display = matches ? '' : 'none';
    });
    summaryEl.querySelectorAll('.risk-section-header').forEach((header) => {
      let sib = header.nextElementSibling;
      let visibleCount = 0;
      while (sib && sib.classList.contains('risk-summary-row')) {
        if (sib.style.display !== 'none') visibleCount += 1;
        sib = sib.nextElementSibling;
      }
      // The header's own count used to be static text baked in at initial
      // render — filtering down to Watch would hide all but one row under
      // "Medium priority" but the heading still said "(2)" from before any
      // filter was applied, since nothing ever rewrote it. Now it tracks
      // however many of its rows are actually showing, same as the filter
      // pills' own counts do.
      const countEl = header.querySelector('.risk-section-count');
      if (countEl) countEl.textContent = `(${visibleCount})`;
      header.style.display = visibleCount > 0 ? '' : 'none';
    });
    updateRiskFilterCounts();
  };
  summaryEl.querySelectorAll('.risk-filter-pill').forEach((pill) => {
    pill.onclick = () => {
      const axis = pill.dataset.filterAxis;
      const value = pill.dataset.filterValue;
      if (value === 'all') {
        activeFilters[axis].clear();
      } else if (activeFilters[axis].has(value)) {
        activeFilters[axis].delete(value);
      } else {
        activeFilters[axis].add(value);
      }
      // "All" is active exactly when nothing specific is selected on this
      // axis — not just on its own click, but also as the natural result
      // of toggling the last specific pill back off.
      summaryEl.querySelectorAll(`.risk-filter-pill[data-filter-axis="${axis}"]`).forEach((p) => {
        const v = p.dataset.filterValue;
        p.classList.toggle('active', v === 'all' ? activeFilters[axis].size === 0 : activeFilters[axis].has(v));
      });
      applyRiskFilters();
    };
  });
}

function renderRiskItemsCard(rows) {
  return `
    <div class="card">
      ${rows.length ? rows.map(riskItemRow).join('') : `<p class="muted plain" style="margin:0;">Nothing on file yet.</p>`}
    </div>
  `;
}

// Business's read-only history, grouped by category instead of one flat
// list — a category with 3 questions writes 3 separate rows (see
// submitQuestionAnswer), so a flat list means "Cash & Funding" (or any
// multi-question category) shows up 2-3 times in a row with nothing
// visually distinguishing WHICH question each line is, which is exactly
// what made "how do you know everything is complete" impossible to answer
// from the old flat version. Grouped, each category is one small pill
// showing how many items are filed under it — click to open just that
// group, same multi-open pill pattern as the due-for-review picker above
// it, not locked to one category at a time and not one big box per group.
function renderBusinessHistoryGrouped(rows) {
  if (!rows.length) return `<div class="card"><p class="muted plain" style="margin:0;">Nothing on file yet.</p></div>`;
  const byCategory = {};
  rows.forEach((r) => { (byCategory[r.category] = byCategory[r.category] || []).push(r); });
  const categories = Object.keys(byCategory).sort((a, b) => businessCategoryLabel(a).localeCompare(businessCategoryLabel(b)));
  return `
    <p class="muted" style="margin:14px 0 6px;">Past answers, by category — click to view, edit, or unanswer</p>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">
      ${categories.map((cat) => `<button type="button" class="risk-filter-pill" data-biz-history-pill="${escAttr(cat)}">${businessCategoryLabel(cat)} <span class="risk-filter-count">(${byCategory[cat].length})</span></button>`).join('')}
    </div>
    ${categories.map((cat) => `
      <div class="card" id="biz-history-${escAttr(cat)}" style="display:none;">
        ${byCategory[cat].map((r) => riskItemRow(r, { editable: true })).join('')}
      </div>
    `).join('')}
  `;
}
function wireBusinessHistoryPills() {
  document.querySelectorAll('[data-biz-history-pill]').forEach((pill) => {
    pill.onclick = () => {
      const cat = pill.dataset.bizHistoryPill;
      const body = document.getElementById(`biz-history-${cat}`);
      if (!body) return;
      const willOpen = body.style.display === 'none';
      body.style.display = willOpen ? 'block' : 'none';
      pill.classList.toggle('active', willOpen);
    };
  });
}

// Lets an accountant reopen an already-answered question straight from the
// read-only history — needed because a "no risk identified" row otherwise
// has no way back to it: it only resurfaces in the due-for-review section
// once it goes stale or the answer indicates an open risk (see
// getCategoriesForReview). Reuses the exact same shell + wiring as the
// live due-for-review flow (renderBusinessQuestionShell / wireBusinessQuestion)
// so answering again — including AI synthesis if the new answer indicates
// risk — behaves identically either way. questionsById comes from
// get_risk_items' allQuestions (every active question, not just ones due
// this cycle), since the row itself only carries risk_if_yes implicitly.
function wireRiskAnswerEdit(questionsById) {
  document.querySelectorAll('[data-edit-risk-row-id]').forEach((btn) => {
    btn.onclick = () => {
      const q = questionsById[btn.dataset.editQuestionId];
      const category = btn.dataset.editCategory;
      const rowId = btn.dataset.editRiskRowId;
      const rowEl = document.getElementById(`risk-row-${rowId}`);
      if (!q || !rowEl) { alert('Could not find this question — try reloading.'); return; }
      // Keyed by the risk_items row id, not q.id — this same question may
      // simultaneously have a shell already on the page in the
      // due-for-review section (if it's also due this cycle), and a
      // shared key would make wireBusinessQuestion bind to whichever one
      // happens to come first in the DOM instead of this one.
      const domKey = `edit-${rowId}`;
      rowEl.outerHTML = renderBusinessQuestionShell(q, { domKey });
      wireBusinessQuestion(q, category, { domKey });
    };
  });
}

// Clears an answer outright instead of replacing it — for when a past
// "no risk" answer was a mistake, not just out of date. The question then
// has no risk_items row at all, so getCategoriesForReview treats it as
// never-asked and it becomes due for review again — but not until the
// Risk tab is next reloaded (this deliberately doesn't try to build a
// due-for-review card for it live, since that category might not
// currently have one on the page, and constructing one on the fly risks
// disturbing other in-progress answers already open elsewhere in that
// section).
function wireRiskAnswerUnanswer() {
  document.querySelectorAll('[data-unanswer-risk-row-id]').forEach((btn) => {
    btn.onclick = async () => {
      if (!confirm('Clear this answer? The question goes back to unanswered and will need to be asked again.')) return;
      const rowId = btn.dataset.unanswerRiskRowId;
      btn.disabled = true;
      try {
        const res = await fetch('/.netlify/functions/manual-entry', {
          method: 'POST',
          body: JSON.stringify({ type: 'business_risk_question_unanswer', client_id: currentClientId, risk_item_id: rowId }),
        });
        const result = await res.json();
        if (result.error) throw new Error(result.error);
        refreshRiskLists();
      } catch (err) {
        btn.disabled = false;
        alert('Error: ' + err.message);
      }
    };
  });
}

// A clickable header (same chevron-toggle pattern as the cash reconciliation
// panels) that collapses/expands everything under it — for Financial and
// Industry that's just the read-only list, for Business it's the
// interactive due-for-review area AND the read-only list together, since
// "collapse the Business section" means the whole thing, not half of it.
// Starts expanded (current behavior stays the default); collapsing is
// something the accountant opts into per section, not something sprung on
// them, since the due-for-review prompts are time-sensitive.
function riskSectionHeader(id, icon, label, hint) {
  return `
    <div class="cash-item cash-item-clickable" id="risk-section-toggle-${id}">
      <span class="cash-item-icon">${icon}</span>
      <span class="cash-item-label">${label} <span class="sub">${hint}</span></span>
      <span class="chevron">▴</span>
    </div>
  `;
}
function wireRiskSectionToggle(id) {
  const toggle = document.getElementById(`risk-section-toggle-${id}`);
  const body = document.getElementById(`risk-section-body-${id}`);
  if (!toggle || !body) return;
  toggle.onclick = () => {
    const willOpen = body.style.display === 'none';
    body.style.display = willOpen ? 'block' : 'none';
    toggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
  };
}

// One category's questions, all shown together, flat — no anchor gating
// whether the others appear. People shows Q1, Q2, Q3 all at once, each
// independently answerable in any order, each getting its own AI write-up
// when answered in its risk-indicating direction. Kept as its own card per
// category so leaving mid-review doesn't lose progress on questions
// already answered.
// domKey defaults to the question's own id, which is fine as long as this
// question is only ever rendered as a shell in ONE place at a time. That
// breaks the moment a question is both due for review (rendered here via
// renderBusinessReviewCategory) AND being re-opened from the read-only
// history's "Edit answer" (see wireRiskAnswerEdit) — same q.id, two shells
// on the page, colliding ids. wireRiskAnswerEdit passes a distinct domKey
// (based on the risk_items row id, not the question id) to keep its shell
// independently addressable.
function renderBusinessQuestionShell(q, opts = {}) {
  const key = opts.domKey || q.id;
  return `
    <div id="biz-q-${key}" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line);">
      <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px;">
        <p class="muted plain" style="margin:0;">${q.question_text}</p>
        <button type="button" class="mini-link" style="margin-left:0; flex-shrink:0;" id="biz-q-delete-${key}">Delete</button>
      </div>
      <div id="biz-q-buttons-${key}" style="display:flex; gap:8px; margin-top:6px;">
        <button type="button" class="action secondary biz-q-btn" data-value="true">Yes</button>
        <button type="button" class="action secondary biz-q-btn" data-value="false">No</button>
      </div>
      <div id="biz-q-notes-field-${key}" style="display:none; margin-top:8px;">
        <textarea id="biz-q-notes-${key}" rows="2" placeholder="Notes…"></textarea>
        <button type="button" class="action" id="biz-q-save-${key}" style="margin-top:8px;">Save</button>
      </div>
      <div id="biz-q-result-${key}" style="display:none; margin-top:8px;"></div>
    </div>
  `;
}

function renderBusinessReviewCategory(c) {
  const selectStyle = 'padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:var(--font-body); background:var(--paper-raised); color:var(--ink); font-size:13px;';
  return `
    <div class="card" id="biz-cat-${escAttr(c.category)}">
      <p class="muted">${businessCategoryLabel(c.category)}</p>
      <div id="biz-questions-${escAttr(c.category)}">${c.questions.map(renderBusinessQuestionShell).join('')}</div>
      <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line);">
        <button type="button" class="mini-link" style="margin-left:0;" id="biz-addq-toggle-${escAttr(c.category)}">+ Add a question</button>
        <div id="biz-addq-form-${escAttr(c.category)}" style="display:none; margin-top:8px;">
          <div class="form-field"><label>New question</label><textarea id="biz-addq-text-${escAttr(c.category)}" rows="2" placeholder="e.g. Do you have a written succession plan?"></textarea></div>
          <div class="form-field"><label>Does answering "Yes" indicate a risk?</label>
            <select id="biz-addq-direction-${escAttr(c.category)}" style="${selectStyle}">
              <option value="true" selected>Yes = risk</option>
              <option value="false">Yes = no risk</option>
            </select>

}

// Wires one question's Yes/No -> (auto-save if that answer means no risk,
// else show a notes box + Save that triggers AI synthesis) -> result +
// Edit link. Standalone (not nested in renderRiskAnalyse) so a freshly
// added question (see wireAddQuestionForm) can be wired the same way
// without re-rendering the whole tab.
function wireBusinessQuestion(q, category, opts = {}) {
  const key = opts.domKey || q.id;
  const buttonsEl = document.getElementById(`biz-q-buttons-${key}`);
  const notesFieldEl = document.getElementById(`biz-q-notes-field-${key}`);
  const notesInput = document.getElementById(`biz-q-notes-${key}`);
  const saveBtn = document.getElementById(`biz-q-save-${key}`);
  const resultEl = document.getElementById(`biz-q-result-${key}`);
  const deleteBtn = document.getElementById(`biz-q-delete-${key}`);

  const submitAnswer = async (answer, notes) => {
    const res = await fetch('/.netlify/functions/manual-entry', {
      method: 'POST',
      body: JSON.stringify({
        type: 'business_risk_question_answer', client_id: currentClientId, period_end: currentPeriodEnd,
        category, question: { id: q.id, question_text: q.question_text, risk_if_yes: q.risk_if_yes },
        answer, notes,
      }),
    });
    const result = await res.json();
    if (result.error) throw new Error(result.error);
    return result.saved;
  };

  const showResult = (item) => {
    buttonsEl.style.display = 'none';
    notesFieldEl.style.display = 'none';
    resultEl.style.display = 'block';
    resultEl.innerHTML = riskItemRow(item, { editable: false })
      + `<button type="button" class="mini-link" style="margin-top:6px;" id="biz-q-edit-${key}">Edit this answer</button>`;
    document.getElementById(`biz-q-edit-${key}`).onclick = () => {
      // Notes (if any were typed) were only ever hidden, never cleared —
      // still there if this question goes back through the risk-present
      // branch. Re-saving re-runs submitQuestionAnswer, which deletes only
      // THIS question's existing row before inserting the new one —
      // sibling questions in the same category are untouched.
      resultEl.style.display = 'none';
      buttonsEl.style.display = 'flex';
      buttonsEl.querySelectorAll('.biz-q-btn').forEach((b) => { b.disabled = false; });
    };
    // Keeps the summary and the read-only Business list (further down the
    // page) in sync with what was just answered, without touching this
    // card or any other still-open question elsewhere in the section —
    // see refreshRiskLists(). This used to only happen on the next full
    // tab reload, which read as "nothing changed."
    refreshRiskLists();
  };

  buttonsEl.querySelectorAll('.biz-q-btn').forEach((btn) => {
    btn.onclick = async () => {
      const answer = btn.dataset.value === 'true';
      const riskPresent = answer === q.risk_if_yes;
      notesFieldEl.style.display = 'none'; // reset in case notes was left open from a prior click on the other button

      if (!riskPresent) {
        buttonsEl.querySelectorAll('.biz-q-btn').forEach((b) => { b.disabled = true; });
        try {
          const saved = await submitAnswer(answer, '');
          showResult(saved.item);
        } catch (err) {
          buttonsEl.querySelectorAll('.biz-q-btn').forEach((b) => { b.disabled = false; });
          alert('Error: ' + err.message);
        }
        return;
      }

      buttonsEl.querySelectorAll('.biz-q-btn').forEach((b) => b.classList.toggle('secondary', b !== btn));
      notesFieldEl.style.display = 'block';
      saveBtn.onclick = async () => {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        try {
          const saved = await submitAnswer(answer, notesInput.value.trim());
          showResult(saved.item);
        } catch (err) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save';
          alert('Error: ' + err.message);
        }
      };
    };
  });

  deleteBtn.onclick = async () => {
    if (!confirm(`Delete "${q.question_text}"? It won't be asked again — any past answers stay on file.`)) return;
    deleteBtn.disabled = true;
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'business_risk_question_delete', question_id: q.id }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      document.getElementById(`biz-q-${key}`).remove();
    } catch (err) {
      deleteBtn.disabled = false;
      alert('Error: ' + err.message);
    }
  };
}

function wireAddQuestionForm(category) {
  const safeCategory = escAttr(category);
  const toggleBtn = document.getElementById(`biz-addq-toggle-${safeCategory}`);
  const formEl = document.getElementById(`biz-addq-form-${safeCategory}`);
  const textInput = document.getElementById(`biz-addq-text-${safeCategory}`);
  const directionSelect = document.getElementById(`biz-addq-direction-${safeCategory}`);
  const saveBtn = document.getElementById(`biz-addq-save-${safeCategory}`);
  const questionsListEl = document.getElementById(`biz-questions-${safeCategory}`);

  toggleBtn.onclick = () => {
    formEl.style.display = formEl.style.display === 'none' ? 'block' : 'none';
  };

  saveBtn.onclick = async () => {
    const text = textInput.value.trim();
    if (!text) return;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Adding…';
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'business_risk_question_add', category, question_text: text, risk_if_yes: directionSelect.value === 'true' }),
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);
      const newQ = result.saved;
      questionsListEl.insertAdjacentHTML('beforeend', renderBusinessQuestionShell(newQ));
      wireBusinessQuestion(newQ, category);
      textInput.value = '';
      formEl.style.display = 'none';
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Add question';
    }
  };
}

// Re-fetches and re-renders the summary + all three read-only lists —
// everything EXCEPT the interactive "due for review" business questions
// (risk-business-review-region), which is deliberately left untouched so
// answering one question, confirming an industry item, etc. never wipes
// out progress on other questions still open elsewhere in that section.
// Called after every business question save and every review action,
// instead of the old renderMain() full-tab reload — that's what used to
// leave the summary/lists looking like "nothing changed" until you left
// the tab and came back.
async function refreshRiskLists() {
  const data = await callRead('get_risk_items', currentClientId, currentPeriodEnd);
  const rollup = computeRiskRollup(data.financial || [], data.business || [], data.industry || [], data.owner_wealth || []);

  const summaryEl = document.getElementById('risk-summary-region');
  if (summaryEl) summaryEl.innerHTML = renderRiskRollupBanner(rollup);
  const financialEl = document.getElementById('risk-financial-region');
  if (financialEl) financialEl.innerHTML = renderRiskItemsCard(data.financial || []);
  const businessListEl = document.getElementById('risk-business-list-region');
  if (businessListEl) {
    businessListEl.innerHTML = renderBusinessHistoryGrouped(data.business || []);
    wireBusinessHistoryPills();
    const questionsById = {};
    (data.allQuestions || []).forEach((q) => { questionsById[q.id] = q; });
    wireRiskAnswerEdit(questionsById);
    wireRiskAnswerUnanswer();
  }
  const industryEl = document.getElementById('risk-industry-region');
  if (industryEl) industryEl.innerHTML = renderRiskItemsCard(data.industry || []);
  const ownerWealthEl = document.getElementById('risk-owner_wealth-region');
  if (ownerWealthEl) ownerWealthEl.innerHTML = renderRiskItemsCard(data.owner_wealth || []);

  wireRiskSummaryRegion(rollup);
}

async function renderRiskAnalyse(content) {
  const myToken = renderToken;
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot from Financial Performance → Input first — financial risk is detected from it, and industry risk is generated the first time a period is saved.</p></div>`;
    return;
  }
  const data = await callRead('get_risk_items', currentClientId, currentPeriodEnd);
  if (myToken !== renderToken) return;

  const categoriesToReview = data.categoriesToReview || [];
  // Due for review can be up to all 8 categories stacked at once (People,
  // Customers, Suppliers, Operations, Cash & Funding, Legal, Insurance,
  // Technology) — small pills toggle each category's card independently
  // (not a single-select — more than one can be open at once if you want
  // to compare two side by side), rather than always showing all 8 or
  // being locked to viewing exactly one. Cards stay in the DOM either way
  // (just hidden when their pill isn't active), so toggling is instant.
  const categoryPickerHtml = categoriesToReview.length > 1
    ? `
      <p class="muted" style="margin:0 0 6px;">${categoriesToReview.length} categories due for review — click to open</p>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">
        ${categoriesToReview.map((c, i) => `<button type="button" class="risk-filter-pill${i === 0 ? ' active' : ''}" data-biz-cat-pill="${escAttr(c.category)}">${businessCategoryLabel(c.category)} (${c.questions.length})</button>`).join('')}
      </div>
    `
    : (categoriesToReview.length === 1
      ? `<p class="muted plain" style="margin:0 0 8px;">1 category due for review this cycle:</p>`
      : '');
  const reviewHtml = categoriesToReview.length
    ? categoryPickerHtml + categoriesToReview.map(renderBusinessReviewCategory).join('')
    : '';

  const rollup = computeRiskRollup(data.financial || [], data.business || [], data.industry || [], data.owner_wealth || []);

  content.innerHTML = `
    <p class="section-title">Risk Review</p>
    <div id="risk-summary-region">${renderRiskRollupBanner(rollup)}</div>
    ${riskSectionHeader('financial', '📊', RISK_SOURCE_META.financial.label, RISK_SOURCE_META.financial.hint)}
    <div id="risk-section-body-financial" style="margin-top:8px;">
      <div id="risk-financial-region">${renderRiskItemsCard(data.financial || [])}</div>
    </div>
    ${riskSectionHeader('business', '🧑', RISK_SOURCE_META.business.label, RISK_SOURCE_META.business.hint)}
    <div id="risk-section-body-business" style="margin-top:8px;">
      <div id="risk-business-review-region">${reviewHtml}</div>
      <div id="risk-business-list-region">${renderBusinessHistoryGrouped(data.business || [])}</div>
    </div>
    ${riskSectionHeader('industry', '🏭', RISK_SOURCE_META.industry.label, RISK_SOURCE_META.industry.hint)}
    <div id="risk-section-body-industry" style="margin-top:8px;">
      <div id="risk-industry-region">${renderRiskItemsCard(data.industry || [])}</div>
    </div>
    ${riskSectionHeader('owner_wealth', '👤', RISK_SOURCE_META.owner_wealth.label, RISK_SOURCE_META.owner_wealth.hint)}
    <div id="risk-section-body-owner_wealth" style="margin-top:8px;">
      <div id="risk-owner_wealth-region">${renderRiskItemsCard(data.owner_wealth || [])}</div>
    </div>
  `;

  wireRiskSummaryRegion(rollup);
  wireBusinessHistoryPills();
  {
    const questionsById = {};
    (data.allQuestions || []).forEach((q) => { questionsById[q.id] = q; });
    wireRiskAnswerEdit(questionsById);
    wireRiskAnswerUnanswer();
  }
  ['financial', 'business', 'industry'].forEach(wireRiskSectionToggle);

  // Only the first category's card starts open (matches what used to be
  // the single-select default) — click a pill to open/close ITS OWN card
  // without affecting any others already open.
  if (categoriesToReview.length) {
    categoriesToReview.forEach((c, i) => {
      const card = document.getElementById(`biz-cat-${c.category}`);
      if (card) card.style.display = i === 0 ? 'block' : 'none';
    });
    document.querySelectorAll('[data-biz-cat-pill]').forEach((pill) => {
      pill.onclick = () => {
        const category = pill.dataset.bizCatPill;
        const card = document.getElementById(`biz-cat-${category}`);
        if (!card) return;
        const willOpen = card.style.display === 'none';
        card.style.display = willOpen ? 'block' : 'none';
        pill.classList.toggle('active', willOpen);
      };
    });
  }

  categoriesToReview.forEach((c) => {
    c.questions.forEach((q) => wireBusinessQuestion(q, c.category));
    wireAddQuestionForm(c.category);
  });
}

// ---- Goals: Profile ----
const ENTITY_TYPES = ['Sole trader', 'Partnership', 'Company', 'Trust', 'Other'];
const CLIENT_CONTACT_ROLES = ['Owner', 'Manager', 'Director', 'Shareholder', 'Partner'];
const FIRM_ADVISERS = ['Kaine Overlack', 'Cheryl Overlack'];
// Both selects below share this shape: a locked list of options plus an
// "Other" escape hatch that reveals a free-text field — locked so the data
// stays consistent/filterable (e.g. "show me every client Kaine advises"),
// but not so locked that a role or adviser genuinely outside the list has
// nowhere to go.
function lockedSelectWithOtherHtml(id, options, currentValue) {
  const isOther = currentValue && !options.includes(currentValue);
  return `
    <select id="${id}">
      <option value="">—</option>
      ${options.map((o) => `<option value="${o}" ${currentValue === o ? 'selected' : ''}>${o}</option>`).join('')}
      <option value="__other__" ${isOther ? 'selected' : ''}>Other</option>
    </select>
    <input type="text" id="${id}-other" placeholder="Type it in" value="${isOther ? escAttr(currentValue) : ''}" style="margin-top:6px; display:${isOther ? 'block' : 'none'};" />
  `;
}
function wireLockedSelectWithOther(id) {
  const sel = document.getElementById(id);
  const other = document.getElementById(`${id}-other`);
  sel.onchange = () => { other.style.display = sel.value === '__other__' ? 'block' : 'none'; };
}
function lockedSelectWithOtherValue(id) {
  const sel = document.getElementById(id);
  return sel.value === '__other__' ? document.getElementById(`${id}-other`).value.trim() : sel.value;
}
const CADENCE_OPTIONS = [['quarterly', 'Quarterly'], ['half_yearly', 'Half-yearly'], ['annual', 'Annual']];

// The two games a client can be playing, per workspace-architecture-spec.md
// — growing the business toward wealth vs extracting wealth from it as-is.
// Deliberately kept to two: a third "just growth" option was considered
// and rejected — growth isn't a competing end state, it's the mechanism
// inside Growth & Wealth, so splitting it out wouldn't change what the app
// actually does anywhere. What DOES vary independently of which game is
// being played is CLIENT_POSTURES below — not every Growth & Wealth
// client is pushing hard for growth right now, and not every Wealth &
// Lifestyle client is actively extracting more this year.
const CLIENT_OBJECTIVES = [
  { value: 'growth_wealth', label: 'Growth & Wealth', hint: 'Grow the business, increase its value, build wealth through it.' },
  { value: 'wealth_lifestyle', label: 'Wealth & Lifestyle', hint: 'Extract more wealth and freedom from the business as it stands.' },
];
// Posture is genuinely used, not decorative — analyze.js's Growth pillar
// scoring reads it: a client on "Consolidate" gets flat revenue scored as
// a GOOD outcome, not a neutral-to-bad one the way the default
// growth-maximizing bands would treat it.
const CLIENT_POSTURES = {
  growth_wealth: [
    { value: 'grow', label: 'Actively growing' },
    { value: 'consolidate', label: 'Consolidating / holding steady' },
  ],
  wealth_lifestyle: [
    { value: 'increase_wealth', label: 'Increasing wealth extraction' },
    { value: 'hold_wealth', label: 'Holding steady' },
  ],
};

// Lives on Goals & Objectives, not Profile — "what does the owner want" is
// one of the 5 intelligence questions (see PROFILE_DOMAIN's comment),
// not client setup. Client-level, not period-scoped (saves via the same
// `type: 'context'` / profile_extra path Profile itself uses), so it's
// rendered and wired independently of the period-scoped goal check-in
// below it — including in the "no period yet" placeholder path, since
// there's no reason a client's objective can't be set before their first
// financial snapshot exists.
function renderObjectiveCard(extra) {
  return `
    <div class="card" style="background:var(--paper-raised); border:1px dashed var(--line);">
      <p class="muted">Objective <span class="confidence-badge neutral" style="margin-left:6px; font-weight:normal; text-transform:none;">Always current — not tied to the period below</span></p>
      <p class="muted plain" style="margin:0 0 10px;">Unlike the check-in below, this doesn't change when you switch periods — there's only ever one current answer to "what does this client want," not a history of it. What this client actually wants out of the business isn't just a data point either: Growth's pillar score reads posture below (flat revenue scores well under "Consolidate," not as a shortfall), and Owner &amp; Succession's Retirement Outlook defaults to the horizon here when no specific exit year has been set yet.</p>
      <div class="form-grid">
        <div class="form-field">
          <label>Major goal</label>
          <select id="obj-major-goal">
            <option value="">—</option>
            ${CLIENT_OBJECTIVES.map((o) => `<option value="${o.value}" ${extra.major_goal === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}
          </select>
        </div>
        <div class="form-field">
          <label>Current posture</label>
          <select id="obj-posture"></select>
        </div>
        <div class="form-field"><label>Horizon (years)</label><input type="number" min="0" id="obj-horizon-years" value="${extra.goal_horizon_years ?? ''}" placeholder="e.g. 5" /></div>
      </div>
      <button class="action" id="obj-save" style="margin-top:10px;">Save objective</button>
      <span id="obj-save-msg" style="margin-left:8px; font-size:12px; color:var(--ink-soft);"></span>
    </div>
  `;
}

function wireObjectiveCard(extra) {
  const refreshPostureOptions = (selectedPosture) => {
    const majorGoal = document.getElementById('obj-major-goal').value;
    const postureSel = document.getElementById('obj-posture');
    const options = CLIENT_POSTURES[majorGoal] || [];
    postureSel.innerHTML = `<option value="">—</option>` + options.map((o) => `<option value="${o.value}" ${selectedPosture === o.value ? 'selected' : ''}>${o.label}</option>`).join('');
    postureSel.disabled = !majorGoal;
  };
  refreshPostureOptions(extra.posture);
  document.getElementById('obj-major-goal').onchange = () => refreshPostureOptions();

  document.getElementById('obj-save').onclick = async () => {
    const msg = document.getElementById('obj-save-msg');
    msg.textContent = 'Saving…';
    try {
      const res = await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({
          type: 'context', client_id: currentClientId,
          profile_extra: {
            ...extra,
            major_goal: document.getElementById('obj-major-goal').value || null,
            posture: document.getElementById('obj-posture').value || null,
            goal_horizon_years: document.getElementById('obj-horizon-years').value ? Number(document.getElementById('obj-horizon-years').value) : null,
          },
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      msg.textContent = 'Saved.';
      currentCtx = await callRead('get_context', currentClientId);
    } catch (err) {
      msg.textContent = 'Error: ' + err.message;
    }
  };
}

// Manual drag-resize is a transient browser-only state — it's gone the moment
// the textarea's DOM node is recreated (navigate away and back, reload, etc.),
// since there's nothing for the app to remember it by. Auto-growing to fit
// whatever's actually in the box sidesteps needing to resize at all.
function autoGrowTextarea(el) {
  el.style.overflowY = 'hidden';
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}

async function expandField(seedElId, btnEl, field, industryElId) {
  const ta = document.getElementById(seedElId);
  const seed = ta.value.trim();

  btnEl.textContent = '…';
  try {

      method: 'POST',

// The only real "action" data that exists today lives inside Meeting Mode's
// localStorage briefs (the .action field recorded per priority) — there's no
// Actions-domain tracker built yet, so this reads directly from that instead
// of fabricating anything.
function getOpenActionsForClient() {
  const items = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(`oag_meeting_${currentClientId}_`)) continue;
    let brief;
    try { brief = JSON.parse(localStorage.getItem(key)); } catch { continue; }
    (brief?.priorities || []).forEach((p, idx) => {
      if (p.action && !p.actionDone) {
        items.push({ meetingKey: key, priorityIndex: idx, period_end: brief.period_end, pillar: p.pillar, action: p.action });
      }
    });
  }
  return items.sort((a, b) => (a.period_end < b.period_end ? 1 : -1));
}

function markActionDone(meetingKey, priorityIndex) {
  try {
    const brief = JSON.parse(localStorage.getItem(meetingKey));
    if (brief?.priorities?.[priorityIndex]) {
      brief.priorities[priorityIndex].actionDone = true;
      localStorage.setItem(meetingKey, JSON.stringify(brief));
    }
  } catch { /* ignore malformed entries */ }
}
