const CADENCE_UNIT = { quarterly: 'quarters', half_yearly: 'half-years', annual: 'years' };

// Least-squares slope across every non-null point in history — not just
// the oldest and newest (this used to be a naive 2-point slope between
// just those two, which a single outlier at either end could badly skew).
// Still plain arithmetic, no new library or assumption, and with exactly 2
// points it reduces to the exact same line as before — this only changes
// (and improves) the estimate once there's 3+ periods of history to use.
function linearRegressionRate(points) {
  const n = points.length;
  if (n < 2) return 0;
  const sumX = points.reduce((s, p) => s + p.i, 0);
  const sumY = points.reduce((s, p) => s + p.v, 0);
  const sumXY = points.reduce((s, p) => s + p.i * p.v, 0);
  const sumXX = points.reduce((s, p) => s + p.i * p.i, 0);
  const denom = n * sumXX - sumX * sumX;
  return denom === 0 ? 0 : (n * sumXY - sumX * sumY) / denom;
}

// Trend-to-goal: rate comes from the full-history regression above, but
// "current" and the distance-to-target math stay anchored to the actual
// latest value, not a regression-smoothed one — a client's real current
// number, projected forward at the historical rate, not a fitted number
// nobody actually saw. Uses KPI_DIRECTION to know whether the target's
// already been reached (can't just compare magnitudes — a lower value is
// the win for some KPIs, higher for others).
function computePaceToGoal(targetItem, kpiHistoryEntry) {
  const values = kpiHistoryEntry?.values || [];
  const points = values.map((v, i) => ({ v, i })).filter((p) => p.v != null);
  if (points.length < 2) return { status: 'insufficient' };

  const newest = points[points.length - 1];
  const rate = linearRegressionRate(points);
  const target = targetItem.target;
  const direction = KPI_DIRECTION[targetItem.kpi_key];
  const reached = direction === 'higher' ? newest.v >= target : direction === 'lower' ? newest.v <= target : Math.abs(newest.v - target) < 1e-9;
  if (reached) return { status: 'reached', current: newest.v };

  const distanceRemaining = target - newest.v;
  if (rate === 0 || Math.sign(rate) !== Math.sign(distanceRemaining)) {
    return { status: 'off-track', current: newest.v };
  }
  const periodsAway = Math.ceil(distanceRemaining / rate);
  return { status: 'on-track', current: newest.v, periodsAway };
}

function renderPaceToGoalCard(targets, history) {
  if (!targets.length) {
    return `<div class="card"><p class="muted">Pace to goal</p><p class="muted plain" style="margin:0;">Set a target on a Goals item (with a linked KPI) to see pace-to-goal here.</p></div>`;
  }
  const unit = CADENCE_UNIT[currentCtx?.cadence] || 'periods';
  const lines = targets.map((t) => {
    const kpiEntry = (history?.kpis || []).find((k) => k.key === t.kpi_key);
    const pace = computePaceToGoal(t, kpiEntry);
    const format = kpiEntry?.format;
    const targetLabel = `${kpiEntry?.name || t.kpi_key} target ${formatKpi(t.target, format)}`;
    let statusText;
    if (pace.status === 'insufficient') statusText = 'not enough history yet to project a trend.';
    else if (pace.status === 'reached') statusText = `target reached — currently ${formatKpi(pace.current, format)}.`;
    else if (pace.status === 'off-track') statusText = `trending the wrong way — not on track at the current rate (currently ${formatKpi(pace.current, format)}).`;
    else statusText = `at the current trend, ~${pace.periodsAway} ${unit} away (currently ${formatKpi(pace.current, format)}).`;
    return `<p class="muted plain" style="margin:0 0 6px;">${targetLabel} — ${statusText}</p>`;
  }).join('');
  return `<div class="card"><p class="muted">Pace to goal</p>${lines}</div>`;
}

// Small single-series line chart, plain inline SVG (no charting library
// anywhere in this app — matches the cash-conversion donut/health wheel
// convention). One series per call, not Revenue+NP on a shared axis — at
// most clients' scale Net profit would be nearly invisible next to Revenue
// on one y-scale (the #1 rule from this project's dataviz skill: never a
// dual-axis chart). Straight polyline segments between adjacent non-null
// points — a genuine gap (a period with no snapshot saved) would draw a
// straight line across it rather than a visible break; acceptable for v1
// since most clients have no gaps once a period's saved.
// Value/date labels are deliberately plain HTML below the chart, NOT text
// inside the SVG. SVG scales everything — text included — proportionally
// to however wide its container ends up being; once these cards went
// side-by-side, the shrunk render width shrank in-chart <text> right along
// with it, undoing any font-size bump. Plain HTML text stays real CSS
// pixels regardless of how narrow the column gets.
function renderTrendLineChart(periods, values, color, width = 320, height = 70) {
  const points = values.map((v, i) => ({ v, i })).filter((p) => p.v != null);
  if (points.length < 2) return '<p class="muted plain" style="margin:0;">Not enough history yet.</p>';
  const padX = 10, padY = 10;
  const vals = points.map((p) => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const xFor = (i) => padX + (i / (values.length - 1)) * (width - padX * 2);
  const yFor = (v) => height - padY - ((v - min) / range) * (height - padY * 2);
  const linePoints = points.map((p) => `${xFor(p.i)},${yFor(p.v)}`).join(' ');
  const dots = points.map((p) => `<circle cx="${xFor(p.i)}" cy="${yFor(p.v)}" r="3.5" fill="${color}" />`).join('');
  const svg = `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%; max-width:${width}px; height:auto; display:block;">
      <polyline points="${linePoints}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      ${dots}
    </svg>
  `;
  const labels = periods.map((p, i) => `
    <div style="text-align:center; min-width:56px;">
      <div style="font-size:10px; color:var(--ink-soft); font-family:var(--font-mono);">${formatShortDate(p).replace(/^\d+ /, '')}</div>
      <div style="font-size:13px; font-weight:600; color:var(--ink); font-family:var(--font-mono); white-space:nowrap;">${values[i] != null ? formatMoney(values[i]) : '—'}</div>
    </div>
  `).join('');
  return `${svg}<div style="display:flex; flex-wrap:wrap; justify-content:center; gap:6px 10px; margin-top:4px;">${labels}</div>`;
}

const TRAJECTORY_PERIODS_PER_YEAR = { quarterly: 4, half_yearly: 2, annual: 1 };
const CADENCE_LABEL_SHORT = { quarterly: 'Quarterly', half_yearly: 'Half-yearly', annual: 'Annual' };

// Which view-cadence options make sense to offer — same or coarser than
// what the client's own data was actually entered at. You can't view
// quarterly detail for a client who only ever files annually; that data
// doesn't exist to roll DOWN into.
function availableTrajectoryCadences(nativeCadence) {
  return ['quarterly', 'half_yearly', 'annual'].filter((c) => TRAJECTORY_PERIODS_PER_YEAR[c] <= TRAJECTORY_PERIODS_PER_YEAR[nativeCadence]);
}

// "Last N" alone doesn't say whether that's 4 quarters or 4 years — every
// option is labelled with the actual unit for whichever cadence is
// currently selected, and relabelled live when the cadence dropdown changes
// (see wireTrajectoryCard in renderGrowthAnalyse).
function trajectoryPeriodsCountOptionsHtml(cadence, selectedCount) {
  const unit = CADENCE_UNIT[cadence] || 'periods';
  return [4, 6, 8, 12].map((n) => `<option value="${n}" ${n === selectedCount ? 'selected' : ''}>Last ${n} ${unit}</option>`).join('');
}

// Static shell only — the chart region is filled in by loadTrajectory()
// (wired in renderGrowthAnalyse) since view-cadence/period-count are
// interactive and require a fresh fetch from get_growth_trajectory, not
// just a re-render of already-loaded data.
function renderGrowthTrajectoryCard(commentary) {
  const nativeCadence = currentCtx?.cadence || 'quarterly';
  const cadenceOptions = availableTrajectoryCadences(nativeCadence);
  // Default to Annual, not the client's native cadence — 'annual' is always
  // a valid option (it's the coarsest possible view, so it's never finer
  // than what was entered), and a quarterly/half-yearly client's raw
  // per-period noise is rarely what you want to see first. The dropdown is
  // still there to drill into finer detail on demand.
  const defaultCadence = 'annual';
  const selectStyle = 'padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);';
  return `
    <div class="card">
      <p class="muted">Growth trajectory</p>
      ${commentary ? `<p class="muted plain" style="font-size:12px; margin:6px 0 10px; padding:8px 10px; background:var(--sage-bg); border-radius:6px;">🤖 ${commentary}</p>` : ''}
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;">
        ${cadenceOptions.length > 1 ? `
          <select id="trajectory-cadence" style="${selectStyle}">
            ${cadenceOptions.map((c) => `<option value="${c}" ${c === defaultCadence ? 'selected' : ''}>${CADENCE_LABEL_SHORT[c]}</option>`).join('')}
          </select>
        ` : ''}
        <select id="trajectory-periods-count" style="${selectStyle}">
          ${trajectoryPeriodsCountOptionsHtml(defaultCadence, 6)}
        </select>
      </div>
      <div id="trajectory-chart-region"><p class="muted plain" style="margin:0;">Loading…</p></div>
    </div>
  `;
}

function renderGrowthTrajectoryChartRegion(trajectory) {
  const periods = trajectory?.periods || [];
  if (periods.length < 2) {
    return `<p class="muted plain" style="margin:0;">Not enough periods on file yet to show a trend — needs at least 2.</p>`;
  }
  return `
    <p class="card-label" style="margin:0 0 4px;">Revenue</p>
    ${renderTrendLineChart(periods, trajectory.revenue || [], 'var(--sage)')}
    <p class="card-label" style="margin:10px 0 4px;">Net profit</p>
    ${renderTrendLineChart(periods, trajectory.netProfit || [], 'var(--brass)')}
  `;
}

function computeEbitda(snapshot) {
  if (snapshot?.net_profit == null || snapshot?.interest_expense == null || snapshot?.depreciation_amortisation == null) return null;
  return snapshot.net_profit + snapshot.interest_expense + snapshot.depreciation_amortisation;
}

// Standard valuation practice: average EBITDA over a few years rather than
// whatever the current period happens to be — a single year can be
// unusually good or bad and skew the multiple-of-EBITDA estimate either
// way. `trajectory` is a get_growth_trajectory response fetched specifically
// as { view_cadence: 'annual', periods_count: 3 } — annual only, per the
// "valuation should only be annual" decision, regardless of the client's
// own native cadence. Averages whichever of those years actually have
// complete data rather than requiring all 3 (a year with one missing field
// is excluded from the average, not zero-filled or allowed to break it).
function computeAverageEbitda(trajectory) {
  const periods = trajectory?.periods || [];
  if (!periods.length) return null;
  const yearly = periods.map((_, i) => {
    const np = trajectory.netProfit?.[i];
    const ie = trajectory.interestExpense?.[i];
    const da = trajectory.depreciationAmortisation?.[i];
    return (np != null && ie != null && da != null) ? np + ie + da : null;
  }).filter((v) => v != null);
  if (!yearly.length) return null;
  return yearly.reduce((sum, v) => sum + v, 0) / yearly.length;
}

// Mirrors dedupeBusinessToLatestPerCategory (analyze.js) — one row per
// calendar year (latest period_end within the year wins) rather than one
// per category — a quarter-to-quarter valuation comparison isn't a
// meaningful cadence for this figure.
function dedupeValuationsToLatestPerYear(rows) {
  const latestPeriodByYear = {};
  (rows || []).forEach((r) => {
    const year = r.period_end.slice(0, 4);
    if (!latestPeriodByYear[year] || r.period_end > latestPeriodByYear[year]) latestPeriodByYear[year] = r.period_end;
  });
  return (rows || []).filter((r) => latestPeriodByYear[r.period_end.slice(0, 4)] === r.period_end);
}

// Saved history only (deliberately not the live/unsaved figure being
// edited above it) — always one point per calendar year via the dedupe,
// regardless of how often a valuation gets saved.
function renderValuationHistoryChart(valuations) {
  const deduped = dedupeValuationsToLatestPerYear(valuations || []).sort((a, b) => a.period_end.localeCompare(b.period_end));
  if (deduped.length < 2) return '';
  const periods = deduped.map((v) => v.period_end);
  const amounts = deduped.map((v) => v.valuation_amount);
  return `<p class="card-label" style="margin:10px 0 4px;">Valuation over time</p>${renderTrendLineChart(periods, amounts, 'var(--sage)')}`;
}

function renderValuationCard(snapshot, valuationData, avgEbitda) {
  const currentEbitda = computeEbitda(snapshot);
  // Prefer the multi-year average when it's available — falls back to this
  // period alone only when there isn't enough history to average (e.g. the
  // client's first period on file). Either way, a Custom EBITDA field below
  // covers the case where NEITHER is computable — the card never dead-ends
  // with no way forward now, unlike the old hard "can't estimate" stop.
  const defaultEbitda = avgEbitda ?? currentEbitda;
  const ebitdaLabel = avgEbitda != null
    ? `EBITDA (avg, up to 3yr): ${formatMoney(avgEbitda)}`
    : currentEbitda != null
      ? `EBITDA (this period): ${formatMoney(currentEbitda)}`
      : 'EBITDA not available — enter one below';
  return `
    <div class="kpi-card">
      <div class="kpi-card-head"><p class="kpi-name">Business valuation — indicative estimate</p></div>
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:4px 0;">
        <div style="background:var(--sage-bg); border-radius:8px; padding:5px 10px;">
          <p class="kpi-value" id="valuation-amount" style="margin:0; font-size:20px;">—</p>
        </div>
        <span class="muted plain" style="font-size:12px;">${ebitdaLabel}</span>
      </div>
      <p class="muted plain" id="valuation-recommended" style="font-size:12px; margin:2px 0 0;"></p>
      <div class="ocf-row" style="margin-top:8px;"><label>Custom EBITDA (optional)</label><input type="number" id="valuation-ebitda-input" placeholder="90000" /></div>
      <div class="ocf-row"><label>Custom multiple (optional)</label><input type="number" step="0.1" id="valuation-multiple-input" placeholder="3.5" /></div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="action" id="valuation-save-btn" type="button" style="font-size:12px; padding:6px 10px;">Save</button>
        <span id="valuation-save-msg" style="font-size:12px; color:var(--ink-soft);"></span>
      </div>
      <p id="valuation-rationale" style="font-size:11px; color:var(--ink-soft); margin:4px 0 0;"></p>
      ${renderValuationHistoryChart(valuationData?.valuations)}
      <p style="font-size:10px; color:var(--ink-soft); margin-top:8px; font-style:italic;">Indicative estimate for internal/advisory discussion only — not a formal valuation. Adjust the EBITDA basis and multiple based on your own judgement.</p>
    </div>
  `;
}

// Estimates tax for ANY entity type given a profit figure and, for Sole
// trader/Partnership/Trust, a per-person share split + other income —
// pulled out of computeTaxOutlookResult's "compare structure as" block
// (below) so the exact same math can be pointed at the client's REAL
// entity type too (see renderTaxPositionHeader's own comparison), not just
// a hypothetical alternative one. Same reasoning as everywhere else this
// session: one calculation, reused, instead of two that can quietly drift
// apart. "Effective rate" per person is TOTAL TAX ÷ INCOME for that
// person — their average rate once combined with other income — NOT their
// marginal bracket rate on the next dollar.
function estimateTaxForEntity(entityType, profit, shares, otherIncomes, shareUnit, types, rates) {
  if (entityType === 'Company') {
    const adj = Number(otherIncomes?.[0]) || 0;
    const taxable = profit + adj;
    const tax = estimateCompanyTax(taxable, rates);
    const rate = taxable > 0 ? (tax / taxable * 100) : 0;
    const context = adj > 0 ? `includes ${formatMoney(adj)} of investment/other income`
      : adj < 0 ? `net of ${formatMoney(Math.abs(adj))} in super contributions or other deductions`
      : 'flat company rate on business profit';
    return { tax, personRows: [{ label: 'Company', share: 100, amt: taxable, tax, rate, context }] };
  }
  if (entityType === 'Sole trader' || entityType === 'Partnership' || entityType === 'Trust') {
    const isSolo = entityType === 'Sole trader';
    const rawShares = isSolo ? [100] : (shares || []).map(Number);
    const rawOtherIncome = otherIncomes || [];
    const validIdx = rawShares.map((v, i) => (!isNaN(v) && v > 0 ? i : -1)).filter((i) => i >= 0);
    // Sole trader's share is always 100% — nothing to enter, so it's safe to
    // assume. Partnership/Trust have no such default: with nothing typed in
    // yet, there's no real split to estimate off, so this returns nil (no
    // personRows) rather than silently guessing "one owner, 100%" — that
    // used to render a confident-looking dollar figure for a structure that
    // was never actually described.
    if (!isSolo && !validIdx.length) return { tax: null, personRows: [] };
    const useShares = validIdx.length ? validIdx.map((i) => rawShares[i]) : [100];
    const useOther = validIdx.length ? validIdx.map((i) => Number(rawOtherIncome[i]) || 0) : [0];
    const rawTypes = types || [];
    const useTypes = validIdx.length ? validIdx.map((i) => rawTypes[i] || 'adult') : ['adult'];
    const useRowNum = validIdx.length ? validIdx.map((i) => i + 1) : [1];
    const who = entityType === 'Trust' ? 'Beneficiary' : (isSolo ? 'Sole trader' : 'Partner');
    // Each share is normally a literal % of the whole profit (5 means 5%,
    // not "100% of whatever else happens to be filled in") — it used to
    // divide by the SUM of only the entered shares, so typing just one
    // partner's 5% share with the rest still blank normalized that lone 5
    // up to 100% of profit. Filling in only some partners now correctly
    // estimates just their portion instead of secretly reassigning the
    // whole business to them. Partnership/Trust can ALSO be split as
    // literal dollar amounts instead (shareUnit === 'dollar') — for when
    // the adviser already knows each partner's actual distribution in
    // dollars rather than working it out as a % first. The displayed
    // "share" is then a % of profit computed purely for the breakdown
    // table, not fed back into the tax maths.
    const isDollarMode = !isSolo && shareUnit === 'dollar';
    const personRows = useShares.map((s, i) => {
      const amt = isDollarMode ? s : profit * (s / 100);
      const displayShare = isDollarMode ? (profit > 0 ? Math.round(amt / profit * 100) : 0) : Math.round(s);
      const other = useOther[i];
      const type = isSolo ? 'adult' : useTypes[i];
      let t, context;
      if (type === 'minor') {
        // Division 6AA taxes a minor's "eligible" (unearned/trust) income on
        // its own scale — it does NOT stack on top of the minor's other
        // income the way adult marginal rates do, so unlike the adult branch
        // below this deliberately does not combine amt with `other`. This
        // also does not model the "excepted income" carve-out (a minor's own
        // wages, Centrelink payments, deceased-estate income, or income of a
        // disabled/prescribed person are all taxed at ordinary adult rates
        // instead) — same "flag rather than guess" posture as the app's
        // existing Medicare Levy Surcharge gap, surfaced in the UI, not just here.
        t = estimateMinorTax(amt);
        context = 'Div 6AA minor rates — excepted income (e.g. the minor\'s own wages) not modeled, see note above';
      } else if (type === 'company') {
        t = estimateCompanyTax(amt + other, rates);
        context = other > 0 ? `flat company rate, includes ${formatMoney(other)} of investment/other income`
          : other < 0 ? `flat company rate, net of ${formatMoney(Math.abs(other))} in deductions`
          : 'flat company rate on this share';
      } else {
        t = other !== 0 ? estimateIndividualTax(amt + other, rates) - estimateIndividualTax(other, rates) : estimateIndividualTax(amt, rates);
        context = other > 0 ? `combined with ${formatMoney(other)} other income`
          : other < 0 ? `net of a ${formatMoney(Math.abs(other))} income reduction`
          : 'no other income assumed';
      }
      const rate = amt > 0 ? (t / amt * 100) : 0;
      return { label: isSolo ? who : `${who} ${useRowNum[i]}`, share: displayShare, amt, tax: t, rate, context, type };
    });
    return { tax: personRows.reduce((sum, r) => sum + r.tax, 0), personRows };
  }
  return { tax: null, personRows: [] };
}

function computeTaxOutlookResult(snapshot, cash, entityType, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute, superContribution, equipmentPurchase, oneOffIncome, oneOffExpense, compareEntity, compareShares, compareOtherIncome, projectedCashFlow, compareShareUnit, compareTypes, carriedLosses, rates, equipmentDeductibleOverride) {
  let { projectedProfit, buildup, provenance } = projectProfitScenario(snapshot, unit, revenueChange, gpChange, opexChange, netProfitChange, netProfitAbsolute);

  // Same one-off income/expense concept Cash outlook already has — nets a
  // known anomaly (a windfall gain, an unusual one-time cost) into or out of
  // the profit being taxed, on top of WHATEVER buildup level produced
  // projectedProfit above. This is how "this period's actual profit
  // included a $50k one-off, model as if it hadn't" actually happens — a
  // plain additive adjustment that composes with Revenue/GP/Opex/Net profit
  // changes, not a separate baseline that has to switch them off.
  const oneOffNet = (Number(oneOffIncome) || 0) - (Number(oneOffExpense) || 0);
  if (oneOffNet !== 0) {
    projectedProfit += oneOffNet;
    buildup += ` ${oneOffNet > 0 ? '+' : '−'} <b>${formatMoney(Math.abs(oneOffNet))}</b> one-off = <b>${formatMoney(projectedProfit)}</b>`;
  }

  // Super and equipment both reduce projected CASH at the full amount paid
  // (see computeCashOutlookResult) — that money genuinely left the business
  // regardless of what's deductible. But what reduces TAXABLE PROFIT here
  // has to be the deductible amount, which isn't always the same number:
  // super above the concessional cap isn't deductible (the cap is known, so
  // this clamps to it automatically, no guessing needed); equipment's
  // instant-asset-write-off eligibility genuinely isn't something this tool
  // can know, so rather than assuming 100% (and being wrong for anyone whose
  // purchase doesn't qualify, or only partly does), equipmentDeductibleOverride
  // lets the adviser state the real deductible amount directly — defaults to
  // the full purchase price only when left blank, same "adviser-supplied,
  // not guessed" posture as compare-structure's shares.
  const superRaw = Number(superContribution) || 0;
  const superDeductible = Math.min(superRaw, rates.superCap);
  const equipmentRaw = Number(equipmentPurchase) || 0;
  const equipmentDeductible = equipmentDeductibleOverride !== '' && equipmentDeductibleOverride != null
    ? Math.min(Number(equipmentDeductibleOverride) || 0, equipmentRaw)
    : equipmentRaw;
  const deductions = superDeductible + equipmentDeductible;
  let deductionNote = '';
  if (deductions > 0) {
    const taxableProfit = projectedProfit - deductions;
    buildup += ` − super/equipment deduction <b>${formatMoney(deductions)}</b> = taxable profit <b>${formatMoney(taxableProfit)}</b>`;
    projectedProfit = taxableProfit;
    if (superRaw > rates.superCap) {
      deductionNote = `Note: $${superRaw.toLocaleString('en-AU')} super exceeds the ${formatMoney(rates.superCap)} concessional cap set below — only ${formatMoney(superDeductible)} of it is deducted above; the excess still leaves cash (see Cash outlook) but isn't reducing tax here.`;
    }
    if (equipmentDeductible < equipmentRaw) {
      deductionNote += `${deductionNote ? ' ' : ''}Note: only ${formatMoney(equipmentDeductible)} of the ${formatMoney(equipmentRaw)} equipment purchase is being deducted, per the amount entered below — the rest still leaves cash but isn't reducing tax here.`;
    }
  }

  // Prior-year losses sitting on the business, not this period's — they
  // offset taxable profit at the ENTITY level, before it's split across any
  // partners/beneficiaries, since the loss belongs to the business, not to
  // whoever ends up with a share of this period's profit. Clamped so the
  // loss used can't exceed the profit available to absorb it — the excess
  // would just keep carrying forward in reality, not go on to create a
  // negative "taxable profit" here.
  const losses = Number(carriedLosses) || 0;
  if (losses > 0) {
    const lossUsed = Math.min(losses, Math.max(0, projectedProfit));
    const taxableProfit = projectedProfit - lossUsed;
    if (lossUsed > 0) {
      buildup += ` − carried-forward losses <b>${formatMoney(lossUsed)}</b> = taxable profit <b>${formatMoney(taxableProfit)}</b>`;
    }
    projectedProfit = taxableProfit;
    if (losses > lossUsed) {
      deductionNote += `${deductionNote ? ' ' : ''}Note: only ${formatMoney(lossUsed)} of the ${formatMoney(losses)} carried-forward losses could be used against this profit — the remaining ${formatMoney(losses - lossUsed)} would carry forward again.`;
    }
  }

  let tax = null;
  let headline, headlineLabel;
  if (entityType === 'Company') {
    tax = estimateCompanyTax(projectedProfit, rates);
    headline = formatMoney(tax);
    headlineLabel = 'Estimated tax — company, 25% base rate';
  } else if (entityType === 'Sole trader') {
    tax = estimateIndividualTax(projectedProfit, rates);
    headline = formatMoney(tax);
    headlineLabel = `Estimated tax — individual marginal rates + Medicare levy (${individualTaxBracket(projectedProfit, rates)})`;
  } else if (entityType === 'Partnership' || entityType === 'Trust') {
    const who = entityType === 'Trust' ? 'beneficiary' : 'partner';
    headline = '—';
    headlineLabel = `Tax depends on each ${who}'s own marginal rate and distribution split — not estimated here.`;
  } else {
    headline = '—';
    headlineLabel = 'Set an entity structure on Profile to estimate tax here.';
  }

  // Partnership/Trust can't be estimated for the CLIENT'S ACTUAL structure
  // (see the branch above) because guessing their real split/other-income
  // would misrepresent their actual position. A COMPARISON is different —
  // the adviser is explicitly told to supply the assumption (a % share per
  // partner/beneficiary, each with their own other income) rather than the
  // app guessing it, so it's an informed hypothetical, not a claim about
  // reality. Sole trader runs through the exact same per-person mechanism
  // as Partnership/Trust — it's just the N=1 case (fixed 100% share) — so
  // "other income" works identically everywhere instead of being a special
  // case that only some entity types support.
  let compareText = '';
  let bracketDetail = '';
  let distributedAmount = null;
  let distributableProfit = null;
  // Selecting the SAME structure as the client's actual one used to be
  // silently ignored — this block only ever ran for a genuinely different
  // compare structure. That's backwards for Partnership/Trust specifically:
  // the headline above is deliberately left unestimated for them until a
  // split is supplied, so picking their own type here (with shares filled
  // in) is the ONLY way they ever get a real number — not a redundant
  // compare-to-self the way it would be for Company/Sole trader, who
  // already get a direct estimate above without needing this at all.
  const isModelingOwnStructure = compareEntity === entityType && (entityType === 'Partnership' || entityType === 'Trust');
  if (compareEntity && (compareEntity !== entityType || isModelingOwnStructure)) {
    const { personRows } = estimateTaxForEntity(compareEntity, projectedProfit, compareShares, compareOtherIncome, compareShareUnit, compareTypes, rates);
    if (compareEntity === 'Partnership' || compareEntity === 'Trust') {
      distributedAmount = personRows.reduce((sum, r) => sum + r.amt, 0);
      distributableProfit = projectedProfit;
    }
    if (personRows.length) {
      const altTax = personRows.reduce((sum, r) => sum + r.tax, 0);
      const altRate = projectedProfit > 0 ? (altTax / projectedProfit * 100) : 0;
      const header = `<div style="display:flex; gap:8px; font-size:10px; color:var(--ink-soft); margin:6px 0 2px;"><span style="flex:2;">Who</span><span style="width:50px;">Share</span><span style="width:70px;">Eff. rate</span><span style="width:70px;">Tax on share</span></div>`;
      const typeTag = (t) => t === 'minor' ? ' (Minor)' : t === 'company' ? ' (Company)' : '';
      const personHtml = personRows.map((r, i) => `
        <div style="display:flex; gap:8px; font-size:12px; align-items:baseline;">
          <span style="flex:2;">${i + 1}. ${r.label}${typeTag(r.type)}</span>
          <span style="width:50px;">${r.share}%</span>
          <span style="width:70px;">${r.rate.toFixed(0)}%</span>
          <span style="width:70px;">${formatMoney(r.tax)}</span>
        </div>
        <div style="font-size:10px; color:var(--ink-soft); margin:0 0 4px;">${formatMoney(r.amt)} — ${r.context}</div>
      `).join('');
      const scopeNote = `<p style="font-size:10px; color:var(--ink-soft); font-style:italic; margin:4px 0 0;">"Tax on share" is only the tax this business distribution adds — not each person's whole personal tax bill (which would also include tax on their other income by itself).</p>`;
      if (isModelingOwnStructure) {
        // This IS the client's real structure now that a split's been
        // supplied — promote it to the actual headline/tile (and its
        // colour) instead of only ever surfacing inside this breakdown.
        tax = altTax;
        headline = formatMoney(tax);
        const who = personRows.length > 1
          ? (entityType === 'Trust' ? 'beneficiaries' : 'partners')
          : (entityType === 'Trust' ? 'beneficiary' : 'partner');
        headlineLabel = `Estimated tax — split across ${personRows.length} ${who} below (${altRate.toFixed(1)}% eff. rate)`;
        const totalRow = `<div class="ocf-row" style="font-weight:600; border-top:1px solid var(--line); margin-top:4px; padding-top:4px;"><label>Total</label><span>${formatMoney(altTax)} <span style="font-weight:400; color:var(--ink-soft);">(${altRate.toFixed(1)}% eff. rate)</span></span></div>`;
        bracketDetail = header + personHtml + totalRow + scopeNote;
      } else {
        const existingRate = (tax != null && projectedProfit > 0) ? (tax / projectedProfit * 100) : null;
        const existingLabel = entityType || 'not set';
        const existingRow = `<div class="ocf-row" style="font-weight:600;"><label>Existing (${existingLabel})</label><span>${tax != null ? formatMoney(tax) : '—'}${existingRate != null ? ` <span style="font-weight:400; color:var(--ink-soft);">(${existingRate.toFixed(1)}% eff. rate)</span>` : ''}</span></div>`;
        const diff = tax != null ? altTax - tax : null;
        const totalRow = `<div class="ocf-row" style="font-weight:600; border-top:1px solid var(--line); margin-top:4px; padding-top:4px;"><label>Total (${compareEntity.toLowerCase()})</label><span>${formatMoney(altTax)} <span style="font-weight:400; color:var(--ink-soft);">(${altRate.toFixed(1)}% eff. rate${diff != null ? `, ${diff >= 0 ? '+' : '−'}${formatMoney(Math.abs(diff))} vs existing` : ''})</span></span></div>`;
        bracketDetail = existingRow + header + personHtml + totalRow + scopeNote;
      }
    }
  }

  // Once a scenario's actually being modeled (and Cash outlook's own
  // calculation is available — see the new "Projected cash flow" tile),
  // this compares against what the SCENARIO itself would leave you with,
  // not today's static balance from before any of this happened — the more
  // relevant question once you're asking "can this scenario afford its own
  // tax". Falls back to today's actual cash when there's no projection to
  // compare against (op_cash_conversion unavailable).
  let cashText = '', cashClass = '';
  const cashForCoverage = projectedCashFlow != null ? projectedCashFlow : cash;
  const cashCoverageLabel = projectedCashFlow != null ? 'Projected cash flow' : "Today's cash";
  if (tax != null && tax > 0 && cashForCoverage != null) {
    const coverage = cashForCoverage / tax;
    // 3 bands, not 2 — the text below already reads as "comfortable" vs
    // "covers, but worth setting aside" vs "a real shortfall"; the colour
    // was collapsing that middle "worth setting aside now" tier into a flat
    // green, same green as "comfortably covers", which read as no warning
    // at all. Matches this app's own green/yellow/red convention elsewhere
    // (see SCORE_TILE_COLORS) instead of a plain good/bad split.
    cashClass = coverage >= 2 ? 'good' : coverage >= 1 ? 'watch' : 'bad';
    cashText = coverage >= 2 ? `${cashCoverageLabel} (${formatMoney(cashForCoverage)}) would comfortably cover this (${coverage.toFixed(1)}x).`
      : coverage >= 1 ? `${cashCoverageLabel} (${formatMoney(cashForCoverage)}) would cover this (${coverage.toFixed(1)}x) — worth starting to set aside now.`
      : coverage >= 0.5 ? `${cashCoverageLabel} (${formatMoney(cashForCoverage)}) covers about ${Math.round(coverage * 100)}% of this — worth planning ahead for the gap.`
      : `${cashCoverageLabel} (${formatMoney(cashForCoverage)}) covers only ${Math.round(coverage * 100)}% of this — a growth scenario worth funding for in advance.`;
  }

  return { headline, headlineLabel, cashText, cashClass, buildup, provenance, deductionNote, compareText, bracketDetail, distributedAmount, distributableProfit, projectedProfit };
}

// Wiring for renderTaxOutlookCard's markup — same split as
// wireCashOutlookCard above, so this card can also mount inside the
// Meeting's Financial brief (meeting-intelligence-build-spec.md §4), not
// just its original home on Financial Performance → Analyse. Reads
// currentCtx directly (entity_type) rather than taking it as a param —
// currentCtx is set once per client selection (selectClient), so it's
// already populated by the time either caller renders this card.
function wireTaxOutlookCard(snapshot, kpis) {
  const taxOutlookUnit = document.getElementById('tax-outlook-unit');
  if (!taxOutlookUnit || !snapshot?.revenue || snapshot?.net_profit == null) return;
  const conversion = kpis?.find((k) => k.key === 'op_cash_conversion')?.value;
  const tileEl = document.getElementById('tax-outlook-tile');
  const profitValueEl = document.getElementById('tax-outlook-profit-value');
  const taxValueEl = document.getElementById('tax-outlook-tax-value');
  const taxLabelEl = document.getElementById('tax-outlook-tax-label');
  const projectedCashValueEl = document.getElementById('tax-outlook-projected-cash-value');
  const cashLineEl = document.getElementById('tax-outlook-cash-line');
  const buildupEl = document.getElementById('tax-outlook-buildup');
  const provenanceEl = document.getElementById('tax-outlook-provenance');
  const deductionNoteEl = document.getElementById('tax-outlook-deduction-note');
  const compareTextEl = document.getElementById('tax-outlook-compare-text');
  const bracketDetailEl = document.getElementById('tax-outlook-bracket-detail');
  const revenueInput = document.getElementById('tax-outlook-revenue');
  const gpInput = document.getElementById('tax-outlook-gp');
  const opexInput = document.getElementById('tax-outlook-opex');
  const netProfitInput = document.getElementById('tax-outlook-netprofit');
  const netProfitAbsoluteInput = document.getElementById('tax-outlook-netprofit-absolute');
  const superInput = document.getElementById('tax-outlook-super');
  const equipmentInput = document.getElementById('tax-outlook-equipment');
  const oneOffIncomeInput = document.getElementById('tax-outlook-oneoff-income');
  const oneOffExpenseInput = document.getElementById('tax-outlook-oneoff-expense');
  const carriedLossesInput = document.getElementById('tax-outlook-carried-losses');
  const equipmentDeductibleInput = document.getElementById('tax-outlook-equipment-deductible');
  const compareEntityInput = document.getElementById('tax-outlook-compare-entity');
  const compareInputsWrap = document.getElementById('tax-outlook-compare-inputs');
  let compareShareInputs = [...document.querySelectorAll('.tax-outlook-compare-share')];
  let compareOtherIncomeInputs = [...document.querySelectorAll('.tax-outlook-compare-other-income')];
  let compareTypeInputs = [...document.querySelectorAll('.tax-outlook-compare-type')];
  // These are always genuine dollar figures regardless of the Change-
  // amounts-as %/$ toggle above (that toggle only affects the revenue/GP/
  // opex/net-profit CHANGE rows, not these) — safe to always show the comma
  // preview, unlike a field that might currently mean "15%".
  [netProfitAbsoluteInput, superInput, equipmentInput, oneOffIncomeInput, oneOffExpenseInput, carriedLossesInput, equipmentDeductibleInput, ...compareOtherIncomeInputs].forEach((el) => wireMoneyInputPreview(el));
  // These 4 flip between %/$ with the toggle — only preview as money while
  // it currently means dollars (see wireMoneyInputPreview's isActive).
  [revenueInput, gpInput, opexInput, netProfitInput].forEach((el) => wireMoneyInputPreview(el, () => taxOutlookUnit.value === 'dollar'));
  const recalcTaxOutlook = () => {
    taxOutlookState = {
      compareEntity: compareEntityInput.value,
      compareShareUnit: document.getElementById('tax-outlook-compare-share-unit')?.value || 'pct',
      compareShares: compareShareInputs.map((el) => el.value), compareOtherIncome: compareOtherIncomeInputs.map((el) => el.value),
      compareTypes: compareTypeInputs.map((el) => el.value),
      carriedLosses: Number(carriedLossesInput.value) || 0,
      equipmentDeductible: equipmentDeductibleInput.value,
    };
    persistScenarioState();
    // Nothing to show until an actual scenario's been entered — "0% change
    // everywhere" still computes a real number (tax on this period's actual
    // profit, unchanged), which read as an automatic answer nobody asked
    // for. Same condition panelOpen above already uses to decide whether
    // this panel starts expanded. Shared fields (including super/equipment
    // now) read off scenarioState (kept current by syncSharedScenarioField,
    // possibly from Cash outlook's own inputs) rather than this card's own
    // — there is no "this card's own" copy of them any more.
    const hasScenario = scenarioState.revenue !== 0 || scenarioState.gp !== 0 || scenarioState.opex !== 0 || scenarioState.netProfit !== 0
      || scenarioState.netProfitAbsolute !== '' || scenarioState.super !== 0 || scenarioState.equipment !== 0
      || scenarioState.oneOffIncome !== 0 || scenarioState.oneOffExpense !== 0 || taxOutlookState.compareEntity !== ''
      || taxOutlookState.carriedLosses !== 0;
    if (!hasScenario) {
      profitValueEl.textContent = '—';
      taxValueEl.textContent = '—';
      taxValueEl.style.color = '';
      taxLabelEl.textContent = 'Enter a scenario below to estimate';
      if (projectedCashValueEl) projectedCashValueEl.textContent = '—';
      cashLineEl.textContent = '';
      cashLineEl.className = 'kpi-interp';
      if (tileEl) tileEl.style.background = 'var(--paper)';
      buildupEl.innerHTML = '';
      // Same fix as Cash outlook's own provenance line — names the actual
      // baseline up front instead of leaving it blank until something's
      // typed in.
      provenanceEl.textContent = `This period's actual net profit is ${formatMoney(snapshot.net_profit)}.`;
      deductionNoteEl.textContent = '';
      compareTextEl.textContent = '';
      bracketDetailEl.innerHTML = '';
      const distEl = document.getElementById('tax-outlook-compare-distributed');
      if (distEl) distEl.textContent = '';
      return;
    }
    // Same scenario, run through the OTHER card's own calculation FIRST —
    // so this card can show "this is the extra tax, and this is the cash
    // you'd actually have" side by side (instead of needing Cash outlook
    // open too), and so the "would this be affordable" line below can
    // compare against what the scenario itself leaves you with, not
    // today's static balance from before any of this happened.
    let cashResult = null;
    if (conversion != null) {
      cashResult = computeCashOutlookResult(
        snapshot, conversion, scenarioState.unit,
        scenarioState.revenue, scenarioState.gp, scenarioState.opex, scenarioState.netProfit, scenarioState.netProfitAbsolute,
        cashOutlookState.conversionOverride, scenarioState.oneOffIncome, scenarioState.oneOffExpense,
        scenarioState.super, scenarioState.equipment
      );
      if (projectedCashValueEl) projectedCashValueEl.textContent = cashResult.headline;
    }
    const r = computeTaxOutlookResult(
      snapshot, snapshot.cash, currentCtx?.entity_type, scenarioState.unit,
      scenarioState.revenue, scenarioState.gp, scenarioState.opex, scenarioState.netProfit, scenarioState.netProfitAbsolute,
      scenarioState.super, scenarioState.equipment, scenarioState.oneOffIncome, scenarioState.oneOffExpense,
      taxOutlookState.compareEntity, taxOutlookState.compareShares, taxOutlookState.compareOtherIncome,
      cashResult?.projectedOCF, taxOutlookState.compareShareUnit, taxOutlookState.compareTypes, taxOutlookState.carriedLosses, taxOutlookRatesState, taxOutlookState.equipmentDeductible
    );
    const distEl = document.getElementById('tax-outlook-compare-distributed');
    if (distEl) {
      if (r.distributableProfit != null) {
        const remaining = r.distributableProfit - r.distributedAmount;
        const pct = r.distributableProfit > 0 ? (r.distributedAmount / r.distributableProfit * 100) : 0;
        const closeEnough = Math.abs(remaining) < 1;
        distEl.style.color = closeEnough ? 'var(--sage)' : 'var(--rust)';
        distEl.textContent = closeEnough
          ? `Distributed ${formatMoney(r.distributedAmount)} of ${formatMoney(r.distributableProfit)} projected profit (${pct.toFixed(0)}%) — fully accounted for.`
          : remaining > 0
            ? `Distributed ${formatMoney(r.distributedAmount)} of ${formatMoney(r.distributableProfit)} projected profit (${pct.toFixed(0)}%) — ${formatMoney(remaining)} not yet assigned to anyone.`
            : `Distributed ${formatMoney(r.distributedAmount)} of ${formatMoney(r.distributableProfit)} projected profit (${pct.toFixed(0)}%) — ${formatMoney(Math.abs(remaining))} more than the profit itself.`;
      } else {
        distEl.textContent = '';
      }
    }
    profitValueEl.textContent = formatMoney(r.projectedProfit);
    taxValueEl.textContent = r.headline;
    taxLabelEl.textContent = r.headlineLabel;
    cashLineEl.textContent = r.cashText;
    cashLineEl.className = 'kpi-interp' + (r.cashClass ? ' ' + r.cashClass : '');
    // The projected tax amount itself has no inherent good/bad (a bigger
    // number can just mean a bigger projected profit) — same reasoning as
    // Tax vs cash on hand's own tile split. What IS good/bad is whether
    // today's cash would actually cover it, so the tile tints on cashClass,
    // not on the number, and stays neutral (was hardcoded green before)
    // until there's an actual coverage read to show. Tints the value text
    // too, not just the pale bg — a bg alone barely reads as coloured (see
    // cashLineEl.className above needing the same fix).
    const TAX_TILE_COLORS = { good: ['var(--sage-bg)', 'var(--sage)'], watch: ['#F9F4E8', 'var(--brass)'], bad: ['var(--rust-bg)', 'var(--rust)'] };
    const [tileBg, tileColor] = TAX_TILE_COLORS[r.cashClass] || ['var(--paper)', ''];
    if (tileEl) tileEl.style.background = tileBg;
    taxValueEl.style.color = tileColor;
    buildupEl.innerHTML = r.buildup;
    provenanceEl.textContent = r.provenance;
    deductionNoteEl.textContent = r.deductionNote;
    compareTextEl.textContent = r.compareText;
    bracketDetailEl.innerHTML = r.bracketDetail;
  };
  // These 4 fields' meaning (and step) flips with the unit toggle — 1 makes
  // sense for a percentage-point change, but is useless for a dollar one
  // (clicking a spinner from $0 to $20,000 one dollar at a time). Mirrors
  // wireCashOutlookCard's own updateToggleSteps.
  const toggleStepFields = [revenueInput, gpInput, opexInput, netProfitInput];
  const updateTaxOutlookToggleSteps = () => {
    const step = taxOutlookUnit.value === 'dollar' ? '1000' : '1';
    toggleStepFields.forEach((el) => { el.step = step; el._moneyPreviewUpdate?.(); });
  };
  scenarioRecalcs.push(recalcTaxOutlook);
  scenarioUnitSyncs.push(updateTaxOutlookToggleSteps);
  taxOutlookUnit.onchange = () => syncSharedScenarioField('unit', 'tax', taxOutlookUnit.value);
  compareEntityInput.onchange = () => {
    // Switching structure changes the input SHAPE (Company/Sole trader get
    // one plain adjustment field, Partnership/Trust get the share grid) —
    // regenerate the fragment in place rather than a full renderMain(), same
    // "fast/local" philosophy as the rest of this card. Partnership/Trust
    // get a clean 50/50 starting split; a leftover value from whatever was
    // previously entered would otherwise silently skew the new comparison.
    // Also resets the %/$ split unit back to % on a structure switch — a
    // leftover $ split from the previous structure would otherwise silently
    // get read as a % (or vice versa) once the shares are gone.
    const entity = compareEntityInput.value;
    const defaultShares = entity === 'Partnership' || entity === 'Trust' ? ['50', '50', '', '', '', '', '', ''] : [];
    compareInputsWrap.innerHTML = renderTaxOutlookCompareInputs(entity, defaultShares, [], 'pct', []);
    wireCompareFragment();
    recalcTaxOutlook();
  };
  // Extracted so both the entity switch above and the %/$ split-unit toggle
  // below can regenerate + rewire the fragment identically, instead of two
  // slightly different copies of the same wiring drifting apart.
  function wireCompareFragment() {
    compareShareInputs = [...document.querySelectorAll('.tax-outlook-compare-share')];
    compareOtherIncomeInputs = [...document.querySelectorAll('.tax-outlook-compare-other-income')];
    compareTypeInputs = [...document.querySelectorAll('.tax-outlook-compare-type')];
    compareOtherIncomeInputs.forEach((el) => wireMoneyInputPreview(el));
    [...compareShareInputs, ...compareOtherIncomeInputs].forEach((el) => { el.oninput = recalcTaxOutlook; });
    compareTypeInputs.forEach((el) => { el.onchange = recalcTaxOutlook; });
    const shareUnitSelect = document.getElementById('tax-outlook-compare-share-unit');
    if (shareUnitSelect) {
      shareUnitSelect.onchange = () => {
        // Switching between % and $ makes whatever was typed mean something
        // completely different (5 vs $5) — clearing avoids a stale "5%"
        // silently being read as "$5" the moment the unit flips. The type
        // (adult/minor/company) per row isn't affected by the %/$ switch, so
        // that carries across unlike the share values.
        compareInputsWrap.innerHTML = renderTaxOutlookCompareInputs(
          compareEntityInput.value, ['', '', '', '', '', '', '', ''], compareOtherIncomeInputs.map((el) => el.value),
          shareUnitSelect.value, compareTypeInputs.map((el) => el.value)
        );
        wireCompareFragment();
        recalcTaxOutlook();
      };
    }
  }
  wireCompareFragment();
  // Shared fields sync through syncSharedScenarioField (updates
  // scenarioState, mirrors the value onto Cash outlook's matching input if
  // it's mounted, then reruns every registered recalc/step-sync) instead of
  // touching only this card's own local recalc.
  [
    [revenueInput, 'revenue'], [gpInput, 'gp'], [opexInput, 'opex'], [netProfitInput, 'netProfit'],
    [netProfitAbsoluteInput, 'netProfitAbsolute'], [oneOffIncomeInput, 'oneOffIncome'], [oneOffExpenseInput, 'oneOffExpense'],
    [superInput, 'super'], [equipmentInput, 'equipment'],
  ].forEach(([el, key]) => { el.oninput = () => syncSharedScenarioField(key, 'tax', el.value); });
  // Tax-only, not part of scenarioState (see the field's own note) — a plain
  // local recalc, same as the compare-structure inputs, not a shared-field sync.
  carriedLossesInput.oninput = recalcTaxOutlook;
  equipmentDeductibleInput.oninput = recalcTaxOutlook;
  recalcTaxOutlook();

  const taxOutlookToggle = document.getElementById('tax-outlook-toggle');
  const taxOutlookPanel = document.getElementById('tax-outlook-panel');
  const openTaxOutlookPanel = () => {
    taxOutlookPanel.style.display = 'block';
    taxOutlookToggle.querySelector('.chevron').textContent = '▴';
    taxOutlookPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
  taxOutlookToggle.onclick = () => {
    const willOpen = taxOutlookPanel.style.display === 'none';
    taxOutlookPanel.style.display = willOpen ? 'block' : 'none';
    taxOutlookToggle.querySelector('.chevron').textContent = willOpen ? '▴' : '▾';
  };
  document.getElementById('tax-outlook-provenance-link').onclick = openTaxOutlookPanel;

  // Tax rates panel lives in the same card, so it reuses recalcTaxOutlook
  // directly (defined just above, in this same scope) instead of a full
  // renderMain() — that keeps a rate edit as fast/local as any scenario
  // field, rather than reloading the whole tab and losing scroll position
  // and every other panel's open/closed state.
  wireTaxRatesPanel('tax', 'tr-', 'tax-rates-status-label', recalcTaxOutlook, () => taxOutlookRatesState, (v) => { taxOutlookRatesState = v; });

  // Same fix as Cash outlook's own ⓘ — this card's info icon is normally
  // wired container-wide by renderHealthWheelBlock on the full Financial
  // Performance → Analyse page, which the Meeting brief (renderFinancialBrief)
  // never mounts, so the icon did nothing there. Wired directly instead.
  const taxInfoBtn = taxOutlookUnit.closest('.kpi-card')?.querySelector('[data-kpi-info]');
  if (taxInfoBtn) {
    taxInfoBtn.onclick = () => {
      const panel = taxInfoBtn.closest('.kpi-card')?.querySelector('.kpi-description');
      if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    };
  }
}

// Fills what used to be a lot of empty space on the Operating Cash
// Conversion card (its detailed breakdown moved to the Cash in/out card) with
// something that actually answers the question this KPI exists to ask: the
// business made $X, how much of it became real cash, and — the "so what" —
// what to do about it depending on whether that's high or low. Clicking it
// jumps straight to the Cash in/out card's own detail, since that's where
// "where did it go" actually gets answered line by line.
// Click-to-reveal "show your working" for the confidence badge — same
// "quiet until asked for" pattern as the tax position and OCF panels, just
// generic enough to cover every plain ratio/days KPI at once instead of a
// bespoke panel per metric. op_cash_conversion and effective_tax_rate skip
// this entirely — they already have their own dedicated breakdown UI
// (renderCashConversionExplainer / renderTaxPositionHeader) that handles
// derivation nuances (estimated OCF, tax bracket detail) this generic
// version doesn't know about.
function kpiCalculationHtml(kpi, snapshot) {
  const fieldAmount = (f) => `${FIELD_LABEL[f] || f} (${formatMoney(snapshot?.[f])})`;
  if (kpi.kind === 'growth') {
    const fields = kpi.numerator || [];
    const total = fields.reduce((sum, f) => sum + (Number(snapshot?.[f]) || 0), 0);
    return `
      <div class="kpi-calc-breakdown" style="display:none;">
        <p class="kpi-calc-line">${fields.map(fieldAmount).join(' + ')} this period = ${formatMoney(total)}</p>
        <p class="kpi-calc-line">Compared against that same total from the prior period to get the % change shown — switch periods above to see the prior figure itself.</p>
      </div>
    `;
  }
  const numFields = kpi.numerator || [];
  const denFields = kpi.denominator || [];
  const numTotal = numFields.reduce((sum, f) => sum + (Number(snapshot?.[f]) || 0), 0);
  const denTotal = denFields.reduce((sum, f) => sum + (Number(snapshot?.[f]) || 0), 0);
  const daysNote = kpi.kind === 'days' ? ' × 365' : '';
  return `
    <div class="kpi-calc-breakdown" style="display:none;">
      <p class="kpi-calc-line">${numFields.map(fieldAmount).join(' + ')} ÷ ${denFields.map(fieldAmount).join(' + ')}${daysNote}</p>
      <p class="kpi-calc-result">= ${formatMoney(numTotal)} ÷ ${formatMoney(denTotal)}${daysNote} = ${formatKpi(kpi.value, kpi.format)}</p>
    </div>
  `;
}

function renderCashConversionExplainer(kpi, snapshot) {
  const denomSum = (kpi.denominator || []).reduce((sum, f) => sum + (Number(snapshot[f]) || 0), 0);
  if (!denomSum) return '';
  const pct = kpi.value;
  const cashAmount = pct * denomSum;
  const isHigh = pct >= 0.8;
  const radius = 30;
  const circumference = 2 * Math.PI * radius;
  const filled = Math.max(0, Math.min(1, pct)) * circumference;
  const ringColor = isHigh ? 'var(--sage)' : 'var(--rust)';
  const narrative = `This period: ${formatMoney(denomSum)} profit → ${formatMoney(cashAmount)} became cash.`;
  const followUp = isHigh
    ? `Most of it reached the bank — what's the plan for it? Pay down debt, reinvest, or build a buffer.`
    : `A chunk of it hasn't reached the bank yet. Tap through to see exactly where it went.`;
  return `
    <div class="cash-conv-explainer" id="cash-conv-jump" title="See the cash breakdown">
      <svg viewBox="0 0 72 72" class="cash-conv-donut" aria-hidden="true">
        <circle cx="36" cy="36" r="${radius}" fill="none" stroke="var(--line)" stroke-width="7" />
        <circle cx="36" cy="36" r="${radius}" fill="none" stroke="${ringColor}" stroke-width="7"
          stroke-dasharray="${filled} ${circumference}" stroke-linecap="round" transform="rotate(-90 36 36)" />
        <text x="36" y="41" text-anchor="middle" class="cash-conv-donut-label">${(pct * 100).toFixed(0)}%</text>
      </svg>
      <div class="cash-conv-text">
        <p class="cash-conv-narrative">${narrative}</p>
        <p class="cash-conv-followup">${followUp}</p>
      </div>
    </div>
  `;
}

// "What has happened" (position, not just the resulting %) needs the raw
// numbers visible, not just the ratio. Styled after the "Where the cash
// went" net-this-period stats (same bold-value/small-label shape, see
// .cash-net-value/.cash-net-stat-label), just boxed — rate on the left since
// that's the thing worth discussing, dollar figure on the right for context.
// The calculation and the "why look at this" note are click-to-reveal
// (wired in renderHealthWheelBlock, #tax-position-toggle), same
// show/hide pattern as the OCF and reconciliation adjust panels — quiet
// until asked for, not competing with the numbers for attention.
// State for the "Current tax position" card's own estimate tile — separate
// from taxOutlookState (Tax Outlook's own compare-entity feature) since
// this is a different card modeling a different question ("what should OUR
// actual structure be paying", not "what if we were a different one").
let taxPositionCompareState = { shares: [], otherIncome: [], profitAdjustment: '', activated: false };
// Tracks which client+period taxPositionCompareState currently reflects, so
// renderTaxPositionHeader knows when to reseed it from whatever split was
// SAVED for the period now being viewed (financial_snapshots.tax_
// structure_split — see migration_tax_structure_split.sql) rather than
// leaving whatever the adviser was typing for the last period/client on
// screen. Per-period, not just per-client, since the top period selector
// can switch periods without going through selectClient at all.
let taxPositionSplitLoadedFor = null;
// Every entity type gets the same toggle + inline-input tile shape — a plain
// value with no way to enter anything would silently assume "no adjustment",
// which understates real tax whenever it's wrong. Company and Sole trader
// share one collapsed-by-default "income adjustment" field (their share is
// fixed at 100%, nothing to split), since a company can carry investment
// income or super/other deductions alongside its business profit just as a
// sole trader can carry other personal income — same +/- adjustment
// mechanism either way, just against a flat rate for Company and marginal
// brackets for an individual. Partnership/Trust use the fuller share/
// other-income grid since there's a real split to enter (see
// estimateTaxForEntity's own comment on why that's adviser-supplied, not
// guessed).
// Returns TWO tiles (rate estimate + expense estimate) sharing one toggle/
// input state, since they're the same underlying estimate shown two ways —
// what matters (per the actual goal here: "is the effective rate good, and
// can it be better") is the RATE as much as the dollar figure, so both get
// their own box rather than the rate being an afterthought inside the $ one.
function renderTaxPositionEstimateTiles(entityType) {
  const rateTile = (valueId, diffId) => `
    <div style="background:var(--paper); border-radius:8px; padding:8px 12px; flex:1 1 110px; min-width:0;">
      <p class="cash-net-value" style="margin:0; font-size:19px; font-weight:400;" id="${valueId}">—</p>
      <span class="cash-net-stat-label">Effective rate — estimated</span>
      <p style="font-size:11px; margin:4px 0 0;" id="${diffId}"></p>
    </div>
  `;
  if (!entityType) {
    return rateTile('tax-position-estimate-rate', 'tax-position-estimate-rate-diff') + `
      <div style="background:var(--paper); border-radius:8px; padding:8px 12px; flex:1 1 140px; min-width:0;">
        <p class="cash-net-value" style="margin:0; font-size:19px; font-weight:400; color:var(--ink-soft);">—</p>
        <span class="cash-net-stat-label">Tax expense — estimated</span>
        <p style="font-size:10px; color:var(--ink-soft); margin:4px 0 0;">Set an entity structure on Profile.</p>
      </div>
    `;
  }
  const s = taxPositionCompareState;
  const isCompany = entityType === 'Company';
  const isSolo = entityType === 'Sole trader';
  const isSingle = isSolo || isCompany;
  const who = entityType === 'Trust' ? 'beneficiary' : 'partner';
  const hasInput = isSingle ? !!s.otherIncome[0] : (s.shares.some((v) => v) || !!s.profitAdjustment);
  // Nothing computes until this tile has actually been opened once (see
  // recalcTaxPositionEstimate's activated gate) — Company/Sole trader were
  // previously the exception, showing a confident-looking flat-rate number
  // the moment the card rendered, with zero adviser interaction. A generic
  // "click to estimate" invites that first click; once activated, the hint
  // switches to what's actually still worth adding for this entity type.
  const toggleHint = !s.activated ? '▾ click to estimate'
    : hasInput ? '' : isCompany ? '▾ add investment income or deductions' : isSolo ? '▾ adjust for non-business income' : `▾ enter ${who} shares`;
  const singleTooltip = isCompany
    ? "Adds to (or, entered as a negative number, subtracts from) the profit used for this estimate — e.g. investment/interest income, or super contributions and other deductions."
    : "Adds to (or, entered as a negative number, subtracts from) the profit used for this estimate — e.g. other personal income, or a loss/deduction elsewhere.";
  const inputsHtml = isSingle
    ? `<div style="display:flex; align-items:center; gap:6px;"><label style="font-size:11px; color:var(--ink-soft);" title="${singleTooltip}">Income adjustment ($, +/-)</label><input type="number" class="tax-position-compare-other-income" data-income-index="0" value="${s.otherIncome[0] || ''}" placeholder="e.g. 80000 or -20000" step="1000" style="width:100px; padding:4px; border:1px solid var(--line); border-radius:5px; font-size:11px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);" /></div>`
    : `
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
        <label style="font-size:11px; color:var(--ink-soft);" title="Adds to (or, entered as a negative number, subtracts from) the total profit BEFORE it's split by share below — e.g. income taxed differently to ordinary business profit, or something excluded from taxable income.">Adjust total profit ($, +/-, optional)</label>
        <input type="number" class="tax-position-compare-profit-adj" value="${s.profitAdjustment || ''}" placeholder="e.g. 15000 or -15000" step="1000" style="width:100px; padding:4px; border:1px solid var(--line); border-radius:5px; font-size:11px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);" />
      </div>
      <div style="display:flex; gap:8px; font-size:10px; color:var(--ink-soft); margin:0 0 2px;"><span style="width:46px;">Share %</span><span title="Adds to (or, entered as a negative number, subtracts from) that person's share of profit — e.g. other personal income, or a loss/deduction elsewhere.">Income adj. $ (+/-)</span></div>
      ${[0, 1, 2, 3].map((i) => `
        <div style="display:flex; align-items:center; gap:4px; margin-bottom:3px;">
          <input type="number" class="tax-position-compare-share" data-share-index="${i}" value="${s.shares[i] || ''}" placeholder="${i < 2 ? 50 : ''}" style="width:46px; padding:4px; border:1px solid var(--line); border-radius:5px; font-size:11px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);" />
          <input type="number" class="tax-position-compare-other-income" data-income-index="${i}" value="${s.otherIncome[i] || ''}" placeholder="0" step="1000" style="width:76px; padding:4px; border:1px solid var(--line); border-radius:5px; font-size:11px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);" />

    `;
  // Explicit save, not autosave — this is an assumption being recorded, not
  // an actual fact, so it shouldn't silently overwrite what the Tax pillar
  // score/AI diagnosis read (see analyze-background.js's use of financial_
  // snapshots.tax_structure_split) with half-finished trial numbers.
  // Clicking Save with everything blank clears a previously saved split
  // back to nothing — same "malleable, can go back to nil" the live toggle
  // already has, just for the persisted copy.
  const saveSplitHtml = `
    <div style="margin-top:8px; display:flex; align-items:center; gap:8px;">
      <button type="button" id="tax-position-save-split-btn" class="mini-link">Save this split</button>
      <span id="tax-position-save-split-status" style="font-size:10px; color:var(--ink-soft);"></span>
    </div>
  `;
  return rateTile('tax-position-estimate-rate', 'tax-position-estimate-rate-diff') + `
    <div style="background:var(--paper); border-radius:8px; padding:8px 12px; flex:1 1 190px; min-width:0;">
      <button type="button" id="tax-position-estimate-toggle" title="${isCompany ? 'Adjust for investment income or deductions to refine' : isSolo ? 'Adjust for non-business income to refine' : 'Enter shares to estimate'}"
        style="cursor:pointer; text-align:left; background:none; border:none; padding:0; font-family:inherit; width:100%;">
        <p class="cash-net-value" style="margin:0; font-size:19px; font-weight:400;" id="tax-position-estimate-value">—</p>
        <span class="cash-net-stat-label">Tax expense — estimated <span class="sub" id="tax-position-estimate-hint">${toggleHint}</span></span>
      </button>
      <p style="font-size:11px; margin:4px 0 0;" id="tax-position-estimate-diff"></p>
      <p style="font-size:10px; color:var(--ink-soft); margin:2px 0 0;" id="tax-position-estimate-profit-basis"></p>
      <div id="tax-position-estimate-inputs" style="display:${hasInput ? 'block' : 'none'}; margin-top:6px;">${inputsHtml}${saveSplitHtml}</div>
    </div>
  `;
}
function renderTaxPositionHeader(kpi, snapshot, valueColorClass) {
  const taxExpense = (kpi.numerator || []).reduce((sum, f) => sum + (Number(snapshot[f]) || 0), 0);
  const netProfit = (kpi.denominator || []).reduce((sum, f) => sum + (Number(snapshot[f]) || 0), 0);
  if (!netProfit) return `<p class="kpi-value unavailable">Not enough data</p>`;
  // Reseed from whatever split was SAVED for the period now being viewed
  // (see taxPositionSplitLoadedFor's own comment) — a saved split starts
  // activated (shown immediately, no click needed), since it's a confirmed
  // assumption for this period, not something to rediscover each visit.
  const splitKey = `${currentClientId}:${snapshot.period_end}`;
  if (taxPositionSplitLoadedFor !== splitKey) {
    taxPositionSplitLoadedFor = splitKey;
    const saved = snapshot.tax_structure_split;
    taxPositionCompareState = saved
      ? { shares: saved.shares || [], otherIncome: saved.otherIncome || [], profitAdjustment: saved.profitAdjustment ?? '', activated: true }
      : { shares: [], otherIncome: [], profitAdjustment: '', activated: false };
  }
  // netProfit alone is enough to run the ESTIMATE (estimateTaxForEntity only
  // needs profit + entity type) — actual tax expense is a separate fact that
  // can legitimately be blank, especially for Sole trader/Partnership/Trust,
  // where the entity itself doesn't pay income tax directly (it flows to the
  // people). Gating the whole card on kpi.value (the actual/actual ratio)
  // used to hide the estimate entirely for exactly the entities that need it
  // most — so this only affects the "actual" tiles below, not whether the
  // card renders at all.
  const hasActual = kpi.value != null;

  // Same "material move" framing as kpiTrendLine, but in %-points-of-tax-rate
  // terms rather than "pts" — plainer for a rate specifically.
  let trendHtml = '';
  if (hasActual && kpi.priorValue != null) {
    const diff = (kpi.value - kpi.priorValue) * 100;
    trendHtml = Math.abs(diff) < 0.05
      ? `<span class="trend-flat">— no change</span>`
      : `<span class="${diff > 0 ? 'trend-up' : 'trend-down'}">${diff > 0 ? '↑' : '↓'} ${Math.abs(diff).toFixed(1)}% vs last period</span>`;
  }
  // Same idea for the dollar figure sitting right next to it — priorValue
  // only carries the ratio, priorNumerator carries the raw prior $ tax
  // expense (see read-data.js), which is what this tile actually needs.
  // Deliberately NOT trend-up/trend-down (green/red) here — a bigger tax
  // bill isn't inherently bad (could just mean bigger profit), same reason
  // this tile stays neutral-toned below — so the arrow is purely
  // directional, no colour verdict attached.
  let expenseTrendHtml = '';
  if (hasActual && kpi.priorNumerator != null) {
    const expenseDiff = taxExpense - kpi.priorNumerator;
    expenseTrendHtml = Math.abs(expenseDiff) < 1
      ? `<span class="trend-flat">— no change</span>`
      : `<span class="trend-flat">${expenseDiff > 0 ? '↑' : '↓'} ${formatMoney(Math.abs(expenseDiff))} vs last period</span>`;
  }

  // Same tint the confidence badges already use for good/bad (sage-bg/rust-bg,
  // no border — just a soft fill), so the box carries the verdict rather than
  // just the text inside it. No target set = no verdict to show, so it stays
  // a plain neutral tile rather than guessing. Tax expense has no inherent
  // good/bad on its own (a bigger bill can just mean bigger profit), so it
  // always stays neutral.
  const rateBg = valueColorClass === 'good' ? 'var(--sage-bg)' : valueColorClass === 'bad' ? 'var(--rust-bg)' : 'var(--paper)';

  // The rate tile is itself the click-to-reveal trigger (#tax-position-toggle,
  // wired in renderHealthWheelBlock) — same as it was before the actual/
  // estimated tile split, just restored: it got flattened into a plain div
  // during that redesign, which silently dropped the click affordance.
  return `
    <div style="display:flex; gap:12px; margin:4px 0 2px; flex-wrap:wrap;">
      <button type="button" id="tax-position-toggle" title="Show the calculation"
        style="cursor:pointer; text-align:left; background:${hasActual ? rateBg : 'var(--paper)'}; border:none; border-radius:8px; padding:8px 12px; font-family:inherit; flex:1 1 110px; min-width:0;">
        <p class="cash-net-value ${hasActual ? valueColorClass : ''}" style="margin:0; font-size:19px; font-weight:400;${hasActual ? '' : ' color:var(--ink-soft);'}">${hasActual ? (kpi.value * 100).toFixed(1) + '%' : '—'}</p>
        <span class="cash-net-stat-label">Effective rate — actual</span>
        ${trendHtml ? `<p style="font-size:11px; margin:4px 0 0;">${trendHtml}</p>` : ''}
      </button>
      <div style="background:var(--paper); border-radius:8px; padding:8px 12px; flex:1 1 110px; min-width:0;">
        <p class="cash-net-value" style="margin:0; font-size:19px; font-weight:400;${hasActual ? '' : ' color:var(--ink-soft);'}">${hasActual ? formatMoney(taxExpense) : '—'}</p>
        <span class="cash-net-stat-label">Tax expense — actual</span>
        ${expenseTrendHtml ? `<p style="font-size:11px; margin:4px 0 0;">${expenseTrendHtml}</p>` : !hasActual ? `<p style="font-size:10px; color:var(--ink-soft); margin:4px 0 0;">Not recorded — this entity may not pay tax directly.</p>` : ''}
      </div>
      ${renderTaxPositionEstimateTiles(currentCtx?.entity_type)}
    </div>
    <p id="tax-position-rates-status" style="font-size:10px; color:var(--ink-soft); margin:6px 0 0;"></p>
    <div id="tax-position-detail" style="display:none; margin-top:8px;">
      <p style="font-size:11px; color:var(--ink-soft); margin:0;">= ${hasActual ? formatMoney(taxExpense) : '— (not recorded)'} tax expense ÷ ${formatMoney(netProfit)} net profit before tax</p>
      <p style="font-size:11px; color:var(--ink-soft); margin:4px 0 0; font-style:italic;">Why look at this: the rate shows what share of profit is going to tax — a shift here can flag a timing issue, a planning opportunity, or an error, even when profit itself hasn't moved much.</p>
    </div>
    ${currentCtx?.entity_type ? renderTaxRatesPanel('tax-position', currentCtx.entity_type) : ''}
  `;
}

      <div class="ocf-row"><label>Bracket 4 — up to ($) / rate (%)</label><div style="display:flex; gap:4px;"><input type="number" id="${prefix}-tr-b4-upper" value="${rs.bracket4Upper}" step="1000" style="width:80px;" /><input type="number" id="${prefix}-tr-b4-rate" value="${rs.bracket4Rate}" style="width:50px;" /></div></div>

      ${showSuperCap ? `<div class="ocf-row"><label>Super concessional cap ($)</label><input type="number" id="${prefix}-tr-super-cap" value="${rs.superCap}" step="1000" style="width:80px;" /></div>` : ''}
      <button type="button" class="mini-link" id="${prefix}-rates-reset" style="margin-top:4px;">Reset to defaults</button>

        <input type="text" id="${prefix}-rates-save-fy-input" value="${nextFYLabel(DEFAULT_TAX_RATES_FY)}" placeholder="FYyyyy-yy" style="width:80px; padding:4px 6px; border:1px solid var(--line); border-radius:5px; font-size:11px; font-family:var(--font-mono); background:var(--paper-raised); color:var(--ink);" />

// The one place that decides "is this KPI good/ok/bad" — a client-set
// target always wins when one exists (it's a binary beat/miss against
// their own explicit goal), the AI's general read is the fallback for
// every KPI nobody's set a target on. Shared by the card badge and by
// buildMeetingCandidates (Meeting Mode's Priorities step), so a KPI reading
// "bad" means the same thing — and is judged the same way — in both places.
function effectiveKpiVerdict(kpi) {
  if (kpi.confidence === 'red') return null;
  const targetItem = findKpiTarget(kpi.key);
  const direction = KPI_DIRECTION[kpi.key];
  if (targetItem && direction) {
    const beating = direction === 'higher' ? kpi.value >= targetItem.target : kpi.value <= targetItem.target;
    return { key: beating ? 'good' : 'bad', source: 'target' };
  }
  // Effective tax rate has no inherent good/bad on its own absent a target
  // (a bigger bill can just mean bigger profit — see renderTaxPositionHeader's
  // own comment, which deliberately never colors this KPI's value for the
  // same reason) — so this stays a plain "no verdict" tile rather than
  // showing an AI-guessed good/ok/bad that the card's own value display
  // explicitly refuses to endorse. Returning null here (not just skipping
  // the badge render) keeps every caller consistent — kpiCategoryVerdictCounts'
  // tallies and buildMeetingCandidates' Priorities scan agree with what the
  // card itself shows, not just the visible badge.
  if (kpi.key === 'effective_tax_rate') return null;
  // A client-set target always wins when one exists (above). Otherwise,
  // for the 3 KPIs with a real numeric general benchmark (see
  // KPI_GENERAL_BENCHMARK_THRESHOLDS), use THAT rather than the AI's
  // independent per-period judgment — keeps the badge from ever
  // contradicting the benchmark text shown right below it on the same card.
  const generalVerdict = generalBenchmarkVerdict(kpi.key, kpi.value);
  if (generalVerdict) return { key: generalVerdict, source: 'general' };
  if (kpi.key === 'revenue_growth') {
    const rg = revenueGrowthVerdict(kpi.value);
    if (rg) return { key: rg, source: 'general' };
  }
  if (kpi.verdict) return { key: kpi.verdict, source: 'ai' };
  return null;
}

function renderKpiCard(kpi, snapshot, editable = true) {
  const unavailable = kpi.confidence === 'red';
  const trend = (!unavailable && kpi.priorValue != null)
    ? `<p class="trend-line">${kpiTrendLine(kpi)}</p>` : '';
  const missing = unavailable ? missingFieldsFor(kpi, snapshot) : [];
  // Only colors the value once a target exists AND the direction is
  // unambiguous (see KPI_DIRECTION) — no target set, or a genuinely
  // direction-neutral metric, stays plain ink rather than a guessed verdict.
  let valueColorClass = '';
  const verdict = effectiveKpiVerdict(kpi);
  const verdictKey = verdict?.key || null;
  const verdictSource = verdict?.source || null; // 'target' | 'general' | 'ai'
  if (verdictSource === 'target' || verdictSource === 'general') valueColorClass = verdictKey;
  const verdictMeta = verdictKey ? KPI_VERDICT_META[verdictKey] : null;
  const verdictTitle = verdictSource === 'target' ? 'Compared to the target you set'
    : verdictSource === 'general' ? 'Compared to a general rule of thumb — no target set for this one'
    : 'AI’s general read — no target set for this one';
  const verdictBadge = verdictMeta
    ? `<span class="confidence-badge ${verdictMeta.cls} kpi-verdict-badge" title="${verdictTitle}">${verdictMeta.label}${verdictSource === 'ai' ? ' (AI)' : ''}</span>`
    : '';
  const isTaxRate = kpi.key === 'effective_tax_rate';
  // op_cash_conversion and effective_tax_rate already have their own
  // dedicated "show the calculation" toggle built into their special-case
  // headers — this generic one only applies to everything else.
  const showsGenericCalc = !unavailable && !isTaxRate && kpi.key !== 'op_cash_conversion';
  // "Unavailable" is right when the card has nothing to show at all — but
  // this one always offers the entity-aware ESTIMATE once net profit exists
  // (see renderTaxPositionHeader's own hasActual gate), even with no actual
  // tax_expense recorded. Badging that "Unavailable" reads as "there's
  // nothing here" when there's a whole proposed calculation sitting right
  // below it — so this one gets its own yellow "Estimated" instead,
  // reserving red for when even the estimate can't run (no profit at all).
  const taxRateUsesEstimateBadge = isTaxRate && unavailable && snapshot?.net_profit != null;
  const badgeCls = taxRateUsesEstimateBadge ? 'yellow' : kpi.confidence;
  const badgeLabel = taxRateUsesEstimateBadge ? CONFIDENCE_LABEL.yellow : CONFIDENCE_LABEL[kpi.confidence];
  const badgeTitle = taxRateUsesEstimateBadge ? ' title="No actual tax expense recorded — the estimate below uses net profit alone"'
    : showsGenericCalc ? ' data-kpi-calc="1" title="Click to see how this was calculated"' : '';
  return `
    <div class="kpi-card" data-kpi-card-key="${kpi.key}">
      <div class="kpi-card-head">
        <p class="kpi-name"${KPI_DESCRIPTIONS[kpi.key] ? ' data-kpi-info="1" title="Click to see what this measures"' : ''}>${isTaxRate ? 'Current tax position' : kpi.name}${KPI_DESCRIPTIONS[kpi.key] ? ' <span class="kpi-info-icon">ⓘ</span>' : ''}</p>
        <span class="confidence-badge ${badgeCls}${showsGenericCalc ? ' kpi-calc-toggle' : ''}"${badgeTitle}>${badgeLabel}</span>
      </div>
      ${KPI_DESCRIPTIONS[kpi.key] ? `<p class="kpi-interp kpi-description" style="display:none;">${KPI_DESCRIPTIONS[kpi.key]}</p>` : ''}
      ${showsGenericCalc ? kpiCalculationHtml(kpi, snapshot) : ''}
      ${isTaxRate
        ? renderTaxPositionHeader(kpi, snapshot, valueColorClass)
        : `<p class="kpi-value ${unavailable ? 'unavailable' : valueColorClass}">${unavailable ? 'Not enough data' : formatKpi(kpi.value, kpi.format)}</p>`}
      ${verdictBadge ? `<div class="kpi-verdict-row">${verdictBadge}</div>` : ''}
      ${!isTaxRate ? trend : ''}
      ${kpi.confidence === 'yellow' && kpi.estimation_note ? `<p class="kpi-note">${kpi.estimation_note}</p>` : ''}
      ${!unavailable && kpi.key === 'op_cash_conversion' ? renderCashConversionExplainer(kpi, snapshot) : ''}
      ${kpi.interpretation ? `<p class="kpi-interp">${kpi.interpretation}</p>` : ''}
      ${kpi.benchmark ? `<p class="kpi-benchmark">💡 ${kpi.benchmark} <span class="kpi-benchmark-tag">— general estimate, not verified</span></p>` : ''}
      ${!kpi.benchmark && KPI_GENERAL_BENCHMARK[kpi.key] ? `<p class="kpi-benchmark">💡 ${KPI_GENERAL_BENCHMARK[kpi.key]} <span class="kpi-benchmark-tag">— general rule of thumb, not industry-specific</span></p>` : ''}
      ${!unavailable && kpi.improvement_tip ? (isRecDismissed(`kpitip:${kpi.key}`) ? `
        <button class="mini-link" data-restore-kpi-tip="${escAttr(`kpitip:${kpi.key}`)}" type="button" style="margin-top:4px;">tip dismissed — show</button>
      ` : `
        <p class="kpi-tip">🔧 ${kpi.improvement_tip}</p>
        <div style="margin-top:2px;">
          <button class="mini-link" data-turn-kpi-goal="1" data-kpi-tip-text="${escAttr(`${isTaxRate ? 'Current tax position' : kpi.name}: ${kpi.improvement_tip}`)}" type="button">→ turn into goal</button>
          <button class="mini-link" data-turn-kpi-action="1" data-kpi-tip-text="${escAttr(`${isTaxRate ? 'Current tax position' : kpi.name}: ${kpi.improvement_tip}`)}" type="button">→ turn into action</button>
          <button class="mini-link" data-dismiss-kpi-tip="${escAttr(`kpitip:${kpi.key}`)}" type="button">✕ dismiss</button>
        </div>
      `) : ''}
      ${missing.length ? `<p class="kpi-missing">Add ${missing.map((f) => FIELD_LABEL[f] || f).join(', ')} to calculate this.</p>` : ''}
      ${!unavailable ? renderKpiTargetBlock(kpi, editable) : ''}
    </div>
  `;
}

const SOURCE_LABEL = { manual: 'manual entry', pdf: 'PDF extraction', xero: 'Xero sync' };

function renderFinancialSnapshotCard(snapshot) {
  if (!snapshot) return '';
