// 'lifestyle' was dropped (previously between income and exit_succession) —
// no code or docs ever distinguished it from 'personal', and it had zero
// real usage across actual client data while 'personal' had genuine,
// AI-suggested content. Any client with old 'lifestyle' items still has
// them in owner_goals; they just won't show under this category list
// anymore (same as any category a client has hidden).
//
// 'wealth' is concrete personal asset-building goals — "build a cash
// buffer", "buy an investment property", "pay down the mortgage" — same
// checklist-item shape as a Business goal, just aimed at the owner's
// personal balance sheet instead of the company's. Deliberately NOT the
// same thing as a net-worth target: that number-with-assumptions already
// lives in Owner Wealth → Input's Retirement Outlook, and re-asking for it
// here would just be a second, lower-fidelity copy of the same figure.
// 'personal' stays about life quality (holidays, health); 'wealth' is
// specifically about money/assets — a real split, unlike lifestyle/personal.
// Reuses the color freed up by removing 'lifestyle'.
const GOAL_CATEGORIES = [
  { key: 'personal', label: 'Personal', color: '#5C7A63' },
  { key: 'business', label: 'Business', color: '#9C7A3C' },
  { key: 'income', label: 'Income', color: '#8A9A6D' },
  { key: 'wealth', label: 'Wealth', color: '#C08A5E' },
  { key: 'exit_succession', label: 'Exit & Succession', color: '#9C4B3C' },
];

// Two more optional fields on exit_succession items, same shape as
// target_year — "who takes over" is a different, easy-to-miss question
// from "when": a client can have a perfectly good estate plan and no
// viable succession pathway at all, or a named successor who isn't
// actually ready yet. readiness is only meaningful once a real pathway is
// chosen (not "not yet identified"), same spirit as the estate checklist's
// Required/Conditional distinction — asking "is the family successor
// ready" when there's no successor at all wouldn't mean anything.
const SUCCESSION_PATHWAYS = [
  { value: '', label: 'Not set' },
  { value: 'family', label: 'Family' },
  { value: 'management', label: 'Existing management' },
  { value: 'partner', label: 'Business partner' },
  { value: 'external', label: 'External buyer' },
  { value: 'none', label: 'No identified successor' },
];
const SUCCESSION_READINESS = [
  { value: '', label: 'Not set' },
  { value: 'ready', label: 'Ready now' },
  { value: 'developing', label: 'Developing' },
  { value: 'not_ready', label: 'Not ready' },
];
function successionPathwayLabel(value) { return SUCCESSION_PATHWAYS.find((p) => p.value === value)?.label || value; }
function successionReadinessLabel(value) { return SUCCESSION_READINESS.find((r) => r.value === value)?.label || value; }

async function saveGoalItems(category, items) {
  const res = await fetch('/.netlify/functions/manual-entry', {
    method: 'POST',
    body: JSON.stringify({ type: 'goal_items', client_id: currentClientId, period_end: currentPeriodEnd, category, items }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.saved;
}

// Bridges Financial Performance (Analyse flags, Diagnose opportunities) into
// Goals — always the current period's "business" category, since that's the
// closest existing fit for a financial-flavoured commitment. Fetches fresh
// context rather than trusting any cached copy, since this can be called from
// screens that never loaded the client's goals in the first place.
async function addTextAsGoal(text, category = 'business') {
  const fresh = await callRead('get_context', currentClientId);
  const current = fresh?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.[category]?.items || [];
  const now = new Date().toISOString();
  const id = uid();
  const items = [...current, { id, text, created_at: now, updated_at: now, done: false }];
  await saveGoalItems(category, items);
  return { id, category };
}

// Tombstones one goal item without touching any of the category's other
// items — a plain overwrite with just the tombstone would wipe the rest of
// that period's saved list, since saveGoalItems replaces the whole array
// (same reasoning renderGoalsInput's own upsertGoalItem/moveGoalItem
// already document). Used for the brief "What to do" card's "undo" on a
// goal it just added, without needing the full Goals & Objectives screen
// mounted to do it.
async function tombstoneGoalItem(category, id) {
  const fresh = await callRead('get_context', currentClientId);
  const current = fresh?.owner_goals?.periods?.[currentPeriodEnd]?.cats?.[category]?.items || [];
  const updated = current.filter((it) => it.id !== id).concat([{ id, deleted: true }]);
  await saveGoalItems(category, updated);
}

// phase drives which Meeting Mode wizard step a question appears in
// (renderMeetingQuestionsStep) — 'open' = catching up on context before
// diving into the numbers, 'close' = forward-looking, naturally goal-shaped.
// Both phases get a "turn into goal" button on each answer — an opening
// answer ("anything big coming up?") can be just as goal-shaped as a
// closing one. Goals' own Check-in tab (renderGoalsInput) ignores phase
// entirely and always shows the full flat list — the split only matters
// inside the wizard.
const FIXED_QUESTIONS = [
  { id: 'anything_changed', prompt: 'Has anything changed since we last spoke?', phase: 'open' },
  { id: 'anything_big', prompt: 'Anything big coming up?', phase: 'open' },
  { id: 'win_next_12mo', prompt: 'What would make the next 12 months a win?', phase: 'close' },
  { id: 'worrying', prompt: "What's worrying you?", phase: 'close' },
];
const isCustomQuestion = (id) => !FIXED_QUESTIONS.some((q) => q.id === id);

function uid() { return 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// Goals are period-scoped. If the viewed period has no items yet for a category,
// items from the nearest PRIOR period (that aren't done and haven't already been
// addressed this period) surface as "carried forward" — pending confirmation, not
// yet saved against this period. Each item keeps a stable id across periods so
// confirming/editing one doesn't hide the others still pending.
function resolveGoalList(goals, periodEnd, categoryKey) {
  const periods = goals.periods || {};
  const currentRaw = periods[periodEnd]?.cats?.[categoryKey]?.items || [];
  const currentIds = new Set(currentRaw.map((it) => it.id));
  const currentItems = currentRaw.filter((it) => !it.deleted);

  const priorPeriods = Object.keys(periods).filter((p) => p < periodEnd).sort().reverse();
  let priorItems = [];
  let sourcePeriod = null;
  for (const p of priorPeriods) {
    const items = (periods[p]?.cats?.[categoryKey]?.items || []).filter((it) => !it.deleted);
    if (items.length) { priorItems = items; sourcePeriod = p; break; }
  }
  const pendingCarry = priorItems.filter((it) => !it.done && !currentIds.has(it.id));

  return [
    ...currentItems.map((it) => ({ ...it, carried: false })),
    ...pendingCarry.map((it) => ({ ...it, carried: true, sourcePeriod })),
  ];
}

function goalAge(createdAt) {
  if (!createdAt) return '';
  const days = Math.floor((Date.now() - new Date(createdAt).getTime()) / 86400000);
  if (days < 1) return 'Opened today';
  if (days < 14) return `Open ${days}d`;
  if (days < 60) return `Open ${Math.floor(days / 7)}w`;
  return `Open ${Math.floor(days / 30)}mo`;
}

// How many distinct periods this exact goal (by id) has been explicitly recorded
// in — i.e. actually confirmed/created that period, not just shown as carried
// forward. Text edits reset the id's created_at but keep the same id, so this
// still tracks "how many times has this same commitment been reconfirmed."
const STALE_AFTER_CONFIRMS = 4;
function confirmedPeriodCount(goals, categoryKey, itemId) {
  const periods = goals.periods || {};
  return Object.values(periods).filter((p) => (p.cats?.[categoryKey]?.items || []).some((it) => it.id === itemId && !it.deleted)).length;
}

// Strictly BEFORE periodEnd — this is "what did they say last time", used
// as reference context in Meeting Mode's question steps while answering
// THIS period's questions, not a lookup that could return this period's own
// still-in-progress answer.
function findPriorPulse(goals, periodEnd) {
  const periods = goals.periods || {};
  const keys = Object.keys(periods).filter((p) => p < periodEnd).sort().reverse();
  for (const p of keys) {
    if (periods[p]?.pulse) return { ...periods[p].pulse, periodEnd: p };
  }
  return null;
}

let showHiddenGoalCategories = false;
// Persists across re-renders (e.g. after saving a goal) so accepting one
// suggestion doesn't lose the others or force a fresh Claude call to see them
// again. Keyed by category. Cleared on explicit dismiss, a fresh "Suggest a
// goal" click, or switching client/period (since suggestions are grounded in
// a specific period's diagnosis).
let goalSuggestionsCache = {};

// Set by a click on a goal row inside the Meeting-mode brief (renderGoalsBrief)
// just before it flips to the full Goals & Objectives detail view — read once,
// by renderGoalsInput's very next render, to scroll straight to and flash that
// one goal's card instead of leaving the accountant to hunt for it themselves.
let pendingGoalJumpId = null;

// Meeting-mode Goals brief UI state — kept at module scope (not local to
// renderGoalsBrief) purely so "← Back to meeting" restores the same expanded
// tile/filter/scroll position instead of dumping the accountant back at a
// collapsed, unfiltered list after they've just clicked into one goal's card.
let goalsBriefExpandedTile = null; // 'open' | 'achieved' | 'flagged' | null
let goalsBriefCategoryFilter = 'all';
let goalsBriefScrollToId = null; // goal id to scroll to + flash on the brief's next render

function suggestPanelHtml(catKey) {
  const cache = goalSuggestionsCache[catKey];
  if (!cache) return '';
  // A used suggestion is already sitting right above as a real, saved goal —
  // leaving a duplicate "✓ added" line down here just repeats the same text
  // a second time for no reason, so it drops out of the list exactly like a
  // dismissed one does.
  const remaining = cache.suggestions.map((s, i) => ({ s, i }))
    .filter(({ i }) => !(cache.dismissedIdxs || []).includes(i) && !cache.usedIdxs.includes(i));
  if (!remaining.length) {
    return `<p class="muted plain" style="margin:0;">Nothing left from this batch. <button class="mini-link" data-suggest-cat="${catKey}">Get more suggestions</button></p>`;
  }
  return `
    <p class="suggest-caveat">Suggested, not benchmarked — grounded in this client's own numbers where possible, general knowledge otherwise.</p>
    ${remaining.map(({ s, i }) => `
      <div class="suggest-item">
        <p>${s}</p>
        <button class="mini-link" data-use-suggestion="${catKey}" data-suggest-idx="${i}">use this</button><button class="mini-link" data-dismiss-one-suggestion="${catKey}" data-suggest-idx="${i}">not now</button>
      </div>
    `).join('')}
    <button class="mini-link" data-dismiss-suggestions="${catKey}">Dismiss all</button>
  `;
}

async function renderGoalsInput(content) {
  const myToken = renderToken;
  currentCtx = await callRead('get_context', currentClientId);
  if (myToken !== renderToken) return;
  const ctx = currentCtx;
  const goals = ctx?.owner_goals || {};
  const extra = ctx?.profile_extra || {};

  if (!currentPeriodEnd) {
    content.innerHTML = renderObjectiveCard(extra) + `<div class="card placeholder"><p class="muted">No period yet</p><p class="muted plain" style="margin:0;">Goals are tracked per period, same as financial data — add a snapshot from Financial Performance → Input first, then come back here.</p></div>`;
    wireObjectiveCard(extra);
    return;
  }

  const hidden = goals.hidden_categories || [];
  const visibleBuiltIns = GOAL_CATEGORIES.filter((c) => !hidden.includes(c.key));
  const hiddenBuiltIns = GOAL_CATEGORIES.filter((c) => hidden.includes(c.key));
  const categories = [...visibleBuiltIns, ...(goals.custom_categories || [])];
  const isCustomCategory = (key) => !GOAL_CATEGORIES.some((c) => c.key === key);

  // Async so a save can upsert one item into the raw stored array (preserving any
  // tombstoned/deleted entries and every other id) without touching the rest.
  async function upsertGoalItem(catKey, item) {
    const current = (goals.periods?.[currentPeriodEnd]?.cats?.[catKey]?.items || []).filter((it) => it.id !== item.id);
    current.push(item);
    const saved = await saveGoalItems(catKey, current);
    goals.periods = goals.periods || {};
    goals.periods[currentPeriodEnd] = { ...(goals.periods[currentPeriodEnd] || {}), cats: { ...(goals.periods[currentPeriodEnd]?.cats || {}), [catKey]: saved } };
  }

  // Re-files a goal into a different category — adds it into the destination
  // as this period's own settled item (moving IS a decision, so it doesn't
  // need another review), then always tombstones it in the source rather
  // than just dropping it from this period's array. A plain drop only hides
  // it THIS period if it also happened to be this period's own saved copy —
  // if any older period still has a non-deleted copy under the same id
  // (e.g. it was created years ago and only intermittently re-confirmed),
  // resolveGoalList's carry-forward search reaches past the gap and
  // resurrects it right back into the source category immediately. A
  // tombstone (an {id, deleted:true} entry) keeps the id "present" in this
  // period's own array so that search never even looks further back.
  async function moveGoalItem(fromCat, toCat, item) {
    await upsertGoalItem(toCat, { ...item, carried: undefined, sourcePeriod: undefined, needs_review: undefined, updated_at: new Date().toISOString() });
    await upsertGoalItem(fromCat, { id: item.id, deleted: true });
  }

  content.innerHTML = `
    ${renderObjectiveCard(extra)}
    <div id="goal-cards"></div>
    ${hiddenBuiltIns.length ? `<button class="add-item-link" id="show-hidden-btn" type="button" style="margin-top:4px;">${showHiddenGoalCategories ? 'Hide' : 'Show'} ${hiddenBuiltIns.length} hidden goal categor${hiddenBuiltIns.length === 1 ? 'y' : 'ies'}</button><div id="hidden-goal-cards" style="margin-top:10px;"></div>` : ''}
  `;
  wireObjectiveCard(extra);

  // ---- Goal cards ----
  const cardsEl = document.getElementById('goal-cards');

  // Shared by the initial render and the post-confirm transient update
  // (see the 'confirm' action handler below) so the two can't drift apart.
  // "reconsider" is a pure client-side toggle back to the decision buttons —
  // it doesn't touch what's saved, so if someone reconsiders and then
  // navigates away without re-deciding, the existing confirmation just
  // stands untouched, same as opening (and abandoning) "edit" already does.
  function confirmedNoteHtml(catKey, id) {
    return `<p class="confirmed-note" id="goal-confirmed-note-${id}"><span class="confidence-badge green">✓ Reviewed this period</span> <button class="mini-link" data-action="changed" data-cat="${catKey}" data-id="${id}">edit</button><button class="mini-link" data-action="reconsider" data-cat="${catKey}" data-id="${id}">reconsider</button></p>`;
  }

  function renderItemBlock(cat, it) {
    // needs_review is a persisted "reconsider" flag — separate from `carried`
    // (which means "not yet saved into this period at all"). An item can be
    // fully this period's own saved data AND still be flagged for another
    // look, e.g. after someone clicks "reconsider" on an already-confirmed one.
    const needsReview = it.carried || it.needs_review;
    const stateClass = needsReview ? 'state-carried' : 'state-confirmed';
    const confirms = needsReview ? 0 : confirmedPeriodCount(goals, cat.key, it.id);
    const isStale = !needsReview && confirms >= STALE_AFTER_CONFIRMS;
    // Only exit_succession gets a target year — same "extra optional field
    // on a specific category's items" shape kpi_key/target already uses
    // for KPI-linked goals elsewhere, not a field every goal item carries.
    const isSuccession = cat.key === 'exit_succession';
    return `
      <div class="goal-item-block ${stateClass}" data-cat="${cat.key}" data-id="${it.id}" data-carried="${it.carried}">
        <p class="goal-text" id="goal-text-${it.id}">${it.text}</p>
        <div class="goal-meta-row">
          <span class="goal-updated" id="goal-updated-${it.id}">${it.carried ? 'From ' + it.sourcePeriod : (it.updated_at ? 'Confirmed ' + it.updated_at.slice(0, 10) : '')}</span>
          <span class="goal-age">${goalAge(it.created_at || it.updated_at)}</span>
          ${categories.length > 1 ? `
            <select class="move-goal-select" data-move-cat="${cat.key}" data-move-id="${it.id}" title="Move to a different goal category">
              <option value="" selected disabled>Move to…</option>
              ${categories.filter((c) => c.key !== cat.key).map((c) => `<option value="${c.key}">${c.label}</option>`).join('')}
            </select>
          ` : ''}
          <button class="mini-link" data-action="done" data-cat="${cat.key}" data-id="${it.id}" style="margin-left:auto;">done</button>
          <button class="item-remove-btn" data-remove-item="1" data-cat="${cat.key}" data-id="${it.id}" title="Delete this goal">×</button>
        </div>
        ${isSuccession && it.target_year ? `<p class="goal-updated" style="margin:2px 0 0;">Target exit year: ${it.target_year} (feeds Owner & Succession → Retirement outlook)</p>` : ''}
        ${isSuccession && it.succession_pathway ? `<p class="goal-updated" style="margin:2px 0 0;">Pathway: ${successionPathwayLabel(it.succession_pathway)}${it.succession_pathway !== 'none' && it.successor_readiness ? ` — ${successionReadinessLabel(it.successor_readiness)}` : ''}</p>` : ''}
        ${needsReview ? `<p class="carry-prompt">👀 Needs review — still true for ${formatShortDate(currentPeriodEnd)}?</p>` : ''}
        ${isStale ? `<p class="stale-flag">Confirmed unchanged for ${confirms} periods — still the right one?</p>` : ''}
        <div class="toggle-row" id="goal-toggle-${it.id}" style="${needsReview ? '' : 'display:none;'}">
          <button class="toggle-btn confirm" data-action="confirm" data-cat="${cat.key}" data-id="${it.id}">✓ Still true</button>
          <button class="toggle-btn changed" data-action="changed" data-cat="${cat.key}" data-id="${it.id}">Something's changed</button>
        </div>
        ${!needsReview ? confirmedNoteHtml(cat.key, it.id) : ''}
        <div class="goal-edit-box" id="goal-edit-${it.id}" style="display:none;">
          <textarea rows="3" id="goal-input-${it.id}">${it.text}</textarea>
          ${isSuccession ? `<div class="form-field" style="margin-top:6px;"><label>Target exit year (optional)</label><input type="number" id="goal-target-year-${it.id}" placeholder="e.g. ${new Date().getFullYear() + 5}" value="${it.target_year ?? ''}" /></div>` : ''}
          ${isSuccession ? `
            <div class="form-field" style="margin-top:6px;"><label>Succession pathway (optional)</label>
              <select id="goal-pathway-${it.id}">${SUCCESSION_PATHWAYS.map((p) => `<option value="${p.value}" ${((it.succession_pathway || '') === p.value) ? 'selected' : ''}>${p.label}</option>`).join('')}</select>
            </div>
            <div class="form-field" style="margin-top:6px;"><label>Successor readiness (optional)</label>
              <select id="goal-readiness-${it.id}">${SUCCESSION_READINESS.map((r) => `<option value="${r.value}" ${((it.successor_readiness || '') === r.value) ? 'selected' : ''}>${r.label}</option>`).join('')}</select>
            </div>
          ` : ''}
          <button class="action" style="margin-top:6px;" data-save="1" data-cat="${cat.key}" data-id="${it.id}">Save goal</button>
        </div>
      </div>
    `;
  }

  function renderAchievedBlock(cat, it) {
    return `
      <div class="goal-item-block achieved" data-cat="${cat.key}" data-id="${it.id}">
        <p class="goal-text achieved-text">${it.text}</p>
        <span class="goal-updated">${it.updated_at ? 'Achieved ' + it.updated_at.slice(0, 10) : ''}</span>
        <div class="toggle-row">
          <button class="toggle-btn" data-action="reopen" data-cat="${cat.key}" data-id="${it.id}">Reopen</button>
          <button class="item-remove-btn" data-remove-item="1" data-cat="${cat.key}" data-id="${it.id}" title="Delete this goal">×</button>
        </div>
      </div>
    `;
  }

  function renderCategoryCard(cat, isHidden) {
    const list = resolveGoalList(goals, currentPeriodEnd, cat.key);
    const activeItems = list.filter((it) => !it.done);
    const doneItems = list.filter((it) => it.done);
    const custom = isCustomCategory(cat.key);
    const card = document.createElement('div');
    card.className = 'card goal-card';
    card.id = `goal-card-${cat.key}`;
    card.style.setProperty('--cat-color', cat.color);
    const removeControl = isHidden
      ? `<button class="cat-remove-btn" data-restore-cat="${cat.key}" title="Show this goal category again">Restore</button>`
      : `<button class="cat-remove-btn" data-remove-cat="${cat.key}" data-custom="${custom}" title="${custom ? 'Delete this goal category' : 'Hide this goal category'}">${custom ? 'Remove' : 'Hide'}</button>`;
    card.innerHTML = `
      <div class="goal-card-header">
        <p class="goal-cat-label">${cat.label}</p>
        ${removeControl}
      </div>
      <div class="goal-items" id="goal-items-${cat.key}">
        ${activeItems.length ? activeItems.map((it) => renderItemBlock(cat, it)).join('') : '<p class="goal-text empty">No active goals.</p>'}
      </div>
      ${doneItems.length ? `<details class="achieved-details"><summary>Achieved (${doneItems.length})</summary>${doneItems.map((it) => renderAchievedBlock(cat, it)).join('')}</details>` : ''}
      <div class="goal-card-links">
        <button class="add-item-link" data-add-item-cat="${cat.key}" type="button">${activeItems.length ? '+ Add another goal' : '+ Add goal'}</button>
        <button class="add-item-link suggest-link" data-suggest-cat="${cat.key}" type="button">✨ Suggest a goal</button>
      </div>
      <div class="suggest-panel" id="suggest-panel-${cat.key}" style="${goalSuggestionsCache[cat.key] ? '' : 'display:none;'}">${suggestPanelHtml(cat.key)}</div>
      <div class="goal-edit-box" id="goal-new-${cat.key}" style="display:none;">
        <textarea rows="3" id="goal-new-input-${cat.key}" placeholder="What's the goal here?"></textarea>
        ${cat.key === 'exit_succession' ? `
          <div class="form-field" style="margin-top:6px;"><label>Target exit year (optional)</label><input type="number" id="goal-new-target-year-${cat.key}" placeholder="e.g. ${new Date().getFullYear() + 5}" /></div>
          <div class="form-field" style="margin-top:6px;"><label>Succession pathway (optional)</label>
            <select id="goal-new-pathway-${cat.key}">${SUCCESSION_PATHWAYS.map((p) => `<option value="${p.value}">${p.label}</option>`).join('')}</select>
          </div>
          <div class="form-field" style="margin-top:6px;"><label>Successor readiness (optional)</label>
            <select id="goal-new-readiness-${cat.key}">${SUCCESSION_READINESS.map((r) => `<option value="${r.value}">${r.label}</option>`).join('')}</select>
          </div>
        ` : ''}
        <button class="action" style="margin-top:6px;" data-save-new="${cat.key}">Save goal</button>
      </div>
    `;
    return card;
  }

  categories.forEach((cat) => cardsEl.appendChild(renderCategoryCard(cat, false)));

  // "+ Add another goal category" tile at the end of the grid
  const addCard = document.createElement('div');
  addCard.className = 'card goal-card add-goal-card';
  addCard.id = 'add-goal-card';
  addCard.innerHTML = `
    <p class="muted plain add-goal-prompt" id="add-goal-prompt" style="margin:0;">+ Add another goal category</p>
    <div id="add-goal-form" style="display:none; margin-top:10px;">
      <input type="text" id="add-goal-label" placeholder="e.g. Property, Health, Team culture" />
      <button class="action" id="add-goal-confirm" style="margin-top:8px;">Add</button>
    </div>
  `;
  cardsEl.appendChild(addCard);

  if (hiddenBuiltIns.length && showHiddenGoalCategories) {
    const hiddenEl = document.getElementById('hidden-goal-cards');
    hiddenEl.className = 'goal-cards-grid';
    hiddenBuiltIns.forEach((cat) => hiddenEl.appendChild(renderCategoryCard(cat, true)));
  }
  const showHiddenBtn = document.getElementById('show-hidden-btn');
  if (showHiddenBtn) showHiddenBtn.onclick = () => { showHiddenGoalCategories = !showHiddenGoalCategories; renderGoalsInput(content); };

  document.getElementById('add-goal-prompt').onclick = () => {
    document.getElementById('add-goal-prompt').style.display = 'none';
    document.getElementById('add-goal-form').style.display = 'block';
    document.getElementById('add-goal-label').focus();
  };
  document.getElementById('add-goal-confirm').onclick = async () => {
    const label = document.getElementById('add-goal-label').value.trim();
    if (!label) return;
    const res = await fetch('/.netlify/functions/manual-entry', {
      method: 'POST',
      body: JSON.stringify({ type: 'goal_category', client_id: currentClientId, label }),
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    renderGoalsInput(content);
  };

  async function handleGoalCardClick(e) {
    const removeCatBtn = e.target.closest('button[data-remove-cat]');
    if (removeCatBtn) {
      const isCustom = removeCatBtn.dataset.custom === 'true';
      const label = removeCatBtn.closest('.goal-card').querySelector('.goal-cat-label').textContent;
      const msg = isCustom ? `Remove the "${label}" goal category? This deletes any goals recorded under it.` : `Hide the "${label}" goal category? You can bring it back later.`;
      if (!confirm(msg)) return;
      await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'delete_goal_category', client_id: currentClientId, key: removeCatBtn.dataset.removeCat }),
      });
      renderGoalsInput(content);
      return;
    }

    const restoreCatBtn = e.target.closest('button[data-restore-cat]');
    if (restoreCatBtn) {
      await fetch('/.netlify/functions/manual-entry', {
        method: 'POST',
        body: JSON.stringify({ type: 'restore_goal_category', client_id: currentClientId, key: restoreCatBtn.dataset.restoreCat }),
      });
      renderGoalsInput(content);
      return;
    }

    const removeItemBtn = e.target.closest('button[data-remove-item]');
    if (removeItemBtn) {
      const catKey = removeItemBtn.dataset.cat;
      const id = removeItemBtn.dataset.id;
      if (!confirm('Delete this goal?')) return;
      // Always a tombstone, even for an item that already belongs to this
      // period — a plain drop only hides it from THIS period's own saved
      // array. If the same id also has a non-deleted copy in some older
      // period (created years ago, only intermittently re-confirmed since),
      // resolveGoalList's carry-forward search reaches past the gap and
      // resurrects it immediately, in this very period. A tombstone keeps
      // the id "present" here so that search never looks further back.
      await upsertGoalItem(catKey, { id, deleted: true });
      renderGoalsInput(content);
      return;
    }

    const addItemBtn = e.target.closest('button[data-add-item-cat]');
    if (addItemBtn) {
      const cat = addItemBtn.dataset.addItemCat;
      addItemBtn.style.display = 'none';
      const box = document.getElementById(`goal-new-${cat}`);
      box.style.display = 'block';
      document.getElementById(`goal-new-input-${cat}`).focus();
      return;
    }

    const suggestBtn = e.target.closest('button[data-suggest-cat]');
    if (suggestBtn) {
      const catKey = suggestBtn.dataset.suggestCat;
      const cat = categories.find((c) => c.key === catKey) || (goals.custom_categories || []).find((c) => c.key === catKey);
      const panel = document.getElementById(`suggest-panel-${catKey}`);
      panel.style.display = 'block';
      panel.innerHTML = '<p class="muted plain" style="margin:0;">Thinking…</p>';
      suggestBtn.disabled = true;
      try {
        const res = await fetch('/.netlify/functions/suggest-goal', {
          method: 'POST',
          body: JSON.stringify({ client_id: currentClientId, period_end: currentPeriodEnd, category: catKey, category_label: cat?.label }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        if (!data.suggestions?.length) {
          delete goalSuggestionsCache[catKey];
          panel.innerHTML = '<p class="muted plain" style="margin:0;">No suggestions came back — try again, or add one manually.</p>';
        } else {
          goalSuggestionsCache[catKey] = { suggestions: data.suggestions, usedIdxs: [], dismissedIdxs: [] };
          panel.innerHTML = suggestPanelHtml(catKey);
        }
      } catch (err) {
        panel.innerHTML = `<p class="muted plain" style="margin:0;">Error: ${err.message}</p>`;
      } finally {
        suggestBtn.disabled = false;
      }
      return;
    }

    const useSuggestionBtn = e.target.closest('button[data-use-suggestion]');
    if (useSuggestionBtn) {
      const catKey = useSuggestionBtn.dataset.useSuggestion;
      const idx = Number(useSuggestionBtn.dataset.suggestIdx);
      const cache = goalSuggestionsCache[catKey];
      const text = cache?.suggestions[idx] || '';
      if (!text) return;
      useSuggestionBtn.disabled = true;
      useSuggestionBtn.textContent = 'adding…';
      // One click, actually saved — this used to just drop the text into the
      // "add a goal" textbox, leaving a second click (Save goal) to actually
      // create it. Mark used and keep the panel open either way, so the
      // other suggestions in the same batch are still right there to use.
      const now = new Date().toISOString();
      await upsertGoalItem(catKey, { id: uid(), text, created_at: now, updated_at: now, done: false });
      if (cache && !cache.usedIdxs.includes(idx)) cache.usedIdxs.push(idx);
      renderGoalsInput(content);
      return;
    }

    const dismissOneBtn = e.target.closest('button[data-dismiss-one-suggestion]');
    if (dismissOneBtn) {
      const catKey = dismissOneBtn.dataset.dismissOneSuggestion;
      const idx = Number(dismissOneBtn.dataset.suggestIdx);
      const cache = goalSuggestionsCache[catKey];
      if (cache) {
        cache.dismissedIdxs = cache.dismissedIdxs || [];
        if (!cache.dismissedIdxs.includes(idx)) cache.dismissedIdxs.push(idx);
      }
      document.getElementById(`suggest-panel-${catKey}`).innerHTML = suggestPanelHtml(catKey);
      return;
    }

    const dismissSuggestBtn = e.target.closest('button[data-dismiss-suggestions]');
    if (dismissSuggestBtn) {
      const catKey = dismissSuggestBtn.dataset.dismissSuggestions;
      delete goalSuggestionsCache[catKey];
      document.getElementById(`suggest-panel-${catKey}`).style.display = 'none';
      return;
    }

    const saveNewBtn = e.target.closest('button[data-save-new]');
    if (saveNewBtn) {
      const catKey = saveNewBtn.dataset.saveNew;
      const text = document.getElementById(`goal-new-input-${catKey}`).value.trim();
      if (!text) return;
      const now = new Date().toISOString();
      const newTargetYearInput = document.getElementById(`goal-new-target-year-${catKey}`);
      const target_year = newTargetYearInput?.value ? Number(newTargetYearInput.value) : undefined;
      const newPathwayInput = document.getElementById(`goal-new-pathway-${catKey}`);
      const succession_pathway = newPathwayInput?.value || undefined;
      const newReadinessInput = document.getElementById(`goal-new-readiness-${catKey}`);
      const successor_readiness = newReadinessInput?.value || undefined;
      await upsertGoalItem(catKey, { id: uid(), text, created_at: now, updated_at: now, done: false, target_year, succession_pathway, successor_readiness });
      renderGoalsInput(content);
      return;
    }

    const toggleBtn = e.target.closest('button[data-action]');
    if (toggleBtn) {
      const catKey = toggleBtn.dataset.cat;
      const id = toggleBtn.dataset.id;
      const action = toggleBtn.dataset.action;
      const block = toggleBtn.closest('.goal-item-block');
      const source = resolveGoalList(goals, currentPeriodEnd, catKey).find((it) => it.id === id) || {};

      if (action === 'changed') {
        document.getElementById(`goal-toggle-${id}`).style.display = 'none';
        document.getElementById(`goal-edit-${id}`).style.display = 'block';
        document.getElementById(`goal-input-${id}`).focus();
        return;
      }

      // "reconsider" — flips a persisted needs_review flag rather than just
      // toggling the DOM, so the "needs another look" state actually
      // survives navigating away and back (a DOM-only toggle didn't:
      // reopening this page just re-rendered from the saved, still-confirmed
      // data). The item IS still this period's own saved data either way —
      // needs_review just marks it as "look at this again", separate from
      // `carried` (not-yet-saved-this-period at all).
      if (action === 'reconsider') {
        await upsertGoalItem(catKey, { ...source, needs_review: true });
        renderGoalsInput(content);
        return;
      }

      if (action === 'done') {
        await upsertGoalItem(catKey, { ...source, carried: undefined, sourcePeriod: undefined, needs_review: undefined, done: true, updated_at: new Date().toISOString() });
        renderGoalsInput(content);
        return;
      }

      if (action === 'reopen') {
        await upsertGoalItem(catKey, { ...source, carried: undefined, sourcePeriod: undefined, needs_review: undefined, done: false, updated_at: new Date().toISOString() });
        renderGoalsInput(content);
        return;
      }

      // "Still true" — confirms into the current period (whether it already lived
      // here or is being carried forward for the first time), same text, fresh date.
      const originalLabel = toggleBtn.textContent;
      toggleBtn.disabled = true;
      try {
        const now = new Date().toISOString();
        await upsertGoalItem(catKey, { ...source, carried: undefined, sourcePeriod: undefined, needs_review: undefined, updated_at: now });
        const updatedBadge = document.getElementById(`goal-updated-${id}`);
        updatedBadge.textContent = 'Confirmed ' + now.slice(0, 10);
        updatedBadge.classList.add('just-updated');
        setTimeout(() => updatedBadge.classList.remove('just-updated'), 900);
        if (block) { block.classList.remove('state-carried'); block.classList.add('state-confirmed'); }
        const carryPrompt = block?.querySelector('.carry-prompt');
        if (carryPrompt) carryPrompt.remove();
        toggleBtn.textContent = '✓ Confirmed!';
        toggleBtn.classList.add('just-confirmed');
        // After the flash, settle into the same quiet "reviewed" state a
        // freshly-rendered confirmed item gets — not back to the same two
        // buttons, which would make an item that's DONE look identical to
        // one still awaiting a decision. The confirmed-note element doesn't
        // exist yet (this item rendered as carried, so that branch of the
        // template was skipped) — insert it now rather than a full re-render.
        setTimeout(() => {
          toggleBtn.textContent = originalLabel;
          toggleBtn.classList.remove('just-confirmed');
          const toggleRow = document.getElementById(`goal-toggle-${id}`);
          if (toggleRow) {
            toggleRow.style.display = 'none';
            if (!document.getElementById(`goal-confirmed-note-${id}`)) {
              toggleRow.insertAdjacentHTML('afterend', confirmedNoteHtml(catKey, id));
            }
          }
        }, 2000);
      } finally {
        toggleBtn.disabled = false;
      }
      return;
    }

    const saveBtn = e.target.closest('button[data-save]');
    if (saveBtn) {
      const catKey = saveBtn.dataset.cat;
      const id = saveBtn.dataset.id;
      const newText = document.getElementById(`goal-input-${id}`).value;
      const source = resolveGoalList(goals, currentPeriodEnd, catKey).find((it) => it.id === id) || {};
      const now = new Date().toISOString();
      const targetYearInput = document.getElementById(`goal-target-year-${id}`);
      const target_year = targetYearInput?.value ? Number(targetYearInput.value) : undefined;
      const pathwayInput = document.getElementById(`goal-pathway-${id}`);
      const succession_pathway = pathwayInput?.value || undefined;
      const readinessInput = document.getElementById(`goal-readiness-${id}`);
      const successor_readiness = readinessInput?.value || undefined;
      try {
        // A materially different goal resets its "open since" clock.
        await upsertGoalItem(catKey, { ...source, carried: undefined, sourcePeriod: undefined, needs_review: undefined, text: newText, created_at: now, updated_at: now, target_year, succession_pathway, successor_readiness });
        renderGoalsInput(content);
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  }

  cardsEl.addEventListener('click', handleGoalCardClick);
  const hiddenCardsEl = document.getElementById('hidden-goal-cards');
  if (hiddenCardsEl) hiddenCardsEl.addEventListener('click', handleGoalCardClick);

  async function handleMoveGoalChange(e) {
    const sel = e.target.closest('select[data-move-id]');
    if (!sel) return;
    const toCat = sel.value;
    if (!toCat) return;
    const fromCat = sel.dataset.moveCat;
    const id = sel.dataset.moveId;
    const item = resolveGoalList(goals, currentPeriodEnd, fromCat).find((it) => it.id === id);
    sel.disabled = true;
    if (item) await moveGoalItem(fromCat, toCat, item);
    renderGoalsInput(content);
  }
  cardsEl.addEventListener('change', handleMoveGoalChange);
  if (hiddenCardsEl) hiddenCardsEl.addEventListener('change', handleMoveGoalChange);

  // Land straight on the goal a Meeting-mode brief row was clicked for (see
  // pendingGoalJumpId) instead of the accountant having to scan every card
  // to find it again.
  if (pendingGoalJumpId) {
    const jumpId = pendingGoalJumpId;
    pendingGoalJumpId = null;
    const block = document.querySelector(`.goal-item-block[data-id="${jumpId}"]`);
    if (block) {
      block.scrollIntoView({ behavior: 'smooth', block: 'center' });
      block.classList.add('kpi-card-flash');
      setTimeout(() => block.classList.remove('kpi-card-flash'), 1600);
    }
  }
}

// ---- Meeting Mode (global, cross-domain) ----
function meetingKey() { return `oag_meeting_${currentClientId}_${currentPeriodEnd}`; }
// localStorage is a fast local cache, not the source of truth — every read
// that can afford to stay synchronous still reads it directly. Supabase
// (client_context.meeting_records) is what actually persists a meeting: it's
// what resuming falls back to on a different device or after a cleared
// cache, and what makes a finished meeting's Report-tab summary durable
// rather than one cache-clear away from gone.
function loadMeeting() { try { return JSON.parse(localStorage.getItem(meetingKey())); } catch { return null; } }
// The localStorage write is synchronous and cheap, so it happens on every
// call with no debounce — anything that reads loadMeeting() right after
// (e.g. clicking a different meeting pill mid-typing, see renderMeetingSession's
// per-keystroke autosave) always sees the latest state, never a stale copy
// waiting on a delayed write. Only the server echo below is debounced —
// that one's just a best-effort durable backup (see loadMeetingWithFallback),
// so losing up to 600ms of freshness on IT is fine, but doing the same to
// localStorage would reopen the exact data-loss window this was added to close.
let meetingServerSyncTimer = null;
function saveMeeting(brief) {
  localStorage.setItem(meetingKey(), JSON.stringify(brief));
  clearTimeout(meetingServerSyncTimer);
  meetingServerSyncTimer = setTimeout(() => {
    fetch('/.netlify/functions/manual-entry', {
      method: 'POST',
      body: JSON.stringify({ type: 'save_meeting_record', client_id: currentClientId, period_end: currentPeriodEnd, record: brief }),
    }).catch((err) => console.error('Failed to save meeting record to server:', err.message));
  }, 600);
}
function clearMeeting() {
  localStorage.removeItem(meetingKey());
  fetch('/.netlify/functions/manual-entry', {
    method: 'POST',
    body: JSON.stringify({ type: 'save_meeting_record', client_id: currentClientId, period_end: currentPeriodEnd, record: null }),
  }).catch((err) => console.error('Failed to clear meeting record on server:', err.message));
}
// The cross-device/cleared-cache recovery path — only hits the network when
// there's genuinely nothing local to read. Hydrates the local cache from
// whatever it finds so subsequent reads in the same session stay synchronous.
async function loadMeetingWithFallback() {
  const local = loadMeeting();
  if (local) return local;
  try {
    const ctx = await callRead('get_context', currentClientId);
    const record = ctx?.meeting_records?.[currentPeriodEnd];
    if (record) {
      localStorage.setItem(meetingKey(), JSON.stringify(record));
      return record;
    }
  } catch (err) {
    console.error('Failed to fetch meeting record from server:', err.message);
  }
  return null;
}

// A risk_items row, reshaped into the same {pillar, message, severity}
// shape flags already have, so scoreFlag() and the rest of Meeting Mode
// can treat both as one candidate pool without knowing the difference.
// 'risk' (not a specific pillar) for business/industry — there's no
// finer-grained pillar those sources map to; owner_wealth already has a
// real pillar of its own.
// Owner & Succession risk_items don't carry their own .recommendation
// column (unlike business/industry — see below), but for estate and exit
// readiness gaps specifically, the exact same "why/what to do" copy
// already written for their own cards (OWNER_ESTATE_CHECKLIST_ITEMS,
// OWNER_EXIT_READINESS_ITEMS) is a free match by risk_name — no new
// writing, just reuse. Succession readiness/pathway rows have no matching
// entry here, but their own .detail message is already a concrete
// instruction (e.g. "no valuation ever saved"), so there's nothing lost.
function ownerWealthTalkingPoint(riskName) {
  const estateItem = OWNER_ESTATE_CHECKLIST_ITEMS.find((it) => it.label === riskName);
  if (estateItem) return estateItem.why;
  const exitItem = OWNER_EXIT_READINESS_ITEMS.find((it) => it.label === riskName);
  if (exitItem) return exitItem.why;
  return null;
}

// talkingPoint answers "how do I actually raise this with the client" —
// distinct from message, which is written for the accountant's own
// screen. business/industry risk_items already carry a real
// .recommendation (AI-generated at answer/detection time, see
// business-risk-questionnaire.js and industry-risk-checklist.js); plain
// financial flags carry neither, so their priorities just show the raw
// message — acceptable since those numbers are already sitting in full
// context on the KPI cards moments before the meeting.
// Which pillar a KPI's own category maps to, for a bad-verdict candidate's
// PILLAR_META display (name/color on the priority card) and "Show detail"
// jump target — all three of these categories are the ones scorePillar's
// cash_flow band actually draws from (current_ratio) or are otherwise
// cash-movement-flavoured (working capital, the cash group itself), so
// they collapse to the one pillar rather than needing their own.
const KPI_CATEGORY_TO_PILLAR = {
  profitability: 'profitability', working_capital: 'cash_flow', balance_sheet: 'cash_flow',
  cash: 'cash_flow', tax: 'tax',
};

// A KPI the AI (or a client-set target) marked "bad" — a broader, softer
// signal than a flag, which only fires on a few specific hardcoded
// conditions (a sharp margin drop, debtor days blowing out, etc). This is
// what lets a metric that's just chronically underperforming — not
// necessarily worsening THIS period — still surface as something to
// actually decide on, not just a badge sitting quietly on its card.
function normalizeBadKpiToFlagShape(kpi) {
  return {
    pillar: KPI_CATEGORY_TO_PILLAR[kpi.category] || 'profitability',
    source: 'kpi_verdict',
    risk_category: kpi.name, // for the "already actioned" name-match in renderMeetingPrioritiesBuild
    severity: 'High',
    message: `${kpi.name}: ${kpi.interpretation || `${formatKpi(kpi.value, kpi.format)} — needs attention.`}`,
    talkingPoint: kpi.improvement_tip || null,
  };
}

// Growth ideas (data.opportunities — AI-generated, see analyze-background.js
// point 3) were previously invisible to "This period's priorities": that
// step scores buildMeetingCandidates()'s pool by Impact×Urgency×Ease, and
// opportunities were never in that pool at all — only risk_items and bad
// KPIs were. That meant Priorities could claim to score "every flagged
// issue this period" while structurally being unable to ever pick a growth
// idea as the top priority, even when raising it was genuinely the most
// valuable thing to do this period. Opportunities carry no numeric impact/
// urgency/ease of their own (title/impact/difficulty/timeframe are all free
// text from the AI) — ease is the one dimension with a real signal
// (difficulty), so it's the one FLAG_SCORING_RULES varies by; impact/
// urgency are flat and deliberately modest (an optional upside, not a
// problem) so a real active risk still generally outranks an opportunity
// unless the opportunity is genuinely low-effort.
function normalizeOpportunityToFlagShape(o) {
  return {
    pillar: 'growth',
    source: 'growth_opportunity',
    difficulty: o.difficulty || null,
    risk_category: o.title,
    message: o.impact ? `${o.title}: ${o.impact}` : o.title,
    talkingPoint: o.decision || o.takes || null,
  };
}

// data.getBetter and data.taxPlanning (analyze-background.js points 2/4) —
// same AI call, same table (recommendations, type='get_better'/'tax_planning'),
// same title/impact/difficulty/timeframe shape as opportunities, but until
// now neither ever reached buildMeetingCandidates(): they existed only on
// the standalone Financial Performance → Diagnose screen, outside Meeting
// Mode entirely, so a "get better" fix for a current gap — arguably more
// meeting-worthy than a growth idea, since it's fixing something already
// wrong rather than proposing new upside — could never win a Priorities
// slot or even be raised in the Financial brief. No takes/risk/decision on
// either (that's opportunities-only, see §5) so talkingPoint is null;
// pillar is a fixed guess (profitability/tax) since the AI doesn't return
// one per item.
function normalizeGetBetterToFlagShape(o) {
  return {
    pillar: 'profitability',
    source: 'get_better',
    difficulty: o.difficulty || null,
    risk_category: o.title,
    message: o.impact ? `${o.title}: ${o.impact}` : o.title,
    talkingPoint: null,
  };
}
function normalizeTaxPlanningToFlagShape(o) {
  return {
    pillar: 'tax',
    source: 'tax_planning',
    difficulty: o.difficulty || null,
    risk_category: o.title,
    message: o.impact ? `${o.title}: ${o.impact}` : o.title,
    talkingPoint: null,
  };
}

// Mirrors runFlags()'s own pillar assignment (analyze.js) for financial-
// sourced risk_items — risk_items itself doesn't store pillar (only
// category, a different business-style grouping used for Risk's own
// display), so this maps risk_name back to the same pillar runFlags()
// gave it at creation. Kept in sync by eye, same "per-file independence"
// convention financial-risk-sync.js's own mapCategoryFromRiskName uses.
// Note 'Trading risk' maps to 'growth', not a financial pillar — a
// revenue drop reads as a growth-domain issue even though it's detected
// from financial-snapshot data.
const FINANCIAL_RISK_NAME_TO_PILLAR = {
  'Cash-flow risk': 'cash_flow', 'Pricing/cost pressure': 'profitability',
  'Leverage risk': 'cash_flow', 'Liquidity risk': 'cash_flow',
  'Trading risk': 'growth', 'Cost structure pressure': 'profitability',
  'Debt servicing risk': 'cash_flow', 'Stock/cash risk': 'cash_flow',
  'Tax rate shift': 'tax', 'Tax affordability risk': 'tax',
};

// Static fallback "how to actually raise this" for financial-sourced risk
// items — unlike business/industry risk items (which get a real AI-
// generated .recommendation at answer/detection time, see
// business-risk-questionnaire.js/industry-risk-checklist.js), financial-
// risk-sync.js never writes a .recommendation at all, so every financial
// flag's talkingPoint was silently null and "What to do" only ever showed
// the bare fact/message, never guidance. Same "small closed set, static
// lookup" reasoning as ownerWealthTalkingPoint below — these are exactly
// the 9 risk_category values runFlags() (analyze-background.js) ever
// produces, not an open-ended set.
const FINANCIAL_RISK_TALKING_POINT = {
  'Cash-flow risk': 'Walk through the cash conversion cycle with the client — where is cash actually getting stuck (debtors, stock, or payment timing)?',
  'Pricing/cost pressure': 'Review pricing against current costs — check labour rates, material costs, and job-level margins for underquoting or waste.',
  'Leverage risk': "Discuss whether the extra debt funded something that'll pay for itself, and whether repayments still fit comfortably in cash flow.",
  'Liquidity risk': "Check what's driving the squeeze — collections, stock levels, or repayments — and agree a plan to rebuild the cash buffer.",
  'Trading risk': "Understand what's behind the revenue drop — lost customers, seasonality, pricing — before assuming it's a one-off.",
  'Cost structure pressure': 'Review staffing levels and pay rates against current revenue — is this a temporary blip or a structural cost creep?',
  'Debt servicing risk': 'Confirm the business can comfortably cover the higher interest cost, and whether refinancing or paying down debt is worth exploring.',
  'Stock/cash risk': "Review slow-moving or excess stock — it's tying up cash that could otherwise fund the business.",
  'Tax rate shift': 'Walk through what drove the rate change — structure, one-off items, or a genuine shift — and whether it changes how you plan.',
  'Tax affordability risk': 'Confirm funds are set aside for the tax bill, or discuss a payment plan before it falls due.',
};

function normalizeRiskItemToFlagShape(r) {
  const pillar = r.source === 'owner_wealth' ? 'owner_wealth'
    : r.source === 'financial' ? (FINANCIAL_RISK_NAME_TO_PILLAR[r.risk_name] || 'risk')
    : 'risk';
  return {
    pillar,
    source: r.source,
    // risk_category, not just message — FLAG_SCORING_RULES' two
    // risk_category-keyed rules (Tax affordability/rate shift) need this
    // to still match now that financial candidates arrive via risk_items
    // instead of the raw `flags` table; risk_name IS the same value
    // financial-risk-sync.js originally read it from (flag.risk_category).
    risk_category: r.risk_name,
    message: r.detail ? `${r.risk_name}: ${r.detail}` : r.risk_name,
    severity: r.severity,
    status: r.status, // read by scoreFlag's status-aware urgency — see its own comment
    talkingPoint: r.source === 'owner_wealth' ? ownerWealthTalkingPoint(r.risk_name)
      : r.source === 'financial' ? (r.recommendation || FINANCIAL_RISK_TALKING_POINT[r.risk_name] || null)
      : (r.recommendation || null),
  };
}

// Every ACTIVE risk_items source — financial, business, industry,
// owner_wealth — so a meeting priority can come from any of them.
// Financial now reads from risk_items (not the raw `flags` table) since
// financial-risk-sync.js made it persistent and status-aware the same way
// business/industry/owner_wealth already were — Confirm/Investigate/etc.
// on a Financial item genuinely changes its Meeting priority score now
// (see scoreFlag's status-aware urgency), which reading from `flags`
// (no status field at all) could never do. get_overview isn't fetched
// here anymore — its only use in this function was `.flags`.
async function buildMeetingCandidates() {
  const [riskData, kpiData, diagnosisData] = await Promise.all([
    callRead('get_risk_items', currentClientId, currentPeriodEnd),
    callRead('get_kpi_report', currentClientId, currentPeriodEnd),
    callRead('get_diagnosis', currentClientId, currentPeriodEnd),
  ]);
  const financialCandidates = (riskData?.financial || [])
    .filter((r) => RISK_ACTIVE_STATUSES.has(r.status))
    .map(normalizeRiskItemToFlagShape);
  const businessLatest = dedupeBusinessToLatestPerCategory(riskData?.business || []);
  const riskCandidates = [...businessLatest, ...(riskData?.industry || []), ...(riskData?.owner_wealth || [])]
    .filter((r) => RISK_ACTIVE_STATUSES.has(r.status))
    .map(normalizeRiskItemToFlagShape);
  // Skipped when an existing financial candidate's own trigger condition
  // (see FLAG_KPI_HINTS) is already about the same KPI — a genuine "gross
  // margin dropped" candidate and a "GP margin: needs attention" one would
  // otherwise both compete for a Top 3 slot saying almost the same thing
  // two different ways, under different wording a simple text match
  // wouldn't catch ("gross margin" vs this KPI's own name "GP margin").
  const flaggedKpiKeys = new Set(
    financialCandidates.flatMap((f) => FLAG_KPI_HINTS.filter((h) => h.test.test(f.message || '')).map((h) => h.kpiKey))
  );
  const kpiCandidates = (kpiData?.kpis || [])
    .filter((k) => effectiveKpiVerdict(k)?.key === 'bad' && !flaggedKpiKeys.has(k.key))
    .map(normalizeBadKpiToFlagShape);
  const opportunityCandidates = (diagnosisData?.opportunities || []).map(normalizeOpportunityToFlagShape);
  const getBetterCandidates = (diagnosisData?.getBetter || []).map(normalizeGetBetterToFlagShape);
  const taxPlanningCandidates = (diagnosisData?.taxPlanning || []).map(normalizeTaxPlanningToFlagShape);
  return [...financialCandidates, ...riskCandidates, ...kpiCandidates, ...opportunityCandidates, ...getBetterCandidates, ...taxPlanningCandidates];
}

// The top-3 scored ranking, computed once per client/period and cached here
// rather than recomputed by every reader — Overview's "Today's priorities"
// preview, the Meeting pill badges, and the Priorities step's own build
// button all call this same function, so a given period's ranking can never
// drift between the three places it shows up (see
// meeting-intelligence-build-spec.md §6). Cache key is just client+period —
// deliberately NOT attached to the meeting brief, since Overview needs this
// even when no meeting is in progress.
let candidateRankingCache = null;
let candidateRankingCacheKey = null;
async function getCandidateRanking() {
  const key = `${currentClientId}:${currentPeriodEnd}`;
  if (candidateRankingCache && candidateRankingCacheKey === key) return candidateRankingCache;
  const candidates = await buildMeetingCandidates();
  const scored = candidates
    .map((f) => ({ ...f, ...scoreFlag(f) }))
    .sort((a, b) => b.priorityScore - a.priorityScore)
    .slice(0, 3);
  candidateRankingCache = scored;
  candidateRankingCacheKey = key;
  return scored;
}

// Same scoring as getCandidateRanking, but each domain's own top 3 rather
// than whatever fraction of the shared business-wide top 3 happens to fall
// in this domain. A domain with plenty going on (Risk, say, with a dozen
// active items) otherwise only ever showed however many of the OVERALL top
// 3 happened to be its own — 0, 1, 2, or 3 depending purely on how the
// other domains scored that period, not on how much this domain actually
// has going on. This is a separate ranking from "This period's priorities"
// (still getCandidateRanking, still the one locked in and pushed to
// Actions) — a domain brief's "What to do" is a preview of that domain
// specifically, not a second copy of the same walkthrough.
let domainRankingCache = {};
let domainRankingCacheKey = null;
async function getDomainCandidateRanking(domainKey) {
  const key = `${currentClientId}:${currentPeriodEnd}`;
  if (domainRankingCacheKey !== key) { domainRankingCache = {}; domainRankingCacheKey = key; }
  if (domainRankingCache[domainKey]) return domainRankingCache[domainKey];
  const candidates = await buildMeetingCandidates();
  // Sources a domain's own brief already shows in full, with their own
  // recommendation/talking-point and actions, get excluded from THIS
  // domain's "What to do" — showing them again there would be the same
  // list twice under different headings (Growth's "Live opportunities",
  // Financial's "Get better"/"Tax planning" — see renderGrowthBrief/
  // renderFinancialBrief). Still fully eligible everywhere this function
  // ISN'T used — getCandidateRanking's global top-3 (Priorities/Overview)
  // sees the full, unfiltered candidate pool regardless of domain.
  const DOMAIN_OWN_SOURCES = { growth: ['growth_opportunity'], financial: ['get_better', 'tax_planning'] };
  const scored = candidates
    .filter((c) => PILLAR_TO_DOMAIN[c.pillar] === domainKey)
    .filter((c) => !(DOMAIN_OWN_SOURCES[domainKey] || []).includes(c.source))
    .map((f) => ({ ...f, ...scoreFlag(f) }))
    .sort((a, b) => b.priorityScore - a.priorityScore)
    .slice(0, 3);
  domainRankingCache[domainKey] = scored;
  return scored;
}

// ---- Meeting Mode wizard ----
// Navigation is free-form, not sequential — every step is a small pill you
// can click directly, not a Back/Next chain. A real meeting doesn't always
// go in the same order the sidebar lists domains in, and forcing Next-only
// progression just meant hunting for whatever button happened to advance a
// given step (they didn't all work the same way). Priorities is the one
// exception: it's a genuine 3-item walkthrough (score, then a Decision/
// Action capture per item) with its own internal "next priority" — jumping
// pills mid-walkthrough just resumes wherever brief.currentIndex left off,
// same as reopening any other in-progress step.
function goToMeetingStep(index) {
  const brief = loadMeeting();
  if (!brief) return;
  meetingStepIndex = Math.max(0, Math.min(index, MEETING_STEPS.length - 1));
  brief.currentStep = meetingStepIndex;
  meetingBriefDetail = {};
  meetingDetailReturnStep = null;
  frameworkSummaryOpen = false;
  saveMeeting(brief);
  renderMain();
}

// Small numbered badge on whichever of the Financial/Growth/Risk pills
// carry a top-3 item this period (see getCandidateRanking) — Owner isn't
// pillar-badged here since owner_wealth candidates are rare and the pill
// stays in its normal, unranked slot when nothing of Owner's ranks. Badge
// only, never reordered — see meeting-intelligence-build-spec.md §6 for why.
function meetingPillRankBadge(stepKey, ranking) {
  if (!ranking?.length) return '';
  const rank = ranking.findIndex((c) => PILLAR_TO_DOMAIN[c.pillar] === stepKey);
  return rank > -1 ? `<span class="mtg-pill-rank">${rank + 1}</span>` : '';
}

function renderMeetingNavBar(ranking) {
  const navBar = document.getElementById('meeting-nav-bar');
  navBar.style.display = 'flex';
  navBar.innerHTML = `
    <div class="mtg-pills">
      ${MEETING_STEPS.map((step, i) => `<button type="button" class="mtg-pill ${i === meetingStepIndex ? 'active' : ''}" data-step-index="${i}">${meetingPillRankBadge(step.key, ranking)}${step.label}</button>`).join('')}
    </div>
    <div class="mtg-nav-actions">
      <button id="mtg-finish-btn" class="mtg-nav-primary" type="button">Finish meeting</button>
    </div>
  `;
  navBar.querySelectorAll('.mtg-pill').forEach((pill) => {
    pill.onclick = () => goToMeetingStep(Number(pill.dataset.stepIndex));
  });
  document.getElementById('mtg-finish-btn').onclick = () => {
    if (!confirm('Mark this meeting as finished? You can reopen it afterward from the Meeting tab if you need to change anything.')) return;
    const brief = loadMeeting();
    if (!brief) return;
    brief.completed = true;
    saveMeeting(brief);
    renderMain();
  };
}

// Entry point when currentWorkflow === 'meeting'. No brief yet (or the last
// one already finished) shows the landing/summary instead of a wizard step
// — the nav bar only ever shows once a meeting is actually in progress.
async function renderMeetingWizardStep(content) {
  if (!currentPeriodEnd) {
    document.getElementById('meeting-nav-bar').style.display = 'none';
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot and run analysis before starting a meeting.</p></div>`;
    return;
  }
  const brief = await loadMeetingWithFallback();
  if (!brief || brief.completed) {
    document.getElementById('meeting-nav-bar').style.display = 'none';
    return renderMeetingLanding(content, brief);
  }
  meetingStepIndex = brief.currentStep || 0;
  // Computed once (cached per client/period, see getCandidateRanking) and
  // passed to the nav bar for pill badges — same ranking Overview's preview
  // and the Priorities step itself read, so all three never disagree.
  const ranking = await getCandidateRanking();
  renderMeetingNavBar(ranking);
  const stepKey = MEETING_STEPS[meetingStepIndex].key;
  if (stepKey === 'open_questions') return renderMeetingQuestionsStep(content, 'open');
  if (stepKey === 'close_questions') return renderMeetingQuestionsStep(content, 'close');
  if (stepKey === 'overview') return renderOverviewTab(content);
  if (stepKey === 'goals') return renderMeetingDomainStep(content, 'goals', renderGoalsInput, renderGoalsBrief);
  if (stepKey === 'financial') return renderMeetingDomainStep(content, 'financial', renderFinancialAnalyse, renderFinancialBrief);
  if (stepKey === 'growth') return renderMeetingDomainStep(content, 'growth', renderGrowthAnalyse, renderGrowthBrief);
  if (stepKey === 'risk') return renderMeetingDomainStep(content, 'risk', renderRiskAnalyse, renderRiskBrief);
  if (stepKey === 'owner') return renderMeetingDomainStep(content, 'owner', renderOwnerAnalyse, renderOwnerBrief);
  if (stepKey === 'actions') return renderActionsView(content, brief.created_at);
  if (stepKey === 'goals_wrapup') return renderMeetingGoalsWrapup(content);
  if (stepKey === 'priorities') {
    if (!brief.priorities.length) return renderMeetingPrioritiesBuild(content, brief);
    return renderMeetingSession(content, brief);
  }
}

// Toggles a meeting domain step between its condensed brief (default) and
// the real, unsummarized Framework screen (fullDetailFn, called completely
// unmodified — same function the Framework tab itself uses). Swapping to
// full detail prepends a "← Back to meeting" link ahead of whatever
// fullDetailFn renders; meetingBriefDetail is reset on every pill click
// (goToMeetingStep) so this never persists past leaving the step.
async function renderMeetingDomainStep(content, stepKey, fullDetailFn, briefFn) {
  if (meetingBriefDetail[stepKey]) {
    content.innerHTML = `<button class="mini-link" id="mtg-back-to-brief-btn" type="button" style="margin-bottom:10px;">← Back to meeting</button><div id="mtg-detail-inner"></div>`;
    document.getElementById('mtg-back-to-brief-btn').onclick = () => {
      meetingBriefDetail[stepKey] = false;
      // If this detail view was reached from a DIFFERENT step (Priorities'
      // "Show detail" — see meetingDetailReturnStep's own comment), go back
      // there instead of just landing on this domain's own brief, which
      // isn't "back to where you were" at all.
      if (meetingDetailReturnStep != null) {
        const returnStep = meetingDetailReturnStep;
        meetingDetailReturnStep = null;
        goToMeetingStep(returnStep);
      } else {
        renderMain();
      }
    };
    return fullDetailFn(document.getElementById('mtg-detail-inner'));
  }
  return briefFn(content, () => { meetingBriefDetail[stepKey] = true; renderMain(); });
}

// Shared by every brief below — this domain's own top 3 (getDomainCandidate-
// Ranking), not a filtered-down slice of the business-wide top 3. That
// distinction matters: Risk might have a dozen active items and Growth
// none at all, so each domain earns its own top-3 pass over its own
// candidates instead of competing with every other domain for a shared
// pool of 3 slots.
// Each row can still be turned into something directly from the brief
// (+ Add to Actions / turn into goal) rather than only via the dedicated
// Priorities/Actions steps — same quick-action pattern the Goals brief and
// Outstanding Actions card already use, not the read-only list this used
// to be.
function briefWhatToDoHtml(domainRanking) {
  const items = domainRanking || [];
  if (!items.length) return '';
  return `
    <div class="card">
      <p class="muted">What to do</p>
      ${items.map((c) => `
        <div class="flag-row-wrap">
          <div class="flag-row"><span class="flag-dot rust"></span>${escAttr(c.message)}</div>
          ${c.talkingPoint ? `<p style="font-size:12.5px; margin:2px 0 8px 18px; padding:6px 10px; background:var(--sage-bg); border-radius:6px;">💬 ${escAttr(c.talkingPoint)}</p>` : ''}
          <div class="toggle-row" style="padding-left:18px; margin:0 0 6px;">
            ${addToActionsButtonHtml(c.message, meetingPriorityToActionPriority(c.severity), 'diagnose', c.talkingPoint || null)}
            <button type="button" class="mini-link" data-brief-todo-goal="1" data-todo-text="${escAttr(c.message)}">→ turn into goal</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// Wires both quick actions on a briefWhatToDoHtml card — the "+ Add to
// Actions" buttons via the same shared wireAddToActionsButtons every other
// entry point uses, and "turn into goal" via the same addTextAsGoal(text)
// (defaulting to the Business category) the KPI improvement tip's own
// "turn into goal" button already uses.
function wireBriefWhatToDoHtml(content) {
  wireAddToActionsButtons(content);
  content.querySelectorAll('[data-brief-todo-goal]').forEach((btn) => {
    const original = btn.textContent;
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'adding…';
      try {
        const { id, category } = await addTextAsGoal(btn.dataset.todoText);
        btn.textContent = '✓ added to Goals → Business';
        btn.insertAdjacentHTML('afterend', ` <button type="button" class="mini-link" data-undo-goal-id="${id}">undo</button>`);
        btn.nextElementSibling.onclick = async (e) => {
          const undoBtn = e.currentTarget;
          undoBtn.disabled = true;
          try {
            await tombstoneGoalItem(category, id);
            btn.textContent = original;
            btn.disabled = false;
            undoBtn.remove();
          } catch (err) {
            alert('Error: ' + err.message);
            undoBtn.disabled = false;
          }
        };
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.textContent = original;
      }
    };
  });
}

function briefDetailLinkHtml(id, label) {
  return `<button class="brief-detail-link" id="${id}" type="button">See full detail in <span>${label} →</span></button>`;
}

// Shared row renderer for the Financial brief's "Get better"/"Tax planning"
// cards — same title/impact/difficulty/timeframe shape a Growth opportunity
// has, just without takes/risk/decision (opportunities-only, see §5), and
// now actually shown in Meeting Mode at all rather than only on the
// standalone Diagnose screen (see normalizeGetBetterToFlagShape's comment).
function financialRecCardHtml(heading, items) {
  if (!items.length) return '';
  return `
    <div class="card">
      <p class="muted">${escAttr(heading)}</p>
      ${items.map((o) => {
        const text = o.impact ? `${o.title} — ${o.impact}` : o.title;
        const why = [o.difficulty, o.timeframe].filter(Boolean).join(', ') || null;
        return `
        <div class="flag-row-wrap">
          <div class="flag-row"><span class="flag-dot sage"></span><b>${escAttr(o.title)}</b> — ${escAttr(o.impact || '')} <span class="muted plain">(${[o.difficulty, o.timeframe].filter(Boolean).join(', ')})</span></div>
          <div class="toggle-row" style="padding-left:20px; margin:4px 0 6px;">
            ${addToActionsButtonHtml(text, null, 'diagnose', why)}
          </div>
        </div>
      `;
      }).join('')}
    </div>
  `;
}

async function renderFinancialBrief(content, openDetail) {
  const myToken = renderToken;
  scenarioRecalcs = [];
  scenarioUnitSyncs = [];
  if (!currentPeriodEnd) {
    content.innerHTML = `<div class="card placeholder"><p class="muted">No data yet</p><p class="muted plain" style="margin:0;">Add a financial snapshot from Financial Performance → Input first.</p></div>`;
    return;
  }
  const [kpiData, diagnosisData, domainRanking] = await Promise.all([
    callRead('get_kpi_report', currentClientId, currentPeriodEnd),
    callRead('get_diagnosis', currentClientId, currentPeriodEnd),
    getDomainCandidateRanking('financial'),
  ]);
  if (myToken !== renderToken) return;
  const snapshot = kpiData?.snapshot;
  const kpis = kpiData?.kpis || [];
  const findKpi = (key) => kpis.find((k) => k.key === key);
  const cashConv = findKpi('op_cash_conversion');
  const taxRate = findKpi('effective_tax_rate');
  // The one dimension cash/cash-conversion/tax-rate leaves out entirely —
  // whether the business is actually profitable, not just how cash and tax
  // are moving. GP margin over net margin: it's the "What changed" section's
  // own pick (line below) and the more actionable of the two — pricing/cost-
  // of-sales discipline is something a conversation can act on directly,
  // where net margin is further downstream of decisions made elsewhere.
  const gpMargin = findKpi('gp_margin');
  const soWhat = diagnosisData?.briefSummary?.financial
    || (diagnosisData?.diagnosis ? diagnosisData.diagnosis.split(/(?<=[.!?])\s/)[0] : null)
    || 'Run analysis on Financial Performance → Analyse to see a summary here.';
  // Every KPI that actually moved, ranked by size of the move — not a fixed
  // 3-key list. A hardcoded set (however well-chosen) reads as "these are
  // the only 3 things that could have changed," which is false the moment
  // something else moves more; ranking + an honest "+N more" (below) says
  // what's actually true instead. Same scaled-magnitude convention (percent
  // -> points) and "no change" threshold as kpiTrendLine's own display, so
  // ranking and what's shown never disagree.
  const scaledMagnitude = (k) => Math.abs(k.format === 'percent' ? (k.value - k.priorValue) * 100 : (k.value - k.priorValue));
  const changedKpis = kpis
    .filter((k) => k.confidence !== 'red' && k.priorValue != null && scaledMagnitude(k) >= 0.05)
    .sort((a, b) => scaledMagnitude(b) - scaledMagnitude(a));
  const CHANGE_ROWS_CAP = 3;
  const shownChanges = changedKpis.slice(0, CHANGE_ROWS_CAP);
  const moreChangedCount = changedKpis.length - shownChanges.length;
  const changeRows = shownChanges.map((k) =>
    `<div class="flag-row-wrap goal-row-jump" data-fin-change-key="${k.key}" title="Click to see this KPI card"><div class="flag-row"><span style="flex:1;">${escAttr(k.name)}</span><span>${kpiTrendLine(k)}</span></div></div>`
  ).join('');

  content.innerHTML = `
    <div class="meeting-side-cards">
      <div class="card">
        <p class="brief-sowhat">${soWhat}</p>
        <div class="brief-figures">
          <button type="button" class="cash-net-stat" data-fin-tile="gp_margin" title="Click to see this KPI card"><div class="v">${gpMargin?.value != null ? formatKpi(gpMargin.value, gpMargin.format) : '—'}</div><div class="l">GP margin</div></button>
          <button type="button" class="cash-net-stat" data-fin-tile="cash" title="Click to edit in Manual Entry"><div class="v">${snapshot?.cash != null ? formatMoney(snapshot.cash) : '—'}</div><div class="l">Cash on hand</div></button>
          <button type="button" class="cash-net-stat" data-fin-tile="cash_conversion" title="Click to see this KPI card"><div class="v">${cashConv?.value != null ? formatKpi(cashConv.value, cashConv.format) : '—'}</div><div class="l">Cash conversion</div></button>
          <button type="button" class="cash-net-stat" data-fin-tile="tax_rate" title="Click to see this KPI card"><div class="v">${taxRate?.value != null ? formatKpi(taxRate.value, taxRate.format) : '—'}</div><div class="l">Effective tax rate</div></button>
        </div>
      </div>
      ${shownChanges.length ? `
        <div class="card">
          <p class="muted">What changed${moreChangedCount ? ` — biggest ${shownChanges.length} of ${changedKpis.length}` : ''}</p>
          ${changeRows}
          ${moreChangedCount ? `<button type="button" class="mini-link" id="fin-more-changed-btn" style="margin-top:4px;">+${moreChangedCount} more changed — see full detail</button>` : ''}
        </div>
      ` : ''}
    </div>
    ${financialRecCardHtml('Get better — fixes for a current gap', diagnosisData?.getBetter || [])}
    ${financialRecCardHtml('Tax planning — worth reviewing with the client', diagnosisData?.taxPlanning || [])}
    ${briefWhatToDoHtml(domainRanking)}
    <div class="kpi-grid" style="margin-bottom:12px;">
      ${renderCashOutlookCard(snapshot, kpis)}
      ${renderTaxOutlookCard(snapshot, currentCtx, kpis)}
    </div>
    ${briefDetailLinkHtml('fin-brief-detail-btn', 'Financial Performance')}
  `;
  wireCashOutlookCard(snapshot, kpis);
  wireTaxOutlookCard(snapshot, kpis);
  wireBriefWhatToDoHtml(content);
  document.getElementById('fin-brief-detail-btn').onclick = openDetail;
  document.querySelector('[data-fin-tile="gp_margin"]').onclick = () => {
    pendingFinancialKpiScrollKey = 'gp_margin';
    jumpToMeetingStepDetail('financial');
  };
  document.querySelector('[data-fin-tile="cash"]').onclick = () => {
    // jumpToManualEntry only sets currentWorkflow ('input'), not domain — it
    // was always called from screens where currentDomain was already
    // 'financial'. From inside Meeting Mode, currentDomain is still
    // 'actions' (Meeting Mode's own routing doesn't use it), which would
    // otherwise land on the Actions input view instead of this field.
    currentDomain = 'financial';
    jumpToManualEntry('cash', currentPeriodEnd);
  };
  document.querySelector('[data-fin-tile="cash_conversion"]').onclick = () => {
    pendingFinancialKpiScrollKey = 'op_cash_conversion';
    jumpToMeetingStepDetail('financial');
  };
  document.querySelector('[data-fin-tile="tax_rate"]').onclick = () => {
    pendingFinancialKpiScrollKey = 'effective_tax_rate';
    jumpToMeetingStepDetail('financial');
  };
  content.querySelectorAll('[data-fin-change-key]').forEach((row) => {
    row.onclick = () => {
      pendingFinancialKpiScrollKey = row.dataset.finChangeKey;
      jumpToMeetingStepDetail('financial');
    };
  });
  document.getElementById('fin-more-changed-btn')?.addEventListener('click', () => jumpToMeetingStepDetail('financial'));
}

async function renderGrowthBrief(content, openDetail) {
